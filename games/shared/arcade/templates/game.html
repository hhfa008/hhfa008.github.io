<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ead9">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta name="author" content="Devin">
<link rel="canonical" href="https://hhfa008.github.io/games/{{SLUG}}/">
<link rel="alternate" hreflang="en" href="https://hhfa008.github.io/games/{{SLUG}}/">
<link rel="alternate" hreflang="zh-CN" href="https://hhfa008.github.io/games/{{SLUG}}/">
<link rel="alternate" hreflang="id" href="https://hhfa008.github.io/games/{{SLUG}}/">
<link rel="alternate" hreflang="x-default" href="https://hhfa008.github.io/games/{{SLUG}}/">
<link rel="icon" href="/games/assets/icons/{{SLUG}}.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Devin">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="https://hhfa008.github.io/games/{{SLUG}}/">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="zh_CN">
<meta property="og:locale:alternate" content="id_ID">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">

{{JSONLD}}

<link rel="stylesheet" href="/games/shared/arcade/arcade.css">
<style>
{{GAME_CSS}}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Devin</a>
    <nav class="langs" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="id">ID</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero" aria-labelledby="page-title">
    <p class="eyebrow" data-i="eyebrow"></p>
    <h1 id="page-title" data-i="title"></h1>
    <p class="lede" data-i="tagline"></p>
  </section>

  <section class="game" aria-label="{{SLUG}}">
    <div class="game-top">
      <div class="stats">
        <div class="stat"><span class="stat-label" data-i="score">Score</span><strong id="stat-score">0</strong></div>
        <div class="stat"><span class="stat-label" data-i="best">Best</span><strong id="stat-best">0</strong></div>
        <div class="stat"><span class="stat-label" data-i="extraLabel"></span><strong id="stat-extra">0</strong></div>
      </div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" role="group" data-aria="boardAria"></div>
      <div id="overlay" class="overlay" hidden>
        <strong id="overlay-title"></strong>
        <p id="overlay-text"></p>
        <div class="actions"><button type="button" id="btn-overlay" class="primary" data-i="playAgain"></button></div>
      </div>
    </div>

    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>

    <div class="actions">
      <button type="button" id="btn-new" class="primary" data-i="newGame"></button>
      <button type="button" id="btn-hint" data-i="hint"></button>
    </div>

    <p class="note" data-i="note"></p>
  </section>

  <p class="more">
    <a href="rules.html" data-i="rules"></a>
    &nbsp;·&nbsp;
    <a href="/games/" data-i="hall"></a>
  </p>
</main>

<footer class="site-footer">
<div class="share-row">
  <button type="button" class="share-btn" data-share-btn aria-label="Share this page">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.4 10.7 15.6 6.3"/><path d="M8.4 13.3 15.6 17.7"/></svg>
    <span data-share-label>Share</span>
  </button>
</div>
  <a href="https://hhfa008.github.io/" data-i="moreLink"></a>
</footer>

<script src="/games/shared/store.js"></script>
<script src="/games/shared/arcade/arcade.js"></script>
<script src="/games/shared/arcade/kits/{{KIT}}.js"></script>
<script>
{{CORE_INIT}}
{{GAME_UI}}
</script>
<script src="/games/shared/share.js" data-name-zh="{{ZH_NAME}}" data-name-en="{{EN_NAME}}" data-name-id="{{ID_NAME}}"></script>
</body>
</html>
