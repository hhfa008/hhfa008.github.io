<title>AVALON 阿瓦隆 · 五人圆桌 · 精品桌游</title>
<style>
  :root{
    --art-table:url("../../assets/art/premium/avalon/round-table-felt.webp");
    --art-parchment:url("../../assets/art/premium/avalon/parchment.webp");
    --art-stone:url("../../assets/art/premium/avalon/quest-stone.webp");
    --art-sword:url("../../assets/art/premium/avalon/sword.webp");
    --art-shield:url("../../assets/art/premium/avalon/shield.webp");
    --art-crown:url("../../assets/art/premium/avalon/crown.webp");
    --font-serif:"Songti SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --bg:#0b1220; --bg2:#111b2f; --table:#173a3b; --table2:#0b2324;
    --panel:rgba(20,31,50,.94); --panel-solid:#17233a; --line:rgba(126,150,196,.34);
    --ink:#eef3ff; --muted:#a6b3cf; --soft:#7f8fb5;
    --gold:#e9c36a; --gold2:#b98f34; --good:#68d6b0; --evil:#ea6d7a;
    --violet:#a99bff; --sky:#76c6ff; --parch:#f2e7d0; --parch-ink:#2b2418;
    --shadow:0 20px 48px rgba(0,0,0,.44); --radius:18px; --tap:52px;
  }
  :root[data-theme="light"]{
    --bg:#ece3d2; --bg2:#f7f0e2; --table:#cfd8c0; --table2:#b8c7a9;
    --panel:rgba(255,251,241,.95); --panel-solid:#fffbf1; --line:#cbbca1;
    --ink:#282216; --muted:#6c6250; --soft:#978a72;
    --gold:#946408; --gold2:#6f4a05; --good:#1a8667; --evil:#b93b4a;
    --violet:#5d4bb4; --sky:#2a6fa9; --parch:#fffaf0; --parch-ink:#282216;
    --shadow:0 18px 40px rgba(92,74,44,.22);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#ece3d2; --bg2:#f7f0e2; --table:#cfd8c0; --table2:#b8c7a9;
      --panel:rgba(255,251,241,.95); --panel-solid:#fffbf1; --line:#cbbca1;
      --ink:#282216; --muted:#6c6250; --soft:#978a72;
      --gold:#946408; --gold2:#6f4a05; --good:#1a8667; --evil:#b93b4a;
      --violet:#5d4bb4; --sky:#2a6fa9; --parch:#fffaf0; --parch-ink:#282216;
      --shadow:0 18px 40px rgba(92,74,44,.22);
    }
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0; color:var(--ink); -webkit-tap-highlight-color:transparent;
    font:16px/1.5 var(--font-sans);
    background:
      radial-gradient(1000px 620px at 50% -18%, var(--table), transparent 64%),
      radial-gradient(820px 520px at 8% 112%, var(--table2), transparent 60%),
      linear-gradient(168deg, var(--bg2), var(--bg) 60%);
    background-color:var(--bg);
    background-attachment:fixed;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.16;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,.08) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(25deg, rgba(0,0,0,.12) 0 1px, transparent 1px 9px);
    mix-blend-mode:soft-light;
  }
  a{color:var(--gold)}
  .wrap{position:relative; z-index:1; max-width:880px; margin:0 auto; padding:10px 12px 38px}
  .top{display:flex; align-items:center; gap:8px; padding:4px 0 11px}
  .brand{flex:1; min-width:0; text-align:center}
  .brand h1{margin:0; font-family:var(--font-serif); font-weight:700; font-size:19px; letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .brand p{margin:1px 0 0; font-size:12px; color:var(--muted); letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center; min-width:var(--tap); min-height:var(--tap);
    padding:0 12px; border-radius:14px; border:1px solid var(--line); background:var(--panel);
    color:var(--ink); font:inherit; font-size:14px; text-decoration:none; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.2); touch-action:manipulation; transition:transform .12s, background .2s;
  }
  .icon-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.2)}
  :focus-visible{outline:3px solid var(--sky); outline-offset:2px}

  .rolecard{
    position:relative; overflow:hidden; display:flex; gap:12px; align-items:center; padding:12px 14px;
    border-radius:18px; border:1px solid var(--line); background:linear-gradient(150deg, var(--panel-solid), var(--panel));
    box-shadow:var(--shadow); perspective:900px; margin-bottom:10px;
  }
  .rolecard::after{content:""; position:absolute; inset:6px; border-radius:13px; border:1px solid rgba(233,195,106,.22); pointer-events:none}
  .rolecard.flip .sigil{animation:roleFlip .7s cubic-bezier(.2,.9,.25,1.1) both}
  .sigil{
    width:60px; height:80px; flex:0 0 60px; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:
      repeating-linear-gradient(118deg, rgba(120,84,40,.05) 0 1px, transparent 1px 5px),
      linear-gradient(152deg, #fffaf0, var(--parch) 58%, #e8d9bc),
      var(--art-parchment) center/cover no-repeat;
    color:var(--parch-ink); border:1px solid #cdb98f;
    box-shadow:0 8px 16px rgba(0,0,0,.26), inset 0 0 0 4px rgba(255,255,255,.5), inset 0 0 0 5px rgba(120,84,40,.16);
    transform-style:preserve-3d;
  }
  .sigil .icon{font-size:26px; line-height:1; font-weight:900}
  .sigil .lbl{font-size:12px; letter-spacing:.6px; font-weight:800; color:#70521f}
  .sigil.evil .icon,.sigil.evil .lbl{color:#9c2d3c}
  .rolebody{flex:1; min-width:0}
  .rolebody .kicker{font-size:12px; letter-spacing:1.6px; color:var(--gold); font-weight:800; text-transform:uppercase}
  .rolebody h2{margin:1px 0 3px; font-size:20px; line-height:1.2; font-family:var(--font-serif); font-weight:700}
  .rolebody h2 #roleSide{
    font-family:var(--font-sans); font-size:12px; font-weight:800; margin-left:6px; padding:1px 8px; border-radius:999px; vertical-align:2px;
    background:rgba(104,214,176,.16); color:var(--good); border:1px solid rgba(104,214,176,.4);
  }
  .rolebody h2 #roleSide.evil{background:rgba(234,109,122,.16); color:var(--evil); border-color:rgba(234,109,122,.42)}
  .rolebody p{margin:0; font-size:12.5px; color:var(--muted); line-height:1.5}
  .knowledge{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px}
  .know{font-size:12px; line-height:18px; padding:0 8px; border-radius:999px; background:rgba(234,109,122,.14); color:var(--evil); border:1px solid rgba(234,109,122,.35)}
  .know.good{background:rgba(104,214,176,.12); color:var(--good); border-color:rgba(104,214,176,.3)}
  .know.magic{background:rgba(169,155,255,.14); color:var(--violet); border-color:rgba(169,155,255,.35)}
  .know.muted{background:rgba(255,255,255,.05); color:var(--muted); border-color:var(--line)}
  .dagger{position:absolute; right:13px; top:8px; font-size:22px; color:var(--evil); transform:rotate(-18deg); display:none}
  .dagger.show{display:block; animation:daggerStrike .7s cubic-bezier(.2,.9,.25,1.1) both}

  .questboard{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px; margin-bottom:6px}
  .quest{
    position:relative; overflow:hidden; border-radius:13px; border:1px solid var(--line); padding:6px 3px; min-height:78px;
    background:
      linear-gradient(155deg, rgba(255,255,255,.07), transparent 55%),
      var(--art-stone) center/cover no-repeat,
      linear-gradient(155deg, var(--panel), rgba(0,0,0,.18));
    text-align:center; transition:box-shadow .25s, border-color .25s;
  }
  .quest .qno{font-size:12px; letter-spacing:.4px; color:var(--muted); font-weight:800}
  .quest .qsize{font-size:12px; color:var(--soft); margin-top:1px}
  .quest .qstate{font-size:12px; font-weight:900; margin-top:3px; color:var(--soft); line-height:1.25}
  .quest .qfail{font-size:12px; color:var(--soft); margin-top:1px}
  .quest.good{border-color:rgba(104,214,176,.55); box-shadow:inset 0 0 24px rgba(104,214,176,.14)}
  .quest.good .qstate{color:var(--good)}
  .quest.evil{border-color:rgba(234,109,122,.55); box-shadow:inset 0 0 24px rgba(234,109,122,.14)}
  .quest.evil .qstate{color:var(--evil)}
  .quest.current{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 0 20px rgba(233,195,106,.18)}
  .quest.flip{animation:questFlip .5s cubic-bezier(.2,.9,.25,1.1) both}
  .rejectbar{display:flex; align-items:center; justify-content:center; gap:7px; margin:0 0 8px; font-size:12px; color:var(--muted)}
  .rejectbar .dots{display:inline-flex; gap:4px}
  .rejectbar i{width:8px; height:8px; border-radius:50%; background:var(--line); display:block}
  .rejectbar i.on{background:var(--evil); box-shadow:0 0 6px rgba(234,109,122,.6)}

  .arena{position:relative; width:100%; max-width:390px; margin:0 auto 10px; aspect-ratio:1/1}
  .table-round{
    position:absolute; inset:11%; border-radius:50%; border:2px solid rgba(233,195,106,.46);
    background:
      radial-gradient(circle at 40% 28%, rgba(255,255,255,.16), transparent 45%),
      linear-gradient(160deg, rgba(18,58,56,.9), rgba(8,30,31,.94)),
      var(--art-table) center/cover no-repeat;
    box-shadow:var(--shadow), inset 0 0 0 8px rgba(233,195,106,.06), inset 0 18px 40px rgba(0,0,0,.35);
  }
  .table-round::before{content:""; position:absolute; inset:9%; border-radius:50%; border:1px dashed rgba(233,195,106,.26); pointer-events:none}
  .table-round::after{content:""; position:absolute; left:50%; top:50%; width:46%; height:46%; transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle, rgba(233,195,106,.12), transparent 70%); pointer-events:none}
  .table-core{
    position:absolute; left:50%; top:50%; width:56%; min-height:42%; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-align:center; z-index:2;
    color:#f3f8f4; padding:6px;
  }
  .phase-badge{font-size:12px; letter-spacing:1.6px; text-transform:uppercase; color:var(--gold); font-weight:900; text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .table-text{font-size:12.5px; font-weight:700; line-height:1.35; color:#f3f8f4; text-shadow:0 1px 8px rgba(0,0,0,.65)}
  .table-sub{font-size:12px; color:rgba(240,248,242,.78); line-height:1.3; text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .seat-ring{position:absolute; inset:0; z-index:3}
  .seat{
    position:absolute; width:86px; min-height:58px; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    padding:5px 4px; border-radius:14px; border:1px solid var(--line);
    background:linear-gradient(155deg, var(--panel-solid), var(--panel));
    box-shadow:0 7px 16px rgba(0,0,0,.28); color:var(--ink); font:inherit; min-width:0; overflow:hidden;
    transition:border-color .2s, box-shadow .2s, transform .15s;
  }
  .seat.pos0{left:50%; top:89%}
  .seat.pos1{left:13%; top:69%}
  .seat.pos2{left:23%; top:19%}
  .seat.pos3{left:77%; top:19%}
  .seat.pos4{left:87%; top:69%}
  .seat.selectable{cursor:pointer; touch-action:manipulation}
  .seat.selectable:active{transform:translate(-50%,-50%) scale(.97)}
  .seat.leader{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset, 0 7px 18px rgba(233,195,106,.22)}
  .seat.onTeam{border-color:var(--good); box-shadow:0 0 0 1px var(--good) inset, 0 7px 18px rgba(104,214,176,.18)}
  .seat.picked{border-color:var(--gold); background:linear-gradient(155deg, rgba(233,195,106,.24), var(--panel))}
  .seat.me{background:linear-gradient(155deg, rgba(118,198,255,.16), var(--panel))}
  .seat.turn{animation:seatPulse 1.9s ease-in-out infinite}
  .seat .s-ava{
    width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:900; color:#16232a;
    background:radial-gradient(circle at 34% 28%, #fff9, transparent 40%), linear-gradient(150deg, var(--gold), var(--gold2));
  }
  .seat[data-tone="percival"] .s-ava{background:radial-gradient(circle at 34% 28%, #fff9, transparent 40%), linear-gradient(150deg, var(--violet), #5b49a4)}
  .seat[data-tone="loyal"] .s-ava{background:radial-gradient(circle at 34% 28%, #fff9, transparent 40%), linear-gradient(150deg, var(--good), #2c8f6c)}
  .seat[data-tone="assassin"] .s-ava{background:radial-gradient(circle at 34% 28%, #fff9, transparent 40%), linear-gradient(150deg, var(--evil), #9d2c3a)}
  .seat[data-tone="morgana"] .s-ava{background:radial-gradient(circle at 34% 28%, #fff9, transparent 40%), linear-gradient(150deg, #d98adf, #8c3f9b)}
  .seat .s-name{font-size:12px; font-weight:800; line-height:1.15; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .seat .s-meta{font-size:12px; line-height:1.15; color:var(--muted); max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .seat .s-meta.evil{color:var(--evil); font-weight:800}
  .seat .s-meta.magic{color:var(--violet); font-weight:800}
  .seat .s-meta.good{color:var(--good); font-weight:800}
  .seat .s-badge{
    position:absolute; top:3px; right:5px; font-size:12px; line-height:1; color:var(--gold); font-weight:900;
  }
  .seat.voted::after{
    content:""; position:absolute; right:5px; bottom:5px; width:6px; height:6px; border-radius:50%;
    background:var(--sky); box-shadow:0 0 6px rgba(118,198,255,.7);
  }

  .panel{border:1px solid var(--line); border-radius:16px; padding:11px 12px; background:var(--panel); box-shadow:0 8px 22px rgba(0,0,0,.14); margin-bottom:10px}
  .panel h3{margin:0 0 5px; font-size:12px; letter-spacing:1.4px; color:var(--muted); font-weight:800; text-transform:uppercase}
  .panel p{margin:0; font-size:13px; color:var(--muted); line-height:1.55}
  .panel p b{color:var(--ink)}
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:9px}
  .actions .wide{grid-column:1/-1}
  button.act{
    min-height:54px; border-radius:13px; border:1px solid transparent; font:inherit; font-weight:900; font-size:14px;
    cursor:pointer; touch-action:manipulation; display:flex; align-items:center; justify-content:center; gap:6px; padding:7px 9px;
    transition:transform .12s, filter .2s, opacity .2s; color:var(--ink);
  }
  button.act:active{transform:translateY(2px)}
  button.act:disabled{opacity:.4; cursor:default; filter:grayscale(.35)}
  button.good{background:linear-gradient(160deg, var(--good), #2f9c76); color:#052019; box-shadow:0 5px 0 #1c7056}
  button.evil{background:linear-gradient(160deg, var(--evil), #b23c4a); color:#2b080d; box-shadow:0 5px 0 #7e2430}
  button.gold{background:linear-gradient(160deg, var(--gold), var(--gold2)); color:#2b1f05; box-shadow:0 5px 0 #806014}
  button.ghost{background:var(--panel-solid); border-color:var(--line); color:var(--ink); box-shadow:0 5px 0 rgba(0,0,0,.2)}
  .voteResult,.missionResult{margin-top:9px; padding:9px 11px; border-radius:11px; border:1px solid var(--line); background:rgba(0,0,0,.1); font-size:12.5px; color:var(--muted); display:none}
  .voteResult.show,.missionResult.show{display:block; animation:riseIn .3s ease both}
  .voteResult.pass,.missionResult.good{border-color:rgba(104,214,176,.45); color:var(--good)}
  .voteResult.fail,.missionResult.evil{border-color:rgba(234,109,122,.45); color:var(--evil)}
  .voteResult b,.missionResult b{color:var(--ink)}

  .history,.log{margin-top:10px; border:1px solid var(--line); border-radius:14px; background:var(--panel); padding:9px 11px}
  .history h3,.log h3{margin:0 0 5px; font-size:12px; letter-spacing:1.5px; color:var(--muted); font-weight:800; text-transform:uppercase}
  .history ul,.log ul{list-style:none; margin:0; padding:0; display:grid; gap:2px; max-height:132px; overflow:auto}
  .history li{font-size:12px; color:var(--muted); border-bottom:1px dashed rgba(128,150,160,.2); padding:3px 0; display:flex; gap:6px; align-items:baseline}
  .history li .tag{flex:0 0 auto; font-size:12px; font-weight:800; color:var(--sky)}
  .history li .tag.good{color:var(--good)}
  .history li .tag.evil{color:var(--evil)}
  .log li{font-size:12px; color:var(--muted); line-height:1.45}
  .log li::before{content:"›"; color:var(--gold); margin-right:5px; font-weight:900}

  .finale{
    position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; padding:16px;
    background:radial-gradient(circle at 50% 34%, rgba(12,22,42,.78), rgba(4,7,14,.95)); backdrop-filter:blur(4px);
  }
  .finale.show{display:flex; animation:fadeIn .3s ease both}
  .finale-card{
    width:100%; max-width:380px; max-height:92vh; overflow:auto; border-radius:22px; padding:19px 17px; text-align:center;
    background:linear-gradient(165deg, var(--panel-solid), var(--panel)); border:1px solid var(--line); box-shadow:var(--shadow);
    animation:riseIn .46s cubic-bezier(.2,.9,.2,1.1) both;
  }
  .finale-card .crest{font-size:34px; line-height:1; color:var(--gold)}
  .finale-card h2{margin:6px 0 2px; font-size:23px; font-family:var(--font-serif); font-weight:700}
  .finale-card p{margin:2px 0 12px; color:var(--muted); font-size:13px; line-height:1.5}
  .finale-table{display:grid; gap:5px; margin:0 0 14px}
  .finale-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 10px; border-radius:9px; background:rgba(0,0,0,.12); font-size:12.5px}
  .finale-row.good{border:1px solid rgba(104,214,176,.4); background:rgba(104,214,176,.1)}
  .finale-row.evil{border:1px solid rgba(234,109,122,.4); background:rgba(234,109,122,.1)}
  .finale-row .role{font-weight:900; color:var(--gold)}
  .confetti{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  .confetti i{position:absolute; top:-12px; width:6px; height:10px; border-radius:2px; opacity:.9; animation:fall 2.6s linear infinite}
  .confetti i:nth-child(1){left:8%;background:var(--gold);animation-delay:.1s}
  .confetti i:nth-child(2){left:22%;background:var(--good);animation-delay:.65s}
  .confetti i:nth-child(3){left:36%;background:var(--violet);animation-delay:.3s}
  .confetti i:nth-child(4){left:50%;background:var(--evil);animation-delay:1.05s}
  .confetti i:nth-child(5){left:64%;background:var(--gold);animation-delay:.5s}
  .confetti i:nth-child(6){left:78%;background:var(--sky);animation-delay:1.25s}
  .confetti i:nth-child(7){left:90%;background:var(--good);animation-delay:.2s}

  .foot{text-align:center; margin-top:16px; font-size:12px; color:var(--muted)}
  .foot a{display:inline-flex; align-items:center; justify-content:center; min-height:44px; min-width:44px; margin:0 5px; padding:0 10px; text-decoration:none; color:var(--muted)}
  .foot a:hover{color:var(--gold)}

  @keyframes roleFlip{0%{transform:rotateY(90deg) scale(.9);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
  @keyframes questFlip{0%{transform:rotateX(70deg) scale(.94);opacity:.2}100%{transform:none;opacity:1}}
  @keyframes seatPulse{0%,100%{box-shadow:0 7px 16px rgba(0,0,0,.28), 0 0 0 2px rgba(233,195,106,.18)}50%{box-shadow:0 7px 16px rgba(0,0,0,.28), 0 0 0 3px rgba(233,195,106,.5)}}
  @keyframes riseIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(620px) rotate(520deg)}}
  @keyframes daggerStrike{0%{transform:translateY(-22px) rotate(-60deg);opacity:0}60%{transform:translateY(2px) rotate(-8deg);opacity:1}100%{transform:rotate(-18deg);opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
  @media (min-width:620px){
    .rolecard{padding:14px 18px}
    .arena{max-width:430px}
    .seat{width:94px; min-height:62px}
    .actions{grid-template-columns:repeat(4,1fr)}
    .actions .wide{grid-column:1/-1}
  }
  @media (max-width:430px){
    .wrap{padding:8px 8px 30px}
    .brand h1{font-size:17px}
    .brand p{font-size:12px}
    .rolecard{padding:10px 11px; gap:9px}
    .sigil{width:54px; height:72px; flex-basis:54px}
    .rolebody h2{font-size:18px}
    .rolebody p{font-size:12px}
    .quest{min-height:72px; padding:5px 2px}
    .quest .qno,.quest .qsize,.quest .qstate,.quest .qfail{font-size:12px}
    .seat{width:80px; min-height:56px}
    .seat.pos1{left:14%}
    .seat.pos4{left:86%}
    .actions{gap:7px}
    .panel{padding:10px 10px}
  }
  @media (max-width:340px){
    .seat{width:76px; min-height:54px}
    .seat .s-name,.seat .s-meta{font-size:12px}
    .quest .qfail{display:none}
  }

body{padding-bottom:env(safe-area-inset-bottom)}
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/avalon-premium/">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="icon-btn" href="../index.html" aria-label="返回桌游目录">← 目录</a>
    <div class="brand">
      <h1>Avalon 阿瓦隆</h1>
      <p>五人圆桌 · 三次任务 · 一次暗杀</p>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深色或浅色主题">◐</button>
    <button class="icon-btn" id="muteBtn" type="button" aria-label="静音或开启音效" aria-pressed="false">♪</button>
  </header>

  <main>
    <section class="rolecard flip" id="roleCard" aria-label="你的身份">
      <div class="sigil" id="sigil"><span class="icon" id="roleIcon">✦</span><span class="lbl" id="roleLbl">梅林</span></div>
      <div class="rolebody">
        <div class="kicker">仅你可见 · YOUR ROLE</div>
        <h2><span id="roleName">梅林</span><span id="roleSide">正义</span></h2>
        <p id="roleAbility"></p>
        <div class="knowledge" id="knowledge"></div>
      </div>
      <span class="dagger" id="dagger" aria-hidden="true">†</span>
    </section>

    <section class="questboard" id="questTrack" aria-label="五个任务进度"></section>
    <div class="rejectbar" aria-label="连续否决计数">
      <span>连续否决</span>
      <span class="dots" id="rejectDots"></span>
      <span id="rejectText">0 / 5</span>
    </div>

    <section class="arena" aria-label="五人圆桌">
      <div class="table-round" id="tableRound"></div>
      <div class="table-core">
        <div class="phase-badge" id="phaseBadge" aria-live="polite">队长提名</div>
        <div class="table-text" id="tableText">等待开局</div>
        <div class="table-sub" id="tableSub"></div>
      </div>
      <div class="seat-ring" id="seats"></div>
    </section>

    <section class="panel" aria-label="行动区">
      <h3 id="actionTitle">行动</h3>
      <p id="actionText" aria-live="polite"></p>
      <div class="actions" id="actions"></div>
      <div class="voteResult" id="voteResult"></div>
      <div class="missionResult" id="missionResult"></div>
    </section>

    <section class="history" aria-label="投票与任务记录">
      <h3>投票与任务记录</h3>
      <ul id="historyList"></ul>
    </section>

    <section class="log" aria-label="对局日志">
      <h3>对局日志</h3>
      <ul id="logList"></ul>
    </section>
  </main>

  <footer class="foot">
    <a href="rules.html">完整规则</a>
    <a href="online.html">联机对战</a>
    <a href="../index.html">更多桌游</a>
  </footer>
</div>

<div class="finale" id="finale" role="dialog" aria-modal="true" aria-labelledby="finaleTitle">
  <div class="confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="finale-card">
    <div class="crest" aria-hidden="true">♛</div>
    <h2 id="finaleTitle">结算</h2>
    <p id="finaleSub"></p>
    <div class="finale-table" id="finaleTable"></div>
    <button class="act gold" id="againBtn" type="button" style="width:100%">再来一局</button>
  </div>
</div>

<script src="../../shared/shuffle.js"></script>
<script src="../../shared/sfx.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.AvalonPremiumEngine;
  var D = window.AvalonPremiumData;
  var game = null;
  var selectedTeam = [];
  var busy = false;
  var lastEvent = null;
  var roleJustStarted = true;
  var fast = /(?:\?|&)fast=1/.test(location.search);

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---- Theme -------------------------------------------------------------
  var theme = safeGet('avp-theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
  function lightMode() {
    var attr = document.documentElement.getAttribute('data-theme');
    if (attr === 'light') return true;
    if (attr === 'dark') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  }
  function updateThemeLabel() {
    $('themeBtn').setAttribute('aria-label', lightMode() ? '切换到深色主题' : '切换到浅色主题');
  }
  updateThemeLabel();

  // ---- Shared synthesizer (no per-game audio code) -----------------------
  var Sfx = window.Sfx;
  var muted = safeGet('avp-muted') === '1';
  if (Sfx && muted) Sfx.mute(true);
  $('muteBtn').setAttribute('aria-pressed', muted ? 'true' : 'false');
  $('muteBtn').textContent = muted ? '×' : '♪';
  function sfx(name) {
    if (muted || !Sfx) return;
    try { Sfx.play(name); } catch (e) {}
  }
  $('muteBtn').addEventListener('click', function () {
    muted = !muted;
    safeSet('avp-muted', muted ? '1' : '0');
    if (Sfx) Sfx.mute(muted);
    $('muteBtn').setAttribute('aria-pressed', muted ? 'true' : 'false');
    $('muteBtn').textContent = muted ? '×' : '♪';
    if (!muted) sfx('click');
  });
  $('themeBtn').addEventListener('click', function () {
    var next = lightMode() ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    safeSet('avp-theme', next);
    updateThemeLabel();
    sfx('deal');
  });

  // ---- Game --------------------------------------------------------------
  function start() {
    game = E.createGame({ seed: (Date.now() % 1000000) + 43, names: D.aiNames });
    selectedTeam = [];
    busy = false;
    lastEvent = null;
    roleJustStarted = true;
    $('finale').classList.remove('show');
    $('voteResult').className = 'voteResult';
    $('missionResult').className = 'missionResult';
    $('dagger').classList.remove('show');
    render();
    pump();
  }

  function knowledgeFor(view, i) {
    var k = view.roleKnowledge[i].role;
    if (i === view.yourSeat) return { text: '你自己', cls: 'good' };
    if (k === 'evil') return { text: view.players[i].name + ' · 邪恶', cls: '' };
    if (k === 'magic') return { text: view.players[i].name + ' · 魔法师', cls: 'magic' };
    if (k === 'evil-ally') return { text: view.players[i].name + ' · 同伙', cls: '' };
    return null;
  }

  function render() {
    if (!game) return;
    var view = E.publicView(game, 0);
    if (view.phase !== 'propose' || view.leader !== 0) selectedTeam = [];
    renderRole(view);
    renderQuests(view);
    renderRejections(view);
    renderSeats(view);
    renderTable(view);
    renderActions(view);
    showVoteResult(view);
    showMissionResult(view);
    renderHistory(view);
    var log = $('logList');
    log.innerHTML = '';
    view.log.slice(-10).forEach(function (line) { log.appendChild(el('li', null, line)); });
    if (view.phase === 'over') renderFinale(view);
  }

  function renderRole(view) {
    var meta = D.roles[view.yourRole];
    var card = $('roleCard');
    var sigil = $('sigil');
    sigil.className = 'sigil' + (meta.side === 'evil' ? ' evil' : '');
    if (roleJustStarted) {
      card.classList.remove('flip');
      void card.offsetWidth;
      card.classList.add('flip');
      roleJustStarted = false;
    }
    $('roleIcon').textContent = meta.icon;
    $('roleLbl').textContent = meta.name;
    $('roleName').textContent = meta.name;
    var side = $('roleSide');
    side.textContent = meta.side === 'evil' ? '邪恶' : '正义';
    side.className = meta.side === 'evil' ? 'evil' : '';
    $('roleAbility').textContent = meta.ability;
    var kbox = $('knowledge');
    kbox.innerHTML = '';
    var any = false;
    view.players.forEach(function (p, i) {
      var k = knowledgeFor(view, i);
      if (!k) return;
      any = true;
      kbox.appendChild(el('span', 'know ' + k.cls, k.text));
    });
    if (!any) kbox.appendChild(el('span', 'know muted', '无特殊情报'));
    if (view.yourRole === 'merlin') kbox.appendChild(el('span', 'know muted', '隐藏身份，避免被刺客锁定'));
    else if (view.yourRole === 'percival') kbox.appendChild(el('span', 'know muted', '两个魔法师中只有一位是梅林'));
    else if (meta.side === 'evil') kbox.appendChild(el('span', 'know muted', '关键任务可破坏一次'));
    else kbox.appendChild(el('span', 'know muted', '用投票与任务结果推理'));
  }

  function renderQuests(view) {
    var box = $('questTrack');
    box.innerHTML = '';
    view.questSizes.forEach(function (size, i) {
      var res = view.quests[i] && view.quests[i].result;
      var current = view.phase !== 'over' && view.phase !== 'assassin' && i === view.questIndex;
      var q = el('div', 'quest' + (res ? (res === 'success' ? ' good' : ' evil') : '') + (current ? ' current' : ''));
      q.setAttribute('title', '第 ' + (i + 1) + ' 次任务，需 ' + size + ' 人，5 人局 ' + view.failsRequired + ' 张失败即失败');
      q.appendChild(el('div', 'qno', '任务 ' + (i + 1)));
      q.appendChild(el('div', 'qsize', '需 ' + size + ' 人'));
      q.appendChild(el('div', 'qstate', res ? (res === 'success' ? '成功 ✓' : '失败 ✕') : (current ? '进行中' : '待执行')));
      if (res) q.appendChild(el('div', 'qfail', '破坏 ' + view.quests[i].failCount));
      box.appendChild(q);
    });
  }

  function renderRejections(view) {
    var dots = $('rejectDots');
    dots.innerHTML = '';
    for (var i = 0; i < view.maxRejects; i++) dots.appendChild(el('i', i < view.rejects ? 'on' : ''));
    $('rejectText').textContent = view.rejects + ' / ' + view.maxRejects;
  }

  function seatRoleLabel(view, i) {
    if (view.phase === 'over' && view.players[i].revealedRole) {
      return { text: D.roles[view.players[i].revealedRole].name, cls: view.players[i].revealedSide === 'evil' ? 'evil' : 'good' };
    }
    var k = view.roleKnowledge[i].role;
    if (k === 'evil') return { text: '邪恶', cls: 'evil' };
    if (k === 'magic') return { text: '魔法师', cls: 'magic' };
    if (k === 'evil-ally') return { text: '同伙', cls: 'evil' };
    if (k === 'you') return { text: '你', cls: 'good' };
    return { text: '身份未知', cls: '' };
  }

  function renderSeats(view) {
    var box = $('seats');
    box.innerHTML = '';
    var canSelect = view.phase === 'propose' && view.leader === 0;
    view.players.forEach(function (p, i) {
      var selected = selectedTeam.indexOf(i) >= 0;
      var label = seatRoleLabel(view, i);
      var isTurn = view.phase !== 'over' && (
        (view.phase === 'propose' && view.leader === i) ||
        (view.phase === 'vote' && !p.voted) ||
        (view.phase === 'mission' && p.onTeam && !p.missionVoted) ||
        (view.phase === 'assassin' && view.yourRole === 'assassin' && i !== view.yourSeat)
      );
      var tag = canSelect ? 'button' : 'div';
      var seat = el(tag, 'seat pos' + i +
        (view.leader === i && view.phase !== 'over' ? ' leader' : '') +
        (p.onTeam ? ' onTeam' : '') +
        (i === view.yourSeat ? ' me' : '') +
        (canSelect ? ' selectable' : '') +
        (selected ? ' picked' : '') +
        (isTurn ? ' turn' : '') +
        (p.voted && view.phase === 'vote' ? ' voted' : ''));
      seat.setAttribute('data-tone', D.seats[i].tone);
      seat.setAttribute('aria-label', p.name + '，' + label.text + (view.leader === i ? '，队长' : '') + (p.onTeam ? '，任务队伍' : '') + (canSelect ? '，点击选择' : ''));
      if (canSelect) {
        seat.type = 'button';
        seat.setAttribute('aria-pressed', selected ? 'true' : 'false');
        seat.addEventListener('click', function () { toggleMember(i); });
      }
      if (view.leader === i && view.phase !== 'over') seat.appendChild(el('span', 's-badge', '♛'));
      seat.appendChild(el('span', 's-ava', D.seats[i].avatar));
      seat.appendChild(el('span', 's-name', p.name + (i === view.yourSeat ? ' · 你' : '')));
      seat.appendChild(el('span', 's-meta ' + label.cls, label.text));
      if (selected) seat.appendChild(el('span', 's-badge', '✓'));
      box.appendChild(seat);
    });
  }

  function renderTable(view) {
    var phaseNames = {
      propose: '队长提名', vote: '全体投票', mission: '秘密任务',
      assassin: '刺客暗杀', over: '对局结束'
    };
    $('phaseBadge').textContent = phaseNames[view.phase] || view.phase;
    var text = '';
    var sub = '';
    if (view.phase === 'over') {
      text = view.winReason;
      sub = '五个任务 · 三次获胜 · 一次暗杀';
    } else if (view.phase === 'assassin') {
      text = '正义方完成三次任务';
      sub = view.yourRole === 'assassin' ? '选择暗杀目标' : '刺客正在选择目标…';
    } else {
      var leaderName = view.players[view.leader].name;
      if (view.phase === 'propose') {
        text = leaderName + ' 提名 ' + view.teamSize + ' 人';
        sub = '连续否决 ' + view.rejects + ' / ' + view.maxRejects;
      } else if (view.phase === 'vote') {
        text = '投票决定队伍';
        sub = '已投 ' + view.votedCount + ' / ' + view.players.length + ' 票';
      } else {
        text = '任务队伍秘密表决';
        sub = '已提交 ' + view.missionVotedCount + ' / ' + view.team.length + ' 张';
      }
    }
    $('tableText').textContent = text;
    $('tableSub').textContent = sub;
  }

  function addButton(box, cls, label, id, fn, wide) {
    var b = el('button', 'act ' + cls + (wide ? ' wide' : ''), label);
    b.type = 'button';
    if (id) b.id = id;
    b.addEventListener('click', fn);
    box.appendChild(b);
    return b;
  }

  function renderActions(view) {
    var box = $('actions');
    box.innerHTML = '';
    var title = $('actionTitle');
    var text = $('actionText');
    $('voteResult').className = 'voteResult';
    $('missionResult').className = 'missionResult';
    var me = view.players[view.yourSeat];

    if (view.phase === 'over') {
      title.textContent = '对局结束';
      text.textContent = view.winReason;
      addButton(box, 'gold', '再来一局', 'againInlineBtn', start, true);
      return;
    }

    if (view.phase === 'propose') {
      var size = view.teamSize;
      if (view.leader === view.yourSeat) {
        title.textContent = '你是队长';
        text.innerHTML = '请选择 <b>' + size + '</b> 名玩家组成任务队伍（已选 ' + selectedTeam.length + ' 人）。';
        var btn = el('button', 'act gold wide', '确认队伍（' + selectedTeam.length + '/' + size + '）');
        btn.id = 'confirmTeamBtn';
        btn.type = 'button';
        btn.disabled = selectedTeam.length !== size;
        btn.addEventListener('click', confirmTeam);
        box.appendChild(btn);
      } else {
        title.textContent = '队长提名';
        text.innerHTML = '等待 <b>' + view.players[view.leader].name + '</b> 提名 ' + size + ' 人队伍…';
      }
      return;
    }

    if (view.phase === 'vote') {
      title.textContent = '队伍投票';
      text.innerHTML = '队伍：<b>' + teamNames(view, view.team) + '</b>。5 人局需要至少 <b>3</b> 票赞成（平票视为否决）。';
      if (me.voted) {
        text.innerHTML += ' 你已投票，等待其他人…';
      } else {
        var yes = el('button', 'act good', '赞成 ✓');
        yes.id = 'approveBtn';
        yes.type = 'button';
        yes.addEventListener('click', function () { castHumanVote(true); });
        var no = el('button', 'act evil', '反对 ✕');
        no.id = 'rejectBtn';
        no.type = 'button';
        no.addEventListener('click', function () { castHumanVote(false); });
        box.appendChild(yes);
        box.appendChild(no);
      }
      return;
    }

    if (view.phase === 'mission') {
      title.textContent = '秘密任务';
      text.innerHTML = '任务队伍：<b>' + teamNames(view, view.team) + '</b>。任务卡内容在结算前不会公开。';
      if (view.team.indexOf(view.yourSeat) >= 0 && !me.missionVoted) {
        var ok = el('button', 'act good' + (view.yourSide === 'evil' ? '' : ' wide'), '任务成功 ✓');
        ok.id = 'missionSuccessBtn';
        ok.type = 'button';
        ok.addEventListener('click', function () { castHumanMission(false); });
        box.appendChild(ok);
        if (view.yourSide === 'evil') {
          var bad = el('button', 'act evil', '破坏任务 ✕');
          bad.id = 'missionFailBtn';
          bad.type = 'button';
          bad.addEventListener('click', function () { castHumanMission(true); });
          box.appendChild(bad);
        }
      } else if (view.team.indexOf(view.yourSeat) >= 0) {
        text.innerHTML += ' 你已提交任务卡，等待结算…';
      } else {
        text.innerHTML += ' 你不在队伍中，等待任务结算…';
      }
      return;
    }

    if (view.phase === 'assassin') {
      title.textContent = '刺客的最后一刀';
      if (view.yourRole === 'assassin') {
        text.innerHTML = '正义方已赢下三次任务。请选择一名玩家暗杀；若命中 <b>梅林</b>，邪恶方立刻获胜。';
        var grid = el('div', 'actions wide');
        grid.style.marginTop = '0';
        view.players.forEach(function (p, i) {
          if (i === view.yourSeat) return;
          var b = el('button', 'act ghost targetBtn', '暗杀 ' + p.name);
          b.id = 'target-' + i;
          b.type = 'button';
          if (view.roleKnowledge[i].role === 'evil-ally') b.textContent += '（同伙）';
          b.addEventListener('click', function () { chooseAssassin(i); });
          grid.appendChild(b);
        });
        box.appendChild(grid);
      } else {
        text.innerHTML = '刺客正在选择目标…';
        $('dagger').classList.add('show');
      }
      return;
    }
  }

  function teamNames(view, team) {
    return team.map(function (i) { return view.players[i].name; }).join('、');
  }

  function showVoteResult(view) {
    if (!view.lastVote || view.phase === 'vote') return;
    var box = $('voteResult');
    var votes = view.lastVote.votes || [];
    var yes = votes.filter(function (v) { return v === true; }).length;
    var no = votes.length - yes;
    box.className = 'voteResult show ' + (view.lastVote.approved ? 'pass' : 'fail');
    box.innerHTML = '上次投票：<b>' + yes + ' 赞成 / ' + no + ' 反对</b> · ' +
      (view.lastVote.approved ? '队伍通过' : '队伍被否决');
  }

  function showMissionResult(view) {
    if (view.phase === 'vote') return;
    var lastMission = null;
    view.history.forEach(function (h) { if (h.failCount != null) lastMission = h; });
    if (!lastMission) return;
    var box = $('missionResult');
    box.className = 'missionResult show ' + (lastMission.result === 'success' ? 'good' : 'evil');
    box.innerHTML = '最近任务：<b>第 ' + (lastMission.quest + 1) + ' 次</b> · ' +
      (lastMission.result === 'success' ? '成功' : '失败') +
      ' · 破坏票 ' + lastMission.failCount + ' 张';
  }

  function renderHistory(view) {
    var box = $('historyList');
    box.innerHTML = '';
    if (!view.history.length) {
      box.appendChild(el('li', null, '尚无投票记录。第一次组队投票会出现在这里。'));
      return;
    }
    view.history.forEach(function (h) {
      var li = el('li');
      var tag = el('span', 'tag ' + (h.result == null ? '' : (h.result === 'success' ? 'good' : 'evil')),
        '任务 ' + (h.quest + 1));
      li.appendChild(tag);
      var txt = '队伍 ' + teamNames(view, h.team) + ' · ' +
        (h.approved == null ? '投票中' : (h.approved ? '通过' : '否决'));
      if (h.votes) {
        var yes = h.votes.filter(function (v) { return v === true; }).length;
        txt += '（' + yes + '/' + h.votes.length + ' 赞成）';
      }
      if (h.failCount != null) txt += ' · 任务' + (h.result === 'success' ? '成功' : '失败') + '，破坏 ' + h.failCount + ' 张';
      li.appendChild(el('span', null, txt));
      box.appendChild(li);
    });
  }

  function renderFinale(view) {
    var box = $('finale');
    if (box.classList.contains('show')) return;
    var mine = view.yourSide === view.winner;
    var title = mine ? '你所在的阵营获胜！' : '你所在的阵营落败';
    if (view.winner === 'good') title += ' · 正义方胜利';
    else title += ' · 邪恶方胜利';
    $('finaleTitle').textContent = title;
    var sub = view.winReason;
    if (view.assassinTarget != null) sub += ' · 暗杀目标：' + view.players[view.assassinTarget].name;
    $('finaleSub').textContent = sub;
    var table = $('finaleTable');
    table.innerHTML = '';
    view.players.forEach(function (p, i) {
      var role = D.roles[p.revealedRole];
      var row = el('div', 'finale-row ' + (p.revealedSide === 'evil' ? 'evil' : 'good'));
      row.appendChild(el('span', null, p.name + (i === view.yourSeat ? '（你）' : '')));
      row.appendChild(el('span', 'role', role.name));
      table.appendChild(row);
    });
    box.classList.add('show');
    sfx(mine ? 'win' : 'lose');
  }

  // ---- Human actions -----------------------------------------------------
  function confirmTeam() {
    if (busy || !game || game.phase !== 'propose' || game.leader !== 0) return;
    var size = E.teamSize(game);
    if (selectedTeam.length !== size) return;
    try { E.proposeTeam(game, 0, selectedTeam.slice()); } catch (e) { return; }
    selectedTeam = [];
    sfx('move');
    consume();
    render();
    pump();
  }

  function toggleMember(i) {
    if (!game || game.phase !== 'propose' || game.leader !== 0) return;
    var size = E.teamSize(game);
    var idx = selectedTeam.indexOf(i);
    if (idx >= 0) selectedTeam.splice(idx, 1);
    else if (selectedTeam.length < size) selectedTeam.push(i);
    else { selectedTeam.shift(); selectedTeam.push(i); }
    sfx('click');
    render();
  }

  function castHumanVote(approve) {
    if (busy || !game || game.phase !== 'vote' || game.votes[0] != null) return;
    try { E.castVote(game, 0, approve); } catch (e) { return; }
    sfx(approve ? 'deal' : 'error');
    consume();
    render();
    pump();
  }

  function castHumanMission(fail) {
    if (busy || !game || game.phase !== 'mission') return;
    try { E.castMission(game, 0, fail); } catch (e) { return; }
    sfx(fail ? 'capture' : 'deal');
    consume();
    render();
    pump();
  }

  function chooseAssassin(target) {
    if (busy || !game || game.phase !== 'assassin' || game.players[0].role !== 'assassin') return;
    try { E.assassinate(game, 0, target); } catch (e) { return; }
    sfx('capture');
    consume();
    render();
    pump();
  }

  function consume() {
    if (!game || !game.events.length) return;
    var ev = game.events[game.events.length - 1];
    if (ev === lastEvent) return;
    lastEvent = ev;
    if (ev.type === 'propose') sfx('move');
    else if (ev.type === 'vote-result') sfx(ev.approved ? 'deal' : 'error');
    else if (ev.type === 'mission-result') sfx(ev.result === 'success' ? 'capture' : 'lose');
    else if (ev.type === 'assassin-phase') sfx('notify');
    else if (ev.type === 'assassinate') sfx('capture');
    else if (ev.type === 'over') sfx(ev.winner === 'good' ? 'win' : 'lose');
  }

  // ---- AI pump -----------------------------------------------------------
  function nextAiSeat() {
    if (!game || game.phase === 'over') return null;
    if (game.phase === 'propose') return game.leader !== 0 ? game.leader : null;
    if (game.phase === 'vote') {
      if (game.votes[0] == null) return null;
      for (var i = 1; i < game.players.length; i++) if (game.votes[i] == null) return i;
      return null;
    }
    if (game.phase === 'mission') {
      if (game.team.indexOf(0) >= 0 && game.missionVotes[0] == null) return null;
      for (var k = 0; k < game.team.length; k++) {
        var seat = game.team[k];
        if (seat !== 0 && game.missionVotes[seat] == null) return seat;
      }
      return null;
    }
    if (game.phase === 'assassin') {
      var assassin = E.assassinId(game);
      return assassin !== 0 ? assassin : null;
    }
    return null;
  }

  function pump() {
    if (busy || !game || game.phase === 'over') { busy = false; return; }
    if (nextAiSeat() == null) { busy = false; return; }
    busy = true;
    setTimeout(function () {
      if (!game || game.phase === 'over') { busy = false; return; }
      var seat = nextAiSeat();
      if (seat == null) { busy = false; render(); return; }
      try { E.aiAct(game, seat); } catch (e) { busy = false; return; }
      consume();
      render();
      busy = false;
      pump();
    }, fast ? 6 : 430);
  }

  $('againBtn').addEventListener('click', start);

  document.addEventListener('keydown', function (e) {
    if (!game) return;
    if (e.key === 'Enter' && game.phase === 'propose' && game.leader === 0) {
      e.preventDefault();
      confirmTeam();
      return;
    }
    if (game.phase === 'vote' && game.votes[0] == null) {
      if (e.key === 'a' || e.key === 'A') { e.preventDefault(); castHumanVote(true); }
      else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); castHumanVote(false); }
      return;
    }
    if (game.phase === 'mission' && game.team.indexOf(0) >= 0 && game.missionVotes[0] == null) {
      if (e.key === 's' || e.key === 'S') { e.preventDefault(); castHumanMission(false); }
      else if ((e.key === 'f' || e.key === 'F') && game.players[0].evil) { e.preventDefault(); castHumanMission(true); }
      return;
    }
    if (game.phase === 'propose' && game.leader === 0 && /^[1-5]$/.test(e.key)) {
      e.preventDefault();
      toggleMember(Number(e.key) - 1);
    }
  });

  // Public test hook — only the viewer's own hidden information.
  window.__premium = {
    state: function () { return game ? E.publicView(game, 0) : null; },
    over: function () { return !!game && game.phase === 'over'; },
    role: function () { return game ? game.players[0].role : null; },
    start: start,
    fast: fast
  };

  start();
})();
</script>
</body>
</html>
