<!doctype html>
<!--
  Connect 4 / 四子棋 premium — online lobby and room board.
  Server-authoritative HTTP/JSON polling. No external requests, no CDN.
  Rooms, invites, reconnect, timeout takeover, leaderboard and rematch come
  from games/shared/online-room-server.mjs.
-->
<html lang="zh-CN" data-theme="dark">
<head>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/connect4-premium/online.html">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1726">
<meta name="description" content="四子棋 Connect 4 联机房间：创建或加入房间、邀请码、2 人同局、空位 AI 补齐、断线重连、超时托管与排行榜。服务端权威判定，再来一局交换先手。">
<title>四子棋 CONNECT 4 · 联机房间</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23123f86'/%3E%3Ccircle cx='20' cy='22' r='8' fill='%23d7263d'/%3E%3Ccircle cx='32' cy='22' r='8' fill='%23f6c445'/%3E%3Ccircle cx='44' cy='22' r='8' fill='%23d7263d'/%3E%3Ccircle cx='20' cy='44' r='8' fill='%23f6c445'/%3E%3Ccircle cx='32' cy='44' r='8' fill='%23d7263d'/%3E%3Ccircle cx='44' cy='44' r='8' fill='%23f6c445'/%3E%3C/svg%3E">
<style>
  :root{
    --art-frame:url("../../assets/art/premium/connect4/frame-blue.webp");
    --art-red:url("../../assets/art/premium/connect4/disc-red.webp");
    --art-yellow:url("../../assets/art/premium/connect4/disc-yellow.webp");
    --art-felt:url("../../assets/art/premium/connect4/table-felt.webp");
    --font-serif:"Songti SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --bg:#0a1422;--bg2:#101f33;--panel:rgba(17,30,48,.94);--panel2:rgba(30,48,74,.72);
    --line:rgba(105,145,196,.36);--ink:#f2f0e8;--muted:#a9bad0;--gold:#f2c96a;
    --red:#d7263d;--red-hi:#f05a68;--red-lo:#8f1526;
    --yellow:#f6c445;--yellow-hi:#ffdf7e;--yellow-lo:#b8860f;
    --frame:#1f5fbf;--frame-edge:#0b2a5c;--hole:#081525;
    --mint:#7fd9a6;--sky:#87c9ef;--danger:#ff9c8d;
    --shadow:0 20px 48px rgba(0,0,0,.46);--radius:18px;--tap:48px;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#ece6d9;--bg2:#f7f2e7;--panel:rgba(255,252,245,.95);--panel2:rgba(246,240,229,.86);
      --line:rgba(150,125,92,.38);--ink:#1e2633;--muted:#5c6979;--gold:#9c6c14;--mint:#1f8f61;--sky:#2c75ad;--danger:#b33f35;}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 var(--font-sans);
    background:
      radial-gradient(900px 540px at 50% -16%,rgba(31,95,191,.5),transparent 64%),
      var(--art-felt) center/cover no-repeat fixed,
      linear-gradient(168deg,var(--bg2),var(--bg) 62%);
    background-color:var(--bg);
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  a{color:var(--gold)}
  .wrap{max-width:880px;margin:0 auto;padding:10px 12px 30px}
  .top{display:flex;align-items:center;gap:8px;padding:4px 0 12px}
  .top h1{margin:0;font-family:var(--font-serif);font-weight:700;font-size:20px;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);min-width:56px;padding:0 12px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
  .panel + .panel{margin-top:12px}
  h2{margin:0 0 10px;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  .field{display:grid;gap:5px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--muted);font-weight:700}
  input{font:inherit;font-size:16px;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
    background:rgba(0,0,0,.22);color:var(--ink);width:100%}
  button{font:inherit;font-size:14px;font-weight:800;min-height:var(--tap);padding:10px 14px;border-radius:13px;
    border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;touch-action:manipulation}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.42;cursor:default}
  button.primary{background:linear-gradient(160deg,var(--mint),#2fa77c);color:#062019;border:0}
  button.coral{background:linear-gradient(160deg,var(--yellow),#c9971c);color:#2a1d04;border:0}
  button.ghost{background:transparent}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .row > button{flex:1;min-width:130px}
  .muted{color:var(--muted);font-size:12.5px;line-height:1.6}
  .err{color:var(--danger);font-size:13px;font-weight:700;min-height:18px;margin-top:6px}
  .roombar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .roomeyebrow{font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
  .chip{display:inline-flex;align-items:center;min-height:30px;padding:2px 12px;border-radius:999px;background:rgba(0,0,0,.24);
    border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--gold)}
  .seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
  .seat{position:relative;border:1px solid var(--line);border-radius:14px;padding:9px 10px;background:var(--panel2);min-width:0}
  .seat.you{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
  .seat.turn{box-shadow:0 0 0 2px var(--mint) inset}
  .seat .name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seat .meta{display:flex;justify-content:space-between;gap:4px;margin-top:3px;font-size:12px;color:var(--muted)}
  .seat .colorline{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;font-weight:800;color:var(--muted)}
  .dot{width:14px;height:14px;border-radius:50%;flex:0 0 14px;box-shadow:inset 0 -2px 3px rgba(0,0,0,.35)}
  .dot.red{background:radial-gradient(circle at 34% 28%,var(--red-hi),var(--red) 62%,var(--red-lo))}
  .dot.yellow{background:radial-gradient(circle at 34% 28%,var(--yellow-hi),var(--yellow) 62%,var(--yellow-lo))}
  .badge{font-size:12px;color:var(--mint);font-weight:800;margin-left:4px}

  .board-shell{padding:5px;border-radius:22px;background:linear-gradient(165deg,rgba(31,95,191,.3),rgba(6,16,30,.8));box-shadow:0 14px 30px rgba(0,0,0,.32)}
  .board{position:relative;padding:11px;border-radius:17px;overflow:hidden;background-color:var(--frame);
    background-image:var(--art-frame);background-size:cover;background-position:center;background-blend-mode:multiply;
    border:2px solid var(--frame-edge);box-shadow:inset 0 2px 6px rgba(255,255,255,.26),inset 0 -8px 18px rgba(0,0,0,.4);touch-action:manipulation}
  .board::after{content:"";position:absolute;inset:0;border-radius:15px;pointer-events:none;z-index:4;
    background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 32%,transparent 66%,rgba(0,0,0,.22));mix-blend-mode:soft-light}
  .cells{position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:2px;aspect-ratio:7/6;z-index:1}
  .cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
  .hole{display:block;width:88%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 38%,#0d2038,var(--hole) 68%);
    box-shadow:inset 0 5px 8px rgba(0,0,0,.86),0 1px 0 rgba(180,215,255,.24)}
  .disc{position:absolute;width:88%;aspect-ratio:1;border-radius:50%;display:none;background-size:175%;background-position:center;background-repeat:no-repeat;
    box-shadow:inset 0 -4px 8px rgba(0,0,0,.42),inset 0 3px 3px rgba(255,255,255,.26),0 2px 4px rgba(0,0,0,.4)}
  .disc.p1{display:block;background-color:var(--red);background-image:var(--art-red);background-blend-mode:multiply}
  .disc.p2{display:block;background-color:var(--yellow);background-image:var(--art-yellow);background-blend-mode:multiply}
  .disc.last::after{content:"";position:absolute;inset:16%;border-radius:50%;border:2px solid rgba(255,255,255,.9)}
  .disc.win{animation:winGlow 1.1s ease-in-out infinite}
  .disc.win::after{content:"";position:absolute;inset:-6%;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 16px 4px rgba(242,201,106,.6)}
  .disc.fresh{animation:dropIn .34s cubic-bezier(.3,.72,.36,1.06) both}
  @keyframes dropIn{from{transform:translateY(-420%)}to{transform:translateY(0)}}
  @keyframes winGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.26)}}
  .cols{position:absolute;left:11px;right:11px;top:11px;bottom:11px;display:grid;grid-template-columns:repeat(7,1fr);z-index:3}
  .col{position:relative;border:0;background:transparent;padding:0;border-radius:9px;cursor:default;min-width:0}
  .col.legal{cursor:pointer}
  .col::before{content:"";position:absolute;inset:2% 8%;border-radius:9px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.04));
    opacity:0;transition:opacity .14s ease;pointer-events:none}
  .col.legal:hover::before,.col.legal:focus-visible::before{opacity:1}
  .col:focus-visible{outline:3px solid #9ed4ff;outline-offset:-2px}
  .col::after{content:attr(data-num);position:absolute;top:0;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:rgba(232,242,255,.66)}
  .gstatus{display:flex;align-items:center;gap:8px;justify-content:center;min-height:40px;margin-top:9px;font-size:13px;font-weight:800;color:var(--muted)}
  .gstatus .tdot{width:14px;height:14px;border-radius:50%;flex:0 0 14px;background:var(--red)}
  .gstatus[data-turn="yellow"] .tdot{background:var(--yellow)}
  .finale{margin-top:12px;border:1px solid rgba(127,217,166,.4);background:rgba(127,217,166,.12);border-radius:15px;padding:12px;text-align:center}
  .finale h3{margin:0 0 4px;font-size:20px;font-family:var(--font-serif)}
  .finale .lbrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.12);margin-top:5px}
  .log{margin-top:12px;border:1px solid var(--line);border-radius:15px;background:rgba(0,0,0,.16);padding:9px 12px;max-height:160px;overflow:auto}
  .log ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
  .log li{font-size:12.5px;color:var(--muted);border-bottom:1px dashed rgba(120,150,190,.2);padding:3px 0}
  .log li:last-child{color:var(--ink)}
  .leaderboard{display:grid;gap:4px}
  .lbrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.12)}
  .lbrow b{color:var(--gold)}
  .board-on{display:none}
  .board-on.on{display:block}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  @media (max-width:420px){
    .wrap{padding:8px 9px 26px}
    .top h1{font-size:17px}
    .panel{padding:11px}
    .seats{grid-template-columns:1fr}
  }
</style>

<body>
<div class="wrap">
  <header class="top">
    <a class="icon-btn" href="index.html">← 单机</a>
    <h1>四子棋 · 联机</h1>
    <a class="icon-btn" href="rules.html">规则</a>
  </header>

  <main>
    <section class="panel" id="lobby" aria-label="联机大厅">
      <h2>创建或加入房间</h2>
      <div class="field">
        <label for="nickname">昵称</label>
        <input id="nickname" maxlength="16" placeholder="房主 / 玩家" autocomplete="nickname">
      </div>
      <div class="row">
        <button class="primary" id="createBtn" type="button">创建房间</button>
        <button id="joinBtn" type="button">加入房间</button>
      </div>
      <div class="field" id="joinFields" hidden style="margin-top:10px">
        <label for="roomCode">房间号 / 邀请码</label>
        <input id="roomCode" maxlength="64" placeholder="粘贴房间号或邀请码" autocomplete="off">
        <label for="joinPassword">房间密码（可选）</label>
        <input id="joinPassword" type="password" maxlength="64" placeholder="无密码可留空" autocomplete="off">
      </div>
      <div class="err" id="lobbyErr" role="alert"></div>
      <p class="muted">服务端权威判定；2 人同局；空位由 AI 补齐；掉线 15 秒后自动托管，重连即恢复；再来一局交换先手。</p>
    </section>

    <section class="panel board-on" id="boardPanel" aria-label="联机棋桌">
      <div class="roombar">
        <div>
          <div class="roomeyebrow">Room</div>
          <div class="chip" id="roomChip">—</div>
        </div>
        <div class="row" style="flex:0 1 auto">
          <button class="ghost" id="inviteBtn" type="button">复制邀请</button>
          <button class="ghost" id="startBtn" type="button">开始 / AI 补位</button>
        </div>
      </div>
      <div class="err" id="boardErr" role="alert"></div>
      <div class="seats" id="seats"></div>

      <div class="board-shell">
        <div class="board" id="board" role="grid" aria-label="联机四子棋棋盘，7 列 6 行">
          <div class="cells" id="cells" aria-hidden="true"></div>
          <div class="cols" id="cols"></div>
        </div>
      </div>
      <div class="gstatus" id="gameStatus" aria-live="polite"><span class="tdot" aria-hidden="true"></span><span id="gameStatusText">等待开始</span></div>

      <div class="finale" id="finale" hidden>
        <h3 id="finaleTitle">结算</h3>
        <p class="muted" id="finaleSub"></p>
        <div id="finaleRows"></div>
        <div class="row" style="margin-top:10px">
          <button class="primary" id="restartBtn" type="button">再来一局（交换先手）</button>
        </div>
      </div>

      <div class="log" aria-label="落子记录"><ul id="logList"></ul></div>
      <div class="row" style="margin-top:10px">
        <button class="ghost" id="leaveBtn" type="button">离开房间</button>
        <a class="icon-btn" href="index.html" style="flex:0 0 auto">返回单机</a>
      </div>
    </section>

    <section class="panel" aria-label="排行榜">
      <h2>结算榜</h2>
      <div class="leaderboard" id="leaderboard"><p class="muted">还没有结算记录。</p></div>
    </section>
  </main>
<p style="text-align:center;margin:14px 0"><a href="../spectate.html" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1px solid currentColor;color:inherit;font-size:13px;text-decoration:none">围观其他对局</a></p>
</div>

<script src="../../shared/online-client.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var oc = OnlineClient.create({ game: 'connect4-premium', storagePrefix: 'c4p-online' });
  oc.load();
  var roomKey = oc.room();
  var invite = oc.inviteCode();
  var session = oc.session();
  var playerId = oc.playerId();
  var nickname = oc.nickname();
  var timer = null;
  var lastVersion = -1;
  var lastPlies = -1;
  var lastView = null;
  var moveLog = [];
  var pollErrors = 0;

  function remember(nextRoom, nextSession, nextPlayer) {
    oc.setSession(nextRoom || roomKey, nextSession || session, nextPlayer || playerId);
    roomKey = oc.room(); session = oc.session(); playerId = oc.playerId();
  }
  function api(method, route, body) { return oc.api(method, route, body); }
  function errText(r) { return oc.errText(r); }
  function toast(msg) { $('boardErr').textContent = msg || ''; }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function colorLabel(c) { return c === 'red' ? '红方' : (c === 'yellow' ? '黄方' : '—'); }

  function saveNick() {
    nickname = ($('nickname').value || '').trim() || ('玩家-' + Math.random().toString(36).slice(2, 6));
    oc.setNickname(nickname);
    return nickname;
  }
  try { $('nickname').value = nickname; } catch (e) {}

  function showBoard(on) {
    $('lobby').hidden = on;
    $('boardPanel').classList.toggle('on', on);
  }

  function createRoom() {
    saveNick();
    $('lobbyErr').textContent = '';
    oc.createRoom({ nickname: nickname }).then(function (body) {
      roomKey = oc.room(); session = oc.session(); playerId = oc.playerId();
      invite = body.inviteToken || oc.inviteCode() || '';
      showBoard(true);
      poll();
    }).catch(function (e) { $('lobbyErr').textContent = e.message; });
  }

  function joinRoom() {
    saveNick();
    var key = ($('roomCode').value || '').trim();
    if (!key) { $('lobbyErr').textContent = '请填写房间号或邀请码。'; return; }
    $('lobbyErr').textContent = '';
    var payload = {
      playerId: 'c4p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6),
      nickname: nickname
    };
    if (key.indexOf('room_') !== 0 && !/^[A-Z0-9]{6}$/i.test(key)) payload.inviteCode = key;
    if ($('joinPassword').value) payload.password = $('joinPassword').value;
    oc.joinRoom(key, payload)
      .then(function () {
        roomKey = oc.room(); session = oc.session(); playerId = oc.playerId();
        showBoard(true);
        poll();
      })
      .catch(function (e) { $('lobbyErr').textContent = e.message; });
  }

  function seatHtml(seat, state, you) {
    var color = seat.color || (state && state.colors ? state.colors[seat.index] : null);
    var myTurn = state && state.yourTurn && seat.index === you;
    var cls = 'seat' + (seat.index === you ? ' you' : '') + (myTurn ? ' turn' : '');
    return '<div class="' + cls + '">' +
      '<div class="name">' + esc(seat.name) + (seat.ai ? ' · AI' : '') + (seat.index === you ? ' · 你' : '') +
      (seat.isHost ? '<span class="badge">房主</span>' : '') + '</div>' +
      '<div class="colorline"><span class="dot ' + (color === 'yellow' ? 'yellow' : 'red') + '"></span>' +
      colorLabel(color) + (seat.connected ? '' : ' · 离线') + '</div>' +
      '<div class="meta"><span>' + (state ? '落子 ' + (state.plies || 0) : '等待开始') + '</span><span>' +
      (seat.isYou ? (state && state.yourTurn ? '轮到你' : '等待') : '') + '</span></div>' +
      '</div>';
  }

  function boardHtml(state, legal) {
    var legalCols = {};
    (legal || []).forEach(function (a) { if (a.type === 'drop') legalCols[a.col] = true; });
    var st = state ? { over: state.over, line: state.line || [] } : { over: true, line: [] };
    var cells = '';
    for (var i = 0; i < 42; i++) {
      var v = state ? state.board[i] : 0;
      var cls = 'disc' + (v === 1 ? ' p1' : v === 2 ? ' p2' : '');
      if (v && i === state.last) cls += ' last';
      if (v && st.line && st.line.indexOf(i) >= 0) cls += ' win';
      if (v && lastPlies >= 0 && state.plies > lastPlies && i === state.last) cls += ' fresh';
      cells += '<div class="cell"><span class="hole"></span><span class="' + cls + '"></span></div>';
    }
    var cols = '';
    for (var c = 0; c < 7; c++) {
      var isLegal = !!legalCols[c];
      cols += '<div class="col' + (isLegal ? ' legal' : '') + '" role="gridcell" tabindex="' + (isLegal ? '0' : '-1') +
        '" data-col="' + c + '" data-num="' + (c + 1) + '" data-legal="' + (isLegal ? '1' : '0') +
        '" aria-label="第 ' + (c + 1) + ' 列' + (isLegal ? '，可落子' : '，不可落子') + '"></div>';
    }
    return { cells: cells, cols: cols };
  }

  function renderLog(state) {
    if (!state) return;
    if (lastPlies < 0) { lastPlies = state.plies; }
    if (state.plies > lastPlies && state.last >= 0) {
      var v = state.board[state.last];
      var playerColor = v === 1 ? 'red' : 'yellow';
      moveLog.push({ ply: state.plies, color: playerColor, col: state.last % 7 });
      lastPlies = state.plies;
    } else if (state.plies < lastPlies) {
      moveLog = [];
      lastPlies = state.plies;
    }
    var list = $('logList');
    list.innerHTML = moveLog.slice(-14).map(function (m) {
      return '<li>第 ' + m.ply + ' 手 · ' + colorLabel(m.color) + ' · 第 ' + (m.col + 1) + ' 列</li>';
    }).join('') || '<li>还没有落子。</li>';
  }

  function render(r) {
    lastView = r;
    var state = r.state;
    $('roomChip').textContent = '房间 ' + (r.code || r.roomId) + ' · ' +
      (r.started ? (r.over ? '已结束' : '进行中') : '等待玩家') + ' · ' + r.playerCount + ' 人';
    $('seats').innerHTML = (r.seats || []).map(function (seat) { return seatHtml(seat, state, r.you); }).join('');
    $('startBtn').hidden = r.started;
    $('startBtn').disabled = !(r.seats || []).some(function (s) { return s.isYou && s.isHost; });
    $('inviteBtn').disabled = !(r.seats || []).some(function (s) { return s.isYou && s.isHost; });

    var html = boardHtml(state, r.legalActions);
    $('cells').innerHTML = html.cells;
    $('cols').innerHTML = html.cols;
    var cols = $('cols').children;
    for (var i = 0; i < cols.length; i++) {
      cols[i].addEventListener('click', function () {
        if (this.getAttribute('data-legal') !== '1') return;
        act({ type: 'drop', col: Number(this.getAttribute('data-col')) });
      });
      cols[i].addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        if (this.getAttribute('data-legal') === '1') act({ type: 'drop', col: Number(this.getAttribute('data-col')) });
      });
    }

    var status = $('gameStatus');
    var text = $('gameStatusText');
    status.removeAttribute('data-turn');
    if (!r.started) {
      text.textContent = '等待房主开始对局；空位会由 AI 补齐。';
    } else if (r.over) {
      var res = r.result || {};
      text.textContent = res.draw ? '平局 · 42 格填满' : (res.winnerName ? res.winnerName + ' 获胜' : '对局结束');
      status.setAttribute('data-over', '1');
    } else if (!state) {
      text.textContent = '同步中…';
    } else {
      status.setAttribute('data-turn', state.turn === 1 ? 'red' : 'yellow');
      text.textContent = state.yourTurn
        ? '轮到你（' + colorLabel(state.yourColor) + '），点一列落子'
        : '等待' + colorLabel(state.turn === 1 ? 'red' : 'yellow') + '落子…';
    }

    renderLog(state);

    var fin = $('finale');
    if (r.over && r.result) {
      fin.hidden = false;
      var result = r.result;
      $('finaleTitle').textContent = result.draw ? '平局 · 棋盘填满' : (result.winnerName ? result.winnerName + ' 获胜' : '结算');
      $('finaleSub').textContent = result.draw
        ? '42 格填满且没有四连 · 双方各 ' + (result.scores ? result.scores.join(' / ') : '21 / 21') + ' 枚'
        : '四子连线 · ' + (result.turns || 0) + ' 手 · 再来一局交换先手';
      $('finaleRows').innerHTML = (r.seats || []).map(function (seat, idx) {
        var s = result.scores ? result.scores[idx] : null;
        return '<div class="lbrow"><span>' + esc(seat.name) + ' · ' + colorLabel(seat.color) + '</span><b>' +
          (s == null ? '—' : s + ' 枚') + '</b></div>';
      }).join('');
      $('restartBtn').hidden = !r.canRestart;
    } else {
      fin.hidden = true;
    }
    $('leaveBtn').hidden = !r.started;
  }

  function fetchRoom() {
    if (!roomKey || !session) { showBoard(false); return Promise.resolve(null); }
    return oc.fetchView().then(function (view) {
      if (!view) return null;
      showBoard(true);
      if (view.stateVersion !== lastVersion) {
        lastVersion = view.stateVersion;
        render(view);
      } else {
        $('seats').innerHTML = (view.seats || []).map(function (seat) { return seatHtml(seat, view.state, view.you); }).join('');
      }
      if (view.inviteCode) invite = view.inviteCode;
      return view;
    });
  }

  function poll() {
    if (timer) clearInterval(timer);
    fetchRoom();
    timer = setInterval(fetchRoom, 700);
  }

  function act(action) {
    if (!session) return;
    toast('');
    oc.action(action).then(function () {
      lastVersion = -1;
      return fetchRoom();
    }).catch(function (e) { toast(e.message); });
  }

  $('createBtn').addEventListener('click', createRoom);
  $('joinBtn').addEventListener('click', function () {
    $('joinFields').hidden = false;
    joinRoom();
  });
  $('startBtn').addEventListener('click', function () {
    oc.startMatch()
      .then(function () { lastVersion = -1; return fetchRoom(); })
      .catch(function (e) { toast(e.message); });
  });
  $('restartBtn').addEventListener('click', function () {
    oc.restart()
      .then(function () { lastVersion = -1; lastPlies = -1; moveLog = []; return fetchRoom(); })
      .catch(function (e) { toast(e.message); });
  });
  $('leaveBtn').addEventListener('click', function () {
    oc.leave()
      .then(function () { showBoard(false); if (timer) clearInterval(timer); })
      .catch(function () { showBoard(false); });
  });
  $('inviteBtn').addEventListener('click', function () {
    var url = location.origin + '/boardgame/connect4-premium/online.html?room=' + encodeURIComponent(roomKey) + '&code=' + encodeURIComponent(invite || '');
    var done = function () { toast('邀请链接已复制：' + url); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done).catch(done);
    else done();
  });

  function loadLeaderboard() {
    if (location.pathname.indexOf('/games/') === 0) return; // static site: no room API
    api('GET', '/api/leaderboard?game=connect4-premium').then(function (r) {
      var entries = (r.body && r.body.entries) || [];
      $('leaderboard').innerHTML = entries.length
        ? entries.slice(0, 12).map(function (e) {
          return '<div class="lbrow"><span>' + esc(e.name) + (e.ai ? ' · AI' : '') + '</span><b>' +
            (e.winner ? '胜' : (e.score == null ? '' : e.score + ' 枚')) + '</b></div>';
        }).join('')
        : '<p class="muted">还没有结算记录。</p>';
    }).catch(function () {});
  }
  loadLeaderboard();
  setInterval(loadLeaderboard, 5000);

  // Public test hook: the last server view plus local render state.
  window.__online = {
    view: function () { return lastView; },
    room: function () { return roomKey; },
    version: function () { return lastVersion; },
    pollErrors: function () { return pollErrors; }
  };

  if (roomKey && session) { showBoard(true); poll(); }
  else if (roomKey && invite) { showBoard(false); $('joinFields').hidden = false; $('roomCode').value = invite; }
})();
</script>
</body>
</html>
