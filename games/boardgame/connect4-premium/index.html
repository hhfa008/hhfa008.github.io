<style>
  :root{
    --art-frame:url("../../assets/art/premium/connect4/frame-blue.webp");
    --art-red:url("../../assets/art/premium/connect4/disc-red.webp");
    --art-yellow:url("../../assets/art/premium/connect4/disc-yellow.webp");
    --art-felt:url("../../assets/art/premium/connect4/table-felt.webp");
    --font-serif:"Songti SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --bg:#0a1422; --bg2:#101f33; --felt:#122238;
    --panel:rgba(17,30,48,.92); --panel2:rgba(28,45,70,.72); --line:#2d4768;
    --ink:#f2f0e8; --muted:#a9bad0; --soft:#7186a2;
    --red:#d7263d; --red-hi:#f05a68; --red-lo:#8f1526;
    --yellow:#f6c445; --yellow-hi:#ffdf7e; --yellow-lo:#b8860f;
    --frame:#1f5fbf; --frame-dark:#123f86; --frame-edge:#0b2a5c;
    --hole:#081525; --gold:#f2c96a;
    --shadow:0 22px 50px rgba(0,0,0,.5); --radius:18px; --tap:46px;
  }
  :root[data-theme="light"]{
    --bg:#e9e3d6; --bg2:#f6f1e6; --felt:#c9d8e8;
    --panel:rgba(255,252,245,.95); --panel2:rgba(246,241,230,.85); --line:#c8bda9;
    --ink:#1e2633; --muted:#5c6979; --soft:#8a94a2;
    --gold:#9c6c14; --shadow:0 20px 44px rgba(70,60,40,.2);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#e9e3d6; --bg2:#f6f1e6; --felt:#c9d8e8;
      --panel:rgba(255,252,245,.95); --panel2:rgba(246,241,230,.85); --line:#c8bda9;
      --ink:#1e2633; --muted:#5c6979; --soft:#8a94a2;
      --gold:#9c6c14; --shadow:0 20px 44px rgba(70,60,40,.2);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{min-height:100%}
  body{
    margin:0; color:var(--ink); font:16px/1.5 var(--font-sans);
    background:
      radial-gradient(900px 520px at 50% -12%, rgba(31,95,191,.42), transparent 64%),
      radial-gradient(720px 420px at 8% 108%, rgba(215,38,61,.16), transparent 60%),
      var(--art-felt) center/cover no-repeat fixed,
      linear-gradient(168deg, var(--bg2), var(--bg) 62%);
    background-color:var(--bg);
    -webkit-tap-highlight-color:transparent;
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.18;
    background:repeating-linear-gradient(118deg, rgba(255,255,255,.08) 0 1px, transparent 1px 9px),
      repeating-linear-gradient(26deg, rgba(0,0,0,.16) 0 1px, transparent 1px 11px);
    mix-blend-mode:soft-light;
  }
  a{color:var(--gold)}
  button,select{font:inherit;color:var(--ink)}
  button{touch-action:manipulation}
  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:8px 12px 28px}
  .top{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
  .brand{flex:1;min-width:0;text-align:center}
  .brand h1{margin:0;font-family:var(--font-serif);font-weight:700;font-size:21px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand p{margin:1px 0 0;font-size:12px;letter-spacing:1.2px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;min-width:var(--tap);min-height:var(--tap);
    padding:0 11px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;touch-action:manipulation;
    box-shadow:0 4px 0 rgba(0,0,0,.24);transition:transform .12s ease,background .2s ease;
  }
  .icon-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.24)}
  .icon-btn:focus-visible,select:focus-visible,.col:focus-visible{outline:3px solid #87c9ef;outline-offset:2px}

  .hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .scoreboard{

  .side{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
  .side b{font-family:var(--font-serif);font-size:22px;line-height:1;color:var(--ink);margin-left:2px}
  .dot{width:15px;height:15px;border-radius:50%;flex:0 0 15px;box-shadow:inset 0 -2px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.4)}
  .dot.red{background:radial-gradient(circle at 34% 28%,var(--red-hi),var(--red) 62%,var(--red-lo))}
  .dot.yellow{background:radial-gradient(circle at 34% 28%,var(--yellow-hi),var(--yellow) 62%,var(--yellow-lo))}
  .sep{color:var(--soft);font-weight:800;font-size:14px}
  .status{
    flex:1;min-width:160px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;
    padding:8px 11px;border-radius:14px;border:1px solid var(--line);background:var(--panel);min-height:46px;
  }
  .status .turn-dot{width:16px;height:16px;border-radius:50%;flex:0 0 16px;background:var(--red);box-shadow:inset 0 -2px 3px rgba(0,0,0,.3),0 0 0 4px rgba(215,38,61,.16)}
  .status[data-turn="2"] .turn-dot{background:var(--yellow);box-shadow:inset 0 -2px 3px rgba(0,0,0,.3),0 0 0 4px rgba(246,196,69,.18)}
  .status[data-over="1"] .turn-dot{background:var(--gold);box-shadow:0 0 0 4px rgba(242,201,106,.18)}

  .board-section{margin:2px 0 8px}
  .board-shell{
    padding:6px;border-radius:26px;background:linear-gradient(165deg,rgba(31,95,191,.34),rgba(6,16,30,.8));
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.16);
  }
  .board{
    position:relative;padding:14px;border-radius:20px;overflow:hidden;
    background-color:var(--frame);
    background-image:var(--art-frame);
    background-size:cover;background-position:center;
    background-blend-mode:multiply;
    border:2px solid var(--frame-edge);
    box-shadow:inset 0 2px 6px rgba(255,255,255,.28),inset 0 -8px 18px rgba(0,0,0,.38),0 12px 26px rgba(0,0,0,.34);
    touch-action:manipulation;
  }
  .board::after{
    content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;z-index:4;
    background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 32%,transparent 66%,rgba(0,0,0,.24));
    mix-blend-mode:soft-light;
  }
  .cells{position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:2px;aspect-ratio:7/6;z-index:1}
  .cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
  .hole{
    display:block;width:88%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 50% 38%,#0d2038,var(--hole) 68%);
    box-shadow:inset 0 5px 8px rgba(0,0,0,.86),inset 0 -1px 2px rgba(120,180,255,.14),0 1px 0 rgba(180,215,255,.28);
  }
  .disc{
    position:absolute;width:88%;aspect-ratio:1;border-radius:50%;display:none;
    background-size:175%;background-position:center;background-repeat:no-repeat;
    box-shadow:inset 0 -4px 8px rgba(0,0,0,.42),inset 0 3px 3px rgba(255,255,255,.28),0 2px 4px rgba(0,0,0,.45);
    will-change:transform;
  }
  .disc::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.62),rgba(255,255,255,.14) 24%,transparent 48%),
      radial-gradient(circle at 50% 62%,rgba(0,0,0,.16) 38%,transparent 72%);
    pointer-events:none;
  }
  .disc.p1{display:block;background-color:var(--red);background-image:var(--art-red);background-blend-mode:multiply}
  .disc.p2{display:block;background-color:var(--yellow);background-image:var(--art-yellow);background-blend-mode:multiply}
  .disc.last::after{
    content:"";position:absolute;inset:16%;border-radius:50%;
    border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.3),0 0 14px rgba(255,255,255,.35);
  }
  .disc.win{animation:winGlow 1s ease-in-out infinite}
  .disc.win::after{content:"";position:absolute;inset:-6%;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 18px 5px rgba(242,201,106,.62)}
  .disc.ghost{
    display:block;opacity:.42;filter:saturate(.8);box-shadow:none;border:2px dashed rgba(255,255,255,.55);
    background-color:transparent;background-image:none;
  }
  .disc.ghost::before{display:none}
  .disc.fall{animation-name:drop;animation-timing-function:cubic-bezier(.3,.72,.36,1.06);animation-fill-mode:both}
  @keyframes drop{from{transform:translateY(calc(-1 * var(--fall,1) * 100%))}to{transform:translateY(0)}}
  @keyframes winGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.28)}}

  .cols{position:absolute;left:14px;right:14px;top:14px;bottom:14px;display:grid;grid-template-columns:repeat(7,1fr);z-index:3}
  .col{position:relative;border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation;border-radius:10px;min-width:0}
  .col::before{
    content:"";position:absolute;inset:2% 8%;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.05));
    opacity:0;transition:opacity .14s ease;pointer-events:none;
  }
  .col.hover::before,.col:focus-visible::before{opacity:1}
  .col.occupied::before{background:linear-gradient(180deg,rgba(215,38,61,.24),transparent)}
  .col.occupied[data-turn="2"]::before{background:linear-gradient(180deg,rgba(246,196,69,.26),transparent)}
  .col:focus-visible{outline:3px solid #9ed4ff;outline-offset:-2px}
  .col::after{
    content:attr(data-num);position:absolute;top:1px;left:0;right:0;text-align:center;
    font-size:12px;font-weight:800;color:rgba(232,242,255,.72);text-shadow:0 1px 2px rgba(0,0,0,.5);pointer-events:none;
  }

  .result{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
    display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 20px;border-radius:16px;
    background:rgba(8,20,36,.94);border:1px solid rgba(135,201,239,.5);text-align:center;
    box-shadow:0 16px 40px rgba(0,0,0,.55);pointer-events:none;min-width:220px;
  }
  .result[hidden]{display:none}
  .result strong{font-family:var(--font-serif);font-size:20px;letter-spacing:.5px}
  .result button{pointer-events:auto;min-height:46px;min-width:128px;padding:0 18px;border:0;border-radius:12px;
    background:linear-gradient(160deg,var(--gold),#c99a2e);color:#251a06;font-weight:800;cursor:pointer}

  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
  .controls button{
    min-height:var(--tap);min-width:var(--tap);padding:0 14px;border-radius:13px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);font-size:13px;font-weight:800;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .12s ease;
  }
  .controls button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .controls button:disabled{opacity:.42;cursor:default;box-shadow:none}
  .level-field{display:inline-flex;align-items:center;gap:7px;min-height:var(--tap);padding:0 4px 0 12px;
    border:1px solid var(--line);border-radius:13px;background:var(--panel)}
  .level-field span{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
  select#level{min-height:calc(var(--tap) - 2px);min-width:78px;border:0;border-radius:10px;background:transparent;
    color:var(--ink);font-size:16px;font-weight:800;padding:0 4px;cursor:pointer}
  .hint{margin:9px 2px 0;min-height:20px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.5}

  .log{margin-top:12px;border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:9px 12px}
  .log h2{margin:0 0 5px;font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}
  .log ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:132px;overflow:auto}
  .log li{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);padding:3px 0;border-bottom:1px dashed rgba(120,150,190,.2)}
  .log li:last-child{border-bottom:0;color:var(--ink)}
  .log .mini-dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
  .log .mini-dot.p1{background:var(--red)}
  .log .mini-dot.p2{background:var(--yellow)}
  .foot{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
  .foot a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;min-width:64px;padding:0 12px;
    border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);text-decoration:none;font-size:12.5px;font-weight:700}
  .foot a:hover{color:var(--gold)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  [hidden]{display:none!important}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
  @media (max-width:430px){
    .wrap{padding:6px 8px 24px}
    .brand h1{font-size:19px}
    .board{padding:10px;border-radius:16px}
    .board-shell{padding:5px;border-radius:21px}
    .cols{left:10px;right:10px;top:10px;bottom:10px}
    .status{min-width:140px;font-size:13px}
    .controls{gap:7px}
    .controls button{padding:0 11px}
  }
  @media (max-width:340px){
    .wrap{padding:4px 2px 22px}
    .top{gap:5px}
    .icon-btn{min-width:44px;padding:0 7px;font-size:12px}
    .brand h1{font-size:17px}
    .brand p{font-size:12px}
    .board-shell{padding:3px 0;border-radius:18px}
    .board{padding:3px;border-radius:14px;border-width:1px}
    .board::after{border-radius:13px}
    .cols{left:3px;right:3px;top:3px;bottom:3px}
    .cell{gap:0}
    .hole{width:90%}
    .disc{width:90%}
    .controls button{font-size:12px;padding:0 9px}
    .level-field{padding-left:8px;gap:4px}
    select#level{min-width:70px;font-size:16px}
    .hud{gap:6px}
    .scoreboard{padding:5px 8px;gap:6px}
    .side{font-size:12px}
    .side b{font-size:19px}
  }
</style>

<body>
<div class="wrap">
  <header class="top">
    <a class="icon-btn" href="../index.html" aria-label="返回桌游目录">← 目录</a>
    <div class="brand">
      <h1>四子棋 CONNECT 4</h1>
      <p>红先落子 · 重力四连</p>
    </div>
    <a class="icon-btn" href="rules.html" aria-label="查看完整规则">规则</a>
  </header>

  <main>
    <section class="hud" aria-label="比分与状态">
      <div class="scoreboard" aria-label="本机累计比分">
        <span class="side"><span class="dot red" aria-hidden="true"></span>红方<b id="redScore">0</b></span>
        <span class="sep" aria-hidden="true">:</span>
        <span class="side"><span class="dot yellow" aria-hidden="true"></span>黄方<b id="yellowScore">0</b></span>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="turn-dot" aria-hidden="true"></span><span id="statusText">轮到红方</span>
      </div>
    </section>

    <section class="board-section" aria-label="棋盘">
      <div class="board-shell">
        <div class="board" id="board" role="grid" aria-label="四子棋棋盘，7 列 6 行，红方先手">
          <div class="cells" id="cells" aria-hidden="true"></div>
          <div class="cols" id="cols"></div>
          <div class="result" id="result" hidden>
            <strong id="resultText">红方获胜</strong>
            <button type="button" id="againBtn">再来一局</button>
          </div>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="操作">
      <button type="button" id="newBtn">新局</button>
      <button type="button" id="undoBtn">悔棋</button>
      <label class="level-field" for="level"><span>AI 强度</span>
        <select id="level" aria-label="选择 AI 强度">
          <option value="1">简单</option>
          <option value="2" selected>普通</option>
          <option value="3">困难</option>
        </select>
      </label>
      <button type="button" id="muteBtn" aria-label="静音或开启音效" aria-pressed="false">♪</button>
      <button type="button" id="themeBtn" aria-label="切换深色或浅色主题">◐</button>
    </section>
    <p class="hint" id="hint">点一列落子；也可以用数字键 1–7，或方向键移动后按回车。</p>

    <section class="log" aria-label="落子记录">
      <h2>落子记录</h2>
      <ol id="logList"></ol>
    </section>
  </main>

  <footer class="foot">
    <a href="rules.html">完整规则</a>
    <a href="online.html">联机对战</a>
    <a href="../index.html">更多桌游</a>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var E = window.Connect4PremiumEngine;
  var D = window.Connect4PremiumData;
  var ROWS = E.ROWS, COLS = E.COLS;
  var HUMAN = E.P1;
  var fast = /(?:\?|&)fast=1/.test(location.search);

  var game = E.setup();
  var hist = [E.clone(game)];
  var level = 2;
  var busy = false;
  var aiTimer = null;
  var aiToken = 0;
  var hoverCol = -1;
  var scored = false;
  var scores = { red: 0, yellow: 0 };

  function $(id) { return document.getElementById(id); }
  function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function safeSet(key, v) { try { localStorage.setItem(key, v); } catch (e) {} }
  function stateStatus() { return E.status(game); }

  // ---- theme -------------------------------------------------------------
  var theme = safeGet('c4p-theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
  function effectiveLight() {
    var attr = document.documentElement.getAttribute('data-theme');
    if (attr === 'light') return true;
    if (attr === 'dark') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  }
  function updateThemeLabel() {
    $('themeBtn').setAttribute('aria-label', effectiveLight() ? '切换到深色主题' : '切换到浅色主题');
  }
  updateThemeLabel();

  // ---- shared sound ------------------------------------------------------
  var Sfx = window.Sfx;
  var muted = safeGet('c4p-muted') === '1';
  function applyMute() {
    if (Sfx) Sfx.mute(muted);
    $('muteBtn').setAttribute('aria-pressed', muted ? 'true' : 'false');
    $('muteBtn').textContent = muted ? '×' : '♪';
  }
  applyMute();
  function sfx(name) { if (!muted && Sfx) Sfx.play(name); }
  $('muteBtn').addEventListener('click', function () {
    muted = !muted;
    safeSet('c4p-muted', muted ? '1' : '0');
    applyMute();
    if (!muted) sfx('click');
  });
  $('themeBtn').addEventListener('click', function () {
    var next = effectiveLight() ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    safeSet('c4p-theme', next);
    updateThemeLabel();
    sfx('click');
  });

  // ---- board scaffolding -------------------------------------------------
  var cellsBox = $('cells');
  var colsBox = $('cols');

  function buildBoard() {
    var i, frag = document.createDocumentFragment();
    for (i = 0; i < ROWS * COLS; i++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.setAttribute('data-index', String(i));
      var hole = document.createElement('span');
      hole.className = 'hole';
      var disc = document.createElement('span');
      disc.className = 'disc';
      cell.appendChild(hole);
      cell.appendChild(disc);
      frag.appendChild(cell);
    }
    cellsBox.appendChild(frag);

    var cf = document.createDocumentFragment();
    for (i = 0; i < COLS; i++) {
      var col = document.createElement('div');
      col.className = 'col';
      col.setAttribute('role', 'gridcell');
      col.setAttribute('tabindex', '0');
      col.setAttribute('data-col', String(i));
      col.setAttribute('data-num', String(i + 1));
      col.addEventListener('pointerenter', onColEnter);
      col.addEventListener('pointerleave', onColLeave);
      col.addEventListener('focus', onColFocus);
      col.addEventListener('blur', onColBlur);
      col.addEventListener('click', onColClick);
      col.addEventListener('keydown', onColKey);
      cf.appendChild(col);
    }
    colsBox.appendChild(cf);
  }

  function colEls() { return colsBox.children; }
  function onColEnter(e) { hoverCol = +e.currentTarget.getAttribute('data-col'); renderHover(); }
  function onColLeave() { hoverCol = -1; renderHover(); }
  function onColFocus(e) { hoverCol = +e.currentTarget.getAttribute('data-col'); renderHover(); }
  function onColBlur() { hoverCol = -1; renderHover(); }
  function onColClick(e) { drop(+e.currentTarget.getAttribute('data-col')); }
  function onColKey(e) {
    var c = +e.currentTarget.getAttribute('data-col');
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault(); drop(c); return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      var next = (c + (e.key === 'ArrowRight' ? 1 : COLS - 1)) % COLS;
      colEls()[next].focus();
    } else if (e.key === 'Home') {
      e.preventDefault(); colEls()[0].focus();
    } else if (e.key === 'End') {
      e.preventDefault(); colEls()[COLS - 1].focus();
    }
  }

  // ---- render ------------------------------------------------------------
  function render(animate) {
    var st = stateStatus();
    var cells = cellsBox.children;
    var i, c, r, v;
    for (i = 0; i < ROWS * COLS; i++) {
      var cell = cells[i];
      var disc = cell.lastChild;
      v = game.b[i];
      disc.className = 'disc' + (v === E.P1 ? ' p1' : v === E.P2 ? ' p2' : '');
      if (v) {
        r = (i / COLS) | 0;
        if (i === game.last) disc.classList.add('last');
        if (st.line && st.line.indexOf(i) >= 0) disc.classList.add('win');
        if (animate && i === game.last) {
          disc.style.setProperty('--fall', String(r + 1));
          disc.style.animationDuration = (0.2 + 0.055 * r).toFixed(3) + 's';
          disc.classList.add('fall');
        }
      } else {
        disc.style.removeProperty('--fall');
        disc.style.animationDuration = '';
      }
    }
    renderHover();

    var legal = E.legalMoves(game);
    for (c = 0; c < COLS; c++) {
      var col = colsBox.children[c];
      var isLegal = legal.indexOf(c) >= 0;
      var row = E.rowFor(game.b, c);
      col.setAttribute('aria-disabled', isLegal ? 'false' : 'true');
      col.setAttribute('aria-label', isLegal
        ? '第 ' + (c + 1) + ' 列，可落子，落点第 ' + (row + 1) + ' 行'
        : '第 ' + (c + 1) + ' 列，不可落子');
      col.classList.toggle('occupied', isLegal && !st.over);
      col.setAttribute('data-turn', String(game.turn));
    }

    updateHud(st);
    updateLog();
  }

  function renderHover() {
    var cells = cellsBox.children;
    var i;
    for (i = 0; i < cells.length; i++) {
      var d = cells[i].lastChild;
      if (d && d.classList) d.classList.remove('ghost');
    }
    for (i = 0; i < colsBox.children.length; i++) colsBox.children[i].classList.remove('hover');
    if (hoverCol < 0) return;
    var st = stateStatus();
    if (st.over || busy || game.turn !== HUMAN) return;
    if (!E.isLegal(game, hoverCol)) return;
    colsBox.children[hoverCol].classList.add('hover');
    var row = E.rowFor(game.b, hoverCol);
    var target = cells[row * COLS + hoverCol].lastChild;
    target.className = 'disc ghost ' + (game.turn === E.P1 ? 'p1' : 'p2');
  }

  function colorName(p) { return p === E.P1 ? '红方' : '黄方'; }

  function updateHud(st) {
    var statusText = $('statusText');
    var status = $('status');
    $('redScore').textContent = String(scores.red);
    $('yellowScore').textContent = String(scores.yellow);
    if (st.over) {
      status.setAttribute('data-over', '1');
      status.removeAttribute('data-turn');
      if (st.draw) {
        statusText.textContent = '平局 · 棋盘填满，没有四连';
        $('resultText').textContent = '平局 · 42 格填满';
      } else {
        statusText.textContent = colorName(st.winner) + '获胜 · 四子连线';
        $('resultText').textContent = colorName(st.winner) + '获胜 · 四子连线';
      }
      $('result').hidden = false;
      $('hint').textContent = '对局结束。点“新局”或“再来一局”重新开始，也可以悔棋回到上一手。';
    } else {
      status.removeAttribute('data-over');
      status.setAttribute('data-turn', String(game.turn));
      if (busy) {
        statusText.textContent = 'AI 思考中…';
        $('hint').textContent = 'AI 正在按 ' + levelName(level) + ' 强度计算落点（≤400ms）。';
      } else {
        statusText.textContent = '轮到' + colorName(game.turn);
        $('hint').textContent = game.turn === HUMAN
          ? '点一列落子；也可以用数字键 1–7，或方向键移动后按回车。'
          : '等待 AI 落子…';
      }
      $('result').hidden = true;
    }
    $('undoBtn').disabled = hist.length <= 1 && !busy;
    var turnDot = status.querySelector('.turn-dot');
    if (turnDot && !st.over) {
      turnDot.style.background = game.turn === E.P1 ? 'var(--red)' : 'var(--yellow)';
      turnDot.style.boxShadow = game.turn === E.P1
        ? 'inset 0 -2px 3px rgba(0,0,0,.3),0 0 0 4px rgba(215,38,61,.16)'
        : 'inset 0 -2px 3px rgba(0,0,0,.3),0 0 0 4px rgba(246,196,69,.18)';
    }
  }

  function levelName(n) {
    for (var i = 0; i < D.levels.length; i++) if (D.levels[i].id === n) return D.levels[i].label;
    return '普通';
  }

  function updateLog() {
    var list = $('logList');
    list.innerHTML = '';
    var lines = moveLog.slice(-10);
    lines.forEach(function (m) {
      var li = document.createElement('li');
      var dot = document.createElement('span');
      dot.className = 'mini-dot ' + (m.player === E.P1 ? 'p1' : 'p2');
      li.appendChild(dot);
      li.appendChild(document.createTextNode('第 ' + m.ply + ' 手 · ' + colorName(m.player) + ' · 第 ' + (m.col + 1) + ' 列'));
      list.appendChild(li);
    });
    if (!lines.length) {
      var empty = document.createElement('li');
      empty.textContent = '还没有落子。红方先手。';
      list.appendChild(empty);
    }
  }

  var moveLog = [];

  // ---- game flow ---------------------------------------------------------
  function clearAITimer() {
    aiToken += 1;
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
    busy = false;
  }

  function start() {
    clearAITimer();
    game = E.setup();
    hist = [E.clone(game)];
    moveLog = [];
    hoverCol = -1;
    scored = false;
    $('result').hidden = true;
    render(false);
    sfx('deal');
  }

  function recordWin(st) {
    if (scored) return;
    scored = true;
    if (st.draw) { /* draws do not add to either side */ }
    else if (st.winner === E.P1) scores.red += 1;
    else if (st.winner === E.P2) scores.yellow += 1;
    $('redScore').textContent = String(scores.red);
    $('yellowScore').textContent = String(scores.yellow);
  }

  function afterMove(animate) {
    var st = stateStatus();
    if (st.over) {
      if (!scored) { recordWin(st); sfx(st.draw ? 'notify' : 'win'); }
      else if (animate) sfx(st.draw ? 'notify' : 'win');
    } else if (animate) {
      sfx('move');
    }
    render(animate);
    if (!st.over && game.turn !== HUMAN) scheduleAI();
  }

  function drop(col) {
    if (busy || stateStatus().over) return false;
    if (game.turn !== HUMAN) return false;
    if (!E.isLegal(game, col)) { sfx('error'); return false; }
    var player = game.turn;
    var r = E.rowFor(game.b, col);
    game = E.applyMove(game, col);
    if (!game) return false;
    hist.push(E.clone(game));
    moveLog.push({ player: player, col: col, row: r, ply: game.plies });
    hoverCol = -1;
    afterMove(true);
    return true;
  }

  function scheduleAI() {
    if (stateStatus().over) return;
    busy = true;
    updateHud(stateStatus());
    renderHover();
    var token = ++aiToken;
    aiTimer = setTimeout(function () {
      if (token !== aiToken) return;
      aiTimer = null;
      var col = E.aiMove(game, level, level >= 3 ? 400 : 260);
      if (token !== aiToken) return;
      busy = false;
      if (col == null || !E.isLegal(game, col)) { render(false); return; }
      var player = game.turn;
      var r = E.rowFor(game.b, col);
      game = E.applyMove(game, col);
      hist.push(E.clone(game));
      moveLog.push({ player: player, col: col, row: r, ply: game.plies });
      afterMove(true);
    }, fast ? 6 : 200);
  }

  function undo() {
    clearAITimer();
    $('result').hidden = true;
    if (hist.length <= 1) { render(false); return; }
    hist.pop();
    // In AI mode remove the AI reply too, so the human is on move again.
    while (hist.length > 1 && hist[hist.length - 1].turn !== HUMAN) hist.pop();
    game = E.clone(hist[hist.length - 1]);
    while (moveLog.length && moveLog[moveLog.length - 1].ply > game.plies) moveLog.pop();
    scored = stateStatus().over;
    hoverCol = -1;
    render(false);
    sfx('click');
  }

  // ---- events ------------------------------------------------------------
  $('newBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);
  $('undoBtn').addEventListener('click', undo);
  $('level').addEventListener('change', function () {
    level = Number($('level').value) || 2;
    sfx('click');
    // A strength change applies to the next AI decision; no restart needed.
    if (!busy && !stateStatus().over && game.turn !== HUMAN) scheduleAI();
  });

  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key >= '1' && e.key <= '7') {
      e.preventDefault();
      drop(Number(e.key) - 1);
    } else if (e.key === 'u' || e.key === 'U') {
      e.preventDefault(); undo();
    } else if (e.key === 'n' || e.key === 'N') {
      e.preventDefault(); start();
    }
  });

  // Public test hook: public information only.
  window.__premium = {
    state: function () {
      var v = E.publicView(game, 0);
      v.level = level;
      v.busy = busy;
      v.scores = { red: scores.red, yellow: scores.yellow };
      v.moveCount = moveLog.length;
      v.history = hist.length;
      return v;
    },
    over: function () { return stateStatus().over; },
    start: start,
    drop: drop,
    undo: undo,
    aiMove: function () { return E.aiMove(game, level, level >= 3 ? 400 : 260); },
    setLevel: function (n) { level = Number(n) || 2; $('level').value = String(level); },
    hover: function (c) { hoverCol = c; renderHover(); },
    level: function () { return level; },
    fast: fast
  };

  buildBoard();
  start();
})();
</script>
</body>
</html>
