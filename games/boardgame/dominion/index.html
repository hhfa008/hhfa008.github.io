<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>领土 · Dominion 简化版（人机对战）</title>
<meta name="description" content="与 AI 对战简化版 Dominion：牌库构筑、购买行动/财宝/胜利卡，洗牌抽五张，终局牌库分高者胜。">
<meta name="theme-color" content="#251b2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23251b2e'/%3E%3Cpath d='M9 6h14v20l-7-5-7 5z' fill='%23d8b26a'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#1c1424;--panel:#2a1f36;--panel2:#372845;--ink:#f2ecf7;--muted:#b9a9c9;--gold:#d8b26a;--gold2:#f1d9a8;
  --line:#48365c;--green:#83c99a;--red:#d78373;--vp:#a78be0;--coin:#d8b26a;--action:#83c99a;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1000px 460px at 50% -80px,#352544,#1c1424 64%);color:var(--ink);font-family:var(--sans);line-height:1.45;min-height:100vh;overflow-x:hidden}
.wrap{max-width:1080px;margin:0 auto;padding:12px 12px 40px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:19px;margin:0;color:var(--gold2);letter-spacing:.4px}
h1 small{font-size:11px;color:var(--muted);font-weight:400;margin-left:5px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:12px;color:var(--muted)}
.pill b{color:var(--gold2);font-size:15px;margin-left:4px}
button{font-family:inherit;min-height:44px;min-width:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13px;padding:7px 11px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--gold);border-color:var(--gold);color:#251b2e;font-weight:700}
button.ghost{background:transparent}
.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;align-items:start}
.panel{background:rgba(42,31,54,.9);border:1px solid var(--line);border-radius:13px;padding:10px;box-shadow:0 6px 18px rgba(0,0,0,.28);margin-bottom:10px}
.panel h2{font-size:12px;color:var(--muted);margin:0 0 8px;letter-spacing:.4px;font-weight:600}
.supply{display:grid;gap:6px}
.sup{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:6px;background:#32253f}
.sup .tag{width:8px;height:34px;border-radius:4px;flex:none}
.sup .info{flex:1;min-width:110px}
.sup .nm{font-size:13px;font-weight:700}
.sup .fx{font-size:10.5px;color:var(--muted)}
.sup .left{font-size:11px;color:var(--muted);min-width:40px;text-align:right}
.sup .cost{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#251b2e;font-weight:800;font-size:12px;flex:none}
.sup button{min-height:38px;padding:4px 9px;font-size:11.5px}
.hand{display:flex;flex-wrap:wrap;gap:7px}
.hcard{border:1px solid var(--line);border-radius:10px;background:#32253f;padding:6px 8px;min-width:84px;display:flex;flex-direction:column;gap:3px}
.hcard .nm{font-size:13px;font-weight:700}
.hcard .meta{font-size:10.5px;color:var(--muted)}
.hcard .row{display:flex;gap:5px;align-items:center}
.hcard button{min-height:36px;padding:3px 8px;font-size:11px}
.phase-box{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:6px 0}
.coin{display:inline-flex;align-items:center;gap:5px;background:#241a2e;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px}
.coin b{color:var(--gold2);font-size:16px}
.status{font-size:13px;color:var(--gold2);min-height:20px;margin:6px 0}
.log{max-height:140px;overflow:auto;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.log div{padding:2px 0}
.opp{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chip{background:#241a2e;border:1px solid var(--line);border-radius:7px;padding:4px 7px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.overlay{position:fixed;inset:0;background:rgba(9,6,13,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
.overlay.show{display:flex}
.dialog{background:var(--panel);border:1px solid var(--gold);border-radius:15px;padding:18px;max-width:400px;width:100%;text-align:center}
.dialog h3{margin:0 0 8px;color:var(--gold2)}
.dialog p{font-size:14px;color:#e8dff0}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
@media (max-width:430px){
  .wrap{padding:9px 9px 30px}
  h1{font-size:16px}
  .stats{width:100%}
  .sup .fx{display:none}
  .sup .info{min-width:80px}
  .hcard{min-width:76px}
  button{padding:6px 9px;font-size:12px}
  .panel{padding:8px;border-radius:11px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/dominion/">
<meta property="og:title" content="领土 · Dominion 简化版（人机对战）">
<meta property="og:description" content="与 AI 对战简化版 Dominion：牌库构筑、购买行动/财宝/胜利卡，洗牌抽五张，终局牌库分高者胜。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hhfa008.github.io/games/boardgame/dominion/">
</head>
<body>
<div class="wrap">
  <header>
    <h1>领土 <small>Dominion · 简化版</small></h1>
    <div class="stats" aria-label="对局统计">
      <div class="pill">你 <b id="score-human">0</b> 分</div>
      <div class="pill">AI <b id="score-ai">0</b> 分</div>
      <div class="pill">动作 <b id="turn-count">0</b></div>
      <button id="restart" class="ghost" aria-label="重新开始一局">重开</button>
    </div>
  </header>

  <main class="layout">
    <div>
      <section class="panel" aria-label="公共牌堆">
        <h2>公共牌堆 · 购买阶段点击买入</h2>
        <div id="supply" class="supply"></div>
      </section>
      <section class="panel" aria-label="规则提示">
        <h2>提示</h2>
        <div class="hint">行动阶段先打行动牌，再结束行动；购买阶段自动打出所有财宝，用金币买牌。行省堆空或任意三个牌堆空时游戏结束，牌库里的胜利卡总分最高者获胜。</div>
        <div id="log" class="log" aria-label="对局日志"></div>
      </section>
    </div>

    <div>
      <section class="panel" aria-label="当前回合">
        <h2>你的回合</h2>
        <div class="phase-box">
          <span class="coin">金币 <b id="coins">0</b></span>
          <span class="coin">行动 <b id="actions">1</b></span>
          <span class="coin">购买 <b id="buys">1</b></span>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="hand" class="hand" aria-label="你的手牌"></div>
        <div class="phase-box" style="margin-top:9px">
          <button id="end-phase" class="primary" aria-label="结束当前阶段">结束行动阶段</button>
        </div>
      </section>
      <section class="panel" aria-label="对手状态">
        <h2>AI 状态</h2>
        <div id="opp" class="opp"></div>
      </section>
      <section class="panel" aria-label="牌堆概览">
        <h2>你的牌堆</h2>
        <div id="self-info" class="opp"></div>
      </section>
    </div>
  </main>
</div>

<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="result-title">
  <div class="dialog">
    <h3 id="result-title">本局结束</h3>
    <p id="result-text"></p>
    <button id="again" class="primary" aria-label="再来一局">再来一局</button>
  </div>
</div>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.DominionEngine;
  var TYPE_COLOR = { treasure: '#d8b26a', victory: '#a78be0', action: '#83c99a' };
  var TYPE_NAME = { treasure: '财宝', victory: '胜利', action: '行动' };
  var game, aiTimer = null, turnNo = 1;

  function $(id) { return document.getElementById(id); }
  function esc(t) {
    return String(t).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; });
  }
  function effectText(c) {
    var parts = [];
    if (c.coins) parts.push('+' + c.coins + ' 金币');
    if (c.cards) parts.push('+' + c.cards + ' 牌');
    if (c.actions) parts.push('+' + c.actions + ' 行动');
    if (c.buys) parts.push('+' + c.buys + ' 购买');
    if (c.attack) parts.push('对手弃到 3 张');
    if (c.gain) parts.push('获得' + E.CARD_BY_ID[c.gain].name);
    if (c.vp) parts.push(c.vp + ' 分');
    return parts.join(' · ') || '—';
  }
  function legalBuy(id) {
    return E.legalMoves(game).some(function (m) { return m.type === 'buy' && m.cardId === id; });
  }
  function legalPlay(id) {
    return E.legalMoves(game).some(function (m) { return m.type === 'playAction' && m.cardId === id; });
  }
  function countHand(id) {
    return game.players[0].hand.filter(function (x) { return x === id; }).length;
  }

  function renderSupply() {
    $('supply').innerHTML = E.CARDS.map(function (c) {
      var left = game.supply[c.id];
      var afford = legalBuy(c.id) && game.turn === 0 && game.phase === 'buy';
      return '<div class="sup">' +
        '<span class="tag" style="background:' + TYPE_COLOR[c.type] + '"></span>' +
        '<span class="cost" aria-label="费用 ' + c.cost + '">' + c.cost + '</span>' +
        '<div class="info"><div class="nm">' + c.name + ' <span style="font-size:10px;color:' + TYPE_COLOR[c.type] + '">' + TYPE_NAME[c.type] + '</span></div>' +
        '<div class="fx">' + effectText(c) + '</div></div>' +
        '<span class="left">余 ' + left + '</span>' +
        '<button data-buy="' + c.id + '"' + (afford ? '' : ' disabled') + ' aria-label="购买' + c.name + '，费用 ' + c.cost + '">买</button>' +
        '</div>';
    }).join('');
    Array.prototype.forEach.call($('supply').querySelectorAll('button[data-buy]'), function (b) {
      b.addEventListener('click', function () { humanBuy(b.getAttribute('data-buy')); });
    });
  }

  function renderHand() {
    var hand = game.players[0].hand;
    var unique = [];
    hand.forEach(function (id) { if (unique.indexOf(id) < 0) unique.push(id); });
    if (!unique.length) {
      $('hand').innerHTML = '<span class="hint">手牌为空</span>';
      return;
    }
    $('hand').innerHTML = unique.map(function (id) {
      var c = E.CARD_BY_ID[id];
      var playable = legalPlay(id) && game.turn === 0 && game.phase === 'action';
      return '<div class="hcard">' +
        '<div class="row"><span class="nm">' + c.name + '</span><span class="meta">×' + countHand(id) + '</span></div>' +
        '<div class="meta">' + effectText(c) + '</div>' +
        '<div class="row">' +
        (c.type === 'action' ? '<button data-play="' + id + '"' + (playable ? '' : ' disabled') + ' aria-label="打出' + c.name + '">打出</button>' : '<span class="meta">' + TYPE_NAME[c.type] + '</span>') +
        '</div></div>';
    }).join('');
    Array.prototype.forEach.call($('hand').querySelectorAll('button[data-play]'), function (b) {
      b.addEventListener('click', function () { humanPlay(b.getAttribute('data-play')); });
    });
  }

  function render() {
    var sc = E.score(game);
    $('score-human').textContent = sc.human;
    $('score-ai').textContent = sc.ai;
    $('turn-count').textContent = game.moves;
    $('coins').textContent = game.coins;
    $('actions').textContent = game.actions;
    $('buys').textContent = game.buys;
    renderSupply();
    renderHand();
    var endBtn = $('end-phase');
    endBtn.textContent = game.phase === 'action' ? '结束行动阶段' : '结束购买阶段';
    endBtn.disabled = game.turn !== 0 || game.over;
    var ai = game.players[1];
    $('opp').innerHTML = '<span class="chip">手牌 ' + ai.hand.length + '</span>' +
      '<span class="chip">牌库 ' + ai.deck.length + '</span>' +
      '<span class="chip">弃牌 ' + ai.discard.length + '</span>' +
      '<span class="chip">出牌区 ' + ai.playArea.length + '</span>';
    var me = game.players[0];
    $('self-info').innerHTML = '<span class="chip">手牌 ' + me.hand.length + '</span>' +
      '<span class="chip">牌库 ' + me.deck.length + '</span>' +
      '<span class="chip">弃牌 ' + me.discard.length + '</span>' +
      '<span class="chip">总卡数 ' + (me.hand.length + me.deck.length + me.discard.length + me.playArea.length) + '</span>';
    var st;
    if (game.over) st = '游戏结束，正在结算。';
    else if (game.turn === 0) st = game.phase === 'action' ? '行动阶段：打出手中的行动牌，或结束行动。' : '购买阶段：金币 ' + game.coins + '，购买 ' + game.buys + ' 次。';
    else st = 'AI 正在行动…';
    $('status').textContent = st;
    $('log').innerHTML = game.log.slice(-16).reverse().map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('');
    if (game.over) showResult();
  }

  function humanPlay(id) {
    if (game.turn !== 0 || game.over) return;
    try { game = E.applyMove(game, { type: 'playAction', cardId: id }); render(); }
    catch (e) { $('status').textContent = '无法打出：' + e.message; }
  }
  function humanBuy(id) {
    if (game.turn !== 0 || game.over) return;
    try { game = E.applyMove(game, { type: 'buy', cardId: id }); render(); }
    catch (e) { $('status').textContent = '无法购买：' + e.message; }
  }
  function endPhase() {
    if (game.turn !== 0 || game.over) return;
    try { game = E.applyMove(game, { type: 'endPhase' }); if (game.turn === 1) turnNo += 0; render(); scheduleAI(); }
    catch (e) { $('status').textContent = '无法结束阶段：' + e.message; }
  }

  function showResult() {
    var sc = E.score(game);
    var w = E.winner(game);
    $('result-title').textContent = w === 'human' ? '你赢了！' : (w === 'ai' ? 'AI 获胜' : '平局');
    $('result-text').textContent = '牌库总分：你 ' + sc.human + ' 比 ' + sc.ai + ' AI。';
    $('overlay').classList.add('show');
  }

  function scheduleAI() {
    if (aiTimer) clearTimeout(aiTimer);
    if (game.over || game.turn !== 1) return;
    aiTimer = setTimeout(function () {
      try { game = E.applyMove(game, E.aiMove(game)); render(); scheduleAI(); }
      catch (e) { $('status').textContent = 'AI 出错：' + e.message; }
    }, 480);
  }

  function start() {
    if (aiTimer) clearTimeout(aiTimer);
    game = E.createGame({ seed: (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, humanFirst: true });
    turnNo = 1;
    $('overlay').classList.remove('show');
    render();
  }

  $('end-phase').addEventListener('click', endPhase);
  $('restart').addEventListener('click', start);
  $('again').addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
