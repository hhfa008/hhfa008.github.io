<meta name="description" content="荒野轮盘 · 美式微桌游 · 美式微桌游：玩法、操作与计分说明，中文离线可玩的原创桌游微游戏。">
<style>:root{--bg:#14100b;--panel:#211a12;--panel2:#33271a;--ink:#f7efe2;--muted:#c9b696;--gold:#f2c14e;--red:#ef6b5b;--green:#5fd39a;--line:#4d3b28}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(700px 420px at 50% -10%,#3a2b1a,#0d0a07 70%) fixed;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
a{color:var(--gold)}
.wrap{max-width:420px;margin:0 auto;padding:8px 12px 36px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
.top h1{font-size:18px;margin:0;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:56px;padding:0 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:10px 12px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(1px)}
button:disabled{opacity:.42;cursor:default}
button.primary{background:linear-gradient(160deg,#f3cd6b,#d99b2b);color:#2a1a00;font-weight:800;border:none}
button.ghost{background:transparent}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:3px 0}
.stat b{color:var(--gold)}
.bar{height:8px;background:#0e0a06;border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e3b04b,#f2d78a)}
.log{font-size:12.5px;color:var(--muted);max-height:140px;overflow:auto;margin-top:8px}
.log div{padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
.turn{text-align:center;color:var(--gold);font-weight:800;margin:8px 0;font-size:14px}
.big{font-size:19px;font-weight:900;text-align:center;margin:8px 0;line-height:1.35}
.note{font-size:13px;color:var(--muted)}
.end{text-align:center;padding:8px}
.end h2{font-size:20px;margin:4px 0 6px}
@media (max-width:360px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:8px 10px 30px}}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.tools button{min-height:44px;min-width:44px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.tools .streak{margin-left:auto;font-size:12px;color:var(--muted)}
.scene{margin:0 0 10px;font-size:12px;line-height:1.5;color:var(--muted)}

/* mini-quality: safe-area */
.wrap { --mini-safe-bottom: 30px; padding-bottom: calc(var(--mini-safe-bottom) + env(safe-area-inset-bottom, 0px)); }
/* mini-quality: reduced-motion */
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; } }

    if (!AudioCtor()) { current = name; return false; }
    if (!ensureCtx()) { current = name; return false; }
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) { /* ignore */ } }
    clearNodes();
    current = name;
    scheduleScene(name);
    if (timer) clearInterval(timer);
    // Rebuild the chord每 12 秒，形成缓慢的呼吸而不是一条死板长音。
    timer = setInterval(function () {
      if (!ctx || !current) return;
      clearNodes();
      scheduleScene(current);
    }, 12000);
    return true;
  }

  function stop() {
    clearNodes();
    current = null;
    return true;
  }

  function setVolume(v) {
    volume = Math.max(0, Math.min(1, Number(v) || 0));
    storageSet(VOLUME_KEY, String(volume));
    return volume;
  }

  function mute(on) {
    muted = Boolean(on);
    storageSet(MUTE_KEY, muted ? '1' : '0');
    fadeMaster(muted ? 0 : volume * (SCENES[current] || SCENES.table).gain, 0.4);
    return muted;
  }

  function scenes() { return Object.keys(SCENES); }
  function isMuted() { return muted; }
  function currentScene() { return current; }
  function getVolume() { return volume; }

  return {
    play: play,
    stop: stop,
    setVolume: setVolume,
    getVolume: getVolume,
    mute: mute,

<script>
(function () {
  'use strict';
  var E = window.MiniEngine;
  var SLUG = "mini-ameri-b-20";
  var mode = /[?&]mode=daily\b/.test(location.search) ? 'daily' : 'free';
  var seed = 0;
  var settled = false;
  var bgmOn = false;
  var scene = Scene.create({
    id: SLUG,
    ambience: 'dungeon',
    cast: [{ id: 'you', name: '你', role: 'player' }, { id: 'ai', name: '对手', role: 'ai' }]
  });
  var replay = Replay.create({ game: SLUG, seed: seed, params: { mode: mode } });
  var origCreate = E.createGame;
  var origApply = E.applyAction;
  var origAI = E.aiAction;
  var prebuilt = null;

  function $(id) { return document.getElementById(id); }
  function save() { try { Replay.saveLocal('replay.' + SLUG, replay); } catch (e) { /* storage optional */ } }
  function refreshStreak() {
    var el = $('streak');
    if (!el) return;
    var st = GameProgress.dailyState(SLUG);
    el.textContent = (mode === 'daily' ? '每日 · ' + (st.done ? '今日已完成' : '今日未完成') : '自由模式') + ' · 连胜 ' + st.streak;
  }
  function paint() {
    var el = $('sceneLog');
    if (!el) return;
    var ev = scene.events(1)[0];
    var p = (ev && ev.payload) || {};
    if (!ev) el.textContent = '战报：准备开始。';
    else if (ev.type === 'move') el.textContent = '战报：你选择了「' + (p.action === 'rest' ? '休整' : '深入') + '」。';
    else if (ev.type === 'settle') el.textContent = '战报：最终 ' + p.score + ' : ' + p.ai + '。';
    else el.textContent = '战报：准备开始。';
  }
  function finish(state) {
    if (settled) return;
    settled = true;
    var score = Number(state.players[0] && state.players[0].score) || 0;
    var ai = Number(state.players[1] && state.players[1].score) || 0;
    scene.updateCast('you', { emotion: score > ai ? 'happy' : (score === ai ? 'neutral' : 'sad') });
    scene.emit('settle', { score: score, ai: ai, mode: mode });
    try { localStorage.removeItem('replay.' + SLUG); } catch (e) { /* ignore */ }
    try { GameProgress.record({ slug: SLUG, mode: mode, score: score }); } catch (e) { /* storage optional */ }
    refreshStreak();
    paint();
  }
  function pumpAi(g) {
    var guard = 0;
    while (g && !g.over && g.turn === 1 && guard < 60) {
      guard += 1;
      var a = null;
      try { a = origAI(g); } catch (e) { a = null; }
      if (!a) break;
      g = origApply(g, a);
    }
    return g;
  }
  function replayState(saved) {
    var g = origCreate({ seed: saved.seed });
    var acts = saved.actions();
    for (var i = 0; i < acts.length; i += 1) {
      if (g.over) break;
      g = origApply(g, acts[i].action);
      g = pumpAi(g);
    }
    return g;
  }
  function startBgm() {
    if (bgmOn) return;
    bgmOn = true;
    try { Bgm.play(scene.ambience); } catch (e) { /* audio optional */ }
  }
  document.addEventListener('pointerdown', startBgm, { once: true });

  E.createGame = function () {
    if (prebuilt) { var p = prebuilt; prebuilt = null; settled = false; return p; }
    seed = mode === 'daily' ? GameProgress.dailySeed(SLUG) : (Date.now() % 1000000000);
    replay = Replay.create({ game: SLUG, seed: seed, params: { mode: mode } });
    settled = false;
    return origCreate({ seed: seed });
  };
  E.applyAction = function (state, action) {
    var playerTurn = !!(state && !state.over && state.turn === 0);
    var next = origApply(state, action);
    if (playerTurn) {
      replay.add({ action: action });
      save();
      scene.emit('move', { action: action });
      paint();
    }
    if (next && next.over) finish(next);
    return next;
  };

  (function restore() {
    var saved = null;
    try { saved = Replay.loadLocal('replay.' + SLUG); } catch (e) { saved = null; }
    if (!saved || !saved.actions().length) return;
    var urlDaily = /[?&]mode=daily\b/.test(location.search);
    if (urlDaily && (!saved.params || saved.params.mode !== 'daily')) return;
    mode = (saved.params && saved.params.mode) || 'free';
    seed = saved.seed;
    replay = saved;
    prebuilt = replayState(saved);
  })();

  $('freeBtn').addEventListener('click', function () {
    try { localStorage.removeItem('replay.' + SLUG); } catch (e) { /* ignore */ }
    location.search = '?mode=free';
  });
  $('dailyBtn').addEventListener('click', function () {
    try { localStorage.removeItem('replay.' + SLUG); } catch (e) { /* ignore */ }
    location.search = '?mode=daily';
  });
  $('bgmBtn').addEventListener('click', function () {
    startBgm();
    var muted = Bgm.mute(!Bgm.isMuted());
    var btn = $('bgmBtn');
    btn.textContent = muted ? '音景 关' : '音景 开';
    btn.setAttribute('aria-pressed', muted ? 'false' : 'true');
  });
  refreshStreak();
  paint();
})();
</script>
<script>
(function () {
  'use strict';
  var E = window.MiniEngine, game;
  function $(id) { return document.getElementById(id); }
  function render() {
    var p = game.players[0], q = game.players[1];
    $('round').textContent = Math.min(game.round, game.maxRounds) + ' / ' + game.maxRounds;
    $('chips0').textContent = p.chips;
    $('score0').textContent = p.score;
    $('chips1').textContent = q.chips;
    $('score1').textContent = q.score;
    $('turn').textContent = game.over ? ('结束：' + game.reason) : ('第 ' + game.round + ' 轮，选择暗标');
    $('card').textContent = game.lastCard
      ? (game.lastCard.type === 'safe' ? '安全卡 · 底分 ' + game.lastCard.pot : '陷阱卡 · 扣分风险')
      : '牌堆已洗好';
    $('log').innerHTML = game.log.slice(-10).map(function (t) {
      return '<div>' + t.replace(/</g, '&lt;') + '</div>';
    }).join('');
    [0, 1, 2, 3].forEach(function (i) { $('bid' + i).disabled = game.over || p.chips < i; });
  }
  function act(bid) {
    if (game.over || game.players[0].chips < bid) return;
    E.applyAction(game, bid);
    render();
  }
  [0, 1, 2, 3].forEach(function (i) { $('bid' + i).onclick = function () { act(i); }; });
  $('reset').onclick = function () { game = E.createGame({ seed: (Date.now() % 900000) + 1 }); render(); };
  game = E.createGame({ seed: (Date.now() % 900000) + 1 });
  render();
})();
</script>
