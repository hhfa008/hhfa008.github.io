.app{width:100%;max-width:390px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top h1{font-size:20px;line-height:1.25;margin:0;letter-spacing:.5px}
.top a{color:#8fd4ff;font-size:13px;text-decoration:none;padding:10px 8px;border-radius:8px}
.lead{color:#9fb0c0;font-size:13px;line-height:1.6;margin:0 0 12px}
.panel{background:#16222e;border:1px solid #26384a;border-radius:14px;padding:14px}
.prompt{font-size:15px;line-height:1.55;margin:0 0 12px;color:#f2f7fc}

.cell{min-height:48px;border:1px solid #33495e;background:#1d2d3d;color:#eef3f8;border-radius:10px;font-size:18px;font-weight:600;line-height:1.2;white-space:pre-line;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;cursor:pointer;touch-action:manipulation;user-select:none}
.cell:disabled{cursor:default;opacity:.92}
.cell.sel{outline:3px solid #ffd166;outline-offset:1px;background:#2a3f52}
.cell.ok{background:#1d4034;border-color:#3d7a5c;color:#c7f5da}
.cell.bad{background:#4a2428;border-color:#7d3b42;color:#ffd0d5}
.cell.wall{background:#0c141d;border-color:#1b2a38;color:#8fa8c4;font-size:14px}
.cell.blank{background:#101b26;border-color:#223547;color:transparent}
.cell.player{background:#234b63;border-color:#4c8aab;color:#e6f7ff;font-size:15px}
.cell.goal{background:#3c3418;border-color:#7c6a2a;color:#ffe9a6;font-size:15px}
.cell.key{background:#3a2f1a;border-color:#7c632e;color:#ffdd93}
.cell.done{background:#1b3a2e;border-color:#376b53;color:#b8e9cc}
.cell.on{background:#4b3a12;border-color:#a8862c;color:#ffe08a}
.cell.off{background:#182532;border-color:#2c4054;color:#6f8499}
.cell.jug{background:#163345;border-color:#2f5c78;color:#bfe9ff}
.cell.tube{min-height:96px;background:#14212d;border-color:#2f465c;font-size:15px;letter-spacing:2px}
.cell.person{min-height:68px;font-size:14px;font-weight:500;background:#1b2b3a}
.cell.num{font-size:22px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.actions button{flex:1 1 88px;min-height:48px;border-radius:10px;border:1px solid #3d6784;background:#1d3d52;color:#e9f6ff;font-size:15px;font-weight:600;cursor:pointer;touch-action:manipulation;padding:6px 8px}
.actions button:disabled{opacity:.4;cursor:default}
.actions button:active{transform:translateY(1px)}
.notes{margin:0;padding:0;list-style:none;color:#9fb3c4;font-size:13px;line-height:1.7;white-space:pre-line}
.status{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:#173246;color:#cfeaff;font-size:14px;text-align:center}
.status.win{background:#16392b;color:#c8f7d9}
.status.lose{background:#3d2428;color:#ffd3d8}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px}

.brand{color:#61788b;font-size:12px;text-align:center;margin-top:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.tools button{min-height:44px;min-width:44px;padding:0 12px;border-radius:11px;border:1px solid #34526b;background:#16222e;color:#bcd7ea;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.tools .streak{margin-left:auto;font-size:12px;color:#8ba0b3}
.scene{margin:8px 0 0;font-size:12px;line-height:1.5;color:#8ba0b3;text-align:center}

    var now = ctx.currentTime;
    var master = ctx.createGain();
    master.gain.value = muted ? 0 : volume * cfg.gain;
    master.connect(ctx.destination);
    nodes.push(master);

    cfg.chord.forEach(function (semi, i) {
      var osc = ctx.createOscillator();
      osc.type = cfg.wave;
      osc.frequency.value = cfg.root * Math.pow(2, semi / 12);
      var g = ctx.createGain();
      g.gain.value = 0.33;
      var lfo = ctx.createOscillator();
      lfo.frequency.value = cfg.lfo * (1 + i * 0.13);
      var lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.18;
      lfo.connect(lfoGain);
      lfoGain.connect(g.gain);
      osc.connect(g);
      g.connect(master);
      osc.start(now);
      lfo.start(now);
      nodes.push(osc, lfo, g, lfoGain);
    });
  }

  function fadeMaster(to, seconds) {
    var master = nodes.filter(function (n) { return n.gain && n.context; })[0];
    if (!master || !ctx) return;
    try {
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(to, ctx.currentTime + (seconds || 0.8));
    } catch (e) { /* ignore */ }
  }

  function play(scene) {
    var name = SCENES[scene] ? scene : 'table';
    if (!AudioCtor()) { current = name; return false; }
    if (!ensureCtx()) { current = name; return false; }
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) { /* ignore */ } }
    clearNodes();
    current = name;
    scheduleScene(name);
    if (timer) clearInterval(timer);
    // Rebuild the chord每 12 秒，形成缓慢的呼吸而不是一条死板长音。
    timer = setInterval(function () {
      if (!ctx || !current) return;
      clearNodes();
      scheduleScene(current);
    }, 12000);
    return true;
  }

  function stop() {
    clearNodes();
    current = null;
    return true;
  }

  function setVolume(v) {
    volume = Math.max(0, Math.min(1, Number(v) || 0));
    storageSet(VOLUME_KEY, String(volume));
    return volume;
  }

  function mute(on) {
    muted = Boolean(on);
    storageSet(MUTE_KEY, muted ? '1' : '0');
    fadeMaster(muted ? 0 : volume * (SCENES[current] || SCENES.table).gain, 0.4);
    return muted;
  }

  function scenes() { return Object.keys(SCENES); }
  function isMuted() { return muted; }
  function currentScene() { return current; }
  function getVolume() { return volume; }

  return {
    play: play,
    stop: stop,
    setVolume: setVolume,
    getVolume: getVolume,
    mute: mute,
    isMuted: isMuted,
    current: currentScene,
    scenes: scenes,
    version: '1.0.0'
  };
});

return module.exports;})();
</script>
<script>
(function(){
  var E = window.MiniEngine;
  var params = new URLSearchParams(location.search);
  var SLUG = "mini-puzzle-a-01";
  var mode = "free";
  var currentSeed = Number(params.get("seed")) || (Date.now() % 1000000000);
  var settled = false;
  var bgmOn = false;
  var scene = Scene.create({
    id: SLUG,
    ambience: "night",
    cast: [{ id: "you", name: "你", role: "player" }]
  });
  var replay = Replay.create({ game: SLUG, seed: currentSeed, params: { mode: mode } });
  var state = E.create(currentSeed);
  var promptEl = document.getElementById("prompt");
  var gridEl = document.getElementById("grid");
  var actionsEl = document.getElementById("actions");
  var notesEl = document.getElementById("notes");
  var statusEl = document.getElementById("status");

  function $(id) { return document.getElementById(id); }
  function newSeed() {
    currentSeed = mode === "daily" ? GameProgress.dailySeed(SLUG) : (Date.now() % 1000000000);
    return currentSeed;
  }
  function saveReplay() {
    try { Replay.saveLocal("replay." + SLUG, replay); } catch (e) { /* storage optional */ }
  }
  function refreshStreak() {
    var el = $("streak");
    if (!el) return;
    var st = GameProgress.dailyState(SLUG);
    el.textContent = (mode === "daily" ? "每日 · " + (st.done ? "今日已完成" : "今日未完成") : "自由模式") + " · 连胜 " + st.streak;
  }
  function describe(event) {
    if (!event) return "战报：准备开始。";
    var p = event.payload || {};
    if (event.type === "move") return "战报：执行了「" + p.label + "」。";
    if (event.type === "settle") return "战报：本局" + (p.won ? "完成" : "结束") + "。";
    return "战报：准备开始。";
  }
  function paintLog() {
    var el = $("sceneLog");
    if (el) el.textContent = describe(scene.events(1)[0]);
  }
  function finish(won) {
    if (settled) return;
    settled = true;
    scene.updateCast("you", { emotion: won ? "happy" : "neutral" });
    scene.emit("settle", { won: won, mode: mode });
    try { localStorage.removeItem("replay." + SLUG); } catch (e) { /* ignore */ }
    try { GameProgress.record({ slug: SLUG, mode: mode, score: won ? 1 : 0 }); } catch (e) { /* storage optional */ }
    refreshStreak();
    paintLog();
  }
  function startBgm() {
    if (bgmOn) return;
    bgmOn = true;
    try { Bgm.play(scene.ambience); } catch (e) { /* audio optional */ }
  }
  document.addEventListener("pointerdown", startBgm, { once: true });

  function apply(msg, label) {
    state = E.act(state, msg);
    replay.add({ msg: msg });
    saveReplay();
    scene.emit("move", { label: label || msg.type });
    paintLog();
    render();
  }
  function reset(nextMode) {
    if (nextMode) mode = nextMode;
    if (nextMode) { var rb = $("resumeBtn"); if (rb) rb.hidden = true; }
    settled = false;
    state = E.create(newSeed());
    replay = Replay.create({ game: SLUG, seed: currentSeed, params: { mode: mode } });
    try { localStorage.removeItem("replay." + SLUG); } catch (e) { /* ignore */ }
    refreshStreak();
    paintLog();
    render();
  }
  function render(){
    var v = E.view(state);
    promptEl.textContent = v.prompt;
    gridEl.innerHTML = "";
    gridEl.className = "grid" + (v.cells.length >= 9 ? " square" : "");
    gridEl.style.gridTemplateColumns = "repeat(" + (v.cols || 4) + ", minmax(0, 1fr))";
    v.cells.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "cell " + (c.tone || "") + (c.state === "sel" ? " sel" : "");
      b.textContent = c.label;
      b.disabled = !!c.disabled;
      b.addEventListener("click", function(){
        apply({ type: "cell", id: c.id }, c.label ? "格子 " + c.label : "格子 " + c.id);
      });
      gridEl.appendChild(b);
    });
    actionsEl.innerHTML = "";
    (v.actions || []).forEach(function(a){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = a.label;
      b.disabled = !!a.disabled;
      b.addEventListener("click", function(){
        var msg;
        if (a.d !== undefined) msg = { type: "digit", d: a.d };
        else msg = { type: "action", id: a.id };
        apply(msg, a.label);
      });
      actionsEl.appendChild(b);
    });
    notesEl.innerHTML = "";
    (v.notes || []).forEach(function(n){
      var li = document.createElement("li");
      li.textContent = n;
      notesEl.appendChild(li);
    });
    var st = v.status || (E.solved(state) ? "win" : "playing");
    statusEl.className = "status " + st;
    if (st === "win") { statusEl.textContent = "完成！点击下方按钮挑战新一局。"; finish(true); }
    else if (st === "lose") { statusEl.textContent = "本局结束，点击重新开始再来一次。"; finish(false); }
    else statusEl.textContent = E.solved(state) ? "完成！" : "进行中";
  }
  document.getElementById("restart").addEventListener("click", function(){ reset("free"); });
  $("freeBtn").addEventListener("click", function(){ reset("free"); });
  $("dailyBtn").addEventListener("click", function(){ reset("daily"); });
  $("bgmBtn").addEventListener("click", function(){
    startBgm();
    var muted = Bgm.mute(!Bgm.isMuted());
    var btn = $("bgmBtn");
    btn.textContent = muted ? "音景 关" : "音景 开";
    btn.setAttribute("aria-pressed", muted ? "false" : "true");
  });
  (function resumePrompt(){
    var saved = null;
    try { saved = Replay.loadLocal("replay." + SLUG); } catch (e) { /* storage optional */ }
    var btn = $("resumeBtn");
    if (!btn || !saved || !saved.actions().length) return;
    btn.hidden = false;
    btn.addEventListener("click", function(){
      mode = (saved.params && saved.params.mode) || "free";
      currentSeed = saved.seed;
      settled = false;
      state = E.create(currentSeed);
      var acts = saved.actions();
      for (var i = 0; i < acts.length; i += 1) {
        state = E.act(state, acts[i].msg);
        if (E.solved(state)) break;
      }
      replay = saved;
      btn.hidden = true;
      refreshStreak();
      paintLog();
      render();
    });
  })();
  refreshStreak();
  paintLog();
  render();
})();
</script>
</body>
</html>
