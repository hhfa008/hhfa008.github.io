<!doctype html>
<!--
  Aeroplane Chess premium — online lobby and room board.
  Server-authoritative HTTP/JSON polling. Same-origin only, no external requests.
  Room / invite / password / reconnect / timeout takeover / leaderboard are
  provided by games/shared/online-room-server.mjs; this page only renders
  adapter.view() and submits plane choices. The dice never come from the client.
-->

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1520">
<meta name="description" content="飞行棋联机房间：创建或加入 2–4 人房，邀请码、断线重连、超时 AI 托管与结果榜。服务器权威掷骰与判定，客户端只选择移动哪一架飞机。">
<title>飞行棋 · 联机房间</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1520'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23e8c07a' stroke-width='3'/%3E%3Cpath d='M32 13l5 13 13 6v4l-11-3-2 10 5 5v3l-10-3-10 3v-3l5-5-2-10-11 3v-4l13-6z' fill='%23e8c07a'/%3E%3C/svg%3E">
<style>
  :root{
    --art-board:url("../../assets/art/premium/aeroplane/board-gloss.webp");
    --art-felt:url("../../assets/art/premium/aeroplane/table-felt.webp");
    --art-dice:url("../../assets/art/premium/aeroplane/dice.webp");
    --art-red:url("../../assets/art/premium/aeroplane/plane-token-red.webp");
    --art-yellow:url("../../assets/art/premium/aeroplane/plane-token-yellow.webp");
    --art-blue:url("../../assets/art/premium/aeroplane/plane-token-blue.webp");
    --art-green:url("../../assets/art/premium/aeroplane/plane-token-green.webp");
    --font-serif:"Songti SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --bg:#0b111a;--bg2:#121d2b;--panel:rgba(18,29,42,.94);--panel2:rgba(28,43,60,.8);
    --line:rgba(232,192,122,.28);--ink:#f4ecdc;--muted:#b9c4cf;--soft:#8494a4;
    --gold:#e8c07a;--gold2:#f6dfae;--red:#d5443c;--yellow:#e8b33c;--blue:#3e78c8;--green:#3d9b68;
    --sky:#8cc6ff;--danger:#ff9b88;--win:#7be0b0;--radius:18px;--tap:48px;
    --shadow:0 22px 48px rgba(0,0,0,.48);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 var(--font-sans);
    background:
      radial-gradient(900px 560px at 50% -18%,rgba(50,92,122,.36),transparent 62%),
      linear-gradient(168deg,var(--bg2),var(--bg) 64%);
    background-color:var(--bg);-webkit-tap-highlight-color:transparent;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.12;background:var(--art-felt) center/cover no-repeat;mix-blend-mode:soft-light}
  a{color:var(--gold);text-decoration:none}
  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:10px 12px 38px}
  .top{display:flex;align-items:center;gap:8px;padding:2px 0 11px}
  .top h1{margin:0;flex:1;text-align:center;font-family:var(--font-serif);font-weight:700;font-size:19px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-pill{display:inline-flex;align-items:center;justify-content:center;min-width:var(--tap);min-height:var(--tap);padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;font-weight:700;white-space:nowrap}
  .panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);padding:14px}
  .panel + .panel{margin-top:11px}
  .panel[hidden]{display:none}
  h2{margin:0 0 9px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .field{display:grid;gap:5px;margin-bottom:9px}
  .field label{font-size:12px;color:var(--muted);font-weight:800}
  input{font:inherit;font-size:16px;min-height:48px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.24);color:var(--ink);width:100%}
  button{font:inherit;font-size:14px;font-weight:800;min-height:var(--tap);padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;touch-action:manipulation}
  button:disabled{opacity:.42;cursor:default}
  button.primary{background:linear-gradient(160deg,var(--gold2),#c8993f);color:#241708;border:0}
  button.green{background:linear-gradient(160deg,#7be0b0,#2e9a72);color:#061d16;border:0}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row > button{flex:1;min-width:132px}
  .muted{color:var(--muted);font-size:12.5px;line-height:1.55}
  .err{color:var(--danger);font-size:13px;font-weight:800;min-height:18px;margin-top:5px}
  .roombar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .chip{display:inline-flex;align-items:center;min-height:32px;padding:2px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-size:12.5px;font-weight:800;color:var(--gold)}
  .seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:9px}
  .seat{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:9px 10px;min-width:0}
  .seat.turn{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(232,192,122,.55)}
  .seat.you{border-color:var(--sky)}
  .seat .name{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seat .name i{width:10px;height:10px;border-radius:50%;flex:none;display:block}
  .seat .meta{display:flex;justify-content:space-between;gap:4px;margin-top:2px;font-size:12px;color:var(--muted)}
  .seat .tag{font-size:12px;color:var(--gold);font-weight:800}
  .c0{background:var(--red)}.c1{background:var(--yellow)}.c2{background:var(--blue)}.c3{background:var(--green)}
  .board-shell{border-radius:20px;padding:8px;border:1px solid rgba(232,192,122,.32);background:linear-gradient(155deg,rgba(24,40,56,.32),rgba(8,14,22,.72)),var(--art-board) center/cover no-repeat;box-shadow:var(--shadow)}
  .board{position:relative;width:100%;aspect-ratio:1/1;isolation:isolate;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 46%,rgba(26,44,60,.34),rgba(7,12,19,.5))}
  .cell{position:absolute;border-radius:22%;border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3);z-index:2}
  .ring::before,.lane::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--art-board) center/cover;opacity:.20;mix-blend-mode:soft-light;pointer-events:none}
  .ring,.lane{box-shadow:inset 0 2px 0 rgba(255,255,255,.24),inset 0 -3px 4px rgba(0,0,0,.34),0 1px 2px rgba(0,0,0,.24)}
  .ring.c0{background:linear-gradient(150deg,#e05a50,#a92a23)}
  .ring.c1{background:linear-gradient(150deg,#f0c85a,#b88718)}
  .ring.c2{background:linear-gradient(150deg,#5f97e2,#24539b)}
  .ring.c3{background:linear-gradient(150deg,#5fbe8a,#1f7047)}
  .ring.start{box-shadow:inset 0 0 0 2px rgba(255,248,225,.78),inset 0 2px 0 rgba(255,255,255,.24),inset 0 -3px 4px rgba(0,0,0,.34)}
  .cell.target{box-shadow:inset 0 0 0 3px #8bf0c0,0 0 12px rgba(123,224,176,.55);z-index:7}
  .cell.target::after{content:"";position:absolute;inset:32%;border-radius:50%;background:rgba(255,255,255,.92)}
  .lane{opacity:.9;border-style:dashed;border-color:rgba(255,255,255,.34)}
  .lane.l0{background:linear-gradient(150deg,rgba(213,68,60,.82),rgba(120,26,22,.72))}
  .lane.l1{background:linear-gradient(150deg,rgba(232,179,60,.82),rgba(128,88,8,.72))}
  .lane.l2{background:linear-gradient(150deg,rgba(62,120,200,.82),rgba(20,52,104,.72))}
  .lane.l3{background:linear-gradient(150deg,rgba(61,155,104,.82),rgba(16,72,45,.72))}
  .base{position:absolute;border-radius:16%;border:1px dashed rgba(255,255,255,.20);background:rgba(8,16,26,.30);z-index:1;display:flex;align-items:flex-start;justify-content:center;padding-top:2px;overflow:hidden}
  .base::before{content:"";position:absolute;inset:0;background:var(--art-board) center/cover;opacity:.20;mix-blend-mode:soft-light;pointer-events:none}
  .base.b0{background:radial-gradient(circle at 30% 24%,rgba(213,68,60,.17),rgba(80,20,18,.05) 64%,transparent)}
  .base.b1{background:radial-gradient(circle at 70% 24%,rgba(232,179,60,.17),rgba(92,62,6,.05) 64%,transparent)}
  .base.b2{background:radial-gradient(circle at 70% 76%,rgba(62,120,200,.17),rgba(14,38,80,.05) 64%,transparent)}
  .base.b3{background:radial-gradient(circle at 30% 76%,rgba(61,155,104,.17),rgba(10,56,34,.05) 64%,transparent)}
  .base .bl{position:relative;margin-top:3px;font-size:12px;font-weight:800;color:rgba(255,255,255,.72);text-shadow:0 1px 2px rgba(0,0,0,.55);pointer-events:none;white-space:nowrap}
  .finish-zone{position:absolute;z-index:3;border-radius:18%;border:1px solid rgba(246,223,174,.72);background:radial-gradient(circle at 50% 44%,rgba(246,223,174,.32),rgba(90,70,30,.22) 70%,rgba(8,14,22,.4));display:grid;place-items:center;pointer-events:none}
  .finish-zone span{font-family:var(--font-serif);font-size:12px;font-weight:700;color:var(--gold2);text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .plane-layer{position:absolute;inset:0;z-index:6;pointer-events:none}
  .plane{position:absolute;border-radius:0;background-size:contain;background-position:center;background-repeat:no-repeat;border:0;box-shadow:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.58));pointer-events:auto;z-index:6}
  .plane.p0{color:var(--red)}.plane.p1{color:var(--yellow)}.plane.p2{color:var(--blue)}.plane.p3{color:var(--green)}
  .plane svg{width:100%;height:100%;display:block}
  .plane.movable{cursor:pointer;filter:drop-shadow(0 0 4px rgba(123,224,176,.95)) drop-shadow(0 2px 3px rgba(0,0,0,.62));z-index:9}
  .plane.done{opacity:.94;filter:drop-shadow(0 0 3px rgba(246,223,174,.92))}
  .status{display:flex;align-items:center;gap:9px;min-height:52px;margin-top:9px;padding:7px 10px;border-radius:13px;border:1px solid var(--line);background:var(--panel)}
  .die{position:relative;width:42px;height:42px;flex:none;border-radius:10px;background:linear-gradient(145deg,#fffdf7,#dfe6ea),var(--art-dice) center/cover no-repeat;border:1px solid rgba(255,255,255,.5);box-shadow:0 4px 0 rgba(0,0,0,.28)}
  .die i{position:absolute;width:7px;height:7px;border-radius:50%;background:#17202a;transform:translate(-50%,-50%)}
  .die.empty{opacity:.45}
  .status .txt{min-width:0;flex:1;font-size:13px;font-weight:700;line-height:1.35}
  .status .txt b{color:var(--gold)}
  .status .sub{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}
  .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:9px}
  .actions button{min-height:52px;padding:0 8px;font-size:13.5px}
  .log{list-style:none;margin:9px 0 0;padding:0;max-height:160px;overflow:auto;display:grid;gap:1px}
  .log li{font-size:12.5px;color:var(--muted);padding:3px 0;border-bottom:1px dashed rgba(232,192,122,.14);line-height:1.4}
  .log li::before{content:"›";color:var(--gold);margin-right:5px;font-weight:900}
  .finale{margin-top:10px;padding:12px;border-radius:14px;text-align:center;border:1px solid rgba(123,224,176,.42);background:rgba(123,224,176,.12)}
  .finale h3{margin:0 0 3px;font-family:var(--font-serif);font-size:21px}
  .finale p{margin:0;font-size:12.5px;color:var(--muted)}
  .leaderboard{display:grid;gap:4px;margin-top:9px}
  .lbrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.16)}
  .lbrow b{color:var(--gold)}
  .board-wrap[hidden]{display:none}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
  @media (max-width:420px){.wrap{padding:8px 9px 30px}.top h1{font-size:17px}.panel{padding:12px}.seats{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:350px){.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.row > button{min-width:120px}}

<body>
<div class="wrap">
  <header class="top">
    <a class="nav-pill" href="index.html">← 单机</a>
    <h1>飞行棋 · 联机</h1>
    <a class="nav-pill" href="rules.html">规则</a>
  </header>

  <main>
    <section class="panel" id="lobby" aria-label="联机大厅">
      <h2>创建或加入 2–4 人房</h2>
      <div class="field">
        <label for="nickname">昵称</label>
        <input id="nickname" maxlength="16" placeholder="红方 / 黄方 / 蓝方 / 绿方" autocomplete="nickname">
      </div>
      <div class="row">
        <button class="primary" id="createBtn" type="button">创建房间</button>
        <button id="joinBtn" type="button">加入房间</button>
      </div>
      <div id="joinFields" hidden style="margin-top:9px">
        <div class="field">
          <label for="roomCode">房间号 / 邀请码</label>
          <input id="roomCode" maxlength="80" placeholder="粘贴房间号或邀请码" autocomplete="off">
        </div>
        <div class="field">
          <label for="joinPassword">房间密码（可选）</label>
          <input id="joinPassword" type="password" maxlength="64" placeholder="无密码可留空" autocomplete="off">
        </div>
        <button class="green" id="joinConfirm" type="button">确认加入</button>
      </div>
      <p class="muted" style="margin:9px 0 0">1 位人类开局补 1 个 AI；2 位人类按 2 人桌；3–4 位人类按实际人数。断线 15 秒自动托管，重连后交还。</p>
      <p class="err" id="lobbyErr" role="alert"></p>
    </section>

    <section class="panel" id="room" hidden aria-label="房间">
      <div class="roombar">
        <div><span class="muted">房间</span> <strong id="roomCodeLabel" style="letter-spacing:.08em">—</strong></div>
        <span class="chip" id="roomStatus">等待开始</span>
      </div>
      <div class="seats" id="seats"></div>
      <div class="row">
        <button class="green" id="startBtn" type="button">开始对局</button>
        <button id="inviteBtn" type="button">复制邀请</button>
        <button id="leaveBtn" type="button">离开</button>
      </div>
      <p class="muted" id="inviteLine" style="margin:8px 0 0;word-break:break-all">邀请码会显示在这里。</p>
      <p class="err" id="roomErr" role="alert"></p>
    </section>

    <section class="panel board-wrap" id="gamePanel" hidden aria-label="联机棋盘">
      <div class="roombar">
        <span class="chip" id="gameRoomChip">房间 —</span>
        <span class="chip" id="gameVerChip">状态 —</span>
      </div>
      <div class="board-shell">
        <div class="board" id="board" role="grid" aria-label="联机飞行棋棋盘：52 格彩环、4 基地、4 条 6 格归航道与中心终点">
          <div class="plane-layer" id="planeLayer"></div>
        </div>
      </div>
      <div class="status" aria-live="polite">
        <div class="die empty" id="die" aria-label="骰子"></div>
        <div class="txt" id="statusText">等待开局…
          <span class="sub" id="subText">服务器掷骰，客户端只选择飞机。</span>
        </div>
      </div>
      <div class="actions">
        <button id="newRoundBtn" type="button" hidden>再来一局</button>
        <button id="reconnectBtn" type="button">重连</button>
        <a class="nav-pill" href="index.html" style="min-height:52px">单机练习</a>
      </div>
      <div class="finale" id="finale" hidden>
        <h3 id="finaleTitle">对局结束</h3>
        <p id="finaleText"></p>
      </div>
      <ul class="log" id="log"></ul>
    </section>

    <section class="panel">
      <h2>结果榜 · 本服务内存</h2>
      <div class="leaderboard" id="leaderboard"><p class="muted">开局结束后自动记录，AI 参与者也会入榜。</p></div>
    </section>
  </main>
</div>

<script src="../../shared/store.js"></script>

<script>
(function () {
  'use strict';
  var E = window.AeroplanePremiumEngine;
  var D = window.AeroplanePremiumData;
  var $ = function (id) { return document.getElementById(id); };
  var board = $('board');
  var planeLayer = $('planeLayer');
  var STORE_KEY = 'aeroplane-premium:online';
  var pollTimer = null;
  var room = null;
  var me = { playerId: null, session: null, seat: null };
  var lastDiceLen = 0;
  var lastLogLen = 0;

  function storeGet(key, fallback) {
    try { return window.Store ? window.Store.get(key, fallback) : fallback; } catch (e) { return fallback; }
  }
  function storeSet(key, value) { try { if (window.Store) window.Store.set(key, value); } catch (e) {} }
  function storeDel(key) { try { if (window.Store && window.Store.remove) window.Store.remove(key); } catch (e) {} }
  function saved() { try { return JSON.parse(storeGet(STORE_KEY, 'null')); } catch (e) { return null; } }
  function remember() {
    storeSet(STORE_KEY, JSON.stringify({
      roomKey: room && (room.roomId || room.code),
      playerId: me.playerId, session: me.session,
      nickname: $('nickname').value
    }));
  }
  function playerId() {
    if (!me.playerId) me.playerId = 'ap-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
    return me.playerId;
  }
  function api(method, route, body) {
    return fetch(route, {
      method: method,
      headers: { 'content-type': 'application/json' },
      body: body == null ? undefined : JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (json) {
        if (!res.ok) throw new Error((json && json.error && json.error.message) || ('HTTP ' + res.status));
        return json;
      });
    });
  }
  function err(id, message) { $(id).textContent = message || ''; }
  function escapeHtml(text) {
    return String(text).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  function colorName(seat) { return (D.COLORS[seat % 4] || D.COLORS[0]).zh + '方'; }
  function beep(name) {
    if (!window.Sfx || typeof window.Sfx.play !== 'function') return;
    try { window.Sfx.play(name, { volume: 0.34 }); } catch (e) {}
  }

  function showLobby() {
    $('lobby').hidden = false; $('room').hidden = true; $('gamePanel').hidden = true;
    stopPoll();
  }
  function showRoom() {
    $('lobby').hidden = true; $('room').hidden = false; $('gamePanel').hidden = false;
  }

  function createRoom() {
    err('lobbyErr', '');
    api('POST', '/api/rooms', {
      playerId: playerId(),
      nickname: ($('nickname').value || '房主').slice(0, 16)
    }).then(function (data) {
      me.session = data.session; me.seat = data.you; room = data;
      remember(); showRoom(); renderRoom(data); renderGame(data); startPoll();
      $('roomStatus').textContent = '等待开始';
    }).catch(function (e) { err('lobbyErr', e.message); });
  }

  function joinRoom() {
    err('lobbyErr', '');
    var key = ($('roomCode').value || '').trim();
    if (!key) { err('lobbyErr', '请输入房间号或邀请码'); return; }
    api('POST', '/api/rooms/' + encodeURIComponent(key) + '/join', {
      playerId: playerId(),
      nickname: ($('nickname').value || '玩家').slice(0, 16),
      inviteCode: key,
      password: $('joinPassword').value || undefined
    }).then(function (data) {
      me.session = data.session;
      me.seat = data.you != null ? data.you : data.seat;
      room = data; remember(); showRoom(); renderRoom(data); renderGame(data); startPoll();
    }).catch(function (e) { err('lobbyErr', e.message); });
  }

  function startGame() {
    err('roomErr', '');
    api('POST', '/api/rooms/' + encodeURIComponent(room.roomId || room.code) + '/start', {
      session: me.session, playerId: me.playerId
    }).then(function (data) { room = data; renderRoom(data); renderGame(data); })
      .catch(function (e) { err('roomErr', e.message); });
  }

  function copyInvite() {
    var code = room && (room.inviteCode || room.code);
    var url = location.origin + location.pathname + '?room=' + encodeURIComponent(room.roomId || room.code) + '&code=' + encodeURIComponent(code || '');
    $('inviteLine').textContent = '房间 ' + (room.roomId || '') + ' · 邀请码 ' + (code || '') + ' · ' + url;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).catch(function () {});
  }

  function leaveRoom() {
    if (room) {
      api('POST', '/api/rooms/' + encodeURIComponent(room.roomId || room.code) + '/leave', {
        session: me.session, playerId: me.playerId
      }).catch(function () {});
    }
    room = null; me.session = null; me.seat = null; storeDel(STORE_KEY); showLobby();
  }

  function reconnect() {
    if (!room) return;
    api('POST', '/api/rooms/' + encodeURIComponent(room.roomId || room.code) + '/reconnect', {
      session: me.session, playerId: me.playerId
    }).then(function (data) { room = data; renderRoom(data); renderGame(data); err('roomErr', ''); })
      .catch(function (e) { err('roomErr', '重连失败：' + e.message); });
  }

  function restart() {
    api('POST', '/api/rooms/' + encodeURIComponent(room.roomId || room.code) + '/restart', {
      session: me.session, playerId: me.playerId
    }).then(function (data) { room = data; renderRoom(data); renderGame(data); })
      .catch(function (e) { err('roomErr', e.message); });
  }

  function poll() {
    if (!room) return;
    api('GET', '/api/rooms/' + encodeURIComponent(room.roomId || room.code) +
      '?session=' + encodeURIComponent(me.session || '') + '&playerId=' + encodeURIComponent(me.playerId || ''))
      .then(function (data) { room = data; renderRoom(data); renderGame(data); err('roomErr', ''); })
      .catch(function (e) { err('roomErr', '同步中断：' + e.message); });
  }
  function startPoll() {
    loadLeaderboard(); stopPoll(); pollTimer = setInterval(poll, 700); }
  function stopPoll() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

  function renderRoom(data) {
    if (!data) return;
    $('roomStatus').textContent = data.over ? '已结束' : (data.started ? '对局中' : '等待开始');
    $('roomCodeLabel').textContent = '#' + (data.roomId || data.code || '—');
    $('gameRoomChip').textContent = '房间 ' + (data.roomId || data.code || '—');
    $('seats').innerHTML = (data.seats || []).map(function (seat) {
      var turn = data.state && data.state.turnSeat === seat.index;
      var pl = data.state && data.state.players && data.state.players[seat.index];
      return '<div class="seat' + (turn ? ' turn' : '') + (seat.isYou ? ' you' : '') + '">' +
        '<div class="name"><i class="c' + (seat.index % 4) + '"></i>' + escapeHtml(seat.name) + '</div>' +
        '<div class="meta"><span>' + (seat.ai ? 'AI' : (seat.connected ? '在线' : '离线')) + '</span>' +
        '<span>' + (seat.isYou ? '你' : (seat.isHost ? '房主' : '座位 ' + (seat.index + 1))) + '</span></div>' +
        (pl ? '<div class="tag">终点 ' + pl.finished + '/4 · 进度 ' + pl.progress + '</div>' : '') +
        '</div>';
    }).join('');
    $('startBtn').hidden = Boolean(data.started);
    $('startBtn').disabled = !(data.you === 0 || (data.seats && data.seats[0] && data.seats[0].isYou));
    $('newRoundBtn').hidden = !(data.over && (data.you === 0 || (data.seats && data.seats[0] && data.seats[0].isYou)));
    if (data.inviteCode) $('inviteLine').textContent = '邀请码 ' + data.inviteCode + ' · 房间 ' + data.roomId;
  }

  function pct(v) { return (v / 14 * 100).toFixed(4) + '%'; }
  function place(el, c, r, w, h) {
    el.style.left = pct(c); el.style.top = pct(r);
    el.style.width = pct(w); el.style.height = pct(h);
  }

  function buildStaticBoard() {
    var fragment = document.createDocumentFragment();
    for (var i = 0; i < D.RING_CELLS.length; i++) {
      var ring = document.createElement('div');
      var cell = D.RING_CELLS[i];
      ring.className = 'cell ring c' + D.RING_COLORS[i] + (D.START_RING.indexOf(i) >= 0 ? ' start' : '');
      ring.setAttribute('role', 'gridcell');
      ring.setAttribute('tabindex', '-1');
      ring.setAttribute('data-ring', String(i));
      ring.setAttribute('aria-label', '环形跑道第 ' + (i + 1) + ' 格');
      place(ring, cell[0], cell[1], 1, 1);
      fragment.appendChild(ring);
    }
    for (var s = 0; s < 4; s++) {
      for (var j = 0; j < 6; j++) {
        var lane = document.createElement('div');
        var lc = D.LANES[s][j];
        lane.className = 'cell lane l' + s;
        lane.setAttribute('role', 'gridcell');
        lane.setAttribute('tabindex', '-1');
        lane.setAttribute('data-lane', s + '-' + j);
        place(lane, lc[0], lc[1], 1, 1);
        fragment.appendChild(lane);
      }
      var base = document.createElement('div');
      var b = D.BASES[s];
      base.className = 'base b' + s;
      place(base, b.c0, b.r0, b.c1 - b.c0 + 1, b.r1 - b.r0 + 1);
      var label = document.createElement('span');
      label.className = 'bl'; label.textContent = D.COLORS[s].zh + '方基地';
      base.appendChild(label);
      fragment.appendChild(base);
    }
    var fz = document.createElement('div');
    fz.className = 'finish-zone'; fz.id = 'finishZone';
    place(fz, 6, 6, 2, 2);
    var fspan = document.createElement('span'); fspan.textContent = '终点'; fz.appendChild(fspan);
    fragment.appendChild(fz);
    board.insertBefore(fragment, planeLayer);
    board.addEventListener('click', onBoardClick);
    board.addEventListener('keydown', onBoardKey);
  }

  function pips(value) {
    var die = $('die'); die.innerHTML = ''; die.className = 'die' + (value >= 1 ? '' : ' empty');
    die.setAttribute('aria-label', value >= 1 ? ('骰子 ' + value + ' 点') : '骰子未掷');
    if (!value) return;
    var layouts = { 1: [[50, 50]], 2: [[30, 30], [70, 70]], 3: [[30, 30], [50, 50], [70, 70]], 4: [[30, 30], [70, 30], [30, 70], [70, 70]], 5: [[30, 30], [70, 30], [50, 50], [30, 70], [70, 70]], 6: [[30, 28], [70, 28], [30, 50], [70, 50], [30, 72], [70, 72]] };
    (layouts[value] || layouts[1]).forEach(function (xy) {
      var dot = document.createElement('i'); dot.style.left = xy[0] + '%'; dot.style.top = xy[1] + '%'; die.appendChild(dot);
    });
  }

  function legalActions() { return room && room.legalActions ? room.legalActions : []; }
  function myTurn() { return legalActions().length > 0; }

  function clearTargets() {
    var marked = board.querySelectorAll('.target');
    for (var i = 0; i < marked.length; i++) marked[i].classList.remove('target');
  }
  function markTargets(actions) {
    clearTargets();
    for (var i = 0; i < actions.length; i++) {
      var cell = actions[i].toCell, el = null;
      if (!cell) continue;
      if (cell.kind === 'ring') el = board.querySelector('[data-ring="' + cell.index + '"]');
      else if (cell.kind === 'lane') el = board.querySelector('[data-lane="' + (me.seat % 4) + '-' + cell.index + '"]');
      else if (cell.kind === 'finish') el = $('finishZone');
      if (el) el.classList.add('target');
    }
  }

  function renderPlanes(state, actions) {
    planeLayer.innerHTML = '';
    if (!state || !state.players) return;
    var movable = {};
    actions.forEach(function (a) { movable[a.plane] = true; });
    var entries = [];
    state.players.forEach(function (player) {
      for (var p = 0; p < 4; p++) {
        var pos = player.planes[p];
        var entry = { seat: player.seat, plane: p, pos: pos, key: null, c: 0, r: 0, w: 0.78, h: 0.78, done: false };
        if (pos < 0) {
          var slot = D.BASES[player.seat % 4].slots[p];
          entry.c = slot[0] + 0.11; entry.r = slot[1] + 0.11;
        } else if (pos <= 51) {
          var ring = D.RING_CELLS[E.globalRing(player.seat, pos)];
          entry.c = ring[0] + 0.11; entry.r = ring[1] + 0.11;
          entry.key = 'r' + ring[0] + ',' + ring[1];
        } else if (pos <= 56) {
          var lane = D.LANES[player.seat % 4][pos - 52];
          entry.c = lane[0] + 0.11; entry.r = lane[1] + 0.11;
          entry.key = 'l' + player.seat + ',' + lane[0] + ',' + lane[1];
        } else {
          var quad = D.CENTER.cells[player.seat % 4];
          var sub = p % 4;
          entry.c = quad[0] + (sub % 2) * 0.27 + 0.1;
          entry.r = quad[1] + Math.floor(sub / 2) * 0.27 + 0.1;
          entry.w = 0.22; entry.h = 0.22; entry.done = true;
        }
        entries.push(entry);
      }
    });
    var groups = {};
    entries.forEach(function (e) { if (e.key) { if (!groups[e.key]) groups[e.key] = []; groups[e.key].push(e); } });
    Object.keys(groups).forEach(function (key) {
      var list = groups[key];
      for (var i = 0; i < list.length; i++) {
        list[i].dx = (i - (list.length - 1) / 2) * 0.16;
        list[i].dy = (i % 2 === 0 ? -1 : 1) * (list.length > 1 ? 0.08 : 0);
      }
    });
    entries.forEach(function (entry) {
      var el = document.createElement('div');
      el.className = 'plane p' + (entry.seat % 4) + (entry.done ? ' done' : '');
      if (entry.seat === me.seat && movable[entry.plane]) {
        el.className += ' movable';
        el.setAttribute('tabindex', '0');
      } else {
        el.setAttribute('tabindex', '-1');
      }
      el.setAttribute('data-seat', String(entry.seat));
      el.setAttribute('data-plane', String(entry.plane));
      el.setAttribute('role', 'gridcell');
      el.setAttribute('aria-label', colorName(entry.seat) + ' ' + (entry.plane + 1) + ' 号飞机');
      el.innerHTML = '<svg viewBox="' + D.PLANE_VIEWBOX + '" aria-hidden="true" focusable="false">' +
        '<path d="' + D.PLANE_PATH + '" fill="currentColor" stroke="rgba(0,0,0,.32)" stroke-width="2"/>' +
        '<ellipse cx="50" cy="38" rx="5.5" ry="9.5" fill="rgba(255,255,255,.55)"/>' +
        '<path d="M50 18 L50 70" stroke="rgba(255,255,255,.18)" stroke-width="2"/></svg>';
      place(el, entry.c + (entry.dx || 0), entry.r + (entry.dy || 0), entry.w, entry.h);
      planeLayer.appendChild(el);
    });
    markTargets(actions);
  }

  function renderGame(data) {
    var state = data && data.state;
    if (!state) { $('gamePanel').hidden = true; return; }
    $('gamePanel').hidden = false;
    $('gameVerChip').textContent = '状态 v' + (data.stateVersion || 0);
    pips(state.dice);
    var actions = (data.legalActions || []).filter(function (a) { return a.k === 'move'; });
    renderPlanes(state, actions);
    var text, sub;
    if (state.phase === 'over') {
      text = state.winnerSeat != null ? (colorName(state.winnerSeat) + '获胜') : '对局结束';
      sub = '排名：' + (state.ranking || []).map(function (seat, i) {
        var pl = state.players[seat];
        return (i + 1) + '. ' + colorName(seat) + '（' + (pl ? pl.finished : 0) + '/4）';
      }).join(' · ');
      $('finale').hidden = false;
      $('finaleTitle').textContent = text;
      $('finaleText').textContent = '结果已写入结果榜。';
    } else {
      $('finale').hidden = true;
      if (actions.length) {
        text = '轮到你：点击高亮飞机，点数 ' + state.dice + '。';
        sub = state.dice === 6 ? '掷出 6：走完再掷一次。' : '走完轮到下一位。';
      } else {
        text = '等待 ' + (state.turnName || colorName(state.turnSeat || 0)) + '…';
        sub = data.takeover && data.takeover.length ? ('托管中：座位 ' + data.takeover.join('、')) : '服务器掷骰，客户端只选择飞机。';
      }
    }
    $('statusText').firstChild.nodeValue = text;
    $('subText').textContent = sub;
    var diceHist = (state.diceHistory || []).slice(-8).map(function (r) { return r.value; }).join(' ');
    if (diceHist) $('subText').textContent = sub + ' 骰子历史：' + diceHist;
    if ((state.diceHistory || []).length > lastDiceLen) beep('dice');
    lastDiceLen = (state.diceHistory || []).length;
    var logs = (state.log || []).slice(-14).reverse();
    $('log').innerHTML = logs.map(function (line) { return '<li>' + escapeHtml(line) + '</li>'; }).join('');
    if (logs.length > lastLogLen) beep('click');
    lastLogLen = logs.length;
  }

  function sendAction(action) {
    if (!room || !action) return;
    var key = 'ap-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
    api('POST', '/api/rooms/' + encodeURIComponent(room.roomId || room.code) + '/actions', {
      session: me.session, playerId: me.playerId, action: action, idempotencyKey: key
    }).then(function (data) { room = data; renderRoom(data); renderGame(data); })
      .catch(function (e) { err('roomErr', e.message); });
  }

  function actionForPlane(seat, plane) {
    var actions = legalActions();
    for (var i = 0; i < actions.length; i++) if (actions[i].plane === plane) return actions[i];
    return null;
  }
  function actionForCell(el) {
    var actions = legalActions();
    for (var i = 0; i < actions.length; i++) {
      var c = actions[i].toCell;
      if (!c) continue;
      if (c.kind === 'ring' && el.getAttribute('data-ring') === String(c.index)) return actions[i];
      if (c.kind === 'lane' && el.getAttribute('data-lane') === ((me.seat % 4) + '-' + c.index)) return actions[i];
      if (c.kind === 'finish' && el.id === 'finishZone') return actions[i];
    }
    return null;
  }

  function onBoardClick(event) {
    var target = event.target;
    var planeEl = target.closest ? target.closest('.plane') : null;
    if (planeEl) {
      var seat = Number(planeEl.getAttribute('data-seat'));
      var plane = Number(planeEl.getAttribute('data-plane'));
      if (seat === me.seat) {
        var a = actionForPlane(seat, plane);
        if (a) { sendAction(a); return; }
      }
      var state = room && room.state;
      if (state && state.players && state.players[seat]) {
        var pos = state.players[seat].planes[plane];
        if (pos != null && pos >= 0) {
          var cell = E.cellOfProgress(seat, pos);
          var acts = legalActions();
          for (var i = 0; i < acts.length; i++) {
            var tc = acts[i].toCell;
            if (tc && tc.c === cell.c && tc.r === cell.r && tc.kind === cell.kind) { sendAction(acts[i]); return; }
          }
        }
      }
      return;
    }
    var cellEl = target.closest ? target.closest('.cell, .finish-zone') : null;
    if (cellEl) {
      var found = actionForCell(cellEl);
      if (found) sendAction(found);
    }
  }
  function onBoardKey(event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    var planeEl = event.target.closest ? event.target.closest('.plane.movable') : null;
    if (!planeEl) return;
    event.preventDefault();
    onBoardClick({ target: planeEl });
  }

  function loadLeaderboard() {
    api('GET', '/api/leaderboard?game=' + encodeURIComponent('aeroplane-premium')).then(function (data) {
      var entries = (data.entries || []).slice(0, 8);
      $('leaderboard').innerHTML = entries.length ? entries.map(function (entry) {
        return '<div class="lbrow"><span>' + escapeHtml(entry.name) + (entry.ai ? ' · AI' : '') + '</span><b>' + (entry.winner ? '胜' : '—') + '</b></div>';
      }).join('') : '<p class="muted">开局结束后自动记录，AI 参与者也会入榜。</p>';
    }).catch(function () {});
  }

  $('createBtn').addEventListener('click', createRoom);
  $('joinBtn').addEventListener('click', function () {
    var fields = $('joinFields'); fields.hidden = !fields.hidden;
    if (!fields.hidden) $('roomCode').focus();
  });
  $('joinConfirm').addEventListener('click', joinRoom);
  $('startBtn').addEventListener('click', startGame);
  $('inviteBtn').addEventListener('click', copyInvite);
  $('leaveBtn').addEventListener('click', leaveRoom);
  $('reconnectBtn').addEventListener('click', reconnect);
  $('newRoundBtn').addEventListener('click', restart);

  (function boot() {
    var params = new URLSearchParams(location.search);
    var savedState = saved();
    if (params.get('room')) $('roomCode').value = params.get('room');
    if (params.get('code')) $('roomCode').value = params.get('room') || params.get('code');
    buildStaticBoard();
    if (savedState && savedState.roomKey && savedState.session) {
      me.playerId = savedState.playerId; me.session = savedState.session;
      if (savedState.nickname) $('nickname').value = savedState.nickname;
      api('GET', '/api/rooms/' + encodeURIComponent(savedState.roomKey) + '?session=' + encodeURIComponent(me.session) + '&playerId=' + encodeURIComponent(me.playerId))
        .then(function (data) { room = data; showRoom(); renderRoom(data); renderGame(data); startPoll(); })
        .catch(function () { storeDel(STORE_KEY); showLobby(); });
    } else {
      showLobby();
    }
  })();

  window.AeroplaneOnlinePage = {
    api: api,
    getRoom: function () { return room; },
    getMe: function () { return me; },
    createRoom: createRoom,
    joinRoom: joinRoom,
    startGame: startGame,
    onBoardClick: onBoardClick
  };
})();
</script>
</body>
</html>
