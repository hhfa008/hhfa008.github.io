<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>可玩桌游 · 卡牌 / 麻将 / 奖励 / 房间</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #eef2f9;
      --panel: #ffffff;
      --text: #162033;
      --muted: #5b6478;
      --line: #d8dfea;
      --accent: #3b6ef6;
      --shadow: 0 10px 30px rgba(22, 32, 51, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020;
        --panel: #141a2e;
        --text: #eef2ff;
        --muted: #a3adc7;
        --line: #27304a;
        --accent: #7aa2ff;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 20px 16px 40px;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.55rem; margin: 4px 0 4px; letter-spacing: 0.01em; }
    .lead { color: var(--muted); margin: 0 0 20px; }
    .grid { display: grid; gap: 14px; }
    a.card {
      display: block;
      min-height: 88px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    a.card:active { transform: scale(0.985); }
    a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    a.card strong { display: block; font-size: 1.08rem; margin-bottom: 4px; }
    a.card span { color: var(--muted); font-size: 0.94rem; }
    .foot { margin-top: 22px; color: var(--muted); font-size: 0.9rem; }
    .foot a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 6px;
      color: var(--accent);
    }
    @media (prefers-reduced-motion: reduce) { a.card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>可玩桌游</h1>
    <p class="lead">纯本地演示：零外部请求、无账号、无媒体权限。规则引擎来自 app/*.js。</p>
    <div class="grid">
      <a class="card" href="./card-battle.html">
        <strong>卡牌对战</strong>
        <span>抽牌、出战、附着能量、攻击与奖赏卡</span>
      </a>
      <a class="card" href="./mahjong.html">
        <strong>麻将</strong>
        <span>摸打、自摸结算、点炮与番型</span>
      </a>
      <a class="card" href="./rewards.html">
        <strong>每日奖励</strong>
        <span>登录积分、任务、奖杯与匿名榜</span>
      </a>
      <a class="card" href="./rooms.html">
        <strong>房间</strong>
        <span>创建房间、密码加入、邀请码与语音占位</span>
      </a>
    </div>
    <p class="foot">返回 <a href="../pages/index.html">桌游目录</a></p>
  </main>
</body>
</html>
