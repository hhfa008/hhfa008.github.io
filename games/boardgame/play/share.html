<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="桌游板块对局分享落地页：只展示对局编号，不含个人信息与追踪参数。">
<title>对局分享 · 桌游板块</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d12;
    --panel: #151a23;
    --line: #2a3444;
    --text: #f2f5fa;
    --muted: #a7b3c6;
    --accent: #7cc4ff;
    --gold: #ffd479;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.55;
    overflow-x: hidden;
  }
  .wrap {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    display: grid;
    gap: 12px;
  }
  header { padding: 8px 0; }
  .eyebrow { margin: 0 0 2px; color: var(--accent); font-size: 13px; letter-spacing: .14em; }
  h1 { margin: 0 0 6px; font-size: clamp(22px, 7vw, 30px); line-height: 1.2; }
  p { margin: 0 0 10px; }
  p:last-child { margin-bottom: 0; }
  .hint { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
  }
  code {
    display: inline-block;
    max-width: 100%;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #1c2330;
    color: var(--gold);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  a.cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--accent);
    color: #04121f;
    font-weight: 700;
    text-decoration: none;
  }
  footer { color: var(--muted); font-size: 11px; text-align: center; padding-top: 6px; }
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/play/share.html">
<meta property="og:title" content="对局分享 · 桌游板块">
<meta property="og:description" content="桌游板块对局分享落地页：只展示对局编号，不含个人信息与追踪参数。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hhfa008.github.io/games/boardgame/play/share.html">
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">桌游板块 · 对局分享</p>
    <h1>有人分享了本机战绩</h1>
    <p class="hint">这个页面只展示分享链接里的对局编号，不含账号、设备 id 或任何追踪参数。</p>
  </header>
  <section aria-labelledby="match-title">
    <h2 id="match-title" style="font-size:17px;margin:0 0 10px;">对局编号</h2>
    <p class="hint" id="match-id">未提供对局编号</p>
  </section>
  <section aria-labelledby="how-title">
    <h2 id="how-title" style="font-size:17px;margin:0 0 10px;">想挑战这个分数？</h2>
    <p class="hint">所有积分、等级、奖杯和排行榜都只保存在各自浏览器本机；清除缓存即重置，没有服务器、没有账号，也没有个人信息。</p>
    <a class="cta" href="./index.html">去玩一局</a>
  </section>
  <footer>本地匿名记录 · 无第三方脚本 · 无外部请求</footer>
</main>
<script>
  (function () {
    var raw = '';
    try {
      raw = new URLSearchParams(window.location.search).get('match') || '';
    } catch (err) {
      raw = '';
    }
    // Keep only a short, safe identifier; never echo arbitrary query content.
    var safe = raw.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
    var target = document.getElementById('match-id');
    if (target) target.textContent = safe ? safe : '未提供对局编号';
  })();
</script>
</body>
</html>
