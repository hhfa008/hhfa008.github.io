      if (!ctx || !current) return;
      clearNodes();
      scheduleScene(current);
    }, 12000);
    return true;
  }

  function stop() {
    clearNodes();
    current = null;
    return true;
  }

  function setVolume(v) {
    volume = Math.max(0, Math.min(1, Number(v) || 0));
    storageSet(VOLUME_KEY, String(volume));
    return volume;
  }

  function mute(on) {
    muted = Boolean(on);
    storageSet(MUTE_KEY, muted ? '1' : '0');
    fadeMaster(muted ? 0 : volume * (SCENES[current] || SCENES.table).gain, 0.4);
    return muted;
  }

  function scenes() { return Object.keys(SCENES); }
  function isMuted() { return muted; }
  function currentScene() { return current; }
  function getVolume() { return volume; }

  return {
    play: play,
    stop: stop,
    setVolume: setVolume,
    getVolume: getVolume,
    mute: mute,
    isMuted: isMuted,
    current: currentScene,
    scenes: scenes,
    version: '1.0.0'
  };
});

return module.exports;})();
</script>
<script>
(function () {
  "use strict";
  var E = window.MiniPartyEngine;
  var stage = document.getElementById("stage");
  if (!E) { stage.textContent = "引擎加载失败，请刷新页面。"; return; }
  var progressEl = document.getElementById("progress");
  var scoreEl = document.getElementById("score");
  var logEl = document.getElementById("log");
  var streakEl = document.getElementById("streak");
  var SLUG = "mini-party-a-21";
  var mode = "free";
  var currentSeed = Date.now() % 1000000000;
  var settled = false;
  var bgmOn = false;
  var g = E.createGame({ seed: currentSeed });
  var scene = Scene.create({
    id: SLUG,
    ambience: "market",
    cast: [{ id: "you", name: "你", role: "player" }, { id: "ai", name: "AI 主持人", role: "ai" }]
  });
  var replay = Replay.create({ game: SLUG, seed: currentSeed, params: { mode: mode } });

  function newSeed() {
    currentSeed = mode === "daily" ? GameProgress.dailySeed(SLUG) : (Date.now() % 1000000000);
    return currentSeed;
  }
  function saveReplay() {
    try { Replay.saveLocal("replay." + SLUG, replay); } catch (e) { /* storage optional */ }
  }
  function refreshStreak() {
    if (!streakEl) return;
    var st = GameProgress.dailyState(SLUG);
    streakEl.textContent = (mode === "daily" ? "每日 · " + (st.done ? "今日已完成" : "今日未完成") : "自由模式") + " · 连胜 " + st.streak;
  }
  function describe(event) {
    if (!event) return "战报：准备开始。";
    var p = event.payload || {};
    if (event.type === "clue") return "战报：第 " + (p.round + 1) + " 轮再要一条线索。";
    if (event.type === "answer") {
      return p.correct
        ? "战报：答对了，+" + p.points + " 分。"
        : "战报：答错了，这一轮 AI 拿分。";
    }
    if (event.type === "round") return "战报：进入第 " + (p.round + 1) + " 轮。";
    if (event.type === "settle") {
      var verdict = p.score > p.ai ? "你赢了" : (p.score === p.ai ? "平局" : "AI 赢了");
      return "战报：最终 " + p.score + " : " + p.ai + " AI · " + verdict + "。";
    }
    return "战报：准备开始。";
  }
  function paintLog() {
    if (logEl) logEl.textContent = describe(scene.events(1)[0]);
  }
  function finish(v) {
    if (settled) return;
    settled = true;
    var won = v.score > v.aiScore;
    scene.updateCast("you", { emotion: won ? "happy" : (v.score === v.aiScore ? "neutral" : "sad") });
    scene.emit("settle", { score: v.score, ai: v.aiScore, mode: mode });
    try { localStorage.removeItem("replay." + SLUG); } catch (e) { /* ignore */ }
    try { GameProgress.record({ slug: SLUG, mode: mode, score: v.score }); } catch (e) { /* storage optional */ }
    refreshStreak();
    paintLog();
  }
  function startBgm() {
    if (bgmOn) return;
    bgmOn = true;
    try { Bgm.play(scene.ambience); } catch (e) { /* audio optional */ }
  }
  document.addEventListener("pointerdown", startBgm, { once: true });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function button(label, handler, cls) {
    var b = el("button", cls || "action", label);
    b.type = "button";
    b.addEventListener("click", handler);
    return b;
  }
  function render() {
    var v = E.publicView(g);
    scoreEl.textContent = "你 " + v.score + " : " + v.aiScore + " AI";
    progressEl.textContent = v.phase === "over" ? "对局结束" : "第 " + (v.round + 1) + " / " + v.maxRounds + " 轮";
    stage.textContent = "";
    if (v.phase === "over") {
      finish(v);
      var box = el("div", "over");
      var win = v.score > v.aiScore ? "你赢了" : (v.score === v.aiScore ? "平局" : "AI 赢了");
      box.appendChild(el("div", "big", win));
      box.appendChild(el("div", "sub", "最终比分 " + v.score + " : " + v.aiScore + "，已完成 " + v.maxRounds + " 轮。"));
      box.appendChild(button("再来一局", function () { reset("free"); }));
      stage.appendChild(box);
      return;
    }
    var c = v.current;
    stage.appendChild(el("p", "prompt", c.prompt));
    if (v.mode === "deduce") {
      var ul = el("ul", "clues");
      c.clues.forEach(function (clue, i) {
        ul.appendChild(el("li", null, "线索 " + (i + 1) + "：" + clue));
      });
      stage.appendChild(ul);
      if (v.phase === "choose" && c.revealed < 3 && typeof E.revealClue === "function") {
        stage.appendChild(button("再要一条线索（本题分值降低）", function () {
          E.revealClue(g);
          replay.add({ a: "clue" });
          saveReplay();
          scene.emit("clue", { round: g.round });
          paintLog();
          render();
        }, "ghost"));
      }
    }
    if (v.phase === "choose") {
      var list = el("div", "options");
      c.options.forEach(function (opt, i) {
        list.appendChild(button(opt, function () {
          var r = E.choose(g, i);
          replay.add({ a: "choose", i: i });
          saveReplay();
          scene.emit("answer", { correct: Boolean(r && r.correct), points: r && r.points ? r.points : 0, round: g.round });
          paintLog();
          render();
        }, "opt"));
      });
      stage.appendChild(list);
      return;
    }
    var last = g.history[g.history.length - 1];
    var res = el("div", "result " + (last && last.correct ? "good" : "bad"));
    res.textContent = (last && last.correct ? "答对了 +" + last.points + " 分。" : "答错了，正确答案是「" + c.options[c.answerIndex] + "」。") + (c.note ? " " + c.note : "");
    stage.appendChild(res);
    stage.appendChild(button("下一轮", function () {
      E.next(g);
      replay.add({ a: "next" });
      saveReplay();
      scene.emit("round", { round: g.round });
      paintLog();
      render();
    }));
  }
  function reset(nextMode) {
    if (nextMode) mode = nextMode;
    settled = false;
    g = E.createGame({ seed: newSeed() });
    replay = Replay.create({ game: SLUG, seed: currentSeed, params: { mode: mode } });
    try { localStorage.removeItem("replay." + SLUG); } catch (e) { /* ignore */ }
    refreshStreak();
    paintLog();
    render();
  }
  document.getElementById("freeBtn").addEventListener("click", function () { reset("free"); });
  document.getElementById("dailyBtn").addEventListener("click", function () { reset("daily"); });
  document.getElementById("bgmBtn").addEventListener("click", function () {
    startBgm();
    var muted = Bgm.mute(!Bgm.isMuted());
    var btn = document.getElementById("bgmBtn");
    btn.textContent = muted ? "音景 关" : "音景 开";
    btn.setAttribute("aria-pressed", muted ? "false" : "true");
  });
  (function resumePrompt() {
    var saved = null;
    try { saved = Replay.loadLocal("replay." + SLUG); } catch (e) { /* storage optional */ }
    var btn = document.getElementById("resumeBtn");
    if (!btn || !saved || !saved.actions().length) return;
    btn.hidden = false;
    btn.addEventListener("click", function () {
      mode = (saved.params && saved.params.mode) || "free";
      currentSeed = saved.seed;
      settled = false;
      g = E.createGame({ seed: currentSeed });
      var acts = saved.actions();
      for (var i = 0; i < acts.length; i += 1) {
        var a = acts[i] || {};
        if (a.a === "clue" && typeof E.revealClue === "function") E.revealClue(g);
        else if (a.a === "choose" && typeof a.i === "number") E.choose(g, a.i);
        else if (a.a === "next") E.next(g);
        if (g.phase === "over") break;
      }
      replay = saved;
      btn.hidden = true;
      refreshStreak();
      paintLog();
      render();
    });
  })();
  refreshStreak();
  render();
})();
</script>
</body>
</html>
