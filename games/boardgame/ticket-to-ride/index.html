<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>车票之旅 · Ticket to Ride 简化版（人机对战）</title>
<meta name="description" content="与 AI 对战简化版 Ticket to Ride：抽车厢卡、占领城市路线、完成目的地任务，纯前端离线可玩。">
<meta name="theme-color" content="#17273a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317273a'/%3E%3Cpath d='M6 22h20v3H6zm2-3 3-9h4l1 5h6l2 4z' fill='%23e8b04b'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#101c2c;--panel:#182a40;--panel2:#213650;--ink:#e9f0f8;--muted:#9fb3c8;--gold:#e8b04b;--gold2:#f6d796;
  --line:#2e4763;--human:#6fbf92;--ai:#e07a5f;--card:#f3ecdc;--cardink:#1c2b3a;--red:#c65b4e;
  --red-c:#c65b4e;--blue-c:#4f8ac9;--green-c:#57a06b;--yellow-c:#d9b03f;--black-c:#3b4452;--white-c:#e8e3d6;--orange-c:#d98544;--pink-c:#cf7f9e;--gray-c:#8a97a3;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 500px at 50% -80px,#1d3550,#101c2c 65%);color:var(--ink);font-family:var(--sans);line-height:1.45;min-height:100vh;overflow-x:hidden}
.wrap{max-width:1060px;margin:0 auto;padding:12px 12px 40px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:19px;margin:0;color:var(--gold2);letter-spacing:.4px}
h1 small{font-size:11px;color:var(--muted);font-weight:400;margin-left:5px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:12px;color:var(--muted)}
.pill b{color:var(--gold2);font-size:15px;margin-left:4px}
button{font-family:inherit;min-height:44px;min-width:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13px;padding:7px 11px;cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--gold);border-color:var(--gold);color:#1b2836;font-weight:700}
button.ghost{background:transparent}
.layout{display:grid;grid-template-columns:1.25fr .9fr;gap:10px}
.panel{background:rgba(24,42,64,.86);border:1px solid var(--line);border-radius:13px;padding:9px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.panel h2{font-size:12px;color:var(--muted);margin:0 0 7px;letter-spacing:.4px;font-weight:600}
.map{width:100%;height:auto;display:block;background:#0e1a29;border-radius:9px;border:1px solid #253c55}
.map text{font-family:var(--sans);font-size:7.5px;fill:#c7d7e6}
.route-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid rgba(46,71,99,.55)}
.route-row:last-child{border-bottom:0}
.swatch{width:13px;height:13px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.25)}
.route-name{font-size:12px;min-width:118px}
.route-meta{font-size:11px;color:var(--muted);min-width:52px}
.route-row button{margin-left:auto;min-height:38px;padding:4px 10px;font-size:12px}
.routes{max-height:238px;overflow:auto;padding-right:2px}
.market{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.train-card{width:48px;min-height:60px;border-radius:8px;border:1px solid rgba(255,255,255,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;color:#16222d;padding:3px;cursor:pointer;background:var(--card)}
.train-card span{font-size:9px;font-weight:700;opacity:.8}
.train-card.deck{background:linear-gradient(135deg,#2b4c70,#1a3350);color:var(--gold2);border-color:var(--gold)}
.hand-strip{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.hand-chip{display:inline-flex;align-items:center;gap:4px;background:#13263b;border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:12px}
.hand-chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.actions-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.status{font-size:13px;color:var(--gold2);min-height:20px;margin:6px 0}
.log{max-height:118px;overflow:auto;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.log div{padding:2px 0}
.hint{font-size:11px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(6,12,20,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
.overlay.show{display:flex}
.dialog{background:var(--panel);border:1px solid var(--gold);border-radius:15px;padding:16px;max-width:420px;width:100%;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.dialog h3{margin:0 0 8px;font-size:17px;color:var(--gold2)}
.ticket-opt{display:flex;align-items:center;gap:9px;min-height:48px;border-bottom:1px solid var(--line);font-size:13px}
.ticket-opt input{width:22px;height:22px;accent-color:var(--gold)}
.dialog p{font-size:13px;color:#dbe7f2}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
@media (max-width:430px){
  .wrap{padding:9px 9px 30px}
  h1{font-size:16px}
  .stats{width:100%}
  .pill{font-size:11px;padding:4px 7px}
  .route-name{font-size:11px;min-width:100px}
  .route-meta{font-size:10px;min-width:44px}
  .train-card{width:44px;min-height:56px}
  button{padding:6px 9px;font-size:12px}
  .panel{padding:7px;border-radius:11px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/ticket-to-ride/">
<meta property="og:title" content="车票之旅 · Ticket to Ride 简化版（人机对战）">
<meta property="og:description" content="与 AI 对战简化版 Ticket to Ride：抽车厢卡、占领城市路线、完成目的地任务，纯前端离线可玩。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hhfa008.github.io/games/boardgame/ticket-to-ride/">
</head>
<body>
<div class="wrap">
  <header>
    <h1>车票之旅 <small>Ticket to Ride · 简化版</small></h1>
    <div class="stats" aria-label="对局统计">
      <div class="pill">你 <b id="score-human">0</b></div>
      <div class="pill">AI <b id="score-ai">0</b></div>
      <div class="pill">牌堆 <b id="deck-left">0</b></div>
      <button id="restart" class="ghost" aria-label="重新开始一局">重开</button>
    </div>
  </header>

  <main class="layout">
    <div style="display:grid;gap:10px">
      <section class="panel" aria-label="城市地图">
        <h2>城市与路线 · 彩色线路需同色卡，灰色可用任意颜色</h2>
        <svg id="map" class="map" viewBox="0 0 290 210" role="img" aria-label="简化美国地图，显示城市与可占领路线"></svg>
      </section>
      <section class="panel" aria-label="可占领路线">
        <h2>路线列表 · 卡牌足够时可直接占领</h2>
        <div id="routes" class="routes"></div>
      </section>
    </div>

    <div style="display:grid;gap:10px;align-content:start">
      <section class="panel" aria-label="明牌区">
        <h2>明牌区 · 点卡抽取（每回合共抽 2 张）</h2>
        <div id="market" class="market"></div>
        <div class="actions-row">
          <button id="draw-deck" aria-label="从牌堆抽一张车厢卡">摸牌堆</button>
          <button id="draw-tickets" aria-label="抽取三张目的地任务">抽任务</button>
        </div>
      </section>

      <section class="panel" aria-label="你的手牌与状态">
        <h2>你的手牌</h2>
        <div id="hand" class="hand-strip"></div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="tickets" class="hand-strip" aria-label="你的目的地任务"></div>
        <div class="hint">线路分：1/2/3/4/5 段 = 1/2/4/7/10 分；任务完成加分，未完成扣分；最长连续路线 +10。</div>
        <div id="log" class="log" aria-label="对局日志"></div>
      </section>

      <section class="panel" aria-label="AI 状态">
        <h2>AI 状态</h2>
        <div id="ai-info" class="hint"></div>
      </section>
    </div>
  </main>
</div>

<div id="ticket-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ticket-title">
  <div class="dialog">
    <h3 id="ticket-title">选择要保留的目的地任务（至少 1 张）</h3>
    <div id="ticket-options"></div>
    <div class="actions-row">
      <button id="keep-tickets" class="primary" aria-label="保留选中的任务">保留所选</button>
    </div>
  </div>
</div>

<div id="result-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="result-title">
  <div class="dialog">
    <h3 id="result-title">本局结束</h3>
    <p id="result-text"></p>
    <button id="again" class="primary" aria-label="再来一局">再来一局</button>
  </div>
</div>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.TicketToRideEngine;
  var COLOR_HEX = {
    red: '#c65b4e', blue: '#4f8ac9', green: '#57a06b', yellow: '#d9b03f',
    black: '#3b4452', white: '#e8e3d6', orange: '#d98544', pink: '#cf7f9e',
    gray: '#8a97a3', wild: '#c9a54a'
  };
  var game, selectedTickets = {}, aiTimer = null, lastHumanMove = null;

  function $(id) { return document.getElementById(id); }
  function esc(t) {
    return String(t).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; });
  }
  function cityName(i) { return E.CITIES[i].name; }
  function routeLabel(r) { return cityName(r.a) + '–' + cityName(r.b); }
  function ticketLabel(ti) {
    var t = E.TICKETS[ti];
    return cityName(t.a) + ' → ' + cityName(t.b) + '（' + t.value + ' 分）';
  }
  function drawOptions() {
    return E.legalMoves(game).filter(function (m) { return m.type === 'drawCard'; });
  }
  function canClaim(id) {
    return E.legalMoves(game).some(function (m) { return m.type === 'claimRoute' && m.routeId === id; });
  }

  function renderMap() {
    var svg = $('map');
    var parts = [];
    E.ROUTES.forEach(function (r) {
      var a = E.CITIES[r.a], b = E.CITIES[r.b];
      var owner = game.routes[r.id];
      var stroke = owner === null ? COLOR_HEX[r.color] : (owner === 0 ? '#6fbf92' : '#e07a5f');
      var width = owner === null ? 4.5 : 6.5;
      var dash = owner === null ? ' stroke-dasharray="2 2"' : '';
      var opacity = owner === null ? .72 : 1;
      parts.push('<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="' + stroke + '" stroke-width="' + width + '" stroke-linecap="round" opacity="' + opacity + '"' + dash + '/>');
      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      parts.push('<text x="' + mx + '" y="' + (my - 3) + '" text-anchor="middle">' + r.length + '</text>');
    });
    E.CITIES.forEach(function (c) {
      parts.push('<circle cx="' + c.x + '" cy="' + c.y + '" r="3.4" fill="#e9f0f8"/>');
      parts.push('<text x="' + c.x + '" y="' + (c.y + 10) + '" text-anchor="middle">' + esc(c.name) + '</text>');
    });
    svg.innerHTML = parts.join('');
  }

  function renderRoutes() {
    var p = game.players[0];
    var html = E.ROUTES.map(function (r) {
      var owner = game.routes[r.id];
      var afford = owner === null && canClaim(r.id);
      var pay = owner === null ? E.paymentFor(p, r) : null;
      var status = owner === null ? (afford ? '可占领' : '卡不足') : (owner === 0 ? '你的' : 'AI 的');
      return '<div class="route-row">' +
        '<span class="swatch" style="background:' + COLOR_HEX[r.color] + '"></span>' +
        '<span class="route-name">' + routeLabel(r) + '</span>' +
        '<span class="route-meta">' + (r.color === 'gray' ? '灰' : E.COLOR_NAMES[r.color]) + '·' + r.length + '段·' + E.ROUTE_POINTS[r.length] + '分</span>' +
        '<span class="route-meta">' + status + (pay && afford ? '（' + E.COLOR_NAMES[pay.color] + (pay.wilds ? '+机车' + pay.wilds : '') + '）' : '') + '</span>' +
        '<button data-route="' + r.id + '"' + (afford && game.turn === 0 && game.phase === 'main' ? '' : ' disabled') +
        ' aria-label="占领路线' + routeLabel(r) + '">占领</button>' +
        '</div>';
    }).join('');
    $('routes').innerHTML = html;
    Array.prototype.forEach.call($('routes').querySelectorAll('button[data-route]'), function (b) {
      b.addEventListener('click', function () { humanClaim(Number(b.getAttribute('data-route'))); });
    });
  }

  function renderMarket() {
    var opts = drawOptions().filter(function (m) { return m.source === 'market'; });
    var hand = {};
    opts.forEach(function (m) { hand[m.marketIndex] = true; });
    $('market').innerHTML = '';
    game.market.forEach(function (card, i) {
      var b = document.createElement('button');
      b.className = 'train-card' + (card === 'wild' ? ' deck' : '');
      b.style.background = card === 'wild' ? '' : COLOR_HEX[card];
      b.style.color = card === 'wild' ? '#f6d796' : (card === 'white' ? '#1c2b3a' : '#16222d');
      b.innerHTML = (card === 'wild' ? '★' : '') + '<span>' + E.COLOR_NAMES[card] + '</span>';
      b.disabled = !hand[i] || game.turn !== 0 || game.over;
      b.setAttribute('aria-label', '抽取明牌' + E.COLOR_NAMES[card] + '卡');
      b.addEventListener('click', function () { humanDraw('market', i); });
      $('market').appendChild(b);
    });
  }

  function renderHand() {
    var p = game.players[0];
    var html = '';
    E.COLORS.forEach(function (c) {
      if (p.hand[c]) html += '<span class="hand-chip"><i style="background:' + COLOR_HEX[c] + '"></i>' + E.COLOR_NAMES[c] + ' ' + p.hand[c] + '</span>';
    });
    if (p.wilds) html += '<span class="hand-chip"><i style="background:#c9a54a"></i>机车 ' + p.wilds + '</span>';
    if (!html) html = '<span class="hint">手牌为空</span>';
    $('hand').innerHTML = html;
    $('tickets').innerHTML = p.tickets.length ? p.tickets.map(function (ti) {
      return '<span class="hand-chip">' + esc(ticketLabel(ti)) + '</span>';
    }).join('') : '<span class="hint">暂无任务</span>';
  }

  function render() {
    var sc = E.score(game);
    $('score-human').textContent = sc.human;
    $('score-ai').textContent = sc.ai;
    $('deck-left').textContent = game.deck.length;
    renderMap();
    renderRoutes();
    renderMarket();
    renderHand();
    $('draw-deck').disabled = game.turn !== 0 || game.over || !game.deck.length;
    $('draw-tickets').disabled = game.turn !== 0 || game.over || game.drawsLeft > 0 || !game.ticketDeck.length;
    var ai = game.players[1];
    $('ai-info').textContent = '手牌 ' + (ai.wilds + E.COLORS.reduce(function (n, c) { return n + ai.hand[c]; }, 0)) +
      ' 张 · 任务 ' + ai.tickets.length + ' 张 · 车厢 ' + ai.trains + ' 节 · 已占 ' + game.routes.filter(function (x) { return x === 1; }).length + ' 条路线';
    var st = game.over ? '本局结束。' : (game.turn === 0 ? (game.drawsLeft > 0 ? '还可再抽 ' + game.drawsLeft + ' 张牌。' : '轮到你：抽牌、抽任务或占领路线。') : 'AI 正在行动…');
    if (lastHumanMove) st += ' ' + lastHumanMove;
    $('status').textContent = st;
    $('log').innerHTML = game.log.slice(-12).reverse().map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('');
    if (game.phase === 'ticketSelect' && game.turn === 0) showTicketDialog();
    if (game.over) showResult();
  }

  function humanDraw(source, marketIndex) {
    if (game.turn !== 0 || game.over) return;
    try {
      game = E.applyMove(game, { type: 'drawCard', source: source, marketIndex: marketIndex });
      lastHumanMove = '';
      render(); scheduleAI();
    } catch (e) { $('status').textContent = '动作不合法：' + e.message; }
  }

  function humanClaim(id) {
    if (game.turn !== 0 || game.over) return;
    var route = E.routeById(id);
    try {
      game = E.applyMove(game, { type: 'claimRoute', routeId: id });
      lastHumanMove = '已占领 ' + routeLabel(route) + '。';
      render(); scheduleAI();
    } catch (e) { $('status').textContent = '无法占领：' + e.message; }
  }

  function drawTickets() {
    if (game.turn !== 0 || game.over) return;
    try {
      game = E.applyMove(game, { type: 'drawTickets' });
      selectedTickets = {};
      render();
    } catch (e) { $('status').textContent = '无法抽任务：' + e.message; }
  }

  function showTicketDialog() {
    $('ticket-options').innerHTML = game.pendingTickets.map(function (t, i) {
      return '<label class="ticket-opt"><input type="checkbox" data-ticket="' + i + '" aria-label="保留任务' + ticketLabel(t) + '">' + esc(ticketLabel(t)) + '</label>';
    }).join('');
    $('ticket-overlay').classList.add('show');
  }

  function keepTickets() {
    var keep = [];
    Array.prototype.forEach.call(document.querySelectorAll('#ticket-options input[type=checkbox]'), function (el) {
      if (el.checked) keep.push(Number(el.getAttribute('data-ticket')));
    });
    if (!keep.length) { $('status').textContent = '请至少保留 1 张目的地任务。'; return; }
    try {
      game = E.applyMove(game, { type: 'keepTickets', keep: keep });
      $('ticket-overlay').classList.remove('show');
      render(); scheduleAI();
    } catch (e) { $('status').textContent = '选择不合法：' + e.message; }
  }

  function showResult() {
    var sc = E.score(game);
    var w = E.winner(game);
    $('result-title').textContent = w === 'human' ? '你赢了！' : (w === 'ai' ? 'AI 获胜' : '平局');
    $('result-text').textContent = '总分：你 ' + sc.human + '（路线 ' + sc.humanDetail.routePts +
      ' / 任务 ' + sc.humanDetail.ticketPts + ' / 最长 ' + sc.humanDetail.longest + '）比 ' + sc.ai +
      ' AI（路线 ' + sc.aiDetail.routePts + ' / 任务 ' + sc.aiDetail.ticketPts + ' / 最长 ' + sc.aiDetail.longest + '）。';
    $('result-overlay').classList.add('show');
  }

  function scheduleAI() {
    if (aiTimer) clearTimeout(aiTimer);
    if (game.over || game.turn !== 1) return;
    aiTimer = setTimeout(function () {
      try {
        game = E.applyMove(game, E.aiMove(game));
        render(); scheduleAI();
      } catch (e) { $('status').textContent = 'AI 出错：' + e.message; }
    }, 550);
  }

  function start() {
    if (aiTimer) clearTimeout(aiTimer);
    game = E.createGame({ seed: (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, humanFirst: true });
    lastHumanMove = ''; selectedTickets = {};
    $('ticket-overlay').classList.remove('show');
    $('result-overlay').classList.remove('show');
    render();
  }

  $('draw-deck').addEventListener('click', function () { humanDraw('deck'); });
  $('draw-tickets').addEventListener('click', drawTickets);
  $('keep-tickets').addEventListener('click', keepTickets);
  $('restart').addEventListener('click', start);
  $('again').addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
