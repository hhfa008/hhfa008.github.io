<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>词影追踪 · 毛线派对微游戏</title>
<meta name="description" content="顺着词的影子，追上它真正的模样。这是一款单机也能玩的极简毛线派对游戏，你与一位 AI 玩家进行五轮追着描述找词的较量。">
<style>
:root{--bg:#101526;--panel:#1b2440;--panel2:#26335a;--ink:#eef3ff;--muted:#9fb0d6;--gold:#ffd166;--blue:#5b9dff;--green:#54d69b;--red:#ff8a96;--line:#33436e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(800px 480px at 50% -12%,#26345f,#0b1020 66%) fixed;color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--gold)}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 34px}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 0 10px}
.top h1{font-size:18px;margin:0;flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navlink{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:52px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-decoration:none;font-size:14px;color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:10px}
.score{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.panel{background:linear-gradient(180deg,#1d2848,#172039);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.prompt{font-size:17px;font-weight:700;line-height:1.6;margin:2px 0 12px;color:#f2f6ff}
.clues{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.clues li{background:#121b33;border:1px solid #2c3c63;border-radius:12px;padding:10px 12px;font-size:14px;color:#dbe6ff}
.options{display:grid;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{width:100%;min-height:52px;padding:12px 14px;border-radius:14px;border:1px solid #3b4d7c;background:linear-gradient(180deg,#24345c,#1c2948);text-align:left;font-size:15px;line-height:1.45;transition:transform .12s ease,border-color .12s ease}
.opt:active{transform:scale(.985);border-color:var(--blue)}
.ghost{width:100%;min-height:48px;margin:0 0 12px;padding:10px 14px;border-radius:13px;border:1px dashed #4a5f92;background:#141d36;color:#cfdcff;font-size:14px}
.result{background:#131d36;border:1px solid #30456f;border-radius:14px;padding:12px;margin:0 0 12px;font-size:14px;line-height:1.65;color:#e7eeff}
.result.good{border-color:#2f7d5b;background:#122a24}
.result.bad{border-color:#7d3a45;background:#2a151b}
.action{width:100%;min-height:52px;padding:12px 16px;border-radius:14px;border:0;background:linear-gradient(160deg,#7fb2ff,#4a86ef);color:#08172e;font-weight:900;font-size:16px}
.over{text-align:center;padding:10px 4px 4px}
.over .big{font-size:26px;font-weight:900;margin:6px 0 4px}
.over .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.foot{text-align:center;margin-top:14px;font-size:12px;color:#7f90b8}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* mini-quality: safe-area */
.wrap { --mini-safe-bottom: 34px; padding-bottom: calc(var(--mini-safe-bottom) + env(safe-area-inset-bottom, 0px)); }
</style>
  <link rel="canonical" href="https://hhfa008.github.io/games/boardgame/mini-party-a-03/index.html">
</head>
<body>
<div class="wrap">
<div class="top"><a class="navlink" href="../index.html" aria-label="返回桌游目录">目录</a><h1>词影追踪</h1><a class="navlink" href="rules.html">规则</a></div>
<div class="bar"><span id="progress">第 1 / 5 轮</span><span class="score" id="score">你 0 : 0 AI</span></div>
<div class="panel"><main id="stage" aria-live="polite"></main></div>
<p class="foot">猜词 · 单机 vs AI · 内置中文词库 · 零联网</p>
</div>
<script src="engine.js"></script>
<script>
(function () {
  "use strict";
  var E = window.MiniPartyEngine;
  var stage = document.getElementById("stage");
  var progressEl = document.getElementById("progress");
  var scoreEl = document.getElementById("score");
  var g = E.createGame({ seed: (Date.now() % 100000) + 1 });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function button(label, handler, cls) {
    var b = el("button", cls || "action", label);
    b.type = "button";
    b.addEventListener("click", handler);
    return b;
  }
  function render() {
    var v = E.publicView(g);
    scoreEl.textContent = "你 " + v.score + " : " + v.aiScore + " AI";
    progressEl.textContent = v.phase === "over" ? "对局结束" : "第 " + (v.round + 1) + " / " + v.maxRounds + " 轮";
    stage.textContent = "";
    if (v.phase === "over") {
      var box = el("div", "over");
      var win = v.score > v.aiScore ? "你赢了" : (v.score === v.aiScore ? "平局" : "AI 赢了");
      box.appendChild(el("div", "big", win));
      box.appendChild(el("div", "sub", "最终比分 " + v.score + " : " + v.aiScore + "，已完成 " + v.maxRounds + " 轮。"));
      box.appendChild(button("再来一局", function () {
        g = E.createGame({ seed: (Date.now() % 100000) + 1 });
        render();
      }));
      stage.appendChild(box);
      return;
    }
    var c = v.current;
    stage.appendChild(el("p", "prompt", c.prompt));
    if (v.mode === "deduce") {
      var ul = el("ul", "clues");
      c.clues.forEach(function (clue, i) {
        ul.appendChild(el("li", null, "线索 " + (i + 1) + "：" + clue));
      });
      stage.appendChild(ul);
      if (v.phase === "choose" && c.revealed < 3) {
        stage.appendChild(button("再要一条线索（本题分值降低）", function () {
          E.revealClue(g);
          render();
        }, "ghost"));
      }
    }
    if (v.phase === "choose") {
      var list = el("div", "options");
      c.options.forEach(function (opt, i) {
        list.appendChild(button(opt, function () {
          E.choose(g, i);
          render();
        }, "opt"));
      });
      stage.appendChild(list);
      return;
    }
    var last = g.history[g.history.length - 1];
    var res = el("div", "result " + (last && last.correct ? "good" : "bad"));
    res.textContent = (last && last.correct ? "答对了 +" + last.points + " 分。" : "答错了，正确答案是「" + c.options[c.answerIndex] + "」。") + (c.note ? " " + c.note : "");
    stage.appendChild(res);
    stage.appendChild(button("下一轮", function () {
      E.next(g);
      render();
    }));
  }
  if (!E) { stage.textContent = "引擎加载失败，请刷新页面。"; return; }
  render();
})();
</script>
</body>
</html>
