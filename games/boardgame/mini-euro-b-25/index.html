<script>
(function () {

  function refreshStreak() {
    var el = $('streak');
    if (!el) return;
    var st = GameProgress.dailyState(SLUG);
    el.textContent = (mode === 'daily' ? '每日 · ' + (st.done ? '今日已完成' : '今日未完成') : '自由模式') + ' · 连胜 ' + st.streak;
  }

    else if (ev.type === 'move') el.textContent = '战报：你执行了「' + p.type + '」。';
    else if (ev.type === 'settle') el.textContent = '战报：最终 ' + p.score + ' : ' + p.ai + '。';
    else el.textContent = '战报：准备开始。';
  }

    var ai = E.scoreOf ? E.scoreOf(state, 1) : 0;

    scene.emit('settle', { score: score, ai: ai, mode: mode });
