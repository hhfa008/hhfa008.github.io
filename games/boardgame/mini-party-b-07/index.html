      var yesterday = dayKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1));

      countedDaily = true;
      s.set(key(slug, 'streak'), cur.streak);
      s.set(key(slug, 'lastDay'), today);
      s.set(key(slug, 'dailyDone'), today);

    dayKey: dayKey,

      lfo.frequency.value = cfg.lfo * (1 + i * 0.13);
      var lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.18;
      lfo.connect(lfoGain);
      lfoGain.connect(g.gain);
      osc.connect(g);
      g.connect(master);
      osc.start(now);
      lfo.start(now);
      nodes.push(osc, lfo, g, lfoGain);
    });
  }

  function fadeMaster(to, seconds) {
    var master = nodes.filter(function (n) { return n.gain && n.context; })[0];
    if (!master || !ctx) return;
    try {
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(to, ctx.currentTime + (seconds || 0.8));
    } catch (e) { /* ignore */ }
  }

  function play(scene) {
    var name = SCENES[scene] ? scene : 'table';
    if (!AudioCtor()) { current = name; return false; }
    if (!ensureCtx()) { current = name; return false; }
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) { /* ignore */ } }
    clearNodes();
    current = name;
    scheduleScene(name);
    if (timer) clearInterval(timer);
    // Rebuild the chord每 12 秒，形成缓慢的呼吸而不是一条死板长音。
    timer = setInterval(function () {
      if (!ctx || !current) return;
      clearNodes();
      scheduleScene(current);
    }, 12000);
    return true;
  }

  function stop() {
    clearNodes();
    current = null;
    return true;
  }

  function setVolume(v) {
    volume = Math.max(0, Math.min(1, Number(v) || 0));
    storageSet(VOLUME_KEY, String(volume));
    return volume;
  }

  function mute(on) {
    muted = Boolean(on);
    storageSet(MUTE_KEY, muted ? '1' : '0');
    fadeMaster(muted ? 0 : volume * (SCENES[current] || SCENES.table).gain, 0.4);
    return muted;
  }

  function scenes() { return Object.keys(SCENES); }
  function isMuted() { return muted; }
  function currentScene() { return current; }
  function getVolume() { return volume; }

  return {
    play: play,
    stop: stop,
    setVolume: setVolume,
    getVolume: getVolume,
    mute: mute,
    isMuted: isMuted,
    current: currentScene,
    scenes: scenes,
    version: '1.0.0'
  };
});

return module.exports;})();
</script>
<script>
(function () {
  'use strict';
  var E = window.MiniPartyEngine;
  var game = null;
  var roundStamp = 0;
  var hideTimer = null;
  var SLUG = "mini-party-b-07";
  var mode = "free";
  var currentSeed = Date.now() % 1000000000;
  var settled = false;
  var bgmOn = false;
  var scene = Scene.create({
    id: SLUG,
    ambience: "market",
    cast: [{ id: "you", name: "你", role: "player" }, { id: "ai", name: "AI 对手", role: "ai" }]
  });
  var replay = Replay.create({ game: SLUG, seed: currentSeed, params: { mode: mode } });
  var el = {
    you: document.getElementById('you'),
    ai: document.getElementById('ai'),
    round: document.getElementById('round'),
    prompt: document.getElementById('prompt'),
    detail: document.getElementById('detail'),
    hint: document.getElementById('hint'),
    options: document.getElementById('options'),
    result: document.getElementById('result'),
    log: document.getElementById('log')
  };
  function esc(text) {
    return String(text).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function render() {
    if (!game) return;
    el.you.textContent = game.scores[0];
    el.ai.textContent = game.scores[1];
    el.round.textContent = Math.min(game.round, game.maxRounds);
    el.prompt.textContent = game.prompt;
    el.detail.textContent = game.detail || '';
    el.hint.textContent = game.hint || '';
    el.detail.classList.remove('hidden');
    clearTimeout(hideTimer);
    if (game.phase === 'choose' && (game.family === 'memory' || game.extra.hide)) {
      var token = roundStamp;
      hideTimer = setTimeout(function () {
        if (game && token === roundStamp && game.phase === 'choose') el.detail.classList.add('hidden');
      }, 1800);
    }
    el.options.innerHTML = '';
    el.options.classList.toggle('single', game.options.length <= 2);
    if (E.isOver(game)) {
      finish(game);
      el.result.textContent = game.lastResult || '';
      var again = document.createElement('button');
      again.type = 'button';
      again.className = 'next';
      again.textContent = '再来一局';
      again.addEventListener('click', newGame);
      el.options.appendChild(again);
    } else if (game.phase === 'result') {
      el.result.textContent = game.lastResult || '';
      var next = document.createElement('button');
      next.type = 'button';
      next.className = 'next';
      next.textContent = game.round >= game.maxRounds ? '查看最终结果' : '下一回合';
      next.addEventListener('click', function () {
        E.applyAction(game, { type: 'next' });
        replay.add({ type: 'next' });
        saveReplay();
        scene.emit('round', { round: game.round });
        paintLog();
        roundStamp = performance.now();
        render();
      });
      el.options.appendChild(next);
    } else {
      el.result.textContent = '第 ' + game.round + ' / ' + game.maxRounds + ' 回合';
      game.options.forEach(function (opt) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = opt.label;
        btn.setAttribute('data-id', opt.id);
        btn.addEventListener('click', function () {
          var ms = Math.round(performance.now() - roundStamp);
          var res = E.applyAction(game, { type: 'choose', choice: opt.id, ms: ms });
          if (!res.ok) return;
          replay.add({ type: 'choose', choice: opt.id, ms: ms });
          saveReplay();
          scene.emit('answer', { round: game.round, choice: opt.id });
          paintLog();
          render();
        });
        el.options.appendChild(btn);
      });
    }
    el.log.innerHTML = game.log.slice(-8).map(function (line) {
      return '<p>' + esc(line) + '</p>';
    }).join('');
    el.log.scrollTop = el.log.scrollHeight;
  }
  function newSeed() {
    currentSeed = mode === 'daily' ? GameProgress.dailySeed(SLUG) : (Date.now() % 1000000000);
    return currentSeed;
  }
  function saveReplay() {
    try { Replay.saveLocal('replay.' + SLUG, replay); } catch (e) { /* storage optional */ }
  }
  function refreshStreak() {
    var el = document.getElementById('streak');
    if (!el) return;
    var st = GameProgress.dailyState(SLUG);
    el.textContent = (mode === 'daily' ? '每日 · ' + (st.done ? '今日已完成' : '今日未完成') : '自由模式') + ' · 连胜 ' + st.streak;
  }
  function describe(event) {
    if (!event) return '战报：准备开始。';
    var p = event.payload || {};
    if (event.type === 'answer') return '战报：第 ' + (p.round + 1) + ' 回合已选择。';
    if (event.type === 'round') return '战报：进入第 ' + (p.round + 1) + ' 回合。';
    if (event.type === 'settle') {
      var verdict = p.score > p.ai ? '你赢了' : (p.score === p.ai ? '平局' : 'AI 赢了');
      return '战报：最终 ' + p.score + ' : ' + p.ai + ' AI · ' + verdict + '。';
    }
    return '战报：准备开始。';
  }
  function paintLog() {
    var el = document.getElementById('sceneLog');
    if (el) el.textContent = describe(scene.events(1)[0]);
  }
  function finish(current) {
    if (settled) return;
    settled = true;
    var score = Number(current.scores[0]) || 0;
    var ai = Number(current.scores[1]) || 0;
    scene.updateCast('you', { emotion: score > ai ? 'happy' : (score === ai ? 'neutral' : 'sad') });
    scene.emit('settle', { score: score, ai: ai, mode: mode });
    try { localStorage.removeItem('replay.' + SLUG); } catch (e) { /* ignore */ }
    try { GameProgress.record({ slug: SLUG, mode: mode, score: score }); } catch (e) { /* storage optional */ }
    refreshStreak();
    paintLog();
  }
  function startBgm() {
    if (bgmOn) return;
    bgmOn = true;
    try { Bgm.play(scene.ambience); } catch (e) { /* audio optional */ }
  }
  document.addEventListener('pointerdown', startBgm, { once: true });

  function newGame(nextMode) {
    if (nextMode) mode = nextMode;
    if (nextMode) {
      var rb = document.getElementById('resumeBtn');
      if (rb) rb.hidden = true;
    }
    settled = false;
    game = E.createGame({ seed: newSeed() });
    replay = Replay.create({ game: SLUG, seed: currentSeed, params: { mode: mode } });
    try { localStorage.removeItem('replay.' + SLUG); } catch (e) { /* ignore */ }
    roundStamp = performance.now();
    refreshStreak();
    paintLog();
    render();
  }
  document.getElementById('newGame').addEventListener('click', function () { newGame('free'); });
  document.getElementById('freeBtn').addEventListener('click', function () { newGame('free'); });
  document.getElementById('dailyBtn').addEventListener('click', function () { newGame('daily'); });
  document.getElementById('bgmBtn').addEventListener('click', function () {
    startBgm();
    var muted = Bgm.mute(!Bgm.isMuted());
    var btn = document.getElementById('bgmBtn');
    btn.textContent = muted ? '音景 关' : '音景 开';
    btn.setAttribute('aria-pressed', muted ? 'false' : 'true');
  });
  (function resumePrompt() {
    var saved = null;
    try { saved = Replay.loadLocal('replay.' + SLUG); } catch (e) { /* storage optional */ }
    var btn = document.getElementById('resumeBtn');
    if (!btn || !saved || !saved.actions().length) return;
    btn.hidden = false;
    btn.addEventListener('click', function () {
      mode = (saved.params && saved.params.mode) || 'free';
      currentSeed = saved.seed;
      settled = false;
      game = E.createGame({ seed: currentSeed });
      var acts = saved.actions();
      for (var i = 0; i < acts.length; i += 1) {
        var applied = E.applyAction(game, acts[i]);
        if (!applied || applied.ok === false) break;
      }
      replay = saved;
      btn.hidden = true;
      roundStamp = performance.now();
      refreshStreak();
      paintLog();
      render();
    });
  })();
  newGame();
}());
</script>
</body>
</html>
