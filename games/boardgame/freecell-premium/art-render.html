<!doctype html>
<html lang="zh-CN" data-shot="cover">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="assets/cover.webp">
<meta name="description" content="接龙/纸牌游戏的宣传图合成页：真实牌局、材质与代码绘制牌面。">
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/freecell-premium/art-render.html">
<meta property="og:title" content="freecell-premium 宣传图合成">
<meta property="og:description" content="本地材质与真实牌局合成的宣传图页面。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hhfa008.github.io/games/boardgame/freecell-premium/art-render.html">
<title>空当接龙 · 精品版配图</title>
<style>
#stage,.stage{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
:root{
  --ink:#eef3ff;--dim:#b3bfdc;--gold:#d8b26a;--gold2:#f4dda2;--ivory:#f8f2e1;--red:#b2271f;--black:#1b2233;
  --felt-img:url("../../assets/art/premium/freecell/felt.webp");
  --back-img:url("../../assets/art/premium/freecell/card-back.webp");
  --font-display:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --step:26px;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#040b1c;color:var(--ink);font-family:var(--font-body)}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.stage{
  width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:22px;
  padding:44px 46px;
  background:
    radial-gradient(90% 60% at 50% 0%,rgba(46,92,170,.42),transparent 62%),
    radial-gradient(80% 50% at 50% 112%,rgba(2,8,24,.8),transparent 66%),
    linear-gradient(160deg,#0a1834,#050d22 58%,#030817);
}
.brandline{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{
  margin:0;font-family:var(--font-display);font-weight:700;letter-spacing:.08em;
  font-size:clamp(40px,6.4vw,88px);line-height:1;color:var(--gold2);
  background:linear-gradient(180deg,#fbe9b7,var(--gold) 60%,#a87b2e);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 2px 0 rgba(0,0,0,.2);
}
.en{font-size:clamp(14px,1.5vw,22px);letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  padding:.28em .8em;border-radius:999px;font-size:clamp(12px,1.25vw,18px);font-weight:700;letter-spacing:.16em;
  color:#201705;background:linear-gradient(180deg,#f7e4b2,#d3a84f);border:1px solid #f9ecc6;
}
.sub{margin:0;font-size:clamp(13px,1.4vw,21px);color:var(--dim);letter-spacing:.06em}
.caption{margin:0;font-size:clamp(12px,1.2vw,17px);color:#8fa0c5;letter-spacing:.08em}

.board{
  position:relative;padding:14px;border-radius:18px;
  background:
    linear-gradient(180deg,rgba(3,9,24,.34),rgba(3,9,24,.64)),
    var(--felt-img) center/cover;
  border:1px solid rgba(216,178,106,.34);
  box-shadow:0 30px 80px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 80px rgba(0,7,24,.55);
}
.toprow{display:flex;gap:16px;margin-bottom:14px}
.zonegroup{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;flex:1;min-width:0}
.slot{
  position:relative;aspect-ratio:63/88;border-radius:6px;border:1px dashed rgba(216,178,106,.42);
  background:rgba(3,10,28,.3);
}
.slot.empty{
  background-image:linear-gradient(180deg,rgba(5,16,42,.42),rgba(4,12,32,.66)),var(--back-img);
  background-size:cover;background-position:center;border-style:solid;border-color:rgba(216,178,106,.5);
}
.slot .mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(216,178,106,.62)}
.slot .mark svg{width:42%;height:42%;fill:currentColor}
.slot .free-mark::before{content:"";width:34%;aspect-ratio:1;border:1px dashed currentColor;border-radius:50%;opacity:.7}
.slot .count{position:absolute;right:5px;bottom:3px;font-size:12px;font-weight:700;color:var(--gold2);opacity:.85}
.tableau{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.col{position:relative;min-width:0;border-radius:6px;background:linear-gradient(180deg,rgba(4,12,32,.12),rgba(4,12,32,.28));border:1px solid rgba(216,178,106,.12)}

.card{
  position:relative;display:block;width:100%;aspect-ratio:63/88;border-radius:7%;
  background:radial-gradient(120% 90% at 20% 0%,#fffef9,rgba(255,254,249,0) 58%),linear-gradient(155deg,#fffdf5 0%,var(--ivory) 48%,#e7dcc1 100%);
  color:var(--black);box-shadow:0 3px 8px rgba(0,0,0,.46),0 1px 0 rgba(255,255,255,.66) inset,0 0 0 1px rgba(70,56,30,.26);
  overflow:hidden;
}
.card.red{color:var(--red)}
.card::before{content:"";position:absolute;inset:0;border-radius:7%;pointer-events:none;background:repeating-linear-gradient(120deg,rgba(120,95,45,.045) 0 1px,transparent 1px 4px)}
.corner{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.86;z-index:2}
.corner.tl{left:5.5%;top:4%}
.corner.br{right:5.5%;bottom:4%;transform:rotate(180deg)}
.rank{display:block;font-family:var(--font-display);font-weight:700;font-size:clamp(12px,1.5vw,17px);line-height:.9}
.suit-ico{display:block;width:clamp(7px,.85vw,11px);height:auto;margin-top:1px;fill:currentColor}
.pips{position:absolute;left:18%;top:13.5%;width:64%;height:73%;z-index:1}
.pips use{fill:currentColor}
.ace{position:absolute;inset:20% 24%;display:flex;align-items:center;justify-content:center;z-index:1}
.ace svg{width:74%;height:74%;fill:currentColor}
.ace::after{content:"";position:absolute;inset:4%;border-radius:50%;border:1px solid currentColor;opacity:.22}
.court{position:absolute;inset:14% 15%;border:1px solid currentColor;border-radius:4px;z-index:1}
.court .mono{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:var(--font-display);font-weight:700;font-size:clamp(18px,2.4vw,32px);line-height:1}
.court .mono.mirror{top:auto;bottom:3%;transform:rotate(180deg);font-size:clamp(12px,1.3vw,15px);opacity:.6}
.court .fili{position:absolute;inset:0;width:100%;height:100%;opacity:.38}
.court .fili path,.court .fili circle{fill:none;stroke:currentColor;stroke-width:1.1}
.col .card + .card{margin-top:calc(var(--step) - 139.6825%)}

/* ------------------------------------------------------------- shots */
html[data-shot="cover"] .stage{gap:26px}
html[data-shot="cover"] .board{width:100%}
html[data-shot="cover"]{--step:clamp(18px,2.4vw,30px)}

html[data-shot="og"] .stage{flex-direction:row;align-items:center;gap:34px;padding:30px 36px}
html[data-shot="og"] .hero-text{width:30%;flex:none}
html[data-shot="og"] .board{flex:1;min-width:0}
html[data-shot="og"] .caption{display:none}
html[data-shot="og"]{--step:clamp(14px,1.9vw,24px)}
html[data-shot="og"] h1{font-size:clamp(34px,4.6vw,62px)}

html[data-shot="detail"] .stage{padding:50px 56px;gap:26px}
html[data-shot="detail"]{--step:clamp(16px,2.2vw,30px)}

html[data-shot="card"] .stage{padding:16px 18px;gap:8px;justify-content:center}
html[data-shot="card"] h1{font-size:30px}
html[data-shot="card"] .brandline{gap:8px}
html[data-shot="card"] .en{font-size:11px;letter-spacing:.24em}
html[data-shot="card"] .badge{font-size:11px;padding:.16em .6em}
html[data-shot="card"] .sub{font-size:11px}
html[data-shot="card"] .caption{display:none}
html[data-shot="card"]{--step:clamp(8px,.9vw,12px)}
html[data-shot="card"] .board{padding:8px;border-radius:12px}
html[data-shot="card"] .toprow{gap:8px;margin-bottom:8px}
html[data-shot="card"] .zonegroup{gap:4px}
html[data-shot="card"] .tableau{gap:4px}
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <symbol id="suit-0" viewBox="0 0 24 24"><circle cx="12" cy="6.7" r="4.1"/><circle cx="6.9" cy="13.3" r="4.1"/><circle cx="17.1" cy="13.3" r="4.1"/><path d="M10.8 14.7h2.4c-.15 3.1-.55 5.4-1.2 7.3-.65-1.9-1.05-4.2-1.2-7.3Z"/></symbol>
    <symbol id="suit-1" viewBox="0 0 24 24"><path d="M12 1.6 21.4 12 12 22.4 2.6 12Z"/></symbol>
    <symbol id="suit-2" viewBox="0 0 24 24"><path d="M12 21.7C10.1 20 3 14.8 3 9.6 3 6.4 5.3 4.1 8.2 4.1c1.6 0 3 .8 3.8 2 .8-1.2 2.2-2 3.8-2 2.9 0 5.2 2.3 5.2 5.5 0 5.2-7.1 10.4-9 12.1Z"/></symbol>
    <symbol id="suit-3" viewBox="0 0 24 24"><path d="M12 1.7c-.7 1.6-2.6 3.4-4.5 5.1C5.5 8.5 4 10.4 4 12.6c0 2.5 1.8 4.3 4.2 4.3 1.5 0 2.9-.8 3.6-2v3.7c0 1.2-.7 2-1.9 2.2v1.2h4.2v-1.2c-1.2-.2-1.9-1-1.9-2.2v-3.7c.7 1.2 2.1 2 3.6 2 2.4 0 4.2-1.8 4.2-4.3 0-2.2-1.5-4.1-3.5-5.8-1.9-1.7-3.8-3.5-4.5-5.1Z"/></symbol>
  </defs>
</svg>

<div class="stage">
  <div class="hero-text">
    <div class="brandline">
      <h1>空当接龙</h1>
      <span class="badge">单人</span>
    </div>
    <p class="sub">FreeCell · 微软局号 #1 · 四空位 · 超级搬运</p>
  </div>
  <div class="board" id="board"></div>
  <p class="caption" id="caption">真实牌局 · 微软局号 #1 · 由提示走法推进后的合法局面</p>
</div>

<script src="../../shared/shuffle.js"></script>
<script src="engine.js"></script>
<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var E = window.FreeCellEngine;
  var $ = function (id) { return document.getElementById(id); };
  function shot() {
    try {
      var s = new URLSearchParams(location.search).get('shot');
      return ['cover', 'og', 'detail', 'card'].indexOf(s) !== -1 ? s : 'cover';
    } catch (err) { return 'cover'; }
  }
  var mode = shot();
  document.documentElement.setAttribute('data-shot', mode);

  var PIP_LAYOUT = {
    2: [[50, 26], [50, 114]], 3: [[50, 26], [50, 70], [50, 114]],
    4: [[26, 30], [74, 30], [26, 110], [74, 110]],
    5: [[26, 30], [74, 30], [50, 70], [26, 110], [74, 110]],
    6: [[26, 26], [74, 26], [26, 70], [74, 70], [26, 114], [74, 114]],
    7: [[26, 26], [74, 26], [50, 48], [26, 70], [74, 70], [26, 114], [74, 114]],
    8: [[26, 26], [74, 26], [50, 48], [26, 70], [74, 70], [50, 92], [26, 114], [74, 114]],
    9: [[26, 22], [74, 22], [26, 58], [74, 58], [50, 70], [26, 82], [74, 82], [26, 118], [74, 118]],
    10: [[26, 22], [74, 22], [50, 44], [26, 58], [74, 58], [26, 82], [74, 82], [50, 96], [26, 118], [74, 118]]
  };
  function suitGlyph(card) {
    return '<svg class="suit-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#suit-' + card.suit + '"></use></svg>';
  }
  function pips(card) {
    var layout = PIP_LAYOUT[card.rank];
    if (!layout) return '';
    var use = '<use href="#suit-' + card.suit + '" x="-11" y="-11" width="22" height="22"';
    return '<svg class="pips" viewBox="0 0 100 140" aria-hidden="true">' + layout.map(function (p) {
      var rot = p[1] >= 70 ? ' rotate(180)' : '';
      return use + ' transform="translate(' + p[0] + ' ' + p[1] + ')' + rot + '"></use>';
    }).join('') + '</svg>';
  }
  function filigree() {
    return '<svg class="fili" viewBox="0 0 100 140" aria-hidden="true"><path d="M12 26c10 4 16 10 20 20M88 26c-10 4-16 10-20 20M12 114c10-4 16-10 20-20M88 114c-10-4-16-10-20-20"/><circle cx="50" cy="70" r="16"/><path d="M50 48v44M34 70h32"/></svg>';
  }
  function cardMarkup(card) {
    var rank = E.rankLabel(card.rank);
    var corner = '<span class="corner tl"><span class="rank">' + rank + '</span>' + suitGlyph(card) + '</span>' +
      '<span class="corner br"><span class="rank">' + rank + '</span>' + suitGlyph(card) + '</span>';
    var center;
    if (card.rank === 1) {
      center = '<span class="ace"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#suit-' + card.suit + '"></use></svg></span>';
    } else if (card.rank >= 11) {
      center = '<span class="court">' + filigree() + '<span class="mono">' + rank + '</span><span class="mono mirror">' + rank + '</span></span>';
    } else {
      center = pips(card);
    }
    return '<div class="card ' + (card.color === 'red' ? 'red' : 'black') + '" data-card="' + card.id + '" aria-label="' + card.label + '">' + corner + center + '</div>';
  }
  function suitUrl(suit) {
    return '<span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#suit-' + suit + '"></use></svg></span>';
  }

  // Deal #1 is a real Microsoft deal. For most shots we play a deterministic
  // sequence of legal moves (foundation first, multi-card runs, then tableau
  // builds) so the artwork shows a varied legal mid-game position rather than
  // a mood image. The same card is penalised for an immediate return trip,
  // which keeps the composition from oscillating. Every card exists once.
  var game = E.createGame({ dealNumber: 1 });
  if (mode !== 'card') {
    var prevCard = null;
    for (var i = 0; i < 18; i++) {
      var moves = E.getLegalMoves(game);
      if (!moves.length) break;
      var best = null;
      var bestValue = -1e9;
      for (var m = 0; m < moves.length; m++) {
        var move = moves[m];
        var value = 0;
        if (move.to.zone === 'foundation') value += 300;
        if (move.from.zone === 'foundation') value -= 200;
        if (move.count > 1) value += 90;
        if (move.to.zone === 'tableau') {
          value += move.toEmpty ? 30 : 70;
          if (game.tableau[move.to.col].length >= 7) value -= 80;
        }
        if (move.to.zone === 'free') value += 18;
        if (move.cardId === prevCard) value -= 150;
        if (value > bestValue || (value === bestValue && (!best || move.key < best.key))) {
          bestValue = value;
          best = move;
        }
      }
      game = E.applyMove(game, best.key);
      prevCard = best.cardId;
    }
    $('caption').textContent = '真实牌局 · 微软局号 #1 · 确定性合法走法推进 ' + game.moves + ' 步后的局面';
  } else {
    $('caption').textContent = '真实牌局 · 微软局号 #1 开局';
  }

  var html = '<section class="toprow"><div class="zonegroup" data-zone="freegroup">';
  for (var f = 0; f < 4; f++) {
    var freeCard = game.freeCells[f];
    html += '<div class="slot free-slot' + (freeCard ? '' : ' empty') + '" data-free="' + f + '">' +
      (freeCard ? cardMarkup(freeCard) : '<span class="mark free-mark"></span>') + '</div>';
  }
  html += '</div><div class="zonegroup" data-zone="foundgroup">';
  for (var s = 0; s < 4; s++) {
    var pile = game.foundations[s];
    var top = pile.length ? pile[pile.length - 1] : null;
    html += '<div class="slot foundation-slot' + (top ? '' : ' empty') + '" data-foundation="' + s + '">' +
      (top ? cardMarkup(top) : suitUrl(s)) +
      (pile.length ? '<span class="count">' + pile.length + '</span>' : '') + '</div>';
  }
  html += '</div></section><section class="tableau">';
  for (var c = 0; c < 8; c++) {
    html += '<div class="col" data-col="' + c + '">' + game.tableau[c].map(cardMarkup).join('') + '</div>';
  }
  html += '</section>';
  $('board').innerHTML = html;
  document.documentElement.setAttribute('data-cards', String(E.allCards(game).length));
})();
</script>
</body>
</html>
