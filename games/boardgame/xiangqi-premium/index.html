<script>
(function () {
  'use strict';
  var E = window.XiangqiEngine;
  var D = window.XiangqiData;
  var NS = 'http://www.w3.org/2000/svg';
  var COLS = 9, ROWS = 10, M = 40, CW = 57.5, CH = 57.78;
  var ROOT = document.documentElement;
  var $ = function (id) { return document.getElementById(id); };
  var svg = $('board');

  var state = E.createGame();
  var stack = [];
  var selected = -1;
  var lastMove = null;
  var lastAnim = null;
  var busy = false;
  var aiToken = 0;
  var mode = 'ai';
  var level = 2;
  var resultOpen = false;
  var online = null;
  var pollTimer = null;

  var layers = {};

  function sfx(name, opts) {
    try { if (window.Sfx && typeof window.Sfx.play === 'function') window.Sfx.play(name, opts); } catch (err) {}
  }
  function toast(msg) {
    return Dom.toast(msg);
  }
  function el(name, attrs, text) {
    return Dom.el(name, attrs, { ns: NS, text: text });
  }
  function px(sq) { return M + (sq % COLS) * CW; }
  function py(sq) { return M + Math.floor(sq / COLS) * CH; }
  function isOnline() { return !!online; }
  function currentMoves() {
    if (isOnline()) {
      if (!online.view || !Array.isArray(online.view.legalActions)) return [];
      return online.view.legalActions.map(function (m) { return m.code; });
    }
    return E.legalMovesFor(state);
  }
  function canInteract() {
    if (busy || !state || state.over) return false;
    if (isOnline()) {
      var v = online.view;
      return !!(v && v.you != null && v.state && v.state.turnSeat === v.you);
    }
    return true;
  }

  /* ---------------------------------------------------------------- */
  /* Static board                                                      */
  /* ---------------------------------------------------------------- */
  function buildStaticBoard() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var defs = el('defs');
    var boardPat = el('pattern', { id: 'woodPat', patternUnits: 'userSpaceOnUse', width: '500', height: '560' });
    boardPat.appendChild(el('image', { href: D.art.board, x: '0', y: '0', width: '500', height: '560', preserveAspectRatio: 'xMidYMid slice' }));
    defs.appendChild(boardPat);
    var piecePat = el('pattern', { id: 'piecePat', patternUnits: 'userSpaceOnUse', width: '49', height: '49' });
    piecePat.appendChild(el('image', { href: D.art.piece, x: '0', y: '0', width: '49', height: '49', preserveAspectRatio: 'xMidYMid slice' }));
    defs.appendChild(piecePat);
    var shadow = el('filter', { id: 'pieceShadow', x: '-40%', y: '-40%', width: '180%', height: '180%' });
    shadow.appendChild(el('feDropShadow', { dx: '1.2', dy: '2.2', stdDeviation: '1.8', 'flood-color': '#2a170b', 'flood-opacity': '.52' }));
    defs.appendChild(shadow);
    var glow = el('filter', { id: 'checkGlow', x: '-80%', y: '-80%', width: '260%', height: '260%' });
    glow.appendChild(el('feDropShadow', { dx: '0', dy: '0', stdDeviation: '5', 'flood-color': '#e0472f', 'flood-opacity': '.9' }));
    defs.appendChild(glow);
    svg.appendChild(defs);

    var board = el('g');
    board.appendChild(el('rect', { x: '16', y: '16', width: '508', height: '568', rx: '12', fill: 'url(#woodPat)', stroke: '#6f4622', 'stroke-width': '2.5' }));
    board.appendChild(el('rect', { x: '26', y: '26', width: '488', height: '548', rx: '6', fill: 'none', stroke: 'rgba(74,42,18,.5)', 'stroke-width': '1' }));
    svg.appendChild(board);

    var grid = el('g', { stroke: 'rgba(63,35,15,.82)', 'stroke-width': '1.35', 'stroke-linecap': 'round' });
    var r, c;
    for (r = 0; r < ROWS; r++) {
      grid.appendChild(el('line', { x1: String(M), y1: String(M + r * CH), x2: String(M + 8 * CW), y2: String(M + r * CH) }));
    }
    for (c = 0; c < COLS; c++) {
      var x = M + c * CW;
      if (c === 0 || c === 8) {
        grid.appendChild(el('line', { x1: String(x), y1: String(M), x2: String(x), y2: String(M + 9 * CH) }));
      } else {
        grid.appendChild(el('line', { x1: String(x), y1: String(M), x2: String(x), y2: String(M + 4 * CH) }));
        grid.appendChild(el('line', { x1: String(x), y1: String(M + 5 * CH), x2: String(x), y2: String(M + 9 * CH) }));
      }
    }
    [[3, 0], [5, 0], [3, 7], [5, 7]].forEach(function (p) {
      var x0 = M + p[0] * CW, y0 = M + p[1] * CH;
      grid.appendChild(el('line', { x1: String(x0), y1: String(y0), x2: String(x0 + 2 * CW), y2: String(y0 + 2 * CH) }));
      grid.appendChild(el('line', { x1: String(x0 + 2 * CW), y1: String(y0), x2: String(x0), y2: String(y0 + 2 * CH) }));
    });
    svg.appendChild(grid);

    var river = el('g', { 'font-family': '"Songti SC","STSong","Noto Serif SC",serif', 'font-weight': '700', 'font-size': '27', fill: 'rgba(86,52,25,.9)', 'letter-spacing': '10', opacity: '.9' });
    river.appendChild(el('text', { x: '152', y: '309', 'text-anchor': 'middle' }, '楚 河'));
    river.appendChild(el('text', { x: '388', y: '309', 'text-anchor': 'middle' }, '汉 界'));
    svg.appendChild(river);

    var mark = el('g', { fill: 'none', stroke: 'rgba(72,42,18,.55)', 'stroke-width': '1.2' });
    [[2, 3], [6, 3], [2, 6], [6, 6]].forEach(function (p) {
      var cx = M + p[0] * CW, cy = M + p[1] * CH, d = 6;
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (q) {
        mark.appendChild(el('path', {
          d: 'M ' + (cx + q[0] * d) + ' ' + (cy + q[1] * (d + 1)) + ' L ' + (cx + q[0] * d) + ' ' + (cy + q[1] * d) + ' L ' + (cx + q[0] * (d + 1)) + ' ' + (cy + q[1] * d),
          'stroke-linecap': 'round'
        }));
      });
    });
    svg.appendChild(mark);

    layers.last = el('g');
    layers.piece = el('g');
    layers.dest = el('g');
    layers.hit = el('g');
    svg.appendChild(layers.last);
    svg.appendChild(layers.piece);
    svg.appendChild(layers.dest);
    svg.appendChild(layers.hit);
    buildHits();
  }

  function buildHits() {
    while (layers.hit.firstChild) layers.hit.removeChild(layers.hit.firstChild);
    for (var sq = 0; sq < 90; sq++) {
      layers.hit.appendChild(el('circle', {
        cx: String(px(sq)), cy: String(py(sq)), r: '27',
        fill: 'transparent', class: 'hit', 'data-sq': String(sq)
      }));
    }
  }

  /* ---------------------------------------------------------------- */
  /* Dynamic board                                                     */
  /* ---------------------------------------------------------------- */
  function render() {
    renderLast();
    renderPieces();
    renderDests();
    renderStatus();
    renderMoves();
    renderCaptures();
    renderControls();
  }

  function renderLast() {
    while (layers.last.firstChild) layers.last.removeChild(layers.last.firstChild);
    if (!lastMove) return;
    [lastMove.from, lastMove.to].forEach(function (sq) {
      layers.last.appendChild(el('circle', {
        cx: String(px(sq)), cy: String(py(sq)), r: '23',
        fill: 'none', stroke: 'rgba(255,222,150,.55)', 'stroke-width': '2', 'stroke-dasharray': sq === lastMove.to ? 'none' : '4 5'
      }));
    });
  }

  function renderPieces() {
    while (layers.piece.firstChild) layers.piece.removeChild(layers.piece.firstChild);
    var kingSq = (state.check && !state.over) ? E.kingSquare(state.board, state.turn) : -1;
    for (var sq = 0; sq < 90; sq++) {
      var p = state.board[sq];
      if (!p) continue;
      var side = E.sideOfPiece(p);
      var color = side === E.RED ? D.palette.red : D.palette.ink;
      var x = px(sq), y = py(sq);
      var g = el('g', { class: 'piece ' + (side === E.RED ? 'red' : 'black'), 'data-piece': String(sq) });
      g.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      if (lastAnim && lastAnim.to === sq) {
        g.style.transition = 'none';
        g.style.transform = 'translate(' + px(lastAnim.from) + 'px,' + py(lastAnim.from) + 'px)';
        requestAnimationFrame(function () {
          g.style.transition = '';
          g.style.transform = 'translate(' + px(sq) + 'px,' + py(sq) + 'px)';
        });
      }
      g.appendChild(el('ellipse', { cx: '0', cy: '4.5', rx: '20', ry: '5', fill: 'rgba(26,14,6,.4)' }));
      g.appendChild(el('circle', { cx: '0', cy: '0', r: '24', fill: 'url(#piecePat)', stroke: side === E.RED ? 'rgba(145,42,30,.75)' : 'rgba(48,34,24,.8)', 'stroke-width': '1.5', filter: sup('pieceShadow') }));
      g.appendChild(el('circle', { cx: '0', cy: '0', r: '19.4', fill: 'none', stroke: color, 'stroke-width': '1.9', opacity: '.92' }));
      g.appendChild(el('circle', { cx: '0', cy: '-1', r: '21.2', fill: 'none', stroke: 'rgba(255,255,255,.3)', 'stroke-width': '.9' }));
      var text = el('text', {
        x: '0', y: '2.5', 'text-anchor': 'middle', 'dominant-baseline': 'middle',
        'font-family': '"Songti SC","STSong","Noto Serif SC",serif', 'font-weight': '700',
        'font-size': '30', fill: color, 'letter-spacing': '0'
      }, E.CHAR[p]);
      g.appendChild(text);
      if (selected === sq) {
        g.appendChild(el('circle', { cx: '0', cy: '0', r: '26.5', fill: 'none', stroke: '#ffe3a3', 'stroke-width': '2.4' }));
      }
      if (sq === kingSq) {
        g.appendChild(el('circle', { cx: '0', cy: '0', r: '27', fill: 'none', stroke: '#ff6a4d', 'stroke-width': '2', opacity: '.85', filter: sup('checkGlow') }));
      }
      layers.piece.appendChild(g);
    }
  }

  function sup(id) { return 'url(#' + id + ')'; }

  function renderDests() {
    while (layers.dest.firstChild) layers.dest.removeChild(layers.dest.firstChild);
    if (selected < 0) return;
    var moves = currentMoves().filter(function (code) { return E.moveFrom(code) === selected; });
    moves.forEach(function (code) {
      var to = E.moveTo(code);
      var capture = !!state.board[to];
      if (capture) {
        layers.dest.appendChild(el('circle', { cx: String(px(to)), cy: String(py(to)), r: '22', fill: 'none', stroke: 'rgba(232,92,64,.9)', 'stroke-width': '2.6', 'stroke-dasharray': '5 4' }));
      } else {
        layers.dest.appendChild(el('circle', { cx: String(px(to)), cy: String(py(to)), r: '7.5', fill: 'rgba(255,226,158,.92)' }));
      }
    });
  }

  function renderStatus() {
    var chip = $('turnChip');
    var text = $('turnText');
    var big = $('statusBig');
    var sub = $('statusSub');
    chip.classList.toggle('black', state.turn === E.BLACK);
    chip.classList.toggle('check', !!(state.check && !state.over));
    if (state.over) {
      text.textContent = '对局结束';
      big.textContent = resultTitleText();
      sub.textContent = resultSubText();
    } else if (busy) {
      text.textContent = 'AI 思考中…';
      big.textContent = 'AI 思考中…';
      sub.textContent = '第 ' + state.moveNo + ' 回合 · 正在搜索最佳着法';
    } else {
      var sideName = state.turn === E.RED ? '红方' : '黑方';
      text.textContent = '轮到' + sideName;
      big.textContent = sideName + '行棋' + (state.check ? ' · 被将军' : '');
      sub.textContent = '第 ' + state.moveNo + ' 回合 · 棋盘上 ' + state.board.filter(Boolean).length + ' 枚棋子';
    }
    var hint = $('hint');
    if (state.over) hint.textContent = resultSubText();
    else if (busy) hint.textContent = 'AI 正在计算，请稍候。';
    else if (state.check) hint.textContent = '注意：' + (state.turn === E.RED ? '红方' : '黑方') + '被将军，必须先解将。';
    else if (selected >= 0) hint.textContent = '已选中 ' + E.CHAR[state.board[selected]] + '，点高亮落点完成走子。';
    else hint.textContent = '点选一枚棋子，再点高亮落点。' + (mode === 'ai' && state.turn === E.BLACK ? 'AI 执黑。' : '');
  }

  function markRow(entry, side) {
    var span = document.createElement('span');
    span.className = 'mv ' + (side === E.RED ? 'red' : 'dark');
    if (lastMove && entry && entry.to === lastMove.to && entry.from === lastMove.from) span.classList.add('last');
    span.textContent = entry ? entry.notation : '';
    return span;
  }

  function renderMoves() {
    var list = $('movesList');
    while (list.firstChild) list.removeChild(list.firstChild);
    if (!state.history.length) {
      var p = document.createElement('p');
      p.className = 'empty-note';
      p.textContent = '还没有着法。红方先行。';
      list.appendChild(p);
      return;
    }
    var byNumber = {};
    state.history.forEach(function (h) {
      var no = h.moveNo || 1;
      byNumber[no] = byNumber[no] || {};
      byNumber[no][h.side === E.RED ? 'red' : 'black'] = h;
    });
    Object.keys(byNumber).sort(function (a, b) { return +a - +b; }).forEach(function (no) {
      var row = document.createElement('div');
      row.className = 'move-row';
      var num = document.createElement('span');
      num.className = 'no';
      num.textContent = no + '.';
      row.appendChild(num);
      row.appendChild(markRow(byNumber[no].red, E.RED));
      row.appendChild(markRow(byNumber[no].black, E.BLACK));
      list.appendChild(row);
    });
    list.scrollTop = list.scrollHeight;
  }

  function renderCaptures() {
    ['red', 'black'].forEach(function (key) {
      var tray = $(key + 'Captures');
      while (tray.firstChild) tray.removeChild(tray.firstChild);
      state.captures[key].forEach(function (piece) {
        var t = document.createElement('span');
        t.className = 'cap-token ' + (E.sideOfPiece(piece) === E.RED ? 'r' : 'b');
        t.textContent = E.CHAR[piece];
        tray.appendChild(t);
      });
    });
  }

  function renderControls() {
    var undo = $('undoBtn');
    undo.disabled = isOnline() || !stack.length || busy;
    var modeSeg = $('modeSeg');
    if (modeSeg) {
      Array.prototype.forEach.call(modeSeg.querySelectorAll('button'), function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-mode') === mode ? 'true' : 'false');
        b.disabled = isOnline();
      });
    }
    Array.prototype.forEach.call($('levelSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', +b.getAttribute('data-level') === level ? 'true' : 'false');
      b.disabled = isOnline();
    });
    $('levelNote').textContent = D.difficulty[level - 1].note;
    $('levelWrap').hidden = isOnline() || mode !== 'ai';
    $('modeNote').textContent = mode === 'ai'
      ? '人机对战：你执红先行，AI 执黑。'
      : '同屏双人：红黑双方轮流在同一设备上走棋。';
    $('setupPanel').hidden = isOnline();
    $('roomChip').hidden = !isOnline();
    $('onlineLink').hidden = isOnline();
    $('newBtn').textContent = isOnline() ? '返回房间' : '新开一局';
    if (isOnline() && online.view) {
      $('roomCode').textContent = online.view.code || online.roomId.slice(0, 6);
      var you = online.view.you != null ? online.view.you + 1 : '—';
      $('roomSeat').textContent = ' · 座位 ' + you + ' / 2';
    }
  }

  function resultTitleText() {
    if (state.winner === E.RED) return '红方胜';
    if (state.winner === E.BLACK) return '黑方胜';
    return '和棋';
  }
  function resultSubText() {
    var why = { checkmate: '将死', stalemate: '困毙', draw60: '连续 60 回合无吃子', repetition: '同一局面出现三次', resign: '对手认输' };
    if (state.reason && why[state.reason]) return why[state.reason] + '，对局结束。';
    if (state.over) return '对局结束。';
    return '第 ' + state.moveNo + ' 回合';
  }

  function finish() {
    if (resultOpen) return;
    resultOpen = true;
    $('resultTitle').textContent = resultTitleText();
    $('resultText').textContent = resultSubText();
    $('result').hidden = false;
    var won = false, tied = state.winner === 0;
    if (isOnline()) {
      var v = online.view || {};
      var isHost = (v.seats || []).some(function (s) { return s.isYou && s.isHost; });
      won = !!(v.you != null && v.result && v.result.winnerSeat === v.you);
      $('againBtn').textContent = isHost ? '房主重开' : '等待房主重开';
      $('againBtn').disabled = !isHost;
    } else {
      won = mode === 'local' ? true : state.winner !== E.BLACK;
      $('againBtn').textContent = '再来一局';
      $('againBtn').disabled = false;
    }
    sfx(tied ? 'notify' : (won ? 'win' : 'lose'));
  }

  function hideResult() { resultOpen = false; $('result').hidden = true; }

  /* ---------------------------------------------------------------- */
  /* Local play                                                        */
  /* ---------------------------------------------------------------- */
  function pushHistory() {
    stack.push({ state: E.cloneState(state), lastMove: lastMove });
    if (stack.length > 160) stack.shift();
  }

  function makeLocal(code, fromAI) {
    if (!code || state.over) return;
    pushHistory();
    var from = E.moveFrom(code), to = E.moveTo(code);
    var before = state.board[to];
    state = E.applyMove(state, code);
    lastMove = { from: from, to: to, notation: state.history[state.history.length - 1].notation };
    lastAnim = { from: from, to: to };
    selected = -1;
    hideResult();
    sfx(before ? 'capture' : (fromAI ? 'move' : 'click'));
    render();
    lastAnim = null;
    if (state.over) finish();
    else if (!fromAI && mode === 'ai' && state.turn === E.BLACK) scheduleAi();
  }

  function scheduleAi() {
    if (isOnline() || state.over || mode !== 'ai') return;
    var token = ++aiToken;
    busy = true;
    render();
    setTimeout(function () {
      if (token !== aiToken) return;
      if (state.over) { busy = false; render(); return; }
      var budget = level >= 3 ? 700 : level === 2 ? 300 : 120;
      var m = E.aiMove(state, level, budget);
      busy = false;
      if (m != null && token === aiToken) makeLocal(m, true);
      else render();
    }, 150);
  }

  function undo() {
    if (isOnline() || !stack.length) return;
    aiToken++;
    busy = false;
    var snap = stack.pop();
    state = snap.state;
    lastMove = snap.lastMove || null;
    if (mode === 'ai' && state.turn === E.BLACK && stack.length) {
      snap = stack.pop();
      state = snap.state;
      lastMove = snap.lastMove || null;
    }
    selected = -1;
    hideResult();
    sfx('click');
    render();
  }

  function newGame() {
    aiToken++;
    busy = false;
    state = E.createGame();
    stack = [];
    selected = -1;
    lastMove = null;
    hideResult();
    sfx('deal');
    render();
    if (mode === 'ai') toast('新开一局 · 你执红先行');
  }

  function selectPiece(sq) {
    selected = sq;
    var moves = currentMoves().filter(function (code) { return E.moveFrom(code) === sq; });
    sfx('click');
    render();
    if (!moves.length) $('hint').textContent = '这枚棋子当前没有合法着法。';
  }

  function onPoint(sq) {
    if (!canInteract()) return;
    var p = state.board[sq];
    var turnHasPiece = p && E.sideOfPiece(p) === state.turn;
    if (selected >= 0) {
      var move = currentMoves().filter(function (code) { return E.moveFrom(code) === selected && E.moveTo(code) === sq; })[0];
      if (move != null) {
        if (isOnline()) onlineMove(move);
        else makeLocal(move, false);
        return;
      }
      if (turnHasPiece && sq !== selected) { selectPiece(sq); return; }
      selected = -1;
      render();
      return;
    }
    if (turnHasPiece) selectPiece(sq);
    else if (p) $('hint').textContent = '还没轮到这一方。';
  }

  /* ---------------------------------------------------------------- */
  /* Online                                                            */
  /* ---------------------------------------------------------------- */
  function onlineApi(method, route, body) {
    return fetch(route, {
      method: method,
      headers: { 'content-type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = JSON.parse(text); } catch (err) { data = null; }
        return { status: res.status, body: data };
      });
    });
  }
  function roomBase() {
    return '/api/rooms/' + encodeURIComponent(online.roomId);
  }
  function roomPath() {
    var q = '?session=' + encodeURIComponent(online.session) + '&playerId=' + encodeURIComponent(online.playerId);
    return roomBase() + q;
  }
  function applyOnlineView(view) {
    online.view = view;
    if (view && view.state) {
      state = view.state;
      var h = view.state.history;
      lastMove = h && h.length ? h[h.length - 1] : null;
      if (view.you != null && view.state.turnSeat === view.you) selected = -1;
      render();
      if (view.over) finish();
      else if (resultOpen) hideResult();
    } else {
      state = E.createGame();
      render();
      $('hint').textContent = '房间已创建，等待房主开始对局。';
    }
  }
  function refreshOnline() {
    if (!online || document.hidden) return;
    onlineApi('GET', roomPath()).then(function (res) {
      if (res.status !== 200) {
        if (res.status === 401 || res.status === 403 || res.status === 404) {
          toast('联机房间已失效，返回大厅重新加入。');
          if (pollTimer) clearInterval(pollTimer);
        }
        return;
      }
      applyOnlineView(res.body);
    }).catch(function () { /* transient network error; next poll retries */ });
  }
  function onlineMove(code) {
    var view = online.view;
    if (!view || view.you == null || !view.state || view.state.turnSeat !== view.you) return;
    busy = true;
    render();
    onlineApi('POST', roomBase() + '/actions', {
      session: online.session, playerId: online.playerId,
      action: { type: 'move', code: code }
    }).then(function (res) {
      busy = false;
      if (res.status !== 200) {
        toast((res.body && res.body.error && res.body.error.message) || '走子被拒绝。');
        refreshOnline();
        render();
        return;
      }
      sfx(res.body && res.body.state && res.body.state.history.length ? 'move' : 'click');
      applyOnlineView(res.body);
    }).catch(function () {
      busy = false;
      render();
      toast('网络中断，正在重连…');
    });
  }
  function onlineAgain() {
    if (!online || !online.view) return;
    var isHost = (online.view.seats || []).some(function (s) { return s.isYou && s.isHost; });
    if (!isHost) return;
    onlineApi('POST', roomBase() + '/restart', {
      session: online.session, playerId: online.playerId
    }).then(function (res) {
      if (res.status === 200) { hideResult(); applyOnlineView(res.body); }
      else toast('重开失败。');
    });
  }

  /* ---------------------------------------------------------------- */
  /* Wiring                                                            */
  /* ---------------------------------------------------------------- */
  function bind() {
    svg.addEventListener('click', function (ev) {
      var node = ev.target.closest ? ev.target.closest('[data-sq]') : null;
      if (!node) return;
      onPoint(+node.getAttribute('data-sq'));
    });
    svg.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { selected = -1; render(); }
    });
    $('newBtn').addEventListener('click', function () {
      if (isOnline()) { location.href = 'online.html'; return; }
      newGame();
    });
    $('undoBtn').addEventListener('click', undo);
    $('againBtn').addEventListener('click', function () {
      if (isOnline()) { onlineAgain(); return; }
      hideResult();
      newGame();
    });
    $('reviewBtn').addEventListener('click', hideResult);
    $('soundBtn').addEventListener('click', function () {
      var muted = window.Sfx ? !window.Sfx.isMuted() : false;
      if (window.Sfx) window.Sfx.mute(muted);
      this.setAttribute('aria-pressed', muted ? 'true' : 'false');
      this.textContent = muted ? '音效 关' : '音效 开';
      if (!muted) sfx('click');
    });
    Array.prototype.forEach.call($('modeSeg').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        if (isOnline()) return;
        mode = b.getAttribute('data-mode');
        newGame();
      });
    });
    Array.prototype.forEach.call($('levelSeg').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        level = +b.getAttribute('data-level') || 2;
        sfx('click');
        render();
      });
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) refreshOnline();
    });
    window.addEventListener('beforeunload', function () { if (pollTimer) clearInterval(pollTimer); });
  }

  function boot() {
    buildStaticBoard();
    bind();
    if (window.Sfx && window.Sfx.isMuted && window.Sfx.isMuted()) {
      $('soundBtn').textContent = '音效 关';
      $('soundBtn').setAttribute('aria-pressed', 'true');
    }
    var params = new URLSearchParams(location.search);
    var room = params.get('online');
    if (room) {
      online = {
        roomId: room,
        session: params.get('session') || '',
        playerId: params.get('player') || params.get('playerId') || ''
      };
      document.body.setAttribute('data-view', 'online');
      state = E.createGame();
      render();
      refreshOnline();
      pollTimer = setInterval(refreshOnline, 900);
    } else {
      state = E.createGame();
      render();
    }
  }

  window.__xiangqi = {
    getState: function () { return JSON.parse(JSON.stringify(state)); },
    isBusy: function () { return busy; },
    isOnline: isOnline,
    playMove: function (from, to) {
      var code = E.encode(from, to);
      var legal = currentMoves().indexOf(code) >= 0;
      if (!legal) return false;
      if (isOnline()) { onlineMove(code); return true; }
      makeLocal(code, false);
      return true;
    },
    chooseMove: function (lv) { return E.aiMove(state, lv || level, 200); },
    loadPosition: function (board, turn) {
      state = E.createGame();
      state.board = board.slice();
      state.turn = turn === E.BLACK ? E.BLACK : E.RED;
      state.check = E.inCheck(state.board, state.turn);
      state.history = [];
      stack = [];
      selected = -1;
      lastMove = null;
      hideResult();
      render();
    },
    newGame: newGame,
    setMode: function (m) { mode = m; newGame(); },
    board: svg
  };

  boot();
})();
</script>
</body>
</html>
