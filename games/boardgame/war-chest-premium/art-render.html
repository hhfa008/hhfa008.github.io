<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="战争宝箱 美术合成页：本地生成的素材在浏览器中的渲染预览。">
<link rel="icon" href="../../assets/icons/solitaire.svg">
<title>战争宝箱 · 局面合成</title>
<style>
#stage,.stage{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#20252c;overflow:hidden}
body{font-family:-apple-system,"PingFang SC",sans-serif;color:#1e2228}
#stage{position:relative;overflow:hidden;background:
  radial-gradient(900px 600px at 14% 8%,rgba(182,138,69,.22),transparent 60%),
  radial-gradient(700px 500px at 92% 100%,rgba(63,142,168,.20),transparent 60%),
  linear-gradient(155deg,#d9d0bd,#b9ae99 55%,#9d9280)}
#stage::before{content:"";position:absolute;inset:0;background:url('../../assets/art/premium/war-chest/playmat.webp') center/760px;opacity:.22;mix-blend-mode:multiply}
.frame{position:absolute;inset:24px;border:1px solid rgba(45,50,58,.35);border-radius:22px;box-shadow:inset 0 0 0 7px rgba(251,248,240,.18)}
.titleblock{position:absolute;z-index:6;color:#f7efdf}
.kicker{font-size:16px;letter-spacing:.3em;color:#e4c78d;font-weight:700}
.titleblock h1{font-family:"Songti SC","STSong",serif;font-weight:700;margin:9px 0 6px;font-size:76px;line-height:1.02;color:#fbf4e6;text-shadow:0 6px 26px rgba(18,22,28,.42)}
.titleblock p{margin:0;font-size:18px;line-height:1.6;color:#eadfc8;max-width:420px}
.seal{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid rgba(228,199,141,.55);border-radius:999px;font-size:14px;color:#f1e2bf;letter-spacing:.07em;background:rgba(28,33,40,.38)}
.boardcard{position:absolute;z-index:4;padding:16px;border-radius:18px;background:linear-gradient(150deg,rgba(52,59,68,.99),rgba(30,35,42,.99));box-shadow:0 34px 80px rgba(16,20,26,.46),inset 0 0 0 1px rgba(228,199,141,.20)}
.board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:4px;width:100%;height:100%}
.cell{position:relative;border-radius:5px;background:rgba(244,238,222,.08);border:1px solid rgba(255,255,255,.07);display:grid;place-items:center}
.cell.stronghold{background:rgba(182,138,69,.16);box-shadow:inset 0 0 0 1px rgba(228,199,141,.34)}
.cell.owned-0{box-shadow:inset 0 0 0 2px rgba(63,142,168,.88);background:rgba(63,142,168,.15)}
.cell.owned-1{box-shadow:inset 0 0 0 2px rgba(180,81,63,.88);background:rgba(180,81,63,.15)}
.tower{width:72%;height:72%;background:url('../../assets/art/premium/war-chest/stronghold.webp') center/contain no-repeat;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.unit{width:82%;height:82%;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;color:#f8f1df;box-shadow:0 2px 4px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.22);z-index:2}
.unit.p0{background:radial-gradient(circle at 34% 30%,#7bc0d2,#3f8ea8 55%,#225d73)}
.unit.p1{background:radial-gradient(circle at 34% 30%,#df9a83,#b4513f 55%,#7a3024)}
.sidecard{position:absolute;z-index:5;padding:15px;border-radius:16px;background:linear-gradient(180deg,rgba(251,248,240,.98),rgba(240,233,220,.98));box-shadow:0 24px 60px rgba(18,22,28,.34);border:1px solid rgba(45,50,58,.22)}
.sidecard h2{font-family:"Songti SC","STSong",serif;font-size:24px;margin:0 0 10px;color:#2b3038}
.coins{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.coin{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#e5cc96,#bd924f 52%,#8a6429);border:1px solid #7a5a25;box-shadow:0 8px 16px rgba(40,28,12,.28),inset 0 0 0 3px rgba(255,255,255,.18);display:grid;place-items:center;font-weight:900;font-size:24px;color:#2a1c0b}
.coin.bronze{background:radial-gradient(circle at 34% 28%,#e0aa92,#b46b4f 52%,#7d3f2a)}
.bag-obj{position:absolute;z-index:7;width:230px;height:230px;background:url('../../assets/art/premium/war-chest/canvas-bag.webp') center/contain no-repeat;filter:drop-shadow(0 18px 24px rgba(18,18,16,.34))}
.silver-obj{position:absolute;z-index:7;width:120px;height:120px;background:url('../../assets/art/premium/war-chest/silver-coin.webp') center/contain no-repeat;filter:drop-shadow(0 12px 16px rgba(18,18,16,.3))}
.bronze-obj{position:absolute;z-index:7;width:110px;height:110px;background:url('../../assets/art/premium/war-chest/bronze-coin.webp') center/contain no-repeat;filter:drop-shadow(0 12px 16px rgba(18,18,16,.3))}
.command-obj{position:absolute;z-index:7;width:100px;height:100px;background:url('../../assets/art/premium/war-chest/command-token.webp') center/contain no-repeat;filter:drop-shadow(0 12px 16px rgba(18,18,16,.3))}
#stage[data-shot="cover"]{width:1200px;height:1200px}
#stage[data-shot="cover"] .titleblock{left:76px;top:82px;width:480px}
#stage[data-shot="cover"] .boardcard{right:64px;bottom:92px;width:650px;height:650px;transform:rotate(-1.8deg)}
#stage[data-shot="cover"] .sidecard{left:76px;bottom:110px;width:450px}
#stage[data-shot="cover"] .bag-obj{right:640px;top:78px;width:190px;height:190px}
#stage[data-shot="cover"] .silver-obj{right:70px;top:150px}
#stage[data-shot="cover"] .bronze-obj{left:466px;bottom:96px}
#stage[data-shot="cover"] .command-obj{left:120px;bottom:470px}
#stage[data-shot="og"]{width:1200px;height:630px}
#stage[data-shot="og"] .titleblock{left:62px;top:58px;width:410px}
#stage[data-shot="og"] .titleblock h1{font-size:58px}
#stage[data-shot="og"] .boardcard{right:48px;top:54px;width:540px;height:520px;transform:rotate(-1.4deg)}
#stage[data-shot="og"] .sidecard{left:62px;bottom:50px;width:370px}
#stage[data-shot="og"] .bag-obj{left:410px;top:56px;width:150px;height:150px}
#stage[data-shot="og"] .silver-obj{right:590px;top:80px;width:92px;height:92px}
#stage[data-shot="og"] .bronze-obj{display:none}
#stage[data-shot="og"] .command-obj{left:60px;top:48px;width:84px;height:84px}
#stage[data-shot="detail1"],#stage[data-shot="detail2"]{width:1200px;height:800px}
#stage[data-shot="detail1"] .titleblock,#stage[data-shot="detail2"] .titleblock{left:62px;top:54px;width:370px}
#stage[data-shot="detail1"] .titleblock h1,#stage[data-shot="detail2"] .titleblock h1{font-size:56px}
#stage[data-shot="detail1"] .boardcard{right:52px;top:70px;width:610px;height:610px;transform:rotate(1.5deg)}
#stage[data-shot="detail2"] .boardcard{right:66px;top:44px;width:620px;height:620px;transform:rotate(-2.2deg)}
#stage[data-shot="detail1"] .sidecard{left:62px;bottom:58px;width:340px}
#stage[data-shot="detail2"] .sidecard{left:62px;bottom:48px;width:340px}
#stage[data-shot="detail1"] .bag-obj{left:448px;bottom:70px;width:170px;height:170px}
#stage[data-shot="detail2"] .bag-obj{left:430px;top:60px;width:170px;height:170px}
#stage[data-shot="detail1"] .silver-obj{left:452px;top:54px;width:96px;height:96px}
#stage[data-shot="detail2"] .silver-obj{left:452px;bottom:46px;width:96px;height:96px}
#stage[data-shot="detail1"] .bronze-obj{left:66px;top:220px;width:90px;height:90px}
#stage[data-shot="detail2"] .bronze-obj{left:66px;top:220px;width:90px;height:90px}
#stage[data-shot="detail1"] .command-obj,#stage[data-shot="detail2"] .command-obj{display:none}
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/war-chest-premium/art-render.html">
<style>
/* site-quality: fixed-size art composition must not create page overflow */
html{overflow-x:hidden}
body{width:100%!important;max-width:100vw!important;overflow-x:hidden}
.stage,#stage{max-width:100vw;overflow:hidden}
</style>
</head>
<body>
<div aria-hidden="true" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0">
  <img src="../../assets/art/premium/war-chest/silver-coin.webp" alt="">
  <img src="../../assets/art/premium/war-chest/bronze-coin.webp" alt="">
  <img src="../../assets/art/premium/war-chest/canvas-bag.webp" alt="">
  <img src="../../assets/art/premium/war-chest/stronghold.webp" alt="">
  <img src="../../assets/art/premium/war-chest/playmat.webp" alt="">
  <img src="../../assets/art/premium/war-chest/command-token.webp" alt="">
</div>
<div id="stage" data-shot="cover">
  <div class="frame"></div>
  <div class="titleblock"><div class="kicker">WAR CHEST · 2 PLAYERS</div><h1>战争<br>宝箱</h1><p>抽币、部署、行军、夺点。<br>先控制 4 个据点者获胜。</p><div class="seal">7×7 战场 · 6 据点 · 4 种单位币</div></div>
  <div class="boardcard"><div class="board" id="board"></div></div>
  <div class="sidecard"><h2>单位币</h2><div class="coins"><div class="coin">剑</div><div class="coin">弓</div><div class="coin bronze">骑</div><div class="coin bronze">斥</div></div><p style="font-size:13px;color:#6c7480;margin:12px 0 0">每回合抽 3 枚 · 每枚 1 个行动</p></div>
  <div class="bag-obj"></div><div class="silver-obj"></div><div class="bronze-obj"></div><div class="command-obj"></div>
</div>
<script>
(function () {
  'use strict';
  var SH = [[1,1,1],[1,3,null],[1,5,1],[5,1,0],[5,3,null],[5,5,0]];
  var UNITS = [[2,2,0,'剑'],[2,3,1,'弓'],[3,2,0,'弓'],[3,6,1,'骑'],[4,2,0,'骑'],[4,5,1,'剑'],[5,4,0,'斥'],[6,5,1,'斥'],[3,4,0,'剑'],[2,5,1,'剑'],[5,2,0,'弓'],[5,6,1,'弓']];
  var shot = new URLSearchParams(location.search).get('shot') || 'cover';
  document.getElementById('stage').setAttribute('data-shot', shot);
  var html = '';
  for (var r = 0; r < 7; r++) for (var c = 0; c < 7; c++) {
    var sh = SH.filter(function (x) { return x[0] === r && x[1] === c; })[0];
    var u = UNITS.filter(function (x) { return x[0] === r && x[1] === c; })[0];
    var cls = 'cell' + (sh ? ' stronghold' : '') + (sh && sh[2] != null ? ' owned-' + sh[2] : '');
    html += '<div class="' + cls + '">' + (sh ? '<span class="tower"></span>' : '') + (u ? '<span class="unit p' + u[2] + '">' + u[3] + '</span>' : '') + '</div>';
  }
  document.getElementById('board').innerHTML = html;
  var imgs = Array.from(document.images), pending = imgs.filter(function (i) { return !i.complete; });
  Promise.all(pending.map(function (i) { return new Promise(function (r) { i.onload = i.onerror = r; }); })).then(function () {
    requestAnimationFrame(function () { document.body.setAttribute('data-ready', 'true'); });
  });
  if (!pending.length) requestAnimationFrame(function () { document.body.setAttribute('data-ready', 'true'); });
})();
</script>
</body>
</html>
