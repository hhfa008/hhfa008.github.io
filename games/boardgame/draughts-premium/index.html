<script>
(function () {
  'use strict';
  var E = window.DraughtsEngine;
  var D = window.DraughtsData;
  var NS = 'http://www.w3.org/2000/svg';
  var SIZE = 10, M = 44, CELL = 55.2;
  var $ = function (id) { return document.getElementById(id); };
  var svg = $('board');

  var state = E.createGame();
  var stack = [];
  var selected = -1;
  var lastMove = null;
  var lastAnim = null;
  var busy = false;
  var aiToken = 0;
  var mode = 'ai';
  var level = 2;
  var resultOpen = false;
  var online = null;
  var pollTimer = null;
  var layers = {};

  function sfx(name, opts) { try { if (window.Sfx && window.Sfx.play) window.Sfx.play(name, opts); } catch (err) {} }
  function toast(msg) {
    return Dom.toast(msg);
  }
  function el(name, attrs, text) {
    return Dom.el(name, attrs, { ns: NS, text: text });
  }
  function px(sq) { return M + E.col(sq) * CELL; }
  function py(sq) { return M + E.row(sq) * CELL; }
  function isOnline() { return !!online; }
  function pieceName(p) { return E.sideOf(p) === E.WHITE ? '白' : '黑'; }
  function currentMoves() {
    if (isOnline()) {
      return online.view && Array.isArray(online.view.legalActions) ? online.view.legalActions : [];
    }
    return E.legalMoves(state);
  }
  function canInteract() {
    if (busy || !state || state.over) return false;
    if (isOnline()) {
      var v = online.view;
      return !!(v && v.you != null && v.state && v.state.turnSeat === v.you);
    }
    return true;
  }
  function hasCaptureAvailable() {
    return currentMoves().some(function (m) { return m.captures && m.captures.length; });
  }

  /* ---------------------------------------------------------------- */
  /* Static board                                                      */
  /* ---------------------------------------------------------------- */
  function buildStaticBoard() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var defs = el('defs');
    function pattern(id, href, w, h) {
      var p = el('pattern', { id: id, patternUnits: 'userSpaceOnUse', width: String(w), height: String(h) });
      p.appendChild(el('image', { href: href, width: String(w), height: String(h), preserveAspectRatio: 'xMidYMid slice' }));
      defs.appendChild(p);
    }
    pattern('woodDark', D.art.boardDark, '552', '552');
    pattern('woodLight', D.art.boardLight, '552', '552');
    pattern('manDark', D.art.manDark, '42', '42');
    pattern('manLight', D.art.manLight, '42', '42');
    var shadow = el('filter', { id: 'pieceShadow', x: '-40%', y: '-40%', width: '180%', height: '180%' });
    shadow.appendChild(el('feDropShadow', { dx: '1.2', dy: '2.4', stdDeviation: '1.9', 'flood-color': '#120a04', 'flood-opacity': '.55' }));
    defs.appendChild(shadow);
    svg.appendChild(defs);

    svg.appendChild(el('rect', { x: '16', y: '16', width: '608', height: '608', rx: '14', fill: 'url(#woodDark)', stroke: '#22150d', 'stroke-width': '2.5' }));
    svg.appendChild(el('rect', { x: '28', y: '28', width: '584', height: '584', rx: '5', fill: 'none', stroke: 'rgba(216,178,106,.24)', 'stroke-width': '1.2' }));

    var squares = el('g');
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var dark = E.isDark(r, c);
        var x = M + c * CELL, y = M + r * CELL;
        squares.appendChild(el('rect', {
          x: x.toFixed(2), y: y.toFixed(2), width: CELL.toFixed(2), height: CELL.toFixed(2),
          fill: dark ? 'url(#woodDark)' : 'url(#woodLight)',
          'data-square': r + ',' + c
        }));
        squares.appendChild(el('rect', {
          x: x.toFixed(2), y: y.toFixed(2), width: CELL.toFixed(2), height: CELL.toFixed(2),
          fill: dark ? 'rgba(18,10,5,.16)' : 'rgba(255,248,228,.1)'
        }));
      }
    }
    svg.appendChild(squares);
    var frame = el('g', { fill: 'none', stroke: 'rgba(20,12,6,.55)', 'stroke-width': '1' });
    for (var i = 0; i <= SIZE; i++) {
      frame.appendChild(el('line', { x1: String(M + i * CELL), y1: String(M), x2: String(M + i * CELL), y2: String(M + SIZE * CELL) }));
      frame.appendChild(el('line', { x1: String(M), y1: String(M + i * CELL), x2: String(M + SIZE * CELL), y2: String(M + i * CELL) }));
    }
    svg.appendChild(frame);

    var coords = el('g', { fill: 'rgba(226,199,155,.55)', 'font-family': '"Songti SC","STSong",serif', 'font-size': '15', 'text-anchor': 'middle' });
    var files = 'abcdefghij';
    for (var f = 0; f < 10; f++) {
      coords.appendChild(el('text', { x: (M + f * CELL + CELL / 2).toFixed(1), y: '630' }, files[f]));
    }
    for (var rr = 0; rr < 10; rr++) {
      coords.appendChild(el('text', { x: '632', y: (M + rr * CELL + CELL / 2 + 5).toFixed(1) }, String(10 - rr)));
    }
    svg.appendChild(coords);

    layers.last = el('g');
    layers.piece = el('g');
    layers.dest = el('g');
    layers.hit = el('g');
    svg.appendChild(layers.last);
    svg.appendChild(layers.piece);
    svg.appendChild(layers.dest);
    svg.appendChild(layers.hit);
    buildHits();
  }

  function buildHits() {
    while (layers.hit.firstChild) layers.hit.removeChild(layers.hit.firstChild);
    for (var sq = 0; sq < 100; sq++) {
      if (!E.isDark(E.row(sq), E.col(sq))) continue;
      layers.hit.appendChild(el('circle', { cx: String(px(sq)), cy: String(py(sq)), r: '27', fill: 'transparent', class: 'hit', 'data-sq': String(sq) }));
    }
  }

  /* ---------------------------------------------------------------- */
  /* Dynamic board                                                     */
  /* ---------------------------------------------------------------- */
  function render() {
    renderLast();
    renderPieces();
    renderDests();
    renderStatus();
    renderMoves();
    renderCaptures();
    renderControls();
  }

  function renderLast() {
    while (layers.last.firstChild) layers.last.removeChild(layers.last.firstChild);
    if (!lastMove) return;
    [lastMove.from, lastMove.to].forEach(function (sq) {
      layers.last.appendChild(el('circle', {
        cx: String(px(sq)), cy: String(py(sq)), r: '24', fill: 'none',
        stroke: 'rgba(255,226,158,.55)', 'stroke-width': '2',
        'stroke-dasharray': sq === lastMove.to ? 'none' : '4 5'
      }));
    });
  }

  function renderPieces() {
    while (layers.piece.firstChild) layers.piece.removeChild(layers.piece.firstChild);
    for (var sq = 0; sq < 100; sq++) {
      var p = state.board[sq];
      if (!p) continue;
      var side = E.sideOf(p), king = E.isKing(p);
      var x = px(sq), y = py(sq);
      var g = el('g', { class: 'piece ' + (side === E.WHITE ? 'light' : 'dark'), 'data-piece': String(sq) });
      g.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      if (lastAnim && lastAnim.to === sq) {
        g.style.transition = 'none';
        g.style.transform = 'translate(' + px(lastAnim.from) + 'px,' + py(lastAnim.from) + 'px)';
        requestAnimationFrame(function () {
          g.style.transition = '';
          g.style.transform = 'translate(' + x + 'px,' + y + 'px)';
        });
      }
      g.appendChild(el('ellipse', { cx: '0', cy: '4', rx: '15.5', ry: '4.2', fill: 'rgba(14,8,3,.42)' }));
      g.appendChild(el('circle', {
        cx: '0', cy: '0', r: '17.8',
        fill: side === E.WHITE ? 'url(#manLight)' : 'url(#manDark)',
        stroke: side === E.WHITE ? 'rgba(120,82,42,.75)' : 'rgba(20,12,6,.8)',
        'stroke-width': '1.4', filter: 'url(#pieceShadow)'
      }));
      g.appendChild(el('circle', { cx: '0', cy: '0', r: '14.1', fill: 'none', stroke: side === E.WHITE ? 'rgba(120,82,42,.45)' : 'rgba(226,199,155,.28)', 'stroke-width': '1.1' }));
      g.appendChild(el('circle', { cx: '0', cy: '0', r: '10.2', fill: 'none', stroke: side === E.WHITE ? 'rgba(120,82,42,.32)' : 'rgba(226,199,155,.2)', 'stroke-width': '1' }));
      if (king) {
        g.appendChild(el('circle', { cx: '0', cy: '0', r: '15.7', fill: 'none', stroke: '#e8c47c', 'stroke-width': '1.5', opacity: '.9' }));
        g.appendChild(el('path', { d: 'M -7 3.5 L -7 -1.7 L -3 1.4 L 0 -4.8 L 3 1.4 L 7 -1.7 L 7 3.5 Z', fill: 'rgba(232,196,124,.92)', stroke: 'rgba(90,58,22,.5)', 'stroke-width': '.7' }));
      }
      if (selected === sq) g.appendChild(el('circle', { cx: '0', cy: '0', r: '23', fill: 'none', stroke: '#ffe3a3', 'stroke-width': '2.4' }));
      layers.piece.appendChild(g);
    }
  }

  function renderDests() {
    while (layers.dest.firstChild) layers.dest.removeChild(layers.dest.firstChild);
    if (selected < 0) return;
    currentMoves().filter(function (m) { return m.from === selected; }).forEach(function (m) {
      var capture = m.captures && m.captures.length;
      layers.dest.appendChild(el('circle', {
        cx: String(px(m.to)), cy: String(py(m.to)),
        r: capture ? '21' : '7.5',
        fill: capture ? 'none' : 'rgba(255,226,158,.92)',
        stroke: capture ? 'rgba(232,92,64,.92)' : 'none',
        'stroke-width': capture ? '2.6' : '0',
        'stroke-dasharray': capture ? '5 4' : 'none'
      }));
      if (m.jumps && m.jumps.length > 1) {
        // multi-landing path is shown by the destination ring only
      }
    });
  }

  function piecesOf(side) {
    var n = 0;
    for (var i = 0; i < 100; i++) if (E.sideOf(state.board[i]) === side) n++;
    return n;
  }
  function kingsOf(side) {
    var n = 0;
    for (var i = 0; i < 100; i++) if (E.sideOf(state.board[i]) === side && E.isKing(state.board[i])) n++;
    return n;
  }

  function renderStatus() {
    var chip = $('turnChip');
    var text = $('turnText');
    var big = $('statusBig');
    var sub = $('statusSub');
    chip.classList.toggle('dark', state.turn === E.BLACK);
    chip.classList.toggle('capture', !state.over && hasCaptureAvailable());
    if (state.over) {
      text.textContent = '对局结束';
      big.textContent = resultTitleText();
      sub.textContent = resultSubText();
    } else if (busy) {
      text.textContent = 'AI 思考中…';
      big.textContent = 'AI 思考中…';
      sub.textContent = '第 ' + state.moveNo + ' 回合 · 正在计算最大吃子';
    } else {
      var name = state.turn === E.WHITE ? '白方' : '黑方';
      text.textContent = '轮到' + name;
      big.textContent = name + '行棋' + (hasCaptureAvailable() ? ' · 必须吃子' : '');
      sub.textContent = '第 ' + state.moveNo + ' 回合 · 白 ' + piecesOf(E.WHITE) + ' 子 · 黑 ' + piecesOf(E.BLACK) + ' 子';
    }
    var hint = $('hint');
    if (state.over) hint.textContent = resultSubText();
    else if (busy) hint.textContent = 'AI 正在搜索，请稍候。';
    else if (selected >= 0) hint.textContent = '已选中 ' + pieceName(state.board[selected]) + '方棋子，点高亮落点。';
    else if (hasCaptureAvailable()) hint.textContent = '现在有吃子，必须选择吃掉最多棋子的路线。';
    else hint.textContent = '白方先行。点选棋子，再点高亮落点；有吃子时必须吃。';
  }

  function markRow(entry, side) {
    var span = document.createElement('span');
    span.className = 'mv ' + (side === E.WHITE ? 'light' : 'dark');
    if (lastMove && entry && entry.to === lastMove.to && entry.from === lastMove.from) span.classList.add('last');
    span.textContent = entry ? entry.notation : '';
    return span;
  }

  function renderMoves() {
    var list = $('movesList');
    while (list.firstChild) list.removeChild(list.firstChild);
    if (!state.history.length) {
      var p = document.createElement('p');
      p.className = 'empty-note';
      p.textContent = '还没有着法。白方先行。';
      list.appendChild(p);
      return;
    }
    var byNumber = {};
    state.history.forEach(function (h) {
      var no = h.moveNo || 1;
      byNumber[no] = byNumber[no] || {};
      byNumber[no][h.side === E.WHITE ? 'light' : 'dark'] = h;
    });
    Object.keys(byNumber).sort(function (a, b) { return +a - +b; }).forEach(function (no) {
      var row = document.createElement('div');
      row.className = 'move-row';
      var num = document.createElement('span');
      num.className = 'no';
      num.textContent = no + '.';
      row.appendChild(num);
      row.appendChild(markRow(byNumber[no].light, E.WHITE));
      row.appendChild(markRow(byNumber[no].dark, E.BLACK));
      list.appendChild(row);
    });
    list.scrollTop = list.scrollHeight;
  }

  function renderCaptures() {
    [['white', 'whiteCaptures'], ['black', 'blackCaptures']].forEach(function (pair) {
      var tray = $(pair[1]);
      while (tray.firstChild) tray.removeChild(tray.firstChild);
      state.captures[pair[0]].forEach(function (piece) {
        var t = document.createElement('span');
        t.className = 'cap-token ' + (E.sideOf(piece) === E.WHITE ? 'light' : 'dark') + (E.isKing(piece) ? ' king' : '');
        tray.appendChild(t);
      });
    });
  }

  function renderControls() {
    var undo = $('undoBtn');
    undo.disabled = isOnline() || !stack.length || busy;
    Array.prototype.forEach.call($('modeSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-mode') === mode ? 'true' : 'false');
      b.disabled = isOnline();
    });
    Array.prototype.forEach.call($('levelSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', +b.getAttribute('data-level') === level ? 'true' : 'false');
      b.disabled = isOnline();
    });
    $('levelNote').textContent = D.difficulty[level - 1].note;
    $('levelWrap').hidden = isOnline() || mode !== 'ai';
    $('modeNote').textContent = mode === 'ai' ? '人机对战：你执白先行，AI 执黑。' : '同屏双人：白黑双方轮流在同一设备上走棋。';
    $('setupPanel').hidden = isOnline();
    $('roomChip').hidden = !isOnline();
    $('onlineLink').hidden = isOnline();
    $('newBtn').textContent = isOnline() ? '返回房间' : '新开一局';
    if (isOnline() && online.view) {
      $('roomCode').textContent = online.view.code || online.roomId.slice(0, 6);
      var you = online.view.you != null ? online.view.you + 1 : '—';
      $('roomSeat').textContent = ' · 座位 ' + you + ' / 2';
    }
  }

  function resultTitleText() {
    if (state.winner === E.WHITE) return '白方胜';
    if (state.winner === E.BLACK) return '黑方胜';
    return '和棋';
  }
  function resultSubText() {
    var why = { nomoves: '一方无合法着法', king25: '连续 25 回合只走王且无吃子', repetition: '同一局面出现三次', resign: '对手认输' };
    if (state.reason && why[state.reason]) return why[state.reason] + '，对局结束。';
    if (state.over) return '对局结束。';
    return '第 ' + state.moveNo + ' 回合';
  }

  function finish() {
    if (resultOpen) return;
    resultOpen = true;
    $('resultTitle').textContent = resultTitleText();
    $('resultText').textContent = resultSubText();
    $('result').hidden = false;
    var tied = state.winner === 0;
    var won = false;
    if (isOnline()) {
      var v = online.view || {};
      var isHost = (v.seats || []).some(function (s) { return s.isYou && s.isHost; });
      won = !!(v.you != null && v.result && v.result.winnerSeat === v.you);
      $('againBtn').textContent = isHost ? '房主重开' : '等待房主重开';
      $('againBtn').disabled = !isHost;
    } else {
      won = mode === 'local' ? true : state.winner !== E.BLACK;
      $('againBtn').textContent = '再来一局';
      $('againBtn').disabled = false;
    }
    sfx(tied ? 'notify' : (won ? 'win' : 'lose'));
  }
  function hideResult() { resultOpen = false; $('result').hidden = true; }

  /* ---------------------------------------------------------------- */
  /* Local play                                                        */
  /* ---------------------------------------------------------------- */
  function pushHistory() {
    stack.push({ state: E.clone(state), lastMove: lastMove });
    if (stack.length > 160) stack.shift();
  }

  function makeLocal(move, fromAI) {
    if (!move || state.over) return;
    pushHistory();
    var from = move.from, to = move.to;
    var captured = move.captures ? move.captures.length : 0;
    state = E.applyMove(state, move);
    lastMove = { from: from, to: to, notation: state.history[state.history.length - 1].notation };
    lastAnim = { from: from, to: to };
    selected = -1;
    hideResult();
    sfx(captured ? 'capture' : (fromAI ? 'move' : 'click'));
    render();
    lastAnim = null;
    if (state.over) finish();
    else if (!fromAI && mode === 'ai' && state.turn === E.BLACK) scheduleAi();
  }

  function scheduleAi() {
    if (isOnline() || state.over || mode !== 'ai') return;
    var token = ++aiToken;
    busy = true;
    render();
    setTimeout(function () {
      if (token !== aiToken) return;
      if (state.over) { busy = false; render(); return; }
      var budget = level >= 3 ? 900 : level === 2 ? 350 : 120;
      var m = E.aiMove(state, level, budget);
      busy = false;
      if (m != null && token === aiToken) makeLocal(m, true);
      else render();
    }, 150);
  }

  function undo() {
    if (isOnline() || !stack.length) return;
    aiToken++;
    busy = false;
    var snap = stack.pop();
    state = snap.state;
    lastMove = snap.lastMove || null;
    if (mode === 'ai' && state.turn === E.BLACK && stack.length) {
      snap = stack.pop();
      state = snap.state;
      lastMove = snap.lastMove || null;
    }
    selected = -1;
    hideResult();
    sfx('click');
    render();
  }

  function newGame() {
    aiToken++;
    busy = false;
    state = E.createGame();
    stack = [];
    selected = -1;
    lastMove = null;
    hideResult();
    sfx('deal');
    render();
    if (mode === 'ai') toast('新开一局 · 你执白先行');
  }

  function selectPiece(sq) {
    selected = sq;
    sfx('click');
    render();
    if (!currentMoves().some(function (m) { return m.from === sq; })) {
      $('hint').textContent = '这枚棋子当前没有合法着法。';
    }
  }

  function findMove(from, to) {
    return currentMoves().filter(function (m) { return m.from === from && m.to === to; })[0] || null;
  }

  function onPoint(sq) {
    if (!canInteract()) return;
    var p = state.board[sq];
    var turnHasPiece = p && E.sideOf(p) === state.turn;
    if (selected >= 0) {
      var move = findMove(selected, sq);
      if (move) {
        if (isOnline()) onlineMove(move);
        else makeLocal(move, false);
        return;
      }
      if (turnHasPiece && sq !== selected) { selectPiece(sq); return; }
      selected = -1;
      render();
      return;
    }
    if (turnHasPiece) selectPiece(sq);
    else if (p) $('hint').textContent = '还没轮到这一方。';
  }

  /* ---------------------------------------------------------------- */
  /* Online                                                            */
  /* ---------------------------------------------------------------- */
  function onlineApi(method, route, body) {
    return fetch(route, {
      method: method,
      headers: { 'content-type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = JSON.parse(text); } catch (err) { data = null; }
        return { status: res.status, body: data };
      });
    });
  }
  function roomBase() {
    return '/api/rooms/' + encodeURIComponent(online.roomId);
  }
  function roomPath() {
    return roomBase() +
      '?session=' + encodeURIComponent(online.session) + '&playerId=' + encodeURIComponent(online.playerId);
  }
  function applyOnlineView(view) {
    online.view = view;
    if (view && view.state) {
      state = view.state;
      var h = view.state.history;
      lastMove = h && h.length ? h[h.length - 1] : null;
      if (view.you != null && view.state.turnSeat === view.you) selected = -1;
      render();
      if (view.over) finish();
      else if (resultOpen) hideResult();
    } else {
      state = E.createGame();
      render();
      $('hint').textContent = '房间已创建，等待房主开始对局。';
    }
  }
  function refreshOnline() {
    if (!online || document.hidden) return;
    onlineApi('GET', roomPath()).then(function (res) {
      if (res.status !== 200) {
        if (res.status === 401 || res.status === 403 || res.status === 404) {
          toast('联机房间已失效，返回大厅重新加入。');
          if (pollTimer) clearInterval(pollTimer);
        }
        return;
      }
      applyOnlineView(res.body);
    }).catch(function () {});
  }
  function onlineMove(move) {
    var view = online.view;
    if (!view || view.you == null || !view.state || view.state.turnSeat !== view.you) return;
    busy = true;
    render();
    onlineApi('POST', roomBase() + '/actions', {
      session: online.session, playerId: online.playerId,
      action: { type: 'move', from: move.from, to: move.to, path: move.path, captures: move.captures }
    }).then(function (res) {
      busy = false;
      if (res.status !== 200) {
        toast((res.body && res.body.error && res.body.error.message) || '走子被拒绝。');
        refreshOnline();
        render();
        return;
      }
      sfx('move');
      applyOnlineView(res.body);
    }).catch(function () {
      busy = false;
      render();
      toast('网络中断，正在重连…');
    });
  }
  function onlineAgain() {
    if (!online || !online.view) return;
    var isHost = (online.view.seats || []).some(function (s) { return s.isYou && s.isHost; });
    if (!isHost) return;
    onlineApi('POST', roomBase() + '/restart', {
      session: online.session, playerId: online.playerId
    }).then(function (res) {
      if (res.status === 200) { hideResult(); applyOnlineView(res.body); }
      else toast('重开失败。');
    });
  }

  /* ---------------------------------------------------------------- */
  /* Wiring                                                            */
  /* ---------------------------------------------------------------- */
  function bind() {
    svg.addEventListener('click', function (ev) {
      var node = ev.target.closest ? ev.target.closest('[data-sq]') : null;
      if (!node) return;
      onPoint(+node.getAttribute('data-sq'));
    });
    $('newBtn').addEventListener('click', function () {
      if (isOnline()) { location.href = 'online.html'; return; }
      newGame();
    });
    $('undoBtn').addEventListener('click', undo);
    $('againBtn').addEventListener('click', function () {
      if (isOnline()) { onlineAgain(); return; }
      hideResult();
      newGame();
    });
    $('reviewBtn').addEventListener('click', hideResult);
    $('soundBtn').addEventListener('click', function () {
      var muted = window.Sfx ? !window.Sfx.isMuted() : false;
      if (window.Sfx) window.Sfx.mute(muted);
      this.setAttribute('aria-pressed', muted ? 'true' : 'false');
      this.textContent = muted ? '音效 关' : '音效 开';
      if (!muted) sfx('click');
    });
    Array.prototype.forEach.call($('modeSeg').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        if (isOnline()) return;
        mode = b.getAttribute('data-mode');
        newGame();
      });
    });
    Array.prototype.forEach.call($('levelSeg').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        level = +b.getAttribute('data-level') || 2;
        sfx('click');
        render();
      });
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshOnline(); });
    window.addEventListener('beforeunload', function () { if (pollTimer) clearInterval(pollTimer); });
  }

  function boot() {
    buildStaticBoard();
    bind();
    if (window.Sfx && window.Sfx.isMuted && window.Sfx.isMuted()) {
      $('soundBtn').textContent = '音效 关';
      $('soundBtn').setAttribute('aria-pressed', 'true');
    }
    var params = new URLSearchParams(location.search);
    var room = params.get('online');
    if (room) {
      online = { roomId: room, session: params.get('session') || '', playerId: params.get('player') || params.get('playerId') || '' };
      document.body.setAttribute('data-view', 'online');
      state = E.createGame();
      render();
      refreshOnline();
      pollTimer = setInterval(refreshOnline, 900);
    } else {
      state = E.createGame();
      render();
    }
  }

  window.__draughts = {
    getState: function () {
      var out = JSON.parse(JSON.stringify(state));
      out.legal = E.legalMoves(state).map(function (m) {
        return { from: m.from, to: m.to, path: m.path.slice(), captures: m.captures.slice(), notation: E.moveNotation(m) };
      });
      return out;
    },
    isBusy: function () { return busy; },
    isOnline: isOnline,
    playMove: function (from, to) {
      var move = findMove(from, to);
      if (!move) return false;
      if (isOnline()) { onlineMove(move); return true; }
      makeLocal(move, false);
      return true;
    },
    chooseMove: function (lv) { return E.aiMove(state, lv || level, 200); },
    loadPosition: function (board, turn) {
      state = E.createGame();
      state.board = board.slice();
      state.turn = turn === E.BLACK ? E.BLACK : E.WHITE;
      state.history = [];
      state.captures = { white: [], black: [] };
      stack = [];
      selected = -1;
      lastMove = null;
      hideResult();
      if (E.legalMoves(state).length === 0) {
        state.over = true;
        state.winner = -state.turn;
        state.reason = 'nomoves';
      }
      render();
      if (state.over) finish();
    },
    newGame: newGame,
    setMode: function (m) { mode = m; newGame(); },
    board: svg
  };

  boot();
})();
</script>
</body>
