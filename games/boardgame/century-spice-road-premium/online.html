<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Century 香料之路 联机房间：创建/邀请/加入，空位 AI 补足，断线重连、超时托管与结果榜。">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23191510'/%3E%3Crect x='12' y='12' width='40' height='40' rx='7' fill='%23c9a35e'/%3E%3Crect x='20' y='20' width='24' height='24' rx='5' fill='%23241d16'/%3E%3C/svg%3E">
<title>Century 香料之路 · 联机房间</title>
<style>
:root{
  --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --bg:#15120e;--bg-2:#1d1812;--panel:#221b13;--panel-2:#2b2117;
  --ink:#f4ecdc;--ink-dim:#bdb2a0;--gold:#c9a35e;--gold-2:#e8cc92;--line:rgba(201,163,94,.3);
  --ok:#8fd0ae;--danger:#e07a6b;--focus:#f7e2a8;
  --art-wood:url("../../assets/art/premium/century-spice-road/table-walnut.webp");
  --art-parchment:url("../../assets/art/premium/century-spice-road/parchment.webp");
  --art-linen:url("../../assets/art/premium/century-spice-road/parchment.webp");
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font:16px/1.55 var(--sans);
  background:
    radial-gradient(900px 620px at 12% -10%,rgba(201,163,94,.16),transparent 62%),
    radial-gradient(760px 560px at 94% 4%,rgba(255,255,255,.06),transparent 60%),
    linear-gradient(155deg,var(--bg),var(--bg-2) 72%,#0d0a07);
  -webkit-font-smoothing:antialiased;text-size-adjust:100%;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:var(--art-wood) center/cover no-repeat;opacity:.22;filter:saturate(.7) contrast(1.06)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 10%,transparent 35%,rgba(0,0,0,.55));}
a{color:var(--gold-2);text-underline-offset:3px}
button,input,select,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:8px}
.topbar{max-width:1120px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) clamp(14px,4vw,28px) 8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-height:44px}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#e8cc92,#8d6a33);color:#1b150e;font-family:var(--serif);font-weight:700;font-size:22px;transform:rotate(-3deg);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.brand h1{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(20px,3.4vw,28px);letter-spacing:.06em;line-height:1.1}
.brand p{margin:2px 0 0;font-size:12px;letter-spacing:.16em;color:var(--ink-dim)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:14px;font-weight:650;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--gold);color:var(--gold-2)}
.btn.primary{background:linear-gradient(150deg,#e8cc92,#b88a42);color:#211a10;border-color:#e8cc92}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1120px;margin:0 auto;padding:6px clamp(14px,4vw,28px) 40px}
.panel{background:linear-gradient(160deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 46px rgba(0,0,0,.32)}
.panel + .panel{margin-top:14px}
.panel h2{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);margin:0 0 12px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:12px;color:var(--ink-dim);font-weight:650}
.field input{min-height:46px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:#17120c;color:var(--ink);font-size:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .field{flex:1 1 180px;margin-bottom:0}
.hint{font-size:12.5px;color:var(--ink-dim);line-height:1.55}
.err{color:var(--danger);font-size:12.5px;min-height:18px}
.roombar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.code{font-family:var(--mono);font-size:16px;letter-spacing:.18em;color:var(--gold-2);background:#17120c;border:1px solid var(--line);border-radius:10px;padding:7px 11px}
.status{font-size:13px;color:var(--ink-dim)}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.seat{background:#19140e;border:1px solid var(--line);border-radius:13px;padding:10px 12px;min-width:0}
.seat.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(232,204,146,.3)}
.seat .name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .meta{font-size:12px;color:var(--ink-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .badge{font-size:12px;color:var(--gold-2)}
.board{display:grid;gap:10px}
.section{background:#19140e;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.section h3{margin:0 0 8px;font-size:13px;color:var(--gold-2);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.section h3 span{font-family:var(--mono);font-size:12px;color:var(--ink-dim);font-weight:500}
.gems,.moves,.cards,.tiles,.cubes{display:flex;flex-wrap:wrap;gap:6px}
.token{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;min-height:48px;border-radius:11px;border:1px solid rgba(255,255,255,.18);font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.65)}
.token small{font-family:var(--mono);font-size:12px;font-weight:700;opacity:.95}
.card{position:relative;width:112px;min-height:132px;border-radius:11px;padding:7px;background-color:#f0e2c5;background-image:var(--art-linen),linear-gradient(145deg,#fff8e8,#e7d6b5);background-size:cover,auto;background-blend-mode:multiply,normal;color:#2a2117;border:1px solid #c2ac82;box-shadow:0 4px 10px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:4px}
.card .tier{font-family:var(--mono);font-size:12px;color:#7b5c24;font-weight:700}
.card .points{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1;color:#3d2a10}
.card .bonus{font-size:12px;font-weight:700;color:#4b3517}
.card .cost{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.pip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:7px;font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.move{min-height:46px;padding:9px 13px;border-radius:11px;border:1px solid var(--line);background:#241d14;color:var(--ink);font-size:13px;font-weight:650;cursor:pointer;text-align:left;line-height:1.35;max-width:100%}
.move:hover{border-color:var(--gold);color:var(--gold-2)}
.move:disabled{opacity:.45;cursor:not-allowed}
.result{margin-top:12px;padding:14px;border:1px solid var(--gold);border-radius:14px;background:linear-gradient(160deg,#2b2117,#1a140e)}
.result h3{margin:0 0 8px;font-family:var(--serif);font-size:22px;color:var(--gold-2)}
.result .score{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(201,163,94,.18);font-size:13px}
.result .score:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2b2117;border:1px solid var(--gold);color:var(--gold-2);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.4);z-index:50}
[hidden]{display:none!important}
@media (max-width:520px){
  .seats{grid-template-columns:1fr}
  .brand p{display:none}
  .card{width:104px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">香</div>
    <div><h1>Century 香料之路</h1><p>联机房间 · ONLINE</p></div>
  </div>
  <div class="top-actions">
    <a class="btn ghost" href="index.html">单机对战</a>
    <a class="btn ghost" href="../spectate.html">围观</a>
    <a class="btn ghost" href="rules.html">规则</a>
  </div>
</header>
<main>
  <section class="panel" id="lobby" aria-labelledby="lobbyTitle">
    <h2 id="lobbyTitle">创建 / 加入房间</h2>
    <div class="row">
      <div class="field"><label for="nameInput">你的名字</label><input id="nameInput" maxlength="20" autocomplete="nickname" placeholder="玩家名"></div>
    </div>
    <div class="row">
      <button class="btn primary" id="createBtn" type="button">创建新房间</button>
      <button class="btn" id="startBtn" type="button" hidden>开始对局</button>
      <button class="btn ghost" id="inviteBtn" type="button" hidden>复制邀请</button>
    </div>
    <p class="hint">房间为 2 个座位；对手未到场时由 AI 补位。创建后可把房间码或邀请链接发给朋友。</p>
    <div class="row" style="margin-top:12px">
      <div class="field"><label for="codeInput">房间码</label><input id="codeInput" autocapitalize="characters" placeholder="例如 ABC234"></div>
      <div class="field"><label for="inviteInput">邀请令牌（可选）</label><input id="inviteInput" autocomplete="off" placeholder="邀请链接会自动填入"></div>
      <div class="field"><label for="passInput">密码（可选）</label><input id="passInput" type="password" placeholder="房间密码"></div>
      <button class="btn" id="joinBtn" type="button">加入房间</button>
    </div>
    <p class="err" id="lobbyErr" role="alert"></p>
  </section>

  <section id="room" hidden>
    <div class="panel">
      <div class="roombar">
        <span class="code" id="roomCode">------</span>
        <span class="status" id="roomStatus">等待开始</span>
        <button class="btn ghost" id="copyBtn" type="button">复制邀请</button>
        <button class="btn ghost" id="start2Btn" type="button" hidden>开始对局</button>
        <button class="btn ghost" id="restartBtn" type="button" hidden>再来一局</button>
        <button class="btn ghost" id="leaveBtn" type="button">离开</button>
        <button class="btn ghost" id="closeBtn" type="button" hidden>关房</button>
      </div>
      <div class="seats" id="seats"></div>
      <p class="status" id="turnStatus" aria-live="polite"></p>
      <div class="board" id="board"></div>
      <div class="section" id="movesSection">
        <h3>可选行动 <span id="movesHint"></span></h3>
        <div class="moves" id="moves"></div>
      </div>
      <div class="result" id="result" hidden></div>
    </div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  'use strict';
  var GAME='century-spice-road-premium';
  var D=window.CenturySpiceRoadData || null;
  var st={session:null,playerId:null,roomId:null,invite:null,view:null,poll:null,busy:false};
  var $=function(id){return document.getElementById(id);};
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function toast(msg){var el=$('toast');el.textContent=msg;el.hidden=false;setTimeout(function(){el.hidden=true;},1800);}
  function saved(key){try{return localStorage.getItem('bg-online-'+GAME+'-'+key);}catch(e){return null;}}
  function save(key,val){try{if(val==null)localStorage.removeItem('bg-online-'+GAME+'-'+key);else localStorage.setItem('bg-online-'+GAME+'-'+key,val);}catch(e){}}
  function randomId(){return 'p-'+Math.random().toString(36).slice(2,10);}
  function randomName(){var n=['青玉','琥珀','朱砂','鎏金','墨玉','霜白'];return n[Math.floor(Math.random()*n.length)]+'玩家';}
  function api(method,route,body){
    return fetch(route,{method:method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.text().then(function(t){var d=null;try{d=JSON.parse(t);}catch(e){}return {status:r.status,body:d,text:t};});});
  }
  function errText(res){return (res.body&&res.body.error&&res.body.error.message)||('请求失败 ('+res.status+')');}
  function roomUrl(s){return '/api/rooms/'+encodeURIComponent(st.roomId)+(s||'');}
  function isHost(){return !!(st.view&&st.view.seats&&st.view.seats[st.view.you]&&st.view.seats[st.view.you].isHost);}
  function setSession(resp){
    if(!resp||!resp.body)return;
    if(resp.body.session)st.session=resp.body.session;
    if(resp.body.roomId)st.roomId=resp.body.roomId;
    save('session',st.session);save('room',st.roomId);save('player',st.playerId);
  }
  function showRoom(){ $('lobby').hidden=true; $('room').hidden=false; }
  function showLobby(){ $('lobby').hidden=false; $('room').hidden=true; }
  function enter(resp){
    if(!resp||!resp.body)return;
    st.view=resp.body;
    setSession(resp);
    st.invite=st.invite||resp.body.inviteCode||null;
    save('invite',st.invite);
    showRoom();apply(resp.body);startPolling();
    try{history.replaceState({},'','?room='+encodeURIComponent(st.roomId));}catch(e){}
  }
  function createRoom(){
    st.playerId=st.playerId||randomId();
    var name=($('nameInput').value||'').trim()||randomName();
    $('nameInput').value=name;
    api('POST','/api/rooms',{playerId:st.playerId,nickname:name}).then(function(res){
      if(res.status!==201)return ($('lobbyErr').textContent=errText(res));
      enter(res);toast('房间已创建');
    }).catch(function(e){$('lobbyErr').textContent=String(e);});
  }
  function joinRoom(){
    st.playerId=st.playerId||randomId();
    var name=($('nameInput').value||'').trim()||randomName();
    $('nameInput').value=name;
    var code=($('codeInput').value||'').trim().toUpperCase();
    var invite=($('inviteInput').value||'').trim();
    if(!code&&!invite)return ($('lobbyErr').textContent='请输入房间码或邀请令牌');
    var target=code||invite;
    var body={playerId:st.playerId,nickname:name};
    if(invite)body.inviteCode=invite;
    if($('passInput').value)body.password=$('passInput').value;
    api('POST','/api/rooms/'+encodeURIComponent(target)+'/join',body).then(function(res){
      if(res.status!==200)return ($('lobbyErr').textContent=errText(res));
      st.invite=invite||res.body.inviteCode||null;
      enter(res);
    }).catch(function(e){$('lobbyErr').textContent=String(e);});
  }
  function startGame(){
    if(!st.roomId||!st.session)return;
    api('POST',roomUrl('/start'),{session:st.session,playerId:st.playerId}).then(function(res){
      if(res.status!==200)return toast(errText(res));
      apply(res.body);
    });
  }
  function restartGame(){
    api('POST',roomUrl('/restart'),{session:st.session,playerId:st.playerId}).then(function(res){
      if(res.status!==200)return toast(errText(res));
      apply(res.body);
    });
  }
  function sendMove(move){
    if(st.busy)return;st.busy=true;
    api('POST',roomUrl('/actions'),{session:st.session,playerId:st.playerId,action:move}).then(function(res){
      st.busy=false;
      if(res.status!==200)return toast(errText(res));
      apply(res.body);
    }).catch(function(e){st.busy=false;toast(String(e));});
  }
  function refresh(){
    if(!st.roomId||!st.session)return;
    api('GET',roomUrl()+'?session='+encodeURIComponent(st.session)+'&playerId='+encodeURIComponent(st.playerId)).then(function(res){
      if(res.status===404||res.status===401){stopPolling();st.session=null;st.roomId=null;save('session',null);save('room',null);showLobby();toast('房间已关闭');return;}
      if(res.status===200)apply(res.body);
    }).catch(function(){});
  }
  function startPolling(){stopPolling();st.poll=setInterval(refresh,1000);refresh();}
  function stopPolling(){if(st.poll){clearInterval(st.poll);st.poll=null;}}
  function apply(v){
    if(!v)return;st.view=v;
    if(!st.invite&&v.inviteCode){st.invite=v.inviteCode;save('invite',st.invite);}
    var s=v.state;
    $('roomCode').textContent=v.code||st.roomId||'------';
    $('roomStatus').textContent=v.started?(v.over?'已结束':'对局中'):((v.seats||[]).filter(function(x){return !x.ai;}).length>=2?'可以开始':'等待对手');
    $('startBtn').hidden=!(isHost()&&!v.started);
    $('start2Btn').hidden=!(isHost()&&!v.started);
    $('inviteBtn').hidden=!isHost();
    $('restartBtn').hidden=!v.canRestart;
    $('closeBtn').hidden=!isHost();
    var current=s?s.current:null;
    var seats=(v.seats||[]).map(function(seat){
      var takeover=(v.takeover||[]).indexOf(seat.index)!==-1;
      return '<div class="seat'+(current===seat.index?' active':'')+'">'+
        '<div class="name">'+esc(seat.name)+' <span class="badge">'+(seat.ai?'AI':(takeover?'托管':(seat.isHost?'房主':'玩家')))+(seat.isYou?' · 你':'')+'</span></div>'+
        '<div class="meta">'+(seat.ai?'AI 控制':'手动操作')+(seat.connected?'':' · 离线')+'</div></div>';
    }).join('');
    $('seats').innerHTML=seats;
    $('turnStatus').textContent=v.started?(s&&s.over?'对局结束':((v.legalActions||[]).length?'轮到你行动':'轮到 '+(((s&&s.players)||[])[current]&&s.players[current].name||'玩家'))):'等待房主开始；空位将由 AI 补足。';
    $('board').innerHTML=renderBoard(v);
    renderMoves(v);
    renderResult(v);
  }
  function renderMoves(v){
    var box=$('moves'),hint=$('movesHint');
    if(!v.started){box.innerHTML='';hint.textContent='等待开始';return;}
    if(v.over||!v.state||v.state.over){box.innerHTML='';hint.textContent='对局已结束';return;}
    var moves=v.legalActions||[];
    if(!moves.length){box.innerHTML='';hint.textContent='等待对手行动';return;}
    hint.textContent='轮到你了';
    box.innerHTML=moves.map(function(m,i){return '<button class="move" type="button" data-i="'+i+'">'+esc(moveLabel(m,v.state))+'</button>';}).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.move'),function(btn){
      btn.addEventListener('click',function(){var m=(v.legalActions||[])[Number(btn.getAttribute('data-i'))];if(m)sendMove(m);});
    });
  }
  function renderResult(v){
    var el=$('result');
    if(!(v.state&&v.state.over)){el.hidden=true;el.innerHTML='';return;}
    var shown=v.result||null;
    var rows=(shown&&(shown.rows||shown.scores))||(v.state.result&&v.state.result.scores)||[];
    var winner=shown?shown.winnerSeat:(v.state.result?v.state.result.winner:null);
    el.hidden=false;
    el.innerHTML='<h3>'+(winner==null?'平局':esc(rows[winner]&&rows[winner].name||'胜者')+' 获胜')+'</h3>'+
      rows.map(function(r){return '<div class="score"><span>'+esc(r.name||('玩家 '+(r.index+1)))+'</span><b>'+esc(r.total==null?r:r.total)+'</b></div>';}).join('')+
      '<p class="hint">结果已记入榜单。房主可再来一局。</p>';
  }
  function copyInvite(){
    if(!st.view)return;
    var link=location.origin+location.pathname+'?room='+encodeURIComponent(st.roomId||st.view.code||'')+
      (st.invite?'&code='+encodeURIComponent(st.invite):'');
    var text='房间 '+(st.view.code||'')+' · '+link;
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('邀请已复制');});}
    else{toast(text);}
  }
  function leaveRoom(){
    api('POST',roomUrl('/leave'),{session:st.session,playerId:st.playerId}).catch(function(){}).then(function(){
      save('session',null);save('room',null);stopPolling();location.reload();
    });
  }
  function closeRoom(){
    api('DELETE',roomUrl('?session='+encodeURIComponent(st.session)+'&playerId='+encodeURIComponent(st.playerId))).catch(function(){}).then(function(){
      save('session',null);save('room',null);stopPolling();location.reload();
    });
  }

  function spiceMeta(i){return (D&&D.SPICES&&D.SPICES[i])||{name:'香料'+i,face:'#888',short:'?'};}
  function cubeHtml(i,n){var sp=spiceMeta(i);return '<span class="pip" style="background:'+sp.face+';color:'+(sp.ink||'#fff')+'">'+n+'</span>';}
  function costHtml(cost){return (cost||[]).map(function(n,i){return n?cubeHtml(i,n):'';}).join('');}
  function effectText(card){
    var e=card.effect||{};var names=(D&&D.SPICES)||[];
    function vec(v){return (v||[]).map(function(n,i){return n?names[i].name+'×'+n:'';}).filter(Boolean).join('、')||'—';}
    if(e.type==='create')return '生产：获得 '+vec(e.gain);
    if(e.type==='trade')return '转换：支付 '+vec(e.cost)+' → 获得 '+vec(e.gain);
    if(e.type==='upgrade')return '升级：将 '+e.count+' 个香料各升一级';
    return card.text||'';
  }
  function cardLabel(c){return c.text||c.name||('#'+c.id);}
  function moveLabel(m,state){
    var p=(state.players||[])[state.current]||{hand:[]};
    if(m.type==='play'){var c=(p.hand||[])[m.cardIndex]||{};var extra=(m.upgrades&&m.upgrades.length)?'（升级：'+m.upgrades.map(function(l){return spiceMeta(l).name;}).join('、')+'）':'';return '打出商人卡「'+cardLabel(c)+'」'+extra;}
    if(m.type==='acquire')return '获取第 '+(m.marketIndex+1)+' 张商人卡（支付：'+((m.payment||[]).map(function(v){return (v||[]).map(function(n,i){return n?spiceMeta(i).name:'';}).filter(Boolean).join('+');}).join(' / ')||'免费')+'）';
    if(m.type==='rest')return '休息：收回所有已打出的商人卡';
    if(m.type==='claim'){var card=(state.pointMarket||[]).filter(function(c){return c.id===m.cardId;})[0]||{};return '领取得分卡 '+(card.points||'')+' 分（'+esc(String(m.cardId))+'）';}
    return JSON.stringify(m);
  }
  function renderBoard(v){
    var s=v.state;if(!s)return '';
    var points='<div class="section"><h3>得分卡 <span>金币 '+s.coins.gold+' · 银币 '+s.coins.silver+'</span></h3><div class="cards">'+
      (s.pointMarket||[]).map(function(c,i){return '<div class="card"><div class="tier">'+(i<2?(i===0?'金币':'银币'):'得分')+'</div><div class="points">'+c.points+'</div><div class="bonus">'+esc(String(c.id))+'</div><div class="cost">'+costHtml(c.cost)+'</div></div>';}).join('')+'</div></div>';
    var merchants='<div class="section"><h3>商人卡市场 <span>牌堆 '+s.merchantDeckCount+'</span></h3><div class="cards">'+
      (s.merchantMarket||[]).map(function(c){return '<div class="card" style="background-image:var(--art-parchment),linear-gradient(145deg,#fff8e8,#e7d6b5)"><div class="tier">商人</div><div class="bonus" style="font-size:13px;line-height:1.35">'+esc(effectText(c))+'</div></div>';}).join('')+'</div></div>';
    var me=v.you==null?-1:v.you;
    var players=(s.players||[]).map(function(p){
      var cubes=(p.spices||[]).map(function(n,i){return n?cubeHtml(i,n):'';}).join('');
      var hand=(p.hand||[]).map(function(c){return '<span class="pip" style="background:#6b4d2a;color:#fff;min-width:auto;padding:0 7px">'+esc(c.hidden?'?':(c.name||c.id))+'</span>';}).join('');
      var scores=(p.scoreCards||[]).map(function(c){return '<span class="pip" style="background:#b88a42;color:#241a0c">'+c.points+'</span>';}).join('');
      return '<div class="section"><h3>'+esc(p.name)+(p.index===me?'（你）':'')+' <span>'+(p.gold*3+p.silver+(p.scoreCards||[]).reduce(function(a,c){return a+c.points;},0))+' 分 · 金 '+p.gold+' 银 '+p.silver+'</span></h3>'+
        '<div class="hint">商队 '+(p.spices||[]).reduce(function(a,n){return a+n;},0)+' / 10 个：'+cubes+'</div>'+
        '<div class="hint" style="margin-top:5px">手牌 '+(hand||'无')+'</div>'+
        '<div class="hint" style="margin-top:5px">得分卡 '+(scores||'无')+'</div></div>';
    }).join('');
    return points+merchants+players;
  }
  function boot(){
    st.playerId=saved('player')||'';
    st.session=saved('session');
    st.roomId=saved('room');
    st.invite=saved('invite');
    $('nameInput').value=st.playerId?saved('name')||'':randomName();
    $('createBtn').addEventListener('click',createRoom);
    $('joinBtn').addEventListener('click',joinRoom);
    $('startBtn').addEventListener('click',startGame);
    $('start2Btn').addEventListener('click',startGame);
    $('restartBtn').addEventListener('click',restartGame);
    $('inviteBtn').addEventListener('click',copyInvite);
    $('copyBtn').addEventListener('click',copyInvite);
    $('leaveBtn').addEventListener('click',leaveRoom);
    $('closeBtn').addEventListener('click',closeRoom);
    var q=new URLSearchParams(location.search);
    if(q.get('room')){$('codeInput').value=q.get('room');}
    if(q.get('code')){$('inviteInput').value=q.get('code');st.invite=q.get('code');}
    if(st.session&&st.roomId){
      api('POST',roomUrl('/reconnect'),{session:st.session,playerId:st.playerId}).then(function(res){
        if(res.status===200){enter(res);}
        else{st.session=null;st.roomId=null;save('session',null);save('room',null);}
      }).catch(function(){});
    }
  }
  boot();
})();
</script>
</body>
</html>
