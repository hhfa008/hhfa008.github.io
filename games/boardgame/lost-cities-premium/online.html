<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>失落之城 · 联机远征</title>
<meta name="description" content="失落之城 Lost Cities 双人联机：房间邀请、密码房、AI 补位、服务端权威判定、断线重连、超时托管、结果榜与重赛。">
<meta name="theme-color" content="#0b130d">
<meta property="og:title" content="失落之城 · 联机远征">
<meta property="og:description" content="雨林羊皮纸上的双人三局远征，服务端权威、断线可续。">
<meta property="og:image" content="assets/og.webp">
<link rel="icon" href="../../assets/art/premium/lost-cities/compass.webp">
<style>
:root{--bg:#07100a;--panel:#132217;--panel2:#1b3021;--line:rgba(201,163,95,.28);--brass:#c9a35f;--brass2:#efd399;--ink:#efe5cf;--dim:#b9c4ac;--faint:#85957d;--ok:#8fc48a;--danger:#d47765;--yellow:#d0ae36;--blue:#3f83bd;--white:#ded3ba;--green:#5d8457;--red:#bf5a4d;
  --font-display:"Songti SC","STSong","Noto Serif SC",Georgia,serif;--font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  --felt:url("../../assets/art/premium/lost-cities/jungle-felt.webp");--paper:url("../../assets/art/premium/lost-cities/card-paper.webp");--compass:url("../../assets/art/premium/lost-cities/compass.webp");--seal:url("../../assets/art/premium/lost-cities/wager-seal.webp");--map:url("../../assets/art/premium/lost-cities/map-scroll.webp");--chest:url("../../assets/art/premium/lost-cities/wood-chest.webp");
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100dvh;overflow-x:hidden;background:radial-gradient(900px 600px at 50% -10%,rgba(201,163,95,.15),transparent 60%),linear-gradient(rgba(7,16,10,.93),rgba(7,16,10,.97)),var(--felt) center/cover fixed;color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
button,a,input,select{font-family:inherit;font-size:16px;color:inherit}button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.05em;margin:0}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:calc(10px + var(--safe-top)) 12px calc(18px + var(--safe-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{width:50px;height:50px;flex:0 0 50px;border-radius:50%;border:1px solid var(--line);background:linear-gradient(rgba(8,18,11,.4),rgba(8,18,11,.4)),var(--compass) center/120% no-repeat;background-blend-mode:multiply,normal}
h1{font-size:clamp(24px,6vw,36px);line-height:1.05}.brand p{margin:2px 0 0;font-size:12px;letter-spacing:.16em;color:var(--dim)}
.back{min-height:44px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;padding:0 12px;text-decoration:none;background:rgba(20,37,25,.7);font-size:13px}
.panel{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,rgba(27,48,33,.9),rgba(12,24,15,.94));padding:12px;margin-bottom:10px;box-shadow:0 14px 30px rgba(0,0,0,.2)}
.panel h2{font-size:18px;color:#f2e7cf;margin-bottom:8px}
.hint{font-size:12px;color:var(--dim);margin:4px 0 10px}
.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--brass2);background:rgba(5,14,8,.35)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.field{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--dim)}
input,select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:rgba(5,14,8,.6);padding:0 10px;color:var(--ink);width:100%}
input::placeholder{color:#71806c}
.btn{min-height:44px;border:1px solid rgba(201,163,95,.4);border-radius:10px;background:rgba(39,61,41,.9);color:var(--ink);padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.btn:hover{background:rgba(58,82,53,.95)}.btn.primary{background:linear-gradient(135deg,#7b5f25,#b99248);border-color:rgba(239,211,153,.7);color:#1d1608;font-weight:700}
.btn.ghost{background:rgba(10,22,13,.4)}.btn:disabled{opacity:.45;cursor:default}
.btn[hidden],.panel[hidden],.game[hidden],.result[hidden]{display:none!important}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.seat{border:1px solid rgba(201,163,95,.2);border-radius:10px;padding:8px;background:rgba(5,14,8,.3);font-size:13px}
.seat b{display:block;font-size:14px;color:var(--brass2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat small{color:var(--dim);font-size:12px}
.leader{list-style:none;margin:0;padding:0;font-size:12px;color:var(--dim)}
.leader li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed rgba(201,163,95,.13)}
.leader b{color:var(--brass2)}
.game-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.scoreline{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.sc{border:1px solid rgba(201,163,95,.22);border-radius:10px;padding:8px;background:rgba(7,17,10,.5);display:flex;justify-content:space-between;gap:6px;align-items:center}
.sc.active{border-color:rgba(239,211,153,.7)}
.sc b{font-size:20px;color:var(--brass2);font-variant-numeric:tabular-nums}
.sc span{font-size:12px;color:var(--dim)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-bottom:8px}
.lane{border:1px solid rgba(255,255,255,.07);border-radius:9px;background:rgba(5,14,8,.45);padding:4px;display:flex;flex-direction:column;gap:4px;min-width:0}
.lane-h{display:flex;justify-content:space-between;gap:2px;font-size:12px;color:var(--dim);min-height:17px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:2px}
.c-yellow .dot{background:var(--yellow)}.c-blue .dot{background:var(--blue)}.c-white .dot{background:var(--white)}.c-green .dot{background:var(--green)}.c-red .dot{background:var(--red)}
.stack{min-height:26px;display:flex;align-items:center;flex-wrap:nowrap;overflow:hidden;gap:0;padding:2px 0}
.mini{width:19px;height:25px;flex:0 0 19px;margin-left:-5px;display:inline-flex;align-items:center;justify-content:center;border-radius:3px;background:linear-gradient(145deg,#f1e4c7,#cdbb95);border:1px solid rgba(0,0,0,.26);color:#282318;font-size:12px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.mini:first-child{margin-left:0}.mini.w{background:linear-gradient(rgba(90,60,18,.22),rgba(90,60,18,.22)),var(--seal) center/130% no-repeat;background-blend-mode:multiply,normal;color:#fff7db}
.mini.back{background:linear-gradient(145deg,#36563b,#17291b);color:transparent}
.act{min-height:44px;border:1px solid rgba(201,163,95,.2);border-radius:7px;background:rgba(30,51,33,.64);color:var(--ink);font-size:12px;padding:2px;width:100%;overflow:hidden}
.act.legal{border-color:rgba(239,211,153,.8);background:rgba(70,85,43,.75)}
.act:disabled{opacity:.62;cursor:default}
.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:5px}
.card{min-height:64px;border:1px solid rgba(100,80,45,.5);border-radius:8px;background:linear-gradient(rgba(255,246,225,.1),rgba(60,45,20,.1)),var(--paper) center/cover;background-blend-mode:soft-light,normal;color:#2a2619;padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.card b{font-family:var(--font-display);font-size:27px;line-height:1}.card small{font-size:12px;color:#fff8e2;background:#4b5e36;border-radius:3px;padding:0 5px;line-height:1.2;max-width:100%;overflow:hidden;white-space:nowrap}
.card .seal{width:40px;height:40px;border-radius:50%;background:var(--seal) center/130% no-repeat}
.card.selected{box-shadow:0 0 0 2px var(--brass2);transform:translateY(-2px)}
.card:disabled{opacity:.82}
.subhead{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--dim);margin:7px 0 3px}
.draw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:6px}
.draw .btn{min-height:44px;font-size:12px;padding:0 5px}
.log{max-height:108px;overflow:auto;font-size:12px;color:var(--dim);margin:8px 0 0;padding:0;list-style:none}
.log li{padding:2px 0;border-bottom:1px dashed rgba(201,163,95,.1)}
.result .big{font-size:26px;color:var(--brass2);font-family:var(--font-display);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(16px + var(--safe-bottom));transform:translate(-50%,14px);opacity:0;pointer-events:none;z-index:60;background:rgba(10,24,14,.98);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13px;max-width:90vw;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:640px){.hand{grid-template-columns:repeat(8,minmax(0,1fr))}.seats{grid-template-columns:1fr 1fr}.draw{grid-template-columns:repeat(6,minmax(0,1fr))}.wrap{padding-left:18px;padding-right:18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span><div><h1>失落之城 <span style="font-size:.5em;color:var(--brass2)">联机</span></h1><p>LOST CITIES · 双人远征</p></div></div>
    <a class="back" href="index.html">单人版</a>
  </header>

  <section class="panel" id="lobby">
    <h2>联机大厅</h2>
    <p class="hint">2 人房间 · 空位自动由 AI 补上 · 服务端权威判合法动作 · 邀请单次有效 · 支持密码房。</p>
    <div class="row">
      <div class="field"><label for="playerName">你的名字</label><input id="playerName" value="探险家" maxlength="20" autocomplete="nickname" aria-label="你的名字"></div>
      <div class="field"><label for="aiLevel">AI 难度</label><select id="aiLevel"><option value="easy">简单</option><option value="normal" selected>普通</option><option value="hard">困难</option></select></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="field"><label for="password">房间密码（可选）</label><input id="password" type="password" placeholder="4–64 位，留空为公开房" maxlength="64"></div>
      <div class="field"><label for="visibility">可见性</label><select id="visibility"><option value="public">公开</option><option value="private">私密</option></select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="createBtn" type="button">创建房间</button>
      <button class="btn" id="refreshLobbyBtn" type="button">刷新结果榜</button>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="field" style="flex:2 1 220px"><label for="joinCode">房间号 / 邀请码</label><input id="joinCode" placeholder="6 位房间号或邀请 token"></div>
      <div class="field"><label for="joinPassword">密码（如有）</label><input id="joinPassword" type="password" placeholder="可选"></div>
    </div>
    <div class="row" style="margin-top:8px"><button class="btn" id="joinBtn" type="button">加入房间</button><button class="btn ghost" id="reconnectBtn" type="button">用上次会话重连</button></div>
    <p class="hint" id="lobbyMsg">提示：也可以直接打开带 ?room=&amp;session=&amp;player= 的邀请链接。</p>
  </section>

  <section class="panel" id="roomPanel" hidden>
    <div class="game-head"><h2>房间 <span class="badge" id="roomCode">—</span></h2><span class="badge" id="roomStatus">等待</span></div>
    <div class="seats" id="seats"></div>
    <p class="hint" id="inviteText">邀请 token：—</p>
    <div class="row">
      <button class="btn primary" id="startBtn" type="button" hidden>开始对局</button>
      <button class="btn" id="copyInviteBtn" type="button">复制邀请链接</button>
      <button class="btn" id="reconnectRoomBtn" type="button">重连</button>
      <button class="btn ghost" id="leaveBtn" type="button">离座（转 AI）</button>
      <button class="btn ghost" id="closeRoomBtn" type="button">关闭房间</button>
    </div>
  </section>

  <section class="panel game" id="gamePanel" hidden>
    <div class="game-head"><h2>第 <span id="roundNo">1</span> / 3 局</h2><span class="badge" id="turnBadge">等待</span></div>
    <div class="scoreline" id="scoreline"></div>
    <div class="subhead"><span>对手探险区</span><span id="rivalHand">手牌 8</span></div>
    <div class="board" id="rivalBoard"></div>
    <div class="row" style="margin:6px 0"><button class="btn" id="deckBtn" type="button">牌堆 <b id="deckCount">44</b></button><span class="badge" id="phaseBadge">先打一张</span></div>
    <div class="subhead"><span>你的探险区</span><span id="ownHandCount">手牌 8</span></div>
    <div class="board" id="ownBoard"></div>
    <div class="subhead"><span>手牌</span><span id="actionHint">等待你的回合</span></div>
    <div class="hand" id="hand"></div>
    <div class="draw" id="drawDock" hidden></div>
    <ul class="log" id="log"></ul>
  </section>

  <section class="panel result" id="resultPanel" hidden>
    <h2>远征结算</h2>
    <p class="big" id="resultBig">—</p>
    <p class="hint" id="resultDetail">—</p>
    <div class="row"><button class="btn primary" id="restartBtn" type="button">重赛</button><button class="btn" id="backRoomBtn" type="button">返回房间</button></div>
  </section>

  <section class="panel">
    <h2>结果榜</h2>
    <ul class="leader" id="leaderboard"><li><span>暂无结果</span><span>—</span></li></ul>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../../shared/shuffle.js"></script>
<script src="../../shared/sfx.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  'use strict';
  var E = window.LostCitiesEngine;
  var view = null;
  var session = null;
  var playerId = null;
  var selected = null;
  var busy = false;
  var pollTimer = null;
  var toastTimer = null;
  var lastRoundCount = 0;
  var $ = function(id){ return document.getElementById(id); };
  var clone = function(v){ return JSON.parse(JSON.stringify(v)); };

  function toast(text){
    var el = $('toast'); el.textContent = text; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }
  function name(){ return ($('playerName').value || '探险家').trim().slice(0,20) || '探险家'; }
  function api(method, route, body){
    return fetch(route, {
      method: method,
      headers: { 'content-type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function(res){
      return res.text().then(function(text){
        var data = null; try { data = JSON.parse(text); } catch (err) {}
        if (!res.ok) {
          var msg = data && data.error && data.error.message ? data.error.message : ('HTTP ' + res.status);
          var err = new Error(msg); err.code = data && data.error && data.error.code; err.status = res.status; throw err;
        }
        return data;
      });
    });
  }
  function applyView(next){
    if (!next || !next.roomId) return;
    view = next;
    if (next.playerSession) session = next.playerSession;
    if (next.playerId) playerId = next.playerId;
    $('roomPanel').hidden = false;
    $('lobby').hidden = true;
    $('roomCode').textContent = next.roomCode || next.roomId;
    $('roomStatus').textContent = next.status || 'waiting';
    $('seats').innerHTML = (next.seats || []).map(function(s){
      return '<div class="seat"><b>' + (s.nickname || s.label) + '</b><small>' + (s.ai ? 'AI 补位' : (s.takeover ? '超时托管中' : '玩家')) + (s.current ? ' · 当前回合' : '') + '</small></div>';
    }).join('');
    var canStart = next.canStart && next.isHost;
    $('startBtn').hidden = !canStart;
    $('inviteText').textContent = next.inviteToken ? ('邀请 token：' + next.inviteToken) : (next.isHost ? '邀请 token 将在此显示' : '等待房主邀请');
    $('closeRoomBtn').style.display = next.isHost ? '' : 'none';
    if (next.started && next.state) {
      $('gamePanel').hidden = false;
      renderGame(next);
      startPolling();
    } else {
      $('gamePanel').hidden = true;
    }
    if (next.status === 'finished' && next.state && next.state.over) renderResult(next);
  }
  function renderGame(v){
    var s = v.state;
    var you = v.you ? v.you.playerIndex : 0;
    var me = s.players[you];
    var rival = s.players[1 - you];
    var myTurn = v.canMove && s.current === you && !s.over;
    $('roundNo').textContent = s.round;
    $('turnBadge').textContent = s.over ? '结束' : (myTurn ? '轮到你' : (s.current === 1 - you ? '对手行动' : '等待'));
    $('phaseBadge').textContent = s.over ? '三局结束' : (s.phase === 'draw' ? '再抽一张' : '先打一张');
    $('deckCount').textContent = s.deckCount;
    $('deckBtn').disabled = !myTurn || s.phase !== 'draw' || s.deckCount <= 0;
    $('rivalHand').textContent = '手牌 ' + rival.handCount;
    $('ownHandCount').textContent = '手牌 ' + me.hand.length;
    $('scoreline').innerHTML = [rival, me].map(function(p, idx){
      var i = idx === 0 ? 1 - you : you;
      return '<div class="sc' + (s.current === i && !s.over ? ' active' : '') + '"><div><b>' + p.totalScore + '</b><span> 累计</span></div><div><span>' + (p.name || '') + '</span><br><span>本局 ' + E.scorePlayer({hand:[],exp:p.exp,wagers:0,roundScores:[]}).total + '</span></div></div>';
    }).join('');
    renderBoard('rivalBoard', rival, false, myTurn, you);
    renderBoard('ownBoard', me, true, myTurn, you);
    renderHand(me, myTurn);
    renderDraw(s, myTurn);
    $('actionHint').textContent = s.over ? '已结束' : (myTurn ? (s.phase === 'play' ? '选牌后点探险列或弃牌堆' : '从牌堆或弃牌堆抽牌') : '等待对手');
    $('log').innerHTML = s.log.slice(-12).reverse().map(function(row){ return '<li>R' + row.round + ' · ' + row.text + '</li>'; }).join('');
    if (s.roundResults.length > lastRoundCount) {
      var last = s.roundResults[s.roundResults.length - 1];
      if (!s.over) toast('第 ' + last.round + ' 局结算：' + last.scores[0].total + ' : ' + last.scores[1].total);
      lastRoundCount = s.roundResults.length;
    }
    if (s.over) renderResult(v);
    else $('resultPanel').hidden = true;
  }
  function boardMarkup(player, interactive, myTurn, you){
    return E.COLORS.map(function(color){
      var exp = player.exp[color.key];
      var pile = view.state.discards[color.key] || [];
      var top = pile.length ? pile[pile.length - 1] : null;
      var mini = '';
      exp.wagers.forEach(function(){ mini += '<span class="mini w">✦</span>'; });
      exp.nums.forEach(function(c){ mini += '<span class="mini">' + c.value + '</span>'; });
      var canExp = interactive && myTurn && view.state.phase === 'play' && selected != null && player.hand[selected] &&
        E.canPlayCard(exp, player.hand[selected]);
      var canPile = interactive && !myTurn ? false : interactive && sPlayPhase();
      var topMini = top ? (top.kind === 'wager' ? '<span class="mini w">✦</span>' : '<span class="mini">' + top.value + '</span>') : '<span class="mini back">·</span>';
      return '<div class="lane c-' + color.key + '"><div class="lane-h"><span><i class="dot"></i>' + color.zh + '</span><span>' + (exp.nums.length || exp.wagers.length ? exp.nums.length + exp.wagers.length + '张' : '—') + '</span></div>' +
        '<button type="button" class="act' + (canExp ? ' legal' : '') + '" data-act="exp" data-color="' + color.key + '" ' + (interactive && myTurn ? '' : 'disabled ') + 'aria-label="' + color.zh + '探险列">' + (mini || '<span style="font-size:12px;color:var(--faint)">空</span>') + '</button>' +
        '<button type="button" class="act" data-act="pile" data-color="' + color.key + '" ' + (interactive && myTurn ? '' : 'disabled ') + 'aria-label="' + color.zh + '弃牌堆 ' + pile.length + ' 张">' + topMini + '<span style="font-size:12px;color:var(--faint)"> ' + pile.length + '</span></button></div>';
    }).join('');
  }
  function sPlayPhase(){ return view && view.state && view.state.phase === 'play'; }
  function renderBoard(id, player, interactive, myTurn, you){ $(id).innerHTML = boardMarkup(player, interactive, myTurn, you); }
  function renderHand(player, myTurn){
    $('hand').innerHTML = player.hand.map(function(card, index){
      var selectedNow = index === selected;
      return '<button type="button" class="card' + (selectedNow ? ' selected' : '') + '" data-hand="' + index + '" ' + (myTurn && sPlayPhase() ? '' : 'disabled ') + 'aria-label="' + E.cardLabel(card) + '">' +
        (card.kind === 'wager' ? '<span class="seal"></span><small>' + E.COLOR_BY_KEY[card.color].zh + '赌注</small>' : '<b>' + card.value + '</b><small>' + E.COLOR_BY_KEY[card.color].zh + '</small>') + '</button>';
    }).join('');
  }
  function renderDraw(s, myTurn){
    var show = myTurn && s.phase === 'draw' && !s.over;
    $('drawDock').hidden = !show;
    if (!show) { $('drawDock').innerHTML = ''; return; }
    var html = '<button type="button" class="btn" data-draw="deck">牌堆 ' + s.deckCount + '</button>';
    E.COLORS.forEach(function(c){
      var pile = s.discards[c.key] || [];
      var top = pile.length ? pile[pile.length - 1] : null;
      var block = !top || top.id === s.pendingDiscard;
      html += '<button type="button" class="btn" data-draw="' + c.key + '" ' + (block ? 'disabled ' : '') + '>' + c.zh + ' ' + (top ? (top.kind === 'wager' ? '✦' : top.value) : '—') + '</button>';
    });
    $('drawDock').innerHTML = html;
  }
  function renderResult(v){
    var r = v.state.result;
    if (!r) return;
    $('resultPanel').hidden = false;
    $('gamePanel').hidden = false;
    $('resultBig').textContent = r.tied ? '共享胜利' : (v.you && r.winner === v.you.playerIndex ? '你赢得远征' : '对手赢得远征');
    $('resultDetail').textContent = r.scores.map(function(s){ return s.name + '：' + s.roundScores.join(' / ') + ' = ' + s.total + ' 分'; }).join('；');
    $('restartBtn').hidden = !(v.isHost && v.canRestart);
  }

  function createRoom(){
    if (busy) return Promise.resolve(null); busy = true;
    return api('POST','/api/rooms',{ playerId:name(), password:$('password').value || null, visibility:$('visibility').value, maxPlayers:2, aiLevel:$('aiLevel').value })
      .then(function(v){ applyView(v); $('lobbyMsg').textContent = '房间已创建，邀请好友或直接开始与 AI 对局。'; return v; })
      .catch(function(err){ toast('创建失败：' + err.message); return null; })
      .finally(function(){ busy = false; });
  }
  function joinRoom(){
    var code = ($('joinCode').value || '').trim();
    if (!code) { toast('请填写房间号或邀请码'); return Promise.resolve(null); }
    if (busy) return Promise.resolve(null); busy = true;
    var route = '/api/rooms/' + encodeURIComponent(code) + '/join';
    return api('POST', route, { playerId:name(), inviteCode:code, password:$('joinPassword').value || $('password').value || null })
      .then(function(v){ applyView(v); toast('已加入房间'); return v; })
      .catch(function(err){ toast('加入失败：' + err.message); return null; })
      .finally(function(){ busy = false; });
  }
  function startMatch(){
    if (!view) return Promise.resolve(null);
    return api('POST','/api/rooms/' + encodeURIComponent(view.roomId) + '/start',{ session:session, playerId:playerId })
      .then(function(v){ applyView(v); return v; }).catch(function(err){ toast('开始失败：' + err.message); return null; });
  }
  function reconnect(){
    if (!view || !session) {
      var last = null; try { last = JSON.parse(sessionStorage.getItem('lc-room') || 'null'); } catch (e) {}
      if (last && last.roomId && last.session) {
        return api('POST','/api/rooms/' + encodeURIComponent(last.roomId) + '/reconnect',{ token:last.session, playerId:last.playerId })
          .then(function(v){ applyView(v); toast('已重连'); return v; })
          .catch(function(err){ toast('重连失败：' + err.message); return null; });
      }
      toast('没有可用的房间会话'); return Promise.resolve(null);
    }
    return api('POST','/api/rooms/' + encodeURIComponent(view.roomId) + '/reconnect',{ token:session, playerId:playerId })
      .then(function(v){ applyView(v); toast('已重连'); return v; })
      .catch(function(err){ toast('重连失败：' + err.message); return null; });
  }
  function leave(){
    if (!view) return Promise.resolve(null);
    return api('POST','/api/rooms/' + encodeURIComponent(view.roomId) + '/leave',{ session:session, playerId:playerId })
      .then(function(){ toast('已离座，座位转为 AI'); clearSession(); return null; })
      .catch(function(err){ toast('离座失败：' + err.message); return null; });
  }
  function closeRoom(){
    if (!view || !view.isHost) { toast('只有房主可以关闭房间'); return Promise.resolve(null); }
    return api('DELETE','/api/rooms/' + encodeURIComponent(view.roomId) + '?session=' + encodeURIComponent(session) + '&playerId=' + encodeURIComponent(playerId))
      .then(function(){ toast('房间已关闭'); clearSession(); return null; })
      .catch(function(err){ toast('关闭失败：' + err.message); return null; });
  }
  function restart(){
    if (!view) return Promise.resolve(null);
    return api('POST','/api/rooms/' + encodeURIComponent(view.roomId) + '/restart',{ session:session, playerId:playerId })
      .then(function(v){ applyView(v); toast('重赛开始'); return v; })
      .catch(function(err){ toast('重赛失败：' + err.message); return null; });
  }
  function clearSession(){
    view = null; session = null; playerId = null; selected = null;
    try { sessionStorage.removeItem('lc-room'); } catch (err) {}
    stopPolling();
    $('roomPanel').hidden = true; $('gamePanel').hidden = true; $('resultPanel').hidden = true; $('lobby').hidden = false;
    $('lobbyMsg').textContent = '已离开房间。';
  }
  function refresh(){
    if (!view) return Promise.resolve(null);
    return api('GET','/api/rooms/' + encodeURIComponent(view.roomId) + '?session=' + encodeURIComponent(session) + '&playerId=' + encodeURIComponent(playerId))
      .then(function(v){ applyView(v); return v; })
      .catch(function(err){ if (err.status === 404) { toast('房间已关闭'); clearSession(); } return null; });
  }
  function startPolling(){
    stopPolling();
    pollTimer = setInterval(function(){ refresh(); }, 900);
  }
  function stopPolling(){ if (pollTimer) clearInterval(pollTimer); pollTimer = null; }
  function loadLeaderboard(){
    if (location.pathname.indexOf('/games/') === 0) return; // static site: no room API
    return api('GET','/api/leaderboard').then(function(data){
      var rows = data.entries || [];
      $('leaderboard').innerHTML = rows.length ? rows.map(function(row){
        var who = row.winnerName || (row.tied ? '共享胜利' : (row.scores[0] ? row.scores[0].name : '—'));
        return '<li><span>' + who + ' · ' + (row.roomCode || '') + '</span><span>第 ' + (row.rounds || 3) + ' 局 · <b>' + row.finishedAt.slice(0,10) + '</b></span></li>';
      }).join('') : '<li><span>暂无结果</span><span>—</span></li>';
      return rows;
    }).catch(function(){ return []; });
  }

  function playMove(move){
    if (!view || !session || busy) return Promise.resolve(null);
    if (!view.canMove) { toast(view.state && view.state.current === (view.you && view.you.playerIndex) ? 'AI 托管中，暂时不能操作' : '还没轮到你'); return Promise.resolve(null); }
    busy = true;
    return api('POST','/api/rooms/' + encodeURIComponent(view.roomId) + '/actions',{ session:session, playerId:playerId, type:'move', move:move })
      .then(function(v){ applyView(v); selected = null; return v; })
      .catch(function(err){ toast('动作失败：' + err.message); return refresh(); })
      .finally(function(){ busy = false; });
  }

  document.addEventListener('click', function(event){
    var card = event.target.closest('.card');
    if (card && !card.disabled) {
      var i = Number(card.getAttribute('data-hand'));
      selected = selected === i ? null : i;
      if (view && view.state) renderGame(view);
      return;
    }
    var act = event.target.closest('[data-act]');
    if (act && !act.disabled && view) {
      var color = act.getAttribute('data-color');
      if (view.state.phase === 'draw') {
        playMove({type:'draw',source:'discard',color:color});
      } else if (selected != null) {
        var local = view.state.players[view.you.playerIndex];
        var c = local.hand[selected];
        if (!c) return;
        if (act.getAttribute('data-act') === 'exp' && c.color === color) playMove({type:'play',handIndex:selected,cardId:c.id});
        else if (act.getAttribute('data-act') === 'pile') playMove({type:'discard',handIndex:selected,cardId:c.id});
        else toast('只能放入同色探险列');
      } else toast('先选择一张手牌');
      return;
    }
    var draw = event.target.closest('[data-draw]');
    if (draw && !draw.disabled && view && view.state.phase === 'draw') {
      if (draw.getAttribute('data-draw') === 'deck') playMove({type:'draw',source:'deck'});
      else playMove({type:'draw',source:'discard',color:draw.getAttribute('data-draw')});
    }
  });
  $('deckBtn').addEventListener('click', function(){ if (view && view.state.phase === 'draw') playMove({type:'draw',source:'deck'}); else toast('先打出一张牌'); });
  $('createBtn').addEventListener('click', createRoom);
  $('joinBtn').addEventListener('click', joinRoom);
  $('refreshLobbyBtn').addEventListener('click', loadLeaderboard);
  $('startBtn').addEventListener('click', startMatch);
  $('copyInviteBtn').addEventListener('click', function(){
    if (!view) return toast('先进入房间');
    var url = location.origin + location.pathname + '?room=' + encodeURIComponent(view.roomId) + '&invite=' + encodeURIComponent(view.inviteToken || view.inviteCode || '');
    var done = function(){ toast('邀请链接已复制'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function(){ toast(url); });
    else toast(url);
  });
  $('reconnectBtn').addEventListener('click', reconnect);
  $('reconnectRoomBtn').addEventListener('click', reconnect);
  $('leaveBtn').addEventListener('click', leave);
  $('closeRoomBtn').addEventListener('click', closeRoom);
  $('restartBtn').addEventListener('click', restart);
  $('backRoomBtn').addEventListener('click', function(){ $('resultPanel').hidden = true; });

  // Expose test API without replacing the page's normal behaviour.
  window.__lostcitiesOnline = Object.freeze({
    createRoom: createRoom, joinRoom: joinRoom, start: startMatch, reconnect: reconnect,
    restart: restart, leave: leave, closeRoom: closeRoom, poll: refresh,
    playMove: playMove,
    getState: function(){ return view && view.state ? clone(view.state) : null; },
    getView: function(){ return clone(view); },
    legalMoves: function(){ return view ? clone(view.legalMoves || []) : []; },
    isBusy: function(){ return !!busy; },
    winner: function(){ return view && view.state && view.state.result ? view.state.result.winner : null; },
    refreshLeaderboard: loadLeaderboard
  });

  loadLeaderboard();
  (function bootQuery(){
    try {
      var q = new URLSearchParams(location.search);
      var room = q.get('room');
      var token = q.get('session') || q.get('token');
      var invite = q.get('invite');
      var who = q.get('player');
      if (room && token) {
        playerId = who || name(); session = token;
        $('playerName').value = playerId;
        api('GET','/api/rooms/' + encodeURIComponent(room) + '?session=' + encodeURIComponent(token) + '&playerId=' + encodeURIComponent(playerId))
          .then(applyView).catch(function(){ toast('房间恢复失败，请输入房间号重连'); });
      } else if (room && invite) {
        joinRoomWith(room, invite, who || name());
      } else if (room) {
        $('joinCode').value = room;
        $('lobbyMsg').textContent = '房间号已填入，点击“加入房间”。';
      }
      if (session && view) { try { sessionStorage.setItem('lc-room', JSON.stringify({roomId:view.roomId,session:session,playerId:playerId})); } catch (e) {} }
    } catch (err) {}
  })();
  function joinRoomWith(room, invite, who){
    playerId = who;
    return api('POST','/api/rooms/' + encodeURIComponent(room) + '/join',{ playerId:who, inviteCode:invite })
      .then(function(v){ applyView(v); toast('已通过邀请加入'); return v; })
      .catch(function(err){ toast('邀请加入失败：' + err.message); return null; });
  }

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
