<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>行动代号 Codenames · 联机房间</title>
<meta name="description" content="行动代号 Codenames 联机房间：创建/加入房间、邀请码、密码房、AI 补位、断线重连、超时托管与结果榜。">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0c1020;--bg2:#101731;--panel:rgba(22,30,56,.9);--panel2:#1b2547;
  --ink:#f2f3f8;--muted:#a7b1d0;--line:rgba(141,161,220,.24);
  --red:#ea6a64;--red-soft:rgba(234,106,100,.16);--blue:#63a0ec;--blue-soft:rgba(99,160,236,.16);
  --neutral:#c3b087;--assassin:#16161d;--accent:#f4c95d;--good:#66d99a;--danger:#ff847c;
  --card:#202a4f;--card2:#17203e;--paper:url("../../assets/art/premium/codenames/card-paper.webp");
  --back:url("../../assets/art/premium/codenames/card-back.webp");--felt:url("../../assets/art/premium/codenames/table-felt.webp");
  --song:"Songti SC","STSong","SimSun",serif;
}
:root[data-theme="light"]{
  --bg:#f2f0e8;--bg2:#e7e3d8;--panel:rgba(255,255,255,.92);--panel2:#fffdf8;
  --ink:#1b2030;--muted:#5b6378;--line:rgba(43,54,86,.17);
  --red:#bf3d38;--red-soft:rgba(191,61,56,.11);--blue:#2f6fc4;--blue-soft:rgba(47,111,196,.11);
  --neutral:#8a7649;--accent:#a97709;--good:#1f8a52;--danger:#c22f2a;
  --card:#ffffff;--card2:#f0ece1;
}
@media (prefers-color-scheme:light){
  :root[data-theme="auto"]{
    --bg:#f2f0e8;--bg2:#e7e3d8;--panel:rgba(255,255,255,.92);--panel2:#fffdf8;
    --ink:#1b2030;--muted:#5b6378;--line:rgba(43,54,86,.17);
    --red:#bf3d38;--red-soft:rgba(191,61,56,.11);--blue:#2f6fc4;--blue-soft:rgba(47,111,196,.11);
    --neutral:#8a7649;--accent:#a97709;--good:#1f8a52;--danger:#c22f2a;
    --card:#ffffff;--card2:#f0ece1;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;overflow-x:hidden;color:var(--ink);
  background:radial-gradient(900px 520px at 50% -12%,var(--bg2),transparent 70%),var(--bg);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(24px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
button,select,input{font:inherit;color:inherit}
button{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:44px;padding:8px 13px;
  border-radius:11px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.55;cursor:default}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:980px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 2px 10px}
.brand h1{margin:0;font-family:var(--song);font-weight:700;font-size:1.4rem;letter-spacing:.06em}
.brand h1 span{display:block;font-size:.75rem;letter-spacing:.32em;color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.brand p{margin:6px 0 0;font-size:.78rem;color:var(--muted)}
.top-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.top-actions a{min-height:44px;display:inline-flex;align-items:center;padding:6px 10px;border:1px solid var(--line);
  border-radius:11px;background:var(--panel2);text-decoration:none;color:var(--ink);font-size:.8rem}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 14px 36px rgba(0,0,0,.22);
  padding:14px;margin:0 0 12px}
.panel h2{margin:0 0 10px;font-size:1.02rem;letter-spacing:.04em}
.lobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:720px){.lobby-grid{grid-template-columns:1fr}}
.form{display:grid;gap:8px}
.form label{font-size:.75rem;color:var(--muted);letter-spacing:.05em}
.form input,.form select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
  padding:8px 10px;width:100%;min-width:0}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .row3{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
@media (max-width:420px){.form .row,.form .row3{grid-template-columns:1fr}}
.hint{font-size:.75rem;color:var(--muted);margin:2px 0 0}
.error{color:var(--danger);font-size:.8rem;min-height:1.2em}
.btn-primary{background:var(--accent);color:#201a05;border-color:transparent;font-weight:800}
.btn-ghost{background:transparent}
.room-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px}
.room-code{font-family:ui-monospace,Menlo,monospace;font-size:1.15rem;letter-spacing:.12em;color:var(--accent);font-weight:800}
.room-meta{font-size:.78rem;color:var(--muted)}
.invite-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.invite-row code{font-family:ui-monospace,Menlo,monospace;background:var(--bg2);border:1px solid var(--line);
  padding:4px 8px;border-radius:8px;font-size:.78rem;word-break:break-all}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media (max-width:520px){.seats{grid-template-columns:1fr}}
.seat{border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--panel2);min-width:0}
.seat.red{border-color:rgba(234,106,100,.4)}.seat.blue{border-color:rgba(99,160,236,.42)}
.seat.current{box-shadow:0 0 0 2px var(--accent),0 0 20px rgba(244,201,93,.18)}
.seat.takeover{border-style:dashed;border-color:var(--danger)}
.seat-role{font-size:.75rem;letter-spacing:.1em;color:var(--muted);font-weight:700}
.seat-name{font-weight:650;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.badge{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted)}
.badge.ai{color:var(--accent);border-color:rgba(244,201,93,.4)}
.badge.takeover{color:var(--danger);border-color:rgba(255,132,124,.4)}
.badge.you{color:var(--good);border-color:rgba(102,217,154,.4)}
.room-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin:0 0 10px}
.team{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel2);min-width:0}
.team.red{background:linear-gradient(180deg,var(--red-soft),transparent 80%)}
.team.blue{background:linear-gradient(180deg,var(--blue-soft),transparent 80%)}
.team b{font-size:.76rem;color:var(--muted);letter-spacing:.08em}
.team strong{font-size:1.6rem;line-height:1.1;margin-left:6px}
.team span{font-size:.75rem;color:var(--muted);margin-left:4px}
.vs{display:flex;align-items:center;font-size:.75rem;color:var(--muted);font-weight:800}
.status{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:9px 11px;margin-bottom:8px}
.status .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status[data-team="red"] .dot{background:var(--red)}.status[data-team="blue"] .dot{background:var(--blue)}
.status .big{font-weight:700}
.status .phase{font-size:.76rem;color:var(--muted)}
.status .hint{width:100%;margin-top:4px}
.clue-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.clue-chip{border:1px solid var(--line);border-radius:9px;padding:4px 9px;background:var(--panel2);font-size:.84rem}
.clue-chip.red{border-color:rgba(234,106,100,.5);background:var(--red-soft)}
.clue-chip.blue{border-color:rgba(99,160,236,.5);background:var(--blue-soft)}
.clue-chip b{color:var(--accent)}
.clue-form{display:grid;grid-template-columns:minmax(0,1fr) 82px auto;gap:7px;margin:0 0 8px;
  padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.clue-form[hidden]{display:none}
.clue-form input,.clue-form select{min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);padding:7px 9px;min-width:0;width:100%}
.clue-form button{background:var(--accent);color:#201a05;border-color:transparent;font-weight:800}
@media (max-width:520px){.clue-form{grid-template-columns:minmax(0,1fr) 78px}.clue-form button{grid-column:1/-1;width:100%}}
.board-wrap{border:1px solid var(--line);border-radius:14px;padding:7px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 16% 6%,rgba(255,255,255,.12),transparent 40%),
    radial-gradient(circle at 88% 96%,rgba(0,0,0,.3),transparent 46%),
    var(--felt) center/145% 145% no-repeat,linear-gradient(160deg,#263159,#141b33)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;max-width:620px;margin:0 auto}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-width:0;min-height:58px;aspect-ratio:1/1.08;padding:4px 3px;border-radius:10px;overflow:hidden;
  border:1px solid rgba(255,255,255,.16);background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 38%),
    linear-gradient(315deg,rgba(0,0,0,.24),transparent 44%),linear-gradient(165deg,#fffdf7,#ece6d8);
  color:#1b1b1b;text-align:center;cursor:default}
.tile::before{content:"";position:absolute;inset:0;background:var(--paper) center/cover no-repeat;mix-blend-mode:multiply;opacity:.55}
.tile > *{position:relative;z-index:1}
.tile .word{font-family:var(--song);font-weight:700;font-size:clamp(.75rem,2.9vw,1rem);line-height:1.15;
  word-break:break-word;overflow-wrap:anywhere;max-width:100%}
.tile .role{font-size:.75rem;letter-spacing:.12em;font-weight:800;opacity:.85}
.tile .dot{width:7px;height:7px;border-radius:50%}
.tile.hidden{background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 38%),
  linear-gradient(315deg,rgba(0,0,0,.26),transparent 44%),linear-gradient(165deg,var(--card),var(--card2));color:var(--ink)}
.tile.hidden::before{opacity:.32;mix-blend-mode:overlay}
.tile.is-red{background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 38%),
  linear-gradient(315deg,rgba(0,0,0,.28),transparent 44%),linear-gradient(158deg,#d9544e,#8d2b28);color:#fff}
.tile.is-blue{background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 38%),
  linear-gradient(315deg,rgba(0,0,0,.28),transparent 44%),linear-gradient(158deg,#4b86d8,#274f8c);color:#fff}
.tile.is-neutral{background:linear-gradient(135deg,rgba(255,255,255,.24),transparent 38%),
  linear-gradient(315deg,rgba(0,0,0,.22),transparent 44%),linear-gradient(158deg,#b8a377,#7a6b4b);color:#221b0e}
.tile.is-assassin{background:linear-gradient(135deg,rgba(255,255,255,.1),transparent 38%),
  linear-gradient(315deg,rgba(0,0,0,.34),transparent 44%),linear-gradient(158deg,#24242e,#08080c);color:#fff}
.tile.is-red::before,.tile.is-blue::before,.tile.is-neutral::before,.tile.is-assassin::before{
  background:var(--back) center/cover no-repeat;mix-blend-mode:soft-light;opacity:.32}
.tile.clickable{cursor:pointer}
.tile.clickable:active{transform:scale(.98)}
.tile .dot-red{background:var(--red);box-shadow:0 0 6px var(--red)}
.tile .dot-blue{background:var(--blue);box-shadow:0 0 6px var(--blue)}
.tile .dot-neutral{background:var(--neutral)}
.tile .dot-assassin{background:#fff;box-shadow:0 0 6px #fff}
.board[data-key="false"] .tile:not(.revealed) .dot{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.log{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:.76rem;color:var(--muted)}
.log div{padding-left:12px;position:relative;line-height:1.5}
.log div::before{content:"";position:absolute;left:2px;top:.6em;width:4px;height:4px;border-radius:50%;background:var(--line)}
.log div:first-child{color:var(--ink)}
.leaderboard{display:grid;gap:5px}
.lb-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:.8rem;
  border-top:1px solid var(--line);padding:6px 0}
.lb-row:first-child{border-top:0}
.lb-rank{color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}
.lb-meta{color:var(--muted);font-size:.75rem}
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;
  background:rgba(5,8,18,.66);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.overlay[hidden]{display:none}
.banner{width:min(440px,100%);border-radius:20px;padding:22px 18px;text-align:center;
  background:var(--panel2);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.4)}
.banner h2{margin:4px 0;font-family:var(--song);font-size:1.7rem;letter-spacing:.06em}
.banner p{color:var(--muted);font-size:.86rem;margin:6px 0}
.banner .banner-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
  font-size:.8rem;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:70;max-width:calc(100% - 24px)}
.toast[hidden]{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media (max-width:420px){.app{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
  .top{padding-top:10px}.brand h1{font-size:1.18rem}.brand p{display:none}
  .panel{padding:10px}.scoreboard{gap:5px}.team strong{font-size:1.35rem}}
@media (max-height:520px) and (orientation:landscape){
  .top{padding:6px 2px}.brand p{display:none}.board{max-width:min(72vh,520px)}
  .lobby-grid{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>行动代号<span>CODENAMES · ONLINE</span></h1>
      <p>房间 · 邀请 · AI 补位 · 断线重连 · 超时托管 · 结果榜</p>
    </div>
    <div class="top-actions">
      <a href="/">单人模式</a>
      <a href="/rules.html">中文规则</a>
      <a href="/detail.html">详情</a>
    </div>
  </header>

  <section id="lobby" class="panel">
    <h2>联机大厅</h2>
    <div class="lobby-grid">
      <form id="createForm" class="form" autocomplete="off">
        <strong>创建房间</strong>
        <label for="createNick">昵称</label>
        <input id="createNick" maxlength="20" placeholder="例如：红队队长" required>
        <div class="row">
          <div><label for="createPassword">密码（可选，4–64 位）</label><input id="createPassword" type="password" minlength="4" maxlength="64" placeholder="留空为公开房"></div>
          <div><label for="createVisibility">可见性</label><select id="createVisibility"><option value="public">公开</option><option value="private">私有</option></select></div>
        </div>
        <button type="submit" class="btn-primary">创建房间</button>
        <div class="error" id="createError" role="alert"></div>
        <p class="hint">4 个座位：红队队长 / 红队队员 / 蓝队队长 / 蓝队队员。空位由 AI 补足，规则不简化。</p>
      </form>
      <form id="joinForm" class="form" autocomplete="off">
        <strong>加入房间</strong>
        <label for="joinRoom">房间号或邀请链接</label>
        <input id="joinRoom" maxlength="200" placeholder="邀请链接或房间号" required>
        <label for="joinNick">昵称</label>
        <input id="joinNick" maxlength="20" placeholder="例如：蓝队队员" required>
        <div class="row">
          <div><label for="joinPassword">密码（如有）</label><input id="joinPassword" type="password" maxlength="64" aria-label="密码（如有）"></div>
          <div><label for="joinInvite">邀请 token（可选）</label><input id="joinInvite" maxlength="40" placeholder="邀请链接自带"></div>
        </div>
        <button type="submit" class="btn-primary">加入房间</button>
        <div class="error" id="joinError" role="alert"></div>
      </form>
    </div>
  </section>

  <section id="roomPanel" class="panel" hidden>
    <div class="room-head">
      <div>
        <div class="room-meta">房间号</div>
        <div class="room-code" id="roomCode">—</div>
        <div class="room-meta" id="roomStatus">等待玩家</div>
      </div>
      <div class="invite-row">
        <span class="room-meta">邀请码</span><code id="inviteCode">—</code>
        <button type="button" id="copyInvite">复制邀请链接</button>
      </div>
    </div>
    <div class="seats" id="seats" aria-label="座位"></div>
    <div class="room-actions">
      <button type="button" id="startBtn" class="btn-primary" hidden>开始对局（空位 AI 补足）</button>
      <button type="button" id="leaveBtn" class="btn-ghost">离开房间</button>
      <button type="button" id="closeBtn" class="btn-ghost" hidden>关闭房间</button>
    </div>
    <p class="hint" id="roomHint"></p>
  </section>

  <section id="gamePanel" hidden>
    <div class="scoreboard" aria-label="双方进度">
      <div class="team red"><b>红队</b><strong id="redScore">0</strong><span id="redLeft">/ 9 · 剩 9</span></div>
      <div class="vs" aria-hidden="true">VS</div>
      <div class="team blue"><b>蓝队</b><strong id="blueScore">0</strong><span id="blueLeft">/ 8 · 剩 8</span></div>
    </div>
    <div class="status" id="status" data-team="red" aria-live="polite">
      <div class="line"><span class="dot"></span><span class="big" id="turnLabel">等待开始</span><span class="phase" id="phaseLabel"></span></div>
      <div class="clue-row" id="clueRow" hidden><span class="clue-chip" id="clueChip"></span></div>
      <div class="hint" id="statusHint"></div>
    </div>
    <form class="clue-form" id="clueForm" autocomplete="off" hidden>
      <input id="clueText" maxlength="12" placeholder="线索词（1–12 字）" aria-label="线索词" required>
      <select id="clueCount" aria-label="线索数字"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select>
      <button type="submit">给出线索</button>
    </form>
    <div class="board-wrap"><div class="board" id="board" data-key="false" role="grid" aria-label="25 张行动代号词卡"></div></div>
    <div class="actions">
      <button type="button" id="passBtn" hidden>结束猜词</button>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
  </section>

  <section class="panel" id="leaderboardPanel">
    <h2>结果榜</h2>
    <div class="leaderboard" id="leaderboard" aria-live="polite"><p class="hint">服务器内存榜；完成一局后入榜。</p></div>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="banner" role="dialog" aria-modal="true" aria-labelledby="bannerTitle">
    <h2 id="bannerTitle">对局结束</h2>
    <p id="bannerText"></p>
    <div class="banner-actions">
      <button type="button" id="restartBtn" class="btn-primary" hidden>再来一局</button>
      <button type="button" id="backBtn">返回房间</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  window.__pageErrors = [];
  window.addEventListener('error', function (ev) {
    window.__pageErrors.push(String(ev.message || 'error'));
  });
  window.addEventListener('unhandledrejection', function (ev) {
    window.__pageErrors.push('unhandledrejection: ' + String(ev.reason && ev.reason.message || ev.reason));
  });
  var STORAGE_KEY = 'codenames.online.session.v1';
  var SEATS = [
    { index: 0, team: 'red', role: 'captain' },
    { index: 1, team: 'red', role: 'operative' },
    { index: 2, team: 'blue', role: 'captain' },
    { index: 3, team: 'blue', role: 'operative' }
  ];
  var TEAM = { red: '红队', blue: '蓝队' };
  var ROLE = { captain: '队长', operative: '队员' };
  var state = { session: null, view: null, poll: null, busy: false, lastBoardKey: '' };
  var $ = function (id) { return document.getElementById(id); };
  var els = {
    lobby: $('lobby'), roomPanel: $('roomPanel'), gamePanel: $('gamePanel'),
    createForm: $('createForm'), joinForm: $('joinForm'),
    createNick: $('createNick'), createPassword: $('createPassword'), createVisibility: $('createVisibility'),
    createError: $('createError'),
    joinRoom: $('joinRoom'), joinNick: $('joinNick'), joinPassword: $('joinPassword'), joinInvite: $('joinInvite'),
    joinError: $('joinError'),
    roomCode: $('roomCode'), roomStatus: $('roomStatus'), inviteCode: $('inviteCode'),
    copyInvite: $('copyInvite'), seats: $('seats'), startBtn: $('startBtn'), leaveBtn: $('leaveBtn'), closeBtn: $('closeBtn'),
    roomHint: $('roomHint'),
    redScore: $('redScore'), blueScore: $('blueScore'), redLeft: $('redLeft'), blueLeft: $('blueLeft'),
    status: $('status'), turnLabel: $('turnLabel'), phaseLabel: $('phaseLabel'),
    clueRow: $('clueRow'), clueChip: $('clueChip'), statusHint: $('statusHint'),
    clueForm: $('clueForm'), clueText: $('clueText'), clueCount: $('clueCount'),
    board: $('board'), passBtn: $('passBtn'), log: $('log'),
    leaderboard: $('leaderboard'), overlay: $('overlay'), bannerTitle: $('bannerTitle'),
    bannerText: $('bannerText'), restartBtn: $('restartBtn'), backBtn: $('backBtn'), toast: $('toast')
  };

  function newPlayerId() { return 'cn_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function loadSession() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (s && s.roomId && s.playerId && s.token) return s;
    } catch (err) {}
    return null;
  }
  function saveSession(s) {
    state.session = s;
    try {
      if (s) localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
      else localStorage.removeItem(STORAGE_KEY);
    } catch (err) {}
  }
  function toast(text) {
    els.toast.textContent = text;
    els.toast.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { els.toast.hidden = true; }, 2400);
  }
  // Online API origin. Default: same origin. Override once with ?api=https://...,
  // then it is remembered in localStorage ('games-online-api'; ?api= clears it).
  var API_BASE = (function () {
    try {
      var qp = new URLSearchParams(location.search);
      if (qp.has('api')) {
        var q = String(qp.get('api') || '').replace(/\/+$/, '');
        try { q ? localStorage.setItem('games-online-api', q) : localStorage.removeItem('games-online-api'); } catch (e) {}
        return q;
      }
      var saved = null;
      try { saved = localStorage.getItem('games-online-api'); } catch (e) {}
      return String(saved || window.GAMES_ONLINE_API || '').replace(/\/+$/, '');
    } catch (e) { return ''; }
  })();
  function apiUrl(path) { return API_BASE ? API_BASE + path : path; }
  function inviteSuffix() { return API_BASE ? '&api=' + encodeURIComponent(API_BASE) : ''; }
  async function api(method, path, body) {
    var res = await fetch(apiUrl(path), {
      method: method,
      headers: { 'content-type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
      cache: 'no-store'
    });
    var data = null;
    try { data = await res.json(); } catch (err) { data = null; }
    if (!res.ok || !data || data.ok === false) {
      var message = data && data.error && data.error.message ? data.error.message : ('HTTP ' + res.status);
      var error = new Error(message);
      error.status = res.status;
      error.code = data && data.error && data.error.code;
      throw error;
    }
    return data;
  }
  function clearSession() {
    saveSession(null);
    state.view = null;
    state.lastBoardKey = '';
    if (state.poll) { clearInterval(state.poll); state.poll = null; }
    els.lobby.hidden = false;
    els.roomPanel.hidden = true;
    els.gamePanel.hidden = true;
    els.overlay.hidden = true;
  }
  function showLobby() {
    els.lobby.hidden = false;
    els.roomPanel.hidden = true;
    els.gamePanel.hidden = true;
  }
  function sessionBody(extra) {
    var body = Object.assign({}, extra || {});
    if (state.session) body.session = state.session.token;
    return body;
  }
  function currentSeat(view) {
    if (!view || !view.seats) return null;
    for (var i = 0; i < view.seats.length; i += 1) if (view.seats[i].isYou) return view.seats[i];
    return null;
  }
  function isHost(view) { var seat = currentSeat(view); return !!(seat && seat.isHost); }
  function seatMeta(index) {
    for (var i = 0; i < SEATS.length; i += 1) if (SEATS[i].index === index) return SEATS[i];
    return null;
  }
  function roleLabel(index) {
    var meta = seatMeta(index);
    return meta ? TEAM[meta.team] + ROLE[meta.role] : '';
  }

  async function poll() {
    if (!state.session || state.busy) return;
    state.busy = true;
    var roomId = state.session.roomId;
    var token = state.session.token;
    try {
      var view = await api('GET', '/api/rooms/' + encodeURIComponent(roomId) +
        '?session=' + encodeURIComponent(token));
      state.view = view;
      render(view);
    } catch (err) {
      if (err.status === 401 || err.status === 403) {
        try {
          var rec = await api('POST', '/api/rooms/' + encodeURIComponent(roomId) + '/reconnect', { session: token });
          state.view = rec;
          render(rec);
        } catch (err2) {
          toast('会话已失效，请重新加入房间');
          clearSession();
          loadLeaderboard();
        }
      } else if (err.status === 404) {
        toast('房间已关闭');
        clearSession();
        loadLeaderboard();
      }
    } finally {
      state.busy = false;
    }
  }
  function startPolling() {
    if (state.poll) clearInterval(state.poll);
    state.poll = setInterval(poll, 650);
    poll();
  }

  function enterRoom(view, session) {
    if (session) saveSession(session);
    els.lobby.hidden = true;
    els.roomPanel.hidden = false;
    els.gamePanel.hidden = false;
    state.view = view;
    render(view);
    startPolling();
  }

  function createInviteLink(view) {
    return location.origin + location.pathname + '?room=' + encodeURIComponent(view.roomId) +
      '&invite=' + encodeURIComponent(view.inviteToken || view.inviteCode || '') + inviteSuffix();
  }

  function renderSeats(view) {
    els.seats.innerHTML = '';
    var takeover = view.takeover || [];
    (view.seats || []).forEach(function (seat) {
      var meta = seatMeta(seat.index);
      var team = meta ? meta.team : 'red';
      var role = meta ? meta.role : 'operative';
      var div = document.createElement('div');
      div.className = 'seat ' + team + (seat.isYou ? ' current' : '') + (takeover.indexOf(seat.index) !== -1 ? ' takeover' : '');
      var badges = '';
      if (seat.isYou) badges += '<span class="badge you">你</span>';
      if (seat.ai) badges += '<span class="badge ai">AI</span>';
      if (takeover.indexOf(seat.index) !== -1) badges += '<span class="badge takeover">托管中</span>';
      if (seat.isHost) badges += '<span class="badge">房主</span>';
      div.innerHTML = '<div class="seat-role">' + TEAM[team] + ROLE[role] + '</div>' +
        '<div class="seat-name">' + (seat.ai ? 'AI' : escapeHtml(seat.name || '—')) + '</div>' +
        '<div class="seat-badges">' + badges + '</div>';
      els.seats.appendChild(div);
    });
  }
  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function ensureBoard(words) {
    var key = words.map(function (w) { return w.text; }).join('|');
    if (key === state.lastBoardKey) return;
    state.lastBoardKey = key;
    els.board.innerHTML = '';
    words.forEach(function (w, index) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tile';
      b.dataset.index = String(index);
      b.innerHTML = '<span class="dot"></span><span class="word"></span><span class="role"></span>';
      b.addEventListener('click', function () { onGuess(index); });
      els.board.appendChild(b);
    });
  }
  function updateBoard(view) {
    var game = view.state;
    if (!game || !game.words) return;
    ensureBoard(game.words);
    var keyVisible = Boolean(game.keyVisible);
    els.board.dataset.key = keyVisible ? 'true' : 'false';
    var tiles = els.board.querySelectorAll('.tile');
    game.words.forEach(function (w, index) {
      var tile = tiles[index];
      if (!tile) return;
      var revealed = w.revealed;
      tile.className = 'tile ' + (revealed ? 'is-' + w.color + ' revealed' : 'hidden') +
        (game.canGuess && !revealed ? ' clickable' : '');
      tile.querySelector('.word').textContent = w.text;
      tile.querySelector('.role').textContent = revealed ? (w.role || '') : '';
      var dot = tile.querySelector('.dot');
      dot.className = 'dot' + (keyVisible ? ' dot-' + w.color : '');
      var colorLabel = w.color === 'red' ? '红队' : w.color === 'blue' ? '蓝队' :
        w.color === 'neutral' ? '平民' : '刺客';
      var aria = '词卡 ' + w.text + (revealed ? '，' + (w.role || '') + '，已翻开' :
        (keyVisible ? '，' + colorLabel : '，未翻开'));
      tile.setAttribute('aria-label', aria);
      tile.setAttribute('aria-disabled', game.canGuess && !revealed ? 'false' : 'true');
    });
  }

  function render(view) {
    els.lobby.hidden = true;
    els.roomPanel.hidden = false;
    els.gamePanel.hidden = !view.started;
    els.roomCode.textContent = view.code || view.roomId;
    els.roomStatus.textContent = !view.started ? '等待玩家' :
      (view.over ? '对局已结束' : '对局进行中');
    els.inviteCode.textContent = view.inviteCode || '—';
    els.copyInvite.disabled = !view.inviteCode;
    var host = isHost(view);
    els.startBtn.hidden = !(host && !view.started);
    els.closeBtn.hidden = !host;
    els.roomHint.textContent = view.started ? '对局已开始；断线后可用同一浏览器会话重连，超时由 AI 托管。' :
      '至少 2 名真人即可开始；空位自动由 AI 补足，AI 使用同一套线索/猜词/刺客规则。';
    renderSeats(view);

    if (!view.started) {
      els.gamePanel.hidden = true;
      return;
    }
    var game = view.state;
    if (!game) return;
    var yourIndex = view.you == null ? null : view.you;
    var yourMeta = seatMeta(yourIndex);
    els.redScore.textContent = String(game.scores.red);
    els.blueScore.textContent = String(game.scores.blue);
    els.redLeft.textContent = '/ 9 · 剩 ' + game.remaining.red;
    els.blueLeft.textContent = '/ 8 · 剩 ' + game.remaining.blue;
    els.status.dataset.team = game.turn || 'red';
    els.turnLabel.textContent = game.phase === 'over' ? (TEAM[game.winner] || '') + '获胜' :
      (TEAM[game.turn] || '') + '回合';
    els.phaseLabel.textContent = game.phase === 'over' ? '对局结束' :
      game.phase === 'clue' ? '线索阶段' : '猜词阶段';
    if (game.clue) {
      els.clueRow.hidden = false;
      els.clueChip.className = 'clue-chip ' + game.clue.team;
      els.clueChip.innerHTML = '<b>' + escapeHtml(game.clue.text) + '</b> · ' + game.clue.count;
    } else {
      els.clueRow.hidden = true;
    }
    var your = yourMeta ? (TEAM[yourMeta.team] + ROLE[yourMeta.role]) : '观战';
    var hint;
    if (game.phase === 'over') hint = '对局结束。';
    else if (game.currentSeatIsAI) hint = 'AI 正在行动（' + (game.currentSeatLabel || '') + '）。';
    else if (game.canClue) hint = '你是' + your + '：给出一个线索词和数字。';
    else if (game.canGuess) hint = '你是' + your + '：根据线索点击词卡；至少猜一次后可结束猜词。';
    else hint = '你是' + your + '；当前由' + (game.currentSeatLabel || '其他座位') + '行动。';
    if (yourIndex != null && (view.takeover || []).indexOf(yourIndex) !== -1) {
      hint += ' 你的座位已超时托管，继续操作或重连即可恢复。';
    }
    els.statusHint.textContent = hint;
    els.clueForm.hidden = !game.canClue;
    if (game.canClue && game.suggestedClue && !els.clueText.value) {
      els.clueText.placeholder = '建议：' + game.suggestedClue.text;
    }
    els.passBtn.hidden = !game.canPass;
    updateBoard(view);
    renderLog(game);
    if (game.phase === 'over') showResult(view); else hideResult(view);
  }

  function renderLog(game) {
    var lines = game.log || [];
    var key = lines.join('|');
    if (key === renderLog.last) return;
    renderLog.last = key;
    els.log.innerHTML = '';
    lines.slice(-8).reverse().forEach(function (text) {
      var div = document.createElement('div');
      div.textContent = text;
      els.log.appendChild(div);
    });
  }
  function showResult(view) {
    var game = view.state;
    els.overlay.hidden = false;
    els.bannerTitle.textContent = (TEAM[game.winner] || '') + '获胜';
    els.bannerText.textContent = '比分 红 ' + game.scores.red + ' · 蓝 ' + game.scores.blue +
      '；第 ' + game.turnNo + ' 回合结束。结果已写入结果榜。';
    els.restartBtn.hidden = !view.canRestart;
  }
  function hideResult() { els.overlay.hidden = true; }

  function renderLeaderboard(entries) {
    els.leaderboard.innerHTML = '';
    if (!entries || !entries.length) {
      els.leaderboard.innerHTML = '<p class="hint">服务器内存榜；完成一局后入榜。</p>';
      return;
    }
    entries.slice(0, 10).forEach(function (entry, index) {
      var row = document.createElement('div');
      row.className = 'lb-row';
      var when = entry.at ? new Date(entry.at).toLocaleString() : '';
      row.innerHTML = '<span class="lb-rank">' + (index + 1) + '</span>' +
        '<span><b>' + escapeHtml(entry.name || ('座位 ' + (entry.seat + 1))) + '</b>' +
        (entry.winner ? ' · 胜方' : '') + (entry.ai ? ' · AI' : '') +
        '<br><span class="lb-meta">' + when + '</span></span>' +
        '<span class="lb-meta">' + (entry.score == null ? '—' : entry.score) + '</span>';
      els.leaderboard.appendChild(row);
    });
  }
  async function loadLeaderboard() {
    if (!API_BASE && location.pathname.indexOf('/games/') === 0) return; // static site: no room API
    try {
      var data = await api('GET', '/api/leaderboard?game=codenames&limit=10');
      renderLeaderboard(data.entries || []);
    } catch (err) { /* offline lobby: keep the placeholder */ }
  }

  async function onCreate(ev) {
    ev.preventDefault();
    els.createError.textContent = '';
    var nick = els.createNick.value.trim();
    if (!nick) { els.createError.textContent = '请输入昵称'; return; }
    try {
      var view = await api('POST', '/api/rooms', {
        game: 'codenames-premium',
        playerId: newPlayerId(),
        nickname: nick,
        password: els.createPassword.value || undefined,
        visibility: els.createVisibility.value
      });
      saveSession({ roomId: view.roomId, playerId: view.playerId, token: view.session });
      toast('房间已创建');
      enterRoom(view, state.session);
    } catch (err) { els.createError.textContent = err.message; }
  }
  function parseJoinInput(raw) {
    var text = (raw || '').trim();
    if (!text) return null;
    if (/^https?:\/\//i.test(text) || text.indexOf('?') !== -1) {
      try {
        var u = new URL(text, location.href);
        var room = u.searchParams.get('room');
        if (room) return { room: room, invite: u.searchParams.get('invite') || u.searchParams.get('code') || '' };
      } catch (err) {}
    }
    return { room: text, invite: els.joinInvite.value.trim() || '' };
  }
  async function onJoin(ev) {
    ev.preventDefault();
    els.joinError.textContent = '';
    var parsed = parseJoinInput(els.joinRoom.value);
    var nick = els.joinNick.value.trim();
    if (!parsed || !parsed.room || !nick) { els.joinError.textContent = '请填写房间号与昵称'; return; }
    try {
      var view = await api('POST', '/api/rooms/' + encodeURIComponent(parsed.room) + '/join', {
        playerId: newPlayerId(),
        nickname: nick,
        password: els.joinPassword.value || undefined,
        inviteCode: parsed.invite || undefined
      });
      saveSession({ roomId: view.roomId, playerId: view.playerId, token: view.session });
      toast('已加入房间');
      enterRoom(view, state.session);
    } catch (err) { els.joinError.textContent = err.message; }
  }
  async function onStart() {
    var view = state.view;
    if (!view) return;
    try {
      var next = await api('POST', '/api/rooms/' + encodeURIComponent(view.roomId) + '/start', sessionBody());
      state.view = next; render(next); toast('对局开始');
    } catch (err) { toast(err.message); }
  }
  async function onLeave() {
    try {
      await api('POST', '/api/rooms/' + encodeURIComponent(state.session.roomId) + '/leave', sessionBody());
    } catch (err) {}
    clearSession();
    showLobby();
    loadLeaderboard();
  }
  async function onClose() {
    try {
      await api('DELETE', '/api/rooms/' + encodeURIComponent(state.session.roomId) +
        '?session=' + encodeURIComponent(state.session.token));
    } catch (err) {}
    clearSession();
    showLobby();
    loadLeaderboard();
  }
  async function sendAction(action) {
    var view = state.view;
    if (!view || !view.state) return;
    try {
      var next = await api('POST', '/api/rooms/' + encodeURIComponent(view.roomId) + '/actions',
        sessionBody({ action: action }));
      state.view = next; render(next);
    } catch (err) { toast(err.message); }
  }
  function onClue(ev) {
    ev.preventDefault();
    var game = state.view && state.view.state;
    if (!game || !game.canClue) return;
    sendAction({ type: 'clue', text: els.clueText.value.trim(), count: Number(els.clueCount.value) });
    els.clueText.value = '';
  }
  function onGuess(index) {
    var game = state.view && state.view.state;
    if (!game || !game.canGuess) return;
    if (game.words[index] && game.words[index].revealed) return;
    sendAction({ type: 'guess', index: index });
  }
  function onPass() {
    var game = state.view && state.view.state;
    if (!game || !game.canPass) return;
    sendAction({ type: 'pass' });
  }
  async function onRestart() {
    var view = state.view;
    if (!view) return;
    try {
      var next = await api('POST', '/api/rooms/' + encodeURIComponent(view.roomId) + '/restart', sessionBody());
      state.view = next; hideResult(); render(next); toast('新对局开始');
    } catch (err) { toast(err.message); }
  }
  async function onCopyInvite() {
    if (!state.view) return;
    var link = createInviteLink(state.view);
    try {
      await navigator.clipboard.writeText(link);
      toast('邀请链接已复制');
    } catch (err) {
      var ta = document.createElement('textarea');
      ta.value = link; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('邀请链接已复制'); }
      catch (e2) { toast('复制失败，请手动复制：' + link); }
      document.body.removeChild(ta);
    }
  }

  async function reconnect() {
    if (new URLSearchParams(location.search).get('smoke')) {
      clearSession();
      showLobby();
      loadLeaderboard();
      return;
    }
    var saved = loadSession();
    if (!saved) { showLobby(); loadLeaderboard(); return; }
    try {
      var view = await api('POST', '/api/rooms/' + encodeURIComponent(saved.roomId) + '/reconnect', {
        session: saved.token
      });
      state.session = saved;
      enterRoom(view, saved);
      toast('已恢复上次房间');
    } catch (err) {
      clearSession();
      showLobby();
      loadLeaderboard();
    }
  }

  els.createForm.addEventListener('submit', onCreate);
  els.joinForm.addEventListener('submit', onJoin);
  els.startBtn.addEventListener('click', onStart);
  els.leaveBtn.addEventListener('click', onLeave);
  els.closeBtn.addEventListener('click', onClose);
  els.clueForm.addEventListener('submit', onClue);
  els.passBtn.addEventListener('click', onPass);
  els.restartBtn.addEventListener('click', onRestart);
  els.copyInvite.addEventListener('click', onCopyInvite);
  els.backBtn.addEventListener('click', hideResult);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.session) poll();
  });

  var params = new URLSearchParams(location.search);
  if (params.get('room')) {
    els.joinRoom.value = params.get('room');
    els.joinInvite.value = params.get('invite') || params.get('code') || '';
    var lastNick = '';
    try { lastNick = localStorage.getItem('codenames.online.nick') || ''; } catch (err) {}
    els.joinNick.value = lastNick;
  }
  els.joinNick.addEventListener('change', function () {
    try { localStorage.setItem('codenames.online.nick', els.joinNick.value.trim()); } catch (err) {}
  });
  els.createNick.addEventListener('change', function () {
    try { localStorage.setItem('codenames.online.nick', els.createNick.value.trim()); } catch (err) {}
  });
  reconnect();

  window.__codenamesOnline = {
    getView: function () { return state.view; },
    getSession: function () { return state.session; },
    poll: poll,
    api: api
  };
}());
</script>
<p style="text-align:center;margin:14px 0"><a href="../spectate.html" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1px solid currentColor;color:inherit;font-size:13px;text-decoration:none">围观其他对局</a></p>
</body>
