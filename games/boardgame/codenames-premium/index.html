*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

.board-wrap{border:1px solid var(--line);border-radius:16px;padding:8px;position:relative;overflow:hidden;

.board-wrap::before{content:"";position:absolute;inset:-3%;z-index:0;pointer-events:none;

.board{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-width:620px;margin:0 auto}
.tile{position:relative;display:block;min-width:0;min-height:58px;aspect-ratio:1/1.08;padding:0;border:0;background:transparent;

.face{position:absolute;inset:0;border-radius:12px;display:flex;flex-direction:column;

.face::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;

.face.front::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;

.face.back::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;

.face > *{position:relative;z-index:1}
.face.front{background:

.tile[data-key="red"] .face.front{border-color:rgba(234,106,100,.6);box-shadow:inset 0 0 0 1px rgba(234,106,100,.38)}
.tile[data-key="blue"] .face.front{border-color:rgba(99,160,236,.62);box-shadow:inset 0 0 0 1px rgba(99,160,236,.4)}
.tile[data-key="neutral"] .face.front{border-color:rgba(195,176,135,.55)}
.tile[data-key="assassin"] .face.front{border-color:rgba(255,255,255,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.tile[data-color="red"] .face.back{background:

.tile[data-color="blue"] .face.back{background:

.tile[data-color="neutral"] .face.back{background:

.tile[data-color="assassin"] .face.back{background:

.key-dot{display:block;width:8px;height:8px;border-radius:50%;background:var(--muted);

<div class="app" id="app">

(function () {

  window.__pageErrors = [];

    redBar: $('redBar'), blueBar: $('blueBar'),
    redTeam: $('redTeam'), blueTeam: $('blueTeam'),
    status: $('status'), turnLabel: $('turnLabel'), phaseLabel: $('phaseLabel'),
    thinking: $('thinking'), hint: $('hint'),
    clueChip: $('clueChip'), clueTeam: $('clueTeam'), clueTextShow: $('clueTextShow'),
    clueNumShow: $('clueNumShow'), clueGuesses: $('clueGuesses'), clueEmpty: $('clueEmpty'),
    clueForm: $('clueForm'), clueText: $('clueText'), clueCount: $('clueCount'),
    passBtn: $('passBtn'), againBtn: $('againBtn'),
    logList: $('logList'), turnCounter: $('turnCounter'),
    modeCaptain: $('modeCaptain'), modeOperative: $('modeOperative'),
    viewBtn: $('viewBtn'), newBtn: $('newBtn'), soundBtn: $('soundBtn'), themeBtn: $('themeBtn'),

  /* ---------------------------------------------------------------- sound */

  var SFX = window.Sfx || {
    play: function () { return false; },
    mute: function () { return false; },
    isMuted: function () { return false; },
    stats: function () { return { contextState: 'none' }; }

  var SOUND_MAP = {

  function playSound(name) {

  function unlockAudio() { SFX.play('click'); }

  if (!soundOn) {

  /* ---------------------------------------------------------------- board */
  function roleText(color) { return TEAM_TEXT[color] || ''; }

  function buildBoard() {
    var t0 = window.performance ? performance.now() : 0;
    board.innerHTML = '';
    tiles = [];
    for (var i = 0; i < 25; i++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tile';
      b.dataset.index = String(i);
      b.tabIndex = i === 0 ? 0 : -1;
      b.innerHTML =
        '<span class="card-inner">' +
          '<span class="face front">' +
            '<span class="key-dot" aria-hidden="true"></span>' +
            '<span class="tile-word"></span>' +
          '</span>' +
          '<span class="face back">' +
            '<svg class="role-icon" aria-hidden="true"><use href="#icon-diamond"></use></svg>' +
            '<span class="back-role"></span>' +
            '<span class="tile-word"></span>' +
            '<span class="back-sheen" aria-hidden="true"></span>' +
          '</span>' +
        '</span>';
      b.addEventListener('click', onTileClick);
      tiles.push(b);
      board.appendChild(b);
    }
    if (window.performance) perf.board = performance.now() - t0;
  }

  function isHumanGuessPhase() {
    return !!state && !E.isOver(state) && state.mode === 'operative' &&
      state.turn === 'red' && state.phase === 'guess';
  }

  function isHumanCluePhase() {
    return !!state && !E.isOver(state) && state.mode === 'captain' &&
      state.turn === 'red' && state.phase === 'clue';
  }

  function updateBoard(view, showKey) {
    board.dataset.view = showKey ? 'captain' : 'operative';
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      var v = view.words[i];
      var revealed = v.revealed || view.phase === 'over';
      var clickable = isHumanGuessPhase() && !v.revealed;
      t.classList.toggle('revealed', revealed);
      t.classList.toggle('clickable', clickable);
      t.setAttribute('aria-disabled', clickable ? 'false' : 'true');
      t.dataset.key = (showKey || view.phase === 'over') ? v.color : 'hidden';
      t.dataset.color = revealed ? v.color : 'hidden';
      t.style.setProperty('--reveal-delay', (view.phase === 'over' && !v.revealed ? (i * 26) + 'ms' : '0ms'));
      t.querySelector('.front .tile-word').textContent = v.text;
      t.querySelector('.back .tile-word').textContent = v.text;
      t.querySelector('.back-role').textContent = revealed ? roleText(v.color) : '';
      var use = t.querySelector('.back .role-icon use');
      if (use) {
        use.setAttribute('href', v.color === 'assassin' ? '#icon-skull'
          : v.color === 'neutral' ? '#icon-diamond' : '#icon-flag');
      }
      var label;
      if (v.revealed) label = '词卡 ' + v.text + '，' + roleText(v.color) + '，已翻开';
      else if (showKey) label = '词卡 ' + v.text + '，' + roleText(v.color) + '，未翻开';
      else label = '词卡 ' + v.text + '，未翻开';
      t.setAttribute('aria-label', label);
    }
  }

  function onTileClick(ev) {
    var tile = ev.currentTarget;
    var index = Number(tile.dataset.index);
    if (!isHumanGuessPhase()) return;
    if (state.words[index].revealed) return;
    var res = E.applyAction(state, { type: 'guess', index: index });
    if (!res.ok) { flashError(res.error); return; }
    handleEvents(res.events);
    render();
    if (!E.isOver(state) && !E.needsHuman(state)) scheduleAI();
  }

  /* --------------------------------------------------------------- status */
  function updateScores(view) {
    el.redScore.textContent = String(view.scores.red);
    el.blueScore.textContent = String(view.scores.blue);
    el.redLeft.textContent = '剩 ' + view.remaining.red;
    el.blueLeft.textContent = '剩 ' + view.remaining.blue;
    el.redBar.style.width = Math.round(view.scores.red / view.target.red * 100) + '%';
    el.blueBar.style.width = Math.round(view.scores.blue / view.target.blue * 100) + '%';
    el.redTeam.classList.toggle('active', view.turn === 'red' && view.phase !== 'over');
    el.blueTeam.classList.toggle('active', view.turn === 'blue' && view.phase !== 'over');
    el.redTeam.setAttribute('aria-label', '红队已找到 ' + view.scores.red + ' 个，共 9 个');
    el.blueTeam.setAttribute('aria-label', '蓝队已找到 ' + view.scores.blue + ' 个，共 8 个');
  }

  function updatePieceSummary() {
    var counts = { red: 0, blue: 0, neutral: 0, assassin: 0 };
    state.words.forEach(function (w) {
      if (counts[w.color] != null) counts[w.color]++;
    });
    el.countRed.textContent = '红 ' + counts.red;
    el.countBlue.textContent = '蓝 ' + counts.blue;
    el.countNeutral.textContent = '中立 ' + counts.neutral;
    el.countAssassin.textContent = '刺客 ' + counts.assassin;
    el.boardMeta.textContent = '5×5 · 25 张 · 代码合成';
    el.pieceSummary.setAttribute('aria-label', '局面构成：红队 ' + counts.red +
      ' 张、蓝队 ' + counts.blue + ' 张、中立 ' + counts.neutral +
      ' 张、刺客 ' + counts.assassin + ' 张，5×5 共 25 张');
    board.dataset.realism = '25:' + counts.red + ':' + counts.blue + ':' +
      counts.neutral + ':' + counts.assassin;
  }

  function hintFor(view) {
    if (view.phase === 'over') return '对局结束。点击“再来一局”重新开始，或查看棋盘复盘。';
    if (E.needsHuman(state)) {
      if (state.mode === 'captain') return '你是红队队长：输入一个线索词和数字，然后等待 AI 队员猜词。';
      var h = '你是红队队员：根据线索点击词卡。至少猜一次后可结束猜词。';
      if (revealKey) h += ' 队长视角已开启，可查看未翻开的颜色。';
      return h;
    }
    if (view.turn === 'red') {
      return state.mode === 'captain' ? 'AI 红队队员正在根据你的线索猜词…' : 'AI 红队队长正在思考线索…';
    }
    return '蓝队 AI 正在行动：队长给线索，队员猜词…';
  }

  function updateStatus(view) {
    el.status.dataset.team = view.phase === 'over' ? (view.winner || view.turn) : view.turn;
    el.turnLabel.textContent = view.phase === 'over'
      ? TEAM_TEXT[view.winner] + '获胜'
      : TEAM_TEXT[view.turn] + '回合';
    var phase;
    if (view.phase === 'over') phase = '对局结束';
    else if (view.phase === 'clue') phase = E.needsHuman(state) ? '等待你给线索' : 'AI 队长思考中';
    else phase = E.needsHuman(state) ? '轮到你猜词' : 'AI 队员猜词中';
    el.phaseLabel.textContent = phase;
    var showThinking = (pendingAI || (!E.needsHuman(state) && view.phase !== 'over'));
    el.thinking.hidden = !showThinking;
    el.hint.textContent = hintFor(view);
    el.hint.classList.remove('error');
    el.turnCounter.textContent = '第 ' + view.turnNo + ' 回合';

    if (lastTurnNo !== null && lastTurnNo !== view.turnNo) {
      el.status.classList.remove('sweep');
      void el.status.offsetWidth;
      el.status.classList.add('sweep');
      window.setTimeout(function () { el.status.classList.remove('sweep'); }, 760);
    }
    lastTurnNo = view.turnNo;
  }

  function updateClue(view) {
    if (!view.clue) {
      el.clueChip.hidden = true;
      el.clueEmpty.hidden = false;
      el.clueEmpty.textContent = view.phase === 'over' ? '对局已结束' : '尚未给出线索';
      lastClueKey = '';
      return;
    }
    var key = view.turnNo + ':' + view.clue.text + ':' + view.clue.count;
    el.clueChip.hidden = false;
    el.clueEmpty.hidden = true;
    el.clueChip.className = 'clue-chip ' + view.clue.team;
    el.clueTeam.textContent = TEAM_TEXT[view.clue.team] + '线索';
    el.clueTextShow.textContent = '「' + view.clue.text + '」';
    el.clueNumShow.textContent = String(view.clue.count);
    el.clueGuesses.textContent = '可猜 ' + view.guessesLeft + ' 次';
    if (key !== lastClueKey) {
      lastClueKey = key;
      el.clueChip.classList.remove('in');
      void el.clueChip.offsetWidth;
      el.clueChip.classList.add('in');
    }
  }

  function updateLog(view) {
    var key = view.log.join('|');
    if (key === lastLogKey) return;
    lastLogKey = key;
    el.logList.innerHTML = '';
    var items = view.log.slice(-6).reverse();
    items.forEach(function (text) {
      var li = document.createElement('li');
      li.textContent = text;
      el.logList.appendChild(li);
    });
  }

  /* --------------------------------------------------------------- render */
  function render() {
    if (!state) return;
    var t0 = window.performance ? performance.now() : 0;
    var view = E.viewFor(state, revealKey);
    updateScores(view);
    updatePieceSummary();
    updateStatus(view);
    updateClue(view);
    updateBoard(view, revealKey);
    updateLog(view);

    var humanClue = isHumanCluePhase();
    el.clueForm.hidden = !humanClue;
    el.passBtn.hidden = !(isHumanGuessPhase() && state.guessesMade >= 1);
    el.againBtn.hidden = !E.isOver(state);
    el.viewLabel.textContent = '队长视角：' + (revealKey ? '开' : '关');
    el.viewBtn.classList.toggle('on', revealKey);
    el.viewBtn.setAttribute('aria-pressed', revealKey ? 'true' : 'false');
    el.modeCaptain.classList.toggle('on', mode === 'captain');
    el.modeOperative.classList.toggle('on', mode === 'operative');
    el.modeCaptain.setAttribute('aria-pressed', mode === 'captain' ? 'true' : 'false');
    el.modeOperative.setAttribute('aria-pressed', mode === 'operative' ? 'true' : 'false');

    if (view.phase === 'over') showOverlay(view);
    if (window.performance) {
      perf.renders++;
      perf.renderMax = Math.max(perf.renderMax, performance.now() - t0);
    }
  }

  /* ------------------------------------------------------------- overlay */
  function spawnConfetti(redWin) {
    el.confetti.innerHTML = '';
    if (reducedMotion) return;
    var colors = redWin
      ? ['#ea6a64', '#f4c95d', '#66d99a', '#63a0ec']
      : ['#63a0ec', '#f4c95d', '#a99bd6', '#ea6a64'];
    for (var i = 0; i < 18; i++) {
      var c = document.createElement('i');
      c.style.setProperty('--x', Math.round(Math.random() * 100) + '%');
      c.style.setProperty('--c', colors[i % colors.length]);
      c.style.setProperty('--d', (1.6 + Math.random() * 1.6).toFixed(2) + 's');
      c.style.setProperty('--delay', (Math.random() * 0.9).toFixed(2) + 's');
      el.confetti.appendChild(c);
    }
  }

  function showOverlay(view) {
    if (overlayShown) return;
    overlayShown = true;
    var redWin = view.winner === 'red';
    el.banner.className = 'banner ' + (redWin ? 'win-red' : 'win-blue');
    el.bannerTitle.textContent = redWin ? '红队获胜' : '蓝队获胜';
    el.bannerResult.textContent = redWin
      ? '你与红队 AI 队员找齐了全部红队词。'
      : '蓝队先一步完成目标，再试一次吧。';
    var last = state.log.length ? state.log[state.log.length - 1] : '';
    el.bannerReason.textContent = /刺客/.test(last) ? '本局以刺客结束：踩中刺客的一方立即落败。' :
      '本局以找齐全部己方词结束。';
    el.overlay.hidden = false;
    spawnConfetti(redWin);
    playSound(redWin ? 'win' : 'lose');
    if (el.overlayDismiss && el.overlayDismiss.focus) el.overlayAgain.focus();
  }

  function hideOverlay() {
    el.overlay.hidden = true;
    el.confetti.innerHTML = '';
    overlayShown = false;
  }

  /* ---------------------------------------------------------------- flow */
  function newGame() {
    var t0 = window.performance ? performance.now() : 0;
    if (timer) { window.clearTimeout(timer); timer = null; }
    pendingAI = false;
    state = E.createGame({
      mode: mode,
      seed: (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0
    });
    revealKey = mode === 'captain';
    lastTurnNo = null;
    lastClueKey = '';
    lastLogKey = '';
    hideOverlay();
    buildBoard();
    render();
    scheduleAI();
    if (isHumanCluePhase()) el.clueText.focus();
    if (window.performance) perf.newGame = performance.now() - t0;
  }

  function scheduleAI() {
    if (timer) { window.clearTimeout(timer); timer = null; }
    if (!state || E.isOver(state) || E.needsHuman(state)) {
      pendingAI = false;
      render();
      return;
    }
    pendingAI = true;
    render();
    timer = window.setTimeout(aiStep, aiDelay);
  }

  function aiStep() {
    timer = null;
    if (!state) { pendingAI = false; return; }
    if (E.isOver(state)) { pendingAI = false; render(); return; }
    var action = E.aiAction(state);
    if (!action) { pendingAI = false; render(); return; }
    var res = E.applyAction(state, action);
    if (!res.ok) {
      pendingAI = false;
      flashError('AI 动作无效：' + res.error);
      render();
      return;
    }
    handleEvents(res.events);
    pendingAI = false;
    render();
    if (!E.isOver(state) && !E.needsHuman(state)) scheduleAI();
  }

  function handleEvents(events) {
    (events || []).forEach(function (ev) {
      if (ev.type === 'clue') {
        playSound('clue');
      } else if (ev.type === 'flip') {
        if (ev.color === 'assassin') playSound('assassin');
        else if (ev.correct) playSound('correct');
        else playSound('wrong');
        board.classList.remove('flash-good', 'flash-bad');
        void board.offsetWidth;
        board.classList.add(ev.correct ? 'flash-good' : 'flash-bad');
        window.setTimeout(function () { board.classList.remove('flash-good', 'flash-bad'); }, 460);
      } else if (ev.type === 'turn') {
        playSound('turn');
      } else if (ev.type === 'pass') {
        playSound('pass');
      }
    });
  }

  function flashError(message) {
    el.hint.textContent = message;
    el.hint.classList.add('error');
    el.clueForm.classList.remove('shake');
    void el.clueForm.offsetWidth;
    el.clueForm.classList.add('shake');
    window.setTimeout(function () { el.clueForm.classList.remove('shake'); }, 380);
  }

  /* --------------------------------------------------------------- events */
  function onClueSubmit(ev) {
    ev.preventDefault();
    if (!isHumanCluePhase()) return;
    var text = el.clueText.value.trim();
    var count = Number(el.clueCount.value);
    var res = E.applyAction(state, { type: 'clue', text: text, count: count });
    if (!res.ok) {
      flashError(res.error);
      el.clueText.focus();
      return;
    }
    el.clueText.value = '';
    handleEvents(res.events);
    render();
    scheduleAI();
  }

  function onPass() {
    if (!isHumanGuessPhase() || state.guessesMade < 1) return;
    var res = E.applyAction(state, { type: 'pass' });
    if (!res.ok) { flashError(res.error); return; }
    handleEvents(res.events);
    render();
    scheduleAI();
  }

  function setMode(next) {
    if (mode === next) return;
    mode = next;
    newGame();
  }

  function onViewToggle() {
    revealKey = !revealKey;
    render();
  }

  function onSoundToggle() {
    soundOn = !soundOn;
    SFX.mute(!soundOn);
    el.soundLabel.textContent = '音效：' + (soundOn ? '开' : '关');
    el.soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    if (soundOn) playSound('clue');
  }

  function onThemeToggle() {
    var order = ['auto', 'light', 'dark'];
    theme = order[(order.indexOf(theme) + 1) % order.length];
    document.documentElement.dataset.theme = theme;
    el.themeLabel.textContent = '主题：' + (theme === 'auto' ? '自动' : theme === 'light' ? '浅色' : '深色');
  }

  /* ------------------------------------------------------- keyboard grid */
  board.addEventListener('keydown', function (ev) {
    var tile = ev.target.closest ? ev.target.closest('.tile') : null;
    if (!tile) return;
    var i = Number(tile.dataset.index);
    var row = Math.floor(i / 5);
    var col = i % 5;
    var next = null;
    if (ev.key === 'ArrowLeft' && col > 0) next = i - 1;
    else if (ev.key === 'ArrowRight' && col < 4) next = i + 1;
    else if (ev.key === 'ArrowUp' && row > 0) next = i - 5;
    else if (ev.key === 'ArrowDown' && row < 4) next = i + 5;
    else if (ev.key === 'Home') next = 0;
    else if (ev.key === 'End') next = 24;
    if (next == null) return;
    ev.preventDefault();
    tiles.forEach(function (t) { t.tabIndex = -1; });
    tiles[next].tabIndex = 0;
    tiles[next].focus();
  });

  el.clueForm.addEventListener('submit', onClueSubmit);
  el.passBtn.addEventListener('click', onPass);
  el.modeCaptain.addEventListener('click', function () { setMode('captain'); });
  el.modeOperative.addEventListener('click', function () { setMode('operative'); });
  el.viewBtn.addEventListener('click', onViewToggle);
  el.newBtn.addEventListener('click', newGame);
  el.soundBtn.addEventListener('click', onSoundToggle);
  el.themeBtn.addEventListener('click', onThemeToggle);
  el.againBtn.addEventListener('click', newGame);
  el.overlayAgain.addEventListener('click', newGame);
  el.overlayDismiss.addEventListener('click', function () { el.overlay.hidden = true; });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !el.overlay.hidden) {
      el.overlay.hidden = true;
    }
  });

  /* ---------------------------------------------------------- test hooks */
  window.__codenames = {
    E: E,
    getState: function () { return state; },
    getView: function () { return E.viewFor(state, true); },
    action: function (a) {
      var r = E.applyAction(state, a);
      if (r.ok) { handleEvents(r.events); render(); }
      return r;
    },
    newGame: newGame,
    setMode: setMode,
    setRevealKey: function (v) { revealKey = !!v; render(); },
    setDelay: function (ms) { aiDelay = Math.max(0, Number(ms) || 0); },
    isHumanTurn: function () { return E.needsHuman(state); },
    getRealism: function () { return board.dataset.realism; },
    getPerf: function () {
      return { newGame: perf.newGame, board: perf.board, renderMax: perf.renderMax, renders: perf.renders };
    },
    audioState: function () { return SFX.stats().contextState; },
    autoPlayToEnd: function () {
      if (timer) { window.clearTimeout(timer); timer = null; }
      pendingAI = false;
      var guard = 0;
      while (state && !E.isOver(state) && guard++ < 600) {
        var a = E.aiAction(state);
        if (!a) break;
        var r = E.applyAction(state, a);
        if (!r.ok) break;
      }
      render();
      return {
        winner: state && state.winner,
        phase: state && state.phase,
        turnNo: state && state.turnNo
      };
    }
  };

  newGame();
}());
</script>
</body>
</html>
