<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>24 点 · 24 Game 精品单人版</title>
<meta name="description" content="24 点 24 Game 精品单人版：四张牌各用一次，加减乘除凑出 24。精确有理数求解、三档难度、每日挑战、提示与答案、计时与连胜。">
<meta name="theme-color" content="#120d08">
<meta property="og:title" content="24 点 · 24 Game 精品单人版">
<meta property="og:description" content="胡桃木桌面、象牙卡纸与黄铜筹码：四张牌、三个运算符、一个精确的 24。">
<meta property="og:image" content="assets/og.webp">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hhfa008.github.io/games/boardgame/24game-premium/">
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/24game-premium/">
<link rel="icon" href="assets/cover.webp">
<style>
:root{
  --bg:#120d08; --bg-deep:#0a0704; --panel:#1e1710; --panel2:#2a2015; --panel3:#352817;
  --paper:#f1e7d0; --paper-deep:#ddceb0; --ink:#f7eedb; --ink-dim:#cbbda5; --ink-faint:#9c8e78;
  --brass:#c9a35f; --brass-light:#efd399; --brass-dark:#85622b;
  --red:#a13a32; --black:#1c1a17; --green:#8fb47a; --danger:#d47765; --ok:#8fc48a;
  --line:rgba(201,163,95,.28); --line-strong:rgba(239,211,153,.62);
  --font-display:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --art-table:url("../../assets/art/premium/24game/table.webp");
  --art-paper:url("../../assets/art/premium/24game/card-paper.webp");
  --art-brass:url("../../assets/art/premium/24game/brass-token.webp");
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --shadow:0 16px 36px rgba(0,0,0,.42);
}
html{background:var(--bg);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;overflow-x:hidden;color:var(--ink);
  font-family:var(--font-body);font-size:14px;line-height:1.5;
  background:
    radial-gradient(760px 560px at 50% -8%,rgba(201,163,95,.18),transparent 64%),
    linear-gradient(rgba(13,9,5,.82),rgba(10,7,4,.92)),
    var(--art-table) center/cover fixed no-repeat;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.55) 100%)}
button,a{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,.card-face:focus-visible{outline:2px solid var(--brass-light);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:.05em}
[hidden]{display:none!important}
.app{position:relative;z-index:1;width:100%;max-width:1080px;margin:0 auto;padding:calc(10px + var(--safe-top)) 10px calc(16px + var(--safe-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.token{width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:1px solid var(--line-strong);
  background:linear-gradient(rgba(18,13,8,.16),rgba(18,13,8,.16)),var(--art-brass) center/104% no-repeat;
  background-blend-mode:multiply,normal;box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 0 0 3px rgba(239,211,153,.12)}
.brand h1{font-size:clamp(24px,6.2vw,36px);line-height:1;color:#f8efdc;text-shadow:0 3px 16px rgba(0,0,0,.55);white-space:nowrap}
.brand h1 span{color:var(--brass-light)}
.brand p{margin:3px 0 0;font-size:12px;letter-spacing:.13em;color:var(--ink-dim);white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.chipbtn,.navchip{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:11px;background:rgba(28,21,13,.78);font-size:12px;
  padding:0 9px;text-decoration:none;letter-spacing:.04em;color:var(--ink)}
.chipbtn:hover,.navchip:hover{background:rgba(54,40,25,.92);border-color:var(--line-strong)}
.modebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 9px;border:1px solid rgba(201,163,95,.22);
  border-radius:12px;background:linear-gradient(90deg,rgba(45,32,19,.82),rgba(24,17,11,.72));font-size:12px;color:var(--ink-dim)}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:2px 9px;
  border:1px solid var(--line-strong);background:linear-gradient(180deg,rgba(201,163,95,.22),rgba(133,98,43,.12));
  color:var(--brass-light);font-size:12px;font-weight:600;letter-spacing:.08em}
.status-chip{margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink)}
main{display:flex;flex-direction:column;gap:9px;margin-top:9px}
.panel{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,rgba(40,29,18,.9),rgba(21,15,9,.94));box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04);padding:9px}
.control-panel{display:flex;flex-direction:column;gap:7px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.seg.diff{grid-template-columns:repeat(3,minmax(0,1fr))}
.segbtn{min-height:44px;border:1px solid rgba(201,163,95,.24);border-radius:10px;background:rgba(20,14,9,.58);
  color:var(--ink-dim);font-size:13px;letter-spacing:.04em;padding:0 6px;white-space:nowrap}
.segbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.segbtn.active{border-color:var(--line-strong);color:#1d150c;font-weight:600;
  background:linear-gradient(180deg,var(--brass-light),var(--brass));box-shadow:0 4px 12px rgba(0,0,0,.3)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stat{min-width:0;border:1px solid rgba(201,163,95,.2);border-radius:10px;background:rgba(14,10,6,.5);
  padding:5px 2px;text-align:center}
.stat span{display:block;font-size:12px;line-height:1.2;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-size:15px;line-height:1.3;color:var(--brass-light);font-variant-numeric:tabular-nums;white-space:nowrap}
.table-panel{position:relative;overflow:hidden;padding:9px;
  background:
    linear-gradient(180deg,rgba(31,21,12,.36),rgba(16,11,6,.62)),
    var(--art-table) center/cover no-repeat;
  border:1px solid rgba(201,163,95,.34);border-radius:16px;box-shadow:0 20px 42px rgba(0,0,0,.36),inset 0 0 0 4px rgba(0,0,0,.16)}
.table-panel::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:16px;
  background:radial-gradient(ellipse at 50% 0%,rgba(239,211,153,.12),transparent 60%)}
.table-head{position:relative;z-index:1;display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap;
  font-size:12px;color:#e7dcc5;letter-spacing:.04em;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.table-head b{color:var(--brass-light);font-weight:600}
.cards{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.card-face{position:relative;min-width:0;aspect-ratio:63/88;border-radius:8px;border:1px solid rgba(104,83,48,.5);
  background:
    linear-gradient(145deg,rgba(255,250,236,.26),rgba(84,62,27,.12)),
    var(--art-paper) center/cover no-repeat;
  background-blend-mode:soft-light,normal;
  box-shadow:0 6px 14px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.55);
  color:var(--black);overflow:hidden;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease}
.card-face::before{content:"";position:absolute;inset:4%;border:1px solid rgba(96,74,38,.18);border-radius:4px;pointer-events:none}
.card-face:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.55)}
.card-face.red{color:var(--red)}
.card-face.black{color:var(--black)}
.corner{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;line-height:.86;gap:1px}
.corner b{font-family:var(--font-display);font-weight:700;font-size:clamp(14px,4.1vw,22px);letter-spacing:-.03em}
.corner .suit{width:clamp(9px,2.7vw,14px);height:clamp(9px,2.7vw,14px)}
.corner.tl{left:5%;top:3.5%}
.corner.br{right:5%;bottom:3.5%;transform:rotate(180deg)}
.pipfield{position:absolute;inset:9% 4%;z-index:1}
.pip{position:absolute;display:block;line-height:0}
.pip svg{display:block;width:100%;height:auto;fill:currentColor}
.suit{display:inline-block;vertical-align:middle;fill:currentColor}
.solution-slot{position:relative;z-index:1;margin-top:8px;border:1px solid rgba(239,211,153,.4);border-radius:10px;
  background:rgba(16,11,6,.72);padding:7px 9px;font-size:13px;line-height:1.55;color:#f7eedb;
  overflow-wrap:anywhere;word-break:break-word}
.solution-slot b{color:var(--brass-light)}
.input-panel{display:flex;flex-direction:column;gap:6px}
.input-label{font-size:12px;color:var(--ink-dim);letter-spacing:.04em}
#exprInput{width:100%;min-height:52px;border:1px solid rgba(201,163,95,.4);border-radius:11px;
  background:linear-gradient(180deg,rgba(12,8,4,.78),rgba(20,14,8,.86));color:#fbf3e2;
  font-size:21px;line-height:1.2;padding:8px 11px;font-family:var(--font-display);letter-spacing:.02em;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.5);caret-color:var(--brass-light)}
#exprInput::placeholder{color:var(--ink-faint);font-family:var(--font-body);font-size:14px}
#exprInput:disabled{opacity:.62}
.feedback{min-height:22px;font-size:13px;line-height:1.45;color:var(--ink-dim);overflow-wrap:anywhere;word-break:break-word}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--danger)}
.feedback.hint{color:var(--brass-light)}
.keypad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.key{min-width:44px;min-height:48px;border:1px solid rgba(201,163,95,.28);border-radius:10px;
  background:linear-gradient(180deg,rgba(53,40,24,.84),rgba(29,21,12,.9));color:var(--ink);
  font-size:19px;font-family:var(--font-display);font-weight:700;padding:0;line-height:1;
  box-shadow:0 4px 10px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
.key:hover:not(:disabled){border-color:var(--line-strong);background:linear-gradient(180deg,rgba(74,56,33,.94),rgba(40,29,16,.94))}
.key:disabled{opacity:.45;cursor:default}
.key.op{color:var(--brass-light);font-size:21px}
.key.util{font-size:15px;font-family:var(--font-body);font-weight:500;color:var(--ink-dim)}
.key.wide{grid-column:span 2}
.key.submit{background:linear-gradient(180deg,var(--brass-light),var(--brass));color:#23180b;font-family:var(--font-body);
  font-size:16px;font-weight:700;border-color:rgba(255,242,210,.72);box-shadow:0 6px 16px rgba(0,0,0,.4)}
.key.submit:hover:not(:disabled){background:linear-gradient(180deg,#fbe6b4,#d5af68)}
.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:1px}
.actions button{min-width:44px;min-height:44px;border:1px solid rgba(201,163,95,.26);border-radius:10px;
  background:rgba(28,21,13,.72);font-size:13px;color:var(--ink);padding:0 4px;white-space:nowrap}
.actions button:hover:not(:disabled){border-color:var(--line-strong);background:rgba(54,40,25,.9)}
.actions button:disabled{opacity:.45;cursor:default}
footer{margin-top:9px;padding:2px 2px 0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;
  font-size:12px;color:var(--ink-faint)}
footer a{color:var(--ink-dim);text-decoration:none;border-bottom:1px dotted rgba(201,163,95,.5)}
@media (min-width:720px){
  .app{padding-left:18px;padding-right:18px}
  main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);
    grid-template-areas:"controls controls" "table input" "stats stats";gap:12px;align-items:start}
  .control-panel{grid-area:controls;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:8px;padding:11px}
  .table-panel{grid-area:table;padding:14px}
  .input-panel{grid-area:input;padding:13px}
  .stats{grid-area:stats;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
  .cards{gap:10px}
  .stat b{font-size:18px}
  #exprInput{font-size:24px;min-height:58px}
  .key{min-height:54px;font-size:22px}
  .key.submit{font-size:17px}
  .actions button{min-height:46px;font-size:14px}
  .corner b{font-size:28px}.corner .suit{width:17px;height:17px}
}
@media (max-width:359px){
  .brand p{letter-spacing:.06em}
  .top-actions{gap:3px}
  .chipbtn,.navchip{padding:0 7px}
  .stats{gap:3px}
  .stat b{font-size:14px}
  .key{gap:0;font-size:18px;min-height:46px}
  .keypad{gap:4px}
  .actions{gap:4px}
  .actions button{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
@media (hover:none),(pointer:coarse){
  .panel,.table-panel{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
}
/* 浅色主题：保持同一套胡桃木/象牙纸材质，只换界面纸色与墨色 */
html[data-theme="light"]{
  --bg:#efe4cd; --bg-deep:#e4d6ba; --panel:#fbf4e6; --panel2:#f3e8d2; --panel3:#eadcc1;
  --paper:#f8f0df; --paper-deep:#e7d8bb; --ink:#2a2015; --ink-dim:#5f4f3c; --ink-faint:#7c6a53;
  --brass:#a67c37; --brass-light:#c9a35f; --brass-dark:#6f4f1e;
  --line:rgba(111,79,30,.3); --line-strong:rgba(133,98,43,.62);
  --danger:#a54a3d; --ok:#4f7a3f;
}
html[data-theme="light"] body{
  color:var(--ink);
  background:
    radial-gradient(760px 560px at 50% -8%,rgba(166,124,55,.16),transparent 64%),
    linear-gradient(rgba(248,240,224,.82),rgba(239,228,205,.9)),
    var(--art-table) center/cover fixed no-repeat;
}
html[data-theme="light"] .brand h1{color:#2a2015;text-shadow:0 2px 10px rgba(255,255,255,.5)}
html[data-theme="light"] .chipbtn,html[data-theme="light"] .navchip{background:rgba(251,244,230,.86);color:var(--ink)}
html[data-theme="light"] .modebar{background:linear-gradient(90deg,rgba(251,244,230,.9),rgba(240,229,207,.84));color:var(--ink-dim)}
html[data-theme="light"] .panel{background:linear-gradient(160deg,rgba(251,244,230,.95),rgba(240,229,207,.96))}
html[data-theme="light"] .segbtn{background:rgba(255,250,238,.7);color:var(--ink-dim)}
html[data-theme="light"] .segbtn.active{color:#fff9ea}
html[data-theme="light"] .stat{background:rgba(255,250,238,.66)}
html[data-theme="light"] .table-panel{background:linear-gradient(180deg,rgba(251,244,230,.2),rgba(240,229,207,.36)),var(--art-table) center/cover no-repeat;
  box-shadow:0 18px 38px rgba(90,64,41,.22),inset 0 0 0 4px rgba(255,255,255,.16)}
html[data-theme="light"] .table-head{color:#3b2c1b;text-shadow:0 1px 2px rgba(255,255,255,.55)}
html[data-theme="light"] .solution-slot{background:rgba(255,250,238,.86);color:#33261a}
html[data-theme="light"] #exprInput{background:linear-gradient(180deg,#fffaf0,#f4ead6);color:#2a2015;box-shadow:inset 0 2px 8px rgba(90,64,41,.16)}
html[data-theme="light"] .key{background:linear-gradient(180deg,#fffaf0,#efe2c8);color:#33261a;box-shadow:0 4px 10px rgba(90,64,41,.16),inset 0 1px 0 rgba(255,255,255,.8)}
html[data-theme="light"] .key.op{color:#7a5622}
html[data-theme="light"] .key.submit{color:#23180b}
html[data-theme="light"] .actions button{background:rgba(255,250,238,.76);color:#33261a}
html[data-theme="light"] footer{color:#7c6a53}
html[data-theme="light"] footer a{color:#5f4f3c}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="token" aria-hidden="true"></span>
      <div>
        <h1>24 <span>点</span></h1>
        <p>TWENTY-FOUR · 精品单人</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="chipbtn" id="soundBtn" type="button" aria-pressed="false" aria-label="切换音效">音效</button>
      <a class="navchip" href="rules.html" aria-label="查看完整规则">规则</a>
      <button class="chipbtn" id="themeBtn" type="button" aria-label="切换白天或夜间主题">夜间</button>
    </div>
  </header>

  <div class="modebar">
    <span class="badge">单人</span>
    <span>单机 · 有理数精确解</span>
    <span class="status-chip" id="modeChip">自由练习</span>
  </div>

  <main>
    <section class="panel control-panel" aria-label="模式与难度">
      <div class="seg" role="group" aria-label="游戏模式">
        <button class="segbtn" id="dailyBtn" type="button" data-mode="daily">每日挑战</button>
        <button class="segbtn" id="freeBtn" type="button" data-mode="free">自由练习</button>
      </div>
      <div class="seg diff" role="group" aria-label="难度">
        <button class="segbtn" type="button" data-diff="easy">简单</button>
        <button class="segbtn" type="button" data-diff="normal">普通</button>
        <button class="segbtn" type="button" data-diff="hard">困难</button>
      </div>
    </section>

    <section class="stats" aria-label="战绩">
      <div class="stat"><span>计时</span><b id="timer">00:00</b></div>
      <div class="stat"><span>得分</span><b id="score">0</b></div>
      <div class="stat"><span>连胜</span><b id="streak">0</b></div>
      <div class="stat"><span>最佳</span><b id="best">0</b></div>
      <div class="stat"><span>完成</span><b id="solved">0</b></div>
    </section>

    <section class="table-panel" aria-label="当前题目">
      <div class="table-head">
        <span id="puzzleMeta">第 1 题 · 普通</span>
        <span id="dailyInfo">自由练习 · A 记作 1</span>
      </div>
      <div class="cards" id="cards" aria-label="四张题面牌"></div>
      <div class="solution-slot" id="solutionSlot" hidden></div>
    </section>

    <section class="panel input-panel" aria-label="算式输入">
      <label class="input-label" for="exprInput">四张牌各用一次，用 + − × ÷ 与括号凑出 24（A 记作 1）</label>
      <input id="exprInput" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        placeholder="例如 5×(5−1÷5)" aria-label="输入 24 点算式">
      <div class="feedback" id="feedback" role="status" aria-live="polite">把四张牌都用一次，凑出 24。</div>
      <div class="keypad" id="keypad" aria-label="算式键盘"></div>
      <div class="actions">
        <button type="button" id="undoBtn">撤销</button>
        <button type="button" id="clearBtn">清空</button>
        <button type="button" id="hintBtn">提示</button>
        <button type="button" id="showBtn">答案</button>
        <button type="button" id="newBtn">新题</button>
      </div>
    </section>
  </main>

  <footer>
    <span>24 点 · 四张牌 · 一个精确的 24</span>
    <span>N 新题 · U 撤销 · H 提示 · Enter 提交</span>
  </footer>
</div>

<script src="../../shared/shuffle.js"></script>
<script src="../../shared/sfx.js"></script>
<script src="../../shared/store.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  'use strict';
  var E = window.Game24Engine;
  var D = window.Game24Data;
  var Store = window.Store || null;
  var Sfx = window.Sfx || null;
  var $ = function(id){ return document.getElementById(id); };
  var clone = function(v){ return JSON.parse(JSON.stringify(v)); };

  var state = null;
  var mode = 'free';
  var difficulty = 'normal';
  var timerRunning = false;
  var timerStart = 0;
  var elapsedMs = 0;
  var timerId = null;
  var theme = 'dark';
  var bestScore = 0;
  var bestStreak = 0;
  var dailyRecord = null;
  var lastRenderedStatus = null;

  var KEYS = [
    { token: '1', label: '1' }, { token: '2', label: '2' }, { token: '3', label: '3' }, { token: '+', label: '+', cls: 'op' }, { token: '-', label: '−', cls: 'op' },
    { token: '4', label: '4' }, { token: '5', label: '5' }, { token: '6', label: '6' }, { token: '×', label: '×', cls: 'op' }, { token: '÷', label: '÷', cls: 'op' },
    { token: '7', label: '7' }, { token: '8', label: '8' }, { token: '9', label: '9' }, { token: '(', label: '(', cls: 'op' }, { token: ')', label: ')', cls: 'op' },
    { token: '10', label: '10' }, { token: 'back', label: '⌫', cls: 'util' }, { token: 'clear', label: 'C', cls: 'util' }, { token: 'submit', label: '提交', cls: 'submit wide' }
  ];

  function storeGet(key, fallback) {
    try { return Store ? Store.get(key, fallback) : fallback; } catch (err) { return fallback; }
  }
  function storeSet(key, value) {
    try { if (Store) Store.set(key, value); } catch (err) { /* persistence is optional */ }
  }
  function storeGetJSON(key, fallback) {
    try { return Store ? Store.getJSON(key, fallback) : fallback; } catch (err) { return fallback; }
  }
  function storeSetJSON(key, value) {
    try { if (Store) Store.setJSON(key, value); } catch (err) { /* persistence is optional */ }
  }
  function storeBest(key, value) {
    try { if (Store) return Store.best(key, value, { mode: 'max' }); } catch (err) { /* ignore */ }
    return false;
  }
  function playSound(name) {
    try { if (Sfx && Sfx.play) Sfx.play(name, { volume: 0.38 }); } catch (err) { /* audio is optional */ }
  }
  function reducedMotion() {
    try { return !!window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (err) { return false; }
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function isoDate(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function todayISO() { return isoDate(new Date()); }
  function yesterdayISO() { return isoDate(new Date(Date.now() - 86400000)); }
  function fmtTime(ms) {
    var total = Math.max(0, Math.floor(ms / 1000));
    var minutes = Math.floor(total / 60);
    var seconds = total % 60;
    return pad2(minutes) + ':' + pad2(seconds);
  }
  function num(value, fallback) {
    var n = Number(value);
    return isFinite(n) ? n : (fallback || 0);
  }

  /* ---------------------------------------------------------------- 牌面绘制 */
  function suitSvg(suitKey, cls) {
    var path = D.SUIT_PATHS[suitKey] || '';
    return '<svg class="suit ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="' + path + '"></path></svg>';
  }
  function cardFace(card) {
    var suit = D.SUIT_BY_KEY[card.suit];
    var valueLabel = card.value === 1 ? 'A' : String(card.value);
    var scale = card.value === 1 ? 3.05 : (card.value >= 10 ? 0.74 : (card.value >= 9 ? 0.82 : (card.value >= 7 ? 0.9 : 1)));
    var width = (15 * scale).toFixed(1) + '%';
    var pips = (D.PIPS[card.value] || []).map(function (p) {
      var rotation = p.y > 50 ? 180 : 0;
      return '<span class="pip" style="left:' + p.x + '%;top:' + p.y + '%;width:' + width +
        ';transform:translate(-50%,-50%) rotate(' + rotation + 'deg)">' + suitSvg(card.suit) + '</span>';
    }).join('');
    var aria = suit.zh + ' ' + (card.value === 1 ? 'A，点数值 1' : String(card.value));
    return '<div class="card-face ' + (suit.red ? 'red' : 'black') + '" tabindex="0" role="img" ' +
      'data-value="' + card.value + '" data-suit="' + card.suit + '" aria-label="' + aria + '">' +
      '<span class="corner tl"><b>' + valueLabel + '</b>' + suitSvg(card.suit) + '</span>' +
      '<span class="pipfield">' + pips + '</span>' +
      '<span class="corner br"><b>' + valueLabel + '</b>' + suitSvg(card.suit) + '</span>' +
      '</div>';
  }

  /* ---------------------------------------------------------------- 键盘与输入 */
  function buildKeypad() {
    $('keypad').innerHTML = KEYS.map(function (key) {
      return '<button type="button" class="key ' + (key.cls || '') + '" data-token="' + key.token + '" aria-label="' +
        (key.token === 'back' ? '退格' : (key.token === 'clear' ? '清空' : (key.token === 'submit' ? '提交算式' : key.label))) + '">' +
        key.label + '</button>';
    }).join('');
  }
  function insertToken(token) {
    if (!state || state.status !== 'playing') return;
    var input = $('exprInput');
    var start = typeof input.selectionStart === 'number' ? input.selectionStart : input.value.length;
    var end = typeof input.selectionEnd === 'number' ? input.selectionEnd : input.value.length;
    input.value = input.value.slice(0, start) + token + input.value.slice(end);
    var caret = start + token.length;
    try { input.setSelectionRange(caret, caret); } catch (err) { /* older browsers */ }
    input.focus();
  }
  function backspace() {
    var input = $('exprInput');
    if (!state || state.status !== 'playing') return;
    var start = typeof input.selectionStart === 'number' ? input.selectionStart : input.value.length;
    var end = typeof input.selectionEnd === 'number' ? input.selectionEnd : input.value.length;
    if (start !== end) {
      input.value = input.value.slice(0, start) + input.value.slice(end);
      try { input.setSelectionRange(start, start); } catch (err) {}
    } else if (start > 0) {
      input.value = input.value.slice(0, start - 1) + input.value.slice(start);
      try { input.setSelectionRange(start - 1, start - 1); } catch (err) {}
    }
    input.focus();
  }
  function clearInput() {
    var input = $('exprInput');
    input.value = '';
    input.focus();
  }

  /* ---------------------------------------------------------------- 计时 */
  function startTimer() {
    timerStart = Date.now();
    elapsedMs = 0;
    timerRunning = true;
    updateTimer();
  }
  function stopTimer() {
    if (timerRunning) elapsedMs = Date.now() - timerStart;
    timerRunning = false;
    updateTimer();
  }
  function elapsedNow() {
    if (!timerRunning) return elapsedMs;
    return Math.max(0, Date.now() - timerStart);
  }
  function updateTimer() {
    var el = $('timer');
    if (el) el.textContent = fmtTime(elapsedNow());
  }
  function tick() {
    if (state && state.status === 'playing') updateTimer();
  }

  /* ---------------------------------------------------------------- 持久化 */
  function loadPersisted() {
    bestScore = Math.max(0, Math.floor(num(storeGet('g24-premium-best-score', '0'), 0)));
    bestStreak = Math.max(0, Math.floor(num(storeGet('g24-premium-best-streak', '0'), 0)));
    dailyRecord = storeGetJSON('g24-premium-daily-v1', {});
    if (!dailyRecord || typeof dailyRecord !== 'object') dailyRecord = {};
  }
  function persistSolve() {
    if (!state || state.status !== 'solved') return;
    bestScore = Math.max(bestScore, state.stats.score);
    bestStreak = Math.max(bestStreak, state.stats.bestStreak);
    storeBest('g24-premium-best-score', state.stats.score);
    storeBest('g24-premium-best-streak', state.stats.bestStreak);
    var history = storeGetJSON('g24-premium-history-v1', {});
    if (!history || typeof history !== 'object') history = {};
    history.solved = Math.floor(num(history.solved, 0)) + 1;
    history.attempts = Math.floor(num(history.attempts, 0)) + Math.max(1, state.stats.attempts);
    history.lastAt = new Date().toISOString();
    storeSetJSON('g24-premium-history-v1', history);
    if (mode === 'daily') {
      var today = state.date || todayISO();
      if (dailyRecord.lastDate !== today) {
        dailyRecord.streak = dailyRecord.lastDate === yesterdayISO() ? Math.floor(num(dailyRecord.streak, 0)) + 1 : 1;
        dailyRecord.lastDate = today;
      }
      dailyRecord.solved = Math.floor(num(dailyRecord.solved, 0)) + 1;
      dailyRecord.lastDifficulty = difficulty;
      storeSetJSON('g24-premium-daily-v1', dailyRecord);
    }
  }

  /* ---------------------------------------------------------------- 渲染 */
  function renderCards() {
    $('cards').innerHTML = state.cards.map(cardFace).join('');
  }
  function renderModeButtons() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-diff]'), function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-diff') === difficulty);
    });
  }
  function renderStats() {
    $('score').textContent = String(state.stats.score);
    $('streak').textContent = String(state.stats.streak);
    $('solved').textContent = String(state.stats.solved);
    $('best').textContent = String(Math.max(bestScore, state.stats.score));
    updateTimer();
  }
  function renderMeta() {
    var band = E.DIFFICULTY_BANDS[difficulty];
    $('puzzleMeta').textContent = '第 ' + (state.puzzleIndex + 1) + ' 题 · ' + band.label + ' · ' + state.solutionCount + ' 种规范解';
    $('modeChip').textContent = mode === 'daily' ? '每日挑战' : '自由练习';
    if (mode === 'daily') {
      var date = state.date || todayISO();
      var done = dailyRecord && dailyRecord.lastDate === date;
      var streak = dailyRecord ? Math.floor(num(dailyRecord.streak, 0)) : 0;
      $('dailyInfo').textContent = '每日 ' + date.slice(5) + ' · ' + (done ? '今日已完成' : '未完成') + ' · 连续 ' + Math.max(streak, done ? 1 : streak) + ' 天';
    } else {
      $('dailyInfo').textContent = '自由练习 · A 记作 1 · 精确有理数';
    }
  }
  function setFeedback(text, kind) {
    var el = $('feedback');
    el.textContent = text;
    el.className = 'feedback' + (kind ? ' ' + kind : '');
  }
  function renderSolution() {
    var slot = $('solutionSlot');
    if (state.hintText) {
      slot.hidden = false;
      var label = state.status === 'revealed' ? '参考解' : '提示';
      slot.innerHTML = '<b>' + label + '　' + (state.status === 'revealed' ? '本题规范解共 ' + state.solutionCount + ' 种' : '最短解') + '</b><br>' +
        state.hintText + ' = 24';
    } else {
      slot.hidden = true;
      slot.textContent = '';
    }
  }
  function renderFeedback() {
    if (state.lastFeedback) {
      var kind = state.lastFeedback.ok === true ? 'ok' : (state.lastFeedback.code === 'hint' ? 'hint' : 'bad');
      setFeedback(state.lastFeedback.message, kind);
    } else if (state.status === 'playing') {
      setFeedback('把四张牌都用一次，凑出 24。', '');
    }
  }
  function renderControls() {
    var playing = state.status === 'playing';
    $('exprInput').disabled = !playing;
    Array.prototype.forEach.call(document.querySelectorAll('#keypad .key'), function (btn) {
      btn.disabled = !playing;
    });
    $('undoBtn').disabled = !playing;
    $('clearBtn').disabled = !playing;
    $('hintBtn').disabled = !playing;
    $('showBtn').disabled = !playing;
    $('newBtn').textContent = playing ? '新题' : '下一题';
    if (playing) $('newBtn').setAttribute('aria-label', '跳过当前题并进入下一题');
    else $('newBtn').setAttribute('aria-label', '进入下一题');
  }
  function render() {
    if (!state) return;
    renderCards();
    renderModeButtons();
    renderStats();
    renderMeta();
    renderSolution();
    renderFeedback();
    renderControls();
    if (state.status !== 'playing' && lastRenderedStatus === 'playing') stopTimer();
    lastRenderedStatus = state.status;
  }

  /* ---------------------------------------------------------------- 动作 */
  function submitText(text) {
    if (!state || state.status !== 'playing') {
      setFeedback('本题已结束，点“下一题”继续。', 'bad');
      return { ok: false, error: '已结束' };
    }
    var check = E.checkAnswer(state.cards, text);
    if (!check.ok && check.code !== 'wrong') {
      setFeedback(check.error || '算式不合法', 'bad');
      playSound('error');
      return { ok: false, error: check.error, code: check.code };
    }
    try {
      state = E.applyMove(state, { type: 'submit', expression: text, elapsedMs: elapsedNow() });
    } catch (err) {
      setFeedback(err.message || '这一步不合法', 'bad');
      playSound('error');
      return { ok: false, error: err.message };
    }
    if (state.status === 'solved') {
      stopTimer();
      persistSolve();
      playSound('win');
    } else {
      playSound('lose');
    }
    render();
    $('exprInput').focus();
    return { ok: state.status === 'solved', feedback: state.lastFeedback, result: state.result };
  }
  function hintAction() {
    if (!state || state.status !== 'playing') return null;
    state = E.applyMove(state, { type: 'hint' });
    playSound('click');
    render();
    return state.hintText;
  }
  function showSolution() {
    if (!state || state.status !== 'playing') return null;
    state = E.applyMove(state, { type: 'show-solution', elapsedMs: elapsedNow() });
    stopTimer();
    playSound('lose');
    render();
    return state.hintText;
  }
  function nextPuzzle() {
    if (!state) return null;
    if (state.status === 'playing') {
      state = E.applyMove(state, { type: 'skip', elapsedMs: elapsedNow() });
    }
    state = E.applyMove(state, { type: 'next' });
    resetPuzzleUi();
    render();
    return state;
  }
  function resetPuzzleUi() {
    $('exprInput').value = '';
    startTimer();
    lastRenderedStatus = 'playing';
    setFeedback('把四张牌都用一次，凑出 24。', '');
    $('solutionSlot').hidden = true;
    $('solutionSlot').textContent = '';
    try { $('exprInput').focus(); } catch (err) {}
  }
  function startNew(opts) {
    opts = opts || {};
    if (opts.mode === 'daily' || opts.mode === 'free') mode = opts.mode;
    if (E.DIFFICULTIES.indexOf(opts.difficulty) !== -1) difficulty = opts.difficulty;
    var date = opts.date || todayISO();
    var seed = opts.seed;
    if (mode === 'free' && seed == null) seed = Date.now() % 1000000007;
    state = E.createGame({
      mode: mode,
      difficulty: difficulty,
      date: mode === 'daily' ? date : null,
      seed: seed
    });
    storeSet('g24-premium-mode', mode);
    storeSet('g24-premium-difficulty', difficulty);
    lastRenderedStatus = 'playing';
    resetPuzzleUi();
    render();
    return state;
  }

  /* ---------------------------------------------------------------- 事件 */
  function handleToken(token) {
    if (token === 'back') return backspace();
    if (token === 'clear') return clearInput();
    if (token === 'submit') return submitText($('exprInput').value);
    return insertToken(token);
  }
  function newPuzzleAction() { playSound('deal'); return nextPuzzle(); }

  document.addEventListener('click', function (event) {
    var key = event.target.closest('#keypad .key');
    if (key) { handleToken(key.getAttribute('data-token')); return; }
    var modeBtn = event.target.closest('[data-mode]');
    if (modeBtn) {
      var nextMode = modeBtn.getAttribute('data-mode');
      if (nextMode !== mode) { playSound('click'); startNew({ mode: nextMode, difficulty: difficulty, date: todayISO() }); }
      return;
    }
    var diffBtn = event.target.closest('[data-diff]');
    if (diffBtn) {
      var nextDiff = diffBtn.getAttribute('data-diff');
      if (nextDiff !== difficulty) {
        playSound('click');
        startNew({ mode: mode, difficulty: nextDiff, date: todayISO() });
      }
      return;
    }
    var card = event.target.closest('.card-face');
    if (card && state && state.status === 'playing') {
      insertToken(String(card.getAttribute('data-value')));
    }
  });

  $('exprInput').addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      submitText($('exprInput').value);
    } else if (event.key === 'Escape') {
      $('exprInput').blur();
    }
  });
  $('undoBtn').addEventListener('click', function () { playSound('click'); backspace(); });
  $('clearBtn').addEventListener('click', function () { playSound('click'); clearInput(); });
  $('hintBtn').addEventListener('click', function () { hintAction(); });
  $('showBtn').addEventListener('click', function () { showSolution(); });
  $('newBtn').addEventListener('click', newPuzzleAction);

  document.addEventListener('keydown', function (event) {
    var tag = (event.target && event.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    var key = event.key;
    if (key === 'n' || key === 'N') { event.preventDefault(); newPuzzleAction(); }
    else if (key === 'u' || key === 'U') { event.preventDefault(); backspace(); }
    else if (key === 'h' || key === 'H') { event.preventDefault(); hintAction(); }
    else if (key === 'Escape') { clearInput(); }
  });

  function setTheme(next) {
    theme = next === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    $('themeBtn').textContent = theme === 'light' ? '白天' : '夜间';
    storeSet('g24-premium-theme', theme);
  }
  $('themeBtn').addEventListener('click', function () {
    playSound('click');
    setTheme(theme === 'dark' ? 'light' : 'dark');
  });
  function syncSoundButton() {
    var muted = false;
    try { muted = !!(Sfx && Sfx.isMuted && Sfx.isMuted()); } catch (err) { muted = false; }
    $('soundBtn').textContent = muted ? '静音' : '音效';
    $('soundBtn').setAttribute('aria-pressed', muted ? 'true' : 'false');
  }
  $('soundBtn').addEventListener('click', function () {
    try {
      if (Sfx && Sfx.isMuted) Sfx.mute(!Sfx.isMuted());
    } catch (err) { /* ignore */ }
    syncSoundButton();
    playSound('click');
  });

  /* ---------------------------------------------------------------- 测试 API */
  function snapshot() { return clone(state); }
  window.__game24 = Object.freeze({
    newGame: function (opts) { return clone(startNew(opts || {})); },
    getState: function () { return snapshot(); },
    setState: function (s) {
      var next = E.validateState(clone(s));
      state = next;
      mode = state.mode;
      difficulty = state.difficulty;
      lastRenderedStatus = state.status;
      $('exprInput').value = '';
      if (state.status === 'playing') startTimer(); else stopTimer();
      render();
      return snapshot();
    },
    legalMoves: function () { return clone(E.getLegalMoves(state)); },
    playMove: function (move) {
      state = E.applyMove(state, clone(move));
      if (state.status !== 'playing') stopTimer();
      if (state.status === 'solved') persistSolve();
      render();
      return snapshot();
    },
    autoFinish: function () {
      if (!state) return null;
      if (state.status === 'playing') {
        state = E.applyMove(state, { type: 'submit', expression: state.solutions[0], elapsedMs: elapsedNow() });
        stopTimer();
        persistSolve();
        render();
      }
      return state.result ? clone(state.result) : null;
    },
    hint: function () { return E.hint(state); },
    solution: function () { return E.hint(state); },
    checkExpression: function (text) { return clone(E.checkAnswer(state.cards, text)); },
    submit: function (text) { return clone(submitText(String(text))); },
    skip: function () {
      if (state && state.status === 'playing') state = E.applyMove(state, { type: 'skip' });
      render();
      return snapshot();
    },
    nextPuzzle: function () { return clone(nextPuzzle()); },
    result: function () { return state && state.result ? clone(state.result) : null; },
    stats: function () { return clone(state.stats); },
    timer: function () { return elapsedNow(); },
    cards: function () { return clone(state.cards); },
    engine: E,
    data: D,
    getMode: function () { return mode; },
    getDifficulty: function () { return difficulty; }
  });

  /* ---------------------------------------------------------------- 启动 */
  loadPersisted();
  buildKeypad();
  setTheme(storeGet('g24-premium-theme', 'dark'));
  syncSoundButton();
  timerId = setInterval(tick, 250);

  var params;
  try { params = new URLSearchParams(location.search); } catch (err) { params = null; }
  var startMode = params && params.get('mode') === 'daily' ? 'daily' : (params && params.get('mode') === 'free' ? 'free' : (storeGet('g24-premium-mode', 'free') === 'daily' ? 'daily' : 'free'));
  var startDiff = params && E.DIFFICULTIES.indexOf(params.get('difficulty')) !== -1 ? params.get('difficulty') : storeGet('g24-premium-difficulty', 'normal');
  if (E.DIFFICULTIES.indexOf(startDiff) === -1) startDiff = 'normal';
  var startSeed = params && params.get('seed') != null ? params.get('seed') : undefined;
  var startDate = params && params.get('date') ? params.get('date') : todayISO();
  startNew({ mode: startMode, difficulty: startDiff, seed: startSeed, date: startDate });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache is optional */ });
  }
})();
</script>
</body>
