<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/backgammon-premium/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d09">
<meta name="description" content="双陆棋 Backgammon 精品桌游：24 点、15 枚对 15 枚、开局 pip 167 对 167。掷骰、进 bar、击中散子、全部离盘；含倍数方块与 AI 对手，纯本地材质零外链。">
<meta property="og:title" content="双陆棋 BACKGAMMON · 掷骰、过 bar、全部离盘">
<meta property="og:description" content="两枚骰子，十五枚棋子，二十四点。把十五枚棋子全部带回 home board 离盘，并用倍数方块放大这一局的赌注。">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og.webp">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d120b'/%3E%3Ccircle cx='22' cy='22' r='9' fill='%23f4ead2'/%3E%3Ccircle cx='42' cy='42' r='9' fill='%23311d12' stroke='%23c99a4e'/%3E%3Cpath d='M8 48h48' stroke='%23c99a4e' stroke-width='3'/%3E%3C/svg%3E">
<title>双陆棋 BACKGAMMON · 精品桌游</title>
<link rel="stylesheet" href="ui.css">
<style>
  :root{
    --art-walnut:url("../../assets/art/premium/backgammon/walnut.webp");
    --art-maple:url("../../assets/art/premium/backgammon/maple.webp");
    --art-leather:url("../../assets/art/premium/backgammon/leather.webp");
    --font-serif:"Songti SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --bg:#100b08;--bg2:#1c130d;--panel:rgba(38,26,18,.92);--panel2:rgba(54,37,24,.76);
    --line:rgba(201,164,104,.34);--ink:#f6eddc;--muted:#c6b39a;--soft:#97826b;
    --gold:#e7c281;--gold2:#f6dda6;--ivory:#f4ead2;--ebony:#24150f;
    --green:#7fd9a6;--coral:#e3694f;--sky:#87c9ef;--danger:#ff9c8d;
    --shadow:0 22px 52px rgba(0,0,0,.48);--radius:18px;--tap:48px;
  }
  :root[data-theme="light"]{
    --bg:#efe4d1;--bg2:#f8efdf;--panel:rgba(255,250,240,.94);--panel2:rgba(246,236,220,.82);
    --line:rgba(150,113,70,.36);--ink:#2b2118;--muted:#6c5b48;--soft:#9a856c;
    --gold:#9c6c14;--gold2:#7c5310;--ivory:#fffaf0;--ebony:#3a2418;
    --green:#1f8f61;--coral:#c9523c;--sky:#2c75ad;--danger:#b33f35;
    --shadow:0 18px 40px rgba(91,68,42,.22);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#efe4d1;--bg2:#f8efdf;--panel:rgba(255,250,240,.94);--panel2:rgba(246,236,220,.82);
      --line:rgba(150,113,70,.36);--ink:#2b2118;--muted:#6c5b48;--soft:#9a856c;
      --gold:#9c6c14;--gold2:#7c5310;--ivory:#fffaf0;--ebony:#3a2418;
      --green:#1f8f61;--coral:#c9523c;--sky:#2c75ad;--danger:#b33f35;
      --shadow:0 18px 40px rgba(91,68,42,.22);
    }
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;color:var(--ink);font:16px/1.5 var(--font-sans);
    background:
      radial-gradient(980px 600px at 50% -12%,rgba(105,65,37,.46),transparent 64%),
      radial-gradient(720px 480px at 6% 108%,rgba(27,72,52,.4),transparent 62%),
      linear-gradient(168deg,var(--bg2),var(--bg) 62%);
    background-color:var(--bg);background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.18;
    background-image:repeating-linear-gradient(112deg,rgba(255,255,255,.06) 0 1px,transparent 1px 9px),
      repeating-linear-gradient(22deg,rgba(0,0,0,.18) 0 1px,transparent 1px 11px);
    mix-blend-mode:soft-light;
  }
  a{color:var(--gold)}
  button,select{font:inherit;color:var(--ink)}
  button{touch-action:manipulation;cursor:pointer}
  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:10px 12px 36px;padding-bottom:calc(36px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;gap:7px;padding:4px 0 11px}
  .brand{flex:1;min-width:0;text-align:center}
  .brand h1{margin:0;font-family:var(--font-serif);font-weight:700;font-size:20px;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand p{margin:1px 0 0;font-size:12px;color:var(--muted);letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;min-width:var(--tap);min-height:var(--tap);
    padding:0 10px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-size:14px;text-decoration:none;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);
    transition:transform .12s ease,background .2s ease;
  }
  .icon-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .icon-btn:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  select#aiLevel{min-height:var(--tap);min-width:72px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;font-weight:700;padding:0 7px}

  .scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin-bottom:10px}
  .player{position:relative;border:1px solid var(--line);border-radius:15px;background:linear-gradient(155deg,var(--panel),rgba(0,0,0,.08));padding:9px 10px;min-width:0;box-shadow:0 6px 16px rgba(0,0,0,.16)}
  .player.active{box-shadow:0 0 0 2px var(--gold) inset,0 8px 20px rgba(0,0,0,.2)}
  .player .who{display:flex;align-items:center;gap:6px;min-width:0}
  .chip{width:15px;height:15px;border-radius:50%;flex:0 0 15px;border:1px solid rgba(0,0,0,.36);box-shadow:inset 0 1px 2px rgba(255,255,255,.4)}
  .chip.white{background:radial-gradient(circle at 34% 28%,#fffdf6,#e4d1ad)}
  .chip.black{background:radial-gradient(circle at 34% 28%,#6a4327,#21140d)}
  .player .nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .player .badge{margin-left:auto;font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap}
  .player .pip{font-family:var(--font-serif);font-weight:700;font-size:27px;line-height:1.05;color:var(--gold2);letter-spacing:-.5px;margin-top:2px}
  .player .pip small{font:700 12px var(--font-sans);color:var(--muted);letter-spacing:0}
  .player .meta{display:flex;justify-content:space-between;gap:4px;margin-top:2px;font-size:12px;color:var(--muted)}
  .player .meta b{color:var(--ink)}
  .cube-panel{border:1px solid var(--line);border-radius:15px;background:linear-gradient(160deg,rgba(231,194,129,.16),rgba(0,0,0,.12));padding:7px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:92px}
  .cube{
    width:38px;height:38px;border-radius:7px;display:grid;place-items:center;font:900 20px/1 var(--font-serif);color:#2a1a0c;
    background:radial-gradient(circle at 28% 20%,#fff3d0,#d4a95c 58%,#8d5c23);border:1px solid #f0d9a8;
    box-shadow:0 4px 0 #6e4518,0 7px 12px rgba(0,0,0,.34),inset 0 0 0 2px rgba(255,255,255,.24);
  }
  .cube small{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
  .cube-btn{min-height:44px;min-width:44px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:800}
  .cube-btn.primary{background:linear-gradient(160deg,var(--gold),#a97824);color:#241506;border:0}
  .cube-btn.coral{background:linear-gradient(160deg,var(--coral),#a23927);color:#2a0d08;border:0}
  .cube-btn:disabled{opacity:.34;cursor:default}
  .cube-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}

  .board-shell{
    position:relative;border-radius:24px;padding:10px;border:1px solid var(--line);
    background:
      linear-gradient(160deg,rgba(70,42,24,.68),rgba(24,14,8,.9)),
      var(--art-walnut) center/cover no-repeat;
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.12);
    overflow:hidden;
  }
  .board-shell::before{content:"";position:absolute;inset:7px;border-radius:18px;border:1px dashed rgba(246,226,182,.18);pointer-events:none}
  .board{position:relative;z-index:1;border-radius:16px;overflow:hidden;background:#1b2d23}
  .board::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:16px;box-shadow:inset 0 0 40px rgba(0,0,0,.34)}

  .controls{margin-top:11px}
  .dice-row{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:2px 0}
  .dice-label{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:1px;text-transform:uppercase;min-width:44px;text-align:center}
  .dice-set{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center}
  .ghost-die{width:46px;height:46px;border-radius:10px;border:1px dashed var(--line);background:rgba(0,0,0,.14);display:grid;place-items:center;color:var(--muted);font-size:16px;font-weight:800}
  .doubles-tag{font-size:12px;font-weight:800;color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:rgba(0,0,0,.18)}
  .turn-note{min-height:24px;text-align:center;font-size:13px;font-weight:800;color:var(--gold2);padding:3px 4px}
  .turn-note .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 0 4px rgba(127,217,166,.14);animation:turnPulse 1.8s ease-in-out infinite;vertical-align:1px}
  .turn-note .dot.wait{background:var(--gold);box-shadow:0 0 0 4px rgba(231,194,129,.12)}
  .action-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .action{min-height:50px;min-width:88px;padding:0 16px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:15px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.2)}
  .action.primary{background:linear-gradient(160deg,var(--green),#2f9b78);color:#062019;border:0}
  .action.coral{background:linear-gradient(160deg,var(--coral),#a23927);color:#2a0d08;border:0}
  .action:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .action:disabled{opacity:.34;cursor:default;box-shadow:none}
  .hint{min-height:20px;margin:7px 2px 0;text-align:center;font-size:12px;color:var(--muted)}
  .log{margin-top:12px;border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:9px 12px;min-height:54px}
  .log h2{margin:0 0 5px;font-size:12px;letter-spacing:1.5px;color:var(--muted);font-weight:800;text-transform:uppercase}
  .log ul{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:112px;overflow:auto}
  .log li{font-size:12px;color:var(--muted);border-bottom:1px dashed rgba(128,110,88,.2);padding:3px 0}
  .log li:last-child{color:var(--ink)}
  .log li::before{content:"›";color:var(--gold);margin-right:6px;font-weight:900}
  .foot{text-align:center;margin-top:15px;font-size:12px;color:var(--muted)}
  .foot a{display:inline-flex;align-items:center;min-height:44px;margin:0 8px;text-decoration:none;color:var(--muted)}
  .foot a:hover{color:var(--gold)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  [hidden]{display:none!important}

  .finale{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 35%,rgba(36,20,10,.78),rgba(8,5,3,.95));backdrop-filter:blur(3px)}
  .finale.show{display:flex;animation:fadeIn .28s ease both}
  .finale-card{width:100%;max-width:360px;max-height:88vh;overflow:auto;border-radius:22px;padding:20px 18px;text-align:center;background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:var(--shadow);animation:riseIn .45s cubic-bezier(.2,.9,.2,1.1) both}
  .finale-card .crown{font-size:34px;line-height:1}
  .finale-card h2{margin:6px 0 2px;font-size:24px;font-family:var(--font-serif);font-weight:700}
  .finale-card p{margin:2px 0 12px;color:var(--muted);font-size:13px}
  .finale-grid{display:grid;gap:6px;margin:0 0 14px;text-align:left}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.14);font-size:13px}
  .frow b{color:var(--gold2);font-size:15px}
  .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .confetti i{position:absolute;top:-14px;width:7px;height:11px;border-radius:2px;opacity:.9;animation:fall 2.7s linear infinite}
  .confetti i:nth-child(1){left:7%;background:var(--coral);animation-delay:.1s}
  .confetti i:nth-child(2){left:21%;background:var(--gold);animation-delay:.7s}
  .confetti i:nth-child(3){left:35%;background:var(--green);animation-delay:.35s}
  .confetti i:nth-child(4){left:49%;background:var(--sky);animation-delay:1.1s}
  .confetti i:nth-child(5){left:63%;background:var(--gold);animation-delay:.55s}
  .confetti i:nth-child(6){left:77%;background:var(--coral);animation-delay:.25s}
  .confetti i:nth-child(7){left:89%;background:var(--green);animation-delay:1.35s}

  @keyframes turnPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes riseIn{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  @keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(640px) rotate(520deg)}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
  @media (max-width:430px){
    .wrap{padding:8px 9px 28px}
    .brand h1{font-size:18px}
    .scoreboard{gap:6px}
    .player{padding:7px 8px}
    .player .pip{font-size:23px}
    .cube-panel{min-width:78px;padding:6px}
    .cube{width:34px;height:34px;font-size:18px}
    .board-shell{padding:7px;border-radius:20px}
    .action{min-width:74px;padding:0 12px;font-size:14px}
    .die{width:42px;height:42px}
    .ghost-die{width:42px;height:42px}
  }
  @media (max-width:345px){
    .brand p{display:none}
    .icon-btn{min-width:44px;padding:0 7px;font-size:13px}
    select#aiLevel{min-width:64px}
    .player .pip{font-size:20px}
    .cube-panel{min-width:68px}
    .cube-btn{min-width:44px;padding:2px 5px}
    .action{min-width:64px;padding:0 9px;font-size:13px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="icon-btn" href="../index.html" aria-label="返回桌游目录">← 目录</a>
    <div class="brand">
      <h1>双陆棋 Backgammon</h1>
      <p>24 点 · 15 枚对 15 枚 · 开局 pip 167</p>
    </div>
    <select id="aiLevel" aria-label="选择 AI 难度">
      <option value="easy">轻松</option>
      <option value="normal" selected>标准</option>
      <option value="hard">困难</option>
    </select>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深色或浅色主题">◐</button>
    <button class="icon-btn" id="muteBtn" type="button" aria-label="静音或开启音效" aria-pressed="false">♪</button>
  </header>

  <main>
    <section class="scoreboard" aria-label="双方状态与倍数方块">
      <div class="player" id="playerWhite">
        <div class="who"><span class="chip white" aria-hidden="true"></span><span class="nm" id="whiteName">你 · 白方</span><span class="badge" id="whiteBadge"></span></div>
        <div class="pip" id="whitePip">167<small> pip</small></div>
        <div class="meta"><span>离盘 <b id="whiteOff">0</b>/15</span><span>bar <b id="whiteBar">0</b></span></div>
      </div>
      <div class="cube-panel" aria-label="倍数方块">
        <div class="cube" id="cubeValue" aria-live="polite">1</div>
        <small id="cubeOwner">未加倍</small>
        <div class="cube-row">
          <button class="cube-btn primary" id="doubleBtn" type="button" aria-label="要求加倍">加倍</button>
          <button class="cube-btn primary" id="takeBtn" type="button" aria-label="接受加倍" hidden>接受</button>
          <button class="cube-btn coral" id="passBtn" type="button" aria-label="放弃并认输" hidden>放弃</button>
        </div>
      </div>
      <div class="player" id="playerBlack">
        <div class="who"><span class="chip black" aria-hidden="true"></span><span class="nm" id="blackName">黑檀对手</span><span class="badge" id="blackBadge"></span></div>
        <div class="pip" id="blackPip">167<small> pip</small></div>
        <div class="meta"><span>离盘 <b id="blackOff">0</b>/15</span><span>bar <b id="blackBar">0</b></span></div>
      </div>
    </section>

    <section class="board-shell" aria-label="双陆棋盘">
      <div class="board" id="board"></div>
    </section>

    <section class="controls" aria-label="骰子与操作">
      <div class="dice-row" id="diceRow">
        <span class="dice-label">骰子</span>
        <div class="dice-set" id="diceSet"></div>
      </div>
      <div class="turn-note" id="turnNote" aria-live="polite"></div>
      <div class="action-row">
        <button class="action primary" id="rollBtn" type="button" aria-label="掷骰">掷骰</button>
        <button class="action" id="endTurnBtn" type="button" aria-label="没有合法走法，结束回合" hidden>结束回合</button>
        <button class="action" id="undoBtn" type="button" aria-label="撤销上一步">撤销</button>
        <button class="action" id="newBtn" type="button" aria-label="开始新的一局">新局</button>
      </div>
      <div class="hint" id="hint"></div>
    </section>

    <section class="log" aria-label="对局记录">
      <h2>对局记录</h2>
      <ul id="logList"></ul>
    </section>
  </main>

  <footer class="foot">
    <a href="rules.html">完整规则</a>
    <a href="online.html">联机对战</a>
    <a href="../index.html">更多桌游</a>
  </footer>
</div>

<div class="finale" id="finale" role="dialog" aria-modal="true" aria-labelledby="finaleTitle">
  <div class="confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="finale-card">
    <div class="crown" aria-hidden="true">♛</div>
    <h2 id="finaleTitle">结算</h2>
    <p id="finaleSub"></p>
    <div class="finale-grid" id="finaleGrid"></div>
    <button class="action primary" id="restartBtn" type="button" style="width:100%">再来一局</button>
  </div>
</div>

<script src="../../shared/sfx.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var E = window.BackgammonPremiumEngine;
  var D = window.BackgammonPremiumData;
  var UI = window.BGPremiumUI;
  var game = null;
  var selected = null;
  var undoStack = [];
  var injectedDice = null;
  var aiBusy = false;
  var aiTimer = null;
  var eventCursor = 0;
  var fast = /(?:\?|&)fast=1/.test(location.search);

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function safeSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

  // ---- theme -------------------------------------------------------------
  var theme = safeGet('bgp-theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
  function effectiveLight() {
    var attr = document.documentElement.getAttribute('data-theme');
    if (attr === 'light') return true;
    if (attr === 'dark') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  }
  function updateThemeLabel() {
    $('themeBtn').setAttribute('aria-label', effectiveLight() ? '切换到深色主题' : '切换到浅色主题');
  }
  updateThemeLabel();

  // ---- shared sound ------------------------------------------------------
  var Sfx = window.Sfx;
  var muted = safeGet('bgp-muted') === '1';
  if (Sfx && muted) Sfx.mute(true);
  $('muteBtn').setAttribute('aria-pressed', muted ? 'true' : 'false');
  $('muteBtn').textContent = muted ? '×' : '♪';
  function sfx(name) { if (!muted && Sfx) Sfx.play(name); }
  $('muteBtn').addEventListener('click', function () {
    muted = !muted;
    safeSet('bgp-muted', muted ? '1' : '0');
    if (Sfx) Sfx.mute(muted);
    $('muteBtn').setAttribute('aria-pressed', muted ? 'true' : 'false');
    $('muteBtn').textContent = muted ? '×' : '♪';
    if (!muted) sfx('click');
  });
  $('themeBtn').addEventListener('click', function () {
    var next = effectiveLight() ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    safeSet('bgp-theme', next);
    updateThemeLabel();
    sfx('click');
  });

  // ---- game --------------------------------------------------------------
  function aiLevel() {
    var v = $('aiLevel').value;
    return E.AI_LEVELS[v] ? v : 'normal';
  }
  $('aiLevel').value = safeGet('bgp-level') || 'normal';
  $('aiLevel').addEventListener('change', function () {
    safeSet('bgp-level', aiLevel());
    sfx('click');
  });

  function start() {
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
    game = E.setup({
      seed: (Date.now() % 1000000) + 37,
      names: ['你 · 白方', '黑檀对手'],
      ai: [false, true]
    });
    selected = null;
    undoStack = [];
    injectedDice = null;
    aiBusy = false;
    eventCursor = 0;
    $('finale').classList.remove('show');
    render();
  }

  function humanCanAct() {
    return game && game.phase !== 'over' && game.turn === 0 && !aiBusy && !game.cube.pending;
  }

  function snapshot() {
    return JSON.stringify(game);
  }
  function pushUndo() {
    undoStack.push(snapshot());
    if (undoStack.length > 100) undoStack.shift();
  }

  function consumeEvents() {
    if (!game || !game.events.length) return;
    if (eventCursor > game.events.length) eventCursor = 0;
    for (; eventCursor < game.events.length; eventCursor++) {
      var ev = game.events[eventCursor];
      if (ev.type === 'roll') sfx('dice');
      else if (ev.type === 'move') sfx('move');
      else if (ev.type === 'hit') sfx('capture');
      else if (ev.type === 'double' || ev.type === 'take') sfx('notify');
      else if (ev.type === 'over') sfx(ev.winner === 0 ? 'win' : 'lose');
      else if (ev.type === 'turn') sfx('notify');
    }
  }

  function render() {
    if (!game) return;
    var view = E.publicView(game, 0);
    var humanTurn = game.turn === 0;
    var interactive = humanCanAct();

    // Score panels
    $('whitePip').innerHTML = view.pip[0] + '<small> pip</small>';
    $('blackPip').innerHTML = view.pip[1] + '<small> pip</small>';
    $('whiteOff').textContent = view.off[0];
    $('blackOff').textContent = view.off[1];
    $('whiteBar').textContent = view.bar[0];
    $('blackBar').textContent = view.bar[1];
    $('playerWhite').classList.toggle('active', humanTurn && game.phase !== 'over');
    $('playerBlack').classList.toggle('active', !humanTurn && game.phase !== 'over');
    $('whiteBadge').textContent = game.phase === 'over' && game.winner === 0 ? '胜' : (humanTurn && game.phase !== 'over' ? '你的回合' : '');
    $('blackBadge').textContent = game.phase === 'over' && game.winner === 1 ? '胜' : (!humanTurn && game.phase !== 'over' ? '对手回合' : '');
    $('whiteName').textContent = '你 · 白方';
    $('blackName').textContent = '黑檀对手 · AI';

    // Cube
    $('cubeValue').textContent = view.cube.value;
    $('cubeOwner').textContent = view.cube.owner == null ? (view.cube.value === 1 ? '未加倍' : '居中') : (view.cube.owner === 0 ? '归你' : '归对手');
    $('doubleBtn').disabled = !view.canDouble;
    $('doubleBtn').hidden = false;
    var canTake = view.cubeActions.indexOf('take') >= 0;
    var canPass = view.cubeActions.indexOf('pass') >= 0;
    $('takeBtn').hidden = !canTake;
    $('passBtn').hidden = !canPass;
    $('takeBtn').disabled = !canTake;
    $('passBtn').disabled = !canPass;
    if (canTake || canPass) $('doubleBtn').disabled = true;

    // Board
    var tap = interactive ? onBoardTap : null;
    UI.renderBoard($('board'), view, {
      prefix: 'game',
      interactive: interactive,
      selected: selected,
      onTap: tap
    });

    // Dice
    var set = $('diceSet');
    set.innerHTML = '';
    var dice = view.dice.length ? view.dice : view.rolled;
    if (!dice.length) {
      set.appendChild(el('span', 'ghost-die', '–'));
      set.appendChild(el('span', 'ghost-die', '–'));
    } else {
      dice.forEach(function (d) { set.insertAdjacentHTML('beforeend', UI.dieMarkup(d)); });
      if (view.rolled.length === 2 && view.rolled[0] === view.rolled[1] && view.dice.length === 4) {
        set.appendChild(el('span', 'doubles-tag', '对子 · 四步'));
      }
    }

    // Turn note
    var note = $('turnNote');
    note.innerHTML = '';
    if (game.phase === 'over') {
      note.textContent = view.score ? (view.score.winner === 0 ? '你赢了！' : '对手获胜') : '对局结束';
    } else if (view.cube.pending) {
      note.textContent = view.cube.pending.by === 0 ? '你要求加倍，等待对手回应…' : '对手要求加倍：接受或放弃';
    } else if (game.turn === 0) {
      var dot = el('span', 'dot' + (game.phase === 'roll' ? '' : ' wait'));
      note.appendChild(dot);
      note.appendChild(document.createTextNode(game.phase === 'roll' ? '轮到你：掷骰' : (view.legalMoves.length ? '轮到你：点棋子，再点目标点' : '没有合法走法，请结束回合')));
    } else {
      var dot2 = el('span', 'dot wait');
      note.appendChild(dot2);
      note.appendChild(document.createTextNode(aiBusy ? '对手正在思考…' : '对手回合'));
    }

    // Buttons
    $('rollBtn').disabled = !view.canRoll;
    $('rollBtn').hidden = view.cube.pending || game.phase !== 'roll' || game.turn !== 0;
    $('endTurnBtn').hidden = !(view.canEndTurn && game.turn === 0);
    $('endTurnBtn').disabled = !(view.canEndTurn && game.turn === 0);
    $('undoBtn').disabled = undoStack.length === 0 || aiBusy;

    // Hint
    if (game.phase === 'over') $('hint').textContent = '本局结束；可以再来一局。';
    else if (view.cube.pending) $('hint').textContent = '倍数方块只在掷骰前使用；接受后倍数翻倍，放弃则输掉当前赌注。';
    else if (game.turn === 1) $('hint').textContent = 'AI 正在按 pip、散子、bar 与 home board 进度选择走法。';
    else if (selected != null) {
      var n = view.legalMoves.filter(function (m) { return String(m.from) === String(selected); }).length;
      $('hint').textContent = '已选 ' + (selected === 'bar' ? 'bar' : selected + ' 点') + '：绿色目标可落子' + (n ? '（' + n + ' 种走法）' : '');
    } else if (game.phase === 'move') $('hint').textContent = '先点自己的棋子，再点目标点；离盘时点右侧 OFF 区。';
    else $('hint').textContent = '掷骰后必须尽量用完两枚骰子；只能走一枚时，必须走较大的那枚。';

    // Log
    var list = $('logList');
    list.innerHTML = '';
    view.log.slice(-9).forEach(function (line) { list.appendChild(el('li', null, line)); });

    if (game.phase === 'over') renderFinale(view);
    else $('finale').classList.remove('show');
  }

  function renderFinale(view) {
    var box = $('finale');
    var s = view.score || {};
    var won = s.winner === 0;
    $('finaleTitle').textContent = won ? '你赢了！' : '对手获胜';
    $('finaleSub').textContent = (s.type === 'backgammon' ? 'backgammon ×3' : s.type === 'gammon' ? 'gammon ×2' : '单局 ×1') +
      (s.concedes ? ' · 对方放弃加倍' : '') + ' · 倍数方块 ' + (s.cubeValue || 1);
    var grid = $('finaleGrid');
    grid.innerHTML = '';
    var rows = [
      ['本局得分', (s.points == null ? '—' : s.points) + ' 分'],
      ['离盘', (view.off[0] || 0) + ' / 15 对 ' + (view.off[1] || 0) + ' / 15'],
      ['pip', view.pip[0] + ' 对 ' + view.pip[1]],
      ['倍数', '×' + (s.multiplier || 1) + ' · cube ' + (s.cubeValue || 1)]
    ];
    rows.forEach(function (pair) {
      var row = el('div', 'frow');
      row.appendChild(el('span', null, pair[0]));
      var b = el('b', null, pair[1]);
      row.appendChild(b);
      grid.appendChild(row);
    });
    if (!box.classList.contains('show')) {
      box.classList.add('show');
      sfx(won ? 'win' : 'lose');
    }
  }

  function legalMoveTo(from, to) {
    if (!game) return null;
    var list = E.legalMoves(game, 0);
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].from) === String(from) && String(list[i].to) === String(to)) return list[i];
    }
    return null;
  }
  function sourcesFor(point) {
    return E.legalMoves(game, 0).some(function (m) { return String(m.from) === String(point); });
  }
  function applyHumanMove(move) {
    if (!move || !humanCanAct()) return;
    pushUndo();
    try { E.applyMove(game, move); } catch (err) { $('hint').textContent = '这步现在不能走。'; return; }
    selected = null;
    consumeEvents();
    render();
    if (game.phase !== 'over' && game.turn === 1) pumpAI();
  }
  function onBoardTap(tap) {
    if (!humanCanAct()) return;
    if (tap.type === 'off') {
      if (selected != null) {
        var offMove = legalMoveTo(selected, 'off');
        if (offMove) { applyHumanMove(offMove); return; }
      }
      return;
    }
    if (tap.type === 'bar') {
      if (tap.side !== 0) return;
      if (game.bar[0] <= 0) return;
      selected = selected === 'bar' ? null : 'bar';
      render();
      return;
    }
    var point = tap.point;
    if (selected != null) {
      var move = legalMoveTo(selected, point);
      if (move) { applyHumanMove(move); return; }
      if (selected === point) { selected = null; render(); return; }
    }
    if (sourcesFor(point)) {
      selected = point;
      render();
      return;
    }
    // Destination-first tap: if exactly one legal move lands here, play it.
    var candidates = E.legalMoves(game, 0).filter(function (m) { return String(m.to) === String(point); });
    if (candidates.length === 1) { applyHumanMove(candidates[0]); return; }
    selected = null;
    render();
  }

  function roll() {
    if (!game || !humanCanAct() || game.phase !== 'roll') return;
    try {
      if (injectedDice) { E.rollDice(game, { dice: injectedDice }); injectedDice = null; }
      else E.rollDice(game);
    } catch (err) { return; }
    selected = null;
    consumeEvents();
    render();
  }

  function endTurnHuman() {
    if (!game || !humanCanAct() || game.phase !== 'move') return;
    try { E.endTurn(game); } catch (err) { return; }
    selected = null;
    consumeEvents();
    render();
    if (game.turn === 1) pumpAI();
  }

  function undo() {
    if (!undoStack.length || aiBusy) return;
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
    try { game = JSON.parse(undoStack.pop()); } catch (err) { return; }
    selected = null;
    aiBusy = false;
    eventCursor = 0;
    $('finale').classList.remove('show');
    render();
    sfx('click');
  }

  function pumpAI() {
    if (!game || game.phase === 'over') { aiBusy = false; render(); return; }
    if (game.cube.pending) {
      if (E.cubeResponder(game) !== 1) { aiBusy = false; render(); return; }
      aiBusy = true;
      render();
      aiTimer = setTimeout(function () {
        var reply = E.aiCubeResponse(game, 1);
        try { if (reply === 'pass') E.passCube(game, 1); else E.takeCube(game, 1); } catch (err) {}
        consumeEvents();
        aiBusy = false;
        render();
        if (game.phase !== 'over' && game.turn === 1) pumpAI();
      }, fast ? 8 : 340);
      return;
    }
    if (game.turn !== 1) { aiBusy = false; render(); return; }
    aiBusy = true;
    render();
    aiTimer = setTimeout(function () {
      if (!game || game.turn !== 1 || game.phase === 'over') { aiBusy = false; render(); return; }
      try {
        if (game.phase === 'roll') {
          E.rollDice(game);
        } else if (game.phase === 'move') {
          var seq = E.aiSequence(game, 1, { level: aiLevel() });
          if (seq && seq.moves.length) E.applyMove(game, seq.moves[0]);
          else E.endTurn(game);
        }
      } catch (err) {
        try { if (game.phase === 'move') E.endTurn(game); } catch (err2) {}
      }
      consumeEvents();
      if (game.phase === 'over' || game.turn === 0) {
        aiBusy = false;
        render();
      } else {
        render();
        pumpAI();
      }
    }, fast ? 8 : 360);
  }

  function doubleHuman() {
    if (!game || !E.canDouble(game, 0)) return;
    try { E.doubleCube(game, 0); } catch (err) { return; }
    consumeEvents();
    render();
    pumpAI();
  }
  function takeHuman() {
    if (!game || !game.cube.pending || E.cubeResponder(game) !== 0) return;
    try { E.takeCube(game, 0); } catch (err) { return; }
    consumeEvents();
    render();
  }
  function passHuman() {
    if (!game || !game.cube.pending || E.cubeResponder(game) !== 0) return;
    try { E.passCube(game, 0); } catch (err) { return; }
    consumeEvents();
    render();
  }

  $('rollBtn').addEventListener('click', roll);
  $('endTurnBtn').addEventListener('click', endTurnHuman);
  $('undoBtn').addEventListener('click', undo);
  $('newBtn').addEventListener('click', start);
  $('restartBtn').addEventListener('click', start);
  $('doubleBtn').addEventListener('click', doubleHuman);
  $('takeBtn').addEventListener('click', takeHuman);
  $('passBtn').addEventListener('click', passHuman);

  document.addEventListener('keydown', function (e) {
    if (!game || e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); roll(); }
    else if (e.key === 'u' || e.key === 'U') { e.preventDefault(); undo(); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); start(); }
    else if (e.key === 'Escape') { selected = null; render(); }
  });

  // ---------------------------------------------------------- test scenarios --
  function scenario(name) {
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
    if (name === 'start' || !name) { start(); return; }
    var s = E.setup({ seed: 77123, names: ['你 · 白方', '黑檀对手'], ai: [false, true] });
    s.points = new Array(25).fill(0);
    s.bar = [0, 0];
    s.off = [0, 0];
    s.turn = 0;
    s.phase = 'roll';
    s.dice = [];
    s.rolled = [];
    s.turnNumber = 1;
    s.cube = { value: 1, owner: null, pending: null };
    s.winner = null;
    s.scoreInfo = null;
    s.endReason = null;
    s.history = [];
    s.log = [];
    s.events = [];
    if (name === 'backgammonFinish') {
      // White has 14 off and one checker on the 1-point. Black has one checker
      // stranded in White's home board, so bearing off wins a backgammon ×3.
      s.off[0] = 14;
      s.points[1] = 1;
      s.points[3] = -1;
      s.points[19] = -5;
      s.points[20] = -5;
      s.points[22] = -4;
    } else if (name === 'gammonFinish') {
      s.off[0] = 14;
      s.points[1] = 1;
      s.points[19] = -5;
      s.points[20] = -5;
      s.points[22] = -5;
    } else if (name === 'cube') {
      s.points = [0, -2, 0, 0, 0, 0, 5, 0, 3, 0, 0, 0, -5, 5, 0, 0, 0, 0, -3, 0, -5, 0, 0, 0, 2];
    }
    game = s;
    selected = null;
    undoStack = [];
    injectedDice = null;
    aiBusy = false;
    eventCursor = 0;
    $('finale').classList.remove('show');
    render();
  }

  window.__premium = {
    state: function () { return game ? E.publicView(game, 0) : null; },
    over: function () { return !!game && game.phase === 'over'; },
    start: start,
    scenario: scenario,
    roll: function (a, b) {
      if (a != null && b != null) injectedDice = [Number(a), Number(b)];
      roll();
    },
    move: function (from, to, die) {
      var m = { from: from === 'bar' ? 'bar' : Number(from), to: to === 'off' ? 'off' : Number(to), die: die == null ? null : Number(die) };
      var list = E.legalMoves(game, 0);
      var found = list.filter(function (x) {
        return String(x.from) === String(m.from) && String(x.to) === String(m.to) && (m.die == null || x.die === m.die);
      })[0];
      if (found) applyHumanMove(found);
      return !!found;
    },
    undo: undo,
    endTurn: endTurnHuman,
    aiLevel: aiLevel,
    fast: fast,
    engine: E
  };

  start();
})();
</script>
</body>
</html>
