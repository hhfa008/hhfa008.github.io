<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>DOUDIZHU art composition</title>
<style>
  :root{
    --font-serif:"Songti SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
    --art-paper:url("../../assets/art/premium/doudizhu/card-paper.webp");
    --art-back:url("../../assets/art/premium/doudizhu/card-back.webp");
    --art-felt:url("../../assets/art/premium/doudizhu/table-felt.webp");
    --art-chip:url("../../assets/art/premium/doudizhu/chip.webp");
    --ink:#f8eeda;--muted:#cbb290;--gold:#e6bd76;--gold2:#f8e2b0;
    --red:#b53026;--red2:#7c1f1a;--felt:#124635;--paper:#f6efdf;--paper2:#e4d5b8;--blackInk:#1d1712;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#120b0a}
  body{width:1200px;height:1200px;overflow:hidden;color:var(--ink);font-family:var(--font-sans)}
  .stage{position:absolute;inset:0;overflow:hidden;background:
    radial-gradient(820px 620px at 16% -4%,rgba(150,58,44,.52),transparent 62%),
    radial-gradient(900px 700px at 104% 106%,rgba(28,74,58,.5),transparent 64%),
    linear-gradient(156deg,#261511,#0c0807 74%)}
  .stage::before{content:"";position:absolute;inset:0;background:var(--art-felt) center/cover no-repeat;opacity:.14;filter:saturate(.7) contrast(1.08);mix-blend-mode:soft-light}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 32%,rgba(0,0,0,.55) 100%);pointer-events:none}
  .frame{position:absolute;inset:24px;border:1px solid rgba(230,189,118,.4);border-radius:28px;box-shadow:inset 0 0 0 7px rgba(230,189,118,.05),0 40px 100px rgba(0,0,0,.55);pointer-events:none;z-index:9}
  .frame::before,.frame::after{content:"";position:absolute;width:58px;height:58px;border:2px solid rgba(230,189,118,.48)}
  .frame::before{left:14px;top:14px;border-right:0;border-bottom:0;border-radius:17px 0 0 0}
  .frame::after{right:14px;bottom:14px;border-left:0;border-top:0;border-radius:0 0 17px 0}
  .content{position:absolute;inset:62px;z-index:3;display:flex;flex-direction:column}

  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
  .brand{display:flex;align-items:center;gap:18px}
  .seal{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;flex:none;
    background:radial-gradient(circle at 34% 27%,rgba(255,245,220,.5),transparent 40%),linear-gradient(150deg,#d8b06d,#9a5f2c 70%,#5c3416);
    border:1px solid rgba(248,226,176,.62);font-family:var(--font-serif);font-weight:700;font-size:31px;color:#2d1a09;
    box-shadow:0 20px 42px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.45);transform:rotate(-3deg)}
  h1{margin:0;font-family:var(--font-serif);font-weight:700;line-height:.92;letter-spacing:.16em;font-size:100px;text-shadow:0 14px 44px rgba(0,0,0,.5)}
  h1 span{color:var(--gold2);font-size:.44em;letter-spacing:.24em;margin-left:.2em}
  .sub{margin:13px 0 0;font-size:17px;letter-spacing:.28em;color:var(--muted);font-weight:600}
  .chips{display:flex;flex-direction:column;gap:9px;align-items:flex-end}
  .chip{display:inline-flex;align-items:center;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid rgba(230,189,118,.36);background:rgba(16,12,8,.62);color:var(--gold2);font-size:14px;letter-spacing:.05em;font-weight:700;white-space:nowrap}
  .chip b{color:#fff3d6}

  .main{flex:1;display:flex;align-items:center;justify-content:center;padding:14px 0}
  .table-wrap{position:relative;width:1000px;padding:22px 24px 18px;border-radius:30px;border:1px solid rgba(230,189,118,.4);
    background:radial-gradient(ellipse at 50% 40%,rgba(24,92,68,.5),transparent 70%),linear-gradient(155deg,rgba(20,70,52,.84),rgba(8,28,22,.94)),var(--art-felt) center/cover no-repeat;
    box-shadow:0 48px 96px rgba(0,0,0,.56),inset 0 2px 0 rgba(255,255,255,.14),inset 0 -3px 0 rgba(0,0,0,.5)}
  .table-wrap::before{content:"";position:absolute;inset:9px;border:1px solid rgba(230,189,118,.2);border-radius:22px;pointer-events:none}
  .seat-row{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center;margin:5px 0}
  .seat-label{padding:9px 11px;border-radius:13px;border:1px solid rgba(230,189,118,.3);background:rgba(12,20,16,.55);min-width:0}
  .seat-label b{display:block;font-family:var(--font-serif);font-size:19px;letter-spacing:.06em}
  .seat-label span{display:block;margin-top:2px;font-size:12px;color:var(--muted);letter-spacing:.05em}
  .row-cards{display:flex;align-items:flex-end;min-height:82px;padding-left:2px}
  .row-cards .card{margin-left:-24px}
  .row-cards .card:first-child{margin-left:0}
  .bottom-line{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px;padding-top:13px;border-top:1px solid rgba(230,189,118,.2)}
  .bottom-line .lbl{font-size:13px;letter-spacing:.22em;color:var(--gold2);font-weight:800}
  .bottom-line .row-cards{min-height:62px}
  .chip-img{width:64px;height:64px;border-radius:50%;background:var(--art-chip) center/contain no-repeat;box-shadow:0 10px 18px rgba(0,0,0,.4);flex:none}
  .footer{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
  .note{font-size:15px;letter-spacing:.12em;color:var(--muted);font-weight:600}
  .note b{color:var(--gold2)}
  .ruler{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;letter-spacing:.06em}
  .ruler i{display:block;width:170px;height:1px;background:linear-gradient(90deg,rgba(230,189,118,.7),transparent);font-style:normal}

  /* card */
  .card{position:relative;flex:none;width:58px;height:82px;border-radius:7px;overflow:hidden;
    background:linear-gradient(150deg,var(--paper),var(--paper2) 80%),var(--art-paper) center/cover no-repeat;
    border:1px solid rgba(120,82,40,.55);
    box-shadow:0 3px 0 rgba(70,45,20,.55),0 7px 12px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.82)}
  .card.small{width:36px;height:51px;border-radius:5px}
  .card.back{background:linear-gradient(150deg,#8a2c25,#4c1614),var(--art-back) center/cover no-repeat;border-color:rgba(230,189,118,.55)}
  .card .corner{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;font-family:var(--font-serif);font-weight:700}
  .card .corner.tl{left:3px;top:2px}
  .card .corner.br{right:3px;bottom:2px;transform:rotate(180deg)}
  .card .corner b{font-size:15px}
  .card.small .corner b{font-size:12px}
  .card .corner svg{width:10px;height:10px}
  .card.small .corner svg{width:8px;height:8px}
  .card.red .corner,.card.red .pips,.card.red .bigpip{color:var(--red);fill:var(--red)}
  .card.black .corner,.card.black .pips,.card.black .bigpip{color:var(--blackInk);fill:var(--blackInk)}
  .card .pips{position:absolute;left:27%;right:27%;top:17%;bottom:17%}
  .card .pips svg{position:absolute;width:8px;height:8px;transform:translate(-50%,-50%);fill:currentColor}
  .card.small .pips svg{width:6px;height:6px}
  .card .bigpip{position:absolute;left:50%;top:53%;width:42%;height:42%;transform:translate(-50%,-50%);fill:currentColor}
  .card .joker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);writing-mode:vertical-rl;font-family:var(--font-serif);font-weight:700;font-size:16px;color:var(--red)}
  .card.small .joker{font-size:11px}

  /* OG */
  body.og{height:630px}
  body.og .content{inset:44px 54px}
  body.og h1{font-size:74px}
  body.og .seal{width:58px;height:58px;font-size:24px}
  body.og .sub{margin-top:9px;font-size:14px;letter-spacing:.2em}
  body.og .chip{min-height:32px;font-size:12px;padding:0 13px}
  body.og .layout{display:grid;grid-template-columns:1fr 660px;gap:22px;flex:1;align-items:center}
  body.og .table-wrap{width:660px;padding:14px 16px;border-radius:22px}
  body.og .seat-row{grid-template-columns:78px 1fr;gap:10px;margin:3px 0}
  body.og .seat-label{padding:6px 8px}
  body.og .seat-label b{font-size:15px}
  body.og .seat-label span{font-size:12px}
  body.og .row-cards{min-height:54px}
  body.og .row-cards .card{margin-left:-18px}
  body.og .card{width:40px;height:56px}
  body.og .card .corner b{font-size:12px}
  body.og .bottom-line{margin-top:8px;padding-top:9px}
  body.og .chip-img{width:46px;height:46px}
  body.og .footer{position:absolute;left:0;right:0;bottom:0}

  /* detail */
  body.detail{height:800px}
  body.detail .content{inset:44px 54px}
  body.detail h1{font-size:54px}
  body.detail .seal{width:52px;height:52px;font-size:21px}
  body.detail .sub{margin-top:7px;font-size:13px;letter-spacing:.2em}
  body.detail .chip{min-height:30px;font-size:12px;padding:0 12px}
  body.detail .table-wrap{width:100%;padding:16px 18px;border-radius:24px}
  body.detail .seat-row{grid-template-columns:104px 1fr;gap:12px;margin:3px 0}
  body.detail .seat-label b{font-size:17px}
  body.detail .row-cards{min-height:64px}
  body.detail .row-cards .card{margin-left:-22px}
  body.detail .card{width:48px;height:68px}
  body.detail .card .corner b{font-size:13px}
  body.detail .bottom-line{margin-top:8px;padding-top:9px}
  body.detail .side-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-top:14px}
  body.detail .panel{border:1px solid rgba(230,189,118,.3);border-radius:16px;background:rgba(22,16,12,.7);padding:12px 14px}
  body.detail .panel h2{margin:0 0 7px;font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  body.detail .line{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed rgba(230,189,118,.16)}
  body.detail .line b{color:var(--gold2)}
  body.detail .types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:6px}
  body.detail .type{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed rgba(230,189,118,.14)}
  body.detail .type .name{font-size:13px;font-weight:800;color:var(--gold2)}
  body.detail .type .mini{display:flex;gap:0;align-items:center}
  body.detail .type .mini .card{margin-left:-12px}
  body.detail .type .mini .card:first-child{margin-left:0}
  body.detail .materials{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  body.detail .mat{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);line-height:1.45}
  body.detail .mat i{display:block;width:42px;height:42px;border-radius:9px;flex:none;background-position:center;background-size:cover;border:1px solid rgba(230,189,118,.3)}
  body.detail .mat.paper i{background-image:var(--art-paper)}
  body.detail .mat.back i{background-image:var(--art-back)}
  body.detail .mat.felt i{background-image:var(--art-felt)}
  body.detail .mat.chip i{background-image:var(--art-chip);border-radius:50%}
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/doudizhu-premium/art-render.html">
<meta name="description" content="内部美术合成页：用代码绘制棋盘、棋子与牌面，生成封面 / OG / 详情图；不参与游戏入口。">
<meta name="robots" content="noindex">
</head>
<body>
<div class="stage"></div>
<div class="vignette"></div>
<div class="frame"></div>
<div class="content" id="content"></div>
<script src="../../shared/shuffle.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.DoudizhuPremiumEngine;
  var SHOT = new URLSearchParams(location.search).get('shot') || 'cover';
  var SEED = Number(new URLSearchParams(location.search).get('seed') || 20261110);
  var SUIT = {
    0: 'M12 2C9 6 4 8.5 4 12.5A4 4 0 0 0 11 15.5C10.6 17.5 9.5 19 8 20h8c-1.5-1-2.6-2.5-3-4.5A4 4 0 0 0 20 12.5C20 8.5 15 6 12 2z',
    1: 'M12 21S3 14.5 3 8.5A4.6 4.6 0 0 1 12 6a4.6 4.6 0 0 1 9 2.5C21 14.5 12 21 12 21z',
    2: 'M12 2a4 4 0 0 1 4 4c0 1.4-.7 2.6-1.8 3.3A4 4 0 1 1 13 16h-2a4 4 0 1 1-1.2-6.7A4 4 0 0 1 12 2zM11 16h2l1 6h-4z',
    3: 'M12 2l7 10-7 10-7-10z'
  };
  var CROWN = 'M4 17l2-8 4 4 2-7 2 7 4-4 2 8zM5 19h14v2H5z';
  function pipPositions(n) {
    var L = '22%', R = '78%', C = '50%', T = '10%', M = '50%', B = '90%', T2 = '30%', B2 = '70%';
    var map = {
      2: [[C, T], [C, B]], 3: [[C, T], [C, M], [C, B]],
      4: [[L, T], [R, T], [L, B], [R, B]], 5: [[L, T], [R, T], [C, M], [L, B], [R, B]],
      6: [[L, T], [R, T], [L, M], [R, M], [L, B], [R, B]],
      7: [[L, T], [R, T], [C, T2], [L, M], [R, M], [L, B], [R, B]],
      8: [[L, T], [R, T], [C, T2], [L, M], [R, M], [C, B2], [L, B], [R, B]],
      9: [[L, T], [R, T], [L, T2], [R, T2], [C, M], [L, B2], [R, B2], [L, B], [R, B]],
      10: [[L, T], [R, T], [C, T2], [L, T2], [R, T2], [L, B2], [R, B2], [C, B2], [L, B], [R, B]]
    };
    return map[n] || [];
  }
  function card(c, small) {
    var r = c.r;
    var red = E.isRed(c);
    var cls = 'card' + (small ? ' small' : '') + ' ' + (red ? 'red' : 'black');
    var corner = function (pos) {
      var label = r >= 16 ? (r === E.BIG_JOKER ? '大' : '小') : E.rankName(r);
      var icon = r >= 16 ? CROWN : SUIT[c.s];
      return '<span class="corner ' + pos + '"><b>' + label + '</b><svg viewBox="0 0 24 24"><path d="' + icon + '"/></svg></span>';
    };
    if (r >= 16) {
      return '<span class="' + cls + '">' + corner('tl') + corner('br') +
        '<span class="joker">' + (r === E.BIG_JOKER ? '大王' : '小王') + '</span></span>';
    }
    if (r === 14) {
      return '<span class="' + cls + '">' + corner('tl') + corner('br') +
        '<svg class="bigpip" viewBox="0 0 24 24"><path d="' + SUIT[c.s] + '"/></svg></span>';
    }
    var pips = pipPositions(r).map(function (pos) {
      return '<svg style="left:' + pos[0] + ';top:' + pos[1] + '" viewBox="0 0 24 24"><path d="' + SUIT[c.s] + '"/></svg>';
    }).join('');
    return '<span class="' + cls + '">' + corner('tl') + corner('br') + '<span class="pips">' + pips + '</span></span>';
  }
  function row(cards, small) {
    return '<div class="row-cards">' + cards.map(function (c) { return card(c, small); }).join('') + '</div>';
  }
  function backCard() { return '<span class="card back"></span>'; }

  var dealt = E.deal(SEED);
  var hands = dealt.hands;
  var bottom = dealt.bottom;
  var total = hands[0].length + hands[1].length + hands[2].length + bottom.length;

  // Realism guard: the composed image must show a complete, legal deal.
  var audit = {
    seed: SEED,
    deck: E.makeDeck().length,
    hands: hands.map(function (h) { return h.length; }),
    bottom: bottom.length,
    landlord: hands[0].length + bottom.length,
    total: total,
    unique: (function () {
      var ids = {};
      hands.forEach(function (h) { h.forEach(function (c) { ids[c.id] = 1; }); });
      bottom.forEach(function (c) { ids[c.id] = 1; });
      return Object.keys(ids).length;
    })()
  };
  window.__ART_AUDIT = audit;
  if (audit.deck !== 54 || audit.total !== 54 || audit.unique !== 54 || audit.landlord !== 20 ||
      audit.hands.join(',') !== '17,17,17' || audit.bottom !== 3) {
    document.body.innerHTML = '<pre style="color:#fff;font-size:22px;padding:40px">REALISM FAIL\n' +
      JSON.stringify(audit, null, 2) + '</pre>';
    throw new Error('REALISM FAIL');
  }

  var content = document.getElementById('content');

  if (SHOT === 'cover') {
    content.innerHTML =
      '<div class="top"><div class="brand"><div class="seal">斗</div><div><h1>斗地主<span>叫分</span></h1>' +
      '<p class="sub">54 张 · 17+17+17 + 3 底牌 · 完整牌型</p></div></div>' +
      '<div class="chips"><span class="chip">3 人 · AI 或联机</span><span class="chip">单张 → 飞机带对 · 炸弹翻倍</span></div></div>' +
      '<div class="main"><div class="table-wrap">' +
      '<div class="seat-row"><div class="seat-label"><b>玩家 A</b><span>17 张 · 先叫</span></div>' + row(hands[0]) + '</div>' +
      '<div class="seat-row"><div class="seat-label"><b>玩家 B</b><span>17 张 · 农民</span></div>' + row(hands[1]) + '</div>' +
      '<div class="seat-row"><div class="seat-label"><b>玩家 C</b><span>17 张 · 农民</span></div>' + row(hands[2]) + '</div>' +
      '<div class="bottom-line"><div style="display:flex;align-items:center;gap:14px"><span class="lbl">底 牌 · 3</span>' +
      row(bottom, true) + '</div><div style="display:flex;align-items:center;gap:12px">' +
      '<div class="chip-img"></div><span class="note">底分 1 · 叫分 1/2/3 · 2^炸</span></div></div>' +
      '</div></div>' +
      '<div class="footer"><div class="note"><b>叫分</b>抢地主 → 底牌进手 → <b>先出完</b>者胜</div>' +
      '<div class="ruler"><i></i>17 + 17 + 17 + 3 = 54 · 牌面由代码绘制</div></div>';
    document.body.className = 'cover';
  } else if (SHOT === 'og') {
    document.body.className = 'og';
    content.innerHTML =
      '<div class="layout"><div><div class="top"><div class="brand"><div class="seal">斗</div><div><h1>斗地主</h1>' +
      '<p class="sub">叫分 · 完整牌型 · 3 人联机</p></div></div></div>' +
      '<p class="note" style="margin-top:20px;max-width:420px;line-height:1.7">54 张牌，17+17+17 加 3 张底牌。' +
      '从单张、顺子到飞机带对与王炸，叫分越高、炸弹越多，倍数越大。</p>' +
      '<div class="chips" style="flex-direction:row;flex-wrap:wrap;align-items:center;margin-top:16px">' +
      '<span class="chip">三档 AI</span><span class="chip">服务端权威判牌</span></div></div>' +
      '<div class="table-wrap">' +
      '<div class="seat-row"><div class="seat-label"><b>A</b><span>17 张</span></div>' + row(hands[0], true) + '</div>' +
      '<div class="seat-row"><div class="seat-label"><b>B</b><span>17 张</span></div>' + row(hands[1], true) + '</div>' +
      '<div class="seat-row"><div class="seat-label"><b>C</b><span>17 张</span></div>' + row(hands[2], true) + '</div>' +
      '<div class="bottom-line"><span class="lbl">底牌 3</span>' + row(bottom, true) + '<div class="chip-img"></div></div>' +
      '</div></div>';
  } else if (SHOT === 'detail1') {
    document.body.className = 'detail';
    content.innerHTML =
      '<div class="top"><div class="brand"><div class="seal">发</div><div><h1>完整发牌</h1>' +
      '<p class="sub">三家各 17 张 + 3 张底牌 = 54 张</p></div></div>' +
      '<div class="chips"><span class="chip">全部唯一 · 无重复</span><span class="chip">叫分最高者 +3 张</span></div></div>' +
      '<div class="main" style="padding:8px 0"><div class="table-wrap">' +
      '<div class="seat-row"><div class="seat-label"><b>座位 0</b><span>17 张 · 玩家</span></div>' + row(hands[0], true) + '</div>' +
      '<div class="seat-row"><div class="seat-label"><b>座位 1</b><span>17 张 · 玩家</span></div>' + row(hands[1], true) + '</div>' +
      '<div class="seat-row"><div class="seat-label"><b>座位 2</b><span>17 张 · AI</span></div>' + row(hands[2], true) + '</div>' +
      '<div class="seat-row"><div class="seat-label"><b>叫分后</b><span>地主 20 张</span></div>' + row(hands[0].concat(bottom), true) + '</div>' +
      '<div class="bottom-line"><span class="lbl">底 牌 · 3 张（并入地主）</span>' + row(bottom, true) + '<div class="chip-img"></div></div>' +
      '</div></div>' +
      '<div class="side-grid">' +
      '<div class="panel"><h2>发牌校验</h2>' +
      '<div class="line"><span>牌堆总数</span><b>' + audit.deck + '</b></div>' +
      '<div class="line"><span>三家手牌</span><b>' + audit.hands.join(' / ') + '</b></div>' +
      '<div class="line"><span>底牌</span><b>' + audit.bottom + '</b></div>' +
      '<div class="line"><span>合计 / 唯一</span><b>' + audit.total + ' / ' + audit.unique + '</b></div>' +
      '<div class="line"><span>叫分</span><b>1 · 2 · 3 / 不叫</b></div>' +
      '<div class="line"><span>地主手牌</span><b>20 张</b></div></div>' +
      '<div class="panel"><h2>记分</h2>' +
      '<div class="line"><span>底分</span><b>1</b></div>' +
      '<div class="line"><span>叫分</span><b>1 / 2 / 3</b></div>' +
      '<div class="line"><span>炸弹</span><b>每个 ×2</b></div>' +
      '<div class="line"><span>结算</span><b>地主 2 倍</b></div>' +
      '<p class="note" style="margin:9px 0 0;font-size:13px;line-height:1.6">分值 = 底分 × 叫分 × 2^(炸弹+王炸)。</p></div>' +
      '</div>' +
      '<div class="footer" style="margin-top:12px"><div class="note"><b>17</b> 张手牌 + <b>3</b> 张底牌，一张不多一张不少</div>' +
      '<div class="ruler"><i></i>seed ' + SEED + ' · 发牌可复现</div></div>';
  } else {
    document.body.className = 'detail';
    var TYPES = [
      ['单张', ['S9']], ['对子', ['H12', 'C12']], ['三张', ['S7', 'H7', 'D7']],
      ['三带一', ['S7', 'H7', 'D7', 'S4']], ['三带二', ['S7', 'H7', 'D7', 'S9', 'H9']],
      ['顺子 ≥5', ['S3', 'H4', 'C5', 'S6', 'H7']], ['连对 ≥3', ['S3', 'H3', 'S4', 'H4', 'S5', 'H5']],
      ['飞机 ≥2', ['S3', 'H3', 'C3', 'S4', 'H4', 'C4']], ['飞机带单', ['S3', 'H3', 'C3', 'S4', 'H4', 'C4', 'S5', 'H6']],
      ['飞机带对', ['S3', 'H3', 'C3', 'S4', 'H4', 'C4', 'S5', 'H5', 'S6', 'H6']],
      ['四带二', ['S8', 'H8', 'C8', 'D8', 'S3', 'H5']], ['四带两对', ['S8', 'H8', 'C8', 'D8', 'S3', 'H3', 'S5', 'H5']],
      ['炸弹', ['S9', 'H9', 'C9', 'D9']], ['王炸', ['SJ', 'BJ']]
    ];
    var ALL = {};
    E.makeDeck().forEach(function (c) { ALL[c.id] = c; });
    var typeHtml = TYPES.map(function (t) {
      var cards = t[1].map(function (id) { return ALL[id]; });
      var detected = E.detect(cards);
      if (!detected) throw new Error('REALISM FAIL: ' + t[0]);
      return '<div class="type"><span class="name">' + t[0] + ' · ' + detected.count + ' 张</span>' +
        '<span class="mini">' + cards.map(function (c) { return card(c, true); }).join('') + '</span></div>';
    }).join('');
    content.innerHTML =
      '<div class="top"><div class="brand"><div class="seal">型</div><div><h1>牌型与材质</h1>' +
      '<p class="sub">14 种牌型 · 同型同长才可压 · 炸弹与王炸例外</p></div></div>' +
      '<div class="chips"><span class="chip">Songti SC 700</span><span class="chip">花色标准 SVG</span></div></div>' +
      '<div class="panel" style="margin-top:12px"><h2>全部牌型（引擎实判）</h2><div class="types">' + typeHtml + '</div></div>' +
      '<div class="side-grid" style="grid-template-columns:1.1fr .9fr">' +
      '<div class="panel"><h2>真实规格</h2>' +
      '<div class="line"><span>扑克牌</span><b>63 × 88 mm · 300gsm</b></div>' +
      '<div class="line"><span>牌数 / 人数</span><b>54 张 / 3 人</b></div>' +
      '<div class="line"><span>发牌</span><b>17 · 17 · 17 + 3</b></div>' +
      '<div class="line"><span>地主</span><b>20 张 · 先出</b></div></div>' +
      '<div class="panel"><h2>材质</h2><div class="materials">' +
      '<div class="mat paper"><i></i><span>象牙白纸<br>300gsm</span></div>' +
      '<div class="mat back"><i></i><span>深红金纹<br>牌背</span></div>' +
      '<div class="mat felt"><i></i><span>墨绿羊毛<br>台呢</span></div>' +
      '<div class="mat chip"><i></i><span>39mm<br>筹码</span></div>' +
      '</div></div></div>';
  }

  document.title = 'DDZ art · ' + SHOT + ' · ' + audit.total + ' cards';
})();
</script>
</body>
</html>
