<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1220">
<title>五路三连 · 落子之间</title>
<meta name="description" content="《五路三连》是一款在 5×5 棋盘上进行的单机抽象棋。你执蓝方先行，AI 执红方，双方轮流行动。5×5 · 横竖三连">
<style>
  :root{--bg:#0d1220;--panel:#1b2440;--ink:#eef3ff;--muted:#9fb0d6;--line:#33436e;--blue:#5b9dff;--red:#ff7b7b;--gold:#ffd166}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;background:radial-gradient(700px 420px at 50% -12%,#23315f,#0d1220 62%) fixed;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:430px;margin:0 auto;padding:10px 12px 30px}
  header{display:flex;align-items:center;gap:8px}
  h1{flex:1;min-width:0;margin:0;font-size:18px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:52px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
  .sub{margin:8px 0 2px;text-align:center;color:var(--muted);font-size:13px}
  .status{margin:10px auto 0;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:center;font-weight:700;min-height:44px;display:flex;align-items:center;justify-content:center}
  .status.win{color:var(--gold)}
  .board{display:grid;gap:4px;width:min(94vw,430px);margin:12px auto;padding:6px;border-radius:14px;background:#101a30;border:1px solid var(--line);aspect-ratio:1;touch-action:manipulation}
  .cell{min-height:44px;min-width:44px;aspect-ratio:1;border:0;border-radius:8px;background:#22304f;color:#fff;font-size:clamp(15px,5.6vw,26px);line-height:1;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation;cursor:pointer;transition:background .12s,transform .08s}
  .cell:active{transform:scale(.96)}
  .cell.s0{background:linear-gradient(160deg,#7fb2ff,#3c74d6);box-shadow:inset 0 0 0 1px #a9ccff}
  .cell.s1{background:linear-gradient(160deg,#ff9a9a,#d95353);box-shadow:inset 0 0 0 1px #ffbcbc}
  .cell.sel{outline:3px solid var(--gold);outline-offset:-3px}
  .cell.hint{background:#2a3c63}
  .tip{min-height:40px;margin:4px auto;text-align:center;color:var(--muted);font-size:13px}
  .reset{width:100%;margin-top:6px;background:linear-gradient(160deg,#7fb2ff,#4a86ef);color:#08172e;border:0;font-weight:800}
  .foot{text-align:center;margin-top:14px;font-size:12px;color:#6f80a8}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 0}
  .tools .btn{min-width:0;padding:0 12px;font-size:13px}
  .tools .streak{margin-left:auto;font-size:12px;color:var(--muted)}
  .scene{min-height:0;margin:6px auto 0;text-align:center;color:#8ea2cc;font-size:12px;line-height:1.5}
/* mini-quality: safe-area */
.wrap { --mini-safe-bottom: 30px; padding-bottom: calc(var(--mini-safe-bottom) + env(safe-area-inset-bottom, 0px)); }
/* mini-quality: reduced-motion */
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; } }

    volume = Math.max(0, Math.min(1, Number(v) || 0));
    storageSet(VOLUME_KEY, String(volume));
    return volume;
  }

  function mute(on) {
    muted = Boolean(on);
    storageSet(MUTE_KEY, muted ? '1' : '0');
    fadeMaster(muted ? 0 : volume * (SCENES[current] || SCENES.table).gain, 0.4);
    return muted;
  }

  function scenes() { return Object.keys(SCENES); }
  function isMuted() { return muted; }
  function currentScene() { return current; }
  function getVolume() { return volume; }

  return {
    play: play,
    stop: stop,
    setVolume: setVolume,
    getVolume: getVolume,
    mute: mute,
    isMuted: isMuted,
    current: currentScene,
    scenes: scenes,
    version: '1.0.0'
  };
});

return module.exports;})();
</script>
<script>
(function () {
  var E = window.MiniEngine;
  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var tipEl = document.getElementById('tip');
  var SLUG = "mini-abstract-a-01";
  var mode = "free";
  var currentSeed = Date.now() % 1000000000;
  var settled = false;
  var bgmOn = false;
  var scene = Scene.create({
    id: SLUG,
    ambience: "table",
    cast: [{ id: "you", name: "你", role: "player" }, { id: "ai", name: "AI", role: "ai" }]
  });
  var replay = Replay.create({ game: SLUG, seed: currentSeed, params: { mode: mode } });
  var g, selected = -1, busy = false;

  function $(id) { return document.getElementById(id); }
  function newSeed() {
    currentSeed = mode === "daily" ? GameProgress.dailySeed(SLUG) : (Date.now() % 1000000000);
    return currentSeed;
  }
  function saveReplay() {
    try { Replay.saveLocal("replay." + SLUG, replay); } catch (e) { /* storage optional */ }
  }
  function refreshStreak() {
    var el = $("streak");
    if (!el) return;
    var st = GameProgress.dailyState(SLUG);
    el.textContent = (mode === "daily" ? "每日 · " + (st.done ? "今日已完成" : "今日未完成") : "自由模式") + " · 连胜 " + st.streak;
  }
  function describe(event) {
    if (!event) return "战报：准备开始。";
    var p = event.payload || {};
    if (event.type === "move") return "战报：你落子 / 走子（" + (p.label || "第 " + (p.pos + 1) + " 格") + "）。";
    if (event.type === "settle") {
      var verdict = p.result === 0 ? "你赢了" : (p.result === 1 ? "AI 赢了" : "平局");
      return "战报：对局结束 · " + verdict + "。";
    }
    return "战报：准备开始。";
  }
  function paintLog() {
    var el = $("sceneLog");
    if (el) el.textContent = describe(scene.events(1)[0]);
  }
  function finish() {
    if (settled) return;
    settled = true;
    scene.updateCast("you", { emotion: g.result === 0 ? "happy" : (g.result === 1 ? "sad" : "neutral") });
    scene.emit("settle", { result: g.result, mode: mode });
    try { localStorage.removeItem("replay." + SLUG); } catch (e) { /* ignore */ }
    try { GameProgress.record({ slug: SLUG, mode: mode, score: g.result === 0 ? 1 : 0 }); } catch (e) { /* storage optional */ }
    refreshStreak();
    paintLog();
  }
  function startBgm() {
    if (bgmOn) return;
    bgmOn = true;
    try { Bgm.play(scene.ambience); } catch (e) { /* audio optional */ }
  }
  document.addEventListener("pointerdown", startBgm, { once: true });

  function isDuel() { return E.CFG.mode === 'duel'; }

  function statusText() {
    if (g.over) {
      if (g.result === 0) return '你赢了！';
      if (g.result === 1) return 'AI 获胜';
      return '平局';
    }
    if (g.turn === 0) return selected >= 0 ? '已选中，点相邻格移动' : '轮到你行动';
    return 'AI 思考中…';
  }

  function render() {
    if (g.over) finish();
    boardEl.style.gridTemplateColumns = 'repeat(' + g.size + ', 1fr)';
    boardEl.innerHTML = '';
    for (var i = 0; i < g.board.length; i++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cell';
      var v = g.board[i];
      if (v === 0) { b.className += ' s0'; b.textContent = '●'; }
      if (v === 1) { b.className += ' s1'; b.textContent = '●'; }
      if (i === selected) b.className += ' sel';
      b.setAttribute('aria-label', '第 ' + (Math.floor(i / g.size) + 1) + ' 行第 ' + (i % g.size + 1) + ' 列' + (v === -1 ? '空' : v === 0 ? '蓝子' : '红子'));
      b.addEventListener('click', (function (pos) {
        return function () { onCell(pos); };
      })(i));
      boardEl.appendChild(b);
    }
    statusEl.textContent = statusText();
    statusEl.className = 'status' + (g.over ? ' win' : '');
    tipEl.textContent = g.msg || (g.over ? '点“重新开局”再战一局。' : '蓝方是你，红方是 AI。');
  }

  function aiTurn() {
    if (g.over || busy) return;
    busy = true;
    window.setTimeout(function () {
      if (g.over) { busy = false; render(); return; }
      var mv = E.aiMove(g);
      if (mv !== null) {
        try { E.applyMove(g, mv); } catch (e) { g.over = true; g.result = 'draw'; g.msg = 'AI 无合法走法'; }
      }
      busy = false;
      selected = -1;
      render();
    }, 220);
  }

  function onCell(pos) {
    if (g.over || busy || g.turn !== 0) return;
    if (!isDuel()) {
      try {
        E.applyMove(g, pos);
        replay.add({ move: pos });
        saveReplay();
        scene.emit("move", { pos: pos });
        paintLog();
      } catch (e) {
        tipEl.textContent = '这里不能落子：' + (E.CFG.mode === 'flip' ? '必须能夹住对手棋子。' : E.CFG.mode === 'go' ? '不能自杀。' : '请选空格。');
        return;
      }
      selected = -1;
      render();
      if (!g.over) aiTurn();
      return;
    }
    if (g.board[pos] === 0) {
      selected = pos;
      render();
      return;
    }
    if (selected < 0) { tipEl.textContent = '先点自己的蓝色棋子。'; return; }
    try {
      E.applyMove(g, { from: selected, to: pos });
      replay.add({ move: { from: selected, to: pos } });
      saveReplay();
      scene.emit("move", { label: "第 " + (selected + 1) + " 格 → 第 " + (pos + 1) + " 格" });
      paintLog();
    } catch (e) {
      tipEl.textContent = '只能走到相邻空格或对手棋子。';
      return;
    }
    selected = -1;
    render();
    if (!g.over) aiTurn();
  }

  function reset(nextMode) {
    if (nextMode) mode = nextMode;
    if (nextMode) { var rb = $("resumeBtn"); if (rb) rb.hidden = true; }
    settled = false;
    g = E.createGame({ seed: newSeed() });
    replay = Replay.create({ game: SLUG, seed: currentSeed, params: { mode: mode } });
    try { localStorage.removeItem("replay." + SLUG); } catch (e) { /* ignore */ }
    selected = -1;
    busy = false;
    refreshStreak();
    paintLog();
    render();
  }

  function pumpAi() {
    var guard = 0;
    while (!g.over && g.turn === 1 && guard < 120) {
      guard += 1;
      var mv = E.aiMove(g);
      if (mv === null || mv === undefined) break;
      try { E.applyMove(g, mv); } catch (e) { break; }
    }
  }

  document.getElementById("reset").addEventListener("click", function () { reset("free"); });
  $("freeBtn").addEventListener("click", function () { reset("free"); });
  $("dailyBtn").addEventListener("click", function () { reset("daily"); });
  $("bgmBtn").addEventListener("click", function () {
    startBgm();
    var muted = Bgm.mute(!Bgm.isMuted());
    var btn = $("bgmBtn");
    btn.textContent = muted ? "音景 关" : "音景 开";
    btn.setAttribute("aria-pressed", muted ? "false" : "true");
  });
  (function resumePrompt() {
    var saved = null;
    try { saved = Replay.loadLocal("replay." + SLUG); } catch (e) { /* storage optional */ }
    var btn = $("resumeBtn");
    if (!btn || !saved || !saved.actions().length) return;
    btn.hidden = false;
    btn.addEventListener("click", function () {
      mode = (saved.params && saved.params.mode) || "free";
      currentSeed = saved.seed;
      settled = false;
      g = E.createGame({ seed: currentSeed });
      var acts = saved.actions();
      for (var i = 0; i < acts.length; i += 1) {
        if (g.over || g.turn !== 0) break;
        var a = acts[i] && acts[i].move;
        try { E.applyMove(g, a); } catch (e) { break; }
        pumpAi();
      }
      replay = saved;
      selected = -1;
      busy = false;
      btn.hidden = true;
      refreshStreak();
      paintLog();
      render();
      if (!g.over && g.turn === 1) aiTurnSoon();
    });
  })();
  function aiTurnSoon() {
    if (g.over || busy) return;
    busy = true;
    window.setTimeout(function () {
      if (!g.over && g.turn === 1) { var mv = E.aiMove(g); if (mv !== null && mv !== undefined) { try { E.applyMove(g, mv); } catch (e) { /* ignore */ } } }
      busy = false;
      selected = -1;
      render();
    }, 220);
  }
  reset();
})();
</script>
</body>
</html>
