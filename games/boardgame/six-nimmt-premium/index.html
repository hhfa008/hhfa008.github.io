  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  [hidden]{display:none!important}

  @keyframes cardPop{0%{transform:translateY(-12px) scale(.86);opacity:0}70%{opacity:1}100%{transform:none;opacity:1}}
  @keyframes handIn{0%{transform:translateY(10px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
  @keyframes miniPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  @keyframes turnPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes seatPulse{0%,100%{opacity:.72}50%{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes riseIn{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  @keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(620px) rotate(520deg)}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
  @media (max-width:430px){
    .wrap{padding:8px 9px 28px}
    .brand h1{font-size:17px}
    .brand p{font-size:12px}
    .seats{gap:6px;grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
    .seat{padding:7px 7px 6px}
    .seat .score{font-size:18px}
    .table{padding:12px 8px 13px}
    .row{padding:6px 6px 6px 6px;gap:4px}
    .row .idx{flex-basis:24px}
    .row .pts{min-width:34px}
    .hand{grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
    .hcard{min-height:62px}
  }
  @media (max-width:340px){
    .brand p{display:none}
    .icon-btn{min-width:44px;padding:0 7px;font-size:13px}
    select#playerCount{min-width:58px;font-size:16px}
  }
/* safe-area: keep the original bottom padding, clear the iOS home indicator */
body{padding-bottom:env(safe-area-inset-bottom)}
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/six-nimmt-premium/">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="icon-btn" href="../index.html" aria-label="返回桌游目录">← 目录</a>
    <div class="brand">
      <h1>6 Nimmt! 谁是牛头王</h1>
      <p>四行牌列，六张就爆</p>
    </div>
    <span class="count-wrap"><select id="playerCount" aria-label="选择对战人数">
      <option value="3">3 人</option>
      <option value="4">4 人</option>
      <option value="5">5 人</option>
    </select></span>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深色或浅色主题">◐</button>
    <button class="icon-btn" id="muteBtn" type="button" aria-label="静音或开启音效" aria-pressed="false">♪</button>
  </header>

  <main>
    <section class="seats" id="seats" aria-label="玩家状态"></section>

    <section class="table" id="table" aria-label="四行牌桌">
      <div class="table-top">
        <span class="eyebrow" id="roundLabel">第 1 / 10 轮</span>
        <span class="phase-chip" id="phaseChip">同时暗出</span>
      </div>
      <div class="rows" id="rows"></div>
      <div class="note" id="tableNote" aria-live="polite"></div>
    </section>

    <section class="control" aria-label="手牌与操作">
      <div id="choiceArea"></div>
      <div class="hand" id="hand" aria-label="你的手牌"></div>
      <p class="hint" id="hint"></p>
    </section>

    <section class="log" aria-label="对局记录">
      <h2>对局记录</h2>
      <ul id="logList"></ul>
    </section>
  </main>

  <footer class="foot">
    <a href="rules.html">完整规则</a>
    <a href="online.html">联机对战</a>
    <a href="../index.html">更多桌游</a>
  </footer>
</div>

<div class="finale" id="finale" role="dialog" aria-modal="true" aria-labelledby="finaleTitle">
  <div class="confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="finale-card">
    <div class="crown" aria-hidden="true">♛</div>
    <h2 id="finaleTitle">结算</h2>
    <p id="finaleSub"></p>
    <div class="finale-table" id="finaleTable"></div>
    <button class="icon-btn" id="restartBtn" type="button" style="width:100%;min-height:52px">再来一局</button>
  </div>
</div>

<script src="../../shared/shuffle.js"></script>
<script src="../../shared/sfx.js"></script>
<script src="../../shared/poker-ui.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.SixNimmtPremiumEngine;
  var D = window.SixNimmtPremiumData;
  var game = null;
  var busy = false;
  var eventCursor = 0;
  var fast = /(?:\?|&)fast=1/.test(location.search);

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function safeSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

  // ---- theme -------------------------------------------------------------
  var theme = safeGet('snp-theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
  function effectiveLight() {
    var attr = document.documentElement.getAttribute('data-theme');
    if (attr === 'light') return true;
    if (attr === 'dark') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  }
  function updateThemeLabel() {
    $('themeBtn').setAttribute('aria-label', effectiveLight() ? '切换到深色主题' : '切换到浅色主题');
  }
  updateThemeLabel();

  // ---- shared sound ------------------------------------------------------
  var Sfx = window.Sfx;
  var muted = safeGet('snp-muted') === '1';
  if (Sfx && muted) Sfx.mute(true);
  $('muteBtn').setAttribute('aria-pressed', muted ? 'true' : 'false');
  $('muteBtn').textContent = muted ? '×' : '♪';
  function sfx(name) { if (!muted && Sfx) Sfx.play(name); }
  $('muteBtn').addEventListener('click', function () {
    muted = !muted;
    safeSet('snp-muted', muted ? '1' : '0');
    if (Sfx) Sfx.mute(muted);
    $('muteBtn').setAttribute('aria-pressed', muted ? 'true' : 'false');
    $('muteBtn').textContent = muted ? '×' : '♪';
    if (!muted) sfx('click');
  });
  $('themeBtn').addEventListener('click', function () {
    var next = effectiveLight() ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    safeSet('snp-theme', next);
    updateThemeLabel();
    sfx('deal');
  });

  // ---- game --------------------------------------------------------------
  function playerCount() {
    return Number($('playerCount').value) || 3;
  }
  function start() {
    game = E.createGame({
      seed: (Date.now() % 1000000) + 23,
      players: playerCount(),
      names: D.aiNames
    });
    busy = false;
    eventCursor = 0;
    $('finale').classList.remove('show');
    render();
  }

  function bullText(card) { return E.bull(card) + ' 牛'; }

  function renderSeats(view) {
    var seats = $('seats');
    seats.innerHTML = '';
    view.players.forEach(function (p, i) {
      var seat = el('div', 'seat' + (p.picked ? ' picked' : '') + (view.phase === 'over' && view.winnerIds.indexOf(i) >= 0 ? ' win' : ''));
      seat.setAttribute('data-tone', (D.seats[i] || D.seats[0]).tone);
      var who = el('div', 'who');
      who.appendChild(el('span', 'avatar', (D.seats[i] || D.seats[0]).avatar));
      who.appendChild(el('span', 'nm', p.name + (i === 0 ? ' · 你' : '')));
      if (p.picked) who.appendChild(el('span', 'badge', '已出'));
      seat.appendChild(who);
      var meta = el('div', 'meta');
      var left = el('span', null, '手牌 ');
      left.appendChild(el('b', null, String(p.handCount)));
      meta.appendChild(left);
      meta.appendChild(el('span', null, '吃 ' + p.taken.length + ' 张'));
      seat.appendChild(meta);
      var score = el('div', 'score', String(p.score));
      score.appendChild(el('small', null, '牛头'));
      seat.appendChild(score);
      var mini = el('div', 'mini-cards');
      mini.setAttribute('aria-hidden', 'true');
      var shown = p.taken.slice(-6);
      shown.forEach(function (c) { mini.appendChild(el('span', 'mini', String(c))); });
      if (p.taken.length > shown.length) mini.appendChild(el('span', 'mini', '+' + (p.taken.length - shown.length)));
      seat.appendChild(mini);
      seats.appendChild(seat);
    });
  }

  function renderRows(view) {
    var box = $('rows');
    box.innerHTML = '';
    view.rows.forEach(function (row, ri) {
      var rowEl = el('div', 'row' + (row.length >= 5 ? ' full' : ''));
      rowEl.setAttribute('aria-label', '第 ' + (ri + 1) + ' 行，' + row.join('、') + '，' + E.rowPoints(row) + ' 个牛头');
      rowEl.appendChild(el('span', 'rowtag'));
      var idx = el('div', 'idx', '第 ' + (ri + 1) + ' 行');
      idx.appendChild(el('small', null, row.length + ' / 5'));
      rowEl.appendChild(idx);
      var slots = el('div', 'slots');
      for (var s = 0; s < 5; s++) {
        if (s < row.length) {
          var cls = 'slot filled' + (s === row.length - 1 ? ' last' : '');
          var face = '<span class="num">' + String(row[s]) + '</span>' +
            '<span class="bh">' + String(E.bull(row[s])) + '</span>';
          var card = window.PokerUI && window.PokerUI.createCard
            ? window.PokerUI.createCard(row[s], { face: 'custom', faceHtml: face, className: cls, tag: 'div', ariaLabel: row[s] + '，' + E.bull(row[s]) + ' 牛' })
            : null;
          if (!card) {
            card = el('div', cls);
            card.appendChild(el('span', 'num', String(row[s])));
            card.appendChild(el('span', 'bh', String(E.bull(row[s]))));
          }
          slots.appendChild(card);
        } else {
          var emptySlot = window.PokerUI && window.PokerUI.createSlot
            ? window.PokerUI.createSlot({ className: 'slot', tag: 'div' })
            : null;
          slots.appendChild(emptySlot || el('div', 'slot'));
        }
      }
      rowEl.appendChild(slots);
      var pts = el('div', 'pts');
      pts.appendChild(el('b', null, String(E.rowPoints(row))));
      pts.appendChild(document.createTextNode(' 牛'));
      rowEl.appendChild(pts);
      box.appendChild(rowEl);
    });
  }

  function renderControl(view) {
    var choice = $('choiceArea');
    var hand = $('hand');
    var hint = $('hint');
    choice.innerHTML = '';
    hand.innerHTML = '';
    hand.hidden = false;
    if (view.phase === 'over') {
      hand.hidden = true;
      hint.textContent = '十轮结束，牛头分最低者获胜。';
      return;
    }
    if (view.phase === 'chooseRow') {
      hand.hidden = true;
      choice.appendChild(el('div', 'msg', '你的 ' + view.pending.card + ' 小于所有行尾，选择吃哪一行'));
      var rowBox = el('div', 'rowchoices');
      view.rows.forEach(function (row, ri) {
        var b = el('button');
        b.type = 'button';
        b.setAttribute('aria-label', '吃第 ' + (ri + 1) + ' 行，获得 ' + E.rowPoints(row) + ' 个牛头');
        var cards = el('span', 'rcards');
        row.forEach(function (c) { cards.appendChild(el('span', 'rc', String(c))); });
        b.appendChild(cards);
        b.appendChild(el('span', 'rp', '+' + E.rowPoints(row) + ' 牛'));
        b.addEventListener('click', function () { chooseRow(ri); });
        rowBox.appendChild(b);
      });
      choice.appendChild(rowBox);
      hint.textContent = '选择牛头最少的一行通常最划算，但也要看它是否会帮下家清空牌列。';
      return;
    }
    var me = view.players[0];
    if (view.myPick != null) {
      var picker = el('div', 'picker');
      var pc = window.PokerUI && window.PokerUI.createCard
        ? window.PokerUI.createCard(view.myPick, {
          face: 'custom',
          faceHtml: '<span class="n">' + String(view.myPick) + '</span><span class="b">' + bullText(view.myPick) + '</span>',
          className: 'pcard',
          tag: 'div',
          ariaLabel: String(view.myPick) + '，' + bullText(view.myPick)
        })
        : null;
      if (!pc) {
        pc = el('div', 'pcard');
        pc.appendChild(el('span', 'n', String(view.myPick)));
        pc.appendChild(el('span', 'b', bullText(view.myPick)));
      }
      picker.appendChild(pc);
      var pt = el('div', 'ptext');
      pt.appendChild(el('b', null, '你已暗出 ' + view.myPick));
      pt.appendChild(el('span', null, '等待其他 ' + (view.players.length - 1) + ' 位玩家出牌，然后按数字从小到大结算'));
      picker.appendChild(pt);
      choice.appendChild(picker);
      hand.hidden = true;
      hint.textContent = '暗牌不会公开，直到本轮全部翻开。';
      return;
    }
    var msg = el('div', 'msg', '轮到你：从手牌中选择一张暗出');
    choice.appendChild(msg);
    var sorted = me.hand.slice().sort(function (a, b) { return a - b; });
    sorted.forEach(function (card) {
      var face = '<span class="n">' + String(card) + '</span><span class="b">' + E.bull(card) + ' 牛</span>';
      var b = window.PokerUI && window.PokerUI.createCard
        ? window.PokerUI.createCard(card, {
          face: 'custom',
          faceHtml: face,
          className: 'hcard',
          tag: 'button',
          ariaLabel: '出牌 ' + card + '，' + E.bull(card) + ' 个牛头'
        })
        : null;
      if (!b) {
        b = el('button', 'hcard');
        b.type = 'button';
        b.setAttribute('aria-label', '出牌 ' + card + '，' + E.bull(card) + ' 个牛头');
        b.appendChild(el('span', 'n', String(card)));
        b.appendChild(el('span', 'b', E.bull(card) + ' 牛'));
      }
      b.addEventListener('click', function () { pick(card); });
      hand.appendChild(b);
    });
    if (window.PokerUI && window.PokerUI.layoutHand) {
      window.PokerUI.layoutHand(hand, { mode: 'grid', gap: 7, watch: false });
    }
    hint.textContent = '同时出牌：先想好哪一行最安全，再猜别人会把什么牌塞进来。';
  }

  function renderNote(view) {
    var note = $('tableNote');
    note.innerHTML = '';
    $('roundLabel').textContent = '第 ' + view.round + ' / ' + view.rounds + ' 轮';
    var chip = $('phaseChip');
    if (view.phase === 'over') {
      chip.textContent = '对局结束';
      note.appendChild(document.createTextNode('四行牌列已经算清，牛头分最低者获胜。'));
    } else if (view.phase === 'chooseRow') {
      chip.textContent = '选择吃行';
      note.appendChild(document.createTextNode('你的 ' + view.pending.card + ' 低于所有行尾：选择一行吃下。'));
    } else {
      var picked = view.players.filter(function (p) { return p.picked; }).length;
      chip.textContent = picked ? '已出 ' + picked + ' / ' + view.players.length : '同时暗出';
      var dot = el('span', 'dot' + (picked === view.players.length ? '' : ' wait'));
      note.appendChild(dot);
      note.appendChild(document.createTextNode(picked === view.players.length ? '全部暗牌就位，正在按数字结算…' :
        '所有人各暗出一张，按数字从小到大接进四行。'));
    }
  }

  function render() {
    if (!game) return;
    var view = E.publicView(game, 0);
    renderSeats(view);
    renderRows(view);
    renderNote(view);
    renderControl(view);
    var list = $('logList');
    list.innerHTML = '';
    view.log.slice(-7).forEach(function (line) { list.appendChild(el('li', null, line)); });
    if (view.phase === 'over') renderFinale(view);
    else $('finale').classList.remove('show');
  }

  function renderFinale(view) {
    var box = $('finale');
    var winners = view.winnerIds || [];
    var names = winners.map(function (i) { return view.players[i].name; }).join('、');
    var mine = winners.indexOf(0) >= 0;
    $('finaleTitle').textContent = mine ? '你赢了！' : (names ? names + ' 获胜' : '结算');
    $('finaleSub').textContent = '十轮 · 牛头分最低者胜' + (view.tied ? ' · 并列最低' : '');
    var table = $('finaleTable');
    table.innerHTML = '';
    var order = view.players.map(function (_, i) { return i; }).sort(function (a, b) {
      return view.players[a].score - view.players[b].score;
    });
    order.forEach(function (i) {
      var p = view.players[i];
      var row = el('div', 'finale-row' + (winners.indexOf(i) >= 0 ? ' win' : ''));
      row.appendChild(el('span', null, p.name + (i === 0 ? '（你）' : '') + ' · ' + p.taken.length + ' 张'));
      row.appendChild(el('span', 'pts', p.score + ' 牛'));
      table.appendChild(row);
    });
    if (!box.classList.contains('show')) {
      box.classList.add('show');
      sfx(mine ? 'win' : 'deal');
    }
  }

  function consumeEvents() {
    if (!game || !game.events.length) return;
    if (eventCursor > game.events.length) eventCursor = 0;
    for (; eventCursor < game.events.length; eventCursor++) {
      var ev = game.events[eventCursor];
      if (ev.type === 'pick') sfx('click');
      else if (ev.type === 'reveal') sfx('deal');
      else if (ev.type === 'place') sfx('move');
      else if (ev.type === 'takeRow') sfx('capture');
      else if (ev.type === 'round') sfx('notify');
      else if (ev.type === 'over') sfx('win');
    }
  }

  function pick(card) {
    if (busy || !game || game.phase !== 'pick' || game.picks[0] != null) return;
    busy = true;
    try { E.pickCard(game, 0, card); } catch (e) { busy = false; $('hint').textContent = '这张牌现在不能出。'; return; }
    consumeEvents();
    render();
    pumpAI();
  }

  function chooseRow(rowIndex) {
    if (busy || !game || game.phase !== 'chooseRow') return;
    busy = true;
    try { E.chooseRow(game, 0, rowIndex); } catch (e) { busy = false; return; }
    consumeEvents();
    render();
    pumpAI();
  }

  function pumpAI() {
    if (!game || game.phase === 'over') { busy = false; render(); return; }
    // Never pre-pick for the AI before the human has committed this round.
    if (game.phase === 'pick' && game.picks[0] == null) { busy = false; render(); return; }
    if (game.phase === 'chooseRow') {
      if (game.pending && game.pending.player !== 0) {
        try { E.chooseRow(game, game.pending.player, E.aiRowChoice(game, game.pending.player)); } catch (e) {}
        consumeEvents(); render();
        setTimeout(pumpAI, fast ? 8 : 320);
        return;
      }
      busy = false; render(); return;
    }
    if (game.phase !== 'pick') { busy = false; render(); return; }
    var idx = -1;
    for (var i = 1; i < game.players.length; i++) {
      if (game.picks[i] == null && game.players[i].hand.length) { idx = i; break; }
    }
    if (idx < 0) { busy = false; render(); return; }
    var decision = E.aiDecision(game, idx);
    if (!decision) { busy = false; render(); return; }
    try { E.applyDecision(game, decision); } catch (e) { busy = false; render(); return; }
    consumeEvents();
    render();
    setTimeout(pumpAI, fast ? 8 : 360);
  }

  $('restartBtn').addEventListener('click', start);
  $('playerCount').addEventListener('change', start);

  document.addEventListener('keydown', function (e) {
    if (!game || game.phase === 'over' || busy) return;
    if (e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    var digit = e.key >= '1' && e.key <= '9' ? Number(e.key) : (e.key === '0' ? 10 : 0);
    if (!digit) return;
    if (game.phase === 'chooseRow') {
      if (digit >= 1 && digit <= 4) { e.preventDefault(); chooseRow(digit - 1); }
      return;
    }
    if (game.picks[0] != null) return;
    var cards = document.querySelectorAll('#hand .hcard');
    if (cards[digit - 1]) { e.preventDefault(); cards[digit - 1].click(); }
  });

  // Public test hook. Only public information (own hand, rows, scores).
  window.__premium = {
    state: function () { return game ? E.publicView(game, 0) : null; },
    over: function () { return !!game && game.phase === 'over'; },
    start: start,
    fast: fast
  };

  start();
})();
</script>
</body>
