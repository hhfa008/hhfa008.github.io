<!doctype html>
<!--
  6 Nimmt! / 谁是牛头王 premium — online lobby and room board.
  Server-authoritative HTTP/JSON polling. No external requests, no CDN.
  Room/invite/reconnect/timeout/leaderboard come from games/shared/online-room-server.mjs.
-->

<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#122019">
<meta name="description" content="6 Nimmt! 谁是牛头王联机房间：创建/加入房间、邀请码、2–10 人同局、AI 补位、断线重连与超时托管。同时暗出，牛头分最低者胜。">
<title>6 NIMMT! 谁是牛头王 · 联机房间</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23122019'/%3E%3Cpath d='M14 18h36v8H14zm0 12h36v8H14zm0 12h36v8H14z' fill='%23e7c281'/%3E%3Ccircle cx='50' cy='14' r='6' fill='%23c9563f'/%3E%3C/svg%3E">
<style>
  :root{
    --art-felt:url("../../assets/art/premium/six-nimmt/felt-table.webp");
    --art-paper:url("../../assets/art/premium/six-nimmt/card-paper.webp");
    --art-back:url("../../assets/art/premium/six-nimmt/card-back.webp");
    --art-ribbon:url("../../assets/art/premium/six-nimmt/row-ribbon.webp");
    --font-serif:"Songti SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --bg:#0c1611;--bg2:#15251c;--panel:rgba(24,40,31,.93);--panel2:rgba(38,58,45,.72);
    --line:rgba(138,172,146,.28);--ink:#f5f0e2;--muted:#adc0ac;--gold:#e7c281;--gold2:#f6dda6;
    --mint:#7fd9a6;--coral:#e3694f;--coral2:#ad3f2d;--sky:#87c9ef;--danger:#ff9c8d;
    --card-face:#fff8e9;--card-ink:#2a2016;--card-edge:#dcc49b;
    --shadow:0 20px 48px rgba(0,0,0,.44);--radius:18px;--tap:48px;
  }
  html[data-theme="light"]{
    --bg:#efe7d6;--bg2:#f8f2e4;--panel:rgba(255,251,242,.95);--panel2:rgba(246,238,224,.82);
    --line:rgba(160,132,96,.36);--ink:#29221a;--muted:#6b6051;--gold:#9c6c14;--gold2:#7c5310;
    --mint:#1f8f61;--coral:#c9523c;--coral2:#a23927;--sky:#2c75ad;--danger:#b33f35;
    --card-face:#fffdf6;--card-ink:#29221a;--card-edge:#d4bf98;--shadow:0 18px 40px rgba(91,68,42,.2);
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 var(--font-sans);
    background:
      radial-gradient(1000px 620px at 50% -18%,rgba(26,74,52,.88),transparent 64%),
      var(--art-felt) center/cover no-repeat fixed,
      linear-gradient(168deg,var(--bg2),var(--bg) 62%);
    background-color:var(--bg);
  }
  a{color:var(--gold)}
  .wrap{max-width:880px;margin:0 auto;padding:10px 12px 40px}
  .top{display:flex;align-items:center;gap:8px;padding:4px 0 12px}
  .top h1{margin:0;font-family:var(--font-serif);font-weight:700;font-size:19px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:52px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
  .panel + .panel{margin-top:12px}
  h2{margin:0 0 10px;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  .field{display:grid;gap:5px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--muted);font-weight:700}
  input{font:inherit;font-size:16px;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--ink);width:100%}
  button{font:inherit;font-size:15px;font-weight:800;min-height:var(--tap);padding:10px 16px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;touch-action:manipulation}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:linear-gradient(160deg,var(--mint),#2fa77c);color:#062019;border:0}
  button.coral{background:linear-gradient(160deg,var(--coral),var(--coral2));color:#2a0d08;border:0}
  button.ghost{background:transparent}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .row > button{flex:1;min-width:130px}
  .muted{color:var(--muted);font-size:12.5px}
  .err{color:var(--danger);font-size:13px;font-weight:700;min-height:18px;margin-top:6px}
  .roombar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .roomeyebrow{font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
  .chip{display:inline-flex;align-items:center;min-height:30px;padding:2px 12px;border-radius:999px;background:rgba(0,0,0,.22);border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--gold)}
  .seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
  .seat{position:relative;border:1px solid var(--line);border-radius:14px;padding:9px 10px;background:var(--panel2);min-width:0}
  .seat.picked{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint) inset}
  .seat.you{border-color:var(--gold)}
  .seat .name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seat .meta{display:flex;justify-content:space-between;gap:4px;margin-top:3px;font-size:12px;color:var(--muted)}
  .seat .score{font-family:var(--font-serif);font-size:22px;font-weight:700;color:var(--gold);line-height:1.1;margin-top:2px}
  .seat .cards{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px;min-height:18px}
  .mini{font-size:12px;line-height:18px;min-width:21px;text-align:center;padding:0 3px;border-radius:4px;background:var(--card-face);color:var(--card-ink);border:1px solid var(--card-edge);font-weight:800}
  .badge{font-size:12px;color:var(--mint);font-weight:800;margin-left:4px}
  .table{
    position:relative;border-radius:20px;padding:13px 11px 14px;border:1px solid var(--line);
    background:linear-gradient(160deg,rgba(14,52,37,.84),rgba(7,28,19,.93)),var(--art-felt) center/cover no-repeat;
    box-shadow:var(--shadow);overflow:hidden;text-align:center;
  }
  .tabletop{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:rgba(255,255,255,.82);font-weight:700;position:relative;z-index:1;margin-bottom:8px}
  .rows{position:relative;z-index:1;display:grid;gap:7px}
  .trow{display:flex;align-items:center;gap:5px;min-width:0;padding:6px 6px 6px 7px;border-radius:12px;background:linear-gradient(150deg,rgba(255,248,233,.11),rgba(0,0,0,.18));border:1px solid rgba(246,241,227,.16)}
  .trow.full{border-color:rgba(227,105,79,.6)}
  .trow .rt{flex:0 0 auto;width:7px;align-self:stretch;border-radius:5px;background:var(--art-ribbon) center/cover no-repeat;opacity:.9}
  .trow .idx{flex:0 0 26px;font-size:12px;font-weight:800;color:rgba(246,241,227,.72);line-height:1.1}
  .trow .idx small{display:block;font-size:12px;color:rgba(246,241,227,.5);font-weight:600}
  .trow .slots{display:flex;gap:4px;flex:1;min-width:0}
  .slot{flex:1 1 0;min-width:0;max-width:58px;height:clamp(42px,12vw,62px);border-radius:8px;background:rgba(0,0,0,.16);border:1px dashed rgba(246,241,227,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:rgba(246,241,227,.2)}
  .slot.filled{background:radial-gradient(circle at 24% 16%,rgba(255,255,255,.85),transparent 42%),linear-gradient(152deg,rgba(255,253,246,.94),rgba(248,236,214,.95)),var(--art-paper) center/cover no-repeat;border:1px solid var(--card-edge);color:var(--card-ink);box-shadow:0 3px 7px rgba(0,0,0,.28)}
  .slot.filled.last{outline:2px solid rgba(231,194,129,.75);outline-offset:-2px}
  .slot .num{font-size:clamp(14px,4vw,18px);line-height:1.05;letter-spacing:-.5px}
  .slot .bh{font-size:12px;line-height:1.1;color:var(--coral2);font-weight:800}
  .trow .pts{flex:0 0 auto;min-width:40px;text-align:right;font-size:12px;font-weight:800;color:var(--gold2);white-space:nowrap}
  .trow .pts b{font-size:15px}
  .note{min-height:22px;margin-top:9px;font-size:13px;font-weight:700;color:rgba(255,255,255,.88);position:relative;z-index:1}
  .control{margin-top:11px}
  .msg{text-align:center;font-size:13px;font-weight:800;color:var(--gold2);padding:6px 4px;min-height:20px}
  .hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px}
  .hcard{min-height:64px;border-radius:11px;border:1px solid #b9a078;cursor:pointer;background:radial-gradient(circle at 24% 16%,rgba(255,255,255,.9),transparent 40%),linear-gradient(152deg,#fffdf6,#f5e7cb),var(--art-paper) center/cover no-repeat;color:var(--card-ink);font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 #8e7657}
  .hcard .n{font-size:21px;line-height:1.05}
  .hcard .b{font-size:12px;color:var(--coral2);font-weight:800}
  .hcard:disabled{opacity:.42;cursor:default;box-shadow:none}
  .rowchoices{display:grid;gap:8px}
  .rowchoices button{width:100%;min-height:56px;text-align:left;padding:9px 12px;border-radius:12px;display:flex;align-items:center;gap:8px;font-size:13px}
  .rcards{display:flex;gap:3px;flex-wrap:wrap;min-width:0}
  .rc{font-size:12px;line-height:18px;min-width:22px;text-align:center;padding:0 3px;border-radius:4px;background:var(--card-face);color:var(--card-ink);border:1px solid var(--card-edge);font-weight:800}
  .rp{margin-left:auto;color:var(--coral);font-weight:900;white-space:nowrap}
  .waiting{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:700}
  .waiting .back{width:34px;height:46px;border-radius:6px;background:var(--art-back) center/cover no-repeat;border:1px solid rgba(255,240,205,.5);flex:0 0 auto}
  .log{margin-top:12px;border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:9px 12px;max-height:180px;overflow:auto}
  .log ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
  .log li{font-size:12.5px;color:var(--muted);border-bottom:1px dashed rgba(128,150,160,.18);padding:3px 0}
  .log li:last-child{color:var(--ink)}
  .log li::before{content:"›";color:var(--mint);margin-right:6px;font-weight:900}
  .finale{margin-top:12px;border:1px solid rgba(127,217,166,.4);background:rgba(127,217,166,.12);border-radius:15px;padding:12px;text-align:center}
  .finale h3{margin:0 0 4px;font-size:20px;font-family:var(--font-serif)}
  .board{display:none}
  .board.on{display:block}
  .leaderboard{display:grid;gap:4px}
  .lbrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.12)}
  .lbrow b{color:var(--gold)}
  @keyframes dealIn{0%{transform:translateY(-18px) rotate(-3deg) scale(.92);opacity:0}100%{transform:none;opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .fade{animation:fadeIn .25s ease both}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  @media (max-width:400px){
    .wrap{padding:8px 9px 30px}
    .top h1{font-size:17px}
    .seats{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
    .hand{grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
    .hcard{min-height:60px}
    .table{padding:11px 8px 12px}
  }

body{padding-bottom:env(safe-area-inset-bottom)}

<body>
<div class="wrap">
  <header class="top">
    <a class="icon-btn" href="index.html">← 单机</a>
    <h1>6 NIMMT! 联机</h1>
    <a class="icon-btn" href="rules.html">规则</a>
  </header>

  <main>
    <section class="panel" id="lobby" aria-label="联机大厅">
      <h2>创建或加入房间</h2>
      <div class="field">
        <label for="nickname">昵称</label>
        <input id="nickname" maxlength="16" placeholder="房主 / 玩家" autocomplete="nickname">
      </div>
      <div class="row">
        <button class="primary" id="createBtn" type="button">创建房间</button>
        <button id="joinBtn" type="button">加入房间</button>
      </div>
      <div class="field" id="joinFields" hidden style="margin-top:10px">
        <label for="roomCode">房间号 / 邀请码</label>
        <input id="roomCode" maxlength="64" placeholder="粘贴房间号或邀请码" autocomplete="off">
        <label for="joinPassword">房间密码（可选）</label>
        <input id="joinPassword" type="password" maxlength="64" placeholder="无密码可留空" autocomplete="off">
      </div>
      <div class="err" id="lobbyErr" role="alert"></div>
      <p class="muted">服务端权威判定；所有人同时暗出；空位由 AI 补齐；掉线 15 秒后自动托管，重连即恢复。</p>
    </section>

    <section class="panel board" id="board" aria-label="房间牌桌">
      <div class="roombar">
        <div>
          <div class="roomeyebrow">Room</div>
          <div class="chip" id="roomChip">—</div>
        </div>
        <div class="row" style="flex:0 1 auto">
          <button class="ghost" id="inviteBtn" type="button">复制邀请</button>
          <button class="ghost" id="startBtn" type="button">开始 / AI 补位</button>
        </div>
      </div>
      <div class="err" id="boardErr" role="alert"></div>
      <div class="seats" id="seats"></div>

      <div class="table">
        <div class="tabletop">
          <span id="roundLabel">第 1 / 10 轮</span>
          <span id="phaseChip">同时暗出</span>
        </div>
        <div class="rows" id="rows"></div>
        <div class="note" id="note" role="status" aria-live="polite"></div>
      </div>

      <div class="control" aria-label="操作区">
        <div id="choiceArea"></div>
      </div>

      <div class="finale" id="finale" hidden>
        <h3 id="finaleTitle">结算</h3>
        <p class="muted" id="finaleSub"></p>
        <div id="finaleRows"></div>
        <div class="row" style="margin-top:10px">
          <button class="primary" id="restartBtn" type="button">再来一局</button>
        </div>
      </div>

      <div class="log" aria-label="对局记录"><ul id="logList"></ul></div>
      <div class="row" style="margin-top:10px">
        <button class="ghost" id="leaveBtn" type="button">离开房间</button>
        <a class="icon-btn" href="index.html" style="flex:0 0 auto">返回单机</a>
      </div>
    </section>

    <section class="panel" aria-label="排行榜">
      <h2>结算榜</h2>
      <div class="leaderboard" id="leaderboard"><p class="muted">还没有结算记录。</p></div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var roomKey = params.get('room') || '';
  var invite = params.get('code') || '';
  var session = params.get('session') || '';
  var playerId = params.get('player') || '';
  var nickname = '';
  var timer = null;
  var lastVersion = -1;
  var online = false;

  try {
    if (!session) session = sessionStorage.getItem('snp-online-session') || '';
    if (!playerId) playerId = sessionStorage.getItem('snp-online-player') || '';
  } catch (e) {}

  function remember(nextRoom, nextSession, nextPlayer) {
    roomKey = nextRoom || roomKey;
    session = nextSession || session;
    playerId = nextPlayer || playerId;
    try {
      sessionStorage.setItem('snp-online-session', session);
      sessionStorage.setItem('snp-online-player', playerId);
    } catch (e) {}
    var url = location.pathname + '?room=' + encodeURIComponent(roomKey) + '&session=' + encodeURIComponent(session) + '&player=' + encodeURIComponent(playerId);
    try { history.replaceState(null, '', url); } catch (e) {}
  }

  function api(method, route, body) {
    return fetch(route, {
      method: method,
      headers: { 'content-type': 'application/json' },
      body: body == null ? undefined : JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { status: res.status, body: data };
      });
    });
  }
  function errText(r) { return (r.body && r.body.error && r.body.error.message) || ('HTTP ' + r.status); }
  function toast(msg) { $('boardErr').textContent = msg || ''; }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function saveNick() {
    nickname = ($('nickname').value || '').trim() || ('玩家-' + Math.random().toString(36).slice(2, 6));
    try { sessionStorage.setItem('snp-online-nick', nickname); } catch (e) {}
    return nickname;
  }
  try { $('nickname').value = sessionStorage.getItem('snp-online-nick') || ''; } catch (e) {}

  function showBoard(on) {
    online = on;
    $('lobby').hidden = on;
    $('board').classList.toggle('on', on);
  }

  function createRoom() {
    saveNick();
    $('lobbyErr').textContent = '';
    api('POST', '/api/rooms', { playerId: 'snp-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6), nickname: nickname })
      .then(function (r) {
        if (!r.body || !r.body.roomId) throw new Error(errText(r));
        remember(r.body.roomId, r.body.session, r.body.playerId);
        invite = r.body.inviteToken || '';
        showBoard(true);
        poll();
      })
      .catch(function (e) { $('lobbyErr').textContent = e.message; });
  }

  function joinRoom() {
    saveNick();
    var key = ($('roomCode').value || '').trim();
    if (!key) { $('lobbyErr').textContent = '请填写房间号或邀请码。'; return; }
    $('lobbyErr').textContent = '';
    var payload = { playerId: 'snp-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6), nickname: nickname };
    // A room id (room_…), the 6-character room code, or a single-use invite
    // token are all accepted in the same field. Only a token is sent as
    // inviteCode; room id/code joins go through the room's own password path.
    if (key.indexOf('room_') !== 0 && !/^[A-Z0-9]{6}$/i.test(key)) payload.inviteCode = key;
    if ($('joinPassword').value) payload.password = $('joinPassword').value;
    api('POST', '/api/rooms/' + encodeURIComponent(key) + '/join', payload)
      .then(function (r) {
        if (!r.body || !r.body.session) throw new Error(errText(r));
        remember(r.body.roomId, r.body.session, r.body.playerId);
        showBoard(true);
        poll();
      })
      .catch(function (e) { $('lobbyErr').textContent = e.message; });
  }

  function seatHtml(seat, state, you) {
    var p = state && state.players && state.players[seat.index];
    var cards = p ? p.taken : [];
    var score = p ? p.score : null;
    var mine = seat.index === you;
    var cls = 'seat' + (mine ? ' you' : '') + (p && p.picked ? ' picked' : '');
    return '<div class="' + cls + '">' +
      '<div class="name">' + esc(seat.name) + (seat.ai ? ' · AI' : '') + (mine ? ' · 你' : '') +
      (p && p.picked ? '<span class="badge">已出</span>' : '') + '</div>' +
      '<div class="score">' + (score == null ? '—' : score) + '<small style="font-size:12px;color:var(--muted)"> 牛</small></div>' +
      '<div class="meta"><span>' + (p ? '手牌 ' + p.handCount + ' · 吃 ' + p.taken.length : '') + '</span><span>' +
      (seat.isHost ? '房主' : '') + (seat.connected ? '' : ' · 离线') + '</span></div>' +
      '<div class="cards" aria-hidden="true">' + cards.slice(-6).map(function (c) { return '<span class="mini">' + c + '</span>'; }).join('') +
      (cards.length > 6 ? '<span class="mini">+' + (cards.length - 6) + '</span>' : '') + '</div>' +
      '</div>';
  }

  function rowsHtml(state) {
    return (state.rows || []).map(function (row, ri) {
      var slots = '';
      for (var s = 0; s < 5; s++) {
        if (s < row.length) {
          slots += '<div class="slot filled' + (s === row.length - 1 ? ' last' : '') + '"><span class="num">' + row[s] + '</span><span class="bh">' + bull(row[s]) + '</span></div>';
        } else {
          slots += '<div class="slot"></div>';
        }
      }
      return '<div class="trow' + (row.length >= 5 ? ' full' : '') + '">' +
        '<span class="rt"></span>' +
        '<div class="idx">第 ' + (ri + 1) + ' 行<small>' + row.length + ' / 5</small></div>' +
        '<div class="slots">' + slots + '</div>' +
        '<div class="pts"><b>' + (state.rowPoints ? state.rowPoints[ri] : 0) + '</b> 牛</div>' +
        '</div>';
    }).join('');
  }

  // Bull-head value mirrored from the engine so the room page can render
  // without a rules copy. It is presentation only; settlement is server-side.
  function bull(card) {
    if (card === 55) return 7;
    if (card % 11 === 0) return 5;
    if (card % 10 === 0) return 3;
    if (card % 5 === 0) return 2;
    return 1;
  }

  function renderChoice(r) {
    var state = r.state;
    var box = $('choiceArea');
    box.innerHTML = '';
    if (!state) return;
    var legal = r.legalActions || [];
    if (state.phase === 'over') {
      box.innerHTML = '<div class="msg">本局结束，牛头分最低者获胜。</div>';
      return;
    }
    if (state.phase === 'chooseRow') {
      var mine = legal.filter(function (a) { return a.type === 'row'; });
      if (mine.length) {
        var wrap = document.createElement('div');
        wrap.innerHTML = '<div class="msg">你的 ' + (state.pending ? state.pending.card : '') + ' 小于所有行尾，选择吃哪一行</div>';
        var list = document.createElement('div');
        list.className = 'rowchoices';
        mine.forEach(function (a) {
          var b = document.createElement('button');
          b.type = 'button';
          var cards = (a.cards || []).map(function (c) { return '<span class="rc">' + c + '</span>'; }).join('');
          b.innerHTML = '<span class="rcards">' + cards + '</span><span class="rp">+' + a.points + ' 牛</span>';
          b.setAttribute('aria-label', '吃第 ' + (a.row + 1) + ' 行，获得 ' + a.points + ' 个牛头');
          b.addEventListener('click', function () { act(a); });
          list.appendChild(b);
        });
        wrap.appendChild(list);
        box.appendChild(wrap);
        return;
      }
      box.innerHTML = '<div class="waiting"><span class="back" aria-hidden="true"></span><span>等待 ' +
        esc(state.players[state.pendingSeat] ? state.players[state.pendingSeat].name : '其他玩家') + ' 选择吃哪一行…</span></div>';
      return;
    }
    var myPick = state.myPick;
    if (myPick != null) {
      box.innerHTML = '<div class="waiting"><span class="back" aria-hidden="true"></span><span>你已暗出 <b>' + myPick + '</b>（' + bull(myPick) + ' 牛），等待其他玩家…</span></div>';
      return;
    }
    var picks = legal.filter(function (a) { return a.type === 'pick'; });
    if (picks.length) {
      var hand = document.createElement('div');
      hand.className = 'hand';
      picks.forEach(function (a) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'hcard';
        b.innerHTML = '<span class="n">' + a.card + '</span><span class="b">' + bull(a.card) + ' 牛</span>';
        b.setAttribute('aria-label', '出牌 ' + a.card + '，' + bull(a.card) + ' 个牛头');
        b.addEventListener('click', function () { act(a); });
        hand.appendChild(b);
      });
      box.appendChild(hand);
      return;
    }
    box.innerHTML = '<div class="waiting"><span class="back" aria-hidden="true"></span><span>等待 ' +
      esc(state.players[state.pendingSeat] ? state.players[state.pendingSeat].name : '其他玩家') + ' 行动…</span></div>';
  }

  function render(r) {
    var state = r.state;
    $('roomChip').textContent = '房间 ' + (r.code || r.roomId) + ' · ' + (r.started ? (r.over ? '已结束' : '进行中') : '等待玩家') + ' · ' + r.playerCount + ' 人';
    $('seats').innerHTML = r.seats.map(function (seat) { return seatHtml(seat, state, r.you); }).join('');
    $('startBtn').hidden = r.started;
    $('startBtn').disabled = !r.seats.some(function (s) { return s.isYou && s.isHost; });
    $('inviteBtn').disabled = !r.seats.some(function (s) { return s.isYou && s.isHost; });
    if (state) {
      $('roundLabel').textContent = '第 ' + state.round + ' / ' + state.rounds + ' 轮';
      $('phaseChip').textContent = state.phase === 'over' ? '对局结束' : (state.phase === 'chooseRow' ? '选择吃行' : '同时暗出');
      $('rows').innerHTML = rowsHtml(state);
      $('note').textContent = state.phase === 'over'
        ? '十轮结束，牛头分最低者获胜。'
        : (state.phase === 'chooseRow'
          ? (state.pendingSeat === r.you ? '轮到你选择吃哪一行。' : '等待 ' + (state.players[state.pendingSeat] ? state.players[state.pendingSeat].name : '玩家') + ' 选择吃行…')
          : '已出 ' + state.players.filter(function (p) { return p.picked; }).length + ' / ' + state.players.length +
            ' 人；暗牌会在本轮全部出齐后按数字从小到大翻开。');
      $('logList').innerHTML = (state.log || []).slice(-14).map(function (line) { return '<li>' + esc(line) + '</li>'; }).join('');
    }
    renderChoice(r);
    var fin = $('finale');
    if (r.over && r.result) {
      fin.hidden = false;
      var result = r.result;
      $('finaleTitle').textContent = result.tied ? '并列最低分' : (result.winnerName ? result.winnerName + ' 获胜' : '结算');
      $('finaleSub').textContent = '低分者胜 · 10 轮 · ' + (result.turns == null ? '' : result.turns + ' 次暗出');
      $('finaleRows').innerHTML = (result.losers || []).slice().sort(function (a, b) { return a.score - b.score; }).map(function (row) {
        return '<div class="lbrow"><span>' + esc(row.name) + '</span><b>' + row.score + ' 牛</b></div>';
      }).join('');
      $('restartBtn').hidden = !r.canRestart;
    } else {
      fin.hidden = true;
    }
    $('leaveBtn').hidden = !r.started;
  }

  function fetchRoom() {
    if (!roomKey || !session) { showBoard(false); return Promise.resolve(null); }
    return api('GET', '/api/rooms/' + encodeURIComponent(roomKey) + '?session=' + encodeURIComponent(session) + '&playerId=' + encodeURIComponent(playerId))
      .then(function (r) {
        if (r.status === 401) {
          return api('POST', '/api/rooms/' + encodeURIComponent(roomKey) + '/reconnect', { session: session, playerId: playerId })
            .then(function (rr) {
              if (!rr.body || !rr.body.ok) throw new Error('房间已失效，请重新创建。');
              return rr;
            });
        }
        if (r.status >= 400) throw new Error(errText(r));
        return r;
      })
      .then(function (r) {
        if (!r) return;
        var view = r.body || {};
        showBoard(true);
        if (view.stateVersion !== lastVersion) {
          lastVersion = view.stateVersion;
          render(view);
        } else {
          $('seats').innerHTML = (view.seats || []).map(function (seat) { return seatHtml(seat, view.state, view.you); }).join('');
        }
        if (view.inviteCode) invite = view.inviteCode;
      })
      .catch(function (e) { toast(e.message); });
  }

  function poll() {
    if (timer) clearInterval(timer);
    fetchRoom();
    timer = setInterval(fetchRoom, 700);
  }

  function act(action) {
    if (!session) return;
    toast('');
    api('POST', '/api/rooms/' + encodeURIComponent(roomKey) + '/actions', {
      session: session, playerId: playerId, action: action
    }).then(function (r) {
      if (r.status >= 400) throw new Error(errText(r));
      lastVersion = -1;
      return fetchRoom();
    }).catch(function (e) { toast(e.message); });
  }

  $('createBtn').addEventListener('click', createRoom);
  $('joinBtn').addEventListener('click', function () {
    $('joinFields').hidden = false;
    joinRoom();
  });
  $('startBtn').addEventListener('click', function () {
    api('POST', '/api/rooms/' + encodeURIComponent(roomKey) + '/start', { session: session, playerId: playerId })
      .then(function (r) { if (r.status >= 400) throw new Error(errText(r)); lastVersion = -1; return fetchRoom(); })
      .catch(function (e) { toast(e.message); });
  });
  $('restartBtn').addEventListener('click', function () {
    api('POST', '/api/rooms/' + encodeURIComponent(roomKey) + '/restart', { session: session, playerId: playerId })
      .then(function (r) { if (r.status >= 400) throw new Error(errText(r)); lastVersion = -1; return fetchRoom(); })
      .catch(function (e) { toast(e.message); });
  });
  $('leaveBtn').addEventListener('click', function () {
    api('POST', '/api/rooms/' + encodeURIComponent(roomKey) + '/leave', { session: session, playerId: playerId })
      .then(function () { showBoard(false); if (timer) clearInterval(timer); })
      .catch(function () { showBoard(false); });
  });
  $('inviteBtn').addEventListener('click', function () {
    var url = location.origin + '/boardgame/six-nimmt-premium/online.html?room=' + encodeURIComponent(roomKey) + '&code=' + encodeURIComponent(invite || '');
    var done = function () { toast('邀请链接已复制：' + url); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done).catch(done);
    else done();
  });

  function loadLeaderboard() {
    if (location.pathname.indexOf('/games/') === 0) return; // static site: no room API
    api('GET', '/api/leaderboard?game=six-nimmt-premium').then(function (r) {
      var entries = (r.body && r.body.entries) || [];
      $('leaderboard').innerHTML = entries.length
        ? entries.slice(0, 12).map(function (e) {
          return '<div class="lbrow"><span>' + esc(e.name) + (e.ai ? ' · AI' : '') + '</span><b>' + (e.winner ? '胜' : (e.score == null ? '' : e.score)) + '</b></div>';
        }).join('')
        : '<p class="muted">还没有结算记录。</p>';
    }).catch(function () {});
  }
  loadLeaderboard();
  setInterval(loadLeaderboard, 5000);

  if (roomKey && session) { showBoard(true); poll(); }
  else if (roomKey && invite) { showBoard(false); $('joinFields').hidden = false; $('roomCode').value = invite; }
})();
</script>
</body>
</html>
