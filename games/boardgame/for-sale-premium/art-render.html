<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="房地产拍卖 For Sale 精品单机版：30 张房产、30 张支票、18 枚金币，两阶段拍卖与同时出售。3–6 人对战 AI，含规则页与联机房间。">
<title>For Sale art composition</title>
<style>
#stage,.stage{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
:root { --font-serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif SC", Georgia, serif; --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif; --art-table: url("../../assets/art/premium/for-sale/table-green.webp"); --art-prop: url("../../assets/art/premium/for-sale/property-card.webp"); --art-cheque: url("../../assets/art/premium/for-sale/cheque.webp"); --art-coin: url("../../assets/art/premium/for-sale/coin.webp"); --art-house: url("../../assets/art/premium/for-sale/house-token.webp"); --gold: #d9b66c; --gold-2: #f2dfa8; --ink: #f4ecdc; --ink-dim: #bccfbf; --paper: #f3e7d0; --paper-ink: #3a2a22; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #050e09; }
body { width: 1200px; min-height: 630px; overflow: hidden; color: var(--ink); font-family: var(--font-sans); }
.stage { position: relative; width: 1200px; height: 1200px; overflow: hidden; background: radial-gradient(950px 720px at 12% -6%, rgba(47,107,71,.4), transparent 62%), radial-gradient(800px 700px at 94% 8%, rgba(217,182,108,.14), transparent 58%), linear-gradient(150deg, #0d2a1a, #050e09 74%); }
.stage::before { content: ""; position: absolute; inset: 0; background: var(--art-table) center / cover no-repeat; opacity: .58; filter: saturate(.82) contrast(1.05); }
.stage::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, transparent 0 38%, rgba(3,10,6,.55) 100%); }
.scene { position: absolute; inset: 0; display: none; z-index: 2; }
body[data-shot="cover"] .scene-cover { display: block; }
body[data-shot="og"] .scene-og { display: block; }
body[data-shot="detail1"] .scene-detail1 { display: block; }
body[data-shot="detail2"] .scene-detail2 { display: block; }
.eyebrow { font-size: 16px; letter-spacing: .5em; color: var(--gold); text-transform: uppercase; }
.title { font-family: var(--font-serif); font-weight: 700; line-height: .98; }
.subtitle { font-family: var(--font-serif); color: var(--gold-2); }
.rule { height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

.prop { position: relative; width: 180px; height: 252px; border-radius: 10px; overflow: hidden; background: var(--art-prop) center / cover no-repeat, var(--paper); border: 1px solid rgba(90,60,40,.42); box-shadow: 0 22px 44px rgba(0,0,0,.52); color: #2e4a5f; }
.prop::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(60,80,100,.22); border-radius: 6px; }
.prop .corner { position: absolute; top: 8px; left: 10px; font-family: var(--font-serif); font-size: 18px; font-weight: 700; }
.prop .corner.r { left: auto; right: 10px; transform: rotate(180deg); }
.prop .face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.prop .pv { font-family: var(--font-serif); font-size: 58px; font-weight: 700; line-height: 1; }
.prop .house { width: 52%; color: #8a5a35; }
.prop .plabel { font-size: 14px; letter-spacing: .2em; color: #6b5a45; }
.prop.small { width: 110px; height: 154px; }
.prop.small .pv { font-size: 34px; }
.prop.small .plabel { font-size: 12px; }
.prop.small .corner { font-size: 14px; }
.cheque { position: relative; width: 150px; height: 105px; border-radius: 6px; overflow: hidden; background: var(--art-cheque) center / cover no-repeat, #eef0d8; border: 1px solid rgba(60,80,40,.35); box-shadow: 0 14px 28px rgba(0,0,0,.35); color: #2c3a24; display: grid; place-items: center; }
.cheque .cv { font-family: var(--font-serif); font-size: 40px; font-weight: 700; }
.cheque .clabel { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; font-size: 13px; letter-spacing: .16em; color: #5a6a4a; }
.cheque.small { width: 104px; height: 73px; }
.cheque.small .cv { font-size: 28px; }
.coin { width: 54px; height: 54px; border-radius: 50%; background: var(--art-coin) center / 160% no-repeat, #c9a25e; border: 2px solid #6b4a1a; box-shadow: 0 4px 10px rgba(0,0,0,.5); }
.house-token { width: 190px; height: 260px; background: var(--art-house) center / contain no-repeat; filter: drop-shadow(0 18px 26px rgba(0,0,0,.55)); }

.cover-top { position: absolute; left: 80px; right: 80px; top: 60px; text-align: center; }
.cover-top .title { font-size: 110px; letter-spacing: .08em; margin-top: 16px; color: #f8efdc; text-shadow: 0 6px 0 rgba(20,60,36,.45), 0 24px 60px rgba(0,0,0,.6); }
.cover-top .subtitle { font-size: 26px; letter-spacing: .46em; margin-top: 12px; }
.cover-top .rule { width: 560px; margin: 22px auto 0; }
.cover-lot { position: absolute; left: 50%; top: 336px; transform: translateX(-50%); display: flex; align-items: flex-end; gap: 22px; }
.cover-lot .prop:nth-child(1) { transform: rotate(-9deg) translateY(22px); }
.cover-lot .prop:nth-child(2) { transform: rotate(-3deg) translateY(4px); }
.cover-lot .prop:nth-child(3) { transform: rotate(4deg) translateY(10px); }
.cover-lot .cheque-group { display: flex; flex-direction: column; gap: 10px; transform: rotate(6deg); }
.cover-lot .coins { position: absolute; left: -40px; bottom: -46px; display: flex; gap: 4px; }
.cover-lot .coins .coin:nth-child(2) { transform: translateY(-10px); }
.cover-lot .coins .coin:nth-child(3) { transform: translateY(-20px); }
.cover-lot .house-token { position: absolute; right: -56px; bottom: -50px; width: 150px; height: 205px; }
.cover-foot { position: absolute; left: 0; right: 0; bottom: 104px; text-align: center; font-size: 20px; letter-spacing: .16em; color: var(--ink-dim); }
.cover-note { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-size: 14px; letter-spacing: .24em; color: rgba(188,207,191,.72); }

.og-left { position: absolute; left: 70px; top: 84px; width: 540px; }
.og-left .title { font-size: 86px; letter-spacing: .04em; margin-top: 14px; }
.og-left .subtitle { font-size: 20px; letter-spacing: .4em; margin-top: 10px; }
.og-left .desc { margin-top: 24px; font-size: 19px; line-height: 1.7; color: var(--ink-dim); }
.og-left .rule { width: 400px; margin: 20px 0; }
.og-right { position: absolute; right: 40px; top: 70px; width: 560px; height: 500px; }
.og-right .prop { position: absolute; width: 170px; height: 238px; }
.og-right .p1 { left: 30px; top: 120px; transform: rotate(-10deg); }
.og-right .p2 { left: 170px; top: 80px; transform: rotate(-2deg); z-index: 3; }
.og-right .p3 { left: 310px; top: 120px; transform: rotate(8deg); }
.og-right .cheque { position: absolute; right: 10px; bottom: 22px; transform: rotate(8deg); z-index: 4; }

.detail-head { position: absolute; left: 70px; right: 70px; top: 54px; }
.detail-head .eyebrow { font-size: 15px; letter-spacing: .42em; }
.detail-head .title { font-size: 54px; margin-top: 8px; letter-spacing: .04em; }
.detail-head .sub { position: absolute; right: 0; bottom: 8px; font-size: 17px; color: var(--ink-dim); }
.detail-rule { position: absolute; left: 70px; right: 70px; top: 174px; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }
.prop-ladder { position: absolute; left: 60px; right: 60px; top: 214px; display: flex; gap: 12px; justify-content: center; align-items: flex-end; }
.prop-ladder .prop { width: 118px; height: 166px; }
.prop-ladder .prop .pv { font-size: 34px; }
.prop-ladder .prop .plabel { font-size: 12px; }
.cheque-row-art { position: absolute; left: 60px; right: 60px; bottom: 70px; display: flex; gap: 14px; justify-content: center; }

.detail2-left { position: absolute; left: 70px; top: 74px; width: 480px; }
.detail2-left .title { font-size: 50px; letter-spacing: .04em; }
.detail2-left .p { margin-top: 20px; font-size: 18px; line-height: 1.8; color: var(--ink-dim); }
.detail2-left .coins { display: flex; gap: 8px; margin-top: 26px; }
.detail2-right { position: absolute; right: 50px; top: 80px; width: 600px; height: 680px; }
.detail2-right .prop { position: absolute; width: 150px; height: 210px; }
.detail2-right .p1 { left: 8px; top: 60px; transform: rotate(-10deg); }
.detail2-right .p2 { left: 168px; top: 30px; transform: rotate(-2deg); z-index: 3; }
.detail2-right .p3 { left: 328px; top: 70px; transform: rotate(9deg); }
.detail2-right .cheques { position: absolute; left: 20px; top: 330px; display: flex; gap: 8px; flex-wrap: wrap; width: 340px; }
.detail2-right .house-token { position: absolute; right: -6px; bottom: 20px; width: 190px; height: 250px; }
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/for-sale-premium/art-render.html">
<style>
/* site-quality: fixed-size art composition must not create page overflow */
html{overflow-x:hidden}
body{width:100%!important;max-width:100vw!important;overflow-x:hidden}
.stage,#stage{max-width:100vw;overflow:hidden}
</style>
</head>
<body>
<div class="stage">
  <div class="scene scene-cover">
    <div class="cover-top">
      <div class="eyebrow">Premium Edition · 3–6 Players</div>
      <div class="title">房地产拍卖</div>
      <div class="subtitle">FOR SALE</div>
      <div class="rule"></div>
    </div>
    <div class="cover-lot" id="coverLot"></div>
    <div class="cover-foot">30 张房产 · 30 张支票 · 每人 18 枚金币</div>
    <div class="cover-note">BID · BUY · SELL</div>
  </div>

  <div class="scene scene-og">
    <div class="og-left">
      <div class="eyebrow">Premium Edition</div>
      <div class="title">房地产拍卖</div>
      <div class="subtitle">FOR SALE</div>
      <div class="rule"></div>
      <div class="desc">先用金币买下房产，<br>再把房产换成支票。</div>
    </div>
    <div class="og-right" id="ogRight"></div>
  </div>

  <div class="scene scene-detail1">
    <div class="detail-head">
      <div class="eyebrow">30 PROPERTIES · 30 CHEQUES</div>
      <div class="title">房产 1–30，支票 0–15</div>
      <div class="sub">支票：0、0、2、2 … 15、15</div>
    </div>
    <div class="detail-rule"></div>
    <div class="prop-ladder" id="propLadder"></div>
    <div class="cheque-row-art" id="chequeRowArt"></div>
  </div>

  <div class="scene scene-detail2">
    <div class="detail2-left">
      <div class="eyebrow" style="font-size:15px;letter-spacing:.42em">TWO PHASES</div>
      <div class="title">先买，再卖</div>
      <div class="p">拍卖阶段逐张竞拍房产；出售阶段每轮公开一组支票，<br>所有人同时出一张房产，价值最高者拿最高支票。<br>最终现金 = 剩余金币 + 所有支票。</div>
      <div class="coins"><span class="coin"></span><span class="coin"></span><span class="coin"></span><span class="coin"></span><span class="coin"></span><span class="coin"></span></div>
    </div>
    <div class="detail2-right" id="detail2Right"></div>
  </div>
</div>
<script>
function houseSvg() { return '<svg class="house" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M8 30 32 10l24 20v24H8z"/><path d="M24 54V34h16v20"/><path d="M32 18v8M28 22h8"/></svg>'; }
function prop(v, cls) { return '<div class="prop ' + (cls || '') + '"><div class="corner">' + v + '</div><div class="corner r">' + v + '</div><div class="face"><div class="pv">' + v + '</div>' + houseSvg() + '<div class="plabel">房产</div></div></div>'; }
function cheque(v, cls) { return '<div class="cheque ' + (cls || '') + '"><div class="cv">$' + v + '</div><div class="clabel">支票</div></div>'; }
function coin() { return '<span class="coin"></span>'; }

document.getElementById('coverLot').innerHTML =
  prop(7, '') + prop(19, '') + prop(28, '') +
  '<div class="cheque-group">' + cheque(15) + cheque(10) + '</div>' +
  '<div class="coins">' + coin() + coin() + coin() + coin() + coin() + '</div>' +
  '<div class="house-token"></div>';

document.getElementById('ogRight').innerHTML =
  prop(12, 'p1') + prop(24, 'p2') + prop(30, 'p3') + cheque(15);

document.getElementById('propLadder').innerHTML = [1, 5, 10, 15, 20, 25, 30].map(function (v) { return prop(v); }).join('');
document.getElementById('chequeRowArt').innerHTML = [0, 4, 8, 12, 15].map(function (v) { return cheque(v); }).join('');

document.getElementById('detail2Right').innerHTML =
  prop(8, 'p1') + prop(20, 'p2') + prop(30, 'p3') +
  '<div class="cheques">' + cheque(15, 'small') + cheque(10, 'small') + cheque(5, 'small') + '</div>' +
  '<div class="house-token"></div>';

var shot = new URLSearchParams(location.search).get('shot') || 'cover';
document.body.dataset.shot = shot;
</script>
</body>
</html>
