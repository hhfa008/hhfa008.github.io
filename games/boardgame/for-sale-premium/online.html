<style>
:root { --font-serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif SC", Georgia, serif; --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; --art-table: url("../../assets/art/premium/for-sale/table-green.webp"); --art-prop: url("../../assets/art/premium/for-sale/property-card.webp"); --art-cheque: url("../../assets/art/premium/for-sale/cheque.webp"); --art-coin: url("../../assets/art/premium/for-sale/coin.webp"); --bg: #07170f; --bg-2: #0d2418; --panel: rgba(13,40,26,.9); --ink: #f4ecdc; --ink-soft: #d8e4d6; --ink-dim: #9db3a4; --gold: #d9b66c; --gold-2: #f2dfa8; --line: rgba(217,182,108,.26); --line-soft: rgba(217,182,108,.12); --danger: #e07a6b; --paper: #f3e7d0; --paper-ink: #3a2a22; }

body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink); font-family: var(--font-sans); font-size: 16px; background: radial-gradient(1000px 720px at 10% -8%, rgba(47,107,71,.32), transparent 60%), linear-gradient(158deg, var(--bg), var(--bg-2) 68%, #050e09); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--art-table) center / cover no-repeat; opacity: .4; }
a { color: var(--gold-2); }
button, input, select, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 18px 14px 40px; }

.top h1 small { display: block; font-size: 12px; letter-spacing: .24em; color: var(--gold); margin-top: 3px; }

.panel h2 { margin: 0 0 10px; font-family: var(--font-serif); font-size: 17px; letter-spacing: .05em; color: var(--gold-2); }

input, select { width: 100%; min-height: 44px; border-radius: 9px; border: 1px solid var(--line); background: rgba(4,12,7,.72); color: var(--ink); padding: 9px 11px; font-size: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.prop .v { font-family: var(--font-serif); font-size: 38px; font-weight: 700; }
.big { font-family: var(--font-serif); font-size: 24px; font-weight: 700; color: var(--gold-2); }
.cheques { display: flex; gap: 7px; flex-wrap: wrap; margin: 8px 0; }

.props { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.props .pcard { width: 64px; aspect-ratio: 63/88; border-radius: 5px; background: var(--art-prop) center / cover no-repeat, var(--paper); border: 2px solid transparent; display: grid; place-items: center; color: #2e4a5f; font-family: var(--font-serif); font-size: 20px; font-weight: 700; }
.props .pcard.sel { border-color: var(--gold-2); }
.props .pcard:disabled { opacity: .45; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.controls button { min-height: 44px; min-width: 60px; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: rgba(24,58,36,.75); color: var(--ink); font-size: 13px; font-weight: 600; }
.controls button.primary { background: linear-gradient(160deg, #4f8f62, #2a5f3e); border-color: var(--gold-2); color: #f7fbf4; }
.log { max-height: 110px; overflow-y: auto; border: 1px solid var(--line-soft); border-radius: 9px; background: rgba(4,12,7,.45); padding: 8px 10px; font-size: 12px; line-height: 1.6; color: var(--ink-soft); margin: 10px 0; }
.log p { margin: 0 0 4px; }
.result .line { display: flex; justify-content: space-between; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line-soft); margin-bottom: 5px; font-size: 13px; }
.result .line.win { border-color: rgba(242,223,168,.5); background: rgba(47,107,71,.3); }
@media (max-width: 480px) { .wrap { padding: 12px 10px 30px; } .panel { padding: 12px; } }

<body>
<div class="wrap">
  <header class="top">
    <h1>房地产拍卖 <small>FOR SALE · ONLINE</small></h1>
    <div class="row"><a class="btn" href="index.html">单人牌桌</a><a class="btn" href="../spectate.html">围观</a><a class="btn" href="rules.html">规则</a><button class="btn sfx-toggle" type="button" aria-label="音效开关"></button></div>
  </header>

  <div class="grid" id="launcher">
    <section class="panel">
      <h2>创建房间</h2>
      <p>3–6 人。空位由 AI 补足（默认 4 人桌，人多时自动扩容），房主点「开始对局」后发牌。</p>
      <label for="hostName">你的名字</label><input id="hostName" maxlength="16" placeholder="例如：砖红经纪" autocomplete="nickname">
      <label for="hostPw">房间密码（可选）</label><input id="hostPw" maxlength="64" placeholder="留空则公开房间" autocomplete="off">
      <div class="row" style="margin-top:12px"><button class="btn primary grow" id="createBtn" type="button">创建房间</button></div>
    </section>
    <section class="panel">
      <h2>加入房间</h2>
      <p>输入房间码，或从邀请链接直接进入（房间码 + 邀请令牌）。</p>
      <label for="joinName">你的名字</label><input id="joinName" maxlength="16" placeholder="例如：橄榄经纪" autocomplete="nickname">
      <label for="joinCode">房间码</label><input id="joinCode" maxlength="64" placeholder="例如：ROOM-42" autocomplete="off">
      <label for="joinInvite">邀请令牌（可选）</label><input id="joinInvite" maxlength="64" placeholder="邀请链接会自动填入" autocomplete="off">
      <label for="joinPw">房间密码（如需要）</label><input id="joinPw" maxlength="64" placeholder="可选" autocomplete="off">
      <div class="row" style="margin-top:12px"><button class="btn primary grow" id="joinBtn" type="button">加入房间</button></div>
    </section>
  </div>

  <div class="lobby" id="lobby">
    <section class="panel">
      <h2>房间大厅</h2>
      <div class="status" id="lobbyStatus">等待连接…</div>
      <div class="row" style="margin-bottom:10px">
        <div class="grow"><div style="font-size:12px;color:var(--ink-dim)">房间码</div><div class="room-code" id="roomCode">—</div></div>
        <div class="grow"><div style="font-size:12px;color:var(--ink-dim)">邀请码</div><div id="inviteCode" style="font-size:13px;word-break:break-all">—</div></div>
      </div>
      <div id="seatList"></div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="startBtn" type="button" disabled>开始对局</button><button class="btn" id="copyBtn" type="button">复制邀请</button><button class="btn" id="leaveBtn" type="button">离开</button><button class="btn" id="closeBtn" type="button">关房</button></div>
    </section>
  </div>

  <div class="game" id="game">
    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <div><span style="font-size:12px;color:var(--ink-dim)">房间</span> <b id="gameRoom" class="room-code" style="font-size:18px">—</b></div>
        <div class="row"><span class="status" id="gameStatus" style="margin:0">—</span><button class="btn" id="refreshBtn" type="button">刷新</button><button class="btn" id="leave2Btn" type="button">离开</button><button class="btn" id="close2Btn" type="button">关房</button></div>
      </div>
      <div class="players" id="gamePlayers"></div>
      <div class="status" id="gameTurn">—</div>
      <div class="lot" id="gameLot" style="display:none"></div>
      <div class="cheques" id="gameCheques" style="display:none"></div>
      <div class="props" id="gameProps"></div>
      <div class="controls" id="gameControls"></div>
      <div class="log" id="gameLog" aria-live="polite"></div>
      <div class="result" id="gameResult"></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="rematchBtn" type="button" style="display:none">再来一局</button></div>
    </section>
  </div>
</div>

<script src="../../shared/sfx.js"></script>
<script>
(function () {
  'use strict';
  var LS = 'hhfa-for-sale-online-v2';
  var st = { session: null, playerId: null, roomId: null, invite: null, view: null, selected: null, poll: null, busy: false };
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function sfx(n) { try { window.Sfx && window.Sfx.play && window.Sfx.play(n); } catch (e) {} }
  function setStatus(node, t, err) { node.textContent = t; node.classList.toggle('err', !!err); }
  function save() { try { localStorage.setItem(LS, JSON.stringify({ session: st.session, playerId: st.playerId, roomId: st.roomId })); } catch (e) {} }
  function clearSave() { try { localStorage.removeItem(LS); } catch (e) {} }
  function randomId() { return 'p-' + Math.random().toString(36).slice(2, 10); }
  function randomName() { return '经纪' + Math.floor(Math.random() * 900 + 100); }
  async function api(method, route, body) {
    var r = await fetch(route, { method: method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    var text = await r.text(), data = null;
    try { data = JSON.parse(text); } catch (e) {}
    return { status: r.status, body: data };
  }
  function roomUrl(s) { return '/api/rooms/' + encodeURIComponent(st.roomId) + (s || ''); }
  function viewUrl() { return roomUrl() + '?session=' + encodeURIComponent(st.session) + '&playerId=' + encodeURIComponent(st.playerId); }
  function errText(res) { return (res.body && res.body.error && res.body.error.message) || ('请求失败 (' + res.status + ')'); }
  function isHost() { return !!(st.view && st.view.seats && st.view.seats[st.view.you] && st.view.seats[st.view.you].isHost); }

  function apply(view) { if (!view) return; st.view = view; render(); }
  async function refresh() {
    if (!st.roomId || !st.session || st.busy) return;
    st.busy = true;
    try {
      var res = await api('GET', viewUrl());
      if (res.status === 200 && res.body) apply(res.body);
      else if (res.status === 404 || res.status === 401) { setStatus($('lobbyStatus'), '房间已关闭或会话已失效。', true); stopPolling(); }
    } catch (e) {}
    st.busy = false;
  }
  function startPolling() { stopPolling(); st.poll = setInterval(refresh, 1100); refresh(); }
  function stopPolling() { if (st.poll) { clearInterval(st.poll); st.poll = null; } }

  function enter(res, playerId, invite) {
    st.view = res.body;
    st.session = res.body.session || st.session;
    st.playerId = res.body.playerId || playerId;
    st.roomId = res.body.roomId;
    st.invite = invite || res.body.inviteCode || st.invite;
    save();
    $('launcher').style.display = 'none';
    try { history.replaceState({}, '', '?room=' + encodeURIComponent(st.roomId)); } catch (e) {}
    render(); startPolling(); sfx('notify');
  }

  function renderSeats() {
    var v = st.view; if (!v) return;
    var host = $('seatList'); host.innerHTML = '';
    (v.seats || []).forEach(function (s) {
      var row = document.createElement('div'); row.className = 'seat';
      var left = document.createElement('div'); left.textContent = s.name || ('座位 ' + (s.index + 1));
      var takeover = (v.takeover || []).indexOf(s.index) !== -1;
      var tag = document.createElement('span'); tag.className = 'tag' + (s.ai ? ' ai' : '') + (takeover ? ' takeover' : '');
      tag.textContent = s.ai ? 'AI' : (takeover ? '已托管' : (s.isHost ? '房主' : (s.isYou ? '你' : '玩家')));
      row.appendChild(left); row.appendChild(tag); host.appendChild(row);
    });
    $('roomCode').textContent = v.code || '—';
    $('inviteCode').textContent = v.inviteCode || '—';
    $('startBtn').disabled = !(isHost() && !v.started);
    setStatus($('lobbyStatus'), v.started ? '对局已开始。' : '等待玩家与房主开始。');
  }

  function render() {
    var v = st.view; if (!v) return;
    if (!v.started) {
      $('game').classList.remove('on'); $('lobby').classList.add('on'); $('launcher').style.display = 'grid';
      $('closeBtn').style.display = isHost() ? '' : 'none'; renderSeats(); return;
    }
    $('game').classList.add('on'); $('lobby').classList.remove('on'); $('launcher').style.display = 'none';
    $('gameRoom').textContent = v.code || '—';
    $('rematchBtn').style.display = v.canRestart ? '' : 'none';
    $('close2Btn').style.display = isHost() ? '' : 'none';
    var s = v.state || {};
    var legal = v.legalActions || [];
    var actor = s.phase === 'auction' && s.auction ? s.auction.turn : (s.phase === 'sell' && s.sell ? s.sell.current : null);
    setStatus($('gameStatus'), s.over ? '对局结束' : (legal.length ? '轮到你' : '等待其他人…'));
    var meIndex = v.you == null ? 0 : v.you;

    var board = $('gamePlayers'); board.innerHTML = '';
    (s.players || []).forEach(function (p) {
      var box = document.createElement('div'); box.className = 'pbox' + (actor === p.index ? ' turn' : '');
      box.innerHTML = '<div class="nm">' + esc(p.name) + (p.index === meIndex ? '（你）' : '') + '</div>' +
        '<div class="sub">' + (p.isAI ? 'AI' : '玩家') + ' · 房产 ' + p.propCount + ' · 支票 ' + p.checkCount + '</div>' +
        '<div class="money">' + p.money + ' 枚</div>';
      board.appendChild(box);
    });

    var turn = '';
    if (s.over) turn = '对局结束。';
    else if (s.phase === 'auction') turn = legal.length ? '轮到你出价：房产 ' + s.auction.card + '，当前最高 ' + (s.auction.currentBid < 0 ? '—' : s.auction.currentBid) : '拍卖 · 等待 ' + ((s.players[s.auction.turn] || {}).name || '玩家');
    else if (s.phase === 'sell') turn = legal.length ? '轮到你选择出售的房产' : '出售 · 等待 ' + ((s.players[s.sell.current] || {}).name || '玩家');
    $('gameTurn').textContent = turn;

    var lot = $('gameLot');
    if (s.phase === 'auction' && s.auction) {
      lot.style.display = '';
      lot.innerHTML = '<div class="prop"><span class="v">' + s.auction.card + '</span></div><div><div style="font-size:12px;color:var(--ink-dim)">当前拍品</div><div class="big">房产 ' + s.auction.card + '</div><div style="font-size:12px;color:var(--ink-dim)">最高 ' + (s.auction.currentBid < 0 ? '—' : s.auction.currentBid + ' 枚') + '</div></div>';
    } else lot.style.display = 'none';

    var cheques = $('gameCheques');
    if (s.phase === 'sell' && s.sell) {
      cheques.style.display = '';
      cheques.innerHTML = (s.sell.cheques || []).map(function (x) { return '<div class="cheque">$' + x + '</div>'; }).join('');
    } else cheques.style.display = 'none';

    var sellCards = legal.filter(function (m) { return m.type === 'sell'; }).map(function (m) { return m.card; });
    if (st.selected != null && sellCards.indexOf(st.selected) === -1) st.selected = null;
    var props = $('gameProps'); props.innerHTML = '';
    if (s.phase === 'sell') {
      var me = (s.players || [])[meIndex] || { props: [] };
      (me.props || []).slice().sort(function (a, b) { return a - b; }).forEach(function (x) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'pcard' + (st.selected === x ? ' sel' : ''); b.textContent = x;
        b.disabled = sellCards.indexOf(x) === -1;
        b.addEventListener('click', function () { st.selected = st.selected === x ? null : x; render(); });
        props.appendChild(b);
      });
    }

    var controls = $('gameControls'); controls.innerHTML = '';
    function add(label, action, primary) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = label;
      if (primary) b.className = 'primary';
      b.addEventListener('click', function () { sendAction(action); });
      controls.appendChild(b);
    }
    if (s.phase === 'auction') {
      var bidMoves = legal.filter(function (m) { return m.type === 'bid'; });
      var amounts = bidMoves.map(function (m) { return m.amount; });
      var min = amounts.length ? Math.min.apply(null, amounts) : null;
      [min, min == null ? null : min + 1, min == null ? null : min + 2, min == null ? null : min + 5].forEach(function (amount) {
        if (amount == null || amounts.indexOf(amount) === -1) return;
        add(amount + ' 枚', { type: 'bid', amount: amount }, amount === min);
      });
      if (legal.some(function (m) { return m.type === 'pass'; })) add('放弃', { type: 'pass' });
    }
    if (s.phase === 'sell' && st.selected != null && sellCards.indexOf(st.selected) !== -1) {
      add('确认出售 ' + st.selected, { type: 'sell', card: st.selected }, true);
    }

    var log = $('gameLog'); log.innerHTML = '';
    (s.log || []).slice(-10).reverse().forEach(function (e) { var p = document.createElement('p'); p.textContent = e.text; log.appendChild(p); });
    var result = $('gameResult'); result.innerHTML = '';
    if (s.over) {
      var shown = v.result || s.result || null;
      var rows = (shown && shown.rows) || (shown && shown.scores) || [];
      var winners = (shown && shown.winners) || (shown && shown.winnerSeat != null ? [shown.winnerSeat] : []);
      rows.forEach(function (r) {
        var line = document.createElement('div'); line.className = 'line' + (winners.indexOf(r.index) >= 0 ? ' win' : '');
        line.innerHTML = '<span>' + esc(r.name || ('玩家 ' + (r.index + 1))) + '</span><b>$' + (r.total == null ? r : r.total) + '</b>';
        result.appendChild(line);
      });
    }
  }

  async function sendAction(action) {
    if (!st.view || !st.roomId) return;
    st.busy = true;
    try {
      var res = await api('POST', roomUrl('/actions'), { session: st.session, playerId: st.playerId, action: action });
      if (res.status === 200 && res.body) { apply(res.body); st.selected = null; sfx('move'); }
      else { setStatus($('gameStatus'), '行动失败：' + errText(res), true); refresh(); }
    } catch (e) { setStatus($('gameStatus'), '行动失败：' + e, true); }
    st.busy = false;
  }

  async function createRoom() {
    var name = ($('hostName').value || '').trim() || randomName();
    st.playerId = st.playerId || randomId();
    var res = await api('POST', '/api/rooms', { playerId: st.playerId, nickname: name, password: ($('hostPw').value || undefined) });
    if (res.status !== 201) { setStatus($('lobbyStatus'), '创建失败：' + errText(res), true); return; }
    enter(res, st.playerId, res.body.inviteCode);
  }
  async function joinRoom() {
    var name = ($('joinName').value || '').trim() || randomName();
    st.playerId = st.playerId || randomId();
    var code = ($('joinCode').value || '').trim();
    var invite = ($('joinInvite').value || '').trim();
    if (!code && !invite) { $('joinCode').focus(); return; }
    var target = code || invite;
    var body = { playerId: st.playerId, nickname: name, password: ($('joinPw').value || undefined) };
    if (invite) body.inviteCode = invite;
    var res = await api('POST', '/api/rooms/' + encodeURIComponent(target) + '/join', body);
    if (res.status !== 200) { setStatus($('lobbyStatus'), '加入失败：' + errText(res), true); return; }
    enter(res, st.playerId, invite || res.body.inviteCode);
  }
  async function startMatch() {
    var res = await api('POST', roomUrl('/start'), { session: st.session, playerId: st.playerId });
    if (res.status !== 200) { setStatus($('lobbyStatus'), '无法开始：' + errText(res), true); return; }
    apply(res.body); sfx('win');
  }
  async function restartMatch() {
    var res = await api('POST', roomUrl('/restart'), { session: st.session, playerId: st.playerId });
    if (res.status === 200) apply(res.body); else setStatus($('gameStatus'), '重赛失败：' + errText(res), true);
  }
  async function inviteMore() {
    var res = await api('POST', roomUrl('/invite'), { session: st.session, playerId: st.playerId });
    if (res.status === 200) st.invite = res.body.inviteCode || res.body.inviteToken || st.invite;
  }
  async function leaveRoom() {
    try { await api('POST', roomUrl('/leave'), { session: st.session, playerId: st.playerId }); } catch (e) {}
    clearSave(); stopPolling(); location.reload();
  }
  async function closeRoom() {
    try { await api('DELETE', roomUrl('') + '?session=' + encodeURIComponent(st.session) + '&playerId=' + encodeURIComponent(st.playerId)); } catch (e) {}
    clearSave(); stopPolling(); location.reload();
  }
  async function reconnectSaved() {
    try {
      var saved = JSON.parse(localStorage.getItem(LS) || 'null');
      if (!saved || !saved.session || !saved.roomId) return false;
      st.roomId = saved.roomId; st.session = saved.session; st.playerId = saved.playerId;
      var res = await api('POST', roomUrl('/reconnect'), { session: st.session, playerId: st.playerId });
      if (res.status !== 200) { clearSave(); st.roomId = null; st.session = null; return false; }
      st.view = res.body; st.playerId = res.body.playerId || st.playerId;
      $('launcher').style.display = 'none'; render(); startPolling(); return true;
    } catch (e) { return false; }
  }

  $('createBtn').addEventListener('click', createRoom);
  $('joinBtn').addEventListener('click', joinRoom);
  $('startBtn').addEventListener('click', startMatch);
  $('refreshBtn').addEventListener('click', refresh);
  $('rematchBtn').addEventListener('click', restartMatch);
  $('leaveBtn').addEventListener('click', leaveRoom);
  $('leave2Btn').addEventListener('click', leaveRoom);
  $('closeBtn').addEventListener('click', closeRoom);
  $('close2Btn').addEventListener('click', closeRoom);
  $('copyBtn').addEventListener('click', async function () {
    await inviteMore();
    var v = st.view || {};
    var text = location.origin + location.pathname + '?room=' + encodeURIComponent(st.roomId || v.code || '') +
      (st.invite ? '&code=' + encodeURIComponent(st.invite) : '');
    try { await navigator.clipboard.writeText(text); $('copyBtn').textContent = '已复制'; } catch (e) { $('copyBtn').textContent = text; }
  });
  var params = new URLSearchParams(location.search);
  if (params.get('room')) $('joinCode').value = params.get('room');
  if (params.get('code')) $('joinInvite').value = params.get('code');
  reconnectSaved().then(function (ok) { if (!ok) setStatus($('lobbyStatus'), '创建或加入一个房间。'); });
})();
</script>
</body>
</html>
