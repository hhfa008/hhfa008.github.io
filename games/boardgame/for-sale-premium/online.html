<style>
:root { --font-serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif SC", Georgia, serif; --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; --art-table: url("../../assets/art/premium/for-sale/table-green.webp"); --art-prop: url("../../assets/art/premium/for-sale/property-card.webp"); --art-cheque: url("../../assets/art/premium/for-sale/cheque.webp"); --art-coin: url("../../assets/art/premium/for-sale/coin.webp"); --bg: #07170f; --bg-2: #0d2418; --panel: rgba(13,40,26,.9); --ink: #f4ecdc; --ink-soft: #d8e4d6; --ink-dim: #9db3a4; --gold: #d9b66c; --gold-2: #f2dfa8; --line: rgba(217,182,108,.26); --line-soft: rgba(217,182,108,.12); --danger: #e07a6b; --paper: #f3e7d0; --paper-ink: #3a2a22; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink); font-family: var(--font-sans); font-size: 16px; background: radial-gradient(1000px 720px at 10% -8%, rgba(47,107,71,.32), transparent 60%), linear-gradient(158deg, var(--bg), var(--bg-2) 68%, #050e09); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--art-table) center / cover no-repeat; opacity: .4; }
a { color: var(--gold-2); }
button, input, select, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 18px 14px 40px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-family: var(--font-serif); font-size: clamp(20px, 4.6vw, 27px); letter-spacing: .06em; }
.top h1 small { display: block; font-size: 12px; letter-spacing: .24em; color: var(--gold); margin-top: 3px; }
.btn { min-height: 44px; min-width: 44px; padding: 10px 15px; border-radius: 11px; border: 1px solid var(--line); background: rgba(7,26,16,.72); color: var(--ink); font-size: 13px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.primary { background: linear-gradient(160deg, #4f8f62, #2a5f3e); border-color: rgba(242,223,168,.5); color: #f7fbf4; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 18px; }
.panel { border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(180deg, var(--panel), rgba(6,18,11,.92)); box-shadow: 0 18px 50px rgba(0,0,0,.42); padding: 16px; }
.panel h2 { margin: 0 0 10px; font-family: var(--font-serif); font-size: 17px; letter-spacing: .05em; color: var(--gold-2); }
.panel p { margin: 0 0 10px; font-size: 12px; line-height: 1.65; color: var(--ink-dim); }
label { display: block; font-size: 12px; color: var(--ink-dim); margin: 10px 0 4px; }
input, select { width: 100%; min-height: 44px; border-radius: 9px; border: 1px solid var(--line); background: rgba(4,12,7,.72); color: var(--ink); padding: 9px 11px; font-size: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1 1 140px; }
.room-code { font-family: var(--font-serif); font-size: 24px; letter-spacing: .18em; color: var(--gold-2); }
.status { padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line-soft); background: rgba(255,255,255,.04); font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
.status.err { color: var(--danger); border-color: rgba(224,122,107,.4); }
.seat { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; border: 1px solid var(--line-soft); border-radius: 10px; background: rgba(255,255,255,.03); margin-bottom: 7px; font-size: 13px; }
.seat .tag { font-size: 12px; padding: 3px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-dim); }
.seat .tag.ai { color: var(--gold-2); border-color: rgba(242,223,168,.4); }
.seat .tag.takeover { color: var(--danger); border-color: rgba(224,122,107,.4); }
.lobby, .game { display: none; margin-top: 16px; }
.lobby.on, .game.on { display: block; }
.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 7px; margin: 10px 0; }
.pbox { border: 1px solid var(--line-soft); border-radius: 11px; padding: 9px; background: rgba(5,16,10,.55); min-width: 0; }
.pbox .nm { font-family: var(--font-serif); font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbox .sub { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
.pbox .money { font-size: 17px; font-family: var(--font-serif); font-weight: 700; color: var(--gold-2); margin-top: 3px; }
.pbox.turn { border-color: rgba(242,223,168,.55); background: rgba(47,107,71,.3); }
.lot { display: flex; gap: 14px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
.prop { position: relative; width: 110px; aspect-ratio: 63/88; border-radius: 8px; background: var(--art-prop) center / cover no-repeat, var(--paper); border: 1px solid rgba(90,60,40,.4); display: grid; place-items: center; color: #2e4a5f; }
.prop .v { font-family: var(--font-serif); font-size: 38px; font-weight: 700; }
.big { font-family: var(--font-serif); font-size: 24px; font-weight: 700; color: var(--gold-2); }
.cheques { display: flex; gap: 7px; flex-wrap: wrap; margin: 8px 0; }
.cheque { width: 90px; aspect-ratio: 63/44; border-radius: 5px; background: var(--art-cheque) center / cover no-repeat, #eef0d8; border: 1px solid rgba(60,80,40,.35); display: grid; place-items: center; color: #2c3a24; font-family: var(--font-serif); font-size: 24px; font-weight: 700; }
.props { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.props .pcard { width: 64px; aspect-ratio: 63/88; border-radius: 5px; background: var(--art-prop) center / cover no-repeat, var(--paper); border: 2px solid transparent; display: grid; place-items: center; color: #2e4a5f; font-family: var(--font-serif); font-size: 20px; font-weight: 700; }
.props .pcard.sel { border-color: var(--gold-2); }
.props .pcard:disabled { opacity: .45; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.controls button { min-height: 44px; min-width: 60px; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: rgba(24,58,36,.75); color: var(--ink); font-size: 13px; font-weight: 600; }
.controls button.primary { background: linear-gradient(160deg, #4f8f62, #2a5f3e); border-color: var(--gold-2); color: #f7fbf4; }
.log { max-height: 110px; overflow-y: auto; border: 1px solid var(--line-soft); border-radius: 9px; background: rgba(4,12,7,.45); padding: 8px 10px; font-size: 12px; line-height: 1.6; color: var(--ink-soft); margin: 10px 0; }
.log p { margin: 0 0 4px; }
.result .line { display: flex; justify-content: space-between; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line-soft); margin-bottom: 5px; font-size: 13px; }
.result .line.win { border-color: rgba(242,223,168,.5); background: rgba(47,107,71,.3); }
@media (max-width: 480px) { .wrap { padding: 12px 10px 30px; } .panel { padding: 12px; } }
/* safe-area: keep the original bottom padding, clear the iOS home indicator */
body{padding-bottom:env(safe-area-inset-bottom)}
</style>

<body>
<div class="wrap">
  <header class="top">
    <h1>房地产拍卖 <small>FOR SALE · ONLINE</small></h1>
    <div class="row"><a class="btn" href="index.html">单人牌桌</a><a class="btn" href="rules.html">规则</a><button class="btn sfx-toggle" type="button" aria-label="音效开关"></button></div>
  </header>

  <div class="grid" id="launcher">
    <section class="panel">
      <h2>创建房间</h2>
      <p>3–6 人。空位由 AI 补足，房主点「开始对局」后发牌。</p>
      <label for="hostName">你的名字</label><input id="hostName" maxlength="16" placeholder="例如：砖红经纪" autocomplete="nickname">
      <label for="hostMax">人数</label><select id="hostMax"><option value="4">4 人</option><option value="3">3 人</option><option value="5">5 人</option><option value="6">6 人</option></select>
      <label for="hostPw">房间密码（可选）</label><input id="hostPw" maxlength="24" placeholder="留空则公开房间" autocomplete="off">
      <div class="row" style="margin-top:12px"><button class="btn primary grow" id="createBtn" type="button">创建房间</button></div>
    </section>
    <section class="panel">
      <h2>加入房间</h2>
      <p>输入房间码或邀请码，也可以从邀请链接直接进入。</p>
      <label for="joinName">你的名字</label><input id="joinName" maxlength="16" placeholder="例如：橄榄经纪" autocomplete="nickname">
      <label for="joinCode">房间码 / 邀请码</label><input id="joinCode" maxlength="64" placeholder="例如：LOT-42" autocomplete="off">
      <label for="joinPw">房间密码（如需要）</label><input id="joinPw" maxlength="24" placeholder="可选" autocomplete="off">
      <div class="row" style="margin-top:12px"><button class="btn primary grow" id="joinBtn" type="button">加入房间</button></div>
    </section>
  </div>

  <div class="lobby" id="lobby">
    <section class="panel">
      <h2>房间大厅</h2>
      <div class="status" id="lobbyStatus">等待连接…</div>
      <div class="row" style="margin-bottom:10px">
        <div class="grow"><div style="font-size:12px;color:var(--ink-dim)">房间码</div><div class="room-code" id="roomCode">—</div></div>
        <div class="grow"><div style="font-size:12px;color:var(--ink-dim)">邀请码</div><div id="inviteCode" style="font-size:13px;word-break:break-all">—</div></div>
      </div>
      <div id="seatList"></div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="startBtn" type="button" disabled>开始对局</button><button class="btn" id="copyBtn" type="button">复制邀请</button><button class="btn" id="leaveBtn" type="button">离开</button></div>
    </section>
  </div>

  <div class="game" id="game">
    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <div><span style="font-size:12px;color:var(--ink-dim)">房间</span> <b id="gameRoom" class="room-code" style="font-size:18px">—</b></div>
        <div class="row"><span class="status" id="gameStatus" style="margin:0">—</span><button class="btn" id="refreshBtn" type="button">刷新</button></div>
      </div>
      <div class="players" id="gamePlayers"></div>
      <div class="status" id="gameTurn">—</div>
      <div class="lot" id="gameLot" style="display:none"></div>
      <div class="cheques" id="gameCheques" style="display:none"></div>
      <div class="props" id="gameProps"></div>
      <div class="controls" id="gameControls"></div>
      <div class="log" id="gameLog" aria-live="polite"></div>
      <div class="result" id="gameResult"></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="rematchBtn" type="button" style="display:none">再来一局</button></div>
    </section>
  </div>
</div>

<script src="../../shared/sfx.js"></script>
<script>
(function () {
  'use strict';
  var LS = 'hhfa-for-sale-online-v1';
  var session = null, playerId = null, roomId = null, view = null;
  var selected = null, pollTimer = null, pollBusy = false;
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function sfx(n) { try { window.Sfx && window.Sfx.play && window.Sfx.play(n); } catch (e) {} }
  function setStatus(node, t, err) { node.textContent = t; node.classList.toggle('err', !!err); }
  function save() { try { localStorage.setItem(LS, JSON.stringify({ session: session, playerId: playerId, roomId: roomId })); } catch (e) {} }
  function clearSave() { try { localStorage.removeItem(LS); } catch (e) {} }
  async function api(method, route, body) {
    var r = await fetch(route, { method: method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    var text = await r.text(), data = null;
    try { data = JSON.parse(text); } catch (e) {}
    return { status: r.status, body: data };
  }
  function roomUrl(s) { return '/api/rooms/' + encodeURIComponent(roomId) + (s || ''); }
  function viewUrl() { return roomUrl() + '?session=' + encodeURIComponent(session) + '&playerId=' + encodeURIComponent(playerId); }
  async function refresh() {
    if (!roomId || !session || pollBusy) return;
    pollBusy = true;
    try {
      var res = await api('GET', viewUrl());
      if (res.status === 200 && res.body) { view = res.body; render(); }
      else if (res.status === 404) { setStatus($('lobbyStatus'), '房间已关闭。', true); stopPolling(); }
    } catch (e) {}
    pollBusy = false;
  }
  function startPolling() { stopPolling(); pollTimer = setInterval(refresh, 1100); }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  function renderSeats() {
    if (!view) return;
    var host = $('seatList'); host.innerHTML = '';
    view.seats.forEach(function (s) {
      var row = document.createElement('div'); row.className = 'seat';
      var left = document.createElement('div'); left.textContent = s.nickname;
      var tag = document.createElement('span'); tag.className = 'tag' + (s.ai ? ' ai' : '') + (s.takeover ? ' takeover' : '');
      tag.textContent = s.ai ? 'AI' : (s.takeover ? '已托管' : (s.playerId === view.hostId ? '房主' : '玩家'));
      row.appendChild(left); row.appendChild(tag); host.appendChild(row);
    });
    $('roomCode').textContent = view.roomCode || '—';
    $('inviteCode').textContent = view.inviteToken || view.inviteCode || '—';
    $('startBtn').disabled = !view.canStart;
    setStatus($('lobbyStatus'), view.started ? '对局已开始。' : '等待玩家与房主开始。');
  }

  function render() {
    if (!view) return;
    if (!view.started) {
      $('game').classList.remove('on'); $('lobby').classList.add('on'); $('launcher').style.display = 'grid'; renderSeats(); return;
    }
    $('game').classList.add('on'); $('lobby').classList.remove('on'); $('launcher').style.display = 'none';
    $('gameRoom').textContent = view.roomCode || '—';
    $('rematchBtn').style.display = view.canRestart ? '' : 'none';
    var s = view.state;
    setStatus($('gameStatus'), s.over ? '对局结束' : (view.canMove ? '轮到你' : '等待其他人…'));
    var meIndex = view.you ? view.you.playerIndex : 0;

    var board = $('gamePlayers'); board.innerHTML = '';
    s.players.forEach(function (p) {
      var box = document.createElement('div'); box.className = 'pbox' + (s.phase === 'auction' && s.auction && s.auction.turn === p.index ? ' turn' : '');
      box.innerHTML = '<div class="nm">' + esc(p.name) + (p.index === meIndex ? '（你）' : '') + '</div>' +
        '<div class="sub">' + (p.isAI ? 'AI' : '玩家') + ' · 房产 ' + p.propCount + ' · 支票 ' + p.checkCount + '</div>' +
        '<div class="money">' + p.money + ' 枚</div>';
      board.appendChild(box);
    });

    var turn = '';
    if (s.over) turn = '对局结束。';
    else if (s.phase === 'auction') turn = view.canMove ? '轮到你出价：房产 ' + s.auction.card + '，当前最高 ' + (s.auction.currentBid < 0 ? '—' : s.auction.currentBid) : '拍卖 · 等待 ' + s.players[s.auction.turn].name;
    else if (s.phase === 'sell') turn = view.canMove ? '轮到你选择出售的房产' : '出售 · 等待 ' + s.players[s.sell.current].name;
    $('gameTurn').textContent = turn;

    var lot = $('gameLot');
    if (s.phase === 'auction') {
      lot.style.display = '';
      lot.innerHTML = '<div class="prop"><span class="v">' + s.auction.card + '</span></div><div><div style="font-size:12px;color:var(--ink-dim)">当前拍品</div><div class="big">房产 ' + s.auction.card + '</div><div style="font-size:12px;color:var(--ink-dim)">最高 ' + (s.auction.currentBid < 0 ? '—' : s.auction.currentBid + ' 枚') + '</div></div>';
    } else lot.style.display = 'none';

    var cheques = $('gameCheques');
    if (s.phase === 'sell') {
      cheques.style.display = '';
      cheques.innerHTML = (s.sell.cheques || []).map(function (v) { return '<div class="cheque">$' + v + '</div>'; }).join('');
    } else cheques.style.display = 'none';

    var props = $('gameProps'); props.innerHTML = '';
    if (s.phase === 'sell') {
      var me = s.players[meIndex];
      (me.props || []).slice().sort(function (a, b) { return a - b; }).forEach(function (v) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'pcard' + (selected === v ? ' sel' : ''); b.textContent = v;
        b.disabled = !view.canMove;
        b.addEventListener('click', function () { if (view.canMove) { selected = selected === v ? null : v; render(); } });
        props.appendChild(b);
      });
    }

    var controls = $('gameControls'); controls.innerHTML = '';
    function add(label, move, primary) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = label;
      if (primary) b.className = 'primary';
      b.addEventListener('click', function () { sendMove(move); });
      controls.appendChild(b);
    }
    if (view.canMove && s.phase === 'auction') {
      var me = s.players[meIndex];
      var min = s.auction.highBidder < 0 ? 0 : s.auction.currentBid + 1;
      [min, min + 1, min + 2, min + 5].forEach(function (amount) {
        if (amount <= me.money) add(amount + ' 枚', { type: 'bid', amount: amount }, amount === min);
      });
      if (s.auction.highBidder >= 0) add('放弃', { type: 'pass' });
    }
    if (view.canMove && s.phase === 'sell' && selected != null) add('确认出售 ' + selected, { type: 'sell', card: selected }, true);
    if (view.canMove && s.phase === 'sell' && selected == null) add('先选择一张房产', { type: 'sell', card: -1 });

    var log = $('gameLog'); log.innerHTML = '';
    (s.log || []).slice(-10).reverse().forEach(function (e) { var p = document.createElement('p'); p.textContent = e.text; log.appendChild(p); });
    var result = $('gameResult'); result.innerHTML = '';
    if (s.over && s.result) {
      s.result.rows.forEach(function (r) {
        var line = document.createElement('div'); line.className = 'line' + (s.result.winners.indexOf(r.index) >= 0 ? ' win' : '');
        line.innerHTML = '<span>' + esc(r.name) + '</span><b>$' + r.total + '（金币 ' + r.money + ' + 支票 ' + r.chequeTotal + '）</b>';
        result.appendChild(line);
      });
    }
  }

  async function sendMove(move) {
    if (!view || !view.canMove) return;
    if (move.type === 'sell' && move.card < 0) return;
    var res = await api('POST', roomUrl('/actions'), { session: session, playerId: playerId, type: 'move', move: move });
    if (res.status === 200 && res.body) { view = res.body; selected = null; sfx('move'); render(); }
    else { setStatus($('gameStatus'), '行动失败：' + ((res.body && res.body.error && res.body.error.message) || res.status), true); refresh(); }
  }

  async function createRoom() {
    var name = ($('hostName').value || '').trim() || ('玩家' + Math.floor(Math.random() * 900 + 100));
    var res = await api('POST', '/api/rooms', { playerId: name, maxPlayers: Number($('hostMax').value), password: ($('hostPw').value || undefined) });
    if (res.status !== 201) { setStatus($('lobbyStatus'), '创建失败：' + res.status, true); return; }
    roomId = res.body.roomId; session = res.body.playerSession; playerId = name; view = res.body;
    save(); $('launcher').style.display = 'none'; $('lobby').classList.add('on'); renderSeats(); startPolling(); sfx('notify');
  }
  async function joinRoom() {
    var name = ($('joinName').value || '').trim() || ('玩家' + Math.floor(Math.random() * 900 + 100));
    var code = ($('joinCode').value || '').trim();
    if (!code) { $('joinCode').focus(); return; }
    var room = await api('GET', '/api/rooms/' + encodeURIComponent(code));
    if (room.status !== 200) { setStatus($('lobbyStatus'), '找不到房间：' + code, true); return; }
    roomId = room.body.roomId;
    var res = await api('POST', roomUrl('/join'), { playerId: name, inviteCode: code, password: ($('joinPw').value || undefined) });
    if (res.status !== 200) { setStatus($('lobbyStatus'), '加入失败：' + ((res.body && res.body.error && res.body.error.message) || res.status), true); return; }
    session = res.body.playerSession; playerId = name; view = res.body;
    save(); $('launcher').style.display = 'none'; $('lobby').classList.add('on'); renderSeats(); startPolling(); sfx('notify');
  }
  async function startMatch() {
    var res = await api('POST', roomUrl('/start'), { session: session, playerId: playerId });
    if (res.status !== 200) { setStatus($('lobbyStatus'), '无法开始：' + ((res.body && res.body.error && res.body.error.message) || res.status), true); return; }
    view = res.body; render(); sfx('win');
  }
  async function reconnectSaved() {
    try {
      var saved = JSON.parse(localStorage.getItem(LS) || 'null');
      if (!saved || !saved.session || !saved.roomId) return false;
      roomId = saved.roomId; session = saved.session; playerId = saved.playerId;
      var res = await api('POST', roomUrl('/reconnect'), { session: session, playerId: playerId });
      if (res.status !== 200) { clearSave(); return false; }
      view = res.body; $('launcher').style.display = 'none'; render(); startPolling(); return true;
    } catch (e) { return false; }
  }

  $('createBtn').addEventListener('click', createRoom);
  $('joinBtn').addEventListener('click', joinRoom);
  $('startBtn').addEventListener('click', startMatch);
  $('refreshBtn').addEventListener('click', refresh);
  $('rematchBtn').addEventListener('click', async function () {
    var res = await api('POST', roomUrl('/restart'), { session: session, playerId: playerId });
    if (res.status === 200) { view = res.body; render(); }
  });
  $('leaveBtn').addEventListener('click', async function () {
    try { await api('POST', roomUrl('/leave'), { session: session, playerId: playerId }); } catch (e) {}
    clearSave(); stopPolling(); location.reload();
  });
  $('copyBtn').addEventListener('click', function () {
    var text = location.origin + location.pathname + '?room=' + encodeURIComponent(view.roomCode || '');
    try { navigator.clipboard.writeText(text); $('copyBtn').textContent = '已复制'; } catch (e) { $('copyBtn').textContent = text; }
  });
  var params = new URLSearchParams(location.search);
  if (params.get('room')) $('joinCode').value = params.get('room');
  reconnectSaved().then(function (ok) { if (!ok) setStatus($('lobbyStatus'), '创建或加入一个房间。'); });
})();
</script>
</body>
</html>
