<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>珠玑妙算 · Mastermind 猜颜色密码</title>
<meta name="description" content="珠玑妙算（Mastermind）：6 种颜色、4 位密码、允许重复，10 次内根据黑白提示猜中。纯前端离线可玩，支持 AI 提示。">
<meta name="theme-color" content="#171a24">
<style>
:root{
  --bg:#f2eee5;--card:#fffdf8;--ink:#1c1f2a;--muted:#666b78;--line:#ded8ca;
  --dark:#171a24;--on-dark:#f7f2e7;
  --accent:#b8462f;--accent-2:#93331f;--ok:#2e7d58;--fail:#a33a2c;--focus:#3b6fd4;
  --black-peg:#1b1d24;--white-peg:#faf7ef;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --radius:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;min-height:100vh;background:radial-gradient(900px 420px at 50% -10%,#faf6ec,var(--bg));
  color:var(--ink);font:16px/1.55 var(--sans);overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;
}
h1,h2,p,ol{margin:0}
button{font:inherit;color:inherit}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.app{max-width:520px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
header{margin-bottom:14px}
h1{font-size:clamp(1.75rem,7vw,2.25rem);line-height:1.12;letter-spacing:-.02em;margin-top:4px}
.lede{color:var(--muted);font-size:14.5px;margin-top:6px;max-width:46ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:0 8px 24px rgb(28 31 42 / .06);margin-top:14px;min-width:0}
.status-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.remaining{font-size:15px;font-weight:650}
.remaining strong{font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.attempts{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:12px}
.slot{
  display:flex;align-items:center;justify-content:center;min-width:0;min-height:64px;padding:4px;
  border:2px dashed #c9c1b0;border-radius:14px;background:#f8f4ea;color:#a79d89;
  font-size:24px;font-weight:800;cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.slot.filled{border-style:solid;border-color:rgb(0 0 0 / .16);color:#fff;text-shadow:0 1px 2px rgb(0 0 0 / .35)}
.slot:focus-visible,.color-btn:focus-visible,.btn:focus-visible,.link-btn:focus-visible,.rules-link:focus-visible{
  outline:3px solid var(--focus);outline-offset:2px
}
.slot:disabled{opacity:.55;cursor:default}
.slot-label{pointer-events:none}
.actions{display:grid;grid-template-columns:1.45fr 1fr;gap:9px;margin-top:12px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 14px;
  border:1px solid var(--line);border-radius:13px;background:#f8f4ea;font-size:16px;font-weight:700;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-align:center
}
.btn.primary{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.message{min-height:1.55em;margin-top:10px;font-size:14px;color:var(--muted);line-height:1.5}
.message.ok{color:var(--ok);font-weight:650}
.message.fail{color:var(--fail);font-weight:650}
.message.warn{color:var(--accent-2)}
.hint-row{display:flex;justify-content:flex-end;margin-top:4px}
.link-btn{
  min-height:44px;padding:0 10px;border:0;border-radius:10px;background:transparent;
  color:var(--accent);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer
}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
h2{font-size:15px;font-weight:750;letter-spacing:-.01em}
.hint-text{font-size:12px;color:var(--muted)}
.color-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}
.color-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;min-height:50px;
  padding:5px 8px;border:1px solid var(--line);border-radius:13px;background:#fbf8f1;
  font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent
}
.color-btn:active:not(:disabled){transform:translateY(1px)}
.color-btn:disabled{opacity:.45;cursor:not-allowed}
.swatch{width:24px;height:24px;flex:none;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgb(0 0 0 / .14)}
.color-name{min-width:1.2em;text-align:left}
.history{margin-top:10px;padding:0;list-style:none;display:grid;gap:8px}
.attempt{
  display:flex;align-items:center;gap:8px;min-width:0;padding:8px 9px;border:1px solid #e8e2d5;
  border-radius:12px;background:#fbf8f1;flex-wrap:wrap
}
.attempt-no{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:22px}
.mini-code{display:flex;gap:4px;flex:none}
.mini-swatch{
  display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:7px;
  color:#fff;font-size:12px;font-style:normal;font-weight:800;text-shadow:0 1px 1px rgb(0 0 0 / .4);
  box-shadow:inset 0 0 0 1px rgb(0 0 0 / .12)
}
.pegs{display:flex;gap:3px;flex:none;margin-left:auto}
.peg{display:block;width:13px;height:13px;border-radius:50%;flex:none}
.peg.black{background:var(--black-peg);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .25)}
.peg.white{background:var(--white-peg);box-shadow:inset 0 0 0 2px #8d8574}
.peg.empty{background:transparent;box-shadow:inset 0 0 0 1px #d7d0c1}
.peg-text{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:56px}
.empty-state{margin-top:10px;font-size:13px;color:var(--muted)}
.rules-link{
  display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:6px;padding:0 10px;
  border-radius:10px;color:var(--accent);font-weight:700;font-size:14px;text-decoration:underline;
  text-underline-offset:3px
}
footer{display:flex;justify-content:center;margin-top:8px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
@media (max-width:430px){
  .app{padding-left:12px;padding-right:12px}
  .card{padding:12px}
  .color-grid{gap:7px}
  .attempt{gap:6px}
  .peg-text{min-width:52px;font-size:11px}
}
@media (max-width:390px){
  .slots{gap:7px}
  .slot{min-height:60px}
  .mini-swatch{width:23px;height:23px}
  .pegs{gap:2px}
  .peg{width:12px;height:12px}
}
@media (min-width:470px){
  .color-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .color-btn{flex-direction:column;gap:3px;padding:7px 4px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important;animation:none!important}
  .btn:active:not(:disabled),.color-btn:active:not(:disabled){transform:none}
}
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/mastermind/">
<meta property="og:title" content="珠玑妙算 · Mastermind 猜颜色密码">
<meta property="og:description" content="珠玑妙算（Mastermind）：6 种颜色、4 位密码、允许重复，10 次内根据黑白提示猜中。纯前端离线可玩，支持 AI 提示。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hhfa008.github.io/games/boardgame/mastermind/">
</head>
<body>
<main class="app">
  <header>
    <div class="eyebrow">Mastermind · 6 × 4</div>
    <h1>珠玑妙算</h1>
    <p class="lede">六种颜色里藏着一个四位密码，同一颜色可以重复。根据黑白提示，在十次内猜中它。</p>
  </header>

  <section class="card" aria-labelledby="board-title">
    <h2 id="board-title" class="sr-only">当前猜测与操作</h2>
    <div class="status-row">
      <p class="remaining" id="remaining-text">剩余次数 <strong id="remaining-count">10</strong> / 10</p>
      <p class="attempts" id="attempt-count">已猜 0 次</p>
    </div>

    <div class="slots" id="slots" role="group" aria-label="当前猜测的四个颜色位置">
      <button type="button" class="slot" data-index="0" aria-label="第 1 位：空，点击清空"><span class="slot-label" aria-hidden="true">·</span></button>
      <button type="button" class="slot" data-index="1" aria-label="第 2 位：空，点击清空"><span class="slot-label" aria-hidden="true">·</span></button>
      <button type="button" class="slot" data-index="2" aria-label="第 3 位：空，点击清空"><span class="slot-label" aria-hidden="true">·</span></button>
      <button type="button" class="slot" data-index="3" aria-label="第 4 位：空，点击清空"><span class="slot-label" aria-hidden="true">·</span></button>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" id="submit-btn" aria-label="提交当前猜测" disabled>提交猜测</button>
      <button type="button" class="btn" id="clear-btn" aria-label="清空当前猜测" disabled>清空</button>
    </div>

    <p class="message" id="message" role="status" aria-live="polite"></p>

    <div class="hint-row">
      <button type="button" class="link-btn" id="hint-btn" aria-label="获取当前局面的 AI 提示">提示</button>
    </div>
  </section>

  <section class="card" aria-labelledby="palette-title">
    <div class="section-head">
      <h2 id="palette-title">选择颜色</h2>
      <span class="hint-text">点击填满四位，点槽位可清除</span>
    </div>
    <div class="color-grid" id="palette" role="group" aria-label="六种可选颜色">
      <button type="button" class="color-btn" data-color="R" aria-label="选择红色" style="--c:#d64545"><span class="swatch" aria-hidden="true"></span><span class="color-name">红</span></button>
      <button type="button" class="color-btn" data-color="Y" aria-label="选择黄色" style="--c:#e2aa22"><span class="swatch" aria-hidden="true"></span><span class="color-name">黄</span></button>
      <button type="button" class="color-btn" data-color="G" aria-label="选择绿色" style="--c:#2f9464"><span class="swatch" aria-hidden="true"></span><span class="color-name">绿</span></button>
      <button type="button" class="color-btn" data-color="B" aria-label="选择蓝色" style="--c:#3a70c8"><span class="swatch" aria-hidden="true"></span><span class="color-name">蓝</span></button>
      <button type="button" class="color-btn" data-color="P" aria-label="选择紫色" style="--c:#8558bd"><span class="swatch" aria-hidden="true"></span><span class="color-name">紫</span></button>
      <button type="button" class="color-btn" data-color="O" aria-label="选择橙色" style="--c:#dd772c"><span class="swatch" aria-hidden="true"></span><span class="color-name">橙</span></button>
    </div>
  </section>

  <section class="card" aria-labelledby="history-title">
    <div class="section-head">
      <h2 id="history-title">猜测记录</h2>
      <button type="button" class="btn" id="restart-btn" aria-label="重新开始一局游戏" style="min-height:44px;padding:0 14px;font-size:14px">重新开始</button>
    </div>
    <ol class="history" id="history" role="log" aria-live="polite" aria-label="历史猜测与黑白提示"></ol>
    <p class="empty-state" id="empty-history">还没有猜测，先选四个颜色吧。</p>
    <p class="note">黑钉：颜色和位置都对；白钉：颜色对但位置不对。</p>
  </section>

  <footer>
    <a class="rules-link" href="rules.html" aria-label="查看珠玑妙算完整规则">查看完整规则</a>
  </footer>
</main>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';

  var E = typeof globalThis !== 'undefined' ? globalThis.MastermindEngine : null;
  var meta = {
    R: { name: '红', short: '红', hex: '#d64545' },
    Y: { name: '黄', short: '黄', hex: '#e2aa22' },
    G: { name: '绿', short: '绿', hex: '#2f9464' },
    B: { name: '蓝', short: '蓝', hex: '#3a70c8' },
    P: { name: '紫', short: '紫', hex: '#8558bd' },
    O: { name: '橙', short: '橙', hex: '#dd772c' }
  };

  var els = {
    remaining: document.getElementById('remaining-count'),
    attempts: document.getElementById('attempt-count'),
    slots: document.getElementById('slots'),
    submit: document.getElementById('submit-btn'),
    clear: document.getElementById('clear-btn'),
    hint: document.getElementById('hint-btn'),
    palette: document.getElementById('palette'),
    restart: document.getElementById('restart-btn'),
    history: document.getElementById('history'),
    empty: document.getElementById('empty-history'),
    message: document.getElementById('message')
  };

  var slotButtons = Array.prototype.slice.call(els.slots.querySelectorAll('.slot'));
  var colorButtons = Array.prototype.slice.call(els.palette.querySelectorAll('.color-btn'));
  var slots = [null, null, null, null];
  var state = E ? E.newGame() : null;
  var notice = { text: '', kind: '' };

  function colorNames(code) {
    return code.map(function (c) { return meta[c] ? meta[c].name + '色' : '未知色'; }).join('、');
  }

  function setNotice(text, kind) {
    notice = { text: text || '', kind: kind || '' };
    els.message.textContent = notice.text;
    els.message.className = 'message' + (notice.kind ? ' ' + notice.kind : '');
  }

  function gameOver() {
    return !state || state.status !== 'playing';
  }

  function renderSlots() {
    slotButtons.forEach(function (button, index) {
      var color = slots[index];
      var label = button.querySelector('.slot-label');
      if (color) {
        button.classList.add('filled');
        button.style.backgroundColor = meta[color].hex;
        label.textContent = meta[color].short;
        button.setAttribute('aria-label', '第 ' + (index + 1) + ' 位：' + meta[color].name + '色，点击清空');
      } else {
        button.classList.remove('filled');
        button.style.backgroundColor = '';
        label.textContent = '·';
        button.setAttribute('aria-label', '第 ' + (index + 1) + ' 位：空，点击清空');
      }
      button.disabled = !gamePlaying();
    });
  }

  function gamePlaying() {
    return !!state && state.status === 'playing';
  }

  function renderHistory() {
    els.history.textContent = '';
    if (!state || state.history.length === 0) {
      els.empty.hidden = false;
      return;
    }
    els.empty.hidden = true;

    state.history.forEach(function (entry, index) {
      var item = document.createElement('li');
      item.className = 'attempt';

      var number = document.createElement('span');
      number.className = 'attempt-no';
      number.textContent = '#' + (index + 1);

      var code = document.createElement('span');
      code.className = 'mini-code';
      code.setAttribute('aria-hidden', 'true');
      entry.guess.forEach(function (color) {
        var swatch = document.createElement('i');
        swatch.className = 'mini-swatch';
        swatch.style.backgroundColor = meta[color].hex;
        swatch.textContent = meta[color].short;
        code.appendChild(swatch);
      });

      var pegs = document.createElement('span');
      pegs.className = 'pegs';
      pegs.setAttribute('aria-hidden', 'true');
      for (var p = 0; p < E.CODE_LEN; p++) {
        var peg = document.createElement('i');
        peg.className = 'peg ' + (p < entry.black ? 'black' : (p < entry.black + entry.white ? 'white' : 'empty'));
        pegs.appendChild(peg);
      }

      var pegText = document.createElement('span');
      pegText.className = 'peg-text';
      pegText.textContent = '黑 ' + entry.black + ' · 白 ' + entry.white;

      var spoken = document.createElement('span');
      spoken.className = 'sr-only';
      spoken.textContent = '第 ' + (index + 1) + ' 次猜测：' + colorNames(entry.guess) +
        '；黑色 ' + entry.black + ' 个，白色 ' + entry.white + ' 个。';

      item.appendChild(number);
      item.appendChild(code);
      item.appendChild(pegs);
      item.appendChild(pegText);
      item.appendChild(spoken);
      els.history.appendChild(item);
    });
  }

  function render() {
    if (!state) {
      els.remaining.textContent = '—';
      els.submit.disabled = true;
      els.clear.disabled = true;
      els.hint.disabled = true;
      return;
    }

    els.remaining.textContent = String(state.remaining);
    els.attempts.textContent = '已猜 ' + state.attempts + ' 次';

    var full = slots.every(function (color) { return color !== null; });
    var selected = slots.some(function (color) { return color !== null; });

    els.submit.disabled = !gamePlaying() || !full;
    els.clear.disabled = !gamePlaying() || !selected;
    els.hint.disabled = !gamePlaying();
    colorButtons.forEach(function (button) { button.disabled = !gamePlaying(); });
    els.restart.disabled = false;

    renderSlots();
    renderHistory();

    if (state.status === 'won') {
      setNotice('恭喜！你在第 ' + state.attempts + ' 次猜中密码：' + colorNames(state.secret) + '。', 'ok');
    } else if (state.status === 'lost') {
      setNotice('次数用完。正确答案是：' + colorNames(state.secret) + '。再试一局吧。', 'fail');
    } else if (notice.text) {
      els.message.textContent = notice.text;
      els.message.className = 'message' + (notice.kind ? ' ' + notice.kind : '');
    } else {
      setNotice('', '');
    }
  }

  function placeColor(color) {
    if (gameOver()) return;
    var index = slots.indexOf(null);
    if (index === -1) {
      setNotice('四个位置已经填满。点一下槽位可以清除，或直接提交。', 'warn');
      return;
    }
    slots[index] = color;
    notice = { text: '', kind: '' };
    render();
  }

  function clearSlots() {
    slots = [null, null, null, null];
    notice = { text: '', kind: '' };
    render();
  }

  if (!E) {
    setNotice('引擎未能加载，请刷新页面重试。', 'fail');
    els.submit.disabled = true;
    els.clear.disabled = true;
    els.hint.disabled = true;
    return;
  }

  slotButtons.forEach(function (button) {
    button.addEventListener('click', function () {
      var index = Number(button.getAttribute('data-index'));
      if (!gamePlaying() || !Number.isInteger(index) || index < 0 || index >= slots.length) return;
      if (slots[index] !== null) {
        slots[index] = null;
        notice = { text: '', kind: '' };
        render();
      }
    });
  });

  colorButtons.forEach(function (button) {
    button.addEventListener('click', function () {
      placeColor(button.getAttribute('data-color'));
    });
  });

  els.submit.addEventListener('click', function () {
    if (gameOver()) return;
    if (!slots.every(function (color) { return color !== null; })) {
      setNotice('请先选满四个颜色。', 'warn');
      return;
    }
    var guess = slots.slice();
    var next = E.submitGuess(state, guess);
    state = next;
    if (!next.ok) {
      setNotice(next.lastError || '这次猜测没有被接受。', 'warn');
      render();
      return;
    }
    slots = [null, null, null, null];
    if (next.status === 'won' || next.status === 'lost') {
      notice = { text: '', kind: '' };
    } else {
      notice = {
        text: '第 ' + next.attempts + ' 次：黑 ' + next.lastScore.black + '，白 ' + next.lastScore.white + '。',
        kind: ''
      };
    }
    render();
  });

  els.clear.addEventListener('click', clearSlots);

  els.hint.addEventListener('click', function () {
    if (gameOver()) return;
    var rng = E.mulberry32((state.seed + state.attempts + 7) >>> 0);
    var suggestion = E.aiGuess(state.history, rng);
    setNotice('提示：下一猜可以试试 ' + colorNames(suggestion) + '。', '');
  });

  els.restart.addEventListener('click', function () {
    state = E.newGame();
    slots = [null, null, null, null];
    notice = { text: '新的一局已开始，密码重新随机生成。', kind: '' };
    render();
  });

  render();
})();
</script>
</body>
</html>
