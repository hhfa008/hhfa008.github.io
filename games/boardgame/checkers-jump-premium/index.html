<script>
(function () {
  'use strict';
  var E = window.ChineseCheckersEngine;
  var D = window.CheckersJumpData;
  var NS = 'http://www.w3.org/2000/svg';
  var VIEW = 560, CENTER = 280, HOLE_SPAN = 516;
  var $ = function (id) { return document.getElementById(id); };
  var svg = $('board');
  var GEO = null;

  var count = 2;
  var state = E.setup(2);
  var stack = [];
  var selected = -1;
  var lastMove = null;
  var lastAnim = null;
  var busy = false;
  var aiToken = 0;
  var mode = 'ai';
  var level = 2;
  var resultOpen = false;
  var online = null;
  var pollTimer = null;
  var layers = {};

  var HUMAN = 0;
  function pInfo(p) { return D.players6[p] || D.players6[0]; }
  function pName(p) { return pInfo(p).zh; }
  function pColor(p) { return pInfo(p).color; }

  function sfx(name, opts) { try { if (window.Sfx && window.Sfx.play) window.Sfx.play(name, opts); } catch (err) {} }
  function toast(msg) {
    return Dom.toast(msg);
  }
  function el(name, attrs, text) {
    return Dom.el(name, attrs, { ns: NS, text: text });
  }
  function isOnline() { return !!online; }
  function currentMoves() {
    if (isOnline()) {
      if (!online.view || !online.view.state || !online.view.state.legal) return [];
      return online.view.state.legal;
    }
    return E.legalMovesForTurn(state);
  }
  function canInteract() {
    if (busy || !state || state.over) return false;
    if (isOnline()) return !!(online.view && online.view.canMove);
    if (mode === 'ai' && state.turn !== HUMAN) return false;
    return true;
  }
  function humanTurn() { return mode !== 'ai' || state.turn === HUMAN; }

  /* ---------------------------------------------------------------- */
  /* Geometry and static board                                         */
  /* ---------------------------------------------------------------- */
  function buildGeometry() {
    var ROT = Math.PI / 6, pts = [], i, c, x, y;
    for (i = 0; i < E.COORDS.length; i++) {
      c = E.COORDS[i];
      x = 1.5 * c.q;
      y = Math.sqrt(3) * (c.r + c.q / 2);
      pts.push({ x: x * Math.cos(ROT) - y * Math.sin(ROT), y: x * Math.sin(ROT) + y * Math.cos(ROT) });
    }
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    pts.forEach(function (p) {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    });
    var scale = HOLE_SPAN / Math.max(maxX - minX, maxY - minY);
    var ox = CENTER - (minX + maxX) / 2 * scale;
    var oy = CENTER - (minY + maxY) / 2 * scale;
    GEO = { xy: pts.map(function (p) { return { x: ox + p.x * scale, y: oy + p.y * scale }; }), scale: scale, ox: ox, oy: oy };
  }
  function starPoints() {
    var pts = [], k, ang, rad, inner = 4 * Math.sqrt(3) * GEO.scale + 10, outer = 12 * GEO.scale + 12;
    for (k = 0; k < 12; k++) {
      ang = k * Math.PI / 6;
      rad = (k % 2 === 0) ? inner : outer;
      pts.push((CENTER + Math.cos(ang) * rad).toFixed(1) + ',' + (CENTER + Math.sin(ang) * rad).toFixed(1));
    }
    return pts.join(' ');
  }
  function hull(points) {
    var p = points.slice().sort(function (a, b) { return a.x - b.x || a.y - b.y; });
    if (p.length < 3) return p;
    function cross(o, a, b) { return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x); }
    var lower = [], upper = [], i;
    for (i = 0; i < p.length; i++) {
      while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p[i]) <= 0) lower.pop();
      lower.push(p[i]);
    }
    for (i = p.length - 1; i >= 0; i--) {
      while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p[i]) <= 0) upper.pop();
      upper.push(p[i]);
    }
    lower.pop(); upper.pop();
    return lower.concat(upper);
  }

  function buildStaticBoard() {
    buildGeometry();
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var defs = el('defs');
    var boardPat = el('pattern', { id: 'birchPat', patternUnits: 'userSpaceOnUse', width: '520', height: '520' });
    boardPat.appendChild(el('image', { href: D.art.board, width: '520', height: '520', preserveAspectRatio: 'xMidYMid slice' }));
    defs.appendChild(boardPat);
    var marble = el('pattern', { id: 'marblePat', patternUnits: 'userSpaceOnUse', width: '40', height: '40' });
    marble.appendChild(el('image', { href: D.art.marble, width: '40', height: '40', preserveAspectRatio: 'xMidYMid slice' }));
    defs.appendChild(marble);
    var holeGrad = el('radialGradient', { id: 'holeGrad', cx: '50%', cy: '38%', r: '60%' });
    holeGrad.appendChild(el('stop', { offset: '0', 'stop-color': '#3a2815' }));
    holeGrad.appendChild(el('stop', { offset: '1', 'stop-color': '#1d1208' }));
    defs.appendChild(holeGrad);
    var shadow = el('filter', { id: 'pieceShadow', x: '-40%', y: '-40%', width: '180%', height: '180%' });
    shadow.appendChild(el('feDropShadow', { dx: '1', dy: '2', stdDeviation: '1.7', 'flood-color': '#0a0603', 'flood-opacity': '.55' }));
    defs.appendChild(shadow);
    svg.appendChild(defs);

    svg.appendChild(el('rect', { x: '4', y: '4', width: '552', height: '552', rx: '22', fill: '#0d1210' }));
    var star = el('polygon', {
      points: starPoints(), fill: 'url(#birchPat)', stroke: '#6f4a24', 'stroke-width': '2.6',
      'stroke-linejoin': 'round'
    });
    svg.appendChild(star);
    var starEdge = el('polygon', { points: starPoints(), fill: 'none', stroke: 'rgba(255,240,210,.22)', 'stroke-width': '1', 'stroke-linejoin': 'round' });
    svg.appendChild(starEdge);

    layers.zone = el('g');
    layers.hole = el('g');
    layers.path = el('g');
    layers.piece = el('g');
    layers.dest = el('g');
    layers.hit = el('g');
    svg.appendChild(layers.zone);
    svg.appendChild(layers.hole);
    svg.appendChild(layers.path);
    svg.appendChild(layers.piece);
    svg.appendChild(layers.dest);
    svg.appendChild(layers.hit);

    for (var z = 0; z < 6; z++) {
      var h = hull(E.ZONES[z].map(function (i) { return GEO.xy[i]; }));
      layers.zone.appendChild(el('polygon', {
        points: h.map(function (p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' '),
        fill: pColor(z), 'fill-opacity': '.055', stroke: pColor(z), 'stroke-opacity': '.2',
        'stroke-width': '8', 'stroke-linejoin': 'round', 'data-zone': String(z)
      }));
    }
    for (var i = 0; i < E.holeCount; i++) {
      var pos = GEO.xy[i];
      layers.hole.appendChild(el('circle', { cx: pos.x.toFixed(1), cy: pos.y.toFixed(1), r: (GEO.scale * 0.47).toFixed(1), fill: 'url(#holeGrad)', stroke: 'rgba(40,24,10,.75)', 'stroke-width': '1' }));
      layers.hole.appendChild(el('circle', { cx: pos.x.toFixed(1), cy: (pos.y - GEO.scale * 0.09).toFixed(1), r: (GEO.scale * 0.41).toFixed(1), fill: 'none', stroke: 'rgba(255,232,190,.16)', 'stroke-width': '.8' }));
    }
    for (var sq = 0; sq < E.holeCount; sq++) {
      var pt = GEO.xy[sq];
      layers.hit.appendChild(el('circle', { cx: pt.x.toFixed(1), cy: pt.y.toFixed(1), r: (GEO.scale * 0.78).toFixed(1), fill: 'transparent', class: 'hit', 'data-sq': String(sq) }));
    }
  }

  /* ---------------------------------------------------------------- */
  /* Dynamic rendering                                                 */
  /* ---------------------------------------------------------------- */
  function render() {
    renderPieces();
    renderDests();
    renderPath();
    renderStatus();
    renderRoster();
    renderMoves();
    renderControls();
  }

  function renderPieces() {
    while (layers.piece.firstChild) layers.piece.removeChild(layers.piece.firstChild);
    var r = GEO.scale * 0.70;
    for (var i = 0; i < E.holeCount; i++) {
      var p = state.board[i];
      if (p < 0) continue;
      var pos = GEO.xy[i], info = pInfo(p);
      var g = el('g', { class: 'piece', 'data-piece': String(i) });
      g.style.transform = 'translate(' + pos.x + 'px,' + pos.y + 'px)';
      if (lastAnim && lastAnim.to === i) {
        var from = GEO.xy[lastAnim.from];
        g.style.transition = 'none';
        g.style.transform = 'translate(' + from.x + 'px,' + from.y + 'px)';
        requestAnimationFrame(function (node, x, y) {
          return function () {
            node.style.transition = '';
            node.style.transform = 'translate(' + x + 'px,' + y + 'px)';
          };
        }(g, pos.x, pos.y));
      }
      g.appendChild(el('ellipse', { cx: '0', cy: (r * 0.55).toFixed(1), rx: (r * 0.78).toFixed(1), ry: (r * 0.28).toFixed(1), fill: 'rgba(8,5,2,.42)' }));
      g.appendChild(el('circle', { cx: '0', cy: '0', r: r.toFixed(1), fill: 'url(#marblePat)', filter: 'url(#pieceShadow)' }));
      g.appendChild(el('circle', { cx: '0', cy: '0', r: r.toFixed(1), fill: info.color, 'fill-opacity': '.62', stroke: 'rgba(30,18,8,.48)', 'stroke-width': '1' }));
      g.appendChild(el('circle', { cx: '0', cy: '0', r: (r * 0.74).toFixed(1), fill: 'none', stroke: 'rgba(255,255,255,.34)', 'stroke-width': '1' }));
      g.appendChild(el('ellipse', { cx: (-r * 0.28).toFixed(1), cy: (-r * 0.34).toFixed(1), rx: (r * 0.34).toFixed(1), ry: (r * 0.22).toFixed(1), fill: 'rgba(255,255,255,.5)' }));
      g.appendChild(el('circle', { cx: (r * 0.24).toFixed(1), cy: (r * 0.26).toFixed(1), r: (r * 0.1).toFixed(1), fill: 'rgba(255,255,255,.35)' }));
      if (selected === i) g.appendChild(el('circle', { cx: '0', cy: '0', r: (r + 4).toFixed(1), fill: 'none', stroke: '#ffe3a3', 'stroke-width': '2.4' }));
      layers.piece.appendChild(g);
    }
  }

  function renderDests() {
    while (layers.dest.firstChild) layers.dest.removeChild(layers.dest.firstChild);
    if (selected < 0) return;
    currentMoves().filter(function (m) { return m.from === selected; }).forEach(function (m) {
      var pos = GEO.xy[m.to], r = GEO.scale * 0.62;
      if (m.jump) {
        layers.dest.appendChild(el('circle', { cx: pos.x.toFixed(1), cy: pos.y.toFixed(1), r: (r + 2).toFixed(1), fill: 'none', stroke: 'rgba(255,226,158,.95)', 'stroke-width': '2.6', 'stroke-dasharray': '5 4' }));
      } else {
        layers.dest.appendChild(el('circle', { cx: pos.x.toFixed(1), cy: pos.y.toFixed(1), r: (GEO.scale * 0.2).toFixed(1), fill: 'rgba(255,226,158,.92)' }));
      }
    });
  }

  function renderPath() {
    while (layers.path.firstChild) layers.path.removeChild(layers.path.firstChild);
    if (!lastMove || !lastMove.path || lastMove.path.length < 3) return;
    lastMove.path.slice(1, -1).forEach(function (h) {
      var pos = GEO.xy[h];
      layers.path.appendChild(el('circle', { cx: pos.x.toFixed(1), cy: pos.y.toFixed(1), r: (GEO.scale * 0.16).toFixed(1), fill: 'rgba(255,226,158,.55)' }));
    });
    var from = GEO.xy[lastMove.from], to = GEO.xy[lastMove.to];
    layers.path.appendChild(el('circle', { cx: from.x.toFixed(1), cy: from.y.toFixed(1), r: (GEO.scale * 0.62).toFixed(1), fill: 'none', stroke: 'rgba(255,226,158,.28)', 'stroke-width': '1.4' }));
    layers.path.appendChild(el('circle', { cx: to.x.toFixed(1), cy: to.y.toFixed(1), r: (GEO.scale * 0.62).toFixed(1), fill: 'none', stroke: 'rgba(255,226,158,.72)', 'stroke-width': '2' }));
  }

  function renderStatus() {
    var chip = $('turnChip');
    var dot = chip.querySelector('.turn-dot');
    if (dot) dot.style.background = pColor(state.turn);
    var text = $('turnText');
    var big = $('statusBig');
    var sub = $('statusSub');
    if (state.over) {
      text.textContent = '对局结束';
      big.textContent = state.winner >= 0 ? pName(state.winner) + '获胜' : '对局结束';
      sub.textContent = '第 ' + state.moveNo + ' 回合 · ' + state.n + ' 人局';
    } else if (busy) {
      text.textContent = 'AI 思考中…';
      big.textContent = pName(state.turn) + '思考中…';
      sub.textContent = '第 ' + state.moveNo + ' 回合 · 正在搜索连跳';
    } else {
      text.textContent = '轮到' + pName(state.turn);
      big.textContent = pName(state.turn) + '行棋';
      sub.textContent = '第 ' + state.moveNo + ' 回合 · ' + state.n + ' 人局 · 目标 ' + pName(pInfo(state.turn).id) + ' 区';
    }
    var hint = $('hint');
    if (state.over) hint.textContent = '对局结束。' + (state.winner >= 0 ? pName(state.winner) + '获胜。' : '');
    else if (busy) hint.textContent = pName(state.turn) + '正在思考，请稍候。';
    else if (selected >= 0) hint.textContent = '已选中 H' + (selected + 1) + '，点高亮孔位；圆环为连跳落点。';
    else hint.textContent = '点选一枚弹珠，再点高亮孔位；圆环是连跳落点。跳跃不吃子。';
  }

  function renderRoster() {
    var box = $('roster');
    while (box.firstChild) box.removeChild(box.firstChild);
    state.active.forEach(function (p) {
      var row = document.createElement('div');
      row.className = 'roster-row' + (!state.over && state.turn === p ? ' turn' : '');
      var dot = document.createElement('span');
      dot.className = 'roster-dot';
      dot.style.background = pColor(p);
      var name = document.createElement('span');
      name.className = 'roster-name';
      name.textContent = pName(p) + (mode === 'ai' && !isOnline() && p === HUMAN ? '（你）' : '');
      var prog = document.createElement('span');
      prog.className = 'roster-progress';
      prog.textContent = E.progress(state, p) + '/10';
      row.appendChild(dot); row.appendChild(name); row.appendChild(prog);
      box.appendChild(row);
    });
  }

  function renderMoves() {
    var list = $('movesList');
    while (list.firstChild) list.removeChild(list.firstChild);
    if (!state.history.length) {
      var p = document.createElement('p');
      p.className = 'empty-note';
      p.textContent = '还没有着法。';
      list.appendChild(p);
      return;
    }
    state.history.slice(-40).forEach(function (h, idx) {
      var row = document.createElement('div');
      row.className = 'move-row';
      var no = document.createElement('span');
      no.className = 'no';
      no.textContent = (state.history.length - Math.min(40, state.history.length) + idx + 1) + '.';
      var mv = document.createElement('span');
      mv.className = 'mv' + (lastMove && h.from === lastMove.from && h.to === lastMove.to ? ' last' : '');
      mv.textContent = pName(h.side) + ' ' + h.notation;
      mv.style.color = pColor(h.side);
      row.appendChild(no); row.appendChild(mv);
      list.appendChild(row);
    });
    list.scrollTop = list.scrollHeight;
  }

  function renderControls() {
    $('undoBtn').disabled = isOnline() || !stack.length || busy;
    Array.prototype.forEach.call($('modeSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-mode') === mode ? 'true' : 'false');
      b.disabled = isOnline();
    });
    Array.prototype.forEach.call($('countSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', +b.getAttribute('data-count') === count ? 'true' : 'false');
      b.disabled = isOnline();
    });
    Array.prototype.forEach.call($('levelSeg').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', +b.getAttribute('data-level') === level ? 'true' : 'false');
      b.disabled = isOnline();
    });
    $('levelNote').textContent = D.difficulty[level - 1].note;
    $('levelWrap').hidden = isOnline() || mode !== 'ai';
    $('modeNote').textContent = mode === 'ai' ? '人机对战：你执朱红，其余座位由 AI 接管。' : '同屏多人：所有颜色在同一设备上轮流走棋。';
    $('setupPanel').hidden = isOnline();
    $('roomChip').hidden = !isOnline();
    $('onlineLink').hidden = isOnline();
    $('newBtn').textContent = isOnline() ? '返回房间' : '新开一局';
    if (isOnline() && online.view) {
      $('roomCode').textContent = online.view.roomCode || online.roomId.slice(0, 6);
      var you = online.view.you ? online.view.you.playerIndex + 1 : '—';
      $('roomSeat').textContent = ' · 座位 ' + you + ' / 2';
    }
  }

  function resultTitleText() {
    if (state.winner >= 0) return pName(state.winner) + '获胜';
    return '对局结束';
  }

  function finish() {
    if (resultOpen) return;
    resultOpen = true;
    $('resultTitle').textContent = resultTitleText();
    $('resultText').textContent = '第 ' + state.moveNo + ' 回合 · ' + (state.winner >= 0 ? pName(state.winner) + '把 10 枚弹珠全部送入目标区。' : '对局结束。');
    $('result').hidden = false;
    var won = false;
    if (isOnline()) {
      won = !!(online.view && online.view.you && online.view.result && online.view.result.winnerSeat === online.view.you.playerIndex);
      $('againBtn').textContent = online.view && online.view.isHost ? '房主重开' : '等待房主重开';
      $('againBtn').disabled = !(online.view && online.view.isHost);
    } else {
      won = mode === 'local' ? true : state.winner === HUMAN;
      $('againBtn').textContent = '再来一局';
      $('againBtn').disabled = false;
    }
    sfx(won ? 'win' : 'lose');
  }
  function hideResult() { resultOpen = false; $('result').hidden = true; }

  /* ---------------------------------------------------------------- */
  /* Local play and AI                                                 */
  /* ---------------------------------------------------------------- */
  function pushHistory() {
    stack.push({ state: E.clone(state), lastMove: lastMove });
    if (stack.length > 200) stack.shift();
  }

  function makeLocal(move, fromAI) {
    if (!move || state.over) return;
    pushHistory();
    state = E.applyMove(state, move);
    lastMove = state.history[state.history.length - 1];
    lastAnim = { from: move.from, to: move.to };
    selected = -1;
    hideResult();
    sfx(move.jump ? 'capture' : (fromAI ? 'move' : 'click'));
    render();
    lastAnim = null;
    if (state.over) { finish(); return; }
    if (!fromAI && mode === 'ai' && state.turn !== HUMAN) scheduleAi();
    if (fromAI && mode === 'ai' && state.turn !== HUMAN) scheduleAi();
  }

  function scheduleAi() {
    if (isOnline() || state.over || mode !== 'ai' || state.turn === HUMAN) return;
    var token = ++aiToken;
    busy = true;
    render();
    setTimeout(function () {
      if (token !== aiToken) return;
      if (state.over) { busy = false; render(); return; }
      var budget = level >= 3 ? 600 : level >= 2 ? 300 : 120;
      var m = E.aiMove(state, level, budget);
      busy = false;
      if (m != null && token === aiToken) makeLocal(m, true);
      else render();
    }, 160);
  }

  function undo() {
    if (isOnline() || !stack.length) return;
    aiToken++;
    busy = false;
    var snap = stack.pop();
    state = snap.state;
    lastMove = snap.lastMove || null;
    if (mode === 'ai' && state.turn !== HUMAN && stack.length) {
      snap = stack.pop();
      state = snap.state;
      lastMove = snap.lastMove || null;
    }
    selected = -1;
    hideResult();
    sfx('click');
    render();
  }

  function newGame() {
    aiToken++;
    busy = false;
    state = E.setup(count);
    stack = [];
    selected = -1;
    lastMove = null;
    hideResult();
    sfx('deal');
    render();
  }

  function selectPiece(sq) {
    selected = sq;
    sfx('click');
    render();
    if (!currentMoves().some(function (m) { return m.from === sq; })) {
      $('hint').textContent = '这枚弹珠当前没有合法着法。';
    }
  }
  function findMove(from, to) {
    return currentMoves().filter(function (m) { return m.from === from && m.to === to; })[0] || null;
  }
  function onPoint(sq) {
    if (!canInteract()) return;
    var p = state.board[sq];
    var turnHasPiece = p >= 0 && p === state.turn;
    if (selected >= 0) {
      var move = findMove(selected, sq);
      if (move) {
        if (isOnline()) onlineMove(move);
        else makeLocal(move, false);
        return;
      }
      if (turnHasPiece && sq !== selected) { selectPiece(sq); return; }
      selected = -1;
      render();
      return;
    }
    if (turnHasPiece) selectPiece(sq);
    else if (p >= 0) $('hint').textContent = '还没轮到这一方。';
  }

  /* ---------------------------------------------------------------- */
  /* Online                                                            */
  /* ---------------------------------------------------------------- */
  function onlineApi(method, route, body) {
    return fetch(route, {
      method: method, headers: { 'content-type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = JSON.parse(text); } catch (err) { data = null; }
        return { status: res.status, body: data };
      });
    });
  }
  function roomPath() {
    return '/api/rooms/' + encodeURIComponent(online.roomId) +
      '?session=' + encodeURIComponent(online.session) + '&playerId=' + encodeURIComponent(online.playerId);
  }
  function applyOnlineView(view) {
    online.view = view;
    if (view && view.state) {
      state = view.state;
      lastMove = view.state.history && view.state.history.length ? view.state.history[view.state.history.length - 1] : null;
      if (view.canMove) selected = -1;
      render();
      if (view.over) finish();
      else if (resultOpen) hideResult();
    } else {
      state = E.setup(2);
      render();
      $('hint').textContent = '房间已创建，等待房主开始对局。';
    }
  }
  function refreshOnline() {
    if (!online || document.hidden) return;
    onlineApi('GET', roomPath()).then(function (res) {
      if (res.status !== 200) {
        if (res.status === 403 || res.status === 404) {
          toast('联机房间已失效，返回大厅重新加入。');
          if (pollTimer) clearInterval(pollTimer);
        }
        return;
      }
      applyOnlineView(res.body);
    }).catch(function () {});
  }
  function onlineMove(move) {
    if (!online.view || !online.view.canMove) return;
    busy = true;
    render();
    onlineApi('POST', '/api/rooms/' + encodeURIComponent(online.roomId) + '/actions', {
      session: online.session, playerId: online.playerId, type: 'move',
      move: { from: move.from, to: move.to, path: move.path }
    }).then(function (res) {
      busy = false;
      if (res.status !== 200) {
        toast((res.body && res.body.error && res.body.error.message) || '走子被拒绝。');
        refreshOnline();
        render();
        return;
      }
      sfx('move');
      applyOnlineView(res.body);
    }).catch(function () {
      busy = false;
      render();
      toast('网络中断，正在重连…');
    });
  }
  function onlineAgain() {
    if (!online || !online.view || !online.view.isHost) return;
    onlineApi('POST', '/api/rooms/' + encodeURIComponent(online.roomId) + '/restart', {
      session: online.session, playerId: online.playerId
    }).then(function (res) {
      if (res.status === 200) { hideResult(); applyOnlineView(res.body); }
      else toast('重开失败。');
    });
  }

  /* ---------------------------------------------------------------- */
  /* Wiring                                                            */
  /* ---------------------------------------------------------------- */
  function bind() {
    svg.addEventListener('click', function (ev) {
      var node = ev.target.closest ? ev.target.closest('[data-sq]') : null;
      if (!node) return;
      onPoint(+node.getAttribute('data-sq'));
    });
    $('newBtn').addEventListener('click', function () {
      if (isOnline()) { location.href = 'online.html'; return; }
      newGame();
    });
    $('undoBtn').addEventListener('click', undo);
    $('againBtn').addEventListener('click', function () {
      if (isOnline()) { onlineAgain(); return; }
      hideResult();
      newGame();
    });
    $('reviewBtn').addEventListener('click', hideResult);
    $('soundBtn').addEventListener('click', function () {
      var muted = window.Sfx ? !window.Sfx.isMuted() : false;
      if (window.Sfx) window.Sfx.mute(muted);
      this.setAttribute('aria-pressed', muted ? 'true' : 'false');
      this.textContent = muted ? '音效 关' : '音效 开';
      if (!muted) sfx('click');
    });
    Array.prototype.forEach.call($('modeSeg').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        if (isOnline()) return;
        mode = b.getAttribute('data-mode');
        newGame();
      });
    });
    Array.prototype.forEach.call($('countSeg').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        if (isOnline()) return;
        count = +b.getAttribute('data-count') || 2;
        newGame();
      });
    });
    Array.prototype.forEach.call($('levelSeg').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        level = +b.getAttribute('data-level') || 2;
        sfx('click');
        render();
      });
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshOnline(); });
    window.addEventListener('beforeunload', function () { if (pollTimer) clearInterval(pollTimer); });
  }

  function boot() {
    buildStaticBoard();
    bind();
    if (window.Sfx && window.Sfx.isMuted && window.Sfx.isMuted()) {
      $('soundBtn').textContent = '音效 关';
      $('soundBtn').setAttribute('aria-pressed', 'true');
    }
    var params = new URLSearchParams(location.search);
    var room = params.get('online');
    if (room) {
      online = { roomId: room, session: params.get('session') || '', playerId: params.get('player') || params.get('playerId') || '' };
      document.body.setAttribute('data-view', 'online');
      state = E.setup(2);
      render();
      refreshOnline();
      pollTimer = setInterval(refreshOnline, 1300);
    } else {
      state = E.setup(2);
      render();
    }
  }

  window.__checkers = {
    getState: function () {
      var out = JSON.parse(JSON.stringify(state));
      out.board = Array.from(state.board);
      out.legal = E.legalMovesForTurn(state).map(function (m) {
        return { from: m.from, to: m.to, path: m.path.slice(), jump: !!m.jump, notation: E.notation(m) };
      });
      return out;
    },
    isBusy: function () { return busy; },
    isOnline: isOnline,
    playMove: function (from, to) {
      var move = findMove(from, to);
      if (!move) return false;
      if (isOnline()) { onlineMove(move); return true; }
      makeLocal(move, false);
      return true;
    },
    chooseMove: function (lv) { return E.aiMove(state, lv || level, 300); },
    loadPosition: function (board, turn, active) {
      var act = active || [0, 3];
      state = E.emptyState(act, act);
      for (var i = 0; i < board.length; i++) state.board[i] = typeof board[i] === 'number' ? board[i] : -1;
      state.turn = turn == null ? act[0] : turn;
      var w = E.winner(state);
      if (w >= 0) { state.over = true; state.winner = w; state.reason = 'target'; }
      stack = [];
      selected = -1;
      lastMove = null;
      hideResult();
      render();
      if (state.over) finish();
    },
    newGame: newGame,
    setMode: function (m) { mode = m; newGame(); },
    setCount: function (n) { count = n; newGame(); },
    board: svg
  };

  boot();
})();
</script>
