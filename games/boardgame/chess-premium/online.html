<!--
  Chess premium — online room. Server-authoritative HTTP/JSON polling.
  Room, invite, password, reconnect, AI fill, timeout takeover, leaderboard and
  rematch come from games/shared/online-room-server.mjs. Chess is perfect
  information; both seats see the same board.
-->
<html lang="zh-CN" data-theme="dark">
<head>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/chess-premium/online.html">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="国际象棋联机房间：创建或加入房间、邀请码与密码、双人同局、空位 AI 补位、断线重连、超时托管与结算榜。服务端权威判定 FIDE 规则。">
<title>国际象棋 · Chess Premium · 联机房间</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317130f'/%3E%3Crect x='10' y='10' width='22' height='22' fill='%23e8d3a9'/%3E%3Crect x='32' y='32' width='22' height='22' fill='%23e8d3a9'/%3E%3Ccircle cx='38' cy='26' r='7' fill='%23e8d3a9'/%3E%3Cpath d='M28 52h20l4 6H24z' fill='%23e8d3a9'/%3E%3C/svg%3E">
<style>
  :root{
    --art-maple:url("../../assets/art/premium/chess/light-maple.webp");
    --art-walnut:url("../../assets/art/premium/chess/dark-walnut.webp");
    --art-felt:url("../../assets/art/premium/chess/felt-cloth.webp");
    --art-edge:url("../../assets/art/premium/chess/board-edge.webp");
    --font-serif:"Songti SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --bg:#100d0a;--bg2:#1b1611;--panel:#211a13;--panel2:#2b2219;--line:#4c3b28;--line2:#6a5238;
    --ink:#f5ead8;--muted:#c3ae91;--dim:#9b866b;--gold:#e3b25f;--gold2:#f6d79c;
    --coral:#d7653f;--mint:#8fd0a8;--sky:#8ec3e8;--danger:#ff9b84;
    --light-sq:#e8d3a9;--dark-sq:#6b4a2f;--board-frame:#3d2717;
    --shadow:0 20px 44px rgba(0,0,0,.46);--radius:16px;--tap:46px;
  }
  html[data-theme="light"]{
    --bg:#efe5d4;--bg2:#f8f0e2;--panel:#fffaf1;--panel2:#f3e8d5;--line:#cfba99;--line2:#b79b74;
    --ink:#2b2117;--muted:#6b5943;--dim:#8c795f;--gold:#99651a;--gold2:#7b4f0d;
    --coral:#b74a2a;--mint:#227a55;--sky:#2d6f9e;--danger:#a93a2b;--shadow:0 18px 36px rgba(92,65,35,.2);
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--ink);font:16px/1.5 var(--font-sans);min-height:100vh;
    background:
      radial-gradient(1000px 640px at 50% -18%,rgba(115,78,42,.4),transparent 62%),
      var(--art-felt) center/cover no-repeat fixed,
      linear-gradient(166deg,var(--bg2),var(--bg) 64%);
    background-color:var(--bg);-webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:760px;margin:0 auto;padding:10px 12px 38px}
  a{color:var(--gold)}
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation}
  [hidden]{display:none!important}
  .top{display:flex;align-items:center;gap:6px;padding:2px 0 11px}
  .top h1{flex:1;min-width:0;margin:0;text-align:center;font-family:var(--font-serif);font-weight:700;font-size:20px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:46px;min-height:46px;padding:0 11px;
    border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));
    color:var(--ink);font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
  .panel{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);
    padding:13px;box-shadow:var(--shadow);margin-bottom:11px}
  h2{margin:0 0 9px;font-size:12px;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted);font-weight:800}
  .field{display:grid;gap:5px;margin-bottom:9px}
  .field label{font-size:12px;color:var(--muted);font-weight:700}
  input{font-size:16px;min-height:46px;padding:9px 11px;border-radius:11px;border:1px solid var(--line);
    background:rgba(0,0,0,.18);color:var(--ink);width:100%}
  button.primary,.row > button.primary{background:linear-gradient(160deg,var(--gold2),var(--gold));background-color:var(--gold);color:#2a1a07;border:0;font-weight:900}
  button.ghost{background:transparent}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row > button:not(.primary){flex:1;min-width:120px;min-height:var(--tap);border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:14px;font-weight:800}
  .muted{color:var(--muted);font-size:12.5px;margin:8px 0 0}
  .err{color:var(--danger);font-size:13px;font-weight:700;min-height:18px;margin-top:5px}
  .roombar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .chip{display:inline-flex;align-items:center;min-height:32px;padding:2px 11px;border-radius:999px;background:rgba(0,0,0,.22);
    border:1px solid var(--line);font-size:12.5px;font-weight:800;color:var(--gold2)}
  .seats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
  .seat{border:1px solid var(--line);border-radius:13px;padding:8px 10px;background:rgba(0,0,0,.16);min-width:0}
  .seat.you{border-color:var(--gold)}
  .seat .nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seat .meta{display:flex;justify-content:space-between;gap:5px;margin-top:2px;font-size:12px;color:var(--muted)}
  .seat .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:0}
  .seat .dot.w{background:#f0dfbb}.seat .dot.b{background:#3a2514;border:1px solid #9b7a53}
  .tray{display:flex;align-items:center;gap:6px;min-height:33px;padding:3px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.08);
    background:rgba(0,0,0,.18);margin:5px 1px}
  .tray .tlabel{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
  .tray .tmini{display:flex;align-items:center;gap:1px;flex-wrap:wrap;flex:1;min-width:0;min-height:22px}
  .tray .adv{font-size:12px;font-weight:900;color:var(--gold2)}
  .mini{width:20px;height:24px;display:inline-block}
  .mini svg{display:block;width:100%;height:100%}
  .tray .empty{font-size:12px;color:var(--dim)}
  .boardframe{position:relative;width:100%;max-width:560px;margin:0 auto;padding:9px;border-radius:15px;
    background:linear-gradient(150deg,rgba(255,222,166,.14),rgba(0,0,0,.3)),var(--art-edge) center/cover no-repeat,var(--board-frame);
    box-shadow:0 12px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,235,200,.3)}
  .board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
    width:100%;aspect-ratio:1;border-radius:5px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .sq{position:relative;min-width:0;min-height:0;overflow:hidden;cursor:pointer;--sq-color:var(--light-sq);
    background-color:var(--sq-color);background-image:linear-gradient(var(--sq-color),var(--sq-color)),var(--sq-tex);
    background-size:100% 100%,800% 800%;background-position:0 0,calc(var(--c) * 100% / 7) calc(var(--r) * 100% / 7);
    background-blend-mode:multiply,normal}
  .sq.light{--sq-color:var(--light-sq);--sq-tex:var(--art-maple)}
  .sq.dark{--sq-color:var(--dark-sq);--sq-tex:var(--art-walnut)}
  .sq.last{box-shadow:inset 0 0 0 3px rgba(236,182,86,.62)}
  .sq.sel{box-shadow:inset 0 0 0 4px rgba(255,231,166,.95)}
  .sq.check::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(circle,rgba(211,61,44,.9),rgba(211,61,44,.26) 52%,transparent 74%)}
  .sq .dot{position:absolute;left:50%;top:50%;z-index:3;width:26%;height:26%;border-radius:50%;
    transform:translate(-50%,-50%);background:rgba(37,26,16,.38);pointer-events:none}
  .sq.dark .dot{background:rgba(248,232,202,.62)}
  .sq .cap-ring{position:absolute;inset:8%;z-index:5;border-radius:50%;border:3px solid rgba(178,57,38,.72);pointer-events:none}
  .sq.dark .cap-ring{border-color:rgba(255,188,148,.86)}
  .sq .piece{position:absolute;left:5%;right:5%;top:4%;bottom:3%;z-index:4;display:block;pointer-events:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
  .sq .piece svg{display:block;width:100%;height:100%;overflow:visible}
  .piece .pc{stroke-linejoin:round;stroke-linecap:round;stroke-width:2.4}
  .piece.w .pc{fill:url(#gMaple);stroke:#5b3c22}
  .piece.b .pc{fill:url(#gWalnut);stroke:#180d06}
  .piece .shine{fill:#fff9e9;opacity:.3;stroke:none}
  .piece .accent{fill:none;stroke:#6b4527;stroke-width:2;opacity:.62;stroke-linecap:round}
  .piece.b .accent{stroke:#d0a878;opacity:.38}
  .piece .eye{fill:#201208;stroke:none}
  .piece.b .eye{fill:#e6c79b}
  .sq .co{position:absolute;z-index:5;font-size:12px;font-weight:800;line-height:1;pointer-events:none}
  .sq .co.f{right:3px;bottom:2px}.sq .co.r{left:3px;top:3px}
  .sq.light .co{color:#67502f;opacity:.92}.sq.dark .co{color:#f1dfbd;opacity:.9}
  .hint{min-height:20px;margin:7px 2px 0;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted)}
  .history{max-height:130px;overflow:auto;margin-top:4px}
  .history ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:2px 10px}
  .history li{display:flex;gap:5px;font-size:12px;padding:2px 1px;border-bottom:1px dashed rgba(160,132,96,.18)}
  .history li b{color:var(--dim);font-size:12px}.history li span{color:var(--ink);font-weight:700;font-size:12px}
  .history .none{font-size:12px;color:var(--dim);margin:0}
  .finale{margin-top:9px;border:1px solid rgba(143,208,168,.42);background:rgba(143,208,168,.12);border-radius:13px;padding:10px;text-align:center}
  .finale h3{margin:0 0 3px;font-family:var(--font-serif);font-size:19px}
  .finale p{margin:0;font-size:12px;color:var(--muted)}
  .leaderboard{display:grid;gap:4px}
  .lbrow{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.12)}
  .lbrow b{color:var(--gold2)}
  .promo{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;
    background:rgba(12,8,4,.72);backdrop-filter:blur(3px)}
  .promo-card{width:100%;max-width:350px;border-radius:19px;border:1px solid var(--line2);padding:15px;
    background:linear-gradient(160deg,var(--panel2),var(--panel));box-shadow:var(--shadow);text-align:center}
  .promo-card h2{margin:0 0 3px;font-family:var(--font-serif);font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink)}
  .promo-card p{margin:0 0 10px;font-size:12px;color:var(--muted)}
  .promo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px}
  .promo-grid button{min-height:72px;padding:4px 2px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.16);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .promo-grid .pp{width:36px;height:42px;display:block}.promo-grid .pp svg{display:block;width:100%;height:100%}
  .promo-grid em{font-style:normal;font-size:12px;color:var(--muted);font-weight:800}
  .promo-card .cancel{min-height:44px;min-width:90px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:800;color:var(--muted)}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  @media (max-width:430px){
    .wrap{padding:8px 9px 30px}
    .top h1{font-size:17px}
    .panel{padding:10px;border-radius:14px}
    .boardframe{padding:7px}
    .icon-btn{min-width:44px;min-height:44px;padding:0 8px;font-size:12px}
    .seats{gap:6px}
    .seat{padding:7px 8px}
    .history ol{grid-template-columns:1fr}
  }
/* safe-area: keep the original bottom padding, clear the iOS home indicator */
body{padding-bottom:env(safe-area-inset-bottom)}
</style>

<div class="wrap">
  <header class="top">
    <a class="icon-btn" href="index.html">← 单机</a>
    <h1>国际象棋 · 联机</h1>
    <a class="icon-btn" href="rules.html">规则</a>
  </header>

  <main>
    <section class="panel" id="lobby" aria-label="联机大厅">
      <h2>创建或加入房间</h2>
      <div class="field"><label for="nickname">昵称</label><input id="nickname" maxlength="16" placeholder="房主 / 挑战者" autocomplete="nickname"></div>
      <div class="row">
        <button class="primary" id="createBtn" type="button">创建房间</button>
        <button id="joinBtn" type="button">加入房间</button>
      </div>
      <div id="joinFields" hidden style="margin-top:10px">
        <div class="field"><label for="roomCode">房间号 / 邀请码</label><input id="roomCode" maxlength="64" placeholder="粘贴房间号或邀请码" autocomplete="off"></div>
        <div class="field"><label for="joinPassword">房间密码（可选）</label><input id="joinPassword" type="password" maxlength="64" placeholder="无密码可留空" autocomplete="off"></div>
      </div>
      <div class="err" id="lobbyErr" role="alert"></div>
      <p class="muted">服务端权威判定合法着法；空位 AI 补齐；掉线超时后自动托管，重连即恢复。棋盘为完全公开信息。</p>
    </section>

    <section class="panel" id="boardPanel" aria-label="联机棋盘" hidden>
      <div class="roombar">
        <span class="chip" id="roomChip">—</span>
        <div class="row" style="flex:0 1 auto">
          <button class="ghost" id="inviteBtn" type="button">复制邀请</button>
          <button class="ghost" id="startBtn" type="button">开始 / AI 补位</button>
        </div>
      </div>
      <div class="err" id="boardErr" role="alert"></div>
      <div class="seats" id="seats"></div>
      <div class="tray" aria-label="白方吃子"><span class="tlabel">白方吃子</span><span class="tmini" id="trayWhite"></span><span class="adv" id="advWhite">0</span></div>
      <div class="boardframe"><div class="board" id="board" role="grid" aria-label="联机国际象棋棋盘"></div></div>
      <div class="tray" aria-label="黑方吃子"><span class="tlabel">黑方吃子</span><span class="tmini" id="trayBlack"></span><span class="adv" id="advBlack">0</span></div>
      <p class="hint" id="hint">等待房间状态…</p>

      <section class="panel" style="margin:9px 0 0;padding:9px 10px" aria-label="棋谱">
        <h2>棋谱 · SAN</h2>
        <div class="history" id="historyBox"><p class="none">还没有着法。</p></div>
      </section>

      <div class="finale" id="finale" hidden>
        <h3 id="finaleTitle">结算</h3>
        <p id="finaleSub"></p>
        <div class="row" style="margin-top:8px"><button class="primary" id="restartBtn" type="button">再来一局（交换颜色）</button></div>
      </div>

      <div class="row" style="margin-top:9px">
        <button class="ghost" id="leaveBtn" type="button">离开房间</button>
        <a class="icon-btn" href="index.html" style="flex:0 0 auto">返回单机</a>
      </div>
    </section>

    <section class="panel" aria-label="结算榜">
      <h2>结算榜</h2>
      <div class="leaderboard" id="leaderboard"><p class="muted">还没有结算记录。</p></div>
    </section>
  </main>
</div>

<div class="promo" id="promo" role="dialog" aria-modal="true" aria-labelledby="promoTitle" hidden>

    <p>兵到达底线，必须升变。</p>
    <div class="promo-grid" id="promoGrid"></div>
    <button class="cancel" type="button" id="promoCancel">取消</button>
  </div>
</div>

  var flipped = false;
  var squares = new Array(64);
  var moveMap = {};
  var pendingPromo = null;
  var FILES = 'abcdefgh';
  var VAL = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 0 };
  var PNAME = { P: '兵', N: '马', B: '象', R: '车', Q: '后', K: '王' };
  var Sfx = window.Sfx;
  var muted = false;
  try { muted = sessionStorage.getItem('chess-online-muted') === '1'; } catch (e) {}
  function sfx(n) { if (!muted && Sfx) Sfx.play(n); }

  try {
    if (!session) session = sessionStorage.getItem('chess-online-session') || '';
    if (!playerId) playerId = sessionStorage.getItem('chess-online-player') || '';
    if (!roomKey) roomKey = sessionStorage.getItem('chess-online-room') || '';
  } catch (e) {}

  function remember(nextRoom, nextSession, nextPlayer) {
    roomKey = nextRoom || roomKey;
    session = nextSession || session;
    playerId = nextPlayer || playerId;
    try {
      sessionStorage.setItem('chess-online-session', session);
      sessionStorage.setItem('chess-online-player', playerId);
      sessionStorage.setItem('chess-online-room', roomKey);
    } catch (e) {}
    var url = location.pathname + '?room=' + encodeURIComponent(roomKey) +
      '&session=' + encodeURIComponent(session) + '&player=' + encodeURIComponent(playerId);
    try { history.replaceState(null, '', url); } catch (e) {}
  }

  function api(method, route, body) {
    return fetch(route, {
      method: method,
      headers: { 'content-type': 'application/json' },
      body: body == null ? undefined : JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) { return { status: res.status, body: data }; });
    });
  }
  function errText(r) { return (r.body && r.body.error && r.body.error.message) || ('HTTP ' + r.status); }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function toast(msg) { $('boardErr').textContent = msg || ''; }

  function showBoard(on) {
    $('lobby').hidden = on;
    $('boardPanel').hidden = !on;
  }

  function nicknameValue() {
    var v = ($('nickname').value || '').trim();
    if (!v) v = '棋手-' + Math.random().toString(36).slice(2, 6);
    try { sessionStorage.setItem('chess-online-nick', v); } catch (e) {}
    return v;
  }
  try { $('nickname').value = sessionStorage.getItem('chess-online-nick') || ''; } catch (e) {}

  function createRoom() {
    $('lobbyErr').textContent = '';
    api('POST', '/api/rooms', {
      playerId: 'chess-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6),
      nickname: nicknameValue()
    }).then(function (r) {
      if (!r.body || !r.body.roomId) throw new Error(errText(r));
      remember(r.body.roomId, r.body.session, r.body.playerId);
      invite = r.body.inviteToken || '';
      showBoard(true);
      poll();
    }).catch(function (e) { $('lobbyErr').textContent = e.message; });
  }

  function joinRoom() {
    var key = ($('roomCode').value || '').trim();
    if (!key) { $('joinFields').hidden = false; $('lobbyErr').textContent = '请填写房间号或邀请码。'; return; }
    $('lobbyErr').textContent = '';
    var payload = { playerId: 'chess-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6), nickname: nicknameValue() };
    if (key.indexOf('room_') !== 0 && !/^[A-Z0-9]{6}$/i.test(key)) payload.inviteCode = key;
    if ($('joinPassword').value) payload.password = $('joinPassword').value;
    api('POST', '/api/rooms/' + encodeURIComponent(key) + '/join', payload).then(function (r) {
      if (!r.body || !r.body.session) throw new Error(errText(r));
      remember(r.body.roomId, r.body.session, r.body.playerId);
      showBoard(true);
      poll();
    }).catch(function (e) { $('lobbyErr').textContent = e.message; });
  }

  // ---- board -------------------------------------------------------------
  function buildBoard() {
    var board = $('board');
    board.innerHTML = '';
    squares = new Array(64);
    for (var i = 0; i < 64; i++) {
      var actual = flipped ? 63 - i : i;
      var r = (actual / 8) | 0, f = actual & 7;
      var sq = document.createElement('div');
      sq.className = 'sq ' + (((r + f) % 2 === 0) ? 'light' : 'dark');
      sq.setAttribute('role', 'gridcell');
      sq.setAttribute('data-sq', String(actual));
      sq.style.setProperty('--r', String(flipped ? 7 - r : r));
      sq.style.setProperty('--c', String(flipped ? 7 - f : f));
      if (Math.floor(i / 8) === 7) {
        var file = document.createElement('span');
        file.className = 'co f';
        file.textContent = FILES.charAt(f);
        sq.appendChild(file);
      }
      if ((i & 7) === 0) {
        var rank = document.createElement('span');
        rank.className = 'co r';
        rank.textContent = String(8 - r);
        sq.appendChild(rank);
      }
      board.appendChild(sq);
      squares[actual] = sq;
    }
  }
  function pieceHtml(code, color) {
    return '<span class="piece ' + color + '" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#pc' + code.toUpperCase() + '"></use></svg></span>';
  }
  function miniHtml(code, color) {
    return '<span class="mini"><svg viewBox="0 0 100 100" class="piece ' + color + '"><use href="#pc' + code.toUpperCase() + '"></use></svg></span>';
  }
  function sqLabel(i) {
    var p = view && view.board ? view.board[i] : null;
    var base = FILES.charAt(i & 7) + String(8 - ((i / 8) | 0));
    if (!p) return base + '，空格';
    return base + '，' + (p === p.toUpperCase() ? '白' : '黑') + PNAME[p.toUpperCase()];
  }

  function renderBoard() {
    if (!view) return;
    var checkSq = view.check ? view.kings[view.turn] : -1;
    moveMap = {};
    (view.legalMoves || []).forEach(function (m) {
      if (!moveMap[m.from]) moveMap[m.from] = [];
      moveMap[m.from].push(m);
    });
    var targets = {};
    if (selected != null && moveMap[selected]) {
      moveMap[selected].forEach(function (m) {
        targets[m.to] = (view.board[m.to] || m.ep) ? 'cap-ring' : 'dot';
      });
    }
    var last = view.lastMove;
    for (var s = 0; s < 64; s++) {
      var cell = squares[s];
      if (!cell) continue;
      var p = view.board[s];
      cell.className = 'sq ' + (((((s / 8) | 0) + (s & 7)) % 2 === 0) ? 'light' : 'dark') +
        (selected === s ? ' sel' : '') + (last && (last.from === s || last.to === s) ? ' last' : '') +
        (s === checkSq ? ' check' : '');
      cell.setAttribute('aria-label', sqLabel(s));
      var html = p ? pieceHtml(p.toUpperCase(), p === p.toUpperCase() ? 'w' : 'b') : '';
      if (targets[s]) html += '<i class="' + targets[s] + '"></i>';
      var row = (s / 8) | 0, file = s & 7;
      if ((!flipped && row === 7) || (flipped && row === 0)) html += '<span class="co f">' + FILES.charAt(file) + '</span>';
      if ((!flipped && file === 0) || (flipped && file === 7)) html += '<span class="co r">' + (8 - row) + '</span>';
      if (cell.innerHTML !== html) cell.innerHTML = html;
    }
  }

  function renderTrays() {
    var w = (view.captured && view.captured.w) || [];
    var b = (view.captured && view.captured.b) || [];
    $('trayWhite').innerHTML = w.length ? w.map(function (p) { return miniHtml(p, 'b'); }).join('') : '<span class="empty">尚未吃子</span>';
    $('trayBlack').innerHTML = b.length ? b.map(function (p) { return miniHtml(p, 'w'); }).join('') : '<span class="empty">尚未吃子</span>';
    var ws = w.reduce(function (a, p) { return a + (VAL[p.toUpperCase()] || 0); }, 0);
    var bs = b.reduce(function (a, p) { return a + (VAL[p.toUpperCase()] || 0); }, 0);
    $('advWhite').textContent = ws - bs > 0 ? '+' + (ws - bs) : String(ws - bs);
    $('advBlack').textContent = bs - ws > 0 ? '+' + (bs - ws) : String(bs - ws);
  }

  function resultText() {
    if (!view) return '';
    if (view.resultType === 'checkmate') return view.winnerColor === 'w' ? '将死 · 白方胜' : '将死 · 黑方胜';
    if (view.resultType === 'stalemate') return '逼和 · 和棋';
    if (view.resultType === 'fifty') return '五十回合规则 · 和棋';
    if (view.resultType === 'repetition') return '三次重复局面 · 和棋';
    if (view.resultType === 'insufficient') return '子力不足 · 和棋';
    return '对局结束';
  }
  function renderStatus() {
    if (!view) return;
    var status = view.over ? resultText() :
      ((view.turn === 'w' ? '白方' : '黑方') + '走棋' + (view.check ? ' · 将军！' : ''));
    var mine = view.you >= 0 && view.seatColors[view.you] === view.turn;
    var hint;
    if (view.over) hint = '本局结束。房主可发起重赛，重赛自动交换颜色。';
    else if (mine && view.legalMoves && view.legalMoves.length) hint = selected != null ? '选择高亮落点，或再点一次取消。' : '轮到你：点自己的棋子，再点目标格。';
    else hint = '等待对手走棋… 断线超时后座位由 AI 托管。';
    $('hint').textContent = hint;
    $('hint').setAttribute('aria-label', status + '。' + hint);
    $('roomChip').textContent = '房间 ' + (view.code || view.roomId) + ' · ' + (view.over ? '已结束' : '进行中') + ' · 2 人';
    $('inviteBtn').disabled = !view.seats.some(function (s) { return s.you && s.index === 0; });
    $('startBtn').hidden = view.started !== false && view.moveCount >= 0;
    $('startBtn').disabled = !view.seats.some(function (s) { return s.you && s.index === 0; });
    var fin = $('finale');
    fin.hidden = !view.over;
    if (view.over) {
      $('finaleTitle').textContent = view.winnerColor ? (view.winnerColor === 'w' ? '白方获胜' : '黑方获胜') : '和棋';
      $('finaleSub').textContent = resultText() + ' · ' + view.moveCount + ' 半回合 · ' + (view.history || []).slice(-3).join(' ');
      $('restartBtn').hidden = !view.canRestart;
    }
  }

  function renderSeats(r) {
    var list = (view && view.seats && view.seats.length) ? view.seats : (r.seats || []);
    $('seats').innerHTML = list.map(function (seat) {
      var p = r.state || {};
      var seatColor = seat.color || (seat.index === 0 ? 'w' : 'b');
      var color = seatColor === 'w' ? '白' : '黑';
      var flags = [];
      if (seat.isHost) flags.push('房主');
      if (seat.ai) flags.push('AI');
      if (seat.you) flags.push('你');
      if (r.takeover && r.takeover.indexOf(seat.index) >= 0) flags.push('托管');
      if (seat.connected === false) flags.push('离线');
      var current = p.turn === seatColor;
      return '<div class="seat' + (seat.you ? ' you' : '') + '">' +
        '<div class="nm"><span class="dot ' + seat.color + '"></span>' + esc(seat.name) + '</div>' +
        '<div class="meta"><span>' + color + '方' + (current && !r.over ? ' · 走棋' : '') + '</span><span>' + flags.join(' · ') + '</span></div>' +
        '</div>';
    }).join('');
  }

  function renderHistory() {
    var list = (view && view.history) || [];
    if (!list.length) { $('historyBox').innerHTML = '<p class="none">还没有着法。</p>'; return; }
    var rows = '';
    for (var i = 0; i < list.length; i += 2) {
      rows += '<li><b>' + (1 + (i >> 1)) + '.</b><span>' + esc(list[i]) + '</span><span>' + esc(list[i + 1] || '…') + '</span></li>';
    }
    $('historyBox').innerHTML = '<ol>' + rows + '</ol>';
    $('historyBox').scrollTop = $('historyBox').scrollHeight;
  }

  function renderRoom(r) {
    view = r.state;
    view.roomId = r.roomId;
    view.code = r.code;
    view.started = r.started;
    view.you = r.you;
    view.over = r.over || (view.status && view.status.over);
    view.legalMoves = (r.legalActions || []).map(function (a) {
      return { from: a.from, to: a.to, promo: a.promotion || '', ep: false };
    });
    view.canRestart = r.canRestart;
    view.seats = (r.seats || []).map(function (seat, i) {
      return {
        index: i,
        name: seat.name,
        ai: Boolean(seat.ai),
        isHost: Boolean(seat.isHost),
        isYou: Boolean(seat.isYou),
        connected: seat.connected !== false,
        color: view.seatColors ? view.seatColors[i] : (i === 0 ? 'w' : 'b'),
        you: Boolean(seat.isYou)
      };
    });
    var myColor = r.you >= 0 && view.seatColors ? view.seatColors[r.you] : 'w';
    var wantFlip = myColor === 'b';
    if (wantFlip !== flipped) { flipped = wantFlip; buildBoard(); }
    renderSeats(r);
    renderTrays();
    renderBoard();
    renderStatus();
    renderHistory();
    var fin = $('finale');
    if (r.over && r.result) {
      fin.hidden = false;
      var title;
      if (r.result.result === 'checkmate' && r.result.winnerSeat != null) {
        title = (r.result.winnerSeat === r.you ? '你赢了！' : '对手获胜');
      } else {
        title = '和棋';
      }
      $('finaleTitle').textContent = title;
      $('finaleSub').textContent = resultText() + ' · ' + (r.result.turns || 0) + ' 半回合';
      $('restartBtn').hidden = !r.canRestart;
    } else {
      fin.hidden = true;
    }
    $('startBtn').hidden = r.started;
    $('startBtn').disabled = !(r.you === 0);
    $('inviteBtn').disabled = !(r.you === 0);
    if (r.inviteCode) invite = r.inviteCode;
  }

  function fetchRoom() {
    if (!roomKey || !session) { showBoard(false); return Promise.resolve(null); }
    return api('GET', '/api/rooms/' + encodeURIComponent(roomKey) + '?session=' + encodeURIComponent(session) + '&playerId=' + encodeURIComponent(playerId))
      .then(function (r) {
        if (r.status === 401) {
          return api('POST', '/api/rooms/' + encodeURIComponent(roomKey) + '/reconnect', { session: session, playerId: playerId })
            .then(function (rr) {
              if (!rr.body || !rr.body.ok) throw new Error('房间已失效，请重新创建或加入。');
              return rr;
            });
        }
        if (r.status >= 400) throw new Error(errText(r));
        return r;
      })
      .then(function (r) {
        if (!r) return;
        var v = r.body || {};
        showBoard(true);
        lastVersion = v.stateVersion;
        renderRoom(v);
      })
      .catch(function (e) { toast(e.message); });
  }

  function poll() {
    if (timer) clearInterval(timer);
    fetchRoom();
    timer = setInterval(fetchRoom, 700);
  }

  function act(action) {
    toast('');
    api('POST', '/api/rooms/' + encodeURIComponent(roomKey) + '/actions', {
      session: session, playerId: playerId, action: action
    }).then(function (r) {
      if (r.status >= 400) throw new Error(errText(r));
      lastVersion = -1;
      selected = null;
      sfx(action.promotion ? 'capture' : 'move');
      return fetchRoom();
    }).catch(function (e) { toast(e.message); });
  }

  function ownPiece(sq) {
    if (!view || !view.board) return null;
    var p = view.board[sq];
    if (!p) return null;
    var color = p === p.toUpperCase() ? 'w' : 'b';
    return color === view.seatColors[view.you] ? p : null;
  }

  function tap(sq) {
    if (!view || view.over) return;
    var mine = view.you >= 0 && view.seatColors[view.you] === view.turn;
    if (!mine) return;
    if (selected != null) {
      if (sq === selected) { selected = null; renderBoard(); return; }
      var options = (moveMap[selected] || []).filter(function (m) { return m.to === sq; });
      if (options.length) {
        if (options.length > 1) { pendingPromo = { from: selected, to: sq, options: options }; showPromo(); }
        else { var from = selected; selected = null; renderBoard(); act({ type: 'move', from: from, to: options[0].to }); }
        return;
      }
    }
    if (ownPiece(sq)) { selected = sq; renderBoard(); }
    else { selected = null; renderBoard(); }
  }

  function showPromo() {
    var grid = $('promoGrid');
    grid.innerHTML = '';
    var color = view.seatColors[view.you];
    ['Q', 'R', 'B', 'N'].forEach(function (kind) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', '升变为' + PNAME[kind]);
      b.innerHTML = '<span class="pp">' + pieceHtml(kind, color) + '</span><em>' + PNAME[kind] + '</em>';
      b.addEventListener('click', function () {
        if (!pendingPromo) return;
        var action = { type: 'move', from: pendingPromo.from, to: pendingPromo.to, promotion: kind.toLowerCase() };
        pendingPromo = null;
        $('promo').hidden = true;
        act(action);
      });
      grid.appendChild(b);
    });
    $('promo').hidden = false;
  }

  $('board').addEventListener('click', function (ev) {
    var cell = ev.target && ev.target.closest ? ev.target.closest('.sq') : null;
    if (!cell) return;
    tap(parseInt(cell.getAttribute('data-sq'), 10));
  });
  $('promoCancel').addEventListener('click', function () {
    pendingPromo = null;
    $('promo').hidden = true;
    selected = null;
    renderBoard();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      selected = null;
      if (!$('promo').hidden) { pendingPromo = null; $('promo').hidden = true; }
      renderBoard();
    }
  });

  $('createBtn').addEventListener('click', createRoom);
  $('joinBtn').addEventListener('click', function () { $('joinFields').hidden = false; joinRoom(); });
  $('startBtn').addEventListener('click', function () {
    api('POST', '/api/rooms/' + encodeURIComponent(roomKey) + '/start', { session: session, playerId: playerId })
      .then(function (r) { if (r.status >= 400) throw new Error(errText(r)); lastVersion = -1; return fetchRoom(); })
      .catch(function (e) { toast(e.message); });
  });
  $('restartBtn').addEventListener('click', function () {
    api('POST', '/api/rooms/' + encodeURIComponent(roomKey) + '/restart', { session: session, playerId: playerId })
      .then(function (r) { if (r.status >= 400) throw new Error(errText(r)); lastVersion = -1; return fetchRoom(); })
      .catch(function (e) { toast(e.message); });
  });
  $('leaveBtn').addEventListener('click', function () {
    api('POST', '/api/rooms/' + encodeURIComponent(roomKey) + '/leave', { session: session, playerId: playerId })
      .then(function () { showBoard(false); if (timer) clearInterval(timer); })
      .catch(function () { showBoard(false); if (timer) clearInterval(timer); });
  });
  $('inviteBtn').addEventListener('click', function () {
    var url = location.origin + '/boardgame/chess-premium/online.html?room=' + encodeURIComponent(roomKey) + '&code=' + encodeURIComponent(invite || '');
    var done = function () { toast('邀请链接已复制：' + url); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done).catch(done);
    else done();
  });

  function loadLeaderboard() {
    if (location.pathname.indexOf('/games/') === 0) return; // static site: no room API
    api('GET', '/api/leaderboard?game=chess-premium').then(function (r) {
      var entries = (r.body && r.body.entries) || [];
      $('leaderboard').innerHTML = entries.length
        ? entries.slice(0, 12).map(function (e) {
          return '<div class="lbrow"><span>' + esc(e.name) + (e.ai ? ' · AI' : '') + '</span><b>' + (e.winner ? '胜' : (e.score == null ? '' : e.score)) + '</b></div>';
        }).join('')
        : '<p class="muted">还没有结算记录。</p>';
    }).catch(function () {});
  }
  loadLeaderboard();
  setInterval(loadLeaderboard, 5000);

  buildBoard();
  if (roomKey && session) { showBoard(true); poll(); }
  else if (roomKey && invite) { $('joinFields').hidden = false; $('roomCode').value = invite; }

  // E2E / debug hook (public room state only).
  window.__online = {
    state: function () {
      return view ? {
        roomId: roomKey, you: view.you, turn: view.turn, over: view.over,
        moveCount: view.moveCount, seats: view.seats ? view.seats.length : 0,
        legalMoves: (view.legalMoves || []).length, status: view.resultType
      } : null;
    },
    tap: tap,
    act: act,
    refresh: fetchRoom
  };
})();
</script>
</body>
</html>
