<title>NO THANKS! 不谢 · 精品桌游</title>
<style>
  :root{
    --art-felt:url("../../assets/art/premium/no-thanks/table-felt.webp");
    --art-paper:url("../../assets/art/premium/no-thanks/card-paper.webp");
    --art-back:url("../../assets/art/premium/no-thanks/card-back.webp");
    --art-chip:url("../../assets/art/premium/no-thanks/chip-coral.webp");
    --art-brass:url("../../assets/art/premium/no-thanks/chip-brass.webp");
    --font-serif:"Songti SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
    --bg:#12171c; --bg2:#1b242c; --felt:#173a37; --felt2:#0f2726;
    --panel:rgba(31,43,51,.92); --panel-solid:#1f2b33; --line:#38505d;
    --ink:#f4fbf8; --muted:#a7bcc5; --soft:#6f8b96;
    --coral:#ff7d6b; --coral2:#d8503f; --mint:#58d6a8; --gold:#ffd36e;
    --violet:#b79cff; --sky:#79c8ff; --shadow:0 18px 40px rgba(0,0,0,.38);
    --card-face:#fff6e8; --card-ink:#241b15; --card-edge:#e7cfae;
    --radius:18px; --tap:52px;
  }
  :root[data-theme="light"]{
    --bg:#efe6d7; --bg2:#f8f1e5; --felt:#cfeadf; --felt2:#a9d6c7;
    --panel:rgba(255,251,244,.94); --panel-solid:#fffaf1; --line:#d5c3aa;
    --ink:#2a2119; --muted:#6d6254; --soft:#958773;
    --coral:#e9614f; --coral2:#bf3f30; --mint:#1f9d72; --gold:#b57c10;
    --violet:#6f55c9; --sky:#2f78b7; --shadow:0 16px 34px rgba(91,68,42,.18);
    --card-face:#fffdf5; --card-ink:#2a2119; --card-edge:#d8c3a0;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#efe6d7; --bg2:#f8f1e5; --felt:#cfeadf; --felt2:#a9d6c7;
      --panel:rgba(255,251,244,.94); --panel-solid:#fffaf1; --line:#d5c3aa;
      --ink:#2a2119; --muted:#6d6254; --soft:#958773;
      --coral:#e9614f; --coral2:#bf3f30; --mint:#1f9d72; --gold:#b57c10;
      --violet:#6f55c9; --sky:#2f78b7; --shadow:0 16px 34px rgba(91,68,42,.18);
      --card-face:#fffdf5; --card-ink:#2a2119; --card-edge:#d8c3a0;
    }
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0; color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1000px 560px at 50% -16%, var(--felt), transparent 64%),
      radial-gradient(760px 480px at 12% 108%, var(--felt2), transparent 60%),
      linear-gradient(168deg, var(--bg2), var(--bg) 58%);
    background-color:var(--bg);
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.16; z-index:0;
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.09) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(25deg, rgba(0,0,0,.12) 0 1px, transparent 1px 9px);
    mix-blend-mode:soft-light;
  }
  a{color:var(--gold)}
  .wrap{position:relative; z-index:1; max-width:820px; margin:0 auto; padding:10px 12px 38px}
  .top{display:flex; align-items:center; gap:8px; padding:4px 0 12px}
  .brand{flex:1; min-width:0; text-align:center}
  .brand h1{margin:0; font-family:var(--font-serif); font-weight:700; font-size:19px; letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .brand p{margin:1px 0 0; font-size:12px; color:var(--muted); letter-spacing:.6px}
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center; min-width:var(--tap); min-height:var(--tap);
    padding:0 12px; border-radius:14px; border:1px solid var(--line); background:var(--panel);
    color:var(--ink); font:inherit; font-size:14px; text-decoration:none; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.16); touch-action:manipulation; transition:transform .12s ease, background .2s ease;
  }
  .icon-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.16)}
  .icon-btn:focus-visible,button:focus-visible{outline:3px solid var(--sky); outline-offset:2px}

  .seats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:10px}
  .seat{
    position:relative; overflow:hidden; padding:9px 10px 8px; border-radius:15px; border:1px solid var(--line);
    background:linear-gradient(155deg, var(--panel), rgba(0,0,0,.08));
    box-shadow:0 6px 14px rgba(0,0,0,.12); min-width:0; transition:border-color .25s, box-shadow .25s, transform .25s;
  }
  .seat::after{content:""; position:absolute; inset:0; border-radius:15px; pointer-events:none; opacity:0; transition:opacity .25s; box-shadow:inset 0 0 0 2px var(--mint)}
  .seat.turn::after{opacity:1; animation:turnPulse 1.8s ease-in-out infinite}
  .seat.turn{transform:translateY(-1px)}
  .seat .who{display:flex; align-items:center; gap:6px; min-width:0}
  .avatar{width:24px; height:24px; flex:0 0 24px; border-radius:50%; display:grid; place-items:center; font-size:12px; color:#16232a; font-weight:900;
    background:radial-gradient(circle at 34% 28%, #fff8, transparent 38%), linear-gradient(150deg, var(--mint), #2f9b78)}
  .seat[data-tone="coral"] .avatar{background:radial-gradient(circle at 34% 28%, #fff8, transparent 38%), linear-gradient(150deg, var(--coral), #b63a2c)}
  .seat[data-tone="gold"] .avatar{background:radial-gradient(circle at 34% 28%, #fff8, transparent 38%), linear-gradient(150deg, var(--gold), #a9780b)}
  .seat[data-tone="violet"] .avatar{background:radial-gradient(circle at 34% 28%, #fff8, transparent 38%), linear-gradient(150deg, var(--violet), #6040a8)}
  .seat[data-tone="sky"] .avatar{background:radial-gradient(circle at 34% 28%, #fff8, transparent 38%), linear-gradient(150deg, var(--sky), #2b6e9f)}
  .seat .nm{font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .seat .me{font-size:12px; color:var(--mint); font-weight:800; margin-left:auto}
  .seat .meta{display:flex; justify-content:space-between; gap:4px; margin-top:3px; font-size:12px; color:var(--muted)}
  .seat .meta b{color:var(--ink); font-size:12px}
  .seat .score{font-size:20px; line-height:1.05; font-weight:900; letter-spacing:-.4px; margin-top:2px}
  .seat .score small{font-size:12px; color:var(--muted); font-weight:600; margin-left:2px}
  .mini-cards{display:flex; flex-wrap:wrap; gap:2px; margin-top:5px; min-height:16px}
  .mini{font-size:12px; line-height:18px; min-width:21px; text-align:center; padding:0 2px; border-radius:4px;
    background:var(--card-face); color:var(--card-ink); border:1px solid var(--card-edge); font-weight:800;
    animation:miniPop .28s ease both}

  .table{
    position:relative; border-radius:24px; padding:16px 12px 18px; border:1px solid var(--line);
    background:
      linear-gradient(160deg, rgba(18,58,54,.82), rgba(10,32,31,.92)),
      var(--art-felt) center/cover no-repeat;
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.1);
    overflow:hidden;
  }
  .table::before{content:""; position:absolute; inset:10px; border-radius:18px; border:1px dashed rgba(255,255,255,.16); pointer-events:none}
  .table-top{display:flex; align-items:center; justify-content:space-between; gap:8px; position:relative; z-index:1}
  .eyebrow{font-size:12px; letter-spacing:2px; color:rgba(255,255,255,.65); text-transform:uppercase}
  .deckcount{font-size:12px; color:rgba(255,255,255,.78); font-weight:700}
  .deck-wrap{display:inline-flex; align-items:center; gap:7px}
  .deck-stack{width:23px; height:31px; border-radius:4px; border:1px solid rgba(255,240,205,.5);
    background:var(--art-back) center/cover no-repeat; box-shadow:2px 3px 0 -1px rgba(0,0,0,.35), -2px 1px 0 -1px rgba(255,255,255,.18)}
  .stage{position:relative; display:flex; flex-direction:column; align-items:center; padding:8px 0 2px; z-index:1}
  .card-slot{position:relative; width:150px; height:206px; perspective:900px; margin:6px auto 0}
  .numcard{
    position:absolute; inset:0; border-radius:16px; color:var(--card-ink);
    background:
      radial-gradient(circle at 24% 18%, rgba(255,255,255,.9), transparent 38%),
      linear-gradient(152deg, rgba(255,253,246,.88), rgba(255,246,232,.86) 55%, rgba(239,223,199,.9)),
      var(--art-paper) center/cover no-repeat;
    border:1px solid var(--card-edge);
    box-shadow:0 20px 32px rgba(0,0,0,.34), inset 0 0 0 5px rgba(255,255,255,.66), inset 0 0 0 6px rgba(126,92,54,.2);
    display:flex; align-items:center; justify-content:center;
    transform-origin:50% 60%; animation:dealIn .5s cubic-bezier(.2,.9,.25,1.2) both;
  }
  .numcard::before{content:""; position:absolute; inset:12px; border-radius:9px; border:1px solid rgba(126,92,54,.24); pointer-events:none}
  .numcard .big{font-size:82px; line-height:1; font-weight:900; letter-spacing:-5px; text-shadow:0 1px 0 #fff, 0 3px 0 rgba(126,92,54,.16)}
  .corner{position:absolute; font-size:16px; font-weight:900; line-height:1}
  .corner.tl{top:12px; left:13px}
  .corner.br{bottom:12px; right:13px; transform:rotate(180deg)}
  .corner i{display:block; font-style:normal; font-size:12px; color:var(--coral2); margin-top:2px}
  .corner.br i{margin:2px 0 0}
  .card-emblem{position:absolute; top:12px; right:13px; width:18px; height:18px; opacity:.55}
  .card-slot.empty{display:grid; place-items:center; border:1px dashed rgba(255,255,255,.28); border-radius:16px; color:rgba(255,255,255,.62); font-size:13px}
  .chips-on-card{
    position:absolute; left:50%; bottom:-13px; transform:translateX(-50%); display:flex; flex-wrap:wrap; justify-content:center;
    width:146px; gap:2px; z-index:3; pointer-events:none;
  }
  .chip{
    width:30px; height:30px; border-radius:50%;
    background:radial-gradient(circle at 36% 27%, rgba(255,255,255,.55) 0 8%, transparent 26%), var(--art-chip) center/cover no-repeat;
    border:1px solid rgba(255,226,160,.7); box-shadow:0 4px 7px rgba(0,0,0,.34), inset 0 -2px 0 rgba(120,76,0,.34), inset 0 2px 0 rgba(255,255,255,.6);
    animation:chipLand .32s cubic-bezier(.2,1.4,.5,1) both;
  }
  .chip:nth-child(3n+2){background-image:radial-gradient(circle at 36% 27%, rgba(255,255,255,.5) 0 8%, transparent 26%), var(--art-brass)}
  .chip:nth-child(odd){transform:rotate(8deg)}
  .chip:nth-child(3n){transform:rotate(-7deg)}
  .chip-count{display:inline-flex; align-items:center; min-height:26px; margin-top:12px; padding:2px 11px; border-radius:999px;
    background:rgba(0,0,0,.26); border:1px solid rgba(255,255,255,.2); color:#fff3cb; font-size:12px; font-weight:800; letter-spacing:.3px}
  .table-note{min-height:23px; margin-top:8px; text-align:center; font-size:13px; color:rgba(255,255,255,.82); font-weight:700; position:relative; z-index:1}
  .table-note b{color:var(--gold)}
  .turn-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--mint); margin-right:6px; box-shadow:0 0 0 4px rgba(88,214,168,.18); animation:turnPulse 1.8s ease-in-out infinite}
  .turn-dot.wait{background:var(--gold); box-shadow:0 0 0 4px rgba(255,211,110,.16)}

  .actions{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px}
  button.act{
    min-height:56px; border-radius:15px; border:1px solid transparent; font:inherit; font-weight:900; font-size:15px;
    cursor:pointer; touch-action:manipulation; transition:transform .12s, filter .2s, opacity .2s;
    display:flex; align-items:center; justify-content:center; gap:7px; padding:8px 10px;
  }
  button.act:active{transform:translateY(2px) scale(.995)}
  button.act:focus-visible{outline:3px solid var(--sky); outline-offset:2px}
  button.take{background:linear-gradient(160deg, var(--coral), var(--coral2)); color:#2a0d08; box-shadow:0 5px 0 #8f2a1e}
  button.pass{background:linear-gradient(160deg, var(--mint), #2fa77c); color:#062019; box-shadow:0 5px 0 #1a7053}
  button.act:disabled{opacity:.38; cursor:default; box-shadow:none; filter:grayscale(.4)}
  button.ghost{background:var(--panel); border-color:var(--line); color:var(--ink); box-shadow:0 5px 0 rgba(0,0,0,.2)}
  .hint{grid-column:1/-1; text-align:center; font-size:12px; color:var(--muted); min-height:18px}

  .log{margin-top:12px; border:1px solid var(--line); border-radius:15px; background:var(--panel); padding:9px 12px; min-height:48px}
  .log h2{margin:0 0 5px; font-size:12px; letter-spacing:1.6px; color:var(--muted); font-weight:800; text-transform:uppercase}
  .log ul{list-style:none; margin:0; padding:0; display:grid; gap:2px}
  .log li{font-size:12px; color:var(--muted); border-bottom:1px dashed rgba(128,150,160,.18); padding:2px 0}
  .log li:last-child{color:var(--ink)}
  .log li::before{content:"›"; color:var(--mint); margin-right:6px; font-weight:900}

  .finale{position:absolute; inset:0; z-index:5; display:none; align-items:center; justify-content:center; padding:18px;
    background:radial-gradient(circle at 50% 35%, rgba(12,28,26,.72), rgba(8,16,16,.93)); backdrop-filter:blur(3px)}
  .finale.show{display:flex; animation:fadeIn .3s ease both}
  .finale-card{width:100%; max-width:330px; border-radius:22px; padding:20px 18px; text-align:center;
    background:linear-gradient(165deg, var(--panel-solid), var(--panel)); border:1px solid var(--line); box-shadow:var(--shadow);
    animation:riseIn .45s cubic-bezier(.2,.9,.2,1.1) both}
  .finale-card .crown{font-size:34px; line-height:1}
  .finale-card h2{margin:6px 0 2px; font-size:23px}
  .finale-card p{margin:2px 0 12px; color:var(--muted); font-size:13px}
  .finale-table{display:grid; gap:6px; margin:0 0 14px}
  .finale-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 10px; border-radius:10px; background:rgba(0,0,0,.12); font-size:13px}
  .finale-row.win{background:rgba(88,214,168,.16); border:1px solid rgba(88,214,168,.4); font-weight:800}
  .finale-row .pts{font-weight:900; color:var(--gold)}
  .confetti{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  .confetti i{position:absolute; top:-12px; width:7px; height:11px; border-radius:2px; opacity:.9; animation:fall 2.6s linear infinite}
  .confetti i:nth-child(1){left:8%; background:var(--coral); animation-delay:.1s}
  .confetti i:nth-child(2){left:20%; background:var(--gold); animation-delay:.7s}
  .confetti i:nth-child(3){left:33%; background:var(--mint); animation-delay:.35s}
  .confetti i:nth-child(4){left:47%; background:var(--violet); animation-delay:1.1s}
  .confetti i:nth-child(5){left:61%; background:var(--sky); animation-delay:.55s}
  .confetti i:nth-child(6){left:74%; background:var(--coral); animation-delay:1.35s}
  .confetti i:nth-child(7){left:86%; background:var(--gold); animation-delay:.25s}
  .confetti i:nth-child(8){left:94%; background:var(--mint); animation-delay:.9s}
  .foot{text-align:center; margin-top:16px; font-size:12px; color:var(--muted)}
  .foot a{display:inline-flex; align-items:center; min-height:44px; margin:0 8px; text-decoration:none; color:var(--muted)}
  .foot a:hover{color:var(--gold)}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}

  @keyframes dealIn{0%{transform:translateY(-26px) rotate(-5deg) scale(.9); opacity:0}70%{opacity:1}100%{transform:none; opacity:1}}
  @keyframes chipLand{0%{transform:translateY(-24px) scale(.7); opacity:0}70%{transform:translateY(2px) scale(1.06)}100%{opacity:1}}
  @keyframes miniPop{from{transform:scale(.6); opacity:0}to{transform:none; opacity:1}}
  @keyframes turnPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes riseIn{from{transform:translateY(16px) scale(.97); opacity:0}to{transform:none; opacity:1}}
  @keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(560px) rotate(520deg)}}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}}
  @media (max-width:430px){
    .wrap{padding:8px 9px 30px}
    .brand h1{font-size:17px}
    .seats{gap:6px}
    .seat{padding:8px 7px}
    .seat .score{font-size:18px}
    .card-slot{width:132px; height:182px}
    .numcard .big{font-size:72px}
    .actions{gap:7px}
    button.act{font-size:14px; min-height:54px}
    .table{padding:13px 9px 15px}
  }
/* safe-area: keep the original bottom padding, clear the iOS home indicator */
body{padding-bottom:env(safe-area-inset-bottom)}
</style>

<body>
<div class="wrap">
  <header class="top">
    <a class="icon-btn" href="../index.html" aria-label="返回桌游目录">← 目录</a>
    <div class="brand">
      <h1>No Thanks! 不谢</h1>
      <p>一枚筹码，换一次说不的机会</p>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深色或浅色主题">◐</button>
    <button class="icon-btn" id="muteBtn" type="button" aria-label="静音或开启音效" aria-pressed="false">♪</button>
  </header>

  <main>
    <section class="seats" id="seats" aria-label="玩家状态"></section>

    <section class="table" aria-label="牌桌">
      <div class="table-top">
        <span class="eyebrow">No Thanks · 低分者胜</span>
        <span class="deck-wrap"><span class="deck-stack" aria-hidden="true"></span><span class="deckcount" id="deckCount">牌堆 23</span></span>
      </div>
      <div class="stage">
        <div id="cardSlot" class="card-slot" aria-live="polite"></div>
        <div class="chip-count" id="chipCount">牌上筹码 · 0</div>
      </div>
      <div class="table-note" id="tableNote"></div>
      <div class="actions">
        <button class="act take" id="takeBtn" type="button">收下这张牌</button>
        <button class="act pass" id="passBtn" type="button">付 1 筹码跳过</button>
        <div class="hint" id="hint">轮到你时，收牌会连同牌上所有筹码一起拿走。</div>
      </div>
      <div class="finale" id="finale" role="dialog" aria-modal="true" aria-labelledby="finaleTitle">
        <div class="confetti" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="finale-card">
          <div class="crown" aria-hidden="true">♛</div>
          <h2 id="finaleTitle">结算</h2>
          <p id="finaleSub"></p>
          <div class="finale-table" id="finaleTable"></div>
          <button class="act ghost" id="restartBtn" type="button" style="width:100%;min-height:52px">再来一局</button>
        </div>
      </div>
    </section>

    <section class="log" aria-label="对局记录">
      <h2>对局记录</h2>
      <ul id="logList"></ul>
    </section>
  </main>

  <footer class="foot">
    <a href="rules.html">完整规则</a>
    <a href="online.html">联机对战</a>
    <a href="../index.html">更多毛线桌游</a>
  </footer>
</div>

<script src="../../shared/shuffle.js"></script>
<script src="../../shared/sfx.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.NoThanksPremiumEngine;
  var D = window.NoThanksPremiumData;
  var game = null;
  var busy = false;
  var lastEvent = null;
  var fast = /(?:\?|&)fast=1/.test(location.search);

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function safeSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

  // ---- Theme -------------------------------------------------------------
  var theme = safeGet('ntp-theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
  function effectiveLight() {
    var attr = document.documentElement.getAttribute('data-theme');
    if (attr === 'light') return true;
    if (attr === 'dark') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  }
  function updateThemeLabel() {
    $('themeBtn').setAttribute('aria-label', effectiveLight() ? '切换到深色主题' : '切换到浅色主题');
  }
  updateThemeLabel();

  // ---- Audio (shared synthesizer, no per-game oscillator copy) ----------
  var Sfx = window.Sfx;
  var muted = safeGet('ntp-muted') === '1';
  if (Sfx && muted) Sfx.mute(true);
  $('muteBtn').setAttribute('aria-pressed', muted ? 'true' : 'false');
  $('muteBtn').textContent = muted ? '×' : '♪';
  function sfx(name) {
    if (muted || !Sfx) return;
    Sfx.play(name);
  }
  $('muteBtn').addEventListener('click', function () {
    muted = !muted;
    safeSet('ntp-muted', muted ? '1' : '0');
    if (Sfx) Sfx.mute(muted);
    $('muteBtn').setAttribute('aria-pressed', muted ? 'true' : 'false');
    $('muteBtn').textContent = muted ? '×' : '♪';
    if (!muted) sfx('click');
  });
  $('themeBtn').addEventListener('click', function () {
    var next = effectiveLight() ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    safeSet('ntp-theme', next);
    updateThemeLabel();
    sfx('deal');
  });

  // ---- Game --------------------------------------------------------------
  function start() {
    game = E.createGame({ seed: (Date.now() % 1000000) + 17, players: 3, names: D.aiNames });
    busy = false; lastEvent = null;
    $('finale').classList.remove('show');
    render();
    pump();
  }

  function render() {
    if (!game) return;
    var view = E.publicView(game, 0);
    var seats = $('seats');
    seats.innerHTML = '';
    view.players.forEach(function (p, i) {
      var seat = el('div', 'seat' + (view.turn === i && view.phase === 'playing' ? ' turn' : ''));
      seat.setAttribute('data-tone', D.seats[i].tone);
      var who = el('div', 'who');
      who.appendChild(el('span', 'avatar', D.seats[i].avatar));
      who.appendChild(el('span', 'nm', p.name + (i === 0 ? ' · 你' : '')));
      seat.appendChild(who);
      var meta = el('div', 'meta');
      meta.appendChild(el('span', null, '筹码 '));
      var b1 = el('b', null, String(p.chips)); meta.appendChild(b1);
      meta.appendChild(el('span', null, p.count + ' 张'));
      seat.appendChild(meta);
      var score = el('div', 'score', String(p.score));
      score.appendChild(el('small', null, '分'));
      seat.appendChild(score);
      var cards = el('div', 'mini-cards');
      p.cards.forEach(function (c) { cards.appendChild(el('span', 'mini', String(c))); });
      seat.appendChild(cards);
      seats.appendChild(seat);
    });

    $('deckCount').textContent = '牌堆 ' + view.deckCount + ' · 已打 ' + view.turnCount + ' 手';
    renderStage(view);
    renderActions(view);
    var logList = $('logList');
    logList.innerHTML = '';
    view.log.slice(-7).forEach(function (line) { logList.appendChild(el('li', null, line)); });
    if (view.phase === 'over') renderFinale(view);
  }

  function renderStage(view) {
    var slot = $('cardSlot');
    slot.innerHTML = '';
    if (view.phase === 'over' || view.current == null) {
      slot.className = 'card-slot empty';
      slot.appendChild(el('span', null, '牌堆已空 · 对局结束'));
      $('chipCount').textContent = '牌上筹码 · 0';
      $('tableNote').innerHTML = '所有 24 张牌都已名花有主。';
      return;
    }
    slot.className = 'card-slot';
    var card = el('div', 'numcard');
    var tl = el('span', 'corner tl');
    tl.appendChild(document.createTextNode(String(view.current)));
    tl.appendChild(el('i', null, 'NO'));
    card.appendChild(tl);
    var br = el('span', 'corner br');
    br.appendChild(document.createTextNode(String(view.current)));
    br.appendChild(el('i', null, 'NO'));
    card.appendChild(br);
    card.appendChild(el('span', 'big', String(view.current)));
    card.appendChild(emblemSvg());
    slot.appendChild(card);

    if (view.chipsOnCard > 0) {
      var stack = el('div', 'chips-on-card');
      for (var k = 0; k < Math.min(view.chipsOnCard, 14); k++) {
        var chip = el('span', 'chip');
        chip.style.animationDelay = (k * 30) + 'ms';
        stack.appendChild(chip);
      }
      slot.appendChild(stack);
    }
    $('chipCount').textContent = '牌上筹码 · ' + view.chipsOnCard;
    var current = view.players[view.turn];
    $('tableNote').innerHTML = '';
    var dot = el('span', 'turn-dot' + (view.turn === 0 ? '' : ' wait'));
    $('tableNote').appendChild(dot);
    $('tableNote').appendChild(document.createTextNode(
      view.turn === 0 ? '轮到你：收下 ' + view.current + '，或付筹码跳过' :
        current.name + ' 正在考虑是否收下 ' + view.current + '…'
    ));
  }

  function emblemSvg() {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('class', 'card-emblem');
    svg.setAttribute('aria-hidden', 'true');
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M12 1.6l2.6 6.9 7.4.5-5.7 4.7 1.9 7.1L12 16.7l-6.2 4.1 1.9-7.1L2 9l7.4-.5z');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#b3543f');
    path.setAttribute('stroke-width', '1.3');
    svg.appendChild(path);
    return svg;
  }

  function renderActions(view) {
    var take = $('takeBtn');
    var pass = $('passBtn');
    var me = view.players[0];
    var myTurn = view.phase === 'playing' && view.turn === 0;
    take.disabled = !myTurn;
    pass.disabled = !myTurn || me.chips <= 0;
    take.textContent = myTurn ? '收下 ' + view.current + '（+' + view.chipsOnCard + ' 筹码）' : '收下这张牌';
    pass.textContent = myTurn ? '付 1 筹码跳过（余 ' + me.chips + '）' : '付 1 筹码跳过';
    if (view.phase === 'over') {
      $('hint').textContent = '对局结束，低分者胜。筹码会从牌分中扣除。';
    } else if (!myTurn) {
      $('hint').textContent = '等待 ' + view.players[view.turn].name + ' 行动…';
    } else if (me.chips <= 0) {
      $('hint').textContent = '你已没有筹码，必须收下这张牌。';
    } else {
      $('hint').textContent = '跳过可把麻烦推给下家，但每个筹码终局值 1 分。';
    }
  }

  function renderFinale(view) {
    var box = $('finale');
    var winners = view.winnerIds || [view.winner];
    var names = winners.map(function (i) { return view.players[i].name; }).join('、');
    var mine = winners.indexOf(0) >= 0;
    $('finaleTitle').textContent = mine ? '你赢了！' : names + ' 获胜';
    $('finaleSub').textContent = '最低分获胜 · 牌分减去剩余筹码';
    var table = $('finaleTable');
    table.innerHTML = '';
    var order = view.players.map(function (p, i) { return i; }).sort(function (a, b) {
      return view.players[a].score - view.players[b].score;
    });
    order.forEach(function (i) {
      var p = view.players[i];
      var row = el('div', 'finale-row' + (winners.indexOf(i) >= 0 ? ' win' : ''));
      row.appendChild(el('span', null, p.name + (i === 0 ? '（你）' : '')));
      row.appendChild(el('span', 'pts', p.score + ' 分'));
      table.appendChild(row);
    });
    if (!box.classList.contains('show')) {
      box.classList.add('show');
      sfx(mine ? 'win' : 'deal');
    }
  }

  function act(fn) {
    if (busy || !game || game.phase === 'over') return;
    try {
      fn();
    } catch (e) {
      $('hint').textContent = '这一步不能这样做。';
      return;
    }
    afterAction();
  }

  function consumeEvent() {
    if (!game || !game.events.length) return;
    var ev = game.events[game.events.length - 1];
    if (ev === lastEvent) return;
    lastEvent = ev;
    if (ev.type === 'take') sfx('capture');
    else if (ev.type === 'pass') { sfx('move'); setTimeout(function () { sfx('click'); }, 90); }
    else if (ev.type === 'reveal') sfx('deal');
    else if (ev.type === 'over') sfx('win');
  }

  function afterAction() {
    consumeEvent();
    render();
    pump();
  }

  function pump() {
    if (!game || game.phase === 'over') return;
    if (game.turn === 0 && game.players[0].human) return;
    busy = true;
    var delay = fast ? 8 : 420;
    setTimeout(function () {
      if (!game || game.phase === 'over') { busy = false; return; }
      if (game.turn === 0 && game.players[0].human) { busy = false; render(); return; }
      try { E.aiAct(game, game.turn); } catch (e) { busy = false; return; }
      consumeEvent();
      render();
      busy = false;
      pump();
    }, delay);
  }

  $('takeBtn').addEventListener('click', function () { act(function () { E.take(game, 0); }); });
  $('passBtn').addEventListener('click', function () { act(function () { E.pass(game, 0); }); });
  $('restartBtn').addEventListener('click', start);

  document.addEventListener('keydown', function (e) {
    if (!game || game.turn !== 0 || game.phase !== 'playing') return;
    if (e.key === 't' || e.key === 'T' || e.key === 'Enter') { e.preventDefault(); $('takeBtn').click(); }
    else if ((e.key === 'p' || e.key === 'P') && !$('passBtn').disabled) { e.preventDefault(); $('passBtn').click(); }
  });

  // Test hook: only public information, no deck order or hidden cards.
  window.__premium = {
    state: function () { return game ? E.publicView(game, 0) : null; },
    over: function () { return !!game && game.phase === 'over'; },
    start: start,
    fast: fast
  };

  start();

})();
</script>
</body>
</html>
