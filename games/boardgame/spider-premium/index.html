<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>蜘蛛纸牌 · Spider Solitaire 精品版</title>
<meta name="description" content="蜘蛛纸牌 Spider Solitaire 精品版：104 张双副牌、10 列、5 次发牌，一色/二色/四色难度，同花连续段移动、K→A 自动收组、提示与撤销，手机离线可玩。">
<meta name="theme-color" content="#04120f">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="蜘蛛纸牌 · Spider Solitaire 精品版">
<meta property="og:description" content="深青绒布与金绿牌背中的双副牌蜘蛛纸牌：10 列、5 次发牌、8 组 K→A 通关。">
<meta property="og:image" content="assets/og.webp">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hhfa008.github.io/games/boardgame/spider-premium/">
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/spider-premium/">
<link rel="icon" href="assets/cover.webp">
<style>
:root{
  --bg:#04100d; --bg2:#071a15; --panel:#0b201a; --panel2:#123029; --panel3:#1a4036;
  --felt-line:rgba(214,183,106,.24); --gold:#c9a35f; --gold2:#efd399; --gold-dark:#8a6829;
  --ink:#eee6d2; --ink-dim:#aec1b4; --ink-faint:#7f978a;
  --card-paper:#f4eedb; --card-paper2:#ded3b6; --card-ink:#221f17;
  --red:#b4483d; --green:#3f7d63;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --display:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --felt:url("../../assets/art/premium/spider/felt.webp");
  --back:url("../../assets/art/premium/spider/card-back.webp");
  --card-r:6px;
  --fan:clamp(20px,5.6vw,26px);
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;overflow-x:hidden;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  background:
    radial-gradient(900px 620px at 50% -12%,rgba(201,163,95,.18),transparent 62%),
    radial-gradient(820px 720px at 104% 22%,rgba(36,104,84,.22),transparent 66%),
    linear-gradient(180deg,rgba(4,16,13,.90),rgba(4,16,13,.97)),
    var(--felt) center/cover fixed no-repeat;
}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55) 100%)}
button,a,select{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
svg{display:block}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.app{position:relative;z-index:1;width:100%;max-width:1180px;margin:0 auto;padding:calc(9px + var(--safe-top)) 10px calc(14px + var(--safe-bottom))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.05em}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;margin-bottom:7px}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 auto}
.title-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.spider-mark{width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:1px solid rgba(201,163,95,.55);
  background:radial-gradient(circle at 34% 28%,rgba(239,211,153,.28),rgba(7,26,21,.6) 70%);
  box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 0 0 3px rgba(201,163,95,.10);display:grid;place-items:center;color:var(--gold2)}
.spider-mark svg{width:26px;height:26px}
.brand h1{font-size:clamp(22px,5.6vw,34px);line-height:1.02;color:#f6ecd4;text-shadow:0 3px 18px rgba(0,0,0,.6);white-space:nowrap}
.brand h1 span{color:var(--gold2)}
.brand p{margin:2px 0 0;font-size:12px;letter-spacing:.06em;color:var(--ink-dim)}
.top-actions{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.badge-single{display:inline-flex;align-items:center;justify-content:center;min-height:26px;padding:0 8px;border-radius:999px;
  border:1px solid rgba(239,211,153,.58);background:rgba(201,163,95,.14);color:var(--gold2);font-size:12px;letter-spacing:.08em;white-space:nowrap}
.icon-btn,.plain-link{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid rgba(201,163,95,.32);border-radius:11px;background:rgba(15,38,32,.72);font-size:13px;color:var(--ink);
  padding:0 9px;text-decoration:none;letter-spacing:.05em}
.icon-btn:hover,.plain-link:hover{background:rgba(28,61,51,.9);border-color:rgba(201,163,95,.62)}
.icon-btn[aria-pressed="false"]{opacity:.62}
.modebar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:6px 9px;
  border:1px solid rgba(201,163,95,.2);border-radius:11px;background:linear-gradient(90deg,rgba(19,48,40,.86),rgba(8,26,21,.7));
  font-size:12px;color:var(--ink-dim)}
.modebar b{color:var(--gold2);font-weight:600}
.status-chip{border:1px solid rgba(201,163,95,.32);border-radius:999px;padding:3px 9px;color:var(--ink);background:rgba(4,16,13,.52);font-size:12px;white-space:nowrap}
main{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.hud{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.hud-cell{border:1px solid rgba(201,163,95,.22);border-radius:11px;padding:5px 7px;min-width:0;
  background:linear-gradient(140deg,rgba(20,49,41,.92),rgba(7,23,19,.94));box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.hud-label{display:block;font-size:12px;line-height:1.1;color:var(--ink-faint);letter-spacing:.08em;white-space:nowrap}
.hud-cell b{display:block;font-size:18px;line-height:1.15;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-cell.runs b{font-size:16px}
.board-wrap{border:1px solid rgba(201,163,95,.25);border-radius:13px;padding:7px 6px 9px;
  background:linear-gradient(180deg,rgba(14,39,32,.9),rgba(4,16,13,.94));box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 14px 30px rgba(0,0,0,.26)}
.board-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 6px;font-size:12px;letter-spacing:.11em;color:var(--ink-dim);min-height:26px}
.board-head b{color:var(--gold2);font-weight:600;letter-spacing:.06em}
.stock-tray{display:inline-flex;align-items:center;gap:6px;padding:3px 6px;border-radius:9px;border:1px solid rgba(201,163,95,.26);
  background:rgba(4,16,13,.5);cursor:pointer;min-height:30px}
.stock-tray .mini-stack{display:flex;align-items:center}
.stock-back{width:13px;height:18px;border-radius:2px;border:1px solid rgba(201,163,95,.45);margin-left:-6px;
  background:linear-gradient(rgba(3,18,14,.18),rgba(3,18,14,.18)),var(--back) center/cover no-repeat;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.stock-back:first-child{margin-left:0}
.stock-tray b{font-size:13px;color:var(--gold2);font-variant-numeric:tabular-nums}
.stock-tray em{font-style:normal;font-size:12px;color:var(--ink-dim)}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;align-items:stretch}
.col{position:relative;min-width:0;min-height:132px;border-radius:5px;padding:0 0 5px;display:flex;flex-direction:column;align-items:stretch;
  background:rgba(3,14,11,.24);border:1px solid rgba(255,255,255,.035);cursor:pointer}
.col.empty{border-style:dashed;border-color:rgba(201,163,95,.28)}
.col.empty::after{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:44%;height:60%;
  border:1px dashed rgba(201,163,95,.22);border-radius:4px;pointer-events:none}
.col.hint-dst{border-color:rgba(239,211,153,.85);box-shadow:0 0 0 1px rgba(239,211,153,.35),0 0 18px rgba(201,163,95,.2)}
.card{position:relative;width:100%;aspect-ratio:5/7;border-radius:var(--card-r);border:1px solid rgba(86,68,36,.55);overflow:hidden;
  background:linear-gradient(145deg,var(--card-paper),var(--card-paper2));color:var(--card-ink);
  box-shadow:0 2px 5px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.55);flex:0 0 auto;
  container-type:inline-size}
.card + .card{margin-top:calc(var(--fan) - 140%)}
.card.face{cursor:pointer}
.card.back{background:linear-gradient(rgba(4,17,13,.2),rgba(4,17,13,.2)),var(--back) center/cover no-repeat;border-color:rgba(201,163,95,.4)}
.card.red{color:var(--red)}
.card.sel{box-shadow:0 0 0 2px var(--gold2),0 8px 16px rgba(0,0,0,.45)}
.card.hint-src{box-shadow:0 0 0 2px rgba(143,214,178,.95),0 8px 16px rgba(0,0,0,.4)}
.card .corner{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.92;z-index:2}
.card .corner b{font-family:var(--display);font-weight:700;font-size:clamp(13px,32cqw,15px);letter-spacing:-.02em}
.card .corner svg{width:clamp(9px,20cqw,11px);height:auto;margin-top:1px}
.card .corner.tl{left:5%;top:4%}
.card .corner.br{right:5%;bottom:4%;transform:rotate(180deg);display:none}
.card .face-center{position:absolute;inset:13% 8% 11%;display:grid;place-items:center;pointer-events:none}
.card .mini-suit{display:none}
.card .mini-suit svg{width:11px;height:11px}
.card .ace-suit svg{width:52%;height:52%;margin:0 auto}
.card .court{position:relative;display:grid;place-items:center;width:100%;height:100%;border:1px solid rgba(138,104,41,.34);border-radius:3px;
  background:linear-gradient(135deg,rgba(201,163,95,.18),transparent 40%,rgba(138,104,41,.12))}
.card .court::before,.card .court::after{content:"";position:absolute;inset:20%;border:1px solid rgba(138,104,41,.34);border-radius:50%}
.card .court::after{inset:30%;transform:rotate(45deg);border-radius:2px}
.card .court b{position:relative;z-index:1;font-family:var(--display);font-weight:700;font-size:clamp(13px,40cqw,18px);line-height:1}
.card .court .court-suit{display:none;position:absolute;inset:0;place-items:center;z-index:1}
.card .court .court-suit svg{width:42%;height:42%}
.card .pips{position:absolute;inset:16% 11% 14%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,1fr);place-items:center}
.card .pips svg{width:100%;height:100%;max-width:13px;max-height:13px}
/* 窄牌统一牌面：只保留左上角标 + 一枚居中小花色，去掉外框和中心大字 */
@container (max-width:47.9px){
  .card .corner.br{display:none}
  .card .court{border:0;background:none}
  .card .court::before,.card .court::after{display:none}
  .card .court b{display:none}
  .card .court .court-suit{display:grid}
  .card .court .court-suit svg{width:52%;height:52%}
}
@container (min-width:48px){
  .card .corner.br{display:flex}
}
@media (max-width:760px){.card .pips{display:none}.card .mini-suit{display:block}}
@media (max-width:760px){
  .app{display:flex;flex-direction:column;min-height:100dvh}
  main{flex:1 1 0;min-height:0}
  .board-wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
  .board{flex:1 1 0;min-height:0}
}
@media (max-width:430px){
  .board{gap:1px}.board-wrap{padding:5px 4px 7px}
}
@media (min-width:761px){.card + .card{margin-top:-24px}}
.foundation-rail{display:flex;align-items:center;gap:4px;padding:5px 7px;border:1px solid rgba(239,211,153,.32);border-radius:10px;
  background:rgba(201,163,95,.08);min-height:40px;flex-wrap:wrap}
.foundation-rail .f-label{font-size:12px;color:var(--gold2);letter-spacing:.08em;margin-right:2px;white-space:nowrap;opacity:.9}
.f-slot{width:26px;height:28px;border-radius:4px;border:1px solid rgba(239,211,153,.5);display:grid;place-items:center;color:rgba(239,211,153,.72);background:rgba(201,163,95,.10);box-shadow:inset 0 0 8px rgba(0,0,0,.3)}
.f-slot svg{width:13px;height:13px}
.f-slot.done{border-style:solid;border-color:rgba(239,211,153,.72);background:linear-gradient(140deg,rgba(201,163,95,.24),rgba(12,34,27,.9));color:var(--gold2);box-shadow:0 0 12px rgba(201,163,95,.16)}
.f-slot.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:6px 7px;border:1px solid rgba(201,163,95,.22);border-radius:12px;background:linear-gradient(140deg,rgba(18,48,41,.9),rgba(7,23,19,.94))}
.tool-btn{min-width:44px;min-height:44px;border:1px solid rgba(201,163,95,.34);border-radius:10px;background:rgba(24,58,49,.78);
  color:var(--ink);font-size:13px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.tool-btn:hover:not(:disabled){background:rgba(38,78,65,.92);border-color:rgba(239,211,153,.6)}
.tool-btn:disabled{opacity:.42;cursor:default}
.tool-btn kbd{font-family:inherit;font-size:12px;color:var(--ink-faint);border:1px solid rgba(201,163,95,.28);border-radius:4px;padding:0 3px}
.deal-btn{background:linear-gradient(140deg,rgba(201,163,95,.28),rgba(30,62,50,.86));border-color:rgba(239,211,153,.55);color:#fff6dd}
.deal-btn.pulse{animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,211,153,.4)}50%{box-shadow:0 0 0 4px rgba(239,211,153,.06)}}
.diff-wrap{display:inline-flex;align-items:center;gap:5px;margin-left:auto;min-height:44px}
.diff-wrap label{font-size:12px;color:var(--ink-dim);white-space:nowrap}
.diff-wrap select{min-height:44px;min-width:44px;font-size:16px;color:var(--ink);background:rgba(8,26,21,.92);
  border:1px solid rgba(201,163,95,.36);border-radius:9px;padding:0 6px}
.log-panel{border:1px solid rgba(201,163,95,.16);border-radius:11px;background:rgba(4,16,13,.48);padding:6px 9px}
.log-panel h2{font-size:15px;color:#e9ddc3;margin-bottom:3px}
.log-list{list-style:none;margin:0;padding:0;max-height:74px;overflow:auto;font-size:12px;color:var(--ink-dim);line-height:1.5}
.log-list li{padding:1px 0;border-bottom:1px dashed rgba(201,163,95,.1)}
.log-list li:last-child{border-bottom:0}
.log-list .sys{color:var(--gold2)}
footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;padding:2px;font-size:12px;color:var(--ink-faint)}
footer b{color:var(--gold2);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(16px + var(--safe-bottom));transform:translate(-50%,16px);z-index:60;max-width:min(92vw,430px);
  border:1px solid rgba(201,163,95,.5);border-radius:11px;background:rgba(6,22,18,.97);color:var(--ink);padding:9px 13px;font-size:13px;
  box-shadow:0 14px 36px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(1,8,6,.78)}
.modal[hidden]{display:none!important}
.modal-card{width:min(430px,100%);border:1px solid rgba(201,163,95,.5);border-radius:16px;padding:16px;
  background:linear-gradient(160deg,rgba(25,58,49,.99),rgba(5,20,16,.99));box-shadow:0 28px 70px rgba(0,0,0,.65)}
.modal-card h2{font-size:25px;color:var(--gold2);margin-bottom:3px}
.modal-card p{font-size:13px;color:var(--ink-dim);margin:4px 0 9px}
.result-table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 11px}
.result-table th,.result-table td{padding:5px 4px;border-bottom:1px solid rgba(201,163,95,.17);text-align:right}
.result-table th:first-child,.result-table td:first-child{text-align:left}
.result-table th{color:var(--ink-dim);font-weight:500;font-size:12px}
.result-table td b{color:var(--gold2)}
.modal-actions{display:flex;gap:7px;flex-wrap:wrap}
.modal-actions .tool-btn{flex:1 1 120px;min-height:46px}
@media (min-width:761px){
  .app{padding-left:16px;padding-right:16px}
  .board{gap:5px}.col{padding-bottom:7px}.card + .card{margin-top:-19px}
  .card .corner b{font-size:17px}.card .corner svg{width:13px;height:13px}.card .court b{font-size:22px}
  .hud-cell{padding:7px 10px}.hud-cell b{font-size:22px}
  .tool-btn{padding:0 13px;font-size:14px}
}
@media (max-width:390px){
  .app{padding-left:6px;padding-right:6px}.brand h1{font-size:23px}.brand p{letter-spacing:.1em}
  .spider-mark{width:42px;height:42px;flex-basis:42px}.badge-single{padding:0 7px}
  .hud{gap:3px}.hud-cell{padding:4px 5px}.hud-cell b{font-size:16px}.hud-cell.runs b{font-size:14px}
  .board{gap:1px}.board-wrap{padding:5px 4px 7px}
  .tool-btn{padding:0 7px}.diff-wrap label{display:none}
  .f-slot{width:24px;height:26px}
}
@media (max-width:329px){
  .app{padding-left:4px;padding-right:4px}
  .brand h1{font-size:21px}.brand p{display:none}.top-actions{gap:2px}
  .icon-btn,.plain-link{padding:0 7px}
  .hud-cell b{font-size:15px}.hud-cell.runs b{font-size:13px}
  .tool-btn{padding:0 6px;font-size:12px}
  .diff-wrap select{width:104px;font-size:16px}
  .f-slot{width:22px;height:24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="spider-mark" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="currentColor"><path d="M50 6C50 6 18 30 18 52c0 14 11 25 25 25 4 0 8-1 11-3-1 12-5 19-13 25h18c-8-6-12-13-13-25 3 2 7 3 11 3 14 0 25-11 25-25C82 30 50 6 50 6z"/></svg>
      </span>
      <div>
        <div class="title-row">
          <h1>蜘蛛<span>纸牌</span></h1>
          <span class="badge-single">单人</span>
        </div>
        <p>SPIDER SOLITAIRE · PREMIUM</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="soundBtn" type="button" aria-label="切换音效" aria-pressed="true">音效</button>
      <a class="plain-link" href="rules.html" aria-label="查看完整规则">规则</a>
    </div>
  </header>

  <div class="modebar">
    <span><b>单人 · 单机</b> · 104 张 · 10 列 · 5 次发牌</span>
    <span class="status-chip" id="statusChip">准备发牌</span>
  </div>

  <main>
    <section class="hud" aria-label="对局信息">
      <div class="hud-cell"><span class="hud-label">分数</span><b id="scoreVal">500</b></div>
      <div class="hud-cell"><span class="hud-label">步数</span><b id="movesVal">0</b></div>
      <div class="hud-cell"><span class="hud-label">时间</span><b id="timeVal">00:00</b></div>
      <div class="hud-cell runs"><span class="hud-label">完成组</span><b id="runsVal">0/8</b></div>
      <div class="hud-cell"><span class="hud-label">难度</span><b id="diffVal">一色</b></div>
    </section>

    <section class="board-wrap" aria-label="牌桌">
      <div class="board-head">
        <span>牌桌 · <b id="boardHint">点击可移动牌，再点目标列</b></span>
        <span class="stock-tray" id="stockTray" data-act="stock" tabindex="0" aria-label="牌堆，点击发牌">
          <span class="mini-stack" id="stockStack" aria-hidden="true"></span>
          <b id="stockVal">50</b><em>张</em>
        </span>
      </div>
      <div class="board" id="board"></div>
    </section>

    <section class="foundation-rail" id="foundationRail" aria-label="已完成组">
      <span class="f-label">K→A 完成组</span>
      <span id="foundationSlots" style="display:contents"></span>
    </section>

    <section class="toolbar" aria-label="操作">
      <button class="tool-btn" id="newBtn" type="button">新局 <kbd>N</kbd></button>
      <button class="tool-btn" id="undoBtn" type="button">撤销 <kbd>U</kbd></button>
      <button class="tool-btn" id="hintBtn" type="button">提示 <kbd>H</kbd></button>
      <button class="tool-btn deal-btn" id="dealBtn" type="button">发牌 <kbd>D</kbd></button>
      <span class="diff-wrap">
        <label for="difficulty">难度</label>
        <select id="difficulty" aria-label="选择难度">
          <option value="1">一色 · 简单</option>
          <option value="2">二色 · 普通</option>
          <option value="4">四色 · 困难</option>
        </select>
      </span>
    </section>

    <section class="log-panel" aria-label="对局记录">
      <h2>对局记录</h2>
      <ol class="log-list" id="logList"></ol>
    </section>
  </main>

  <footer>
    <span>同花段移动 · K→A 自动收组</span>
    <span id="footerInfo">种子 20261110 · 一色</span>
    <span>本机最佳 <b id="bestVal">—</b></span>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal" id="resultModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <h2 id="resultTitle">对局结束</h2>
    <p id="resultNote">查看本局统计。</p>
    <table class="result-table">
      <thead><tr><th>项目</th><th>数值</th></tr></thead>
      <tbody id="resultBody"></tbody>
    </table>
    <div class="modal-actions">
      <button class="tool-btn" id="againBtn" type="button">再来一局</button>
      <button class="tool-btn" id="closeBtn" type="button">查看牌桌</button>
    </div>
  </div>
</div>

<script src="../../shared/shuffle.js"></script>
<script src="../../shared/sfx.js"></script>
<script src="../../shared/store.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  'use strict';
  var E = window.SpiderEngine;
  var $ = function(id){ return document.getElementById(id); };
  var clone = function(v){ return JSON.parse(JSON.stringify(v)); };
  var SUIT_NAMES = { spades: '黑桃', hearts: '红心', diamonds: '方块', clubs: '梅花' };
  var SUIT_SYMBOL = { spades: '♠', hearts: '♥', diamonds: '♦', clubs: '♣' };
  var SUIT_PATH = {
    spades: 'M50 6C50 6 18 30 18 52c0 14 11 25 25 25 4 0 8-1 11-3-1 12-5 19-13 25h18c-8-6-12-13-13-25 3 2 7 3 11 3 14 0 25-11 25-25C82 30 50 6 50 6z',
    hearts: 'M50 90C24 70 10 55 10 36 10 22 20 12 33 12c8 0 14 4 17 10 3-6 9-10 17-10 13 0 23 10 23 24 0 19-14 34-40 54z',
    diamonds: 'M50 4 92 50 50 96 8 50z',
    clubs: 'M50 8c-9 0-16 7-16 16 0 4 1 7 4 10-3-1-6-2-9-2C18 32 9 41 9 53s9 21 20 21c6 0 12-3 16-7-1 9-5 15-11 21h32c-6-6-10-12-11-21 4 4 10 7 16 7 11 0 20-9 20-21s-9-21-20-21c-3 0-6 1-9 2 3-3 4-6 4-10 0-9-7-16-16-16z'
  };
  var PIP_LAYOUT = {
    2: [[1,2],[5,2]],
    3: [[1,2],[3,2],[5,2]],
    4: [[1,1],[1,3],[5,1],[5,3]],
    5: [[1,1],[1,3],[3,2],[5,1],[5,3]],
    6: [[1,1],[3,1],[5,1],[1,3],[3,3],[5,3]],
    7: [[1,2],[1,1],[3,1],[5,1],[1,3],[3,3],[5,3]],
    8: [[1,2],[1,1],[3,1],[5,1],[1,3],[3,3],[5,3],[5,2]],
    9: [[1,1],[2,1],[4,1],[5,1],[1,3],[2,3],[4,3],[5,3],[3,2]],
    10: [[1,1],[2,1],[4,1],[5,1],[1,3],[2,3],[4,3],[5,3],[1,2],[5,2]]
  };
  var BEST_KEY = 'spider-premium-best-score-v1';
  var STATS_KEY = 'spider-premium-stats-v1';
  var DIFF_KEY = 'spider-premium-difficulty-v1';
  var MAX_HISTORY = 200;

  var state = null;
  var history = [];
  var selected = null;
  var hintMove = null;
  var startTime = 0;
  var endElapsed = null;
  var toastTimer = null;
  var muted = false;
  var pendingPop = 0;
  var lastRuns = 0;

  function sound(name){
    try { if (window.Sfx && window.Sfx.play) window.Sfx.play(name || 'click', { volume: 0.4 }); } catch (err) {}
  }
  function unlockAudio(){
    try {
      if (!window.Sfx) return;
      if (window.Sfx.unlock) window.Sfx.unlock();
    } catch (err) {}
  }
  function toast(text){
    var el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }
  function reducedMotion(){
    try { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (err) { return false; }
  }

  function suitSvg(suit, extra){
    var info = E.suitInfo(suit);
    return '<svg class="' + (extra || '') + '" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path d="' + SUIT_PATH[suit] + '"/></svg>';
  }
  function pipHtml(rank, suit){
    var layout = PIP_LAYOUT[rank];
    if (!layout) return '';
    return '<span class="pips">' + layout.map(function(pos){
      return '<span style="grid-area:' + pos[0] + '/' + pos[1] + '">' + suitSvg(suit) + '</span>';
    }).join('') + '</span>';
  }
  function courtHtml(card){
    return '<span class="court"><b>' + E.rankLabel(card.rank) + '</b>' +
      '<span class="court-suit">' + suitSvg(card.suit) + '</span></span>' +
      '<span style="position:absolute;right:3px;top:3px;width:10px;height:10px">' + suitSvg(card.suit) + '</span>' +
      '<span style="position:absolute;left:3px;bottom:3px;width:10px;height:10px;transform:rotate(180deg)">' + suitSvg(card.suit) + '</span>';
  }
  function cardHtml(card, col, index){
    if (!card) return '';
    var base = 'data-col="' + col + '" data-index="' + index + '"';
    if (!card.faceUp) {
      return '<div class="card back" ' + base + ' aria-hidden="true"></div>';
    }
    var info = E.suitInfo(card.suit);
    var classes = 'card face' + (info.red ? ' red' : '') + ' ' + card.suit;
    var selectedHere = selected && selected.col === col && index >= selected.index;
    if (selectedHere) classes += ' sel';
    if (hintMove && hintMove.type === 'move' && hintMove.fromCol === col && hintMove.index === index) classes += ' hint-src';
    var label = E.cardLabel(card) + (selectedHere ? '，已选中' : '');
    var center;
    if (card.rank >= 11) center = courtHtml(card);
    else if (card.rank === 1) center = '<span class="ace-suit" style="display:block;width:100%;height:100%">' + suitSvg(card.suit) + '</span>';
    else center = pipHtml(card.rank, card.suit) + '<span class="mini-suit">' + suitSvg(card.suit) + '</span>';
    return '<div class="' + classes + '" ' + base + ' tabindex="0" aria-label="' + label + '">' +
      '<span class="corner tl"><b>' + E.rankLabel(card.rank) + '</b>' + suitSvg(card.suit) + '</span>' +
      '<span class="face-center">' + center + '</span>' +
      '<span class="corner br"><b>' + E.rankLabel(card.rank) + '</b>' + suitSvg(card.suit) + '</span>' +
      '</div>';
  }

  function renderBoard(){
    var html = '';
    for (var c = 0; c < state.columns.length; c++) {
      var column = state.columns[c];
      var hintDst = hintMove && hintMove.type === 'move' && hintMove.toCol === c ? ' hint-dst' : '';
      html += '<div class="col' + (column.length ? '' : ' empty') + hintDst + '" data-col="' + c + '" data-act="col" tabindex="0" aria-label="第 ' + (c + 1) + ' 列，' + column.length + ' 张牌">';
      for (var i = 0; i < column.length; i++) html += cardHtml(column[i], c, i);
      html += '</div>';
    }
    $('board').innerHTML = html;
  }

  function renderFoundations(){
    var html = '';
    var completed = state.foundations.length;
    for (var i = 0; i < 8; i++) {
      if (i < completed) {
        var suit = state.foundations[i].suit;
        html += '<span class="f-slot done' + (i === completed - 1 && pendingPop ? ' pop' : '') + '" title="第 ' + (i + 1) + ' 组 ' + SUIT_NAMES[suit] + ' K→A">' + suitSvg(suit) + '</span>';
      } else {
        html += '<span class="f-slot" title="第 ' + (i + 1) + ' 组未完成"></span>';
      }
    }
    $('foundationSlots').innerHTML = html;
    pendingPop = 0;
  }

  function renderStock(){
    var deals = Math.ceil(state.stock.length / 10);
    var html = '';
    for (var i = 0; i < Math.max(deals, 1); i++) html += '<span class="stock-back"></span>';
    $('stockStack').innerHTML = html;
    $('stockVal').textContent = String(state.stock.length);
    $('stockTray').setAttribute('aria-label', '牌堆剩 ' + state.stock.length + ' 张，' + deals + ' 次发牌，点击发牌');
  }

  function renderHud(){
    $('scoreVal').textContent = String(state.score);
    $('movesVal').textContent = String(state.moves);
    $('runsVal').textContent = state.foundations.length + '/8';
    var info = E.difficultyInfo(state.difficulty);
    $('diffVal').textContent = info.zh;
    $('statusChip').textContent = state.over ? (state.result && state.result.win ? '胜利' : '无棋可走') : '进行中';
    $('footerInfo').textContent = '种子 ' + state.seed + ' · ' + info.zh;
    $('bestVal').textContent = readBest();
    $('dealBtn').disabled = state.over || !E.canDeal(state);
    $('undoBtn').disabled = state.over ? history.length === 0 : history.length === 0;
    $('diffVal').textContent = info.zh;
  }

  function readBest(){
    try {
      if (!window.Store) return '—';
      var v = window.Store.get(BEST_KEY, null);
      return v == null ? '—' : String(v);
    } catch (err) { return '—'; }
  }

  function renderLog(){
    var items = state.log.slice(-8).reverse();
    $('logList').innerHTML = items.map(function(item){
      var cls = item.type === 'complete' || item.type === 'end' || item.type === 'start' || item.type === 'deal' ? 'sys' : '';
      return '<li class="' + cls + '">' + item.text + '</li>';
    }).join('');
  }

  function renderStatusLine(){
    if (state.over) return;
    if (hintMove) {
      $('boardHint').textContent = '建议：' + E.describeMove(state, hintMove);
    } else if (selected) {
      var card = state.columns[selected.col] && state.columns[selected.col][selected.index];
      $('boardHint').textContent = card ? ('已选 ' + E.cardLabel(card) + '，点击目标列') : '点击目标列';
    } else {
      $('boardHint').textContent = '点击可移动牌，再点目标列';
    }
  }

  /* 牌桌竖向铺满：所有列共用同一档步距（保同行对齐），最少 24px，最多整张牌 + 30px */
  function fitBoard(){
    var cols = document.querySelectorAll('#board .col');
    var mobile = window.matchMedia('(max-width:760px)').matches;
    if (!mobile) {
      for (var k = 0; k < cols.length; k++) cols[k].style.removeProperty('--fan');
      return;
    }
    var maxN = 0, cardH = 0;
    for (var i = 0; i < cols.length; i++) {
      var n = cols[i].children.length;
      if (n > maxN) { maxN = n; cardH = cols[i].children[0].getBoundingClientRect().height; }
    }
    if (maxN < 2) return;
    var colH = $('board').clientHeight - 7;
    var step = (colH - cardH) / (maxN - 1);
    step = Math.max(24, Math.min(cardH + 30, step));
    for (var j = 0; j < cols.length; j++) {
      if (cols[j].children.length < 2) cols[j].style.removeProperty('--fan');
      else cols[j].style.setProperty('--fan', step.toFixed(2) + 'px');
    }
  }

  function render(){
    if (!state) return;
    renderBoard();
    renderFoundations();
    renderStock();
    renderHud();
    renderLog();
    renderStatusLine();
    fitBoard();
  }

  function elapsedSeconds(){
    if (state && state.over && endElapsed != null) return endElapsed;
    return Math.max(0, Math.floor((Date.now() - startTime) / 1000));
  }
  function fmtTime(sec){
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function tick(){
    if (!state) return;
    $('timeVal').textContent = fmtTime(elapsedSeconds());
  }
  setInterval(tick, 500);

  function showResult(){
    var r = state.result;
    if (!r) return;
    endElapsed = elapsedSeconds();
    var win = !!r.win;
    $('resultTitle').textContent = win ? '八组完成，胜利！' : '无棋可走';
    $('resultNote').textContent = win
      ? '你集齐了 8 组同花 K→A。'
      : '没有合法动作，也没有可发的牌。可以撤销或开新局。';
    var rows = [
      ['分数', state.score],
      ['步数', state.moves],
      ['发牌次数', state.deals],
      ['完成组', state.foundations.length + ' / 8'],
      ['用时', fmtTime(endElapsed)],
      ['本机最佳', readBest()]
    ];
    $('resultBody').innerHTML = rows.map(function(row){
      return '<tr><td>' + row[0] + '</td><td><b>' + row[1] + '</b></td></tr>';
    }).join('');
    $('resultModal').hidden = false;
    saveStats(win);
    sound(win ? 'win' : 'lose');
  }
  function saveStats(win){
    try {
      if (!window.Store) return;
      var stats = window.Store.getJSON(STATS_KEY, { games: 0, wins: 0, bestScore: 0, bestTime: 0 });
      stats.games = (stats.games || 0) + 1;
      if (win) stats.wins = (stats.wins || 0) + 1;
      window.Store.setJSON(STATS_KEY, stats);
      window.Store.best(BEST_KEY, state.score, { mode: 'max' });
      if (win) window.Store.best('spider-premium-best-time-v1', endElapsed || elapsedSeconds(), { mode: 'min' });
    } catch (err) {}
  }

  function submit(move){
    if (!state || state.over) { toast('对局已结束，请开新局。'); return null; }
    var next;
    try { next = E.applyMove(state, move); }
    catch (err) { sound('error'); toast(err.message || '这一步不合法'); return null; }
    history.push(E.serialize(state));
    if (history.length > MAX_HISTORY) history.splice(0, history.length - MAX_HISTORY);
    var runsBefore = state.foundations.length;
    state = next;
    selected = null;
    hintMove = null;
    pendingPop = state.foundations.length > runsBefore ? 1 : 0;
    sound(move.type === 'deal' ? 'deal' : (pendingPop ? 'capture' : 'move'));
    if (pendingPop) toast('收走一组 K→A，+100 分！');
    endElapsed = state.over ? elapsedSeconds() : null;
    render();
    tick();
    if (state.over) showResult();
    return clone(state);
  }

  function newGame(opts){
    opts = opts || {};
    var difficulty = opts.difficulty;
    if (difficulty == null) difficulty = $('difficulty').value;
    difficulty = E.normalizeDifficulty(difficulty);
    $('difficulty').value = String(difficulty);
    var seed = opts.seed == null ? (Date.now() % 1000000) : opts.seed;
    state = E.createGame({ seed: seed, difficulty: difficulty });
    history = [];
    selected = null;
    hintMove = null;
    pendingPop = 0;
    lastRuns = 0;
    endElapsed = null;
    startTime = Date.now();
    $('resultModal').hidden = true;
    try { if (window.Store) window.Store.set(DIFF_KEY, String(difficulty)); } catch (err) {}
    render();
    tick();
    return state;
  }

  function undo(){
    if (!history.length) { toast('没有可撤销的步骤。'); return null; }
    try { state = E.deserialize(history.pop()); }
    catch (err) { toast('撤销失败：' + err.message); return null; }
    selected = null;
    hintMove = null;
    pendingPop = 0;
    endElapsed = null;
    $('resultModal').hidden = true;
    sound('click');
    render();
    tick();
    toast('已撤销一步。');
    return clone(state);
  }

  function doHint(){
    if (!state || state.over) { toast('对局已结束。'); return null; }
    var h = E.hint(state);
    if (!h) { toast('没有可执行的动作。'); hintMove = null; render(); return null; }
    hintMove = h;
    selected = null;
    sound('click');
    render();
    if (h.type === 'deal') toast('建议：发牌（每列一张，共 10 张）。');
    else toast('建议：' + E.describeMove(state, h));
    return clone(h);
  }

  function doDeal(){
    if (!state || state.over) { toast('对局已结束。'); return null; }
    if (state.stock.length < 10) { toast('牌堆已空，无法发牌。'); return null; }
    if (!state.columns.every(function(c){ return c.length > 0; })) { toast('存在空列时不能发牌。'); return null; }
    return submit({ type: 'deal' });
  }

  function autoFinish(limit){
    if (!state || state.over) return { over: !!(state && state.over), steps: 0, result: state && state.result ? clone(state.result) : null };
    var steps = 0;
    var max = limit || 1200;
    while (state && !state.over && steps < max) {
      var h = E.hint(state);
      if (!h) break;
      history.push(E.serialize(state));
      if (history.length > MAX_HISTORY) history.splice(0, history.length - MAX_HISTORY);
      try { state = E.applyMove(state, h); }
      catch (err) { break; }
      steps += 1;
    }
    if (history.length > MAX_HISTORY) history.splice(0, history.length - MAX_HISTORY);
    selected = null;
    hintMove = null;
    endElapsed = state.over ? elapsedSeconds() : null;
    render();
    tick();
    if (state.over) showResult();
    return { over: state.over, steps: steps, result: state.result ? clone(state.result) : null, state: clone(state) };
  }

  function selectAt(col, index){
    if (!state || state.over) { toast('对局已结束。'); return; }
    var column = state.columns[col];
    var card = column[index];
    if (!card || !card.faceUp) return;
    if (!E.isMovableRun(state, col, index)) {
      // 点在同花段中间也允许：从该点起到列尾必须同花递减。
      toast('只能移动同花色连续递减的整段牌。');
      return;
    }
    selected = { col: col, index: index };
    hintMove = null;
    sound('click');
    render();
  }

  function onColumnTap(col){
    if (!state || state.over) { toast('对局已结束，请开新局。'); return; }
    if (!selected) {
      if (state.columns[col].length === 0) toast('空列：先选中一张可移动的牌。');
      return;
    }
    if (selected.col === col) { selected = null; hintMove = null; render(); return; }
    var move = { type: 'move', fromCol: selected.col, toCol: col, index: selected.index };
    submit(move);
  }

  $('board').addEventListener('click', function(event){
    var colEl = event.target.closest('.col');
    if (!colEl) return;
    var col = Number(colEl.getAttribute('data-col'));
    var cardEl = event.target.closest('.card');
    if (selected) {
      if (cardEl && Number(cardEl.getAttribute('data-col')) === selected.col &&
          Number(cardEl.getAttribute('data-index')) === selected.index) {
        selected = null; hintMove = null; render(); return;
      }
      onColumnTap(col);
      return;
    }
    if (cardEl) {
      selectAt(col, Number(cardEl.getAttribute('data-index')));
    } else {
      onColumnTap(col);
    }
  });
  $('board').addEventListener('keydown', function(event){
    if (event.key !== 'Enter' && event.key !== ' ') return;
    var cardEl = event.target.closest('.card');
    if (!cardEl) return;
    event.preventDefault();
    var col = Number(cardEl.getAttribute('data-col'));
    var index = Number(cardEl.getAttribute('data-index'));
    if (selected) onColumnTap(col);
    else selectAt(col, index);
  });

  $('stockTray').addEventListener('click', function(){ doDeal(); });
  $('stockTray').addEventListener('keydown', function(event){
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); doDeal(); }
  });
  $('newBtn').addEventListener('click', function(){ sound('deal'); newGame(); });
  $('undoBtn').addEventListener('click', undo);
  $('hintBtn').addEventListener('click', doHint);
  $('dealBtn').addEventListener('click', doDeal);
  $('difficulty').addEventListener('change', function(){
    sound('click');
    newGame({ difficulty: $('difficulty').value });
  });
  $('soundBtn').addEventListener('click', function(){
    muted = !muted;
    try { unlockAudio(); if (window.Sfx && window.Sfx.mute) window.Sfx.mute(muted); } catch (err) {}
    this.setAttribute('aria-pressed', muted ? 'false' : 'true');
    this.textContent = muted ? '静音' : '音效';
    toast(muted ? '已静音。' : '音效已开启。');
  });
  $('againBtn').addEventListener('click', function(){ sound('deal'); newGame(); });
  $('closeBtn').addEventListener('click', function(){ $('resultModal').hidden = true; });

  document.addEventListener('pointerdown', unlockAudio, { once: true });
  document.addEventListener('keydown', function(event){
    var tag = event.target && event.target.tagName ? event.target.tagName.toLowerCase() : '';
    if (tag === 'select' || tag === 'input' || tag === 'textarea') return;
    var key = (event.key || '').toLowerCase();
    if (key === 'escape') { selected = null; hintMove = null; render(); return; }
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (key === 'n') { event.preventDefault(); sound('deal'); newGame(); }
    else if (key === 'u') { event.preventDefault(); undo(); }
    else if (key === 'h') { event.preventDefault(); doHint(); }
    else if (key === 'd') { event.preventDefault(); doDeal(); }
  });

  window.__spider = Object.freeze({
    newGame: function(opts){ return clone(newGame(opts || {})); },
    start: function(opts){ return clone(newGame(opts || {})); },
    getState: function(){ return clone(state); },
    state: function(){ return clone(state); },
    setState: function(s){
      state = E.deserialize(JSON.stringify(s));
      history = [];
      selected = null;
      hintMove = null;
      pendingPop = 0;
      endElapsed = null;
      startTime = Date.now();
      $('resultModal').hidden = true;
      try { $('difficulty').value = String(state.difficulty); } catch (err) {}
      render();
      tick();
      return clone(state);
    },
    legalMoves: function(){ return clone(E.getLegalMoves(state)); },
    playMove: function(move){ return submit(clone(move)); },
    autoFinish: autoFinish,
    hint: function(){ var h = E.hint(state); return h ? clone(h) : null; },
    undo: undo,
    deal: doDeal,
    result: function(){ return state && state.result ? clone(state.result) : null; },
    over: function(){ return !!(state && state.over); },
    score: function(){ return state ? state.score : null; },
    elapsed: elapsedSeconds,
    selection: function(){ return selected ? clone(selected) : null; },
    engine: E
  });

  var initialSeed = 20261110;
  var initialDifficulty = 1;
  window.addEventListener('resize', fitBoard);
  window.addEventListener('orientationchange', fitBoard);
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('seed')) initialSeed = Number(q.get('seed')) || initialSeed;
    if (q.get('difficulty')) initialDifficulty = E.normalizeDifficulty(q.get('difficulty'));
    if (window.Store) {
      var saved = window.Store.get(DIFF_KEY, null);
      if (!q.get('difficulty') && saved) initialDifficulty = E.normalizeDifficulty(saved);
    }
  } catch (err) {}
  newGame({ seed: initialSeed, difficulty: initialDifficulty });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
