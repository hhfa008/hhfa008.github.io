<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:description" content="本地材质与真实牌局合成的宣传图页面。">

<title>蜘蛛纸牌 · 美术合成</title>

<style>
:root{
  --display:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  --gold:#d8b66f; --gold2:#f4dda2; --ink:#f4ecdc; --dim:#b9c9bd; --faint:#7f978a;
  --paper:#f4eedb; --paper2:#ded3b6; --card-ink:#221f17; --red:#b4483d;
  --felt:url("../../assets/art/premium/spider/felt.webp");
  --back:url("../../assets/art/premium/spider/card-back.webp");
  --cw:100px; --gap-down:-100px; --gap-up:-70px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#020b09}
body{width:1200px;height:1200px;overflow:hidden;font-family:var(--body);color:var(--ink)}
body[data-shot="og"]{width:1200px;height:630px;--cw:96px;--gap-down:-100px;--gap-up:-78px}
body[data-shot="detail"]{width:1536px;height:1024px;--cw:136px;--gap-down:-136px;--gap-up:-92px}
body[data-shot="card"]{width:480px;height:320px;--cw:42px;--gap-down:-42px;--gap-up:-29px}
.stage{position:relative;width:100%;height:100%;overflow:hidden;
  background:
    radial-gradient(900px 700px at 12% 0%,rgba(201,163,95,.22),transparent 62%),
    radial-gradient(760px 700px at 96% 8%,rgba(52,140,112,.22),transparent 58%),
    linear-gradient(rgba(3,15,12,.74),rgba(3,15,12,.87)),
    var(--felt) center/cover no-repeat;
}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.58) 100%);pointer-events:none}
.frame{position:absolute;inset:24px;border:1px solid rgba(216,182,111,.4);border-radius:22px;box-shadow:inset 0 0 0 6px rgba(216,182,111,.05);z-index:1;pointer-events:none}
.frame::before,.frame::after{content:"";position:absolute;width:58px;height:58px;border:2px solid rgba(216,182,111,.5)}
.frame::before{left:13px;top:13px;border-right:0;border-bottom:0;border-radius:13px 0 0 0}
.frame::after{right:13px;bottom:13px;border-left:0;border-top:0;border-radius:0 0 13px 0}
.content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:48px 58px 30px}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:22px}
.brandline{display:flex;align-items:center;gap:18px;min-width:0}
.mark{width:84px;height:84px;flex:0 0 84px;border-radius:50%;border:1px solid rgba(216,182,111,.55);display:grid;place-items:center;color:var(--gold2);
  background:radial-gradient(circle at 34% 28%,rgba(239,211,153,.3),rgba(5,24,19,.7) 72%);
  box-shadow:0 16px 36px rgba(0,0,0,.45),inset 0 0 0 5px rgba(216,182,111,.08)}
.mark svg{width:42px;height:42px}
h1{font-family:var(--display);font-weight:700;font-size:78px;line-height:.92;letter-spacing:.1em;margin:0;color:#f6edd8;text-shadow:0 10px 32px rgba(0,0,0,.5)}
h1 span{color:var(--gold2)}
.brandline p{margin:11px 0 0;font-size:16px;letter-spacing:.28em;color:var(--dim)}
.chips{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.chip{border:1px solid rgba(216,182,111,.35);border-radius:999px;padding:5px 13px;background:rgba(4,18,14,.55);font-size:13px;color:var(--gold2);letter-spacing:.1em;white-space:nowrap}
.board-wrap{flex:1;min-height:0;margin-top:16px;border:1px solid rgba(216,182,111,.24);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(155deg,rgba(16,48,39,.82),rgba(3,16,12,.9));box-shadow:0 22px 48px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05)}
.field-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;letter-spacing:.14em;color:var(--dim);padding:0 2px;min-height:20px}
.field-head b{color:var(--gold2);letter-spacing:.06em;font-weight:600}
.board{display:grid;grid-template-columns:repeat(10,var(--cw));gap:7px;justify-content:center;align-items:start}
body[data-shot="og"] .board{gap:4px}
body[data-shot="detail"] .board{gap:5px}
body[data-shot="card"] .board{gap:1px}
.col{min-width:0;border-radius:5px;border:1px solid rgba(255,255,255,.04);background:rgba(2,13,10,.26);padding:0 2px 4px;min-height:calc(var(--cw) * 2.4);display:flex;flex-direction:column;align-items:stretch}
.card{position:relative;width:100%;aspect-ratio:5/7;border-radius:5px;border:1px solid rgba(86,68,36,.55);overflow:hidden;flex:0 0 auto;
  background:linear-gradient(145deg,var(--paper),var(--paper2));color:var(--card-ink);
  box-shadow:0 2px 5px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.55)}
.card.gap-down{margin-top:var(--gap-down)}
.card.gap-up{margin-top:var(--gap-up)}
.card.back{background:linear-gradient(rgba(3,15,12,.18),rgba(3,15,12,.18)),var(--back) center/cover no-repeat;border-color:rgba(201,163,95,.42)}
.card.red{color:var(--red)}
.card .corner{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.92;z-index:2}
.card .corner b{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.02em}
.card .corner svg{width:11px;height:11px;margin-top:1px}
.card .corner.tl{left:3px;top:3px}
.card .corner.br{right:3px;bottom:3px;transform:rotate(180deg)}
.card .face-center{position:absolute;inset:14% 9% 12%;display:grid;place-items:center;pointer-events:none}
.card .pips{position:absolute;inset:16% 12% 14%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,1fr);place-items:center}
.card .pips svg{width:100%;height:100%;max-width:19px;max-height:19px}
.card .ace-suit{display:block;width:100%;height:100%}
.card .ace-suit svg{width:62%;height:62%;margin:0 auto}
.card .court{position:relative;display:grid;place-items:center;width:100%;height:100%;border:1px solid rgba(138,104,41,.34);border-radius:3px;
  background:linear-gradient(135deg,rgba(201,163,95,.18),transparent 40%,rgba(138,104,41,.12))}
.card .court::before,.card .court::after{content:"";position:absolute;inset:18%;border:1px solid rgba(138,104,41,.34);border-radius:50%}
.card .court::after{inset:29%;transform:rotate(45deg);border-radius:2px}
.card .court b{position:relative;z-index:1;font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
body[data-shot="og"] .card .corner b{font-size:12px}
body[data-shot="og"] .card .corner svg{width:9px;height:9px}
body[data-shot="og"] .card .court b{font-size:17px}
body[data-shot="og"] .card .pips svg{max-width:14px;max-height:14px}
body[data-shot="detail"] .card .corner b{font-size:19px}
body[data-shot="detail"] .card .corner svg{width:14px;height:14px}
body[data-shot="detail"] .card .court b{font-size:28px}
body[data-shot="detail"] .card .pips svg{max-width:24px;max-height:24px}
body[data-shot="card"] .card .corner b{font-size:12px}
body[data-shot="card"] .card .corner svg{width:7px;height:7px}
body[data-shot="card"] .card .court b{font-size:11px}
body[data-shot="card"] .card .pips{display:none}
.stock-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:3px 2px 1px}
.stock-left{display:flex;align-items:flex-end;gap:16px;min-width:0}
.stockpiles{display:flex;align-items:flex-end;gap:6px}
.stockpile{position:relative;width:var(--cw);height:calc(var(--cw) * 1.4 + 16px)}
.stockpile .card{position:absolute;left:0;right:0;top:0}
.stock-label{font-size:13px;color:var(--dim);letter-spacing:.08em;line-height:1.5}
.stock-label b{display:block;font-family:var(--display);font-weight:700;font-size:24px;color:var(--gold2);letter-spacing:.02em}
.legend{max-width:430px;font-size:12px;color:var(--dim);line-height:1.6;text-align:right}
.legend b{color:var(--gold2)}
.foundation-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.f-label{font-size:12px;color:var(--dim);letter-spacing:.08em;margin-right:3px;white-space:nowrap}
.f-slot{width:calc(var(--cw) * 0.3);height:calc(var(--cw) * 0.36);border-radius:4px;border:1px dashed rgba(216,182,111,.32);display:grid;place-items:center;color:rgba(216,182,111,.35);background:rgba(2,12,9,.4)}
.f-slot svg{width:50%;height:50%}
.f-slot.done{border-style:solid;border-color:rgba(244,221,162,.72);background:linear-gradient(140deg,rgba(201,163,95,.24),rgba(8,32,26,.9));color:var(--gold2)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:9px;margin-top:8px;border-top:1px solid rgba(216,182,111,.18);font-size:12px;color:var(--faint);letter-spacing:.08em}
.foot b{color:var(--gold2);font-weight:600}
/* OG 1200×630 */
body[data-shot="og"] .content{padding:26px 44px 18px}
body[data-shot="og"] h1{font-size:48px}
body[data-shot="og"] .mark{width:56px;height:56px;flex-basis:56px}
body[data-shot="og"] .mark svg{width:28px;height:28px}
body[data-shot="og"] .brandline p{font-size:12px;margin-top:6px;letter-spacing:.22em}
body[data-shot="og"] .chips{display:none}
body[data-shot="og"] .board-wrap{margin-top:10px;padding:8px;gap:4px;border-radius:12px}
body[data-shot="og"] .field-head{font-size:10px;min-height:14px}
body[data-shot="og"] .col{min-height:calc(var(--cw) * 1.8)}
body[data-shot="og"] .stockpile{height:calc(var(--cw) * 1.4 + 10px)}
body[data-shot="og"] .stock-label{font-size:10px}
body[data-shot="og"] .stock-label b{font-size:17px}
body[data-shot="og"] .legend{font-size:10px;max-width:340px}
body[data-shot="og"] .foot{font-size:10px;padding-top:4px;margin-top:4px}
body[data-shot="og"] .f-slot{height:calc(var(--cw) * 0.3)}
/* DETAIL 1536×1024 */
body[data-shot="detail"] .content{padding:40px 54px 26px}
body[data-shot="detail"] h1{font-size:68px}
body[data-shot="detail"] .mark{width:74px;height:74px;flex-basis:74px}
body[data-shot="detail"] .brandline p{font-size:14px;margin-top:8px}
body[data-shot="detail"] .board-wrap{margin-top:14px;padding:11px;gap:6px}
body[data-shot="detail"] .field-head{font-size:12px}
body[data-shot="detail"] .stockpile{height:calc(var(--cw) * 1.4 + 14px)}
/* CARD 480×320 */
body[data-shot="card"] .content{padding:14px 16px 9px}
body[data-shot="card"] .frame{inset:8px;border-radius:10px}
body[data-shot="card"] .frame::before,body[data-shot="card"] .frame::after{width:22px;height:22px;border-width:1px}
body[data-shot="card"] h1{font-size:20px;letter-spacing:.06em}
body[data-shot="card"] .mark{width:30px;height:30px;flex-basis:30px}
body[data-shot="card"] .mark svg{width:16px;height:16px}
body[data-shot="card"] .brandline p{font-size:9px;margin-top:2px;letter-spacing:.15em}
body[data-shot="card"] .brandline{gap:7px}
body[data-shot="card"] .chips,body[data-shot="card"] .legend{display:none}
body[data-shot="card"] .board-wrap{margin-top:6px;padding:5px;gap:3px;border-radius:8px}
body[data-shot="card"] .field-head{font-size:9px;min-height:10px}
body[data-shot="card"] .col{min-height:calc(var(--cw) * 1.8);padding-bottom:2px}
body[data-shot="card"] .stock-row{gap:6px;padding:1px}
body[data-shot="card"] .stock-left{gap:8px}
body[data-shot="card"] .stockpiles{gap:3px}
body[data-shot="card"] .stockpile{height:calc(var(--cw) * 1.4 + 5px)}
body[data-shot="card"] .stock-label{font-size:8px}
body[data-shot="card"] .stock-label b{font-size:12px}
body[data-shot="card"] .foot{font-size:8px;padding-top:3px;margin-top:3px}
body[data-shot="card"] .f-slot{height:calc(var(--cw) * 0.3)}

@media (max-width:420px){
  html,body{width:100vw!important;height:100vh!important;overflow:hidden!important}
  .stage{width:100vw;height:100vh}
  .content{padding:14px}
  .board-wrap,.chips,.legend{display:none!important}
  .topline{flex-direction:column;gap:8px}
  .mark{width:48px;height:48px;flex-basis:48px}
  .mark svg{width:24px;height:24px}
  h1{font-size:30px!important}
  .brandline p,.chip,.field-head,.stock-label,.legend,.foot{font-size:12px!important}
  .frame{inset:8px}
}
</style>
</head>
<body data-shot="cover">
<div class="stage">
  <div class="frame"></div>
  <div class="content">
    <header class="topline">
      <div class="brandline">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 100 100" fill="currentColor"><path d="M50 6C50 6 18 30 18 52c0 14 11 25 25 25 4 0 8-1 11-3-1 12-5 19-13 25h18c-8-6-12-13-13-25 3 2 7 3 11 3 14 0 25-11 25-25C82 30 50 6 50 6z"/></svg></span>
        <div><h1>蜘蛛<span>纸牌</span></h1><p>SPIDER SOLITAIRE · PREMIUM</p></div>
      </div>
      <div class="chips"><span class="chip">单人 · 单机</span><span class="chip">104 张 · 10 列</span><span class="chip">5 次发牌 · 8 组 K→A</span></div>
    </header>

    <section class="board-wrap">
      <div class="field-head"><span>牌桌 · <b id="seedLabel">种子 20261110</b></span><span>同花连续段 · 空列禁发 · K→A 自动收组</span></div>
      <div class="board" id="board"></div>
      <div class="stock-row">
        <div class="stock-left">
          <div class="stockpiles" id="stockpiles"></div>
          <div class="stock-label"><b id="stockCount">50 张</b><span>牌堆 · 每次 10 张</span></div>
        </div>
        <div class="foundation-row" id="foundationRow"></div>
      </div>
    </section>

    <div class="legend">完整规则局面：前四列 6 张、后六列 5 张，顶端正面；剩余 50 张为 5 次发牌。<b>深青绒布</b>与<b>金绿装饰牌背</b>为真实材质，牌面由代码绘制。</div>
    <footer class="foot"><span><b>SPIDER SOLITAIRE</b> · PREMIUM EDITION</span><span>深青绒布 · 金绿牌背 · 双副牌</span><span>1P · 10 COLUMNS · 104 CARDS</span></footer>
  </div>
</div>
<script src="../../shared/shuffle.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  'use strict';
  var E = window.SpiderEngine;
  var PIP_LAYOUT = {
    2: [[1,2],[5,2]],
    3: [[1,2],[3,2],[5,2]],
    4: [[1,1],[1,3],[5,1],[5,3]],
    5: [[1,1],[1,3],[3,2],[5,1],[5,3]],
    6: [[1,1],[3,1],[5,1],[1,3],[3,3],[5,3]],
    7: [[1,2],[1,1],[3,1],[5,1],[1,3],[3,3],[5,3]],
    8: [[1,2],[1,1],[3,1],[5,1],[1,3],[3,3],[5,3],[5,2]],
    9: [[1,1],[2,1],[4,1],[5,1],[1,3],[2,3],[4,3],[5,3],[3,2]],
    10: [[1,1],[2,1],[4,1],[5,1],[1,3],[2,3],[4,3],[5,3],[1,2],[5,2]]
  };
  var PATH = {
    spades: 'M50 6C50 6 18 30 18 52c0 14 11 25 25 25 4 0 8-1 11-3-1 12-5 19-13 25h18c-8-6-12-13-13-25 3 2 7 3 11 3 14 0 25-11 25-25C82 30 50 6 50 6z',
    hearts: 'M50 90C24 70 10 55 10 36 10 22 20 12 33 12c8 0 14 4 17 10 3-6 9-10 17-10 13 0 23 10 23 24 0 19-14 34-40 54z',
    diamonds: 'M50 4 92 50 50 96 8 50z',
    clubs: 'M50 8c-9 0-16 7-16 16 0 4 1 7 4 10-3-1-6-2-9-2C18 32 9 41 9 53s9 21 20 21c6 0 12-3 16-7-1 9-5 15-11 21h32c-6-6-10-12-11-21 4 4 10 7 16 7 11 0 20-9 20-21s-9-21-20-21c-3 0-6 1-9 2 3-3 4-6 4-10 0-9-7-16-16-16z'
  };
  function svg(suit){ return '<svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><path d="' + PATH[suit] + '"/></svg>'; }
  function rankLabel(rank){ return E.rankLabel(rank); }
  function cardFace(card){
    var red = E.suitInfo(card.suit).red;
    var center;
    if (card.rank >= 11) {
      center = '<span class="court"><b>' + rankLabel(card.rank) + '</b></span>' +
        '<span style="position:absolute;right:4px;top:4px;width:13px;height:13px">' + svg(card.suit) + '</span>' +
        '<span style="position:absolute;left:4px;bottom:4px;width:13px;height:13px;transform:rotate(180deg)">' + svg(card.suit) + '</span>';
    } else if (card.rank === 1) {
      center = '<span class="ace-suit">' + svg(card.suit) + '</span>';
    } else {
      center = '<span class="pips">' + (PIP_LAYOUT[card.rank] || []).map(function(pos){
        return '<span style="grid-area:' + pos[0] + '/' + pos[1] + '">' + svg(card.suit) + '</span>';
      }).join('') + '</span>';
    }
    return '<div class="card' + (red ? ' red' : '') + '">' +
      '<span class="corner tl"><b>' + rankLabel(card.rank) + '</b>' + svg(card.suit) + '</span>' +
      '<span class="face-center">' + center + '</span>' +
      '<span class="corner br"><b>' + rankLabel(card.rank) + '</b>' + svg(card.suit) + '</span>' +
      '</div>';
  }
  function cardBack(){
    return '<div class="card back"></div>';
  }

  // 从规则引擎构造一个真实合法的中局：只接受不会立刻完成整组的提示走法，
  // 因此列 + 牌堆仍然恰好是 104 张，完成区为空。
  var state = E.createGame({ seed: 20261110, difficulty: 4 });
  var steps = 0;
  while (steps < 22) {
    var h = E.hint(state);
    if (!h) break;
    var next;
    try { next = E.applyMove(state, h); }
    catch (err) { break; }
    if (next.foundations.length > 0) break;
    state = next;
    steps += 1;
  }

  var board = document.getElementById('board');
  var html = '';
  for (var c = 0; c < state.columns.length; c++) {
    html += '<div class="col">';
    var column = state.columns[c];
    for (var i = 0; i < column.length; i++) {
      var card = column[i];
      var gap = '';
      if (i > 0) gap = column[i - 1].faceUp ? ' gap-up' : ' gap-down';
      if (card.faceUp) {
        var face = cardFace(card);
        // 给外层加间距类
        face = face.replace('class="card', 'class="card' + gap);
        html += face;
      } else {
        html += '<div class="card back' + gap + '"></div>';
      }
    }
    html += '</div>';
  }
  board.innerHTML = html;

  var stockHtml = '';
  var stockCount = state.stock.length;
  var piles = Math.ceil(stockCount / 10);
  for (var p = 0; p < piles; p++) {
    var count = Math.min(10, stockCount - p * 10);
    stockHtml += '<div class="stockpile">';
    for (var k = 0; k < count; k++) {
      stockHtml += '<div class="card back" style="top:' + (k * 2) + 'px"></div>';
    }
    stockHtml += '</div>';
  }
  document.getElementById('stockpiles').innerHTML = stockHtml;
  document.getElementById('stockCount').textContent = stockCount + ' 张';

  var fHtml = '<span class="f-label">完成组</span>';
  for (var f = 0; f < 8; f++) {
    if (f < state.foundations.length) {
      fHtml += '<span class="f-slot done" title="' + E.suitInfo(state.foundations[f].suit).zh + ' K→A">' + svg(state.foundations[f].suit) + '</span>';
    } else {
      fHtml += '<span class="f-slot" title="未完成"></span>';
    }
  }
  document.getElementById('foundationRow').innerHTML = fHtml;
  document.getElementById('seedLabel').textContent = '种子 ' + state.seed + ' · 四色 · ' + state.moves + ' 步';

  try {
    var shot = new URLSearchParams(location.search).get('shot') || 'cover';
    if (['cover', 'og', 'detail', 'card'].indexOf(shot) === -1) shot = 'cover';
    document.body.setAttribute('data-shot', shot);
  } catch (e) {}

  var urls = [
    '../../assets/art/premium/spider/felt.webp',
    '../../assets/art/premium/spider/card-back.webp'
  ];
  Promise.all(urls.map(function(url){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){ resolve(true); };
      img.onerror = function(){ resolve(false); };
      img.src = url;
    });
  })).then(function(loaded){
    window.__artMaterialCount = loaded.filter(Boolean).length;
    window.__artReady = true;
    document.body.setAttribute('data-art-ready', 'true');
  });
})();
</script>
</body>
</html>
