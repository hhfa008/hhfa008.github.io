<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Sale 拍卖 · 毛线派对桌游</title>
<style>
  :root{--bg:#171225;--panel:#241b3d;--panel2:#2f2450;--ink:#f5f0ff;--muted:#b6a9d6;--gold:#ffc857;--pink:#ff6b9d;--green:#4fd1a1;--line:#45356e}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:radial-gradient(900px 500px at 50% -10%,#3b2a66 0%,var(--bg) 58%) fixed;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh}
  a{color:var(--gold)}
  .wrap{max-width:760px;margin:0 auto;padding:10px 12px 40px}
  .top{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0 10px}
  .top h1{font-size:19px;margin:0;letter-spacing:.5px;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navlink{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:52px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-decoration:none;font-size:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
  .players{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
  .player{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 10px;min-width:0}
  .player.turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .player .nm{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player .st{font-size:12px;color:var(--muted);margin-top:2px}
  .player .tot{font-size:16px;font-weight:800;color:var(--gold);margin-top:2px}
  .badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:99px;background:var(--panel2);color:var(--muted);margin-left:4px;vertical-align:middle}
  .stage{text-align:center;padding:16px 10px 12px;position:relative}
  .eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
  .cardbig{display:inline-flex;align-items:center;justify-content:center;width:104px;height:142px;border-radius:14px;background:linear-gradient(160deg,#ffe4a3,#ffc857 45%,#e39b2d);color:#3a2500;font-size:52px;font-weight:900;box-shadow:0 10px 24px rgba(0,0,0,.35),0 2px 0 #fff4d0 inset;margin:10px auto;transform:rotate(-1.5deg)}
  .bid{font-size:15px;color:var(--muted)}
  .bid b{color:var(--ink);font-size:20px}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:10px 16px;cursor:pointer;touch-action:manipulation}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.38;cursor:default}
  button.primary{background:linear-gradient(160deg,#ff8fb5,#ff5f92);color:#2a0a16;font-weight:800;border:none}
  button.gold{background:linear-gradient(160deg,#ffe09a,#ffc857);color:#3a2500;font-weight:800;border:none}
  button.ghost{background:transparent}
  .hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin-top:10px}
  .prop{min-height:64px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;background:linear-gradient(160deg,#7f6bc4,#5d4a9e);border:1px solid #8d7bd0;border-radius:12px}
  .prop:disabled{opacity:.5}
  .reveal{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:13px;color:var(--muted)}
  .reveal span{background:var(--panel2);border-radius:8px;padding:4px 8px}
  .log{margin-top:12px;font-size:12.5px;color:var(--muted);min-height:52px}
  .log div{padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
  .msg{text-align:center;color:var(--gold);font-weight:700;margin:8px 0}
  .final{text-align:center;padding:18px 8px}
  .final h2{margin:4px 0 6px;font-size:22px}
  .final p{color:var(--muted);margin:4px 0 14px}
  .foot{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
  .foot a{display:inline-flex;align-items:center;min-height:44px}
  @media (max-width:420px){.wrap{padding:8px 10px 32px}.top h1{font-size:17px}.players{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.player{padding:8px}.cardbig{width:92px;height:126px;font-size:44px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="navlink" href="../index.html" aria-label="返回桌游目录">← 桌游</a>
    <h1>For Sale 拍卖</h1>
    <a class="navlink" href="rules.html" aria-label="查看规则">规则</a>
  </header>
  <main>
    <section class="players" id="players" aria-label="玩家状态"></section>
    <section class="panel stage" id="stage" aria-live="polite" aria-label="牌桌"></section>
    <section class="panel" id="actionPanel" aria-label="操作区" style="margin-top:10px"></section>
    <section class="log" id="log" aria-label="对局记录"></section>
  </main>
  <div class="foot"><a href="../index.html">← 更多毛线桌游</a></div>
</div>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.ForSaleEngine;
  var game = null;
  var busy = false;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function start() {
    game = E.createGame({ seed: (Date.now() % 100000) + 17 });
    busy = false;
    render();
    pump(500);
  }

  function money() { return game.players[0].money; }
  function minBid() {
    var a = game.auction;
    return a.highBidder < 0 ? 0 : a.currentBid + 1;
  }

  function render() {
    var view = E.publicView(game, 0);
    var pbox = document.getElementById('players');
    pbox.innerHTML = '';
    view.players.forEach(function (p, i) {
      var d = el('div', 'player' + (view.auction && view.auction.turn === i ? ' turn' : ''));
      var nm = el('div', 'nm', p.name + (i === 0 ? '（你）' : ''));
      var st = el('div', 'st', '现金 $' + p.money + ' · 房产 ' + p.props.length + ' · 支票 ' + p.checks.length);
      var tot = el('div', 'tot', '$' + p.total);
      d.appendChild(nm); d.appendChild(st); d.appendChild(tot);
      if (view.auction && view.auction.highBidder === i) d.appendChild(el('span', 'badge', '最高价'));
      pbox.appendChild(d);
    });

    var stage = document.getElementById('stage');
    stage.innerHTML = '';
    if (view.phase === 'auction') {
      stage.appendChild(el('div', 'eyebrow', '房产拍卖 · 第 ' + view.round + ' / ' + view.totalRounds + ' 轮'));
      stage.appendChild(el('div', 'cardbig', String(view.auction.card)));
      var bid = el('div', 'bid');
      bid.innerHTML = view.auction.highBidder < 0 ? '尚无出价 · 底价 <b>0</b>' :
        '当前最高 <b>$' + view.auction.currentBid + '</b> · ' + view.players[view.auction.highBidder].name;
      stage.appendChild(bid);
      if (view.auction.passed.length) {
        var passed = el('div', 'bid', '已放弃：' + view.auction.passed.map(function (i) { return view.players[i].name; }).join('、'));
        stage.appendChild(passed);
      }
    } else if (view.phase === 'sell') {
      stage.appendChild(el('div', 'eyebrow', '同时出牌 · 第 ' + view.sell.round + ' / ' + view.totalRounds + ' 轮'));
      stage.appendChild(el('div', 'msg', '选一张房产卡暗出，最高者拿最大支票'));
      var rev = el('div', 'reveal');
      view.players.forEach(function (p, i) {
        var picked = view.sell.picks[i];
        rev.appendChild(el('span', null, p.name + '：' + (picked === 'hidden' ? '已出牌' : picked == null ? '未出牌' : '已出 ' + picked)));
      });
      stage.appendChild(rev);
      if (view.sell.reveal) {
        var r2 = el('div', 'reveal');
        view.sell.reveal.awarded.forEach(function (x) {
          r2.appendChild(el('span', null, view.players[x.player].name + ' ' + x.card + ' → $' + x.check));
        });
        stage.appendChild(r2);
      }
    } else {
      var f = el('div', 'final');
      var win = view.winner;
      f.appendChild(el('h2', null, (win === 0 ? '你赢了！' : view.players[win].name + ' 获胜')));
      f.appendChild(el('p', null, '最终资产：' + view.players.map(function (p, i) {
        return p.name + ' $' + E.totalMoney(game, i);
      }).join(' · ')));
      stage.appendChild(f);
    }

    renderActions(view);
    renderLog(view);
  }

  function renderActions(view) {
    var box = document.getElementById('actionPanel');
    box.innerHTML = '';
    if (view.phase === 'over') {
      var again = el('button', 'primary', '再来一局');
      again.setAttribute('aria-label', '重新开始一局 For Sale');
      again.onclick = start;
      box.appendChild(again);
      return;
    }
    if (view.phase === 'auction') {
      if (view.auction.turn !== 0) {
        box.appendChild(el('div', 'msg', '等待 ' + view.players[view.auction.turn].name + ' 行动…'));
        return;
      }
      var min = minBid();
      var max = money();
      if (min > max) {
        var p = el('button', 'ghost', '放弃（资金不足）');
        p.setAttribute('aria-label', '放弃本次拍卖');
        p.onclick = function () { act(function () { E.pass(game, 0); }); };
        box.appendChild(p);
        return;
      }
      var wrap = el('div', 'row');
      [0, 1, 2, 5].forEach(function (d, idx) {
        var amt = min + d;
        if (amt > max) return;
        var b = el('button', idx === 0 ? 'gold' : '', '出价 $' + amt);
        b.setAttribute('aria-label', '出价 ' + amt + ' 美元');
        b.onclick = function () { act(function () { E.bid(game, 0, amt); }); };
        wrap.appendChild(b);
      });
      var pass = el('button', 'ghost', '放弃');
      pass.setAttribute('aria-label', '放弃本次拍卖');
      pass.onclick = function () { act(function () { E.pass(game, 0); }); };
      if (game.auction.highBidder < 0) pass.disabled = true;
      wrap.appendChild(pass);
      box.appendChild(wrap);
      box.appendChild(el('div', 'msg', '你的现金 $' + max + '，最少加价到 $' + min));
      return;
    }
    if (view.phase === 'sell') {
      if (game.players[0].props.length === 0) {
        box.appendChild(el('div', 'msg', '你的房产已出完，等待其他玩家…'));
        return;
      }
      if (game.sell.picks[0] != null) {
        box.appendChild(el('div', 'msg', '已出牌，等待其他玩家…'));
        return;
      }
      var hand = el('div', 'hand');
      game.players[0].props.slice().sort(function (a, b) { return b - a; }).forEach(function (card) {
        var b = el('button', 'prop', String(card));
        b.setAttribute('aria-label', '暗出房产 ' + card);
        b.onclick = function () { act(function () { E.chooseSellCard(game, 0, card); }); };
        hand.appendChild(b);
      });
      box.appendChild(el('div', 'msg', '点击一张房产卡暗出'));
      box.appendChild(hand);
    }
  }

  function renderLog(view) {
    var box = document.getElementById('log');
    box.innerHTML = '';
    view.log.slice(-6).forEach(function (line) { box.appendChild(el('div', null, line)); });
  }

  function act(fn) {
    if (busy || !game || game.phase === 'over') return;
    busy = true;
    try { fn(); } catch (e) { busy = false; return; }
    render();
    busy = false;
    pump(520);
  }

  function pump(delay) {
    if (!game || game.phase === 'over') { render(); return; }
    setTimeout(function () {
      var res;
      try { res = E.step(game); } catch (e) { return; }
      render();
      if (res && res.needsHuman) return;
      if (game.phase === 'over') return;
      pump(520);
    }, delay || 520);
  }

  start();
})();
</script>
</body>
</html>
