
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>骰匠工坊 · 人机对战</title><meta name="description" content="骰匠工坊 中文极简德式桌游：掷出学徒骰，把点数安排到雕刻、上色、装箱等工位，赚取工坊声望。 纯前端离线，单机对 AI。"><meta name="theme-color" content="#121a18"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23121a18'/><circle cx='16' cy='16' r='8' fill='%23e0b85c'/></svg>">
<style>

  *{box-sizing:border-box}html,body{margin:0;padding:0}body{background:radial-gradient(circle at 20% 0%,#23352b,#121a18 60%) no-repeat,var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;padding:10px 10px 28px}

  .chips{display:flex;flex-wrap:wrap;gap:5px}.chip{background:#101815;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px}

  .edges{display:flex;flex-direction:column;gap:6px}.edgebtn{min-height:44px;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);font:inherit;font-size:12px;padding:7px 10px;cursor:pointer}.edgebtn:hover{border-color:var(--accent)}
  .suit{border-left:5px solid var(--c)}.sets{display:flex;flex-direction:column;gap:6px}.setbtn{min-height:44px;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);font:inherit;font-size:12px;padding:7px 10px;cursor:pointer}.setbtn i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.setbtn[disabled]{opacity:.4}

</head><body><div class="wrap"><header><h1>骰匠工坊<span>DICEWRIGHT WORKSHOP</span></h1><div class="spacer"></div><a class="btn" href="rules.html" aria-label="查看规则">规则</a></header><main id="content"></main><div id="end"></div></div>
<script>(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.MiniEuroEngine=factory();})(typeof globalThis!=='undefined'?globalThis:this,function(){'use strict';
  var CFG={"name":"骰匠工坊","en":"DICEWRIGHT WORKSHOP","slug":"mini-euro-b-06","rounds":8,"dice":3,"slots":[{"name":"磨角","req":1,"pts":2},{"name":"刻面","req":2,"pts":3},{"name":"上色","req":3,"pts":4},{"name":"校准","req":4,"pts":5},{"name":"包铜","req":5,"pts":6},{"name":"大师签名","req":6,"pts":9}]};

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function shuffle(list,rng){var out=list.slice();for(var i=out.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=out[i];out[i]=out[j];out[j]=t;}return out;}
  function clone(x){return JSON.parse(JSON.stringify(x));}
  function assertMove(ok,msg){if(!ok)throw new Error('非法动作: '+msg);}

  function rollPool(seed){var pool=[];for(var p=0;p<2;p++){pool[p]=[];for(var r=0;r<CFG.rounds;r++){var rng=mulberry32((seed+r*73+p*991)>>>0);var dice=[];for(var d=0;d<CFG.dice;d++)dice.push(1+Math.floor(rng()*6));pool[p][r]=dice;}}return pool;}
  function makePlayer(i){return{index:i,name:i===0?'你':'AI 工匠',points:0,placedRound:-1,used:[],slots:[]};}
  function createGame(seed){var sd=(seed==null?1:Number(seed))>>>0;return{seed:sd,round:0,current:0,turn:1,over:false,winner:null,pool:rollPool(sd),players:[makePlayer(0),makePlayer(1)],log:['新对局开始，你是先手。']};}
  function rollFor(s,p){var pl=s.players[p];pl.used=s.pool[p][s.round].map(function(){return false;});pl.slots=CFG.slots.map(function(){return false;});pl.placedRound=s.round;}
  function ensureRoll(s){s.players.forEach(function(pl){if(pl.placedRound!==s.round)rollFor(s,pl.index);});}
  function roundDone(s){return s.players.every(function(p){return p.used.every(Boolean);});}
  function advance(s){var p=s.players[s.current];if(p.used.every(Boolean)){var other=1-s.current;if(!s.players[other].used.every(Boolean)){s.current=other;}else{s.round++;if(s.round>=CFG.rounds){s.over=true;var a=s.players[0].points,b=s.players[1].points;s.winner=a>b?0:(b>a?1:null);s.log.unshift('终局：'+(s.winner==null?'平局':s.winner===0?'你获胜':'AI 获胜'));}else{ensureRoll(s);s.current=0;}}}}
  function applyMove(s,m){assertMove(s&&!s.over,'对局已结束');assertMove(m&&typeof m.type==='string','缺少动作类型');var n=clone(s);ensureRoll(n);var p=n.players[n.current];
    if(m.type==='place'){assertMove(Number.isInteger(m.die)&&m.die>=0&&m.die<p.used.length,'骰子索引无效');assertMove(Number.isInteger(m.slot)&&m.slot>=0&&m.slot<CFG.slots.length,'工位索引无效');assertMove(!p.used[m.die],'该骰子已使用');assertMove(!p.slots[m.slot],'该工位本轮已被占用');var v=n.pool[n.current][n.round][m.die];var slot=CFG.slots[m.slot];assertMove(v>=slot.req,'点数不满足工位要求');p.used[m.die]=true;p.slots[m.slot]=true;p.points+=slot.pts;n.turn=(n.turn||1)+1;n.log.unshift('你以点数 '+v+' 放置「'+slot.name+'」，得 '+slot.pts+' 分。');if(n.log.length>8)n.log.pop();advance(n);return n;}
    if(m.type==='pass'){n.turn=(n.turn||1)+1;p.used=p.used.map(function(){return true;});n.log.unshift('你放弃剩余骰子。');advance(n);return n;}
    throw new Error('非法动作: 未知动作 '+m.type);}
  function getLegalMoves(s){if(!s||s.over)return[];var n=clone(s);ensureRoll(n);var p=n.players[n.current];var out=[];p.used.forEach(function(used,d){if(used)return;for(var i=0;i<CFG.slots.length;i++){if(!p.slots[i]&&n.pool[n.current][n.round][d]>=CFG.slots[i].req)out.push({type:'place',die:d,slot:i});}});out.push({type:'pass'});return out;}
  function chooseAIMove(s){var moves=getLegalMoves(s).filter(function(m){return m.type==='place';});if(!moves.length)return{type:'pass'};var best=moves[0],bv=-1;moves.forEach(function(m){var slot=CFG.slots[m.slot];var v=slot.pts+slot.req*.01;if(v>bv){bv=v;best=m;}});return best;}
  return {CFG:CFG,createGame:createGame,applyMove:applyMove,getLegalMoves:getLegalMoves,chooseAIMove:chooseAIMove};
});</script>
<script>
(function(){
  
  var E=window.MiniEuroEngine;var S=null;var sel=null;
  var $=function(id){return document.getElementById(id);};
  function render(){if(!S)return;var c=$('content');var h='';
  
    var p=S.players[0];var dice=S.pool[0][Math.min(S.round,E.CFG.rounds-1)];
    h+='<div class="scorebar"><div>你 <b>'+S.players[0].points+'</b> 分</div><div>AI <b>'+S.players[1].points+'</b> 分</div><div>轮次 '+(S.round+1)+' / '+E.CFG.rounds+'</div></div>';
    h+='<h2>本轮骰子</h2><div class="dice">';dice.forEach(function(v,i){h+='<button class="die '+(p.used[i]?'used':'')+'" data-die="'+i+'" aria-label="骰子'+v+'点">'+v+'</button>';});h+='</div>';
    h+='<h2>工位</h2><div class="slots">';E.CFG.slots.forEach(function(sl,i){h+='<button class="slot '+(p.slots[i]?'used':'')+'" data-slot="'+i+'" aria-label="'+sl.name+'" '+(p.slots[i]?'disabled':'')+'><b>'+sl.name+'</b><span>需 '+sl.req+'+ 点</span><em>+'+sl.pts+' 分</em></button>';});h+='</div>';
    h+='<p class="hint">先点骰子，再点工位。每轮每名玩家 3 枚骰子。</p><div class="row"><button class="btn" id="pass" aria-label="跳过剩余骰子">跳过剩余骰子</button></div>';
    h+='<h2>日志</h2><div class="log">'+S.log.map(function(x){return '<div>'+x+'</div>';}).join('')+'</div>';
  
    document.addEventListener('click',function(ev){var d=ev.target.closest('[data-die]');if(d){sel=+d.dataset.die;document.querySelectorAll('[data-die]').forEach(function(x){x.classList.toggle('sel',+x.dataset.die===sel);});return;}var sl=ev.target.closest('[data-slot]');if(sl&&sel!=null&&S&&!S.over){try{S=E.applyMove(S,{type:'place',die:sel,slot:+sl.dataset.slot});sel=null;render();}catch(e){alert(e.message);}return;}if(ev.target.closest('#pass')&&S&&!S.over){S=E.applyMove(S,{type:'pass'});sel=null;render();}});
  
    c.innerHTML=h;
    var end=$('end');
    if(end){if(S.over){var a=E.scoreOf?E.scoreOf(S,0):S.players[0].score,b=E.scoreOf?E.scoreOf(S,1):S.players[1].score;end.innerHTML='<div class="over"><b>'+(a>b?'你获胜':a<b?'AI 获胜':'平局')+'</b><br>你 '+a+' 分 · AI '+b+' 分<br><button class="btn" id="again" aria-label="再来一局" style="margin-top:8px">再来一局</button></div>';}else{end.innerHTML='';}}
    if(S&&!S.over&&S.current===1){setTimeout(function(){if(!S||S.over||S.current!==1)return;try{var m=E.chooseAIMove(S);if(m)S=E.applyMove(S,m);}catch(e){}render();},380);}
  }

  function boot(){S=E.createGame(1);render();}
  document.addEventListener('click',function(){setTimeout(function(){if(S&&S.over){var e=document.getElementById('end');if(e&&!e.innerHTML){var a=E.scoreOf?E.scoreOf(S,0):S.players[0].score,b=E.scoreOf?E.scoreOf(S,1):S.players[1].score;e.innerHTML='<div class="over"><b>'+(a>b?'你获胜':a<b?'AI 获胜':'平局')+'</b><br>你 '+a+' 分 · AI '+b+' 分<br><button class="btn" id="again" aria-label="再来一局" style="margin-top:8px">再来一局</button></div>';}}},0);});
  document.addEventListener('click',function(ev){if(ev.target.closest('#again')){S=E.createGame((Math.random()*1e9)|0);sel=null;document.getElementById('end').innerHTML='';render();}});
  boot();
})();
</script></body></html>
