<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, viewport-fit=cover">
<title>PIONEERS art composition</title>
<style>
#stage,.stage{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  :root{
    --font-serif:"Songti SC","Iowan Old Style","Palatino Linotype","Noto Serif SC",Georgia,serif;
    --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
    --art-tile:url("../../assets/art/premium/pioneers/hex-tile.webp");
    --art-felt:url("../../assets/art/premium/pioneers/table-felt.webp");
    --art-wheat:url("../../assets/art/premium/pioneers/resource-wheat.webp");
    --art-stone:url("../../assets/art/premium/pioneers/resource-stone.webp");
    --art-wood:url("../../assets/art/premium/pioneers/resource-wood.webp");
    --art-road:url("../../assets/art/premium/pioneers/road-stick.webp");
    --art-house:url("../../assets/art/premium/pioneers/settlement-house.webp");
    --ink:#f4ead6;--muted:#c1cbbd;--soft:#8ea28f;--gold:#e6c07a;--gold2:#f3dca9;
    --p1:#c44536;--p2:#2f6fb0;--p3:#3f8f62;--p4:#c98a2e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#080f0c}
  body{width:1200px;height:1200px;overflow:hidden;color:var(--ink);font-family:var(--font-sans)}
  .stage{position:absolute;inset:0;overflow:hidden;background:
    radial-gradient(900px 700px at 16% 0%,rgba(72,112,92,.55),transparent 60%),
    radial-gradient(900px 760px at 100% 100%,rgba(89,63,28,.42),transparent 62%),
    linear-gradient(155deg,#17261f,#080f0c 72%)}
  .stage::before{content:"";position:absolute;inset:0;background:var(--art-felt) center/cover no-repeat;opacity:.22;filter:saturate(.8) contrast(1.1);mix-blend-mode:soft-light}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 34%,rgba(0,0,0,.52) 100%);pointer-events:none}
  .frame{position:absolute;inset:26px;border:1px solid rgba(230,192,122,.42);border-radius:28px;box-shadow:inset 0 0 0 7px rgba(230,192,122,.05),0 40px 100px rgba(0,0,0,.55);pointer-events:none;z-index:9}
  .frame::before,.frame::after{content:"";position:absolute;width:62px;height:62px;border:2px solid rgba(230,192,122,.5)}
  .frame::before{left:14px;top:14px;border-right:0;border-bottom:0;border-radius:17px 0 0 0}
  .frame::after{right:14px;bottom:14px;border-left:0;border-top:0;border-radius:0 0 17px 0}
  .content{position:absolute;inset:62px;z-index:3;display:flex;flex-direction:column}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:22px}
  .brand{display:flex;align-items:center;gap:18px}
  .seal{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;flex:none;
    background:radial-gradient(circle at 34% 27%,rgba(255,245,220,.55),transparent 40%),linear-gradient(150deg,#d0a45c,#8a5f2c 70%,#5c3917);
    border:1px solid rgba(247,223,174,.62);font-family:var(--font-serif);font-weight:700;font-size:30px;color:#2d1a09;
    box-shadow:0 20px 42px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.45);transform:rotate(-3deg)}
  h1{margin:0;font-family:var(--font-serif);font-weight:700;line-height:.95;letter-spacing:.12em;font-size:92px;text-shadow:0 14px 44px rgba(0,0,0,.5)}
  h1 span{color:var(--gold2);font-size:.42em;letter-spacing:.2em;margin-left:.18em}
  .sub{margin:14px 0 0;font-size:16px;letter-spacing:.28em;color:var(--muted);font-weight:600}
  .chips{display:flex;flex-direction:column;gap:9px;align-items:flex-end}
  .chip{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:999px;border:1px solid rgba(230,192,122,.36);background:rgba(16,24,20,.62);color:var(--gold2);font-size:14px;letter-spacing:.05em;font-weight:700;white-space:nowrap}
  .main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
  .board-wrap{position:relative;width:730px;padding:16px;border-radius:30px;border:1px solid rgba(230,192,122,.4);
    background:linear-gradient(155deg,rgba(20,42,34,.7),rgba(8,16,13,.88)),var(--art-tile) center/cover no-repeat;
    box-shadow:0 46px 90px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.13),inset 0 -3px 0 rgba(0,0,0,.5)}
  .board-wrap::before{content:"";position:absolute;inset:9px;border:1px solid rgba(230,192,122,.2);border-radius:22px;pointer-events:none}
  .board{position:relative;width:100%;aspect-ratio:9.3/8.7;z-index:1}
  .board svg{display:block;width:100%;height:100%}
  .footer{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
  .note{font-size:15px;letter-spacing:.13em;color:var(--muted);font-weight:600}
  .note b{color:var(--gold2)}
  .ruler{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;letter-spacing:.06em}
  .ruler i{display:block;width:180px;height:1px;background:linear-gradient(90deg,rgba(230,192,122,.7),transparent);font-style:normal}

  /* OG */
  body.og{height:630px}
  body.og .content{inset:42px 54px}
  body.og h1{font-size:64px}
  body.og .seal{width:58px;height:58px;font-size:23px}
  body.og .sub{margin-top:10px;font-size:13px;letter-spacing:.2em}
  body.og .chip{height:32px;font-size:12px;padding:0 13px}
  body.og .layout{display:grid;grid-template-columns:1fr 620px;gap:24px;flex:1;align-items:center}
  body.og .board-wrap{width:600px;padding:12px;border-radius:24px}
  body.og .footer{position:absolute;left:0;right:0;bottom:0}
  body.og .chips{flex-direction:row;flex-wrap:wrap;align-items:center}
  .caption{font-size:14px;line-height:1.75;color:var(--muted);max-width:430px}
  .caption b{color:var(--gold2)}

  /* detail */
  body.detail{height:800px}
  body.detail .content{inset:46px 54px}
  body.detail h1{font-size:56px}
  body.detail .seal{width:52px;height:52px;font-size:20px}
  body.detail .sub{margin-top:8px;font-size:13px;letter-spacing:.2em}
  body.detail .chip{height:30px;font-size:12px;padding:0 12px}
  body.detail .main{padding:8px 0}
  body.components .main{display:block;flex:1;min-height:0;padding:10px 0 0;overflow:visible}
  body.components .detail-body{display:flex;flex-direction:column;gap:14px;width:100%;height:100%}
  body.components .materials{gap:16px}
  body.components .mat .imgbox{height:196px;aspect-ratio:auto;display:flex;align-items:center;justify-content:center;padding:6px}
  body.components .mat img{width:100%;height:100%;object-fit:contain}
  body.components .tint{height:146px;aspect-ratio:auto;display:flex;align-items:center;justify-content:center}
  body.components .tint img{width:100%;height:100%;object-fit:contain}
  body.components .spec{gap:6px 14px}
  body.components .spec div{padding:4px 0;font-size:13.5px}
  body.components .spec .wide{grid-column:span 2}
  body.detail .board-wrap{width:650px;padding:13px;border-radius:24px}
  body.detail .layout{display:grid;grid-template-columns:1fr 390px;gap:24px;flex:1;align-items:center;width:100%}
  body.detail .side{display:flex;flex-direction:column;gap:13px;min-width:0}
  body.detail .panel{border:1px solid rgba(230,192,122,.32);border-radius:18px;background:rgba(16,26,22,.76);padding:15px 17px}
  body.detail .panel h2{margin:0 0 8px;font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  body.detail .rowline{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px dashed rgba(230,192,122,.16);gap:10px}
  body.detail .rowline b{color:var(--gold2);text-align:right}
  body.detail .materials{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;width:100%}
  body.detail .mat{display:flex;flex-direction:column;align-items:center;gap:8px}
  body.detail .mat .imgbox{width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;border:1px solid rgba(230,192,122,.28);background:#f4ecdc;box-shadow:0 12px 24px rgba(0,0,0,.28)}
  body.detail .mat img{display:block;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
  body.detail .mat .cap{font-size:13px;color:var(--muted);text-align:center;line-height:1.5}
  body.detail .mat .cap b{color:var(--gold2)}
  body.detail .tints{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%}
  body.detail .tint{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid rgba(230,192,122,.24);box-shadow:0 10px 20px rgba(0,0,0,.24)}
  body.detail .tint img{display:block;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
  body.detail .tint .lab{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;background:rgba(8,15,12,.72);font-size:12px;font-weight:800;text-align:center;color:#f4ead6}
  body.detail .spec{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;width:100%}
  body.detail .spec div{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:5px 0;border-bottom:1px dashed rgba(230,192,122,.16)}
  body.detail .spec b{color:var(--gold2)}
  body.detail .wide{grid-column:span 2}
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/pioneers-premium/art-render.html">
<meta name="description" content="内部美术合成页：用代码绘制棋盘、棋子与牌面，生成封面 / OG / 详情图；不参与游戏入口。">
<meta name="robots" content="noindex">

<body>
<div class="stage"></div>
<div class="vignette"></div>
<div class="frame"></div>
<div class="content" id="content"></div>

<script src="../../shared/shuffle.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.PioneersPremiumEngine;
  var SHOT = new URLSearchParams(location.search).get('shot') || 'cover';
  var TERRAIN_FILL = { wheat: 'url(#gWheat)', stone: 'url(#gStone)', wood: 'url(#gWood)', neutral: 'url(#gNeutral)' };
  var TERRAIN_STROKE = { wheat: '#8f6a25', stone: '#5d635f', wood: '#3d5635', neutral: '#7e9a95' };

  function pt(key) { var p = key.split(','); return { x: Number(p[0]), y: Number(p[1]) }; }
  function poly(h) { return h.vertices.map(function (k) { var p = pt(k); return p.x + ',' + p.y; }).join(' '); }
  function txt(x, y, s, size, fill, weight) {
    return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" font-weight="' + (weight || 700) + '" fill="' + fill + '" text-anchor="middle" font-family="Songti SC, serif">' + s + '</text>';
  }
  function icon(h, cx, cy) {
    if (h.terrain === 'wheat') {
      return '<g transform="translate(' + cx + ',' + cy + ')" stroke="#6d4d18" stroke-width="0.032" stroke-linecap="round"><path d="M0 0.3 L-0.12 -0.1 M0 0.3 L0 -0.14 M0 0.3 L0.12 -0.1" fill="none"/><ellipse cx="0" cy="-0.22" rx="0.05" ry="0.08" fill="#ecc766"/><ellipse cx="-0.13" cy="-0.18" rx="0.045" ry="0.075" fill="#e8c05e"/><ellipse cx="0.13" cy="-0.18" rx="0.045" ry="0.075" fill="#e8c05e"/><ellipse cx="-0.2" cy="-0.06" rx="0.04" ry="0.065" fill="#e8c05e"/><ellipse cx="0.2" cy="-0.06" rx="0.04" ry="0.065" fill="#e8c05e"/></g>';
    }
    if (h.terrain === 'stone') {
      return '<g transform="translate(' + cx + ',' + cy + ')" stroke="#5c625e" stroke-width="0.025"><path d="M-0.28 0.18 L-0.17 -0.08 L0 0.02 L-0.08 0.24 Z" fill="#a9aca7"/><path d="M-0.08 0.22 L0.04 -0.1 L0.24 0.02 L0.15 0.24 Z" fill="#8f948f"/><path d="M0.1 0.2 L0.22 -0.02 L0.34 0.1 L0.26 0.24 Z" fill="#b7b9b3"/><path d="M-0.17 -0.08 L-0.1 -0.16 L0 0.02" fill="none" stroke="#e2e2db" stroke-width="0.02" opacity=".65"/></g>';
    }
    if (h.terrain === 'wood') {
      return '<g transform="translate(' + cx + ',' + cy + ')"><rect x="-0.32" y="-0.08" width="0.54" height="0.18" rx="0.08" fill="#8b6842" stroke="#4f3820" stroke-width="0.022"/><circle cx="-0.3" cy="0.01" r="0.08" fill="#cda671" stroke="#5d4527" stroke-width="0.02"/><circle cx="-0.3" cy="0.01" r="0.036" fill="none" stroke="#8d6a3e" stroke-width="0.012"/><rect x="-0.24" y="0.11" width="0.5" height="0.17" rx="0.08" fill="#7a5a37" stroke="#46311a" stroke-width="0.022"/><circle cx="-0.22" cy="0.19" r="0.075" fill="#c39a64" stroke="#543d22" stroke-width="0.02"/><circle cx="-0.22" cy="0.19" r="0.032" fill="none" stroke="#856139" stroke-width="0.012"/></g>';
    }
    return '<g transform="translate(' + cx + ',' + cy + ')" stroke="#4f7470" stroke-width="0.034" stroke-linecap="round"><path d="M0 -0.3 V0.3 M-0.26 -0.15 L0.26 0.15 M-0.26 0.15 L0.26 -0.15"/><path d="M-0.08 -0.2 L0 -0.27 L0.08 -0.2" fill="none"/></g>';
  }
  function token(h, cx, cy) {
    if (h.number == null) return txt(cx, cy + 0.47, '霜洞', 0.2, '#41625e', 800);
    var hot = h.number === 6 || h.number === 8, y = cy + 0.37;
    var out = '<circle cx="' + cx + '" cy="' + y + '" r="0.34" fill="#f4e7c8" stroke="#6b4a22" stroke-width="0.028"/>';
    out += '<circle cx="' + cx + '" cy="' + y + '" r="0.28" fill="none" stroke="#c9b184" stroke-width="0.012"/>';
    out += txt(cx, y + 0.12, String(h.number), 0.34, hot ? '#a93225' : '#2b2418', 900);
    var pips = h.pips || 0, total = (pips - 1) * 0.055;
    for (var i = 0; i < pips; i++) out += '<circle cx="' + (cx - total / 2 + i * 0.055).toFixed(3) + '" cy="' + (y + 0.265).toFixed(3) + '" r="0.018" fill="' + (hot ? '#a93225' : '#5b4223') + '"/>';
    return out;
  }
  function road(e, color) {
    var a = pt(e.vertices[0]), b = pt(e.vertices[1]);
    return '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="#16120b" stroke-width="0.17" stroke-linecap="round"/><line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="' + color + '" stroke-width="0.105" stroke-linecap="round"/><line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="#fff" stroke-width="0.022" stroke-linecap="round" opacity=".3"/>';
  }
  function villagePiece(v, color) {
    return '<g class="village" data-color="' + color + '" transform="translate(' + v.x + ',' + v.y + ') scale(0.94)">' +
      '<ellipse cx="0.04" cy="0.25" rx="0.31" ry="0.09" fill="#000" opacity=".24"/>' +
      '<rect x="0.11" y="-0.27" width="0.08" height="0.12" fill="#6b4a2a" stroke="#2a1d10" stroke-width="0.018"/>' +
      '<path d="M-0.33 0.04 L-0.21 -0.2 L0.21 -0.2 L0.33 0.04 Z" fill="' + color + '" stroke="#17130d" stroke-width="0.035" stroke-linejoin="round"/>' +
      '<rect x="-0.2" y="0.03" width="0.4" height="0.2" rx="0.015" fill="' + color + '" stroke="#17130d" stroke-width="0.03"/>' +
      '<rect x="-0.2" y="0.03" width="0.4" height="0.055" fill="#fff" opacity=".12"/>' +
      '<rect x="-0.04" y="0.1" width="0.08" height="0.13" rx="0.01" fill="#3a2a18"/>' +
      '</g>';
  }
  function cityPiece(v, color) {
    return '<g class="city" data-color="' + color + '" transform="translate(' + v.x + ',' + v.y + ')">' +
      '<ellipse cx="0.04" cy="0.27" rx="0.42" ry="0.1" fill="#000" opacity=".28"/>' +
      // outer wall
      '<rect x="-0.37" y="0.02" width="0.74" height="0.22" rx="0.02" fill="' + color + '" stroke="#17130d" stroke-width="0.035"/>' +
      // crenellations along the wall
      '<rect x="-0.33" y="-0.05" width="0.1" height="0.08" fill="' + color + '" stroke="#17130d" stroke-width="0.018"/>' +
      '<rect x="-0.11" y="-0.05" width="0.1" height="0.08" fill="' + color + '" stroke="#17130d" stroke-width="0.018"/>' +
      '<rect x="0.11" y="-0.05" width="0.1" height="0.08" fill="' + color + '" stroke="#17130d" stroke-width="0.018"/>' +
      '<rect x="0.29" y="-0.05" width="0.08" height="0.08" fill="' + color + '" stroke="#17130d" stroke-width="0.018"/>' +
      // left tower + roof
      '<rect x="-0.47" y="-0.19" width="0.18" height="0.25" fill="' + color + '" stroke="#17130d" stroke-width="0.03"/>' +
      '<path d="M-0.5 -0.19 L-0.47 -0.32 L-0.29 -0.32 L-0.26 -0.19 Z" fill="' + color + '" stroke="#17130d" stroke-width="0.028" stroke-linejoin="round"/>' +
      // right tower + roof
      '<rect x="0.29" y="-0.19" width="0.18" height="0.25" fill="' + color + '" stroke="#17130d" stroke-width="0.03"/>' +
      '<path d="M0.26 -0.19 L0.29 -0.32 L0.47 -0.32 L0.5 -0.19 Z" fill="' + color + '" stroke="#17130d" stroke-width="0.028" stroke-linejoin="round"/>' +
      // central keep + roof
      '<rect x="-0.13" y="-0.3" width="0.26" height="0.36" fill="' + color + '" stroke="#17130d" stroke-width="0.032"/>' +
      '<path d="M-0.17 -0.3 L-0.13 -0.43 L0.13 -0.43 L0.17 -0.3 Z" fill="' + color + '" stroke="#17130d" stroke-width="0.028" stroke-linejoin="round"/>' +
      // gate + windows
      '<path d="M-0.055 0.24 L-0.055 0.13 Q0 0.055 0.055 0.13 L0.055 0.24 Z" fill="#3a2a18"/>' +
      '<rect x="-0.39" y="-0.08" width="0.055" height="0.07" fill="#f3dca9" opacity=".9"/>' +
      '<rect x="0.335" y="-0.08" width="0.055" height="0.07" fill="#f3dca9" opacity=".9"/>' +
      '<rect x="-0.045" y="-0.22" width="0.09" height="0.09" fill="#f3dca9" opacity=".9"/>' +
      '</g>';
  }
  function house(v, color, city) { return city ? cityPiece(v, color) : villagePiece(v, color); }

  function boardSvg(state) {
    var s = '<defs>' +
      '<linearGradient id="gWheat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3c06d"/><stop offset="1" stop-color="#b78a35"/></linearGradient>' +
      '<linearGradient id="gStone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9bbb4"/><stop offset="1" stop-color="#7f857f"/></linearGradient>' +
      '<linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f9c63"/><stop offset="1" stop-color="#4a6540"/></linearGradient>' +
      '<linearGradient id="gNeutral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dce9e5"/><stop offset="1" stop-color="#a9c0bb"/></linearGradient>' +
      '<pattern id="paperTex" patternUnits="userSpaceOnUse" width="1.6" height="1.6"><image href="../../assets/art/premium/pioneers/hex-tile.webp" x="-0.8" y="-0.8" width="3.2" height="3.2" preserveAspectRatio="xMidYMid slice"/></pattern>' +
      '</defs><rect x="-4.65" y="-4.35" width="9.3" height="8.7" fill="rgba(7,20,16,.16)"/>';
    s += '<g opacity=".28" transform="translate(0.07,0.1)">';
    state.board.hexList.forEach(function (h) { s += '<polygon points="' + poly(h) + '" fill="#07120e"/>'; });
    s += '</g>';
    state.board.hexList.forEach(function (h) {
      s += '<polygon points="' + poly(h) + '" fill="' + TERRAIN_FILL[h.terrain] + '" stroke="' + TERRAIN_STROKE[h.terrain] + '" stroke-width="0.035" stroke-linejoin="round"/>';
      s += '<polygon points="' + poly(h) + '" fill="url(#paperTex)" opacity=".18" style="mix-blend-mode:multiply"/>';
      s += '<polygon points="' + poly(h) + '" fill="none" stroke="#fff8e6" stroke-width="0.012" opacity=".35"/>';
      s += icon(h, h.x, h.y - 0.34);
      s += token(h, h.x, h.y);
    });
    state.board.ports.forEach(function (port) {
      var edge = null;
      state.board.edges.forEach(function (e) { if (e.key === port.edge) edge = e; });
      if (!edge) return;
      var a = pt(edge.vertices[0]), b = pt(edge.vertices[1]);
      s += '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="#f3dca9" stroke-width="0.09" stroke-dasharray="0.16 0.1" opacity=".9"/>';
      var mx = port.mid.x, my = port.mid.y, len = Math.sqrt(mx * mx + my * my) || 1;
      var bx = mx + mx / len * 0.52, by = my + my / len * 0.52;
      s += '<line x1="' + mx + '" y1="' + my + '" x2="' + bx + '" y2="' + by + '" stroke="#f3dca9" stroke-width="0.045"/>';
      s += '<circle cx="' + bx + '" cy="' + by + '" r="0.42" fill="#f4e7c8" stroke="#8a6a3a" stroke-width="0.035"/>';
      s += '<path d="M' + (bx - 0.16) + ' ' + (by - 0.12) + ' a0.16 0.16 0 0 0 0.32 0" fill="none" stroke="#5b4324" stroke-width="0.035" stroke-linecap="round"/>';
      s += '<path d="M' + bx + ' ' + (by - 0.26) + ' v0.16 M' + (bx - 0.07) + ' ' + (by - 0.2) + ' h0.14" stroke="#5b4324" stroke-width="0.03" stroke-linecap="round"/>';
      s += txt(bx, by + 0.27, '2:1', 0.26, '#4a351a', 900);
    });
    state.players.forEach(function (p) {
      p.roads.forEach(function (ek) {
        var e = null;
        state.board.edges.forEach(function (x) { if (x.key === ek) e = x; });
        if (e) s += road(e, p.color);
      });
    });
    state.players.forEach(function (p) {
      p.settlements.forEach(function (vk) {
        var v = null;
        state.board.vertices.forEach(function (x) { if (x.key === vk) v = x; });
        if (v) s += house(v, p.color, false);
      });
      p.cities.forEach(function (vk) {
        var v = null;
        state.board.vertices.forEach(function (x) { if (x.key === vk) v = x; });
        if (v) s += house(v, p.color, true);
      });
    });
    return s;
  }

  function setupState(seed, players) {
    var g = E.createGame({ players: players, humans: 0, seed: seed });
    var guard = 0;
    while (g.phase === 'setup' && guard++ < 40) {
      var a = E.aiAction(g, 2);
      if (!a) break;
      E.applyAction(g, a);
    }
    return g;
  }
  function midState(seed, players) {
    var g = E.createGame({ players: players, humans: 0, seed: seed });
    var guard = 0;
    while (g.phase !== 'over' && g.round < 6 && guard++ < 1200) {
      var a = E.aiAction(g, 3);
      if (!a) break;
      E.applyAction(g, a);
    }
    return g;
  }

  var content = document.getElementById('content');
  var setup = setupState(25, 2);
  var setup2 = setupState(12, 2);
  var mid = midState(4, 2);

  function sumBuildings(g, key) {
    return g.players.reduce(function (n, p) { return n + p[key].length; }, 0);
  }
  var pointyTop = setup.hexList.every(function (h) {
    var ys = h.vertices.map(function (k) { return pt(k).y; });
    var max = Math.max.apply(null, ys), min = Math.min.apply(null, ys);
    return ys.filter(function (y) { return Math.abs(y - max) < 1e-6; }).length === 1 &&
      ys.filter(function (y) { return Math.abs(y - min) < 1e-6; }).length === 1;
  });
  window.__artStats = {
    orientation: pointyTop ? 'pointy-top' : 'flat-top',
    rows: [2, 1, 0, -1, -2].map(function (r) { return setup.hexList.filter(function (h) { return h.r === r; }).length; }),
    setupSettlements: sumBuildings(setup, 'settlements'),
    setupRoads: sumBuildings(setup, 'roads'),
    setupPlayers: setup.players.length,
    hexes: setup.hexList.length,
    ports: setup.ports.length
  };

  function scoreLine(g) {
    return g.players.map(function (p) { return p.name + ' ' + p.score; }).join(' · ');
  }

  if (SHOT === 'cover') {
    document.body.className = 'cover';
    content.innerHTML =
      '<div class="top"><div class="brand"><div class="seal">拓</div><div><h1>拓荒者<span>九岛</span></h1>' +
      '<p class="sub">19 HEXES · 3 RESOURCES · 4 TIDEGATES</p></div></div>' +
      '<div class="chips"><span class="chip">2–4 人 · 德式经营</span><span class="chip">先到 8 分或 12 回合</span></div></div>' +
      '<div class="main"><div class="board-wrap"><div class="board"><svg viewBox="-4.65 -4.35 9.3 8.7">' + boardSvg(setup) + '</svg></div></div></div>' +
      '<div class="footer"><div class="note"><b>2 人蛇形开局</b> · ' + window.__artStats.setupSettlements + ' 村庄 + ' + window.__artStats.setupRoads + ' 道路 · 第二村庄给资源</div>' +
      '<div class="ruler"><i></i>pointy-top · 3-4-5-4-3 · 19 六边形 · 4 座 2:1 潮门</div></div>';
  } else if (SHOT === 'og') {
    document.body.className = 'og';
    content.innerHTML =
      '<div class="layout"><div><div class="top"><div class="brand"><div class="seal">拓</div><div><h1>拓荒者</h1>' +
      '<p class="sub">九岛 · 资源经营</p></div></div></div>' +
      '<p class="caption" style="margin-top:20px">19 块尖顶六边形、麦石木三种资源、四座 2:1 潮门。蛇形开局、掷骰产出、铺路建村庄与城市；先到 8 分，或 12 回合后分高者胜。</p>' +
      '<div class="chips" style="margin-top:16px"><span class="chip">2–4 人</span><span class="chip">三档 AI</span><span class="chip">联机 + AI 补位</span></div></div>' +
      '<div class="board-wrap"><div class="board"><svg viewBox="-4.65 -4.35 9.3 8.7">' + boardSvg(setup2) + '</svg></div></div></div>';
  } else if (SHOT === 'detail1') {
    document.body.className = 'detail';
    content.innerHTML =
      '<div class="top"><div class="brand"><div class="seal">局</div><div><h1>中盘</h1>' +
      '<p class="sub">道路接网络 · 村庄隔交点 · 村庄产 3 · 城市产 5</p></div></div>' +
      '<div class="chips"><span class="chip">第 ' + Math.min(mid.round, mid.maxRounds) + ' / 12 回合</span><span class="chip">' + scoreLine(mid) + '</span></div></div>' +
      '<div class="main"><div class="layout"><div class="board-wrap"><div class="board"><svg viewBox="-4.65 -4.35 9.3 8.7">' + boardSvg(mid) + '</svg></div></div>' +
      '<div class="side"><div class="panel"><h2>局面</h2>' +
      '<div class="rowline"><span>地形</span><b>6 麦 / 6 石 / 6 木 / 1 霜洞</b></div>' +
      '<div class="rowline"><span>点数</span><b>18 个 · 2–12 不含 7</b></div>' +
      '<div class="rowline"><span>潮门</span><b>4 座 · 2:1</b></div>' +
      '<div class="rowline"><span>当前行动</span><b>' + mid.players[mid.current].name + '</b></div></div>' +
      '<div class="panel"><h2>分数与建筑</h2>' +
      mid.players.map(function (p) {
        return '<div class="rowline"><span>' + p.name + '</span><b>' + p.score + ' 分 · 村 ' + p.settlements.length + ' · 城 ' + p.cities.length + ' · 路 ' + p.roads.length + '</b></div>';
      }).join('') +
      '</div><div class="panel"><h2>产出</h2><div class="rowline"><span>村庄</span><b>3 / 匹配地块</b></div>' +
      '<div class="rowline"><span>城市</span><b>5 / 匹配地块</b></div>' +
      '<div class="rowline"><span>点数 7</span><b>霜洞寂静 · 不产资源</b></div></div></div></div></div>';
  } else {
    document.body.className = 'detail components';
    content.innerHTML =
      '<div class="top"><div class="brand"><div class="seal">材</div><div><h1>配件与材质</h1>' +
      '<p class="sub">57mm 六边形 · 浅枫木道路与村庄 · 三种资源标记</p></div></div>' +
      '<div class="chips"><span class="chip">Songti SC 700</span><span class="chip">图标由代码绘制</span></div></div>' +
      '<div class="main"><div class="detail-body">' +
      '<div class="materials">' +
      '<div class="mat"><div class="imgbox"><img src="../../assets/art/premium/pioneers/resource-wheat.webp" alt="麦资源标记"></div><div class="cap"><b>麦</b><br>麦田产出</div></div>' +
      '<div class="mat"><div class="imgbox"><img src="../../assets/art/premium/pioneers/resource-stone.webp" alt="石资源标记"></div><div class="cap"><b>石</b><br>石山产出</div></div>' +
      '<div class="mat"><div class="imgbox"><img src="../../assets/art/premium/pioneers/resource-wood.webp" alt="木资源标记"></div><div class="cap"><b>木</b><br>林地产出</div></div>' +
      '</div>' +
      '<div class="tints" style="margin-top:18px">' +
      ['#c44536|赤帆', '#2f6fb0|蓝港', '#3f8f62|青禾', '#c98a2e|金穗'].map(function (item) {
        var p = item.split('|');
        return '<div class="tint" style="background:' + p[0] + '"><img src="../../assets/art/premium/pioneers/settlement-house.webp" alt="可染色的村庄木件"><div class="lab">' + p[1] + '</div></div>';
      }).join('') +
      '</div>' +
      '<div class="spec" style="margin-top:18px">' +
      '<div><span>六边形</span><b>19 块 · 3-4-5-4-3</b></div>' +
      '<div><span>地形</span><b>6 麦 / 6 石 / 6 木 / 1 霜洞</b></div>' +
      '<div><span>边长 / 厚度</span><b>57mm / 2.4mm</b></div>' +
      '<div><span>交点 / 边</span><b>54 / 72</b></div>' +
      '<div><span>道路</span><b>40×8×6mm · 每人 10</b></div>' +
      '<div><span>村庄 / 城市</span><b>5 / 3 · 1 / 2 分</b></div>' +
      '<div class="wide"><span>材质</span><b>压纸板地块 · 浅枫木道路与村庄 · 深青绿羊毛毡桌面</b></div>' +
      '</div></div></div>';
  }
})();
</script>
</body>
</html>
