<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101a17'/%3E%3Cpath d='M32 8 51 19v22L32 52 13 41V19z' fill='%23c9a24a' stroke='%23e6c07a' stroke-width='2'/%3E%3Cpath d='M32 20 41 25v12l-9 5-9-5V25z' fill='%235f7d4e'/%3E%3Ccircle cx='32' cy='31' r='6' fill='%23f4e7c8' stroke='%236b4a22' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root{
    --art-tile:url("../../assets/art/premium/pioneers/hex-tile.webp");
    --art-wheat:url("../../assets/art/premium/pioneers/resource-wheat.webp");
    --art-stone:url("../../assets/art/premium/pioneers/resource-stone.webp");
    --art-wood:url("../../assets/art/premium/pioneers/resource-wood.webp");
    --art-felt:url("../../assets/art/premium/pioneers/table-felt.webp");
    --art-road:url("../../assets/art/premium/pioneers/road-stick.webp");
    --art-house:url("../../assets/art/premium/pioneers/settlement-house.webp");
    --font-serif:"Songti SC","Iowan Old Style","Palatino Linotype","Noto Serif SC",Georgia,serif;
    --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --bg:#0d1613;--bg2:#14231e;--panel:rgba(23,37,33,.94);--panel2:rgba(33,52,45,.86);
    --line:rgba(230,192,122,.26);--line2:rgba(230,192,122,.5);
    --ink:#f4ead6;--muted:#b9c6b7;--soft:#8ea28f;
    --gold:#e6c07a;--gold2:#f3dca9;--green:#74d0a5;--sky:#8cc6ff;--danger:#ff9580;
    --wheat:#d8a84e;--stone:#9b9a94;--wood:#8b6842;--neutral:#c3d6d2;
    --p1:#c44536;--p2:#2f6fb0;--p3:#3f8f62;--p4:#c98a2e;
    --shadow:0 22px 50px rgba(0,0,0,.45);--radius:20px;--tap:48px;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;color:var(--ink);font:16px/1.5 var(--font-sans);
    background:
      radial-gradient(860px 520px at 50% -16%,rgba(72,112,92,.5),transparent 64%),
      radial-gradient(700px 460px at 100% 106%,rgba(89,63,28,.42),transparent 62%),
      linear-gradient(168deg,var(--bg2),var(--bg) 64%);
    background-color:var(--bg);background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.14;
    background:var(--art-felt) center/cover no-repeat;mix-blend-mode:soft-light;
  }
  a{color:var(--gold);text-decoration:none}
  button{font:inherit;color:inherit}
  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:10px 12px 40px}
  .top{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
  .top .brand{flex:1;min-width:0;text-align:center}
  .brand h1{margin:0;font-family:var(--font-serif);font-weight:700;font-size:20px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand p{margin:1px 0 0;font-size:12px;color:var(--muted);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;
    padding:0 11px;border-radius:13px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;
    box-shadow:0 4px 0 rgba(0,0,0,.22);touch-action:manipulation;flex:none;
  }
  .icon-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
  .icon-btn:focus-visible,button:focus-visible,.vhot:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

  .players{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:7px;margin-bottom:8px}
  .pcard{
    position:relative;display:block;min-width:0;padding:7px 10px 8px;border-radius:14px;
    border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));box-shadow:0 6px 14px rgba(0,0,0,.16);
  }
  .pcard.current{border-color:var(--green);box-shadow:inset 0 0 0 1px rgba(116,208,165,.55),0 6px 14px rgba(0,0,0,.2)}
  .pcard.you{border-color:var(--line2)}
  .pcard .row1{display:flex;align-items:center;gap:7px;min-width:0}
  .pcard .dot{width:15px;height:15px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 0 3px rgba(0,0,0,.18)}
  .pcard .name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .pcard .sub{margin-top:2px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .score{font-family:var(--font-serif);font-weight:700;font-size:22px;line-height:1;color:var(--gold2);flex:none}
  .pcard .tag{position:static;flex:none;font-size:12px;font-weight:800;color:var(--green);white-space:nowrap}

  .board-card{
    position:relative;border-radius:22px;padding:10px 10px 8px;border:1px solid rgba(230,192,122,.34);
    background:
      linear-gradient(155deg,rgba(20,40,32,.72),rgba(8,16,13,.9)),
      var(--art-tile) center/cover no-repeat;
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.42);
    overflow:hidden;
  }
  .board-card::before{content:"";position:absolute;inset:7px;border:1px solid rgba(230,192,122,.16);border-radius:16px;pointer-events:none}
  .board-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 4px 7px;position:relative;z-index:2}
  .badge{display:inline-flex;align-items:center;min-height:28px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.24);font-size:12px;font-weight:800;color:var(--gold2);white-space:nowrap}
  .badge.turn{color:var(--green);border-color:rgba(116,208,165,.42);background:rgba(116,208,165,.1)}
  .badge.warn{color:var(--wheat);border-color:rgba(216,168,78,.4)}
  .badge.over{color:var(--sky);border-color:rgba(140,198,255,.38)}

  .map-wrap{position:relative;width:100%;aspect-ratio:10.2/9.8;isolation:isolate}
  .map-wrap svg{display:block;width:100%;height:100%;overflow:visible}
  .vhot{position:absolute;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5;touch-action:manipulation;cursor:pointer}
  .vhot.legal{pointer-events:auto;background:radial-gradient(circle,rgba(116,208,165,.62) 0 28%,rgba(116,208,165,.14) 30% 100%);box-shadow:0 0 0 2px rgba(116,208,165,.75)}
  .map-wrap.mode-vertex .vhot.legal:focus-visible{outline:3px solid var(--sky);outline-offset:1px}
  .edge-hit{pointer-events:none}
  .map-wrap.mode-edge .edge-hit.legal{pointer-events:stroke;cursor:pointer}
  .map-wrap.mode-edge .edge-hit.legal:focus-visible{outline:none}
  .map-hint{display:flex;align-items:center;gap:7px;min-height:38px;margin-top:5px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-size:12.5px;color:var(--muted);position:relative;z-index:2}
  .map-hint b{color:var(--gold2)}
  .dotlive{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 4px rgba(116,208,165,.14);animation:pulse 1.9s ease-in-out infinite}
  .dotlive.wait{background:var(--gold);animation:none;box-shadow:0 0 0 4px rgba(230,192,122,.14)}
  .dotlive.over{background:var(--sky);animation:none}

  .turnbar{display:flex;align-items:stretch;gap:9px;margin-top:10px}
  .turnbar .primary{
    flex:1;min-height:56px;border-radius:15px;border:0;cursor:pointer;font-size:16px;font-weight:900;letter-spacing:.04em;
    background:linear-gradient(160deg,var(--gold2),#c69545);color:#251708;box-shadow:0 5px 0 rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.5);
    touch-action:manipulation;padding:0 14px;
  }
  .turnbar .primary:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.24)}
  .turnbar .primary:disabled{opacity:.42;cursor:default;transform:none}
  .turnbar .turninfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 10px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
  .turnbar .turninfo strong{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .turnbar .turninfo span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:9px}
  .res{
    display:flex;align-items:center;gap:8px;min-width:0;padding:8px;border-radius:14px;border:1px solid var(--line);
    background:linear-gradient(160deg,var(--panel2),var(--panel));box-shadow:0 5px 12px rgba(0,0,0,.16);
  }
  .res .icon{width:42px;height:42px;flex:none;border-radius:11px;border:1px solid rgba(255,255,255,.22);background-color:var(--tone);background-size:cover;background-position:center;background-blend-mode:multiply;box-shadow:inset 0 0 0 1px rgba(0,0,0,.24)}
  .res .lab{min-width:0;flex:1}
  .res .lab b{display:block;font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.02em;white-space:nowrap}
  .res .lab span{display:block;font-family:var(--font-serif);font-size:24px;line-height:1.05;font-weight:700;color:var(--gold2)}
  .res.wheat{--tone:#d8a84e}.res.stone{--tone:#9b9a94}.res.wood{--tone:#8b6842}
  .res.wheat .icon{background-image:var(--art-wheat)}
  .res.stone .icon{background-image:var(--art-stone)}
  .res.wood .icon{background-image:var(--art-wood)}

  .actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:6px}
  .actions button{
    min-height:52px;border-radius:13px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));
    font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;
    box-shadow:0 4px 0 rgba(0,0,0,.22);touch-action:manipulation;padding:0 5px;
  }
  .actions button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
  .actions button:disabled{opacity:.36;cursor:default;transform:none}
  .actions button.end{color:var(--gold2);border-color:var(--line2)}

  .panel{margin-top:10px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:11px 12px;box-shadow:0 10px 24px rgba(0,0,0,.2)}
  .panel[hidden]{display:none}
  .panel h2{margin:0 0 8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .optlist{display:grid;gap:7px;max-height:280px;overflow:auto}
  .optlist button{
    display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:7px 11px;
    border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.18);text-align:left;font-size:13px;font-weight:700;cursor:pointer;
  }
  .optlist button:active{background:rgba(230,192,122,.14)}
  .optlist button b{color:var(--gold2);font-size:13px;white-space:nowrap}
  .optlist .muted{color:var(--muted);font-weight:500;font-size:12px}
  .empty{font-size:12.5px;color:var(--muted);margin:2px 0}

  .trade-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .trade-col h3{margin:0 0 6px;font-size:12px;color:var(--muted);letter-spacing:.08em}
  .trade-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .trade-grid button{min-height:48px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.18);font-size:13px;font-weight:800;cursor:pointer}
  .trade-grid button[aria-pressed="true"]{background:linear-gradient(160deg,var(--gold),#b9873c);color:#241708;border-color:transparent}
  .trade-grid button:disabled{opacity:.35;cursor:default}
  .trade-foot{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:9px;flex-wrap:wrap}
  .trade-foot .rate{font-size:12.5px;color:var(--muted)}
  .trade-foot .rate b{color:var(--gold2)}
  .trade-foot button{min-height:48px;padding:0 16px;border-radius:12px;border:0;background:linear-gradient(160deg,var(--gold2),#c69545);color:#251708;font-weight:900;font-size:14px;cursor:pointer}
  .trade-foot button:disabled{opacity:.4;cursor:default}
  .err{color:var(--danger);font-size:12.5px;font-weight:800;min-height:16px;margin:6px 0 0}

  .lower{display:grid;grid-template-columns:1.04fr .96fr;gap:9px;margin-top:10px}
  .card{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:10px 12px;min-width:0}
  .card h2{margin:0 0 7px;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .log{list-style:none;margin:0;padding:0;max-height:150px;overflow:auto;display:grid;gap:1px}
  .log li{font-size:12.5px;color:var(--muted);padding:3px 0;border-bottom:1px dashed rgba(230,192,122,.14)}
  .log li:last-child{color:var(--ink);border-bottom:0}
  .log li::before{content:"›";color:var(--gold);margin-right:5px;font-weight:900}
  .legend{display:grid;gap:5px}
  .legend div{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed rgba(230,192,122,.12);padding:2px 0}
  .legend b{color:var(--ink);font-weight:700}

  .settings{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:rgba(0,0,0,.16)}
  .seg button{min-height:44px;min-width:46px;padding:0 10px;border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--gold);color:#241708}
  .opt-label{font-size:12px;color:var(--muted);font-weight:800;margin-right:2px}

  .banner{margin-top:10px;padding:13px 14px;border-radius:16px;text-align:center;border:1px solid rgba(230,192,122,.4);background:linear-gradient(160deg,rgba(230,192,122,.16),rgba(23,37,33,.92))}
  .banner[hidden]{display:none}
  .banner h3{margin:0 0 3px;font-family:var(--font-serif);font-size:23px;letter-spacing:.08em}
  .banner p{margin:0;font-size:13px;color:var(--muted)}
  .banner .row{display:flex;gap:8px;justify-content:center;margin-top:9px;flex-wrap:wrap}
  .banner button,.banner a{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}

  .foot{margin-top:14px;font-size:12.5px;color:var(--soft);text-align:center;line-height:1.7}
  .foot a{display:inline-flex;align-items:center;min-height:44px;padding:0 8px;font-weight:700}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;max-width:88vw;padding:10px 14px;border-radius:12px;background:rgba(23,37,33,.96);border:1px solid var(--line2);color:var(--ink);font-size:13px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s}
  .toast.on{opacity:1}
  .sfx-toggle{min-width:44px;min-height:44px}

  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
  @media (max-width:430px){
    .wrap{padding:8px 9px 30px}
    .brand h1{font-size:18px}
    .brand p{font-size:12px}
    .actions{grid-template-columns:repeat(5,minmax(0,1fr))}
    .actions button{font-size:12.5px;padding:0 3px}
    .lower{grid-template-columns:1fr}
    .turnbar{flex-direction:column}
    .turnbar .primary{min-height:54px}
    .trade-row{grid-template-columns:1fr}
  }
  @media (max-width:350px){
    .players{grid-template-columns:repeat(2,minmax(0,1fr))}
    .actions{grid-template-columns:repeat(3,minmax(0,1fr))}
    .icon-btn{min-width:44px;padding:0 8px;font-size:12px}
    .pcard .score{font-size:21px}
    .res .icon{width:36px;height:36px}
    .res .lab span{font-size:21px}
  }
/* safe-area: keep the original bottom padding, clear the iOS home indicator */
body{padding-bottom:env(safe-area-inset-bottom)}
</style>

<body>
<div class="wrap">
  <header class="top">
    <a class="icon-btn" href="../../index.html" aria-label="返回游戏大厅">← 大厅</a>
    <div class="brand">
      <h1>拓荒者 · 九岛</h1>
      <p>19 岛 · 麦石木 · 8 分 · 12 回合</p>
    </div>
    <a class="icon-btn" href="online.html" aria-label="进入联机房间">联机</a>
    <button class="sfx-toggle" type="button" aria-label="静音 / 开启声音"></button>
  </header>

  <main>
    <section class="players" id="scoreboard" aria-label="玩家分数"></section>

    <section class="board-card" aria-label="九岛地图">
      <div class="board-head">
        <span class="badge" id="roundBadge">第 1 / 12 回合</span>
        <span class="badge turn" id="stageBadge">蛇形摆放</span>
        <span class="badge warn" id="rateBadge">荒野集市 3:1</span>
      </div>
      <div class="map-wrap" id="mapWrap" data-mode="none">
        <svg id="map" viewBox="-5.1 -4.9 10.2 9.8" role="img" aria-label="19 块尖顶六边形组成的九岛地图"></svg>
      </div>
      <div class="map-hint"><i class="dotlive" id="liveDot"></i><span id="mapHint">蛇形摆放：先放一个村庄，再沿它放一条道路。</span></div>
    </section>

    <section class="turnbar" aria-label="回合操作">
      <button class="primary" id="primaryBtn" type="button">放村庄</button>
      <div class="turninfo">
        <strong id="turnTitle">赤帆（你）的回合</strong>
        <span id="turnSub">蛇形摆放第一轮 · 放村庄</span>
      </div>
    </section>

    <section class="hand" id="hand" aria-label="你的资源"></section>

    <section class="actions" aria-label="建造与交易">
      <button id="roadBtn" type="button">铺路</button>
      <button id="settlementBtn" type="button">建村庄</button>
      <button id="cityBtn" type="button">升级城市</button>
      <button id="tradeBtn" type="button">交易</button>
      <button id="endBtn" class="end" type="button">结束回合</button>
    </section>

    <section class="panel" id="picker" hidden>
      <h2 id="pickerTitle">选择位置</h2>
      <div class="optlist" id="pickerList"></div>
      <p class="err" id="pickerErr"></p>
    </section>

    <section class="panel" id="tradePanel" hidden>
      <h2>银行 / 潮门兑换</h2>
      <div class="trade-row">
        <div class="trade-col">
          <h3>付出</h3>
          <div class="trade-grid" id="giveGrid"></div>
        </div>
        <div class="trade-col">
          <h3>换得</h3>
          <div class="trade-grid" id="getGrid"></div>
        </div>
      </div>
      <div class="trade-foot">
        <span class="rate" id="tradeRate">当前比例 <b>3:1</b></span>
        <button id="tradeConfirm" type="button" disabled>确认兑换</button>
      </div>
      <p class="err" id="tradeErr"></p>
    </section>

    <section class="lower">
      <div class="card">
        <h2>对局记录</h2>
        <ul class="log" id="log"></ul>
      </div>
      <div class="card">
        <h2>建造费用</h2>

  function renderMap() {

    if (pickMode === 'vertex') pickActions.forEach(function (a) { legalV[a.vertex] = true; });
    if (pickMode === 'edge') pickActions.forEach(function (a) { legalE[a.edge] = true; });
    var frag = document.createDocumentFragment();
    state.board.vertices.forEach(function (v) {
      var d = document.createElement('div');
      d.className = 'vhot' + (legalV[v.key] ? ' legal' : '');

      d.setAttribute('data-vk', v.key);
      d.setAttribute('aria-label', '交点 ' + v.key + (legalV[v.key] ? '，可放置' : ''));

      line.setAttribute('x1', pt(e.vertices[0]).x);
      line.setAttribute('y1', pt(e.vertices[0]).y);
      line.setAttribute('x2', pt(e.vertices[1]).x);
      line.setAttribute('y2', pt(e.vertices[1]).y);
      line.setAttribute('stroke', 'transparent');
      line.setAttribute('stroke-width', '0.6');
      line.setAttribute('stroke-linecap', 'round');

  function renderScoreboard() {
    var html = '';
    state.players.forEach(function (p) {
      var you = p.id === PLAYER_HUMAN;
      var turn = state.phase !== 'over' && state.current === p.id;
      html += '<div class="pcard' + (turn ? ' current' : '') + (you ? ' you' : '') + '">' +
        '<div class="row1"><span class="dot" style="background:' + p.color + '"></span>' +
        '<div class="name">' + escapeHtml(p.name) + (you ? '（你）' : (p.ai ? ' · AI' : '')) + '</div>' +
        (turn ? '<span class="tag">行动</span>' : '') +
        '<span class="score">' + p.score + '</span></div>' +
        '<div class="sub">麦 ' + p.resources.wheat + ' · 石 ' + p.resources.stone + ' · 木 ' + p.resources.wood + ' · 路 ' + p.roads.length + '</div></div>';
    });
    $('scoreboard').innerHTML = html;
  }

  function renderHand() {
    var p = humanPlayer();
    var html = '';
    [['wheat', '麦'], ['stone', '石'], ['wood', '木']].forEach(function (r) {
      html += '<div class="res ' + r[0] + '"><span class="icon" aria-hidden="true"></span><span class="lab"><b>' + (r[0] === 'wheat' ? '麦田' : r[0] === 'stone' ? '石山' : '林地') + '</b><span>' + p.resources[r[0]] + '</span></span></div>';
    });
    $('hand').innerHTML = html;
  }

  function renderLog() {
    var logs = state.log.slice(-10).reverse();
    $('log').innerHTML = logs.map(function (line) { return '<li>' + escapeHtml(line) + '</li>'; }).join('');
  }

  function renderLegend() {
    $('legend').innerHTML =
      '<div><b>道路</b><span>1 木 + 1 石 · 最多 10</span></div>' +
      '<div><b>村庄</b><span>1 麦 + 1 石 + 1 木 · 1 分</span></div>' +
      '<div><b>城市</b><span>2 麦 + 3 石 · 2 分</span></div>' +
      '<div><b>兑换</b><span>3:1 · 潮门 2:1</span></div>';
  }

  function updateBadges() {
    $('roundBadge').textContent = state.phase === 'setup' ? '蛇形摆放 · 第 ' + state.setup.round + ' 轮' : '第 ' + state.round + ' / ' + state.maxRounds + ' 回合';
    var stage = state.phase === 'over' ? '已结束' : state.phase === 'setup' ? (state.setup.step === 'settlement' ? '村庄阶段' : '道路阶段') : (state.turnStage === 'roll' ? '掷骰' : '行动');
    $('stageBadge').textContent = stage;
    $('stageBadge').className = 'badge' + (state.phase === 'over' ? ' over' : (isHumanTurn() ? ' turn' : ''));
    var p = currentPlayer();
    $('rateBadge').textContent = E.tradeRate(state, p) === 2 ? '潮门 2:1' : '荒野集市 3:1';
    $('liveDot').className = 'dotlive' + (state.phase === 'over' ? ' over' : (isHumanTurn() ? '' : ' wait'));
  }

  function render() {
    if (!state) return;
    renderScoreboard();
    renderMap();
    renderHand();
    renderLog();
    renderLegend();
    updateBadges();
    renderTurn();
    renderActions();
    renderBanner();
  }

  function renderTurn() {
    var p = currentPlayer();
    var primary = $('primaryBtn');
    var title = $('turnTitle');
    var sub = $('turnSub');
    if (state.phase === 'over') {
      primary.disabled = true;
      primary.textContent = '对局结束';
      title.textContent = '对局结束';
      sub.textContent = state.result === 'draw' ? '并列收场' : '结果已写入记录';
      $('mapHint').textContent = '对局结束，查看结算或再来一局。';
      return;
    }
    if (state.phase === 'setup') {
      var human = isHumanTurn();
      primary.disabled = !human;
      primary.textContent = state.setup.step === 'settlement' ? '放村庄' : '铺道路';
      title.textContent = p.name + (p.ai ? '（AI）' : '（你）');
      sub.textContent = '蛇形摆放第 ' + state.setup.round + ' 轮 · 已放 ' + state.setup.index + ' / ' + state.setup.order.length;
      $('mapHint').innerHTML = human ? '点下方按钮打开位置列表，也可以直接点地图上的<b>绿色交点</b>。' : '<b>' + escapeHtml(p.name) + '</b> 正在摆放…';
      return;
    }
    var humanTurn = isHumanTurn();
    if (state.turnStage === 'roll') {
      primary.disabled = !humanTurn;
      primary.textContent = humanTurn ? '掷骰' : '等待掷骰';
      title.textContent = p.name + (p.ai ? '（AI）' : '（你）') + ' 的回合';
      sub.textContent = '第 ' + state.round + ' 回合 · 掷两颗骰子';
      $('mapHint').innerHTML = humanTurn ? '掷骰后按点数产出，然后可以连续建造或兑换。' : '<b>' + escapeHtml(p.name) + '</b> 正在掷骰…';
    } else {
      primary.disabled = !humanTurn;
      primary.textContent = humanTurn ? '继续建造' : '等待行动';
      title.textContent = p.name + (p.ai ? '（AI）' : '（你）') + ' 的回合';
      sub.textContent = '第 ' + state.round + ' 回合 · 点数 ' + (state.lastSum == null ? '—' : state.lastSum) + (state.lastRoll && state.lastRoll.seven ? ' · 霜洞寂静' : '');
      var gains = state.lastRoll && state.lastRoll.gains && state.lastRoll.gains[PLAYER_HUMAN];
      $('mapHint').innerHTML = humanTurn
        ? (gains ? '你本轮获得 麦 ' + gains.wheat + ' / 石 ' + gains.stone + ' / 木 ' + gains.wood + '。' : '选择建造、兑换，或结束回合。')
        : '<b>' + escapeHtml(p.name) + '</b> 正在行动…';
    }
  }

  function legalOf(kind) {
    if (!state || state.phase !== 'play' || state.turnStage !== 'action' || !isHumanTurn()) return [];
    return E.legalActions(state).filter(function (a) { return a.k === kind; });
  }

  function renderActions() {
    var actionTurn = state.phase === 'play' && state.turnStage === 'action' && isHumanTurn();
    var roads = legalOf('buildRoad');
    var sets = legalOf('buildSettlement');
    var cities = legalOf('upgradeCity');
    var trades = legalOf('exchange');
    $('roadBtn').disabled = !actionTurn || roads.length === 0;
    $('settlementBtn').disabled = !actionTurn || sets.length === 0;
    $('cityBtn').disabled = !actionTurn || cities.length === 0;
    $('tradeBtn').disabled = !actionTurn || trades.length === 0;
    $('endBtn').disabled = !actionTurn;
    if (!actionTurn && state.phase !== 'setup') closePicker(false);
    if (!actionTurn) $('tradePanel').hidden = true;
  }

  function renderBanner() {
    if (state.phase !== 'over') { $('banner').hidden = true; return; }
    $('banner').hidden = false;
    var winnerIds = state.winners || [];
    var humanWon = winnerIds.indexOf(PLAYER_HUMAN) >= 0;
    $('bannerTitle').textContent = state.result === 'draw' ? '并列收场' : (state.winner != null ? state.players[state.winner].name + ' 获胜' : '对局结束');
    var scores = state.players.map(function (p) { return p.name + ' ' + p.score + ' 分'; }).join(' · ');
    $('bannerText').textContent = scores + (state.result === 'points' ? ' · 达到 8 分' : ' · 12 回合封顶');
    if (!state._beeped) {
      state._beeped = true;
      beep(state.result === 'draw' ? 'click' : (humanWon ? 'win' : 'lose'));
    }
  }

  /* -------------------------------------------------------------- pickers */

  function openPicker(kind) {
    if (!state || state.phase === 'over') return;
    var actions;
    if (kind === 'setupSettlement') actions = E.legalActions(state).filter(function (a) { return a.k === 'setupSettlement'; });
    else if (kind === 'setupRoad') actions = E.legalActions(state).filter(function (a) { return a.k === 'setupRoad'; });
    else if (kind === 'buildRoad') actions = legalOf('buildRoad');
    else if (kind === 'buildSettlement') actions = legalOf('buildSettlement');
    else if (kind === 'upgradeCity') actions = legalOf('upgradeCity');
    else actions = [];
    if (!actions.length) { toast('现在没有可用的位置'); return; }
    pickMode = (kind === 'setupSettlement' || kind === 'buildSettlement' || kind === 'upgradeCity') ? 'vertex' : 'edge';
    pickActions = actions;
    var title = kind === 'setupSettlement' ? '选择村庄交点' :
      kind === 'setupRoad' ? '选择道路边' :
        kind === 'buildRoad' ? '选择铺路边' :
          kind === 'buildSettlement' ? '选择村庄交点' : '选择要升级的城市';
    $('pickerTitle').textContent = title;
    $('picker').hidden = false;
    $('pickerErr').textContent = '';
    renderPickerList(kind);
    renderMap();
    beep('click');
  }

  function describeVertex(vk) {
    var prod = E.vertexProduction(state, vk);
    var labels = prod.map(function (x) { return D.BOARD.pips[x.hex.number] ? (E.TERRAIN_NAME[x.hex.terrain] + x.hex.number) : E.TERRAIN_NAME[x.hex.terrain]; });
    var port = E.isPortEdge(state, (state.board.vertices.find(function (v) { return v.key === vk; }) || { edges: [] }).edges[0]);
    var portEdge = false;
    var v = state.board.vertices.find(function (x) { return x.key === vk; });
    if (v) portEdge = v.edges.some(function (ek) { return E.isPortEdge(state, ek); });
    return (labels.length ? labels.join(' · ') : '无产出') + (portEdge ? ' · 潮门' : '');
  }

  function renderPickerList(kind) {
    var list = $('pickerList');
    var html = '';
    pickActions.forEach(function (a) {
      if (a.k === 'setupSettlement' || a.k === 'buildSettlement') {
        var val = E.vertexValue(state, a.vertex).toFixed(1);
        html += '<button type="button" data-pick="vertex" data-vk="' + escapeHtml(a.vertex) + '"><span>' + escapeHtml(a.vertex) + ' · ' + escapeHtml(describeVertex(a.vertex)) + '</span><b>价值 ' + val + '</b></button>';
      } else if (a.k === 'setupRoad' || a.k === 'buildRoad') {
        var e = state.board.edges.find(function (x) { return x.key === a.edge; });
        var names = e ? e.hexes.map(function (hid) { var h = state.hexes[hid]; return h ? E.TERRAIN_NAME[h.terrain] : ''; }).filter(Boolean).join(' / ') : '';
        html += '<button type="button" data-pick="edge" data-edge="' + escapeHtml(a.edge) + '"><span>道路边 · ' + escapeHtml(names || '海岸') + '</span><b>' + escapeHtml(a.edge) + '</b></button>';
      } else if (a.k === 'upgradeCity') {
        var cval = E.vertexValue(state, a.vertex).toFixed(1);
        html += '<button type="button" data-pick="vertex" data-vk="' + escapeHtml(a.vertex) + '"><span>升级村庄 · ' + escapeHtml(describeVertex(a.vertex)) + '</span><b>+1 分 · 价值 ' + cval + '</b></button>';
      }
    });
    list.innerHTML = html || '<p class="empty">没有可用位置。</p>';
    if (kind === 'setupSettlement' || kind === 'buildSettlement' || kind === 'upgradeCity') {
      pickMode = 'vertex';
    } else {
      pickMode = 'edge';
    }
    $('mapWrap').setAttribute('data-mode', pickMode);
  }

  function closePicker(clearMode) {
    $('picker').hidden = true;
    $('pickerList').innerHTML = '';
    if (clearMode !== false) {
      pickMode = null;
      pickActions = [];
      if (state) renderMap();
    }
  }

  function doPick(kind, value) {
    if (!state || state.phase === 'over' || !isHumanTurn()) return;
    var action = null;
    if (kind === 'vertex') {
      action = pickActions.find(function (a) { return a.vertex === value; });
    } else {
      action = pickActions.find(function (a) { return a.edge === value; });
    }
    if (!action) { $('pickerErr').textContent = '这个位置不可用。'; return; }
    applyHuman(action);
  }

  function applyHuman(action) {
    var res = E.applyAction(state, action);
    if (!res.ok) {
      $('pickerErr').textContent = '动作无效：' + (res.error || '未知');
      beep('error');
      render();
      return;
    }
    lastHumanGain = res.gains || null;
    beep(action.k === 'roll' ? 'dice' : (action.k === 'buildSettlement' || action.k === 'upgradeCity' ? 'capture' : 'move'));
    closePicker(false);
    pickMode = null;
    pickActions = [];
    state._beeped = false;
    render();
    var humanGain = res.gains && res.gains[PLAYER_HUMAN];
    if (humanGain) {
      toast('获得 麦 ' + humanGain.wheat + ' / 石 ' + humanGain.stone + ' / 木 ' + humanGain.wood);
    } else if (res.seven) {
      toast('霜洞寂静：本轮不产资源（本作不设强盗）');
    }
    if (state.phase === 'setup' && state.setup.step === 'road' && isHumanTurn()) {
      setTimeout(function () { if (state && state.phase === 'setup' && state.setup.step === 'road' && isHumanTurn()) openPicker('setupRoad'); }, 240);
    }
    if (state.phase === 'play' && res.sum != null && isHumanTurn()) {
      // stay on the action stage
    }
    scheduleAi();
  }

  /* ---------------------------------------------------------------- trade */

  function openTrade() {
    tradeGive = null;
    tradeGet = null;
    $('tradePanel').hidden = false;
    renderTrade();
    beep('click');
  }

  function renderTrade() {
    if ($('tradePanel').hidden) return;
    var p = humanPlayer();
    var rate = E.tradeRate(state, p);
    $('tradeRate').innerHTML = '当前比例 <b>' + rate + ':1</b>' + (rate === 2 ? ' · 潮门' : ' · 荒野集市');
    var giveHtml = '', getHtml = '';
    D.RESOURCES.forEach(function (r) {
      var can = p.resources[r.id] >= rate;
      giveHtml += '<button type="button" data-give="' + r.id + '" aria-pressed="' + (tradeGive === r.id) + '"' + (can ? '' : ' disabled') + '>' + r.zh + ' ' + p.resources[r.id] + '</button>';
      getHtml += '<button type="button" data-get="' + r.id + '" aria-pressed="' + (tradeGet === r.id) + '"' + (tradeGive === r.id ? ' disabled' : '') + '>' + r.zh + '</button>';
    });
    $('giveGrid').innerHTML = giveHtml;
    $('getGrid').innerHTML = getHtml;
    var ok = tradeGive && tradeGet && E.validateExchange(state, p, tradeGive, tradeGet).ok;
    $('tradeConfirm').disabled = !ok;
    $('tradeErr').textContent = '';
  }

  function confirmTrade() {
    if (!tradeGive || !tradeGet) return;
    var res = E.exchange(state, tradeGive, tradeGet);
    if (!res.ok) {
      $('tradeErr').textContent = '兑换失败：' + (res.error || '未知');
      beep('error');
      return;
    }
    beep('move');
    toast('用 ' + res.rate + ' 份' + E.RESOURCE_NAME[res.give] + '换到 1 份' + E.RESOURCE_NAME[res.get]);
    tradeGive = null;
    tradeGet = null;
    render();
    renderTrade();
  }

  /* ------------------------------------------------------------- turn AI */

  function scheduleAi() {
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
    if (!state || state.phase === 'over' || !isAiTurn()) return;
    aiTimer = setTimeout(aiStep, 520);
  }

  function aiStep() {
    aiTimer = null;
    if (!state || state.phase === 'over' || !isAiTurn()) return;
    var action = E.aiAction(state, level);
    if (!action) {
      if (state.phase === 'play' && state.turnStage === 'action') action = { k: 'endTurn' };
      else return;
    }
    var res = E.applyAction(state, action);
    if (!res.ok) {
      // Safety valve: never let a broken AI action freeze the turn.
      if (state.phase === 'play' && state.turnStage === 'action') E.applyAction(state, { k: 'endTurn' });
      render();
      scheduleAi();
      return;
    }
    beep(action.k === 'roll' ? 'dice' : (action.k === 'buildSettlement' || action.k === 'upgradeCity' ? 'capture' : 'move'));
    state._beeped = false;
    render();
    if (state.phase !== 'over' && isAiTurn()) scheduleAi();
  }

  /* ------------------------------------------------------------- lifecycle */

  function newGame(seed) {
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
    state = E.createGame({ players: playerCount, humans: 1, seed: seed == null ? randomSeed() : seed, names: DEFAULT_NAMES.slice(0, playerCount) });
    state._beeped = false;
    pickMode = null;
    pickActions = [];
    tradeGive = null;
    tradeGet = null;
    $('picker').hidden = true;
    $('tradePanel').hidden = true;
    render();
    scheduleAi();
  }

  var DEFAULT_NAMES = ['赤帆', '蓝港', '青禾', '金穗'];

  function setLevel(next) {
    level = next;
    var buttons = document.querySelectorAll('.seg button[data-level]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', String(Number(buttons[i].getAttribute('data-level')) === level));
    }
    safeSet('pioneers-premium:level', String(level));
  }
  function setPlayers(next) {
    playerCount = next;
    var buttons = document.querySelectorAll('.seg button[data-players]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', String(Number(buttons[i].getAttribute('data-players')) === playerCount));
    }
    safeSet('pioneers-premium:players', String(playerCount));
    newGame();
  }

  function onMapClick(event) {
    var target = event.target;
    var hot = target.closest ? target.closest('.vhot.legal') : null;
    if (hot) { doPick('vertex', hot.getAttribute('data-vk')); return; }
    var edge = target.closest ? target.closest('.edge-hit.legal') : null;
    if (edge) { doPick('edge', edge.getAttribute('data-edge')); }
  }
  function onMapKey(event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    var target = event.target;
    var hot = target.closest ? target.closest('.vhot.legal') : null;
    if (hot) { event.preventDefault(); doPick('vertex', hot.getAttribute('data-vk')); return; }
    var edge = target.closest ? target.closest('.edge-hit.legal') : null;
    if (edge) { event.preventDefault(); doPick('edge', edge.getAttribute('data-edge')); }
  }

  function wire() {
    $('primaryBtn').addEventListener('click', function () {
      if (!state || state.phase === 'over') return;
      if (state.phase === 'setup') {
        if (!isHumanTurn()) return;
        openPicker(state.setup.step === 'settlement' ? 'setupSettlement' : 'setupRoad');
      } else if (state.turnStage === 'roll') {
        if (!isHumanTurn()) return;
        applyHuman({ k: 'roll' });
      } else if (state.turnStage === 'action' && isHumanTurn()) {
        // "继续建造" opens the most useful remaining build list.
        var sets = legalOf('buildSettlement');
        var cities = legalOf('upgradeCity');
        var roads = legalOf('buildRoad');
        if (cities.length) openPicker('upgradeCity');
        else if (sets.length) openPicker('buildSettlement');
        else if (roads.length) openPicker('buildRoad');
        else toast('没有可建造项：交易或结束回合。');
      }
    });
    $('roadBtn').addEventListener('click', function () { openPicker('buildRoad'); });
    $('settlementBtn').addEventListener('click', function () { openPicker('buildSettlement'); });
    $('cityBtn').addEventListener('click', function () { openPicker('upgradeCity'); });
    $('tradeBtn').addEventListener('click', function () {
      if ($('tradePanel').hidden) openTrade(); else { $('tradePanel').hidden = true; }
    });
    $('endBtn').addEventListener('click', function () {
      if (!isHumanTurn() || state.turnStage !== 'action') return;
      var res = E.endTurn(state);
      if (!res.ok) return;
      beep('click');
      closePicker();
      state._beeped = false;
      render();
      scheduleAi();
    });
    $('newBtn').addEventListener('click', function () { newGame(); });
    $('bannerNew').addEventListener('click', function () { newGame(); });
    $('pickerList').addEventListener('click', function (event) {
      var btn = event.target.closest ? event.target.closest('button[data-pick]') : null;
      if (!btn) return;
      doPick(btn.getAttribute('data-pick'), btn.getAttribute('data-vk') || btn.getAttribute('data-edge'));
    });
    $('giveGrid').addEventListener('click', function (event) {
      var btn = event.target.closest ? event.target.closest('button[data-give]') : null;
      if (!btn) return;
      tradeGive = btn.getAttribute('data-give');
      if (tradeGet === tradeGive) tradeGet = null;
      renderTrade();
    });
    $('getGrid').addEventListener('click', function (event) {
      var btn = event.target.closest ? event.target.closest('button[data-get]') : null;
      if (!btn) return;
      tradeGet = btn.getAttribute('data-get');
      renderTrade();
    });
    $('tradeConfirm').addEventListener('click', confirmTrade);
    $('mapWrap').addEventListener('click', onMapClick);
    $('mapWrap').addEventListener('keydown', onMapKey);
    var levelButtons = document.querySelectorAll('.seg button[data-level]');
    for (var i = 0; i < levelButtons.length; i++) {
      levelButtons[i].addEventListener('click', function () {
        setLevel(Number(this.getAttribute('data-level')));
      });
    }
    var playerButtons = document.querySelectorAll('.seg button[data-players]');
    for (var j = 0; j < playerButtons.length; j++) {
      playerButtons[j].addEventListener('click', function () {
        setPlayers(Number(this.getAttribute('data-players')));
      });
    }
  }

  function init() {
    try {
      var savedLevel = Number(safeGet('pioneers-premium:level', '2'));
      if (savedLevel >= 1 && savedLevel <= 3) level = savedLevel;
      var savedPlayers = Number(safeGet('pioneers-premium:players', '2'));
      if (savedPlayers >= 2 && savedPlayers <= 4) playerCount = savedPlayers;
    } catch (e) { /* ignore storage */ }
    setLevel(level);
    var pButtons = document.querySelectorAll('.seg button[data-players]');
    for (var i = 0; i < pButtons.length; i++) {
      pButtons[i].setAttribute('aria-pressed', String(Number(pButtons[i].getAttribute('data-players')) === playerCount));
    }
    wire();
    newGame();
  }

  init();

  // Small read-only handle for browser probes and smoke checks.
  window.PioneersPremiumPage = {
    getState: function () { return state ? E.publicView(state, PLAYER_HUMAN) : null; },
    getRaw: function () { return state; },
    getLevel: function () { return level; },
    newGame: newGame,
    isOver: function () { return !!(state && state.phase === 'over'); }
  };
})();
</script>
</body>
</html>
