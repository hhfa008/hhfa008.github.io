<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="情书 Love Letter 联机房间：创建或加入房间、邀请码与密码、空位 AI 补足、断线重连、超时托管与结果榜。">

<title>情书 LOVE LETTER · 联机房间</title>
<style>
:root {
  --font-serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif SC", Georgia, serif;
  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --art-back: url("../../assets/art/premium/love-letter/card-back.webp");
  --art-table: url("../../assets/art/premium/love-letter/table-crimson.webp");
  --bg: #140811; --bg-2: #1d0b17; --panel: rgba(42,15,27,.9); --panel-2: rgba(60,22,38,.62);
  --ink: #f6ead7; --ink-soft: #e2cfb8; --ink-dim: #b79e8b;
  --gold: #d3b06f; --gold-2: #f3dda6; --line: rgba(211,176,111,.26); --line-soft: rgba(211,176,111,.12);
  --danger: #e07a6b; --ok: #8fd0ae; --focus: #f7e2a8; --paper: #f3e7d0; --paper-ink: #3a2a22;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink); font-family: var(--font-sans); font-size: 16px;
  background: radial-gradient(1000px 720px at 10% -8%, rgba(141,38,58,.38), transparent 60%), linear-gradient(158deg, var(--bg), var(--bg-2) 68%, #0b0509);
  -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--art-table) center / cover no-repeat; opacity: .38; }
a { color: var(--gold-2); }
button, input, select, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 18px 14px 40px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-family: var(--font-serif); font-size: clamp(20px, 4.6vw, 27px); letter-spacing: .06em; }
.top h1 small { display: block; font-size: 12px; letter-spacing: .24em; color: var(--gold); margin-top: 3px; }
.btn { min-height: 44px; padding: 10px 15px; border-radius: 11px; border: 1px solid var(--line); background: rgba(30,10,18,.72); color: var(--ink); font-size: 13px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.primary { background: linear-gradient(160deg, #a8344a, #6f1c2e); border-color: rgba(243,221,166,.5); color: #fff6e6; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 18px; }
.panel { border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(180deg, var(--panel), rgba(20,7,13,.9)); box-shadow: 0 18px 50px rgba(0,0,0,.4); padding: 16px; }
.panel h2 { margin: 0 0 10px; font-family: var(--font-serif); font-size: 17px; letter-spacing: .05em; color: var(--gold-2); }
.panel p { margin: 0 0 10px; font-size: 12px; line-height: 1.65; color: var(--ink-dim); }
label { display: block; font-size: 12px; color: var(--ink-dim); margin: 10px 0 4px; }
input, select { width: 100%; min-height: 44px; border-radius: 9px; border: 1px solid var(--line); background: rgba(10,3,7,.72); color: var(--ink); padding: 9px 11px; font-size: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1 1 140px; }
.room-code { font-family: var(--font-serif); font-size: 24px; letter-spacing: .18em; color: var(--gold-2); }
.seat { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; border: 1px solid var(--line-soft); border-radius: 10px; background: rgba(255,255,255,.03); margin-bottom: 7px; font-size: 13px; }
.seat .tag { font-size: 12px; padding: 3px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-dim); }
.seat .tag.ai { color: var(--gold-2); border-color: rgba(243,221,166,.4); }
.seat .tag.takeover { color: var(--danger); border-color: rgba(224,122,107,.4); }
.status { padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line-soft); background: rgba(255,255,255,.04); font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
.status.err { color: var(--danger); border-color: rgba(224,122,107,.4); }
.seats { display: grid; gap: 6px; }
.game { display: none; margin-top: 16px; }
.game.on { display: block; }
.lobby { display: none; margin-top: 16px; }
.lobby.on { display: block; }
.opponents { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 7px; margin-bottom: 12px; }
.opp { border: 1px solid var(--line-soft); border-radius: 11px; padding: 9px; background: rgba(14,4,9,.5); min-width: 0; }
.opp .nm { font-family: var(--font-serif); font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opp .sub { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
.opp .backs { display: flex; gap: 3px; margin-top: 6px; }
.mini-back { width: 18px; height: 26px; border-radius: 3px; background: var(--art-back) center / cover no-repeat; border: 1px solid rgba(243,221,166,.3); }
.log { max-height: 120px; overflow-y: auto; border: 1px solid var(--line-soft); border-radius: 9px; background: rgba(8,2,5,.45); padding: 8px 10px; font-size: 12px; line-height: 1.6; color: var(--ink-soft); margin: 10px 0; }
.log p { margin: 0 0 4px; }
.hand { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
.card { width: 92px; min-height: 140px; border-radius: 8px; border: 1px solid rgba(90,60,40,.4); background: linear-gradient(152deg, var(--paper), #e7d6b9); color: var(--paper-ink); padding: 7px; text-align: center; font-size: 12px; line-height: 1.4; }
.card .v { font-family: var(--font-serif); font-weight: 700; font-size: 17px; }
.card .n { font-family: var(--font-serif); font-weight: 700; font-size: 13px; margin: 3px 0; }
.card.sel { outline: 3px solid var(--gold-2); }
.card:disabled { opacity: .45; }
.targets { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.targets button { min-height: 44px; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line); background: rgba(30,10,18,.7); color: var(--ink); font-size: 13px; }
.targets button.sel { background: linear-gradient(160deg, #a8344a, #6f1c2e); border-color: var(--gold-2); }
.guesses { display: flex; gap: 5px; flex-wrap: wrap; margin: 8px 0; }
.guesses button { width: 44px; height: 44px; border-radius: 9px; border: 1px solid var(--line); background: rgba(30,10,18,.7); color: var(--ink); font-weight: 700; }
.guesses button.sel { background: linear-gradient(160deg, #a8344a, #6f1c2e); border-color: var(--gold-2); }
.turn { font-size: 12px; color: var(--ink-dim); margin: 8px 0; }
.result { margin-top: 12px; }
.result .line { display: flex; justify-content: space-between; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line-soft); margin-bottom: 5px; font-size: 13px; }
.result .line.win { border-color: rgba(243,221,166,.5); background: rgba(141,38,58,.3); }
@media (max-width: 480px) { .wrap { padding: 12px 10px 30px; } .panel { padding: 12px; } .card { width: 84px; min-height: 128px; } }
/* safe-area: keep the original bottom padding, clear the iOS home indicator */
body{padding-bottom:env(safe-area-inset-bottom)}
</style>

<body>
<div class="wrap">
  <header class="top">
    <h1>情书 <small>LOVE LETTER · ONLINE</small></h1>
    <div class="row">
      <a class="btn" href="index.html">单人牌桌</a>
      <a class="btn" href="rules.html">规则</a>
      <button class="btn sfx-toggle" type="button" aria-label="音效开关"></button>
    </div>
  </header>

  <div class="grid" id="launcher">
    <section class="panel">
      <h2>创建房间</h2>
      <p>生成房间码与一次性邀请码。空位由 AI 补足，房主点「开始」后发牌。</p>
      <label for="hostName">你的名字</label>
      <input id="hostName" maxlength="16" placeholder="例如：红衣密使" autocomplete="nickname">
      <label for="hostMax">人数</label>
      <select id="hostMax"><option value="2">2 人</option><option value="3">3 人</option><option value="4">4 人</option></select>
      <label for="hostPw">房间密码（可选）</label>
      <input id="hostPw" maxlength="24" placeholder="留空则公开房间" autocomplete="off">
      <div class="row" style="margin-top:12px"><button class="btn primary grow" id="createBtn" type="button">创建房间</button></div>
    </section>
    <section class="panel">
      <h2>加入房间</h2>
      <p>输入房间码或邀请码。也可以从好友发来的链接直接进入。</p>
      <label for="joinName">你的名字</label>
      <input id="joinName" maxlength="16" placeholder="例如：银烛学士" autocomplete="nickname">
      <label for="joinCode">房间码 / 邀请码</label>
      <input id="joinCode" maxlength="64" placeholder="例如：ROSE-42" autocomplete="off">
      <label for="joinPw">房间密码（如需要）</label>
      <input id="joinPw" maxlength="24" placeholder="可选" autocomplete="off">
      <div class="row" style="margin-top:12px"><button class="btn primary grow" id="joinBtn" type="button">加入房间</button></div>
    </section>
  </div>

  <div class="lobby" id="lobby">
    <section class="panel">
      <h2>房间大厅</h2>
      <div class="status" id="lobbyStatus">等待连接…</div>
      <div class="row" style="margin-bottom:10px">
        <div class="grow"><div style="font-size:12px;color:var(--ink-dim)">房间码</div><div class="room-code" id="roomCode">—</div></div>
        <div class="grow"><div style="font-size:12px;color:var(--ink-dim)">邀请码</div><div id="inviteCode" style="font-size:13px;word-break:break-all">—</div></div>
      </div>
      <div class="seats" id="seatList"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="startBtn" type="button" disabled>开始对局</button>
        <button class="btn" id="copyBtn" type="button">复制邀请</button>
        <button class="btn" id="leaveBtn" type="button">离开</button>
      </div>
    </section>
  </div>

  <div class="game" id="game">
    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <div><span style="font-size:12px;color:var(--ink-dim)">房间</span> <b id="gameRoom" class="room-code" style="font-size:18px">—</b></div>
        <div class="row"><span class="status" id="gameStatus" style="margin:0">—</span><button class="btn" id="refreshBtn" type="button">刷新</button></div>
      </div>
      <div class="opponents" id="gameOpponents"></div>
      <div class="log" id="gameLog" aria-live="polite"></div>
      <div class="turn" id="gameTurn">—</div>
      <div class="hand" id="gameHand"></div>
      <div class="targets" id="gameTargets"></div>
      <div class="guesses" id="gameGuesses"></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="playBtn" type="button" disabled>打出</button><button class="btn" id="rematchBtn" type="button" style="display:none">再来一局</button></div>
      <div class="result" id="gameResult"></div>
    </section>
  </div>
</div>

<script src="../../shared/sfx.js"></script>
<script>
(function () {
  'use strict';
  var LS = 'hhfa-love-letter-online-v1';
  var session = null;
  var playerId = null;
  var roomId = null;
  var view = null;
  var selectedCard = null;
  var selectedTarget = null;
  var selectedGuess = null;
  var pollTimer = null;
  var pollBusy = false;

  function $(id) { return document.getElementById(id); }
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function sfx(name) { try { window.Sfx && window.Sfx.play && window.Sfx.play(name); } catch (err) {} }
  function setStatus(node, text, error) {
    node.textContent = text;
    node.classList.toggle('err', !!error);
  }
  function showGame(on) {
    $('game').classList.toggle('on', on);
    $('lobby').classList.toggle('on', !on || !!view);
  }
  function save() {
    try { localStorage.setItem(LS, JSON.stringify({ session: session, playerId: playerId, roomId: roomId })); }
    catch (err) {}
  }
  function clearSave() {
    try { localStorage.removeItem(LS); } catch (err) {}
  }

  async function api(method, route, body) {
    var response = await fetch(route, {
      method: method,
      headers: { 'content-type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    var text = await response.text();
    var data = null;
    try { data = JSON.parse(text); } catch (err) {}
    return { status: response.status, body: data };
  }
  function roomUrl(suffix) { return '/api/rooms/' + encodeURIComponent(roomId) + (suffix || ''); }
  function viewUrl() {
    return roomUrl() + '?session=' + encodeURIComponent(session) + '&playerId=' + encodeURIComponent(playerId);
  }
  async function refresh() {
    if (!roomId || !session || pollBusy) return;
    pollBusy = true;
    try {
      var res = await api('GET', viewUrl());
      if (res.status === 200 && res.body) {
        view = res.body;
        render();
      } else if (res.status === 404) {
        setStatus($('lobbyStatus'), '房间已关闭。', true);
        stopPolling();
      }
    } catch (err) { /* offline; retry */ }
    pollBusy = false;
  }
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(refresh, 1200);
  }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  function renderSeats() {
    if (!view) return;
    var host = $('seatList');
    host.innerHTML = '';
    view.seats.forEach(function (seat) {
      var row = document.createElement('div');
      row.className = 'seat';
      var left = document.createElement('div');
      left.textContent = seat.nickname;
      var tag = document.createElement('span');
      tag.className = 'tag' + (seat.ai ? ' ai' : '') + (seat.takeover ? ' takeover' : '');
      tag.textContent = seat.ai ? 'AI' : (seat.takeover ? '已托管' : (seat.playerId === view.hostId ? '房主' : '玩家'));
      row.appendChild(left);
      row.appendChild(tag);
      host.appendChild(row);
    });
    $('roomCode').textContent = view.roomCode || '—';
    $('inviteCode').textContent = view.inviteToken || view.inviteCode || '—';
    $('startBtn').disabled = !view.canStart;
    setStatus($('lobbyStatus'), view.started ? '对局已开始。' : '等待玩家与房主开始。');
  }

  function render() {
    if (!view) return;
    if (!view.started) {
      $('game').classList.remove('on');
      $('lobby').classList.add('on');
      $('launcher').style.display = 'grid';
      renderSeats();
      return;
    }
    $('game').classList.add('on');
    $('lobby').classList.remove('on');
    $('launcher').style.display = 'none';
    $('gameRoom').textContent = view.roomCode || '—';
    setStatus($('gameStatus'), view.state.over ? '对局结束' : (view.canMove ? '轮到你' : '等待其他人…'));
    $('rematchBtn').style.display = view.canRestart ? '' : 'none';

    var opponents = $('gameOpponents');
    opponents.innerHTML = '';
    view.state.players.forEach(function (p) {
      if (view.you && p.index === view.you.playerIndex) return;
      var box = document.createElement('div');
      box.className = 'opp';
      box.innerHTML = '<div class="nm">' + esc(p.name) + '</div>' +
        '<div class="sub">' + (p.out ? '已出局' : (p.handCount + ' 张手牌' + (p.protected ? ' · 侍女保护' : ''))) + '</div>' +
        '<div class="sub">情书标记 ' + p.tokens + '</div>';
      var backs = document.createElement('div');
      backs.className = 'backs';
      for (var i = 0; i < p.handCount; i++) {
        var b = document.createElement('span');
        b.className = 'mini-back';
        backs.appendChild(b);
      }
      box.appendChild(backs);
      if (p.discard && p.discard.length) {
        var d = document.createElement('div');
        d.className = 'sub';
        d.textContent = '弃牌：' + p.discard.join(' · ');
        box.appendChild(d);
      }
      opponents.appendChild(box);
    });

    var log = $('gameLog');
    log.innerHTML = '';
    (view.state.log || []).slice(-10).reverse().forEach(function (entry) {
      var p = document.createElement('p');
      p.textContent = entry.text;
      log.appendChild(p);
    });

    $('gameTurn').textContent = view.state.over ? '对局结束' :
      ('第 ' + view.state.round + ' 轮 · ' + (view.canMove ? '轮到你，选择一张牌' : '轮到 ' + (view.state.players[view.state.current] ? view.state.players[view.state.current].name : '…')));

    var hand = $('gameHand');
    hand.innerHTML = '';
    var me = view.state.players[view.you ? view.you.playerIndex : 0];
    if (me) {
      me.hand.forEach(function (cardId) {
        var move = (view.legalMoves || []).filter(function (m) { return m.card === cardId; });
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card' + (selectedCard === cardId ? ' sel' : '');
        btn.disabled = !view.canMove || !move.length;
        btn.innerHTML = '<div class="v">' + cardId + '</div><div class="n">' + esc(cardName(cardId)) + '</div><div>' + esc(cardText(cardId)) + '</div>';
        btn.addEventListener('click', function () {
          selectedCard = selectedCard === cardId ? null : cardId;
          selectedTarget = null;
          selectedGuess = null;
          sfx('click');
          render();
        });
        hand.appendChild(btn);
      });
    }

    var targets = $('gameTargets');
    targets.innerHTML = '';
    var needsTarget = [1, 2, 3, 5, 6].indexOf(selectedCard) !== -1;
    var needsGuess = selectedCard === 1;
    if (needsTarget && view.canMove) {
      var legalTargets = (view.legalMoves || []).filter(function (m) { return m.card === selectedCard; })
        .map(function (m) { return m.target; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
      legalTargets.forEach(function (index) {
        var p = view.state.players[index];
        var b = document.createElement('button');
        b.type = 'button';
        b.className = selectedTarget === index ? 'sel' : '';
        b.textContent = p ? p.name : ('玩家 ' + (index + 1));
        b.addEventListener('click', function () { selectedTarget = index; sfx('click'); render(); });
        targets.appendChild(b);
      });
    }
    var guesses = $('gameGuesses');
    guesses.innerHTML = '';
    if (needsGuess && view.canMove) {
      for (var g = 2; g <= 8; g++) {
        (function (value) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = selectedGuess === value ? 'sel' : '';
          b.textContent = String(value);
          b.addEventListener('click', function () { selectedGuess = value; sfx('click'); render(); });
          guesses.appendChild(b);
        })(g);
      }
    }
    var playBtn = $('playBtn');
    playBtn.disabled = !view.canMove || selectedCard == null ||
      (needsTarget && selectedTarget == null) || (needsGuess && selectedGuess == null);
    playBtn.onclick = function () {
      var move = { card: selectedCard };
      if (needsTarget) move.target = selectedTarget;
      if (needsGuess) move.guess = selectedGuess;
      sendMove(move);
    };

    var result = $('gameResult');
    result.innerHTML = '';
    if (view.state.over && view.state.result) {
      view.state.result.tokens.forEach(function (p) {
        var line = document.createElement('div');
        line.className = 'line' + (view.state.result.winners.indexOf(p.index) >= 0 ? ' win' : '');
        line.innerHTML = '<span>' + esc(p.name) + '</span><b>' + p.tokens + ' 枚</b>';
        result.appendChild(line);
      });
    }
  }

  function cardName(id) {
    var names = { 1: '卫兵', 2: '神父', 3: '男爵', 4: '侍女', 5: '王子', 6: '国王', 7: '女伯爵', 8: '公主' };
    return names[id] || ('牌 ' + id);
  }
  function cardText(id) {
    var text = {
      1: '猜另一名玩家手牌 2–8', 2: '查看手牌', 3: '比较点数，低者出局', 4: '保护自己到下回合',
      5: '目标弃牌并补牌', 6: '与目标交换手牌', 7: '有国王/王子时必须打出', 8: '打出立即出局'
    };
    return text[id] || '';
  }

  async function sendMove(move) {
    if (!view || !view.canMove) return;
    var res = await api('POST', roomUrl('/actions'), {
      session: session, playerId: playerId, type: 'move', move: move
    });
    if (res.status === 200 && res.body) {
      view = res.body;
      selectedCard = null;
      selectedTarget = null;
      selectedGuess = null;
      sfx('deal');
      render();
    } else {
      setStatus($('gameStatus'), '出牌失败：' + ((res.body && res.body.error && res.body.error.message) || res.status), true);
      refresh();
    }
  }

  async function createRoom() {
    var name = ($('hostName').value || '').trim() || ('玩家' + Math.floor(Math.random() * 900 + 100));
    var res = await api('POST', '/api/rooms', {
      playerId: name, maxPlayers: Number($('hostMax').value), password: ($('hostPw').value || undefined)
    });
    if (res.status !== 201) { setStatus($('lobbyStatus'), '创建失败：' + res.status, true); return; }
    roomId = res.body.roomId;
    session = res.body.playerSession;
    playerId = name;
    view = res.body;
    save();
    $('launcher').style.display = 'none';
    $('lobby').classList.add('on');
    renderSeats();
    startPolling();
    sfx('notify');
  }

  async function joinRoom() {
    var name = ($('joinName').value || '').trim() || ('玩家' + Math.floor(Math.random() * 900 + 100));
    var code = ($('joinCode').value || '').trim();
    if (!code) { $('joinCode').focus(); return; }
    // The room code is the public code; invite tokens are longer and are
    // accepted by the same endpoint.
    var list = await api('GET', '/api/rooms/' + encodeURIComponent(code));
    if (list.status !== 200) {
      setStatus($('lobbyStatus'), '找不到房间：' + code, true);
      return;
    }
    roomId = list.body.roomId;
    var res = await api('POST', roomUrl('/join'), {
      playerId: name, inviteCode: code, password: ($('joinPw').value || undefined)
    });
    if (res.status !== 200) {
      setStatus($('lobbyStatus'), '加入失败：' + ((res.body && res.body.error && res.body.error.message) || res.status), true);
      return;
    }
    session = res.body.playerSession;
    playerId = name;
    view = res.body;
    save();
    $('launcher').style.display = 'none';
    $('lobby').classList.add('on');
    renderSeats();
    startPolling();
    sfx('notify');
  }

  async function startMatch() {
    var res = await api('POST', roomUrl('/start'), { session: session, playerId: playerId });
    if (res.status !== 200) {
      setStatus($('lobbyStatus'), '无法开始：' + ((res.body && res.body.error && res.body.error.message) || res.status), true);
      return;
    }
    view = res.body;
    render();
    sfx('win');
  }

  async function reconnectSaved() {
    try {
      var saved = JSON.parse(localStorage.getItem(LS) || 'null');
      if (!saved || !saved.session || !saved.roomId) return false;
      roomId = saved.roomId; session = saved.session; playerId = saved.playerId;
      var res = await api('POST', roomUrl('/reconnect'), { session: session, playerId: playerId });
      if (res.status !== 200) { clearSave(); return false; }
      view = res.body;
      $('launcher').style.display = 'none';
      render();
      startPolling();
      return true;
    } catch (err) { return false; }
  }

  function bind() {
    $('createBtn').addEventListener('click', createRoom);
    $('joinBtn').addEventListener('click', joinRoom);
    $('startBtn').addEventListener('click', startMatch);
    $('refreshBtn').addEventListener('click', refresh);
    $('rematchBtn').addEventListener('click', async function () {
      var res = await api('POST', roomUrl('/restart'), { session: session, playerId: playerId });
      if (res.status === 200) { view = res.body; render(); }
    });
    $('leaveBtn').addEventListener('click', async function () {
      try { await api('POST', roomUrl('/leave'), { session: session, playerId: playerId }); } catch (err) {}
      clearSave(); stopPolling(); location.reload();
    });
    $('copyBtn').addEventListener('click', function () {
      var text = location.origin + location.pathname + '?room=' + encodeURIComponent(view.roomCode || '');
      try {
        navigator.clipboard.writeText(text);
        $('copyBtn').textContent = '已复制';
      } catch (err) { $('copyBtn').textContent = text; }
    });
    var params = new URLSearchParams(location.search);
    if (params.get('room')) $('joinCode').value = params.get('room');
  }

  bind();
  reconnectSaved().then(function (ok) { if (!ok) setStatus($('lobbyStatus'), '创建或加入一个房间。'); });
})();
</script>
</body>
</html>
