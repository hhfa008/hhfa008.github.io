<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星火术士 Ember Mages — 单机对 AI 极简美式桌游</title>
<meta name="description" content="星火术士：蓄力回血，星火术无视护盾。原创极简美式桌游，单机对 AI，零外部请求。">
<meta name="theme-color" content="#151022">
<style>
:root{--bg:#151022;--panel:#211a35;--panel2:#2f2550;--ink:#f2edff;--muted:#b8aad4;
--accent:#a78bfa;--accent2:#5b3f9e;--line:#463969}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(700px 420px at 50% -12%,var(--panel2),var(--bg));color:var(--ink);
font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.wrap{max-width:680px;margin:0 auto;padding:0 12px}
header{padding:14px 0 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
h1{font-size:1.3rem;margin:0}
h1 small{display:block;font-size:0.75rem;color:var(--muted);letter-spacing:.14em;font-weight:400;margin-top:3px}
.headlinks{display:flex;gap:8px}
.headlinks a{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;
padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);text-decoration:none;font-size:.85rem}
button{font:inherit;color:inherit;cursor:pointer;min-height:48px;border-radius:10px;border:1px solid var(--line);
background:var(--panel2);padding:8px 10px;touch-action:manipulation}
button:hover{filter:brightness(1.14)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:default;filter:none}
button.primary{background:var(--accent);border-color:var(--accent);color:#151515;font-weight:700}
.players{display:grid;grid-template-columns:1fr;gap:10px;margin:8px 0 10px}
@media(min-width:480px){.players{grid-template-columns:1fr 1fr}}
.player{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.player.turn{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.player h2{font-size:.92rem;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.badge{font-size:0.75rem;color:var(--accent);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.bar{height:10px;border-radius:99px;background:#0006;overflow:hidden;margin:4px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:100%;transition:width .25s}
.stats{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted)}
.stat b{color:var(--ink);font-size:.95rem}
.stat i{font-style:normal;color:var(--muted)}
.center{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:0 0 10px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.round{font-size:.82rem;color:var(--muted)}
.dice{font-size:1.05rem;font-weight:700;color:var(--accent);letter-spacing:.08em}
.event{font-size:.8rem;color:var(--accent);margin-top:4px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 10px;
font-size:.78rem;color:var(--muted);height:104px;overflow-y:auto}
.log div{padding:2px 0;border-bottom:1px dashed transparent}
.log div:last-child{color:var(--ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{min-height:52px}
.over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#000a;z-index:9}
.over.show{display:flex}
.over .card{background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:22px;max-width:340px;width:100%;text-align:center}
.over h2{margin:0 0 6px;font-size:1.2rem;color:var(--accent)}
.over p{color:var(--muted);margin:0 0 16px}
.over button{width:100%}
.note{font-size:0.75rem;color:var(--muted);text-align:center;margin:12px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.tools button{min-height:44px;min-width:44px;padding:0 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.tools .streak{margin-left:auto;font-size:12px;color:var(--muted)}
.scene{margin:0 0 10px;font-size:12px;line-height:1.5;color:var(--muted);text-align:center}
/* mini-quality: reduced-motion */
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; } }

    <div class="stats">

      <div class="stat"><span>能量</span> <b id="r0">0</b></div>

    <div class="bar"><i id="hp1bar"></i></div>
    <div class="stats">
      <div class="stat"><span>生命</span> <b id="hp1">20</b><i>/20</i></div>
      <div class="stat"><span>护盾</span> <b id="g1">0</b></div>
      <div class="stat"><span>能量</span> <b id="r1">0</b></div>
      
    </div>
  </section>
</div>

<div class="center">
  <span class="round" id="round">第 1 轮</span>
  <span class="dice" id="dice">—</span>
  
</div>

<div class="tools" aria-label="模式与音景">
  <button id="freeBtn" type="button">自由模式</button>
  <button id="dailyBtn" type="button">每日挑战</button>
  <button id="resumeBtn" type="button" hidden>继续上一局</button>
  <button id="bgmBtn" type="button" aria-pressed="true">音景 开</button>
  <span class="streak" id="streak">连胜 0</span>
</div>
<p class="scene" id="sceneLog" aria-live="polite">战报：准备开始。</p>

<div class="log" id="log" aria-live="polite"></div>

<div class="actions">
  <button type="button" data-act="attack" aria-label="发动攻击">攻击</button>
  <button type="button" data-act="guard" aria-label="举盾防御">举盾 +2</button>
  <button type="button" data-act="focus" aria-label="蓄力获得能量">蓄力 +2</button>
  <button type="button" data-act="special" class="primary" aria-label="发动角色技能">星火术 · 3</button>
</div>
<p class="note">原创极简美式桌游 · 零外部请求 · 触控操作</p>
</div>

<div class="over" id="over" role="dialog" aria-modal="true" aria-label="对局结果">
  <div class="card">
    <h2 id="overTitle">对局结束</h2>
    <p id="overText"></p>
    <button type="button" class="primary" id="again" aria-label="再来一局">再来一局</button>
  </div>
</div>

      countedDaily = true;
      s.set(key(slug, 'streak'), cur.streak);
      s.set(key(slug, 'lastDay'), today);
      s.set(key(slug, 'dailyDone'), today);

    garden: { root: 174.6, chord: [0, 5, 9, 12], wave: 'sine', lfo: 0.06, gain: 0.045 },

  };
  var VOLUME_KEY = 'hhfa-bgm-volume';
  var MUTE_KEY = 'hhfa-bgm-muted';

  function storageGet(k) { try { return root.localStorage ? root.localStorage.getItem(k) : null; } catch (e) { return null; } }
  function storageSet(k, v) { try { if (root.localStorage) root.localStorage.setItem(k, v); } catch (e) { /* ignore */ } }

  var volume = Number(storageGet(VOLUME_KEY));
  if (!(volume >= 0 && volume <= 1)) volume = 0.6;
  var muted = storageGet(MUTE_KEY) === '1';
  var ctx = null;
  var nodes = [];
  var timer = null;
  var current = null;

  function AudioCtor() {
    return root.AudioContext || root.webkitAudioContext || null;
  }

  function ensureCtx() {
    if (ctx) return ctx;
    var C = AudioCtor();
    if (!C) return null;
    try { ctx = new C(); } catch (e) { ctx = null; }
    return ctx;
  }

  function clearNodes() {
    nodes.forEach(function (n) {
      try { n.stop ? n.stop() : n.disconnect(); } catch (e) { /* ignore */ }
      try { n.disconnect && n.disconnect(); } catch (e) { /* ignore */ }
    });
    nodes = [];
    if (timer) { clearInterval(timer); timer = null; }
  }

  function scheduleScene(scene) {
    if (!ctx) return;
    var cfg = SCENES[scene] || SCENES.table;
    var now = ctx.currentTime;
    var master = ctx.createGain();
    master.gain.value = muted ? 0 : volume * cfg.gain;
    master.connect(ctx.destination);
    nodes.push(master);

    cfg.chord.forEach(function (semi, i) {
      var osc = ctx.createOscillator();
      osc.type = cfg.wave;
      osc.frequency.value = cfg.root * Math.pow(2, semi / 12);
      var g = ctx.createGain();
      g.gain.value = 0.33;
      var lfo = ctx.createOscillator();
      lfo.frequency.value = cfg.lfo * (1 + i * 0.13);
      var lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.18;
      lfo.connect(lfoGain);
      lfoGain.connect(g.gain);
      osc.connect(g);
      g.connect(master);
      osc.start(now);
      lfo.start(now);
      nodes.push(osc, lfo, g, lfoGain);
    });
  }

  function fadeMaster(to, seconds) {
    var master = nodes.filter(function (n) { return n.gain && n.context; })[0];
    if (!master || !ctx) return;
    try {
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(to, ctx.currentTime + (seconds || 0.8));
    } catch (e) { /* ignore */ }
  }

  function play(scene) {
    var name = SCENES[scene] ? scene : 'table';
    if (!AudioCtor()) { current = name; return false; }
    if (!ensureCtx()) { current = name; return false; }
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) { /* ignore */ } }
    clearNodes();
    current = name;
    scheduleScene(name);
    if (timer) clearInterval(timer);
    // Rebuild the chord每 12 秒，形成缓慢的呼吸而不是一条死板长音。
    timer = setInterval(function () {
      if (!ctx || !current) return;
      clearNodes();
      scheduleScene(current);
    }, 12000);
    return true;
  }

  function stop() {
    clearNodes();
    current = null;
    return true;
  }

  function setVolume(v) {
    volume = Math.max(0, Math.min(1, Number(v) || 0));
    storageSet(VOLUME_KEY, String(volume));
    return volume;
  }

  function mute(on) {
    muted = Boolean(on);
    storageSet(MUTE_KEY, muted ? '1' : '0');
    fadeMaster(muted ? 0 : volume * (SCENES[current] || SCENES.table).gain, 0.4);
    return muted;
  }

  function scenes() { return Object.keys(SCENES); }
  function isMuted() { return muted; }
  function currentScene() { return current; }
  function getVolume() { return volume; }

  return {
    play: play,
    stop: stop,
    setVolume: setVolume,
    getVolume: getVolume,
    mute: mute,
    isMuted: isMuted,
    current: currentScene,
    scenes: scenes,
    version: '1.0.0'
  };
});

return module.exports;})();
</script>
<script>
(function () {
  'use strict';
  var E = window.MiniEngine;
  var g = null;
  var busy = false;
  var SLUG = "mini-ameri-a-07";
  var mode = "free";
  var currentSeed = Date.now() % 1000000000;
  var settled = false;
  var bgmOn = false;
  var scene = Scene.create({
    id: SLUG,
    ambience: "dungeon",
    cast: [{ id: "you", name: "术士·星璃", role: "player" }, { id: "ai", name: "火花·炎尘", role: "ai" }]
  });
  var replay = Replay.create({ game: SLUG, seed: currentSeed, params: { mode: mode } });

  function newSeed() {
    currentSeed = mode === "daily" ? GameProgress.dailySeed(SLUG) : (Date.now() % 1000000000);
    return currentSeed;
  }
  function saveReplay() {
    try { Replay.saveLocal("replay." + SLUG, replay); } catch (e) { /* storage optional */ }
  }
  function refreshStreak() {
    var el = $("streak");
    if (!el) return;
    var st = GameProgress.dailyState(SLUG);
    el.textContent = (mode === "daily" ? "每日 · " + (st.done ? "今日已完成" : "今日未完成") : "自由模式") + " · 连胜 " + st.streak;
  }
  function describe(event) {
    if (!event) return "战报：准备开始。";
    var p = event.payload || {};
    if (event.type === "act") return "战报：你选择了「" + p.type + "」。";
    if (event.type === "settle") {
      var verdict = p.winner === "draw" ? "平局" : (p.winner === 0 ? "你赢了" : "AI 赢了");
      return "战报：对局结束 · " + verdict + "。";
    }
    return "战报：准备开始。";
  }
  function paintLog() {
    var el = $("sceneLog");
    if (el) el.textContent = describe(scene.events(1)[0]);
  }
  function finish() {
    if (settled) return;
    settled = true;
    scene.updateCast("you", { emotion: g.winner === 0 ? "happy" : (g.winner === "draw" ? "neutral" : "sad") });
    scene.emit("settle", { winner: g.winner, mode: mode });
    try { localStorage.removeItem("replay." + SLUG); } catch (e) { /* ignore */ }
    try { GameProgress.record({ slug: SLUG, mode: mode, score: g.winner === 0 ? 1 : 0 }); } catch (e) { /* storage optional */ }
    refreshStreak();
    paintLog();
  }
  function startBgm() {
    if (bgmOn) return;
    bgmOn = true;
    try { Bgm.play(scene.ambience); } catch (e) { /* audio optional */ }
  }
  document.addEventListener("pointerdown", startBgm, { once: true });

  function $(id) { return document.getElementById(id); }
  function setText(id, v) { var el = $(id); if (el) el.textContent = String(v); }
  function isFaction() { return E.CONFIG.family === 'faction'; }

  function newGame(nextMode) {
    if (nextMode) mode = nextMode;
    if (nextMode) { var rb = $("resumeBtn"); if (rb) rb.hidden = true; }
    settled = false;
    g = E.createGame({ seed: newSeed() });
    replay = Replay.create({ game: SLUG, seed: currentSeed, params: { mode: mode } });
    try { localStorage.removeItem("replay." + SLUG); } catch (e) { /* ignore */ }
    busy = false;
    $('over').classList.remove('show');
    refreshStreak();
    paintLog();
    render();
  }

  function render() {
    if (!g) return;
    if (g.phase === 'over') finish();
    for (var i = 0; i < 2; i++) {
      var p = g.players[i];
      setText('hp' + i, p.hp);
      setText('g' + i, p.guard);
      setText('r' + i, p.res);
      var bar = $('hp' + i + 'bar');
      if (bar) bar.style.width = Math.max(0, Math.min(100, p.hp / p.maxHp * 100)) + '%';
      if (isFaction()) setText('b' + i, p.banners);
      var card = $('p' + i + 'card');
      if (card) card.classList.toggle('turn', g.turn === i && g.phase !== 'over');
      var badge = $('turn' + i);
      if (badge) badge.textContent = g.phase === 'over' ? '结束' : (g.turn === i ? (i === 0 ? '行动中' : '思考中') : '等待');
    }
    setText('round', '第 ' + g.round + ' 轮');
    setText('dice', g.lastRoll && g.lastRoll.length ? g.lastRoll.join(' · ') + ' → ' + g.lastDamage : '—');
    var ev = $('event');
    if (ev) ev.textContent = g.event ? ('事件：' + g.event.name + ' — ' + g.event.text) : '事件：本回合无';
    var log = $('log');
    if (log) {
      var lines = g.log.slice(-6).map(function (t) {
        var d = document.createElement('div');
        d.textContent = t;
        return d;
      });
      log.innerHTML = '';
      lines.forEach(function (d) { log.appendChild(d); });
      log.scrollTop = log.scrollHeight;
    }
    var acts = E.legalActions(g);
    var myTurn = g.phase !== 'over' && g.turn === 0 && !busy;
    var buttons = document.querySelectorAll('[data-act]');
    for (var b = 0; b < buttons.length; b++) {
      var key = buttons[b].getAttribute('data-act');
      buttons[b].disabled = !myTurn || acts.indexOf(key) < 0;
    }
    if (g.phase === 'over') {
      var title = g.winner === 'draw' ? '平局' : (g.winner === 0 ? '你赢了' : '你输了');
      setText('overTitle', title);
      setText('overText', g.winner === 'draw' ? '双方势均力敌。' :
        (g.winner === 0 ? '你击败了 ' + g.players[1].name + '。' : g.players[1].name + ' 击败了你，再来一局？'));
      $('over').classList.add('show');
    }
  }

  function act(type) {
    if (!g || busy || g.phase === 'over' || g.turn !== 0) return;
    if (E.legalActions(g).indexOf(type) < 0) return;
    var r = E.applyAction(g, { type: type });
    if (!r.ok) return;
    replay.add({ type: type });
    saveReplay();
    scene.emit("act", { type: type });
    paintLog();
    busy = true;
    render();
    if (g.phase === 'over') { busy = false; render(); return; }
    setTimeout(function () {
      var a = E.aiAction(g);
      if (a) E.applyAction(g, a);
      busy = false;
      render();
    }, 480);
  }

  var buttons = document.querySelectorAll('[data-act]');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener('click', function () { act(this.getAttribute('data-act')); });
  }
  $('restart').addEventListener('click', function () { newGame('free'); });
  $('again').addEventListener('click', function () { newGame('free'); });
  $('freeBtn').addEventListener('click', function () { newGame('free'); });
  $('dailyBtn').addEventListener('click', function () { newGame('daily'); });
  $('bgmBtn').addEventListener('click', function () {
    startBgm();
    var muted = Bgm.mute(!Bgm.isMuted());
    var btn = $('bgmBtn');
    btn.textContent = muted ? '音景 关' : '音景 开';
    btn.setAttribute('aria-pressed', muted ? 'false' : 'true');
  });
  (function resumePrompt() {
    var saved = null;
    try { saved = Replay.loadLocal('replay.' + SLUG); } catch (e) { /* storage optional */ }
    var btn = $('resumeBtn');
    if (!btn || !saved || !saved.actions().length) return;
    btn.hidden = false;
    btn.addEventListener('click', function () {
      mode = (saved.params && saved.params.mode) || 'free';
      currentSeed = saved.seed;
      settled = false;
      g = E.createGame({ seed: currentSeed });
      var acts = saved.actions();
      for (var k = 0; k < acts.length; k += 1) {
        if (g.phase === 'over' || g.turn !== 0) break;
        var r = E.applyAction(g, { type: acts[k].type });
        if (!r || r.ok === false) break;
        var guard = 0;
        while (g.phase !== 'over' && g.turn === 1 && guard < 40) {
          guard += 1;
          var ai = E.aiAction(g);
          if (!ai) break;
          E.applyAction(g, ai);
        }
      }
      replay = saved;
      busy = false;
      btn.hidden = true;
      refreshStreak();
      paintLog();
      render();
    });
  })();
  newGame();
}());
</script>
</body>
