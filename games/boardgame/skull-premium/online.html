<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>

<title>骷髅牌 SKULL · 联机房间</title>
<style>
:root { --font-serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif SC", Georgia, serif; --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; --art-coaster: url("../../assets/art/premium/skull/coaster.webp"); --art-wood: url("../../assets/art/premium/skull/table-wood.webp"); --bg: #0f0c09; --bg-2: #1a140f; --panel: rgba(38,29,21,.9); --ink: #f4e8d4; --ink-soft: #ddcbb0; --ink-dim: #b39d80; --brass: #c9a25e; --brass-2: #f0d79a; --line: rgba(201,162,94,.26); --line-soft: rgba(201,162,94,.12); --danger: #e07a6b; --rose: #b84a5a; --coaster: #e7dcc6; --coaster-ink: #3a2f24; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink); font-family: var(--font-sans); font-size: 16px; background: radial-gradient(1000px 720px at 10% -8%, rgba(120,84,42,.34), transparent 60%), linear-gradient(158deg, var(--bg), var(--bg-2) 68%, #090705); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--art-wood) center / cover no-repeat; opacity: .42; }
a { color: var(--brass-2); }
button, input, select, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass-2); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 18px 14px 40px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-family: var(--font-serif); font-size: clamp(20px, 4.6vw, 27px); letter-spacing: .06em; }
.top h1 small { display: block; font-size: 12px; letter-spacing: .24em; color: var(--brass); margin-top: 3px; }
.btn { min-height: 44px; min-width: 44px; padding: 10px 15px; border-radius: 11px; border: 1px solid var(--line); background: rgba(28,20,13,.75); color: var(--ink); font-size: 13px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.primary { background: linear-gradient(160deg, #a97c33, #6b4a1a); border-color: rgba(240,215,154,.5); color: #fff6e0; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 18px; }
.panel { border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(180deg, var(--panel), rgba(18,13,9,.92)); box-shadow: 0 18px 50px rgba(0,0,0,.42); padding: 16px; }
.panel h2 { margin: 0 0 10px; font-family: var(--font-serif); font-size: 17px; letter-spacing: .05em; color: var(--brass-2); }
.panel p { margin: 0 0 10px; font-size: 12px; line-height: 1.65; color: var(--ink-dim); }
label { display: block; font-size: 12px; color: var(--ink-dim); margin: 10px 0 4px; }
input, select { width: 100%; min-height: 44px; border-radius: 9px; border: 1px solid var(--line); background: rgba(10,7,4,.72); color: var(--ink); padding: 9px 11px; font-size: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1 1 140px; }
.room-code { font-family: var(--font-serif); font-size: 24px; letter-spacing: .18em; color: var(--brass-2); }
.status { padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line-soft); background: rgba(255,255,255,.04); font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
.status.err { color: var(--danger); border-color: rgba(224,122,107,.4); }
.seat { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; border: 1px solid var(--line-soft); border-radius: 10px; background: rgba(255,255,255,.03); margin-bottom: 7px; font-size: 13px; }
.seat .tag { font-size: 12px; padding: 3px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-dim); }
.seat .tag.ai { color: var(--brass-2); border-color: rgba(240,215,154,.4); }
.seat .tag.takeover { color: var(--danger); border-color: rgba(224,122,107,.4); }
.lobby, .game { display: none; margin-top: 16px; }
.lobby.on, .game.on { display: block; }
.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 7px; margin: 10px 0; }
.pbox { border: 1px solid var(--line-soft); border-radius: 11px; padding: 9px; background: rgba(14,10,7,.55); min-width: 0; }
.pbox .nm { font-family: var(--font-serif); font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbox .sub { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
.pbox .stackline { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
.pbox.revealable { border-color: var(--brass-2); background: rgba(120,84,42,.28); }
.log { max-height: 120px; overflow-y: auto; border: 1px solid var(--line-soft); border-radius: 9px; background: rgba(8,5,3,.45); padding: 8px 10px; font-size: 12px; line-height: 1.6; color: var(--ink-soft); margin: 10px 0; }
.log p { margin: 0 0 4px; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.controls button { min-height: 44px; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: rgba(30,22,14,.75); color: var(--ink); font-size: 13px; }
.controls button.primary { background: linear-gradient(160deg, #a97c33, #6b4a1a); border-color: var(--brass-2); color: #fff6e0; }
.result .line { display: flex; justify-content: space-between; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line-soft); margin-bottom: 5px; font-size: 13px; }
.result .line.win { border-color: rgba(240,215,154,.5); background: rgba(120,84,42,.28); }
@media (max-width: 480px) { .wrap { padding: 12px 10px 30px; } .panel { padding: 12px; } }
/* safe-area: keep the original bottom padding, clear the iOS home indicator */
body{padding-bottom:env(safe-area-inset-bottom)}
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/skull-premium/online.html">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>骷髅牌 <small>SKULL · ONLINE</small></h1>
    <div class="row"><a class="btn" href="index.html">单人牌桌</a><a class="btn" href="rules.html">规则</a><button class="btn sfx-toggle" type="button" aria-label="音效开关"></button></div>
  </header>

  <div class="grid" id="launcher">
    <section class="panel">
      <h2>创建房间</h2>
      <p>3–6 人。空位由 AI 补足；牌桌人数按实际加入的玩家决定，房主点「开始对局」后发牌。</p>
      <label for="hostName">你的名字</label><input id="hostName" maxlength="16" placeholder="例如：铁锈客" autocomplete="nickname">
      <label for="hostPw">房间密码（可选）</label><input id="hostPw" maxlength="24" placeholder="留空则公开房间" autocomplete="off">
      <div class="row" style="margin-top:12px"><button class="btn primary grow" id="createBtn" type="button">创建房间</button></div>
    </section>
    <section class="panel">
      <h2>加入房间</h2>
      <p>输入房间码或邀请码，也可以从邀请链接直接进入。</p>
      <label for="joinName">你的名字</label><input id="joinName" maxlength="16" placeholder="例如：苔绿客" autocomplete="nickname">
      <label for="joinCode">房间码 / 邀请码</label><input id="joinCode" maxlength="64" placeholder="例如：BAR-42" autocomplete="off">
      <label for="joinPw">房间密码（如需要）</label><input id="joinPw" maxlength="24" placeholder="可选" autocomplete="off">
      <div class="row" style="margin-top:12px"><button class="btn primary grow" id="joinBtn" type="button">加入房间</button></div>
    </section>
  </div>

  <div class="lobby" id="lobby">
    <section class="panel">
      <h2>房间大厅</h2>
      <div class="status" id="lobbyStatus">等待连接…</div>
      <div class="row" style="margin-bottom:10px">
        <div class="grow"><div style="font-size:12px;color:var(--ink-dim)">房间码</div><div class="room-code" id="roomCode">—</div></div>
        <div class="grow"><div style="font-size:12px;color:var(--ink-dim)">邀请码</div><div id="inviteCode" style="font-size:13px;word-break:break-all">—</div></div>
      </div>
      <div id="seatList"></div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="startBtn" type="button" disabled>开始对局</button><button class="btn" id="copyBtn" type="button">复制邀请</button><button class="btn" id="leaveBtn" type="button">离开</button></div>
    </section>
  </div>

  <div class="game" id="game">
    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <div><span style="font-size:12px;color:var(--ink-dim)">房间</span> <b id="gameRoom" class="room-code" style="font-size:18px">—</b></div>
        <div class="row"><span class="status" id="gameStatus" style="margin:0">—</span><button class="btn" id="refreshBtn" type="button">刷新</button></div>
      </div>
      <div class="players" id="gamePlayers"></div>
      <div class="log" id="gameLog" aria-live="polite"></div>
      <div class="status" id="gameTurn">—</div>
      <div class="controls" id="gameControls"></div>
      <div class="row" style="margin-top:6px"><button class="btn" id="rematchBtn" type="button" style="display:none">再来一局</button></div>
      <div class="result" id="gameResult"></div>
    </section>
  </div>
</div>

<script src="../../shared/sfx.js"></script>
<script>
(function () {
  'use strict';
  var LS = 'hhfa-skull-online-v1';
  var session = null, playerId = null, roomId = null, view = null, pendingInvite = '';
  var pollTimer = null, pollBusy = false;
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function sfx(n) { try { window.Sfx && window.Sfx.play && window.Sfx.play(n); } catch (e) {} }
  function setStatus(node, text, err) { node.textContent = text; node.classList.toggle('err', !!err); }
  function newPlayerId() { return 'sk-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
  function save() { try { localStorage.setItem(LS, JSON.stringify({ session: session, playerId: playerId, roomId: roomId })); } catch (e) {} }
  function clearSave() { try { localStorage.removeItem(LS); } catch (e) {} }
  async function api(method, route, body) {
    var r = await fetch(route, { method: method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    var text = await r.text(), data = null;
    try { data = JSON.parse(text); } catch (e) {}
    return { status: r.status, body: data };
  }
  function roomUrl(suffix) { return '/api/rooms/' + encodeURIComponent(roomId) + (suffix || ''); }
  function viewUrl() { return roomUrl() + '?session=' + encodeURIComponent(session) + '&playerId=' + encodeURIComponent(playerId); }
  function mySeatInfo() { return view && view.seats && view.you != null ? view.seats[view.you] : null; }
  function isHost() { var seat = mySeatInfo(); return !!(seat && seat.isHost); }
  function canMove() { return !!(view && (view.legalActions || []).length > 0); }
  async function refresh() {
    if (!roomId || !session || pollBusy) return;
    pollBusy = true;
    try {
      var res = await api('GET', viewUrl());
      if (res.status === 200 && res.body) { view = res.body; render(); }
      else if (res.status === 401) {
        var rec = await api('POST', roomUrl('/reconnect'), { session: session, playerId: playerId });
        if (rec.status === 200 && rec.body) { view = rec.body; render(); }
        else { setStatus($('lobbyStatus'), '会话已失效，请重新加入房间。', true); clearSave(); stopPolling(); }
      } else if (res.status === 404) { setStatus($('lobbyStatus'), '房间已关闭。', true); clearSave(); stopPolling(); }
    } catch (e) {}
    pollBusy = false;
  }
  function startPolling() { stopPolling(); pollTimer = setInterval(refresh, 1100); }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  function renderSeats() {
    if (!view) return;
    var takeover = view.takeover || [];
    var host = $('seatList'); host.innerHTML = '';
    (view.seats || []).forEach(function (s) {
      var row = document.createElement('div'); row.className = 'seat';
      var left = document.createElement('div'); left.textContent = s.name || ('座位 ' + (s.index + 1));
      var tag = document.createElement('span');
      var managed = takeover.indexOf(s.index) !== -1;
      tag.className = 'tag' + (s.ai ? ' ai' : '') + (managed ? ' takeover' : '');
      tag.textContent = s.ai ? 'AI' : (managed ? '已托管' : (s.isHost ? '房主' : (s.isYou ? '你' : '玩家')));
      row.appendChild(left); row.appendChild(tag); host.appendChild(row);
    });
    $('roomCode').textContent = view.code || '—';
    $('inviteCode').textContent = view.inviteCode || '—';
    $('startBtn').disabled = !isHost() || !!view.started;
    setStatus($('lobbyStatus'), view.started ? '对局已开始。' : '等待玩家与房主开始。');
  }

  function render() {
    if (!view) return;
    if (!view.started) {
      $('game').classList.remove('on'); $('lobby').classList.add('on'); $('launcher').style.display = 'grid'; renderSeats(); return;
    }
    $('game').classList.add('on'); $('lobby').classList.remove('on'); $('launcher').style.display = 'none';
    $('gameRoom').textContent = view.code || '—';
    $('rematchBtn').style.display = view.canRestart ? '' : 'none';
    var s = view.state;
    var mine = canMove();
    setStatus($('gameStatus'), s.over ? '对局结束' : (mine ? '轮到你' : '等待其他人…'));

    var host = $('gamePlayers'); host.innerHTML = '';
    s.players.forEach(function (p) {
      var box = document.createElement('div');
      box.className = 'pbox' + (mine && s.phase === 'reveal' && (view.legalActions || []).some(function (m) { return m.type === 'reveal' && m.player === p.index; }) ? ' revealable' : '');
      box.innerHTML = '<div class="nm">' + esc(p.name) + (p.index === view.you ? '（你）' : '') + '</div>' +
        '<div class="sub">' + (p.out ? '已出局' : (p.score + ' 分 · 手牌 ' + p.handCount)) + '</div>' +
        '<div class="stackline">牌堆 ' + p.stackCount + (p.passed && s.phase === 'placement' ? ' · 停手' : '') + '</div>';
      host.appendChild(box);
    });

    var log = $('gameLog'); log.innerHTML = '';
    (s.log || []).slice(-10).reverse().forEach(function (e) { var p = document.createElement('p'); p.textContent = e.text; log.appendChild(p); });

    var turn = '';
    if (s.over) turn = '对局结束。';
    else if (s.phase === 'placement') turn = '放置阶段 · ' + (mine ? '轮到你：放一枚牌或停手' : '等待 ' + s.players[s.current].name);
    else if (s.phase === 'bidding') turn = '叫价阶段 · ' + (mine ? '轮到你叫价' : '等待 ' + s.players[s.current].name) + (s.bid && s.bid.highest ? '（当前 ' + s.bid.highest + '）' : '');
    else if (s.phase === 'reveal') turn = '翻牌阶段 · ' + s.players[s.reveal.bidder].name + ' 翻 ' + s.reveal.flipped + '/' + s.reveal.target;
    $('gameTurn').textContent = turn;

    var controls = $('gameControls'); controls.innerHTML = '';
    function add(label, move, primary) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = label;
      if (primary) b.className = 'primary';
      b.addEventListener('click', function () { sendMove(move); });
      controls.appendChild(b);
    }
    if (mine) {
      var legal = view.legalActions || [];
      legal.forEach(function (m) {
        if (m.type === 'place') add(m.disc === 'rose' ? '放玫瑰' : '放骷髅', { type: 'place', disc: m.disc }, m.disc === 'rose');
        else if (m.type === 'pass') add(s.phase === 'bidding' ? '不叫' : '停手', { type: 'pass' });
        else if (m.type === 'bid') add('叫 ' + m.amount, { type: 'bid', amount: m.amount }, m.amount === legal[legal.length - 1].amount);
        else if (m.type === 'reveal') add('翻开 ' + s.players[m.player].name, { type: 'reveal', player: m.player });
      });
    }

    var result = $('gameResult'); result.innerHTML = '';
    if (s.over && s.result) {
      s.result.scores.forEach(function (p) {
        var line = document.createElement('div');
        line.className = 'line' + (s.result.winners.indexOf(p.index) >= 0 ? ' win' : '');
        line.innerHTML = '<span>' + esc(p.name) + '</span><b>' + p.score + ' / ' + s.result.targetPoints + ' 分</b>';
        result.appendChild(line);
      });
    }
  }

  async function sendMove(move) {
    if (!view || !canMove()) return;
    var res = await api('POST', roomUrl('/actions'), { session: session, playerId: playerId, action: move });
    if (res.status === 200 && res.body) { view = res.body; sfx('move'); render(); }
    else { setStatus($('gameStatus'), '行动失败：' + ((res.body && res.body.error && res.body.error.message) || res.status), true); refresh(); }
  }

  async function createRoom() {
    var name = ($('hostName').value || '').trim() || ('玩家' + Math.floor(Math.random() * 900 + 100));
    var password = ($('hostPw').value || '').trim();
    var res = await api('POST', '/api/rooms', {
      playerId: newPlayerId(),
      nickname: name,
      password: password || undefined,
      visibility: password ? 'private' : 'public'
    });
    if (res.status !== 201) { setStatus($('lobbyStatus'), '创建失败：' + res.status, true); return; }
    roomId = res.body.roomId; session = res.body.session; playerId = res.body.playerId; view = res.body;
    save(); $('launcher').style.display = 'none'; $('lobby').classList.add('on'); renderSeats(); startPolling(); sfx('notify');
  }
  async function joinRoom() {
    var name = ($('joinName').value || '').trim() || ('玩家' + Math.floor(Math.random() * 900 + 100));
    var code = ($('joinCode').value || '').trim();
    var invite = pendingInvite;
    if (!code) { $('joinCode').focus(); return; }
    var pid = newPlayerId();
    var res = await api('POST', '/api/rooms/' + encodeURIComponent(code) + '/join', {
      playerId: pid,
      nickname: name,
      password: ($('joinPw').value || undefined),
      inviteCode: invite || undefined
    });
    if (res.status !== 200) { setStatus($('lobbyStatus'), '加入失败：' + ((res.body && res.body.error && res.body.error.message) || res.status), true); return; }
    roomId = res.body.roomId; session = res.body.session; playerId = pid; view = res.body;
    save(); $('launcher').style.display = 'none'; $('lobby').classList.add('on'); renderSeats(); startPolling(); sfx('notify');
  }
  async function startMatch() {
    var res = await api('POST', roomUrl('/start'), { session: session, playerId: playerId });
    if (res.status !== 200) { setStatus($('lobbyStatus'), '无法开始：' + ((res.body && res.body.error && res.body.error.message) || res.status), true); return; }
    view = res.body; render(); sfx('win');
  }
  async function reconnectSaved() {
    try {
      var saved = JSON.parse(localStorage.getItem(LS) || 'null');
      if (!saved || !saved.session || !saved.roomId) return false;
      roomId = saved.roomId; session = saved.session; playerId = saved.playerId;
      var res = await api('POST', roomUrl('/reconnect'), { session: session, playerId: playerId });
      if (res.status !== 200) { clearSave(); return false; }
      view = res.body; $('launcher').style.display = 'none'; render(); startPolling(); return true;
    } catch (e) { return false; }
  }

  $('createBtn').addEventListener('click', createRoom);
  $('joinBtn').addEventListener('click', joinRoom);
  $('startBtn').addEventListener('click', startMatch);
  $('refreshBtn').addEventListener('click', refresh);
  $('rematchBtn').addEventListener('click', async function () {
    var res = await api('POST', roomUrl('/restart'), { session: session, playerId: playerId });
    if (res.status === 200) { view = res.body; render(); }
  });
  $('leaveBtn').addEventListener('click', async function () {
    try { await api('POST', roomUrl('/leave'), { session: session, playerId: playerId }); } catch (e) {}
    clearSave(); stopPolling(); location.reload();
  });
  $('copyBtn').addEventListener('click', function () {
    if (!view) return;
    var text = location.origin + location.pathname + '?room=' + encodeURIComponent(roomId || view.roomId) +
      '&code=' + encodeURIComponent(view.inviteCode || '');
    try { navigator.clipboard.writeText(text); $('copyBtn').textContent = '已复制'; } catch (e) { $('copyBtn').textContent = text; }
  });
  var params = new URLSearchParams(location.search);
  if (params.get('room')) $('joinCode').value = params.get('room');
  if (params.get('code')) pendingInvite = params.get('code');
  reconnectSaved().then(function (ok) { if (!ok) setStatus($('lobbyStatus'), '创建或加入一个房间。'); });
})();
