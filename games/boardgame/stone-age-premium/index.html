<!doctype html>
<html lang="zh-CN" data-theme="dark" data-online-key="stoneage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#17120c">
<title>石器时代 · Stone Age 桌游（工人放置 · 人机/联机）</title>
<meta name="description" content="精美石器时代 Stone Age：放置工人采集木砖石金、狩猎喂食、建造 28 座建筑、收集 36 张文明卡，和 AI 或朋友完成一场德式工人放置对局。零外部请求，支持手机。">
<meta property="og:image" content="../../assets/art/premium/stoneage/og.webp">
<meta name="twitter:image" content="../../assets/art/premium/stoneage/og.webp">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23231a10'/%3E%3Ccircle cx='32' cy='24' r='9' fill='%23d9b06a'/%3E%3Cpath d='M18 52c0-10 6-17 14-17s14 7 14 17z' fill='%23b8652f'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#17120c;--bg2:#211912;--panel:#2a2117;--panel2:#34281b;--card:#3a2c1d;
  --ink:#f5ecd9;--muted:#c0ad8f;--line:#5a462f;--line2:#74593a;
  --gold:#d9b06a;--gold2:#f3d9a0;--ochre:#c9723c;--green:#9bbf72;--red:#d06a4f;--blue:#7fa8c9;
  --wood:#a9763f;--brick:#b85c3d;--stone:#8a8d88;--goldres:#d9b04a;
  --shadow:0 18px 44px rgba(0,0,0,.46);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Palatino Linotype","Songti SC","Noto Serif SC",Georgia,serif;
}
html[data-theme="light"]{
  --bg:#efe4cf;--bg2:#e7d9c0;--panel:#fbf3e2;--panel2:#f3e7d0;--card:#f7eedb;
  --ink:#302619;--muted:#79684f;--line:#cdb996;--line2:#b79f78;
  --gold:#9a6c22;--gold2:#6f4a10;--ochre:#a34f22;--green:#557b34;--red:#a53f28;--blue:#3d6b8c;
  --shadow:0 18px 44px rgba(74,54,28,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--sans);color:var(--ink);line-height:1.5;overflow-x:hidden;
  background:
    radial-gradient(1000px 600px at 50% -160px,rgba(217,176,106,.16),transparent 62%),
    radial-gradient(700px 480px at 100% 108%,rgba(201,114,60,.10),transparent 60%),
    var(--bg);
  transition:background .35s,color .35s;
}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.24;
  background:url("../../assets/art/premium/stoneage/table-leather.webp") center/cover no-repeat;filter:saturate(.75) contrast(1.05)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,7,4,.35),rgba(10,7,4,.66))}
button,a{font-family:inherit;color:inherit}
button{min-height:44px;min-width:44px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--ink);padding:8px 13px;font-size:13px;cursor:pointer;touch-action:manipulation;
  transition:transform .14s,border-color .18s,background .2s,box-shadow .2s}
button:hover:not(:disabled){transform:translateY(-1px);border-color:var(--gold);box-shadow:0 6px 16px rgba(0,0,0,.22)}
button:active:not(:disabled){transform:translateY(1px) scale(.985)}
button:disabled{opacity:.42;cursor:not-allowed}
button.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#241a0c;border-color:var(--gold2);font-weight:800}
button.ghost{background:transparent}
.iconbtn{width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:17px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 13px;border-radius:12px;
  background:var(--panel2);border:1px solid var(--line2);text-decoration:none;font-size:13px;transition:.18s}
a.btn:hover{border-color:var(--gold);transform:translateY(-1px)}
.app{position:relative;z-index:1;max-width:1340px;margin:0 auto;padding:12px 12px 46px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:220px}
.crest{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#6b4a28,#2a1c0e);
  border:1px solid var(--line2);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.crest img{width:34px;height:34px;object-fit:contain}
h1{margin:0;font-family:var(--serif);font-size:23px;letter-spacing:1px;line-height:1.08}
h1 span{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:3.2px;color:var(--muted);font-weight:600;margin-top:2px}
.scores{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.score{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:13px;padding:6px 10px;min-width:118px;position:relative;overflow:hidden}
.score::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--red))}
.score .who{font-size:11px;color:var(--muted)}
.score .sub{font-size:10px;color:var(--muted)}
.score b{font-size:20px;color:var(--gold2);margin-left:auto;font-variant-numeric:tabular-nums}
.score.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.toggles{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.icon-group{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:12px;background:var(--panel2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.icon-group .iconbtn{border:0;border-radius:0;background:transparent;min-width:44px}
.icon-group .iconbtn:first-child{border-radius:11px 0 0 11px}
.icon-group .iconbtn:last-child{border-radius:0 11px 11px 0}
.icon-group .iconbtn + .iconbtn{border-left:1px solid var(--line)}
.link-group{display:inline-flex;align-items:center;gap:6px}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(330px,.78fr);gap:12px;align-items:start}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;
  padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
.panel h2{font-size:12px;letter-spacing:1.6px;color:var(--muted);margin:0 0 9px;text-transform:uppercase;font-weight:700}
.board-panel{padding:10px}
.board-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.phase-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:11.5px;
  background:rgba(217,176,106,.12);border:1px solid rgba(217,176,106,.34);color:var(--gold2)}
.phase-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.phase-pill.ai{background:rgba(127,168,201,.12);border-color:rgba(127,168,201,.34);color:var(--blue)}
.board{display:grid;gap:8px}
.section-label{font-size:10.5px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:6px 2px 2px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.section-label .legend{display:inline-flex;align-items:center;gap:4px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--gold2);opacity:.9}
.section-label .legend .die-ico{margin-right:0}
.spots{display:grid;gap:8px}
.spots.village{grid-template-columns:repeat(3,minmax(0,1fr))}
.spots.resources{grid-template-columns:repeat(5,minmax(0,1fr))}
.spot{position:relative;border:1px solid var(--line2);border-radius:13px;background:linear-gradient(160deg,var(--card),rgba(30,22,14,.9));
  padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:98px;overflow:hidden}
.spot .spot-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.spot .spot-foot .workers{min-height:0}
.spot::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;background:radial-gradient(circle at 20% 0%,rgba(255,255,255,.3),transparent 55%)}
.spot .nm{font-family:var(--serif);font-size:13.5px;font-weight:700;color:var(--gold2);position:relative;z-index:1;word-break:keep-all;overflow-wrap:break-word}
.spot .ds{font-size:9.5px;color:var(--muted);line-height:1.35;position:relative;z-index:1;flex:1;word-break:keep-all;overflow-wrap:break-word}
.spot .cap{font-size:9.5px;color:var(--muted);position:relative;z-index:1;display:flex;align-items:center;gap:4px;flex-wrap:wrap;word-break:keep-all}
.spot .cap b{color:var(--ink);font-size:11px}
.empty-slot{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;line-height:1;color:var(--muted);
  border:1px dashed var(--line2);border-radius:999px;padding:4px 9px;opacity:.85;white-space:nowrap}
.spot .workers{display:flex;gap:3px;align-items:center;min-height:18px;flex-wrap:wrap;position:relative;z-index:1}
.wdot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.4);box-shadow:inset 0 1px 1px rgba(255,255,255,.4)}
.spot.playable{cursor:pointer;border-color:var(--gold);box-shadow:0 0 0 1px rgba(217,176,106,.28),0 8px 20px rgba(0,0,0,.24)}
.spot.playable:hover{transform:translateY(-2px);background:linear-gradient(160deg,#4a3822,#332517)}
.spot.occupied{opacity:.82}
.spot .tag{position:absolute;right:7px;top:7px;font-size:9px;padding:2px 5px;border-radius:999px;background:rgba(0,0,0,.26);color:var(--gold2);z-index:2}
.civ-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.civ{border:1px solid var(--line2);border-radius:11px;background:linear-gradient(165deg,#46331d,#2a1d10);padding:7px;min-height:92px;display:flex;flex-direction:column;gap:3px;position:relative;text-align:left}
.civ .cost{position:absolute;right:6px;top:5px;font-size:10px;color:var(--gold2);background:rgba(0,0,0,.28);border-radius:999px;padding:1px 6px}
.civ .nm{font-family:var(--serif);font-size:12px;color:var(--gold2);font-weight:700;margin-right:28px;word-break:keep-all;overflow-wrap:break-word}
.civ .top{font-size:9.5px;color:var(--ink);line-height:1.3;flex:1;word-break:keep-all;overflow-wrap:break-word}
.civ .bottom{font-size:9px;color:var(--muted);word-break:keep-all;overflow-wrap:break-word}
.civ.empty{opacity:.45;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.civ.playable{cursor:pointer;border-color:var(--gold);box-shadow:0 0 0 1px rgba(217,176,106,.24)}
.build-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bstack{border:1px solid var(--line2);border-radius:12px;background:linear-gradient(165deg,#3c2b18,#281c10);padding:8px;text-align:left;min-height:92px;display:flex;gap:8px;align-items:center;position:relative}
.bstack img{width:56px;height:56px;object-fit:contain;flex:none;filter:drop-shadow(0 4px 7px rgba(0,0,0,.35))}
.bstack .info{min-width:0;flex:1}
.bstack .nm{font-family:var(--serif);font-size:13px;color:var(--gold2);font-weight:700;word-break:keep-all;overflow-wrap:break-word}
.bstack .cost{font-size:9.5px;color:var(--muted);line-height:1.35;word-break:keep-all;overflow-wrap:break-word}
.bstack .left{font-size:10px;color:var(--green)}
.bstack.playable{cursor:pointer;border-color:var(--gold);box-shadow:0 0 0 1px rgba(217,176,106,.24)}
.bstack.empty{opacity:.4;justify-content:center;font-size:11px;color:var(--muted)}
.pcard{border:1px solid var(--line);border-radius:12px;padding:8px;background:rgba(0,0,0,.10);margin-bottom:8px;position:relative}
.pcard:last-child{margin-bottom:0}
.pcard.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pcard .head{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.pcard .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.pcard .nm{font-size:12.5px;font-weight:800}
.pcard .sc{margin-left:auto;font-family:var(--serif);font-size:20px;color:var(--gold2)}
.pcard .row{display:flex;gap:5px;flex-wrap:wrap}
.res{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:10.5px;color:var(--muted)}
.res img{width:16px;height:16px;object-fit:contain}
.res b{color:var(--ink);font-size:12px}
.res.food img{width:17px;height:17px}
.pmeta{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}
.tools{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tool{font-size:9.5px;border:1px solid var(--line2);border-radius:6px;padding:1px 5px;color:var(--gold2);background:rgba(217,176,106,.08)}
.log{max-height:210px;overflow:auto;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.log .row{display:flex;gap:6px;line-height:1.35}
.log .t{color:var(--line2);flex:none;font-variant-numeric:tabular-nums}
.log .row.gather{color:var(--green)}
.log .row.building{color:var(--gold2)}
.log .row.feed{color:var(--blue)}
.log .row.end{color:var(--gold2);font-weight:700}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.hint{font-size:12px;color:var(--muted);line-height:1.55}
.ai-banner{position:fixed;left:50%;top:12px;transform:translate(-50%,-14px);z-index:50;opacity:0;pointer-events:none;
  background:rgba(23,18,12,.94);border:1px solid rgba(127,168,201,.5);color:#cfe4f5;border-radius:999px;
  padding:7px 16px;font-size:12px;backdrop-filter:blur(8px);transition:.25s;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.ai-banner.show{opacity:1;transform:translate(-50%,0)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;
  background:rgba(23,18,12,.95);border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:9px 18px;
  font-size:13px;transition:.28s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(9,6,3,.78);backdrop-filter:blur(5px)}
.modal.show{display:flex}
.dialog{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--gold);border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:dialogIn .3s ease both}
.dialog h3{margin:0 0 3px;font-family:var(--serif);font-size:25px;color:var(--gold2);text-align:center}
.dialog .sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:13px}
.finals{display:grid;gap:7px;margin:12px 0}
.frow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px 10px}
.frow.win{border-color:var(--gold);background:rgba(217,176,106,.1)}
.frow .nm{font-size:13px;font-weight:700}
.frow .sc{margin-left:auto;font-family:var(--serif);font-size:21px;color:var(--gold2)}
.break{font-size:11px;color:var(--muted);max-height:190px;overflow:auto;margin:5px 0 12px;display:grid;gap:4px}
.picker{display:grid;gap:10px}
.picker .big{font-family:var(--serif);font-size:20px;color:var(--gold2);text-align:center}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px}
.stepper button{width:52px;height:48px;font-size:22px}
.stepper .n{font-family:var(--serif);font-size:32px;color:var(--gold2);min-width:54px;text-align:center}
.dice{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.die{width:34px;height:34px;border-radius:8px;background:linear-gradient(145deg,#f4e7c8,#cbb48c);color:#3a2a16;
  display:grid;place-items:center;font-size:15px;font-weight:800;box-shadow:inset 0 1px 2px rgba(255,255,255,.7),0 3px 6px rgba(0,0,0,.25)}
/* 素材接线：每个工人 1 骰，采集点用量面图标提示骰数 */
.die-ico{display:inline-block;width:13px;height:13px;margin-right:3px;vertical-align:-2px;
  background:url("../../assets/art/premium/stoneage/die-blank.webp") center/contain no-repeat}
@keyframes dialogIn{0%{opacity:0;transform:translateY(14px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes cardIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@media(max-width:980px){.layout{grid-template-columns:1fr}.spots.resources{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){
  .app{padding:8px 8px 36px}
  h1{font-size:19px}.brand{min-width:0}.scores{order:3;width:100%}
  .score{flex:1;min-width:0;padding:5px 8px}.score b{font-size:17px}
  .toggles{width:100%;justify-content:space-between;gap:6px}
  .link-group{flex:1;justify-content:flex-end}
  .panel{padding:9px;border-radius:13px}
  /* 两列：中文词组不再被挤到词内断行 */
  .spots.village{grid-template-columns:repeat(2,minmax(0,1fr))}
  .spots.resources{grid-template-columns:repeat(2,minmax(0,1fr))}
  .civ-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .build-grid{grid-template-columns:1fr}
  .spot{min-height:84px;padding:7px}.spot .nm{font-size:12.5px}
  .spot .ds{font-size:11px}
  .bstack img{width:48px;height:48px}
  button{padding:7px 10px;font-size:12.5px}
  .dialog{padding:16px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* safe-area: keep the original bottom padding, clear the iOS home indicator */
body{padding-bottom:env(safe-area-inset-bottom)}
</style>

<body>
<div hidden aria-hidden="true" id="asset-refs"><img loading="lazy" decoding="async" src="../../assets/art/premium/stoneage/cover.webp" alt=""><img loading="lazy" decoding="async" src="../../assets/art/premium/stoneage/detail.webp" alt=""></div>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="crest"><img src="../../assets/art/premium/stoneage/worker.webp" alt=""></div>
      <h1>石器时代<span>STONE AGE · 工人放置</span></h1>
    </div>
    <div class="scores" id="scores" aria-label="比分"></div>
    <div class="toggles">
      <div class="icon-group" role="group" aria-label="显示与对局">
        <button class="iconbtn ghost" id="theme" aria-label="切换明暗主题" title="明暗">◐</button>
        <button class="iconbtn ghost" id="sound" aria-label="开关音效" title="音效">♪</button>
        <button class="iconbtn ghost" id="restart" aria-label="重开一局" title="重开">↻</button>
      </div>
      <div class="link-group">
        <a class="btn ghost" href="online.html" id="online-link">联机房间</a>
        <a class="btn" href="rules.html">规则</a>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel board-panel" aria-label="石器时代棋盘">
      <div class="board-head">
        <span class="phase-pill" id="phase-pill">放置工人</span>
        <span class="hint" id="round-info">第 1 轮</span>
        <span class="hint" id="turn-info" style="margin-left:auto"></span>
      </div>
      <div class="board" id="board">
        <div class="section-label">村庄</div>
        <div class="spots village" id="village"></div>
        <div class="section-label">采集与狩猎 <span class="legend"><i class="die-ico" aria-hidden="true"></i>每工人 1 骰</span></div>
        <div class="spots resources" id="resources"></div>
        <div class="section-label">文明卡 · 从右往左费用 1–4</div>
        <div class="civ-grid" id="civ"></div>
        <div class="section-label">建筑 · 每叠顶部可购买</div>
        <div class="build-grid" id="buildings"></div>
      </div>
      <div class="actions" id="actions"></div>
    </section>

    <aside>
      <section class="panel" aria-label="玩家面板">
        <h2>部落</h2>
        <div id="players"></div>
      </section>
      <section class="panel" aria-label="对局记录">
        <h2>对局记录</h2>
        <div class="log" id="log"></div>
      </section>
      <section class="panel" aria-label="提示">

<script>
/* Unified online client for ?online=<roomId> (games/shared/online-room-server.mjs).
 * The authoritative server owns the match; this page only polls and submits
 * { session, action } to /api/rooms/:id/actions. */
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var room = params.get('online') || params.get('room');
  if (!room) { window.OnlineBridge = { active: false }; return; }
  var readJSON = function (key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (err) { return null; } };
  var writeJSON = function (key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (err) {} };
  var saved = readJSON('stoneage-online-session-' + room) || {};
  var state = {
    room: room,
    session: params.get('session') || saved.session || '',
    playerId: params.get('player') || saved.playerId || '',
    view: null,
    timer: null,
    sending: false,
    closed: false
  };
  var listeners = [];
  var errorListeners = [];
  function emit() { listeners.slice().forEach(function (fn) { try { fn(state.view); } catch (err) {} }); }
  function emitError(err) { errorListeners.slice().forEach(function (fn) { try { fn(err); } catch (e) {} }); }
  function api(method, route, body) {
    return fetch(route, {
      method: method,
      headers: body ? { 'content-type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined
    }).then(function (response) {
      return response.text().then(function (text) {
        var data = null;
        try { data = JSON.parse(text); } catch (err) { data = null; }
        if (!response.ok) {
          throw Object.assign(new Error(data && data.error && data.error.message ? data.error.message : ('HTTP ' + response.status)), {
            code: data && data.error && data.error.code, status: response.status
          });
        }
        return data;
      });
    });
  }
  function laneUrl(suffix) {
    return '/api/rooms/' + encodeURIComponent(state.room) + (suffix || '');
  }
  function poll() {
    if (state.closed) return;
    if (!state.session || !state.playerId) {
      location.replace('online.html?room=' + encodeURIComponent(state.room));
      return;
    }
    api('GET', laneUrl() + '?session=' + encodeURIComponent(state.session) + '&playerId=' + encodeURIComponent(state.playerId))
      .then(function (view) {
        state.view = view;
        writeJSON('stoneage-online-session-' + state.room, { session: state.session, playerId: state.playerId });
        emit();
      })
      .catch(function (err) {
        emitError(err);
        if (err.status === 404 || err.code === 'E_SESSION' || err.code === 'E_PLAYER') {
          state.closed = true;
          return;
        }
      })
      .then(function () {
        clearTimeout(state.timer);
        if (!state.closed) state.timer = setTimeout(poll, 900);
      });
  }
  function send(action) {
    if (state.sending || !state.view) return Promise.resolve(null);
    state.sending = true;
    return api('POST', laneUrl('/actions'), {
      session: state.session, playerId: state.playerId, action: action
    }).then(function (view) {
      state.view = view;
      emit();
      return view;
    }).catch(function (err) {
      emitError(err);
      return null;
    }).then(function (view) {
      state.sending = false;
      return view;
    });
  }
  function restart() {
    return api('POST', laneUrl('/restart'), { session: state.session, playerId: state.playerId })
      .then(function (view) { state.view = view; emit(); return view; })
      .catch(function (err) { emitError(err); return null; });
  }
  function seatIndex() { return state.view && state.view.you != null ? state.view.you : -1; }
  function isMyTurn() {
    var view = state.view;
    return !!(view && !view.over && view.you != null && view.state && view.state.currentPlayer === view.you);
  }
  window.OnlineBridge = {
    active: true,
    room: room,
    view: function () { return state.view; },
    onChange: function (fn) { listeners.push(fn); if (state.view) fn(state.view); },
    onError: function (fn) { errorListeners.push(fn); },
    send: send,
    restart: restart,
    seatIndex: seatIndex,
    isMyTurn: isMyTurn,
    session: function () { return { session: state.session, playerId: state.playerId }; }
  };
  poll();
})();
</script>
<script>
(function () {
  'use strict';
  var E = window.StoneAgeEngine;
  var D = window.StoneAgeData;
  var game = null;
  var muted = false;
  var aiTimer = null;
  var pick = null;
  var toastTimer = null;
  var lastRoundShown = 0;
  var ONLINE = !!(window.OnlineBridge && window.OnlineBridge.active);
  var onlineReady = false;

  var RES_IMG = {
    wood: '../../assets/art/premium/stoneage/resource-wood.webp',
    brick: '../../assets/art/premium/stoneage/resource-brick.webp',
    stone: '../../assets/art/premium/stoneage/resource-stone.webp',
    gold: '../../assets/art/premium/stoneage/resource-gold.webp'
  };
  var FOOD_IMG = '../../assets/art/premium/stoneage/food-bowl.webp';
  var HUT_IMG = '../../assets/art/premium/stoneage/hut.webp';
  var WORKER_IMG = '../../assets/art/premium/stoneage/worker.webp';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
  function sfx(name) { if (!muted && window.Sfx) { try { window.Sfx.play(name); } catch (e) {} } }
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1600);
  }

  function ensureReadable() {
    if (!document.body) return;
    var nodes = document.querySelectorAll('body *');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (!el.textContent || !String(el.textContent).trim()) continue;
      var fs = parseFloat(window.getComputedStyle(el).fontSize);
      if (fs && fs < 12) el.style.fontSize = '12px';
    }
  }
  function showAI(on) { $('ai-banner').classList.toggle('show', !!on); }

  function humanTurn() {
    if (!game || game.over || game.phase !== 'placement') return false;
    if (ONLINE) return onlineReady && window.OnlineBridge.isMyTurn();
    return !game.players[game.currentPlayer].isAI;
  }
  function canAct() {
    if (!game || game.over) return false;
    if (ONLINE) return onlineReady && window.OnlineBridge.isMyTurn();
    return !game.players[game.currentPlayer].isAI;
  }

  /* ---------------------------- 渲染 ---------------------------- */
  function renderScores() {
    var box = $('scores');
    box.innerHTML = game.players.map(function (p, i) {
      return '<div class="score' + (i === game.currentPlayer && game.phase !== 'gameover' ? ' active' : '') + '" style="--c:' + p.color + '">' +
        '<div><div class="who">' + esc(p.name) + '</div><div class="sub">' + (p.isAI ? 'AI' : '玩家') + ' · 工人 ' + p.totalWorkers + '</div></div>' +
        '<b>' + p.score + '</b></div>';
    }).join('');
  }
  function workerDots(count, playerIndex) {
    var color = game.players[playerIndex] ? game.players[playerIndex].color : '#999';
    var out = '';
    for (var i = 0; i < count; i++) out += '<span class="wdot" style="background:' + color + '"></span>';
    return out;
  }
  function spotCard(spot, occupied, playable, extra) {
    var workers = occupied || { workers: [], total: 0 };
    var dots = '';
    for (var pi = 0; pi < game.playerCount; pi++) {
      for (var k = 0; k < (workers.workers[pi] || 0); k++) dots += workerDots(1, pi);
    }
    var capHtml = esc(extra || '');
    if (spot.divisor) capHtml = '<i class="die-ico" aria-hidden="true"></i><span>' + capHtml + '</span>';
    return '<button class="spot' + (playable ? ' playable' : '') + (workers.total ? ' occupied' : '') + '" data-spot="' + spot.id + '"' +
      (playable ? '' : ' disabled') + ' aria-label="' + esc(spot.name) + '">' +
      '<span class="nm">' + esc(spot.name) + (workers.total ? ' · ' + workers.total : '') + '</span>' +
      '<span class="ds">' + esc(spot.desc) + '</span>' +
      '<span class="spot-foot"><span class="cap">' + capHtml + '</span>' +
      '<span class="workers">' + (dots || '<span class="empty-slot">空位</span>') + '</span></span></button>';
  }
  function renderBoard() {
    var moves = canAct() ? E.getLegalMoves(game) : [];
    var playableSpots = {};
    moves.forEach(function (m) { if (m.type === 'place') playableSpots[m.spotId] = true; });
    var village = ['toolmaker', 'hut', 'field'].map(function (id) {
      var spot = D.SPOT_BY_ID[id];
      var occ = game.spots[id];
      var extra = id === 'hut' ? '恰好 2 名同族工人' : '恰好 1 名工人';
      return spotCard(spot, occ, !!playableSpots[id], extra);
    }).join('');
    $('village').innerHTML = village;
    var resources = ['forest', 'clay', 'quarry', 'river', 'hunt'].map(function (id) {
      var spot = D.SPOT_BY_ID[id];
      var occ = game.spots[id];
      var extra = id === 'hunt' ? '不限人数 · ÷2 食物' : '容量 7 · ' + occ.total + '/7 人';
      return spotCard(spot, occ, !!playableSpots[id], extra);
    }).join('');
    $('resources').innerHTML = resources;

    $('civ').innerHTML = game.civSlots.map(function (cardId, slot) {
      if (!cardId) return '<div class="civ empty">空位</div>';
      var card = D.CIV_BY_ID[cardId];
      var cost = 4 - slot;
      var playable = moves.some(function (m) { return m.type === 'place' && m.spotId === 'civ' && m.slotIndex === slot; });
      var topText = cardTopText(card);
      var bottomText = cardBottomText(card);
      return '<button class="civ' + (playable ? ' playable' : '') + '" data-civ="' + slot + '"' + (playable ? '' : ' disabled') + ' aria-label="' + esc(card.name) + '">' +
        '<span class="cost">' + cost + ' 资源</span><span class="nm">' + esc(card.name) + '</span>' +
        '<span class="top">' + esc(topText) + '</span><span class="bottom">' + esc(bottomText) + '</span></button>';
    }).join('');

    $('buildings').innerHTML = game.buildingStacks.map(function (stack, bi) {
      if (!stack.length) return '<div class="bstack empty">建筑叠已耗尽</div>';
      var b = D.BUILDING_BY_ID[stack[stack.length - 1]];
      var playable = moves.some(function (m) { return m.type === 'place' && m.spotId === 'building' && m.slotIndex === bi; });
      var occ = game.spots.building[bi];
      var dots = '';
      for (var pi = 0; pi < game.playerCount; pi++) for (var k = 0; k < (occ.workers[pi] || 0); k++) dots += workerDots(1, pi);
      return '<button class="bstack' + (playable ? ' playable' : '') + '" data-build="' + bi + '"' + (playable ? '' : ' disabled') + ' aria-label="' + esc(b.name) + '">' +
        '<img src="' + HUT_IMG + '" alt="">' +
        '<span class="info"><span class="nm">' + esc(b.name) + ' · ' + b.points + ' 分</span>' +
        '<span class="cost">木 ' + (b.cost.wood || 0) + ' · 砖 ' + (b.cost.brick || 0) + ' · 石 ' + (b.cost.stone || 0) + ' · 金 ' + (b.cost.gold || 0) + '</span>' +
        '<span class="left">剩余 ' + stack.length + ' 张' + (dots ? ' · ' + dots : '') + '</span></span></button>';
    }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('[data-spot]'), function (btn) {
      btn.addEventListener('click', function () { openPicker(btn.getAttribute('data-spot'), -1); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-civ]'), function (btn) {
      btn.addEventListener('click', function () { openPicker('civ', Number(btn.getAttribute('data-civ'))); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-build]'), function (btn) {
      btn.addEventListener('click', function () { openPicker('building', Number(btn.getAttribute('data-build'))); });
    });
  }
  function cardTopText(card) {
    var t = card.top || {};
    if (t.kind === 'resource') return '立即 +' + t.amount + ' ' + D.RESOURCE_NAMES[t.resource];
    if (t.kind === 'bundle') return '立即获得 ' + Object.keys(t.gain).map(function (k) { return t.gain[k] + D.RESOURCE_NAMES[k]; }).join(' ');
    if (t.kind === 'food') return '立即 +' + t.amount + ' 食物';
    if (t.kind === 'tool') return '永久工具 +' + t.amount;
    if (t.kind === 'agriculture') return '农业 +' + t.amount;
    if (t.kind === 'vp') return '立即 +' + t.amount + ' 分';
    if (t.kind === 'onceTool') return '一次性工具 +' + t.amount;
    if (t.kind === 'rollResource') return '掷 2 骰得' + D.RESOURCE_NAMES[t.resource];
    if (t.kind === 'hidden') return '只用于终局计分';
    return '立即效果';
  }
  function cardBottomText(card) {
    var b = card.bottom || {};
    if (b.kind === 'culture') return '终局：' + D.CULTURE_NAMES[b.key];
    if (b.kind === 'multiplier') return '终局：' + D.MULTIPLIER_NAMES[b.key] + '乘数';
    return '终局计分';
  }
  function renderPlayers() {
    $('players').innerHTML = game.players.map(function (p, i) {
      var res = '<span class="res"><img src="' + RES_IMG.wood + '" alt="">木 <b>' + p.resources.wood + '</b></span>' +
        '<span class="res"><img src="' + RES_IMG.brick + '" alt="">砖 <b>' + p.resources.brick + '</b></span>' +
        '<span class="res"><img src="' + RES_IMG.stone + '" alt="">石 <b>' + p.resources.stone + '</b></span>' +
        '<span class="res"><img src="' + RES_IMG.gold + '" alt="">金 <b>' + p.resources.gold + '</b></span>' +
        '<span class="res food"><img src="' + FOOD_IMG + '" alt="">食物 <b>' + p.food + '</b></span>';
      var tools = p.tools.map(function (v) { return '<span class="tool">工具 ' + v + '</span>'; }).join('');
      return '<div class="pcard' + (i === game.currentPlayer && game.phase !== 'gameover' ? ' active' : '') + '" style="--c:' + p.color + '">' +
        '<div class="head"><span class="dot"></span><span class="nm">' + esc(p.name) + (p.isAI ? ' · AI' : '') + '</span>' +
        '<span class="sc">' + p.score + '</span></div>' +
        '<div class="row">' + res + '</div>' +
        '<div class="pmeta">工人 ' + p.totalWorkers + '（本轮剩 ' + p.workersLeft + '） · 农业 ' + p.agriculture + ' · 建筑 ' + p.buildings.length + ' · 文明卡 ' + p.civCards.length + '</div>' +
        '<div class="tools">' + (tools || '<span class="pmeta">还没有工具</span>') + '</div></div>';
    }).join('');
  }
  function renderLog() {
    var rows = game.log.slice(-18).reverse();
    $('log').innerHTML = rows.map(function (x) {
      return '<div class="row ' + (x.type || '') + '"><span class="t">R' + x.round + '</span><span>' + esc(x.text) + '</span></div>';
    }).join('') || '<div class="hint">还没有记录。</div>';
  }
  function renderHeader() {
    var pill = $('phase-pill');
    var current = game.players[game.currentPlayer];
    var phaseName = { placement: '放置工人', execute: '结算工人', feed: '喂食', gameover: '终局' }[game.phase] || game.phase;
    pill.textContent = phaseName + (current ? ' · ' + current.name : '');
    pill.className = 'phase-pill' + (current && current.isAI && !ONLINE ? ' ai' : '');
    $('round-info').textContent = '第 ' + game.round + ' 轮 · 先手 ' + game.players[game.startPlayer].name;
    $('turn-info').textContent = game.over ? '对局结束' : (canAct() ? '轮到你' : (ONLINE ? '等待对手' : 'AI 行动中'));
    var actions = $('actions');
    actions.innerHTML = '';
    if (game.over) {
      actions.innerHTML = '<button class="primary" id="again2">再来一局</button>';
      $('again2').addEventListener('click', newGame);
      return;
    }
    if (game.phase === 'execute' && canAct()) {
      var btn = document.createElement('button');
      btn.className = 'primary';
      btn.textContent = '结算我的工人';
      btn.addEventListener('click', function () { apply({ type: 'resolve' }); });
      actions.appendChild(btn);
    } else if (game.phase === 'feed' && canAct()) {
      var feedBtn = document.createElement('button');
      feedBtn.className = 'primary';
      feedBtn.textContent = '喂食并结束本轮';
      feedBtn.addEventListener('click', function () { apply({ type: 'feed' }); });
      actions.appendChild(feedBtn);
    } else if (game.phase === 'placement' && canAct()) {
      var hint = document.createElement('span');
      hint.className = 'hint';
      hint.textContent = '剩余工人 ' + game.players[game.currentPlayer].workersLeft + ' · 点击亮起的放置点';
      actions.appendChild(hint);
    }
  }
  function render() {
    renderScores(); renderHeader(); renderBoard(); renderPlayers(); renderLog();
    ensureReadable();
  }

  /* ---------------------------- 行动 ---------------------------- */
  function openPicker(spotId, slotIndex) {
    if (!canAct() || game.phase !== 'placement') return;
    var moves = E.getLegalMoves(game).filter(function (m) {
      return m.type === 'place' && m.spotId === spotId && (m.slotIndex == null ? -1 : m.slotIndex) === slotIndex;
    });
    if (!moves.length) { sfx('error'); return; }
    var counts = moves.map(function (m) { return m.workers; }).sort(function (a, b) { return a - b; });
    pick = { spotId: spotId, slotIndex: slotIndex, min: counts[0], max: counts[counts.length - 1], count: counts[0] };
    var spot = D.SPOT_BY_ID[spotId];
    $('picker-title').textContent = spotId === 'civ' ? '获得文明卡' : spotId === 'building' ? '购买建筑' : '放置工人';
    $('picker-spot').textContent = spot.name + (spotId === 'civ' ? ' · 第 ' + (slotIndex + 1) + ' 位' : spotId === 'building' ? ' · 第 ' + (slotIndex + 1) + ' 叠' : '');
    $('picker-desc').textContent = spot.desc;
    $('picker-sub').textContent = '本轮剩余工人 ' + game.players[game.currentPlayer].workersLeft;
    $('picker-count').textContent = pick.count;
    $('minus').disabled = pick.min === pick.max;
    $('plus').disabled = pick.min === pick.max;
    $('picker').classList.add('show');
    sfx('click');
  }
  function closePicker() { $('picker').classList.remove('show'); pick = null; }
  function apply(move) {
    if (!game || game.over) return;
  if (ONLINE) {
      window.OnlineBridge.send(move).then(function (view) { if (view) onlineApply(view); });
      return;
    }
    try {
      game = E.applyMove(game, move);
      render();
      if (game.over) { endGame(); return; }
      schedule();
    } catch (err) { sfx('error'); toast(err.message); render(); }
  }
  function schedule() {
    clearTimeout(aiTimer);
    if (ONLINE || !game || game.over) { showAI(false); return; }
    var current = game.players[game.currentPlayer];
    if (!current || !current.isAI) { showAI(false); return; }
    showAI(true);
    if (game.phase === 'placement') {
      aiTimer = setTimeout(function () {
        if (!game || game.over || game.phase !== 'placement') { showAI(false); return; }
        try { apply(E.chooseAIMove(game)); } catch (err) { showAI(false); toast('AI 放置异常：' + err.message); }
      }, 420);
    } else if (game.phase === 'execute') {
      aiTimer = setTimeout(function () {
        if (!game || game.over || game.phase !== 'execute') { showAI(false); return; }
        try { apply({ type: 'resolve' }); } catch (err) { showAI(false); toast('AI 结算异常：' + err.message); }
      }, 540);
    } else if (game.phase === 'feed') {
      aiTimer = setTimeout(function () {
        if (!game || game.over || game.phase !== 'feed') { showAI(false); return; }
        try { apply({ type: 'feed' }); } catch (err) { showAI(false); toast('喂食异常：' + err.message); }
      }, 560);
    }
  }
  function endGame() {
    showAI(false);
    var result = game.result;
    if (!result) { try { result = E.getResults(game); } catch (e) { return; } }
    sfx(result.winners && result.winners.indexOf(0) >= 0 ? 'win' : 'click');
    $('modal-sub').textContent = (result.reason || '终局') + ' · 共 ' + game.round + ' 轮';
    $('finals').innerHTML = result.scores.map(function (row) {
      return '<div class="frow' + (result.winners.indexOf(row.index) >= 0 ? ' win' : '') + '">' +
        '<span class="dot" style="background:' + game.players[row.index].color + '"></span>' +
        '<span class="nm">' + esc(row.name) + '</span><span class="sc">' + row.total + '</span></div>';
    }).join('');
    $('breakdown').innerHTML = result.scores.map(function (row) {
      return '<div><b>' + esc(row.name) + '</b>：建筑/即时 ' + row.base + ' · 文化 ' + row.culture +
        ' · 乘数 ' + row.multipliers + ' · 资源 ' + row.resourcePoints +
        ' · 平局值 ' + row.tiebreak + '</div>';
    }).join('');
    $('modal').classList.add('show');
    render();
  }
  function newGame() {
    clearTimeout(aiTimer);
    showAI(false);
    if (ONLINE) {
      window.OnlineBridge.restart().then(function (view) {
        if (view) { $('modal').classList.remove('show'); onlineApply(view); toast('房主已重开一局'); }
      });
      return;
    }
    game = E.createGame({
      seed: (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0,
      playerCount: 2,
      names: ['你', 'AI · 猎手'],
      isAI: [false, true]
    });
    $('modal').classList.remove('show');
    render();
    schedule();
    toast('新的一局：先放工人，再结算，最后喂食');
  }

  /* ---------------------------- 联机 ---------------------------- */
  function onlineApply(view) {
    if (!view || !view.state) return;
    game = view.state;
    if (game.civDeck == null) game.civDeck = new Array(view.state.civDeckCount || 0);
    onlineReady = true;
    $('online-link').textContent = '房间 ' + (view.code || (view.roomId || '').slice(0, 6));
    $('again').disabled = !view.canRestart;
    $('restart').disabled = !view.canRestart;
    render();
    if (game.over) endGame();
  }
  function onlineSend(move) {
    if (!ONLINE) return;
    window.OnlineBridge.send(move).then(function (view) { if (view) onlineApply(view); });
  }

  /* ---------------------------- 绑定 ---------------------------- */
  $('minus').addEventListener('click', function () {
    if (!pick) return;
    pick.count = Math.max(pick.min, pick.count - 1);
    $('picker-count').textContent = pick.count;
    sfx('click');
  });
  $('plus').addEventListener('click', function () {
    if (!pick) return;
    pick.count = Math.min(pick.max, pick.count + 1);
    $('picker-count').textContent = pick.count;
    sfx('click');
  });
  $('cancel-place').addEventListener('click', closePicker);
  $('confirm-place').addEventListener('click', function () {
    if (!pick) return;
    var move = { type: 'place', spotId: pick.spotId, slotIndex: pick.slotIndex, workers: pick.count };
    closePicker();
    apply(move);
  });
  $('again').addEventListener('click', newGame);
  $('restart').addEventListener('click', function () {
    if (game && !game.over && game.turn > 4 && !window.confirm('当前对局尚未结束，确定重开？')) return;
    newGame();
  });
  $('theme').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    storeSet('sa-prem-theme', next);
    sfx('click');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', next === 'light' ? '#efe4cf' : '#17120c');
  });
  $('sound').addEventListener('click', function () {
    muted = !muted;
    $('sound').style.opacity = muted ? '.45' : '1';
    storeSet('sa-prem-muted', muted ? '1' : '0');
    if (!muted) sfx('click');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closePicker(); $('modal').classList.remove('show'); }
  });

  var savedTheme = storeGet('sa-prem-theme');
  if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
  muted = storeGet('sa-prem-muted') === '1';
  $('sound').style.opacity = muted ? '.45' : '1';
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  if (ONLINE) {
    window.OnlineBridge.onChange(onlineApply);
    window.OnlineBridge.onError(function (err) {
      toast('联机：' + (err && err.message ? err.message : '连接失败'));
      if (err && (err.code === 'E_SESSION' || err.status === 404)) setTimeout(function () { location.href = 'online.html'; }, 1200);
    });
    $('hint').textContent = '正在连接联机房间…';
  } else {
    newGame();
  }
  setTimeout(ensureReadable, 80);
})();
</script>
</body>
</html>
