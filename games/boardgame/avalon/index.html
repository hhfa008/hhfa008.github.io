<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Avalon 阿瓦隆简化版：五人身份推理桌游，梅林与刺客等角色分属正义与邪恶阵营；最多进行 3 次任务，通过组队、投票与秘密破坏决定胜负。">
<title>Avalon 阿瓦隆简化版 · 毛线派对桌游</title>
<style>
  :root{--bg:#0f1424;--panel:#1b2440;--panel2:#26335a;--ink:#eef3ff;--muted:#9fb0d6;--gold:#ffd166;--blue:#5b9dff;--red:#ff6b7a;--green:#54d69b;--line:#33436e}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(900px 520px at 50% -12%,#23315f,#0d1220 64%) fixed;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  a{color:var(--gold)}
  .wrap{max-width:760px;margin:0 auto;padding:10px 12px 40px}
  .top{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0 10px}
  .top h1{font-size:19px;margin:0;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navlink{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:52px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-decoration:none;font-size:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
  .rolebar{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
  .rolecard{flex:0 0 auto;width:74px;min-height:96px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(160deg,#3d5ea8,#243a6e);border:1px solid #5e82cc;font-weight:900;text-align:center;padding:6px}
  .rolecard.evil{background:linear-gradient(160deg,#a33a4b,#6c1f2d);border-color:#d76374}
  .rolecard small{font-size:10px;font-weight:600;color:#dce6ff;opacity:.85}
  .roleinfo{min-width:0;flex:1}
  .roleinfo .title{font-size:16px;font-weight:800}
  .roleinfo .desc{font-size:13px;color:var(--muted);margin-top:3px}
  .know{font-size:13px;margin-top:6px;color:var(--gold)}
  .track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
  .quest{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;min-width:0}
  .quest .qn{font-size:11px;color:var(--muted)}
  .quest .res{font-size:18px;font-weight:900;margin-top:2px}
  .quest.good{border-color:var(--green)}
  .quest.evil{border-color:var(--red)}
  .quest.pending .res{color:var(--muted)}
  .players{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px}
  .teamgrid button{padding:4px;font-size:12px}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 4px;text-align:center;min-width:0;min-height:92px;position:relative}
  .pcard.leader{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .pcard.team{background:#233c56}
  .pcard .nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .tags{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:3px}
  .tag{font-size:10px;padding:0 4px;border-radius:99px;background:var(--panel2);color:var(--muted)}
  .tag.gold{background:var(--gold);color:#3a2500}
  .tag.blue{background:var(--blue);color:#08172e}
  .tag.red{background:var(--red);color:#2c060c}
  .tag.green{background:var(--green);color:#08251a}
  .pcard .vote{font-size:12px;margin-top:4px;font-weight:800}
  .pcard button{width:100%;min-height:44px;margin-top:4px;padding:2px;font-size:12px}
  button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:9px 14px;cursor:pointer;touch-action:manipulation}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:linear-gradient(160deg,#7fb2ff,#4a86ef);color:#08172e;font-weight:800;border:none}
  button.good{background:linear-gradient(160deg,#7ee7bd,#39bd88);color:#06251a;font-weight:800;border:none}
  button.bad{background:linear-gradient(160deg,#ff93a0,#e64a60);color:#2c060c;font-weight:800;border:none}
  button.ghost{background:transparent}
  button.sel{outline:2px solid var(--gold);background:#3a3150}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .msg{text-align:center;color:var(--gold);font-weight:700;margin:10px 0 0;font-size:14px}
  .log{margin-top:12px;font-size:12.5px;color:var(--muted);min-height:46px}
  .log div{padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
  .final{text-align:center;padding:14px 8px}
  .final h2{margin:4px 0 6px;font-size:22px}
  .final p{color:var(--muted);margin:4px 0 10px}
  .reveal{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
  .reveal span{font-size:12px;background:var(--panel2);border-radius:8px;padding:4px 8px}
  .foot{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
  .foot a{display:inline-flex;align-items:center;min-height:44px}
  @media (max-width:420px){.wrap{padding:8px 10px 32px}.top h1{font-size:17px}.players{grid-template-columns:repeat(3,minmax(0,1fr))}.pcard{min-height:86px}.rolecard{width:64px;min-height:88px}}
</style>

<meta property="og:title" content="Avalon 阿瓦隆简化版 · 毛线派对桌游">
<meta property="og:description" content="Avalon 阿瓦隆简化版 · 毛线派对桌游。浏览器打开即玩，本地单机、零外部请求、手机优先。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hhfa008.github.io/games/boardgame/avalon/">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="navlink" href="../index.html" aria-label="返回桌游目录">← 桌游</a>
    <h1>Avalon 阿瓦隆</h1>
    <a class="navlink" href="rules.html" aria-label="查看规则">规则</a>
  </header>
  <main>
    <section class="panel rolebar" id="rolebar" aria-label="你的身份"></section>
    <section class="track" id="track" aria-label="任务进度"></section>
    <section class="players" id="players" aria-label="玩家与投票"></section>
    <section class="panel" id="actionPanel" aria-live="polite" aria-label="操作区"></section>
    <section class="log" id="log" aria-label="对局记录"></section>
  </main>
  <div class="foot"><a href="../index.html">← 更多毛线桌游</a></div>
</div>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.AvalonEngine;
  var game = null;
  var selected = [];
  var selectKey = '';
  var token = 0;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function start() {
    game = E.createGame({ seed: (Date.now() % 100000) + 3 });
    selected = [];
    selectKey = '';
    token++;
    render();
    pump(500);
  }

  function roleDesc(role) {
    if (role === 'merlin') return '你知道所有邪恶玩家是谁，但绝不能暴露自己——任务成功后，刺客会尝试暗杀你。';
    if (role === 'assassin') return '你是邪恶方。任务失败两次即可获胜；若好人赢下两次任务，你可以暗杀梅林翻盘。';
    if (role === 'minion') return '你是邪恶方，与刺客互为同伴。尽量混入队伍并让任务失败，同时掩护刺客找到梅林。';
    return '你是忠臣，没有额外情报。通过投票与任务结果推断谁是邪恶方，保护梅林。';
  }

  function roleName(role) { return E.ROLE_NAMES[role] || role; }

  function render() {
    if (!game) return;
    var view = E.publicView(game, 0);
    var me = view.yourRole;

    var rb = document.getElementById('rolebar');
    rb.innerHTML = '';
    var card = el('div', 'rolecard' + (E.isEvil(me) ? ' evil' : ''));
    card.appendChild(el('div', null, roleName(me)));
    card.appendChild(el('small', null, E.isEvil(me) ? '邪恶阵营' : '正义阵营'));
    rb.appendChild(card);
    var info = el('div', 'roleinfo');
    info.appendChild(el('div', 'title', '你的身份：' + roleName(me)));
    info.appendChild(el('div', 'desc', roleDesc(me)));
    var known = [];
    view.roleKnowledge.forEach(function (k) {
      if (k.role === 'evil-known' || k.role === 'evil-ally') {
        known.push(view.players[k.player].name);
      }
    });
    if (me === 'merlin') {
      info.appendChild(el('div', 'know', known.length ? '你看见的邪恶玩家：' + known.join('、') : '场上没有邪恶玩家？'));
    } else if (E.isEvil(me)) {
      info.appendChild(el('div', 'know', known.length ? '你的邪恶同伴：' + known.join('、') : '你独自潜伏。'));
    } else {
      info.appendChild(el('div', 'know', '你没有额外情报，靠推理找出邪恶方。'));
    }
    rb.appendChild(info);

    var track = document.getElementById('track');
    track.innerHTML = '';
    for (var q = 0; q < E.QUEST_SIZES.length; q++) {
      var entry = null;
      view.history.forEach(function (h) { if (h.quest === q && h.winner) entry = h; });
      var d = el('div', 'quest ' + (entry ? entry.winner : 'pending'));
      d.appendChild(el('div', 'qn', '第 ' + (q + 1) + ' 次任务 · ' + E.QUEST_SIZES[q] + ' 人'));
      d.appendChild(el('div', 'res', entry ? (entry.winner === 'good' ? '成功' : '失败') : '待进行'));
      track.appendChild(d);
    }

    var pbox = document.getElementById('players');
    pbox.innerHTML = '';
    view.players.forEach(function (p, i) {
      var d = el('div', 'pcard' + (p.leader ? ' leader' : '') + (p.onTeam ? ' team' : ''));
      d.appendChild(el('div', 'nm', p.name + (i === 0 ? '(你)' : '')));
      var tags = el('div', 'tags');
      if (p.leader) tags.appendChild(el('span', 'tag gold', '队长'));
      if (p.onTeam) tags.appendChild(el('span', 'tag blue', '队伍'));
      if (p.voted === true) tags.appendChild(el('span', 'tag green', '赞成'));
      if (p.voted === false) tags.appendChild(el('span', 'tag red', '反对'));
      if (game.phase === 'over' && p.revealedRole !== 'unknown') {
        tags.appendChild(el('span', 'tag', roleName(p.revealedRole)));
      }
      d.appendChild(tags);
      pbox.appendChild(d);
    });

    renderActions(view, me);
    renderLog(view);
  }

  function renderActions(view, me) {
    var box = document.getElementById('actionPanel');
    box.innerHTML = '';

    if (view.phase === 'over') {
      var f = el('div', 'final');
      f.appendChild(el('h2', null, view.winner === 'good' ? '正义方获胜！' : '邪恶方获胜！'));
      f.appendChild(el('p', null, view.winReason));
      var rev = el('div', 'reveal');
      view.players.forEach(function (p, i) {
        rev.appendChild(el('span', null, p.name + '：' + roleName(p.revealedRole)));
      });
      f.appendChild(rev);
      var again = el('button', 'primary', '再来一局');
      again.setAttribute('aria-label', '重新开始一局阿瓦隆');
      again.onclick = start;
      f.appendChild(again);
      box.appendChild(f);
      return;
    }

    if (view.phase === 'propose') {
      if (view.leader !== 0) {
        box.appendChild(el('div', 'msg', '等待队长 ' + view.players[view.leader].name + ' 组队…'));
        box.appendChild(el('div', 'msg', '本次任务需要 ' + view.teamSize + ' 人'));
        return;
      }
      var key = 'propose-' + view.quest;
      if (selectKey !== key) { selectKey = key; selected = []; }
      box.appendChild(el('div', 'msg', '你是队长：选择 ' + view.teamSize + ' 人执行第 ' + (view.quest + 1) + ' 次任务'));
      var grid = el('div', 'players teamgrid');
      view.players.forEach(function (p, i) {
        var b = el('button', selected.indexOf(i) >= 0 ? 'sel' : 'ghost', p.name + (i === 0 ? '(你)' : ''));
        b.style.minHeight = '48px';
        b.setAttribute('aria-label', '选择 ' + p.name + ' 加入队伍');
        b.setAttribute('aria-pressed', selected.indexOf(i) >= 0 ? 'true' : 'false');
        b.onclick = function () {
          var at = selected.indexOf(i);
          if (at >= 0) selected.splice(at, 1);
          else if (selected.length < view.teamSize) selected.push(i);
          render();
        };
        grid.appendChild(b);
      });
      box.appendChild(grid);
      var row = el('div', 'row');
      var go = el('button', 'primary', '确认组队（' + selected.length + '/' + view.teamSize + '）');
      go.setAttribute('aria-label', '确认队伍并进入投票');
      go.disabled = selected.length !== view.teamSize;
      go.onclick = function () {
        if (go.disabled) return;
        act(function () { E.proposeTeam(game, 0, selected.slice()); });
        selected = [];
        selectKey = '';
      };
      row.appendChild(go);
      box.appendChild(row);
      return;
    }

    if (view.phase === 'vote') {
      if (view.votes[0] == null) {
        box.appendChild(el('div', 'msg', '队伍：' + view.team.map(function (i) { return view.players[i].name; }).join('、')));
        var rowv = el('div', 'row');
        var yes = el('button', 'good', '赞成');
        yes.setAttribute('aria-label', '投票赞成这支队伍');
        yes.onclick = function () { act(function () { E.castVote(game, 0, true); }); };
        var no = el('button', 'bad', '反对');
        no.setAttribute('aria-label', '投票反对这支队伍');
        no.onclick = function () { act(function () { E.castVote(game, 0, false); }); };
        rowv.appendChild(yes); rowv.appendChild(no);
        box.appendChild(rowv);
        box.appendChild(el('div', 'msg', '已连续否决 ' + view.rejects + ' 次（满 5 次邪恶直接获胜）'));
      } else {
        box.appendChild(el('div', 'msg', '你已投票，等待其他玩家…'));
      }
      return;
    }

    if (view.phase === 'mission') {
      var onTeam = view.team.indexOf(0) >= 0;
      if (onTeam && game.missionVotes[0] == null) {
        box.appendChild(el('div', 'msg', E.isEvil(me) ? '你在队伍中：选择让任务成功或破坏' : '你在队伍中：好人必须让任务成功'));
        var rowm = el('div', 'row');
        var ok = el('button', 'good', '任务成功');
        ok.setAttribute('aria-label', '投出任务成功票');
        ok.onclick = function () { act(function () { E.castMission(game, 0, false); }); };
        rowm.appendChild(ok);
        if (E.isEvil(me)) {
          var fail = el('button', 'bad', '暗中破坏');
          fail.setAttribute('aria-label', '投出任务破坏票');
          fail.onclick = function () { act(function () { E.castMission(game, 0, true); }); };
          rowm.appendChild(fail);
        }
        box.appendChild(rowm);
      } else {
        box.appendChild(el('div', 'msg', '等待队伍成员秘密表决…'));
      }
      return;
    }

    if (view.phase === 'assassin') {
      if (game.players[0].role === 'assassin') {
        box.appendChild(el('div', 'msg', '好人赢下两次任务。你是刺客：指认梅林，成功则邪恶翻盘'));
        var grid2 = el('div', 'players teamgrid');
        view.players.forEach(function (p, i) {
          if (i === 0) return;
          var b = el('button', 'bad', p.name);
          b.setAttribute('aria-label', '指认 ' + p.name + ' 是梅林');
          b.onclick = function () { act(function () { E.assassinate(game, 0, i); }); };
          grid2.appendChild(b);
        });
        box.appendChild(grid2);
      } else {
        box.appendChild(el('div', 'msg', '好人赢下两次任务。刺客正在决定暗杀目标…'));
      }
      return;
    }
  }

  function renderLog(view) {
    var box = document.getElementById('log');
    box.innerHTML = '';
    view.log.slice(-7).forEach(function (line) { box.appendChild(el('div', null, line)); });
  }

  function act(fn) {
    if (!game || game.phase === 'over') return;
    try { fn(); } catch (e) { return; }
    render();
    pump(650);
  }

  function pump(delay) {
    if (!game || game.phase === 'over') { render(); return; }
    var my = ++token;
    setTimeout(function () {
      if (my !== token || !game || game.phase === 'over') return;
      var res;
      try { res = E.step(game); } catch (e) { return; }
      render();
      if (res && res.needsHuman) return;
      if (game.phase === 'over') return;
      pump(650);
    }, delay || 650);
  }

  start();
})();
</script>
</body>
</html>
