<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>BANQI art composition</title>
<style>
  :root{
    --font-serif:"Songti SC","Iowan Old Style","Palatino Linotype","Noto Serif SC",Georgia,serif;
    --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
    --art-board:url("../../assets/art/premium/banqi/board-wood.webp");
    --art-face:url("../../assets/art/premium/banqi/piece-face.webp");
    --art-back:url("../../assets/art/premium/banqi/piece-back.webp");
    --art-cloth:url("../../assets/art/premium/banqi/table-cloth.webp");
    --ink:#f6ead6;--muted:#c9b795;--gold:#e8c07a;--gold2:#f7dfae;
    --red:#a93225;--black:#1c1710;--ivory:#f0e1c4;--ivory2:#d8c19a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0d0b08}
  body{width:1200px;height:1200px;overflow:hidden;color:var(--ink);font-family:var(--font-sans)}
  .stage{position:absolute;inset:0;overflow:hidden;background:
    radial-gradient(900px 700px at 18% 0%,rgba(120,84,44,.4),transparent 60%),
    radial-gradient(900px 760px at 100% 100%,rgba(38,56,62,.35),transparent 62%),
    linear-gradient(155deg,#221b12,#0c0a07 72%)}
  .stage::before{content:"";position:absolute;inset:0;background:var(--art-cloth) center/cover no-repeat;opacity:.20;filter:saturate(.75) contrast(1.1);mix-blend-mode:soft-light}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 34%,rgba(0,0,0,.5) 100%);pointer-events:none}
  .frame{position:absolute;inset:26px;border:1px solid rgba(232,192,122,.42);border-radius:28px;box-shadow:inset 0 0 0 7px rgba(232,192,122,.05),0 40px 100px rgba(0,0,0,.55);pointer-events:none;z-index:9}
  .frame::before,.frame::after{content:"";position:absolute;width:62px;height:62px;border:2px solid rgba(232,192,122,.5)}
  .frame::before{left:14px;top:14px;border-right:0;border-bottom:0;border-radius:17px 0 0 0}
  .frame::after{right:14px;bottom:14px;border-left:0;border-top:0;border-radius:0 0 17px 0}
  .content{position:absolute;inset:64px;z-index:3;display:flex;flex-direction:column}

  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:22px}
  .brand{display:flex;align-items:center;gap:18px}
  .seal{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;flex:none;
    background:radial-gradient(circle at 34% 27%,rgba(255,245,220,.55),transparent 40%),linear-gradient(150deg,#c89a5b,#8a5a2c 70%,#5c3917);
    border:1px solid rgba(247,223,174,.62);font-family:var(--font-serif);font-weight:700;font-size:30px;color:#2d1a09;
    box-shadow:0 20px 42px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.45);transform:rotate(-3deg)}
  h1{margin:0;font-family:var(--font-serif);font-weight:700;line-height:.9;letter-spacing:.14em;font-size:104px;text-shadow:0 14px 44px rgba(0,0,0,.5)}
  h1 span{color:var(--gold2);font-size:.5em;letter-spacing:.2em;margin-left:.18em}
  .sub{margin:14px 0 0;font-size:17px;letter-spacing:.3em;color:var(--muted);font-weight:600}
  .chips{display:flex;flex-direction:column;gap:9px;align-items:flex-end}
  .chip{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:999px;border:1px solid rgba(232,192,122,.36);background:rgba(16,12,8,.6);color:var(--gold2);font-size:14px;letter-spacing:.06em;font-weight:700;white-space:nowrap}
  .main{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
  .board-wrap{position:relative;width:980px;padding:20px;border-radius:30px;border:1px solid rgba(232,192,122,.4);
    background:linear-gradient(155deg,rgba(80,54,30,.68),rgba(24,18,12,.86)),var(--art-board) center/cover no-repeat;
    box-shadow:0 46px 90px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.5)}
  .board-wrap::before{content:"";position:absolute;inset:9px;border:1px solid rgba(232,192,122,.2);border-radius:22px;pointer-events:none}
  .board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(4,1fr);gap:7px;aspect-ratio:2/1;width:100%;position:relative;z-index:1}
  .cell{position:relative;display:flex;align-items:center;justify-content:center;border-radius:9px;border:1px solid rgba(66,42,18,.42);background:linear-gradient(150deg,rgba(206,158,98,.14),rgba(50,32,16,.16));box-shadow:inset 0 1px 0 rgba(255,235,200,.12),inset 0 -1px 0 rgba(40,25,10,.24)}
  .cell.hl{box-shadow:inset 0 0 0 3px rgba(111,208,164,.9)}
  .piece{position:relative;width:86%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
    font-family:var(--font-serif);font-weight:700;font-size:37px;line-height:1;
    background:radial-gradient(circle at 34% 27%,rgba(255,255,255,.62),transparent 37%),radial-gradient(circle at 50% 62%,rgba(255,255,255,.16),transparent 58%),linear-gradient(148deg,var(--ivory),var(--ivory2) 72%),var(--art-face) center/cover no-repeat;
    border:1px solid rgba(120,82,40,.55);
    box-shadow:0 6px 0 rgba(78,50,20,.58),0 12px 20px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.78),inset 0 -3px 4px rgba(120,80,40,.2)}
  .piece::before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(120,82,40,.25)}
  .piece.red{color:var(--red);text-shadow:0 1px 0 rgba(255,255,255,.8),0 2px 1px rgba(140,40,28,.16)}
  .piece.black{color:var(--black);text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .piece.hidden{color:transparent;border-color:rgba(72,47,22,.7);
    background:radial-gradient(circle at 34% 27%,rgba(255,242,214,.34),transparent 38%),radial-gradient(circle at 50% 50%,transparent 0 23%,rgba(60,38,16,.32) 24% 25.5%,transparent 26% 45%,rgba(60,38,16,.24) 46% 47.5%,transparent 48%),linear-gradient(148deg,#a9763f,#7a4f25 66%,#5d3a19),var(--art-back) center/cover no-repeat;
    box-shadow:0 6px 0 rgba(56,34,13,.64),0 12px 20px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,230,190,.42),inset 0 -3px 5px rgba(40,22,8,.4)}

  .footer{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
  .note{font-size:15px;letter-spacing:.16em;color:var(--muted);font-weight:600}
  .note b{color:var(--gold2)}
  .ruler{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;letter-spacing:.08em}
  .ruler i{display:block;width:180px;height:1px;background:linear-gradient(90deg,rgba(232,192,122,.7),transparent);font-style:normal}

  /* OG: landscape */
  body.og{height:630px}
  body.og .content{inset:44px 56px}
  body.og h1{font-size:76px}
  body.og .seal{width:58px;height:58px;font-size:23px}
  body.og .sub{margin-top:10px;font-size:14px}
  body.og .chip{height:32px;font-size:12px;padding:0 13px}
  body.og .main{justify-content:flex-start;align-items:center;padding-left:0}
  body.og .board-wrap{width:620px;margin-left:auto;padding:14px;border-radius:24px}
  body.og .board{gap:5px}
  body.og .piece{font-size:24px;box-shadow:0 4px 0 rgba(78,50,20,.58),0 8px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.7)}
  body.og .layout{display:grid;grid-template-columns:1fr 640px;gap:24px;flex:1;align-items:center}
  body.og .footer{position:absolute;left:0;right:0;bottom:0}

  /* detail 1200x800 */
  body.detail{height:800px}
  body.detail .content{inset:46px 56px}
  body.detail h1{font-size:58px}
  body.detail .seal{width:52px;height:52px;font-size:20px}
  body.detail .sub{margin-top:8px;font-size:13px;letter-spacing:.22em}
  body.detail .chip{height:30px;font-size:12px;padding:0 12px}
  body.detail .main{padding:10px 0}
  body.detail .board-wrap{width:680px;padding:14px;border-radius:24px}
  body.detail .board{gap:5px}
  body.detail .piece{font-size:25px;box-shadow:0 4px 0 rgba(78,50,20,.58),0 8px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.7)}
  body.detail .side{width:360px;display:flex;flex-direction:column;gap:14px}
  body.detail .panel{border:1px solid rgba(232,192,122,.32);border-radius:18px;background:rgba(24,19,13,.72);padding:16px 18px}
  body.detail .panel h2{margin:0 0 9px;font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  body.detail .rowline{display:flex;align-items:center;justify-content:space-between;font-size:15px;padding:5px 0;border-bottom:1px dashed rgba(232,192,122,.16)}
  body.detail .rowline b{color:var(--gold2)}
  body.detail .flex{display:flex;gap:22px;align-items:center;width:100%}
  body.detail .roster{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;width:100%}
  body.detail .roster .item{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
  body.detail .roster .piece{width:100%;font-size:28px}
  body.detail .caption{font-size:14px;line-height:1.7;color:var(--muted)}
  body.detail .caption b{color:var(--gold2)}
  body.og .layout,body.detail .layout{display:contents}
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/banqi-premium/art-render.html">
<meta name="description" content="内部美术合成页：用代码绘制棋盘、棋子与牌面，生成封面 / OG / 详情图；不参与游戏入口。">
<meta name="robots" content="noindex">
</head>
<body>
<div class="stage"></div>
<div class="vignette"></div>
<div class="frame"></div>
<div class="content" id="content"></div>
<script>
(function () {
  'use strict';
  var SHOT = new URLSearchParams(location.search).get('shot') || 'cover';
  var GLYPH = {
    '1': { K: '帥', A: '仕', B: '相', R: '車', N: '馬', C: '炮', P: '兵' },
    '-1': { K: '將', A: '士', B: '象', R: '車', N: '馬', C: '砲', P: '卒' }
  };
  function seedRandom(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function deal(seed) {
    var rnd = seedRandom(seed);
    var list = [];
    [1, -1].forEach(function (side) {
      ({ K: 1, A: 2, B: 2, R: 2, N: 2, C: 2, P: 5 });
      [['K', 1], ['A', 2], ['B', 2], ['R', 2], ['N', 2], ['C', 2], ['P', 5]].forEach(function (entry) {
        for (var k = 0; k < entry[1]; k++) list.push({ s: side, t: entry[0], h: true });
      });
    });
    for (var i = list.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    }
    return list;
  }
  function pieceHtml(p) {
    if (!p) return '';
    if (p.h) return '<span class="piece hidden"></span>';
    var side = p.s === 1 ? 'red' : 'black';
    return '<span class="piece ' + side + '">' + GLYPH[String(p.s)][p.t] + '</span>';
  }
  function boardHtml(list, highlight) {
    var out = '';
    for (var i = 0; i < 32; i++) {
      out += '<div class="cell' + (highlight === i ? ' hl' : '') + '">' + pieceHtml(list[i]) + '</div>';
    }
    return out;
  }
  var content = document.getElementById('content');

  if (SHOT === 'cover') {
    content.innerHTML =
      '<div class="top"><div class="brand"><div class="seal">暗</div><div><h1>暗棋<span>翻棋</span></h1>' +
      '<p class="sub">4 × 8 · 32 枚全部扣放 · 等级吃子</p></div></div>' +
      '<div class="chips"><span class="chip">2 人 · AI 或联机</span><span class="chip">炮 · 隔一子吃</span></div></div>' +
      '<div class="main"><div class="board-wrap"><div class="board">' + boardHtml(deal(20261110), -1) + '</div></div></div>' +
      '<div class="footer"><div class="note"><b>翻开</b>或<b>走子</b>，一步只能选一样</div>' +
      '<div class="ruler"><i></i>真实 4×8 棋盘 · 32 枚扣放开局</div></div>';
    document.body.className = 'cover';
  } else if (SHOT === 'og') {
    document.body.className = 'og';
    content.innerHTML =
      '<div class="layout"><div><div class="top"><div class="brand"><div class="seal">暗</div><div><h1>暗棋</h1>' +
      '<p class="sub">翻棋 · 4×8 · 32 枚扣放</p></div></div></div>' +
      '<p class="caption" style="margin-top:22px;max-width:420px">翻开或走子，等级吃子、兵吃帥、炮隔一子吃。三档 AI 与 2 人联机。</p>' +
      '<div class="chips" style="flex-direction:row;flex-wrap:wrap;align-items:center;margin-top:18px">' +
      '<span class="chip">2 人 · AI / 联机</span><span class="chip">服务器权威判定</span></div></div>' +
      '<div class="board-wrap"><div class="board">' + boardHtml(deal(889), -1) + '</div></div></div>';
  } else if (SHOT === 'detail1') {
    document.body.className = 'detail';
    var list = deal(4242);
    // Reveal a believable mid-game cluster: a red rook and horse, black pawns.
    list[27] = { s: 1, t: 'R', h: false };
    list[28] = { s: 1, t: 'N', h: false };
    list[19] = { s: -1, t: 'P', h: false };
    list[20] = { s: -1, t: 'C', h: false };
    list[11] = { s: 1, t: 'P', h: false };
    list[12] = { s: -1, t: 'K', h: false };
    content.innerHTML =
      '<div class="top"><div class="brand"><div class="seal">弈</div><div><h1>中盘</h1>' +
      '<p class="sub">翻开的子才可被吃 · 暗子同时挡路与当炮架</p></div></div>' +
      '<div class="chips"><span class="chip">红方明子 3</span><span class="chip">暗子 26</span></div></div>' +
      '<div class="main"><div class="flex"><div class="board-wrap"><div class="board">' + boardHtml(list, 27) + '</div></div>' +
      '<div class="side"><div class="panel"><h2>局面</h2>' +
      '<div class="rowline"><span>红方明子</span><b>3</b></div>' +
      '<div class="rowline"><span>黑方明子</span><b>3</b></div>' +
      '<div class="rowline"><span>暗子</span><b>26</b></div>' +
      '<div class="rowline"><span>无吃子手数</span><b>0 / 120</b></div></div>' +
      '<div class="panel"><h2>等级表</h2>' +
      '<div class="rowline"><span>帥 / 將</span><b>7</b></div>' +
      '<div class="rowline"><span>仕 / 士 · 相 / 象</span><b>6 · 5</b></div>' +
      '<div class="rowline"><span>車 · 馬 · 炮</span><b>4 · 3 · 2</b></div>' +
      '<div class="rowline"><span>兵 / 卒（可吃帥）</span><b>1</b></div></div>' +
      '<div class="panel"><h2>提示</h2><p class="caption">炮贴身的子不能吃；<b>兵</b>是唯一能吃掉帥與將的子，残局必须留兵。</p></div></div></div></div>';
  } else {
    document.body.className = 'detail';
    content.innerHTML =
      '<div class="top"><div class="brand"><div class="seal">材</div><div><h1>棋子与木盘</h1>' +
      '<p class="sub">24mm 棋子 · 7mm 厚 · 300×160mm 木盘</p></div></div>' +
      '<div class="chips"><span class="chip">Songti SC 700</span><span class="chip">字由代码渲染</span></div></div>' +
      '<div class="main"><div style="width:100%">' +
      '<div class="roster">' +
      ['帥|7|red', '仕|6|red', '相|5|red', '車|4|red', '馬|3|red', '炮|2|red', '兵|1|red', '將|7|black'].map(function (item) {
        var parts = item.split('|');
        return '<div class="item"><span class="piece ' + parts[2] + '">' + parts[0] + '</span><span>等级 ' + parts[1] + '</span></div>';
      }).join('') +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1.1fr .9fr;gap:22px;margin-top:28px">' +
      '<div class="panel"><h2>真实规格</h2>' +
      '<div class="rowline"><span>棋盘</span><b>4 行 × 8 列 = 32 格</b></div>' +
      '<div class="rowline"><span>棋子直径 / 厚度</span><b>24mm / 7mm</b></div>' +
      '<div class="rowline"><span>红黑各 16 枚</span><b>帥1 仕2 相2 車2 馬2 炮2 兵5</b></div>' +
      '<div class="rowline"><span>无吃子判和</span><b>120 手</b></div></div>' +
      '<div class="panel"><h2>材质</h2><p class="caption">黄杨木棋子、胡桃木折叠盘、靛蓝亚麻桌布。字形用 <b>Songti SC Bold(700)</b> 代码绘制，AI 只生成空白材质，避免模型画错汉字。</p></div>' +
      '</div></div></div></div>';
  }
})();
</script>
</body>
</html>
