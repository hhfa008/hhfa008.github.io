<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>礼物交换 · 迷你派对</title>
<meta name="description" content="换一张礼物牌，让三张牌更接近。 原创极简派对游戏，单机对战 AI。">
<meta name="theme-color" content="#0b1020">
<style>
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; min-height: 100vh; color: #e8edf7;
    background: radial-gradient(circle at 50% 0, #1b2544 0, #0b1020 62%, #060912 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .app { width: 100%; max-width: 460px; margin: 0 auto; padding: 16px 14px 26px; }
  header { text-align: center; margin-bottom: 12px; }
  .kicker { margin: 0 0 4px; font-size: 12px; letter-spacing: 2px; color: #06b6d4; }
  h1 { margin: 0 0 4px; font-size: 25px; letter-spacing: 1px; }
  .tag { margin: 0; font-size: 13px; color: #9fb0cc; line-height: 1.5; }
  .hud { display: flex; gap: 8px; margin-bottom: 10px; }
  .score, .round {
    flex: 1 1 0; min-width: 0; padding: 8px 6px; text-align: center;
    background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 12px;
  }
  .score span, .round span { display: block; font-size: 12px; color: #9fb0cc; margin-bottom: 2px; }
  .score strong, .round strong { font-size: 20px; color: #fff; }
  .round em { font-style: normal; font-size: 12px; color: #8da0bd; }
  .score.me strong { color: #7dd3fc; }
  .score.ai strong { color: #06b6d4; }
  .panel {
    background: rgba(255, 255, 255, .045); border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 18px; padding: 14px; margin-bottom: 10px;
  }
  .prompt { font-size: 18px; font-weight: 700; line-height: 1.45; min-height: 52px; }
  .detail {
    margin-top: 8px; font-size: 14px; line-height: 1.6; color: #c6d3e8;
    transition: opacity .35s ease; word-break: break-word;
  }
  .detail.hidden { opacity: 0; }
  .hint { margin-top: 6px; font-size: 12px; color: #8da0bd; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .options.single { grid-template-columns: 1fr; }
  .options button {
    min-height: 56px; min-width: 44px; padding: 10px 8px;
    border: 1px solid rgba(255, 255, 255, .16); border-radius: 12px;
    background: #1a2440; color: #f4f7ff; font-family: inherit;
    font-size: 15px; font-weight: 700; line-height: 1.35; cursor: pointer;
    transition: transform .08s ease, background .15s ease;
  }
  .options button:active { transform: scale(.98); background: #243257; }
  .options button:focus-visible { outline: 2px solid #06b6d4; outline-offset: 2px; }
  .options button.next { grid-column: 1 / -1; background: #06b6d4; color: #10131c; border-color: transparent; }
  .result {
    min-height: 24px; margin-top: 12px; font-size: 14px; line-height: 1.55;
    color: #fde68a; word-break: break-word;
  }
  .log {
    max-height: 128px; overflow-y: auto; margin-bottom: 12px; padding: 8px 10px;
    background: rgba(0, 0, 0, .22); border-radius: 10px; font-size: 12px; color: #93a4c0;
  }
  .log p { margin: 0 0 4px; }
  footer { display: flex; gap: 8px; align-items: stretch; }
  footer button, footer a {
    min-height: 44px; min-width: 44px; display: inline-flex; align-items: center;
    justify-content: center; padding: 10px 14px; border-radius: 12px;
    font-family: inherit; font-size: 15px; font-weight: 700; text-decoration: none;
  }
  #newGame { flex: 1 1 auto; border: 0; background: #2b3857; color: #e8edf7; cursor: pointer; }
  footer a { flex: 0 0 auto; border: 1px solid rgba(255, 255, 255, .18); color: #c6d3e8; }
  @media (max-width: 355px) {
    .options { grid-template-columns: 1fr; }
    h1 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
/* mini-quality: safe-area */
.app { --mini-safe-bottom: 26px; padding-bottom: calc(var(--mini-safe-bottom) + env(safe-area-inset-bottom, 0px)); }
</style>
  <link rel="canonical" href="https://hhfa008.github.io/games/boardgame/mini-party-b-15/index.html">
</head>
<body>
<div class="app">
  <header>
    <p class="kicker">传牌 · 单机对战 AI</p>
    <h1>礼物交换</h1>
    <p class="tag">换一张礼物牌，让三张牌更接近。</p>
  </header>
  <section class="hud" aria-label="比分与回合">
    <div class="score me"><span>你</span><strong id="you">0</strong></div>
    <div class="round"><span>回合</span><strong id="round">1</strong><em>/6</em></div>
    <div class="score ai"><span>AI</span><strong id="ai">0</strong></div>
  </section>
  <section class="panel">
    <div class="prompt" id="prompt"></div>
    <div class="detail" id="detail"></div>
    <div class="hint" id="hint"></div>
    <div class="options" id="options" aria-label="可选操作"></div>
    <div class="result" id="result" role="status" aria-live="polite"></div>
  </section>
  <div class="log" id="log" aria-label="对局记录"></div>
  <footer>
    <button id="newGame" type="button">重新开始</button>
    <a href="rules.html">玩法规则</a>
  </footer>
</div>
<script src="./engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.MiniPartyEngine;
  var game = null;
  var roundStamp = 0;
  var hideTimer = null;
  var el = {
    you: document.getElementById('you'),
    ai: document.getElementById('ai'),
    round: document.getElementById('round'),
    prompt: document.getElementById('prompt'),
    detail: document.getElementById('detail'),
    hint: document.getElementById('hint'),
    options: document.getElementById('options'),
    result: document.getElementById('result'),
    log: document.getElementById('log')
  };
  function esc(text) {
    return String(text).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function render() {
    if (!game) return;
    el.you.textContent = game.scores[0];
    el.ai.textContent = game.scores[1];
    el.round.textContent = Math.min(game.round, game.maxRounds);
    el.prompt.textContent = game.prompt;
    el.detail.textContent = game.detail || '';
    el.hint.textContent = game.hint || '';
    el.detail.classList.remove('hidden');
    clearTimeout(hideTimer);
    if (game.phase === 'choose' && (game.family === 'memory' || game.extra.hide)) {
      var token = roundStamp;
      hideTimer = setTimeout(function () {
        if (game && token === roundStamp && game.phase === 'choose') el.detail.classList.add('hidden');
      }, 1800);
    }
    el.options.innerHTML = '';
    el.options.classList.toggle('single', game.options.length <= 2);
    if (E.isOver(game)) {
      el.result.textContent = game.lastResult || '';
      var again = document.createElement('button');
      again.type = 'button';
      again.className = 'next';
      again.textContent = '再来一局';
      again.addEventListener('click', newGame);
      el.options.appendChild(again);
    } else if (game.phase === 'result') {
      el.result.textContent = game.lastResult || '';
      var next = document.createElement('button');
      next.type = 'button';
      next.className = 'next';
      next.textContent = game.round >= game.maxRounds ? '查看最终结果' : '下一回合';
      next.addEventListener('click', function () {
        E.applyAction(game, { type: 'next' });
        roundStamp = performance.now();
        render();
      });
      el.options.appendChild(next);
    } else {
      el.result.textContent = '第 ' + game.round + ' / ' + game.maxRounds + ' 回合';
      game.options.forEach(function (opt) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = opt.label;
        btn.setAttribute('data-id', opt.id);
        btn.addEventListener('click', function () {
          var ms = Math.round(performance.now() - roundStamp);
          var res = E.applyAction(game, { type: 'choose', choice: opt.id, ms: ms });
          if (!res.ok) return;
          render();
        });
        el.options.appendChild(btn);
      });
    }
    el.log.innerHTML = game.log.slice(-8).map(function (line) {
      return '<p>' + esc(line) + '</p>';
    }).join('');
    el.log.scrollTop = el.log.scrollHeight;
  }
  function newGame() {
    game = E.createGame({ seed: (Date.now() % 1000000) + 17 });
    roundStamp = performance.now();
    render();
  }
  document.getElementById('newGame').addEventListener('click', newGame);
  newGame();
}());
</script>
</body>
</html>
