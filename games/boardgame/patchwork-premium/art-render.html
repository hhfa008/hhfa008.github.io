<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="拼布艺术 美术合成页：本地生成的素材在浏览器中的渲染预览。">
<title>拼布艺术 · 局面合成</title>
<style>
#stage,.stage{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#2b352c;overflow:hidden}
body{font-family:-apple-system,"PingFang SC",sans-serif;color:#2b251d}
#stage{position:relative;overflow:hidden;background:
  radial-gradient(900px 600px at 18% 8%,rgba(228,199,141,.20),transparent 60%),
  radial-gradient(700px 500px at 90% 100%,rgba(166,75,54,.18),transparent 60%),
  linear-gradient(155deg,#e8dcc4,#cdbfa2 55%,#b9a98b)}
#stage::before{content:"";position:absolute;inset:0;background:url('../../assets/art/premium/patchwork/felt.webp') center/700px;opacity:.22;mix-blend-mode:multiply}
.frame{position:absolute;inset:26px;border:1px solid rgba(64,48,28,.35);border-radius:22px;box-shadow:inset 0 0 0 7px rgba(255,250,238,.20)}
.titleblock{position:absolute;z-index:5;color:#f7efdd}
.titleblock .kicker{font-size:17px;letter-spacing:.32em;color:#e4c78d;font-weight:700}
.titleblock h1{font-family:"Songti SC","STSong",serif;font-weight:700;margin:10px 0 6px;font-size:78px;line-height:1.02;color:#fbf3e2;text-shadow:0 6px 26px rgba(25,18,10,.35)}
.titleblock p{margin:0;font-size:19px;line-height:1.6;color:#e9dcc2;max-width:420px}
.seal{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid rgba(228,199,141,.55);border-radius:999px;font-size:14px;color:#f0dfb7;letter-spacing:.08em;background:rgba(30,42,31,.35)}
.boardcard{position:absolute;z-index:4;padding:18px;border-radius:20px;background:linear-gradient(160deg,rgba(60,77,61,.98),rgba(36,49,38,.98));box-shadow:0 34px 80px rgba(24,18,10,.45),inset 0 0 0 1px rgba(255,255,255,.10)}
.board{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:3px;width:100%;height:100%}
.quilt-cell{position:relative;border-radius:4px;background:rgba(244,236,220,.10);border:1px solid rgba(255,255,255,.07);overflow:hidden}
.quilt-cell.filled{box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
.quilt-cell .tint{position:absolute;inset:0;opacity:.9}
.quilt-cell .weave{position:absolute;inset:0;background:url('../../assets/art/premium/patchwork/felt.webp') center/130px;opacity:.38;mix-blend-mode:multiply}
.button-dot{position:absolute;inset:27%;border-radius:50%;background:url('../../assets/art/premium/patchwork/button.webp') center/contain no-repeat;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));z-index:3}
.sidecard{position:absolute;z-index:5;padding:16px;border-radius:16px;background:linear-gradient(180deg,rgba(255,250,238,.97),rgba(241,230,207,.97));box-shadow:0 24px 60px rgba(30,22,12,.32);border:1px solid rgba(64,48,28,.22)}
.sidecard h2{font-family:"Songti SC","STSong",serif;font-size:25px;margin:0 0 12px;color:#3b3225}
.market{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.patchcard{position:relative;padding:9px;border-radius:11px;background:#fdf7e9;border:1px solid rgba(64,48,28,.20);box-shadow:0 8px 18px rgba(50,35,18,.12);text-align:center}
.patchcard .mini{height:86px;display:grid;gap:2px;place-content:center;margin-bottom:6px}
.patchcard .mini i{background:#a64b36;border-radius:2px;min-width:9px;min-height:9px}
.patchcard .mini i.b{background:#a64b36 url('../../assets/art/premium/patchwork/button.webp') center/72% no-repeat}
.patchcard .nm{font-size:13px;font-weight:700;color:#40362a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.patchcard .mt{font-size:12px;color:#7b6c57;margin-top:2px}
.tray{position:absolute;z-index:6;width:230px;height:230px;background:url('../../assets/art/premium/patchwork/button-tray.webp') center/contain no-repeat;filter:drop-shadow(0 18px 24px rgba(30,22,12,.32))}
.tray .loose{position:absolute;width:28px;height:28px;border-radius:50%;background:url('../../assets/art/premium/patchwork/button.webp') center/contain no-repeat;filter:drop-shadow(0 3px 3px rgba(0,0,0,.28))}
.strip{position:absolute;z-index:5;background:url('../../assets/art/premium/patchwork/time-strip.webp') center/100% 100% no-repeat;filter:drop-shadow(0 16px 22px rgba(30,22,12,.28))}
.strip .track-row{position:absolute;inset:18% 4%;display:grid;grid-template-columns:repeat(9,1fr);gap:6px;align-items:center}
.strip .sp{position:relative;height:26px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#59452c}
.strip .sp .tok{position:absolute;width:13px;height:13px;border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.8)}
.leather{position:absolute;z-index:6;width:150px;height:150px;background:url('../../assets/art/premium/patchwork/leather-patch.webp') center/contain no-repeat;filter:drop-shadow(0 12px 18px rgba(30,22,12,.3))}
.ruler{position:absolute;z-index:5;font-family:"Songti SC","STSong",serif;color:#f1e3c4;writing-mode:vertical-rl;letter-spacing:.22em;font-size:15px;opacity:.85}

/* shot layouts */
#stage[data-shot="cover"]{width:1200px;height:1200px}
#stage[data-shot="cover"] .titleblock{left:78px;top:84px;width:520px}
#stage[data-shot="cover"] .boardcard{right:74px;bottom:96px;width:640px;height:640px;transform:rotate(-2.5deg)}
#stage[data-shot="cover"] .sidecard{left:78px;bottom:112px;width:430px}
#stage[data-shot="cover"] .tray{right:594px;top:94px}
#stage[data-shot="cover"] .strip{left:86px;bottom:44px;width:470px;height:56px}
#stage[data-shot="cover"] .leather{right:86px;top:82px;width:120px;height:120px;transform:rotate(8deg)}
#stage[data-shot="cover"] .ruler{right:38px;top:250px}

#stage[data-shot="og"]{width:1200px;height:630px}
#stage[data-shot="og"] .titleblock{left:64px;top:64px;width:430px}
#stage[data-shot="og"] .titleblock h1{font-size:62px}
#stage[data-shot="og"] .boardcard{right:54px;top:58px;width:520px;height:520px;transform:rotate(-2deg)}
#stage[data-shot="og"] .sidecard{left:64px;bottom:58px;width:360px}
#stage[data-shot="og"] .tray{display:none}
#stage[data-shot="og"] .strip{left:64px;bottom:22px;width:390px;height:48px}
#stage[data-shot="og"] .leather{right:580px;top:430px;width:88px;height:88px;transform:rotate(-10deg)}
#stage[data-shot="og"] .ruler{display:none}

#stage[data-shot="detail1"],#stage[data-shot="detail2"]{width:1200px;height:800px}
#stage[data-shot="detail1"] .titleblock,#stage[data-shot="detail2"] .titleblock{left:64px;top:56px;width:390px}
#stage[data-shot="detail1"] .titleblock h1,#stage[data-shot="detail2"] .titleblock h1{font-size:58px}
#stage[data-shot="detail1"] .boardcard{right:52px;top:78px;width:600px;height:600px;transform:rotate(1.6deg)}
#stage[data-shot="detail2"] .boardcard{right:70px;top:34px;width:610px;height:610px;transform:rotate(-3.2deg)}
#stage[data-shot="detail1"] .sidecard{left:64px;bottom:58px;width:330px}
#stage[data-shot="detail2"] .sidecard{left:64px;bottom:48px;width:330px}
#stage[data-shot="detail1"] .tray{left:452px;bottom:78px;width:190px;height:190px}
#stage[data-shot="detail2"] .tray{left:438px;top:96px;width:190px;height:190px}
#stage[data-shot="detail1"] .strip{left:64px;bottom:20px;width:340px;height:44px}
#stage[data-shot="detail2"] .strip{left:64px;bottom:18px;width:340px;height:44px}
#stage[data-shot="detail1"] .leather{left:452px;top:62px;width:126px;height:126px;transform:rotate(7deg)}
#stage[data-shot="detail2"] .leather{left:470px;bottom:52px;width:120px;height:120px;transform:rotate(-8deg)}
#stage[data-shot="detail1"] .ruler,#stage[data-shot="detail2"] .ruler{display:none}
</style>
<link rel="icon" href="../../assets/icons/xiangqi.svg">
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/patchwork-premium/art-render.html">
<style>
/* site-quality: fixed-size art composition must not create page overflow */
html{overflow-x:hidden}
body{width:100%!important;max-width:100vw!important;overflow-x:hidden}
.stage,#stage{max-width:100vw;overflow:hidden}
</style>
</head>
<body>
<div aria-hidden="true" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0">
  <img src="../../assets/art/premium/patchwork/quilt-tile.webp" alt="">
  <img src="../../assets/art/premium/patchwork/button.webp" alt="">
  <img src="../../assets/art/premium/patchwork/leather-patch.webp" alt="">
  <img src="../../assets/art/premium/patchwork/felt.webp" alt="">
  <img src="../../assets/art/premium/patchwork/button-tray.webp" alt="">
  <img src="../../assets/art/premium/patchwork/time-strip.webp" alt="">
</div>
<div id="stage" data-shot="cover">
  <div class="frame"></div>
  <div class="titleblock">
    <div class="kicker">PATCHWORK · 2 PLAYERS</div>
    <h1>拼布<br>艺术</h1>
    <p>时间轴上抢布，扣子与空格之间取舍。<br>把 81 格拼成一块完整的布。</p>
    <div class="seal">9×9 拼布板 · 33 块 · 7×7 奖励</div>
  </div>
  <div class="boardcard"><div class="board" id="board"></div></div>
  <div class="sidecard">
    <h2>前方三块</h2>
    <div class="market" id="market"></div>
  </div>
  <div class="tray" id="tray"><span class="loose" style="left:64px;top:72px"></span><span class="loose" style="left:128px;top:96px"></span><span class="loose" style="left:98px;top:142px"></span><span class="loose" style="left:152px;top:58px"></span></div>
  <div class="strip"><div class="track-row" id="track"></div></div>
  <div class="leather"></div>
  <div class="ruler">拼布 · 时间 · 扣子</div>
</div>
<script>
(function () {
  'use strict';
  var COLORS = ['#a64b36','#5a7259','#3d5b70','#be954b','#7a5b7e','#8a6a43'];
  var PCB = [
    [0,0,1,1,1,1,2,2,2],
    [0,0,1,1,3,3,2,2,2],
    [0,4,4,1,3,3,3,2,2],
    [0,4,4,5,5,5,3,3,2],
    [0,4,4,5,5,5,6,6,6],
    [0,0,4,4,5,5,6,6,6],
    [7,0,0,4,4,8,8,6,6],
    [7,7,0,0,8,8,8,6,6],
    [7,7,7,0,8,8,8,6,6]
  ];
  var buttons = [[0,0],[0,3],[1,2],[1,6],[2,1],[2,5],[2,8],[3,2],[3,7],[4,4],[5,0],[5,6],[6,3],[6,8],[7,5],[8,2]];
  var shot = new URLSearchParams(location.search).get('shot') || 'cover';
  var stage = document.getElementById('stage');
  stage.setAttribute('data-shot', shot);

  var board = document.getElementById('board');
  var html = '';
  for (var r = 0; r < 9; r++) for (var c = 0; c < 9; c++) {
    var filled = PCB[r][c] >= 0;
    html += '<div class="quilt-cell' + (filled ? ' filled' : '') + '" data-r="' + r + '" data-c="' + c + '">' +
      (filled ? '<span class="tint" style="background:' + COLORS[PCB[r][c]] + '"></span><span class="weave"></span>' : '') +
      (buttons.some(function (b) { return b[0] === r && b[1] === c; }) ? '<span class="button-dot"></span>' : '') + '</div>';
  }
  board.innerHTML = html;

  var patches = [
    { name: '长 T 形', cells: [[0,0],[0,1],[0,2],[1,1],[2,1],[3,1]], cost: 7, time: 2, income: 2 },
    { name: '宽 U 形槽', cells: [[0,0],[0,3],[1,0],[1,1],[1,2],[1,3]], cost: 1, time: 5, income: 1 },
    { name: '长 S 形', cells: [[0,1],[1,1],[2,0],[2,1],[3,0]], cost: 2, time: 3, income: 1 }
  ];
  document.getElementById('market').innerHTML = patches.map(function (p) {
    var maxR = 0, maxC = 0;
    p.cells.forEach(function (x) { maxR = Math.max(maxR, x[0]); maxC = Math.max(maxC, x[1]); });
    var mini = '';
    for (var r = 0; r <= maxR; r++) for (var c = 0; c <= maxC; c++) {
      var idx = p.cells.findIndex(function (x) { return x[0] === r && x[1] === c; });
      mini += '<i style="grid-column:' + (c + 1) + ';grid-row:' + (r + 1) + ';' + (idx < 0 ? 'visibility:hidden;' : '') + (idx >= 0 && idx < p.income ? 'background:#a64b36 url(../../assets/art/premium/patchwork/button.webp) center/72% no-repeat;' : '') + '"></i>';
    }
    return '<div class="patchcard"><div class="mini" style="grid-template-columns:repeat(' + (maxC + 1) + ',1fr);grid-template-rows:repeat(' + (maxR + 1) + ',1fr)">' + mini + '</div><div class="nm">' + p.name + '</div><div class="mt">' + p.cost + ' 扣 · ' + p.time + ' 时 · +' + p.income + '</div></div>';
  }).join('');

  var track = '';
  for (var i = 1; i <= 9; i++) {
    track += '<span class="sp">' + (i * 6 - 1) + (i === 3 ? '<span class="tok" style="left:2px;bottom:-14px;background:#d9b45c"></span>' : '') + (i === 5 ? '<span class="tok" style="right:2px;top:-14px;background:#b4513f"></span>' : '') + '</span>';
  }
  document.getElementById('track').innerHTML = track;

  var images = Array.from(document.images);
  var pending = images.filter(function (img) { return !img.complete; });
  Promise.all(pending.map(function (img) { return new Promise(function (resolve) { img.onload = img.onerror = resolve; }); })).then(function () {
    requestAnimationFrame(function () { document.body.setAttribute('data-ready', 'true'); });
  });
  if (!pending.length) requestAnimationFrame(function () { document.body.setAttribute('data-ready', 'true'); });
})();
</script>
</body>
</html>
