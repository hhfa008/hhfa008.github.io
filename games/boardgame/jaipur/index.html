<style>
:root{
  --paper:#f3ead9;--paper-2:#fbf5e9;--card:#efe2c8;--ink:#23262b;--muted:#6b6257;--muted-2:#70685c;
  --dark:#2b2f36;--dark-2:#23272d;--dark-3:#1b1e23;--on-dark:#f3ead9;--on-dark-muted:#b9b2a4;
  --brass:#b98a5a;--brass-2:#d3ae82;--red:#c0392b;--red-2:#9c2c21;--green:#3f7d5b;--green-2:#8fc9a9;
  --line:#d8cbb2;--line-strong:#c3b18f;--input:#fffdf8;
  --human:#3f7d5b;--ai:#b25a45;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);
  padding-bottom:calc(22px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p,ol,ul{margin:0}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

.site-header{background:var(--dark);color:var(--on-dark);padding:10px 0}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{min-height:44px;display:flex;align-items:center;gap:9px;font-weight:650;text-decoration:none;font-size:15px}
.brand-mark{width:24px;height:24px;border-radius:6px;flex:none;background:
  linear-gradient(135deg,transparent 46%,var(--dark-3) 46% 54%,transparent 54%),
  linear-gradient(45deg,transparent 46%,var(--dark-3) 46% 54%,transparent 54%),
  var(--brass);box-shadow:inset 0 0 0 2px var(--dark-3)}
.top-nav{display:flex;align-items:center;gap:2px}
.top-nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;border-radius:9px;
  color:var(--on-dark-muted);text-decoration:none;font-size:13px;font-weight:600}
.top-nav a:hover{color:var(--on-dark);background:#343a43}

.hero{padding:20px 0 10px}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--red);margin-bottom:7px}
.hero h1{font-size:clamp(1.85rem,7vw,2.5rem);line-height:1.08;letter-spacing:-.025em}
.hero h1 span{display:block;font-family:var(--serif);font-size:.48em;font-weight:400;
  letter-spacing:.04em;color:var(--muted);margin-top:5px}
.lede{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.65}
.lede strong{color:var(--ink);font-weight:650}

.game{background:var(--dark);color:var(--on-dark);border-radius:20px;padding:14px;margin-top:12px;
  box-shadow:0 16px 38px rgb(20 23 27 / .18);min-width:0;overflow:hidden}
.score-strip{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;
  background:var(--dark-2);border:1px solid #3a424b;border-radius:12px;padding:8px 10px}
.round-badge{font-size:12px;color:var(--on-dark-muted);white-space:nowrap}
.round-badge strong{color:var(--brass-2);font-size:16px;font-variant-numeric:tabular-nums}
.match-score{text-align:center;font-size:12.5px;color:var(--on-dark-muted);white-space:nowrap}
.match-score strong{display:inline-block;min-width:1.2em;color:var(--on-dark);font-size:20px;
  line-height:1.1;font-variant-numeric:tabular-nums}
.match-score .colon{padding:0 2px}
.round-score{font-size:11.5px;color:var(--on-dark-muted);white-space:nowrap}
.round-score b{color:var(--brass-2);font-variant-numeric:tabular-nums}
.turn-line{margin:9px 2px 0;font-size:13px;font-weight:650;color:var(--brass-2);
  min-height:20px;line-height:1.5}
.turn-line.ai{color:var(--on-dark-muted)}
.last-round{margin:4px 2px 0;font-size:11px;line-height:1.5;color:var(--on-dark-muted)}

.panel{margin-top:10px;background:var(--dark-2);border:1px solid #343b44;border-radius:14px;
  padding:9px 10px;min-width:0}
.panel.active{border-color:var(--brass)}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.panel-head h2{font-size:12.5px;font-weight:650;letter-spacing:.03em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.panel-head .meta{font-size:10.5px;color:var(--on-dark-muted);white-space:nowrap;
  font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.panel.ai .panel-head h2{color:#e1a794}
.panel.human .panel-head h2{color:var(--green-2)}

.hand-row{display:flex;flex-wrap:wrap;gap:5px;min-height:34px;align-items:center}
.hand-empty{font-size:11px;color:var(--on-dark-muted)}
.hand-chip{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:44px;
  padding:6px 9px;border-radius:9px;border:1px solid #4a525c;background:#2d343c;color:var(--on-dark);
  font-size:12px;font-weight:650;cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;transition:border-color .12s,background .12s}
.hand-chip:hover:not(:disabled){border-color:var(--brass);background:#343c45}
.hand-chip:disabled{cursor:not-allowed;opacity:.5}
.hand-chip .count{font-family:var(--mono);font-size:12px;color:var(--brass-2)}
.hand-chip .need{font-size:9.5px;font-weight:500;color:var(--on-dark-muted)}
.hand-chip.static{cursor:default;opacity:1}
.good-dot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--c,#888)}
.hand-chip[data-good="diamond"],.market-card[data-good="diamond"]{--c:#5ea6cf}
.hand-chip[data-good="gold"],.market-card[data-good="gold"]{--c:#d8aa4e}
.hand-chip[data-good="silver"],.market-card[data-good="silver"]{--c:#b9c0c8}
.hand-chip[data-good="silk"],.market-card[data-good="silk"]{--c:#c07ba8}
.hand-chip[data-good="spice"],.market-card[data-good="spice"]{--c:#d1764e}
.hand-chip[data-good="leather"],.market-card[data-good="leather"]{--c:#a9855c}

.market{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;min-width:0}
.market-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;min-width:0;min-height:84px;padding:5px 3px;border-radius:11px;border:1px solid #4a525c;
  background:linear-gradient(160deg,#343c45,#282f36);color:var(--on-dark);cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;overflow:hidden;
  transition:transform .12s,border-color .12s,background .12s}
.market-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,#888)}
.market-card:hover:not(:disabled){border-color:var(--brass);background:linear-gradient(160deg,#3b444e,#2c343c)}
.market-card:active:not(:disabled){transform:translateY(1px)}
.market-card:disabled{cursor:not-allowed;opacity:.65}
.market-card .glyph{font-family:var(--serif);font-size:21px;line-height:1.1;font-weight:650;color:var(--c,#ddd)}
.market-card .cname{font-size:10px;line-height:1.2;color:var(--on-dark-muted);white-space:nowrap}
.market-card .ctoken{position:absolute;top:3px;right:4px;font-family:var(--mono);font-size:8.5px;
  color:var(--on-dark-muted);font-variant-numeric:tabular-nums}
.market-card.camel{--c:#d0b078;background:linear-gradient(160deg,#4b4433,#332f26);cursor:default}
.market-card.camel .glyph{color:#e7c98c}
.market-card.empty{background:#252b31;border-style:dashed;opacity:.55;cursor:default}
.market-card.empty .glyph{color:#59626c;font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
  padding:9px 16px;border-radius:999px;border:1px solid transparent;background:var(--brass);
  color:#211b14;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--brass-2)}
.btn:disabled{cursor:not-allowed;opacity:.45}
.btn.ghost{background:transparent;color:var(--on-dark);border-color:#4a525c}
.btn.ghost:hover:not(:disabled){background:#343a43;border-color:#5d6873}
.btn-camel{width:100%;margin-top:7px;background:#8a734d;color:#fff5e2}
.btn-camel:hover:not(:disabled){background:#9d855a}
.btn-secondary{background:#3a424b;color:var(--on-dark);border-color:#4a525c}
.btn-secondary:hover:not(:disabled){background:#454f59}

.hint{margin-top:7px;font-size:10.5px;line-height:1.5;color:var(--on-dark-muted);min-height:16px}
.hint.warn{color:#f0a58f}

.sell-box{margin-top:10px;padding:10px;border-radius:13px;border:1px solid var(--brass);
  background:#303840;min-width:0}
.sell-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  font-size:13px;font-weight:650}
.sell-title .sell-value{font-size:11px;font-weight:500;color:var(--brass-2);white-space:nowrap}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
.stepper button{width:44px;height:44px;border-radius:11px;border:1px solid #4a525c;background:#232a31;
  color:var(--on-dark);font-size:20px;font-weight:700;line-height:1;cursor:pointer}
.stepper button:hover:not(:disabled){border-color:var(--brass)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:2.2em;text-align:center;font-family:var(--mono);font-size:22px;
  font-weight:700;color:var(--brass-2);font-variant-numeric:tabular-nums}
.sell-actions{display:flex;gap:8px}
.sell-actions .btn{flex:1}

.tokens{margin-top:11px;background:var(--dark-2);border:1px solid #343b44;border-radius:14px;padding:9px 10px}
.tokens h2{font-size:11px;font-weight:650;color:var(--on-dark-muted);letter-spacing:.05em;margin-bottom:6px}
.token-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.token-item{display:flex;align-items:center;justify-content:space-between;gap:5px;min-width:0;
  padding:5px 7px;border-radius:8px;background:#282f36;font-size:10.5px}
.token-item .tname{display:inline-flex;align-items:center;gap:5px;color:var(--on-dark-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.token-item .tval{font-family:var(--mono);font-size:10.5px;color:var(--brass-2);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.token-item.gone{opacity:.5}
.token-item.gone .tval{color:var(--on-dark-muted);text-decoration:line-through}

.log-panel{margin-top:11px;background:var(--dark-2);border:1px solid #343b44;border-radius:14px;padding:9px 10px}
.log-panel h2{font-size:11px;font-weight:650;color:var(--on-dark-muted);letter-spacing:.05em;margin-bottom:5px}
.log{list-style:none;margin:0;padding:0;max-height:150px;overflow-y:auto;font-size:11px;line-height:1.55;
  color:var(--on-dark-muted);scrollbar-color:#4a525c transparent}
.log li{padding:3px 0;border-bottom:1px solid rgb(255 255 255 / .05)}
.log li:last-child{border-bottom:0}
.log li.highlight{color:var(--brass-2);font-weight:650}
.log li .who{color:var(--on-dark)}

.banner{margin-top:11px;padding:14px;border-radius:14px;background:linear-gradient(150deg,#3d4a3f,#2a332c);
  border:1px solid #56705c;text-align:center}
.banner.lose{background:linear-gradient(150deg,#4a3a36,#332a27);border-color:#7b564c}
.banner h2{font-size:18px;letter-spacing:-.01em;margin-bottom:5px}
.banner p{font-size:11.5px;color:var(--on-dark-muted);line-height:1.6;margin-bottom:10px}
.banner .btn{min-width:150px}

.game-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.game-actions .btn{flex:1;min-width:130px}

.game-footer{margin:20px 0 8px;font-size:11px;line-height:1.65;color:var(--muted-2);
  display:flex;flex-wrap:wrap;gap:6px 14px}
.game-footer a{display:inline-flex;align-items:center;min-height:44px;color:var(--muted-2)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--brass-2);outline-offset:2px}

@media (max-width:430px){
  .wrap{padding:0 10px}
  .game{padding:10px;border-radius:16px}
  .hero{padding:16px 0 8px}
  .lede{font-size:14px}
  .score-strip{padding:7px 8px;gap:5px}
  .match-score strong{font-size:18px}
  .market{gap:4px}
  .market-card{min-height:76px;padding:4px 2px;border-radius:9px}
  .market-card .glyph{font-size:19px}
  .market-card .cname{font-size:9px}
  .market-card .ctoken{font-size:8px;top:2px;right:3px}
  .panel{padding:8px}
  .hand-chip{padding:5px 8px;font-size:11.5px}
  .token-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .log{max-height:130px}
  .game-actions .btn{min-width:0}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="../index.html" aria-label="返回桌游目录">
      <span class="brand-mark" aria-hidden="true"></span><span>斋普尔</span>
    </a>
    <nav class="top-nav" aria-label="导航">
      <a href="rules.html">规则</a>
      <a href="../index.html">桌游目录</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow">Jaipur · 人机对战</p>
    <h1>斋普尔 <span>Jaipur</span></h1>
    <p class="lede">在市场上取货、收骆驼、卖货换分。用<strong>三局两胜</strong>击败 AI，先把两轮胜利收入囊中。</p>
  </section>

  <section class="game" aria-label="斋普尔对局">
    <div class="score-strip">
      <div class="round-badge">第 <strong id="roundNum">1</strong> 轮</div>
      <div class="match-score" aria-label="整场比分">
        <strong id="humanWins">0</strong><span class="colon">:</span><strong id="aiWins">0</strong>
        <span class="sr-only">你 对 AI</span>
      </div>
      <div class="round-score">本轮 <b id="scoreLine">0 : 0</b></div>
    </div>
    <p class="last-round" id="lastRound" hidden></p>
    <p class="turn-line" id="turnLine" role="status" aria-live="polite">轮到你行动</p>

    <section class="panel ai" id="aiPanel" aria-label="AI 状态">
      <div class="panel-head"><h2>AI</h2><span class="meta" id="aiMeta">骆驼 3 · 本轮 0 分</span></div>
      <div class="hand-row" id="aiHand" aria-label="AI 手牌"></div>
    </section>

    <section class="panel market-panel" id="marketPanel" aria-label="市场">
      <div class="panel-head"><h2>市场</h2><span class="meta" id="deckCount">牌堆 45 张</span></div>
      <div class="market" id="market"></div>
      <button type="button" class="btn btn-camel" id="takeCamels" aria-label="收走市场全部骆驼">收走全部骆驼</button>
    </section>

    <section class="panel human" id="humanPanel" aria-label="你的状态">
      <div class="panel-head"><h2>你</h2><span class="meta" id="humanMeta">骆驼 3 · 本轮 0 分</span></div>
      <div class="hand-row" id="humanHand" aria-label="你的手牌"></div>
      <p class="hint" id="hint">点击市场上的货物取牌；点击自己的手牌可以卖货。</p>
    </section>

    <section class="sell-box" id="sellBox" hidden aria-label="卖牌操作">
      <div class="sell-title"><span id="sellTitle">卖出手牌</span><span class="sell-value" id="sellValue"></span></div>
      <div class="stepper">
        <button type="button" id="sellMinus" aria-label="减少卖出数量">−</button>
        <output id="sellCount" aria-live="polite">1</output>
        <button type="button" id="sellPlus" aria-label="增加卖出数量">+</button>
      </div>
      <div class="sell-actions">
        <button type="button" class="btn" id="sellConfirm">确认卖出</button>
        <button type="button" class="btn ghost" id="sellCancel" aria-label="取消卖牌">取消</button>
      </div>
    </section>

    <section class="tokens" aria-label="剩余得分代币">
      <h2>剩余得分代币 · 从高到低取</h2>
      <div class="token-grid" id="tokenGrid"></div>
    </section>

    <section class="log-panel" aria-label="对局日志">
      <h2>对局日志</h2>
      <ol class="log" id="log" aria-live="polite" aria-relevant="additions"></ol>
    </section>

    <section class="banner" id="banner" hidden aria-live="assertive">
      <h2 id="bannerTitle">比赛结束</h2>
      <p id="bannerText"></p>
      <button type="button" class="btn" id="playAgain">再来一局</button>
    </section>

    <div class="game-actions">
      <button type="button" class="btn ghost" id="restart">重新开始</button>
      <a class="btn ghost" href="rules.html">查看规则</a>
    </div>
  </section>

  <footer class="game-footer">
    <a href="rules.html">规则与常见问题</a>
    <a href="../index.html">返回桌游目录</a>
    <span>纯前端 · 无外部请求 · 离线可玩</span>
  </footer>
</main>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.JaipurEngine;
  if (!E) {
    document.getElementById('turnLine').textContent = '引擎加载失败，请刷新页面。';
    return;
  }

  var GLYPHS = { diamond: '钻', gold: '金', silver: '银', silk: '丝', spice: '香', leather: '皮' };
  var AI_DELAY = 700;

  var game = null;
  var pendingSell = null;
  var aiTimer = null;
  var hintTimer = null;

  var el = {
    roundNum: byId('roundNum'),
    humanWins: byId('humanWins'),
    aiWins: byId('aiWins'),
    scoreLine: byId('scoreLine'),
    lastRound: byId('lastRound'),
    turnLine: byId('turnLine'),
    aiPanel: byId('aiPanel'),
    aiMeta: byId('aiMeta'),
    aiHand: byId('aiHand'),
    marketPanel: byId('marketPanel'),
    market: byId('market'),
    deckCount: byId('deckCount'),
    takeCamels: byId('takeCamels'),
    humanPanel: byId('humanPanel'),
    humanMeta: byId('humanMeta'),
    humanHand: byId('humanHand'),
    hint: byId('hint'),
    sellBox: byId('sellBox'),
    sellTitle: byId('sellTitle'),
    sellValue: byId('sellValue'),
    sellCount: byId('sellCount'),
    sellMinus: byId('sellMinus'),
    sellPlus: byId('sellPlus'),
    sellConfirm: byId('sellConfirm'),
    sellCancel: byId('sellCancel'),
    tokenGrid: byId('tokenGrid'),
    log: byId('log'),
    banner: byId('banner'),
    bannerTitle: byId('bannerTitle'),
    bannerText: byId('bannerText'),
    playAgain: byId('playAgain'),
    restart: byId('restart')
  };

  function byId(id) { return document.getElementById(id); }

  function makeText(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function topToken(good) {
    var pile = game.tokenPiles[good];
    return pile && pile.length ? pile[0] : null;
  }

  function canSell(good) {
    if (game.over || game.turn !== 'human') return false;
    var player = game.players[0];
    return game.tokenPiles[good].length > 0 && player.hand[good] >= E.MIN_SELL[good];
  }

  function sellPreview(good, count) {
    var pile = game.tokenPiles[good];
    var taken = Math.min(count, pile.length);
    var sum = 0;
    for (var i = 0; i < taken; i++) sum += pile[i];
    var tier = count >= 5 ? 5 : count;
    var bonus = (count >= 3 && game.bonusAvailable[String(tier)]) ? E.BONUS_VALUES[tier] : 0;
    return { tokens: sum, bonus: bonus, total: sum + bonus };
  }

  function startGame() {
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
    pendingSell = null;
    game = E.createGame({ seed: (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0 });
    render();
    scheduleAI();
  }

  function render() {
    var scores = E.score(game);
    el.roundNum.textContent = String(game.round);
    el.humanWins.textContent = String(game.roundsWon.human);
    el.aiWins.textContent = String(game.roundsWon.ai);
    el.scoreLine.textContent = scores.human + ' : ' + scores.ai;

    if (game.lastRound) {
      el.lastRound.hidden = false;
      var lr = game.lastRound;
      var camel = lr.camelBonus ? (' · 骆驼分归 ' + name(lr.camelBonus)) : ' · 骆驼分无人获得';
      el.lastRound.textContent = '上一轮（第 ' + lr.round + ' 轮）：你 ' + lr.human + ' : ' +
        lr.ai + ' AI' + camel + (lr.winner ? (' · 胜者 ' + name(lr.winner)) : ' · 平局');
    } else {
      el.lastRound.hidden = true;
      el.lastRound.textContent = '';
    }

    el.turnLine.className = 'turn-line';
    if (game.over) {
      el.turnLine.textContent = E.winner(game) === 'human' ? '比赛结束：你赢了！' : '比赛结束：AI 赢了。';
    } else if (game.turn === 'ai') {
      el.turnLine.textContent = 'AI 正在思考…';
      el.turnLine.className = 'turn-line ai';
    } else {
      el.turnLine.textContent = '轮到你行动';
    }

    el.aiPanel.classList.toggle('active', !game.over && game.turn === 'ai');
    el.humanPanel.classList.toggle('active', !game.over && game.turn === 'human');

    var human = game.players[0];
    var ai = game.players[1];
    el.aiMeta.textContent = metaText(ai, scores.ai);
    el.humanMeta.textContent = metaText(human, scores.human);

    renderHand(el.aiHand, ai, false);
    renderHand(el.humanHand, human, true);
    renderMarket();
    renderTokens();
    renderSell();
    renderLog();
    renderBanner();

    el.restart.disabled = false;
  }

  function name(id) { return id === 'human' ? '你' : 'AI'; }

  function metaText(player, score) {
    return '骆驼 ' + player.camels + ' · 代币分 ' + player.scoreTokens.reduce(function (a, b) { return a + b; }, 0) +
      ' · 奖励 ' + player.bonusPoints + ' · 本轮 ' + score + ' 分';
  }

  function renderHand(container, player, interactive) {
    container.innerHTML = '';
    var any = false;
    E.GOODS.forEach(function (good) {
      var count = player.hand[good];
      if (!count) return;
      any = true;
      var label = E.GOOD_NAMES[good] + ' ' + count + ' 张';
      var node;
      if (interactive) {
        node = document.createElement('button');
        node.type = 'button';
        var sellable = canSell(good);
        node.disabled = !sellable;
        node.className = 'hand-chip';
        node.setAttribute('aria-label', sellable
          ? '卖出手中的' + label
          : label + '，' + (game.tokenPiles[good].length ? '不够最少卖出张数或未轮到你' : '该货物代币已卖光'));
        node.addEventListener('click', function () { openSell(good); });
      } else {
        node = document.createElement('span');
        node.className = 'hand-chip static';
        node.setAttribute('aria-label', 'AI 手牌 ' + label);
      }
      node.setAttribute('data-good', good);
      var dot = makeText('span', 'good-dot');
      dot.setAttribute('aria-hidden', 'true');
      node.appendChild(dot);
      node.appendChild(makeText('span', '', E.GOOD_NAMES[good]));
      node.appendChild(makeText('span', 'count', '×' + count));
      if (interactive) {
        var min = E.MIN_SELL[good];
        var need = min - count;
        if (need > 0) node.appendChild(makeText('span', 'need', '需' + min + '张'));
        else if (game.tokenPiles[good].length === 0) node.appendChild(makeText('span', 'need', '已卖光'));
      }
      container.appendChild(node);
    });
    if (!any) container.appendChild(makeText('span', 'hand-empty', '暂无货物，先去市场取牌或收骆驼。'));
  }

  function renderMarket() {
    el.market.innerHTML = '';
    var interactive = !game.over && game.turn === 'human';
    game.market.forEach(function (card) {
      if (card === 'camel') {
        var camel = document.createElement('div');
        camel.className = 'market-card camel';
        camel.setAttribute('role', 'img');
        camel.setAttribute('aria-label', '市场上的骆驼');
        camel.appendChild(makeText('span', 'glyph', '骆'));
        camel.appendChild(makeText('span', 'cname', '骆驼'));
        el.market.appendChild(camel);
      } else {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'market-card';
        btn.setAttribute('data-good', card);
        btn.setAttribute('aria-label', '从市场取走' + E.GOOD_NAMES[card]);
        btn.disabled = !interactive;
        btn.appendChild(makeText('span', 'glyph', GLYPHS[card]));
        btn.appendChild(makeText('span', 'cname', E.GOOD_NAMES[card]));
        var top = topToken(card);
        btn.appendChild(makeText('span', 'ctoken', top == null ? '售罄' : '≤' + top));
        btn.addEventListener('click', function () { doMove({ type: 'take', card: card }); });
        el.market.appendChild(btn);
      }
    });
    for (var i = game.market.length; i < E.MARKET_SIZE; i++) {
      var empty = document.createElement('div');
      empty.className = 'market-card empty';
      empty.setAttribute('aria-hidden', 'true');
      empty.appendChild(makeText('span', 'glyph', '—'));
      el.market.appendChild(empty);
    }

    var camels = game.market.filter(function (card) { return card === 'camel'; }).length;
    el.deckCount.textContent = '牌堆 ' + game.deck.length + ' 张';
    el.takeCamels.hidden = camels === 0;
    el.takeCamels.disabled = !interactive;
    el.takeCamels.textContent = '收走全部骆驼（' + camels + ' 只）';
    el.takeCamels.setAttribute('aria-label', '收走市场全部 ' + camels + ' 只骆驼');
  }

  function renderTokens() {
    el.tokenGrid.innerHTML = '';
    E.GOODS.forEach(function (good) {
      var pile = game.tokenPiles[good];
      var item = document.createElement('div');
      item.className = 'token-item' + (pile.length ? '' : ' gone');
      var nameWrap = makeText('span', 'tname');
      var dot = makeText('span', 'good-dot');
      dot.setAttribute('aria-hidden', 'true');
      nameWrap.appendChild(dot);
      nameWrap.appendChild(makeText('span', '', E.GOOD_NAMES[good]));
      item.appendChild(nameWrap);
      item.appendChild(makeText('span', 'tval', pile.length ? ('最高 ' + pile[0] + ' · ' + pile.length + ' 张') : '已卖光'));
      item.setAttribute('aria-label', E.GOOD_NAMES[good] + '剩余代币：' +
        (pile.length ? pile.join('、') : '无'));
      el.tokenGrid.appendChild(item);
    });
  }

  function renderSell() {
    if (!pendingSell || game.over || game.turn !== 'human') {
      el.sellBox.hidden = true;
      return;
    }
    var good = pendingSell.good;
    var player = game.players[0];
    var min = E.MIN_SELL[good];
    var max = player.hand[good];
    var count = Math.max(min, Math.min(max, pendingSell.count));
    pendingSell.count = count;
    if (max < min || game.tokenPiles[good].length === 0) {
      pendingSell = null;
      el.sellBox.hidden = true;
      return;
    }
    var preview = sellPreview(good, count);
    el.sellBox.hidden = false;
    el.sellTitle.textContent = '卖出「' + E.GOOD_NAMES[good] + '」 ' + count + ' 张（至少 ' + min + ' 张）';
    el.sellValue.textContent = '可得 ' + preview.tokens + ' 分' +
      (preview.bonus ? ' + 奖励 ' + preview.bonus + ' 分 = ' + preview.total + ' 分' : '');
    el.sellCount.textContent = String(count);
    el.sellMinus.disabled = count <= min;
    el.sellPlus.disabled = count >= max;
    el.sellConfirm.disabled = false;
    el.sellConfirm.setAttribute('aria-label', '确认卖出 ' + count + ' 张' + E.GOOD_NAMES[good]);
  }

  function renderLog() {
    el.log.innerHTML = '';
    var entries = game.log.slice(-30);
    entries.forEach(function (entry) {
      var li = makeText('li', entry.type === 'roundEnd' || entry.type === 'matchEnd' ? 'highlight' : '', entry.text);
      el.log.appendChild(li);
    });
    el.log.scrollTop = el.log.scrollHeight;
  }

  function renderBanner() {
    if (!game.over) {
      el.banner.hidden = true;
      el.sellBox.hidden = true;
      return;
    }
    var human = E.winner(game) === 'human';
    el.banner.hidden = false;
    el.banner.className = 'banner' + (human ? '' : ' lose');
    el.bannerTitle.textContent = human ? '你赢得了比赛' : 'AI 赢得了比赛';
    el.bannerText.textContent = '本场比分：你 ' + game.roundsWon.human + ' : ' +
      game.roundsWon.ai + ' AI · 共进行 ' + game.roundHistory.length + ' 轮。' +
      (human ? '再开一局试试更快的卖货节奏。' : '优先抢高分代币和骆驼分，下一局赢回来。');
  }

  function openSell(good) {
    if (!canSell(good) || !E.legalMoves(game).some(function (m) {
      return m.type === 'sell' && m.good === good;
    })) return;
    pendingSell = { good: good, count: E.MIN_SELL[good] };
    renderSell();
    el.sellBox.scrollIntoView({ block: 'nearest', behavior: prefersReduced() ? 'auto' : 'smooth' });
  }

  function doMove(move) {
    if (!game || game.over || game.turn !== 'human') return;
    var next;
    try {
      next = E.applyMove(game, move);
    } catch (error) {
      flash(error && error.message ? error.message : '这个动作不合法。');
      return;
    }
    pendingSell = null;
    game = next;
    render();
    scheduleAI();
  }

  function scheduleAI() {
    if (!game || game.over || game.turn !== 'ai') return;
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
    aiTimer = setTimeout(function () {
      aiTimer = null;
      if (!game || game.over || game.turn !== 'ai') return;
      var move = E.aiMove(game);
      if (!move) { render(); return; }
      try {
        game = E.applyMove(game, move);
      } catch (error) {
        flash('AI 动作异常：' + (error && error.message ? error.message : error));
      }
      render();
      scheduleAI();
    }, prefersReduced() ? 350 : AI_DELAY);
  }

  function prefersReduced() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function flash(message) {
    el.hint.textContent = message;
    el.hint.className = 'hint warn';
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(function () {
      hintTimer = null;
      el.hint.className = 'hint';
      el.hint.textContent = '点击市场上的货物取牌；点击自己的手牌可以卖货。';
    }, 2200);
  }

  el.takeCamels.addEventListener('click', function () { doMove({ type: 'takeCamels' }); });
  el.sellMinus.addEventListener('click', function () {
    if (!pendingSell) return;
    pendingSell.count = Math.max(E.MIN_SELL[pendingSell.good], pendingSell.count - 1);
    renderSell();
  });
  el.sellPlus.addEventListener('click', function () {
    if (!pendingSell) return;
    var max = game.players[0].hand[pendingSell.good];
    pendingSell.count = Math.min(max, pendingSell.count + 1);
    renderSell();
  });
  el.sellConfirm.addEventListener('click', function () {
    if (!pendingSell) return;
    var move = { type: 'sell', good: pendingSell.good, count: pendingSell.count };
    pendingSell = null;
    doMove(move);
  });
  el.sellCancel.addEventListener('click', function () {
    pendingSell = null;
    el.sellBox.hidden = true;
  });
  el.restart.addEventListener('click', startGame);
  el.playAgain.addEventListener('click', startGame);

  startGame();
})();
</script>
</body>
</html>
