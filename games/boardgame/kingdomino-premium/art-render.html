<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kingdomino 美术合成页：本地生成的素材在浏览器中的渲染预览。">
<title>Kingdomino art composition</title>
<script src="../../shared/shuffle.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<style>
:root{
  --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --gold:#c9a35e;--gold-2:#e8cc92;--gold-3:#8d6a33;
  --ink:#f4ecdc;--dim:#b8ac98;
  --art-table:url("../../assets/art/premium/kingdomino/table-oak.webp");
  --art-felt:none;
  --art-tile:url("../../assets/art/premium/kingdomino/tile-cardboard.webp");
  --art-wheat:url("../../assets/art/premium/kingdomino/terrain-wheat.webp");
  --art-forest:url("../../assets/art/premium/kingdomino/terrain-forest.webp");
  --art-water:url("../../assets/art/premium/kingdomino/terrain-water.webp");
  --art-grass:url("../../assets/art/premium/kingdomino/terrain-grass.webp");
  --art-swamp:url("../../assets/art/premium/kingdomino/terrain-swamp.webp");
  --art-mine:url("../../assets/art/premium/kingdomino/terrain-mine.webp");
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0c0a07}
body{width:1200px;overflow:hidden;color:var(--ink);font-family:var(--sans)}
.stage{position:relative;width:1200px;overflow:hidden;background:
  radial-gradient(1000px 720px at 12% -8%,rgba(201,163,94,.2),transparent 62%),
  radial-gradient(820px 640px at 96% 4%,rgba(255,255,255,.07),transparent 60%),
  linear-gradient(155deg,#17120d,#0c0a07 72%)}
.stage::before{content:"";position:absolute;inset:0;background:var(--art-table) center/cover no-repeat;opacity:.34;filter:saturate(.72) contrast(1.06);pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;background:var(--art-felt) center/cover no-repeat;opacity:.22;mix-blend-mode:soft-light;pointer-events:none}
.frame{position:absolute;inset:26px;border:1px solid rgba(201,163,94,.5);border-radius:26px;box-shadow:inset 0 0 0 6px rgba(201,163,94,.06),0 30px 90px rgba(0,0,0,.5);pointer-events:none;z-index:3}
.frame::before,.frame::after{content:"";position:absolute;width:58px;height:58px;border:2px solid rgba(201,163,94,.55)}
.frame::before{left:14px;top:14px;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
.frame::after{right:14px;bottom:14px;border-left:0;border-top:0;border-radius:0 0 16px 0}
.content{position:absolute;inset:64px;z-index:2;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:18px}
.logo{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#f0d9a4,#8d6a33);color:#1b150e;font-family:var(--serif);font-weight:700;font-size:34px;transform:rotate(-3deg);box-shadow:0 14px 32px rgba(0,0,0,.38)}
.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.28em;color:var(--gold-2);text-transform:uppercase}
.title{margin:4px 0 0;font-family:var(--serif);font-weight:700;font-size:64px;line-height:1.02;letter-spacing:.03em}
.title span{color:var(--gold-2)}
.sub{margin:8px 0 0;font-size:17px;letter-spacing:.08em;color:var(--dim)}
.scene{position:relative;flex:1;min-height:0;margin-top:26px}
.footer{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-top:18px;font-size:14px;color:var(--dim);letter-spacing:.04em}
.footer b{color:var(--gold-2);font-weight:700}
.row{display:flex;gap:12px;align-items:center}
.card{position:relative;border-radius:14px;padding:10px;background-color:var(--card-base,#f0e2c5);background-image:var(--art-linen),linear-gradient(150deg,#fff8e8,#e7d6b5);background-size:cover,auto;background-blend-mode:multiply,normal;color:#2a2117;border:1px solid #c2ac82;box-shadow:0 10px 22px rgba(0,0,0,.32);display:flex;flex-direction:column;gap:6px}
.pip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:9px;font-family:var(--mono);font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.noble{border-radius:14px;padding:10px;background:linear-gradient(160deg,#fbf4e3,#dccba8);border:1px solid #c2ac82;color:#302416;box-shadow:0 10px 22px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:6px}
.noble b{font-family:var(--serif);font-size:26px;line-height:1}
.token{display:grid;place-items:center;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-shadow:0 8px 16px rgba(0,0,0,.36),inset 0 2px 3px rgba(255,255,255,.4);font-family:var(--mono);font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#0f0c08;padding:7px;border-radius:14px;box-shadow:0 16px 34px rgba(0,0,0,.4)}
.cell{position:relative;aspect-ratio:1;border-radius:7px;background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-family:var(--mono);font-weight:700;font-size:17px;text-shadow:0 1px 3px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.1)}
.cell.castle{background:linear-gradient(145deg,#d9c492,#8d6a33);color:#241a0c;font-size:26px}
.cell.empty{background:#211b13;border:1px dashed #3c3225}
.draft-tile{border-radius:12px;padding:7px;background:var(--art-tile),linear-gradient(150deg,#efe3c8,#d9c499);background-size:cover,auto;background-blend-mode:multiply,normal;border:1px solid #b9a276;color:#2a2114;box-shadow:0 8px 18px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-weight:700}
.half{display:flex;align-items:center;justify-content:space-between;padding:5px 7px;border-radius:7px;background-size:cover;background-position:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);font-size:13px}
.cube{width:34px;height:34px;border-radius:6px;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.24);box-shadow:0 5px 10px rgba(0,0,0,.35),inset 0 2px 2px rgba(255,255,255,.3)}
.coin{width:38px;height:38px;border-radius:50%;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.3);box-shadow:0 6px 12px rgba(0,0,0,.35)}
.bowl{width:120px;height:120px;border-radius:50%;background:var(--art-bowl) center/cover no-repeat;border:1px solid rgba(255,255,255,.2);box-shadow:0 12px 24px rgba(0,0,0,.4);display:grid;place-items:center}
.bowl .cubes{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;width:70%}
.bowl .cube{width:20px;height:20px;border-radius:4px}
.stat{display:flex;flex-direction:column;gap:2px;padding:8px 14px;border:1px solid rgba(201,163,94,.36);border-radius:12px;background:rgba(20,15,10,.55)}
.stat b{font-family:var(--serif);font-size:26px;color:var(--gold-2)}
.stat span{font-size:12px;color:var(--dim);letter-spacing:.08em}
.caption{position:absolute;left:0;bottom:0;font-size:15px;letter-spacing:.04em;color:var(--dim)}
.caption b{color:var(--gold-2)}
.title{font-size:68px}
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/kingdomino-premium/art-render.html">
<style>
/* site-quality: fixed-size art composition must not create page overflow */
html{overflow-x:hidden}
body{width:100%!important;max-width:100vw!important;overflow-x:hidden}
.stage,#stage{max-width:100vw;overflow:hidden}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="frame"></div><div class="content" id="content"></div></div>
<script>
(function(){
  'use strict';
  var E=window.KingdominoEngine, D=window.KingdominoData;
  var Q=new URLSearchParams(location.search); var shot=Q.get('shot')||'cover';
  var content=document.getElementById('content');
  var stage=document.getElementById('stage');
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function brand(kicker,title,sub){
    return '<div class="brand"><div class="logo">王</div><div><div class="kicker">'+esc(kicker)+'</div><h1 class="title">'+title+'</h1><p class="sub">'+esc(sub)+'</p></div></div>';
  }
  function footer(left,right){
    return '<div class="footer"><span>'+left+'</span><span>'+right+'</span></div>';
  }

  var fresh=E.createGame({seed:20261110});
  var played=E.createGame({seed:20261110});
  var guard=0;
  while(!played.over&&guard<400){played=E.applyMove(played,E.chooseAIMove(played));guard++;}
  function cellHtml(cell,size){
    if(!cell)return '<div class="cell empty"></div>';
    if(cell.castle)return '<div class="cell castle">♜</div>';
    return '<div class="cell" style="background-image:var(--art-'+cell.terrain+');background-size:cover">'+(cell.crowns?'♛'+cell.crowns:'')+'</div>';
  }
  function gridHtml(grid,cellSize){
    var html='<div class="grid5" style="width:'+(cellSize*5+40)+'px">';
    for(var r=0;r<5;r++)for(var c=0;c<5;c++)html+=cellHtml(grid[r][c],cellSize);
    return html+'</div>';
  }
  function tileHtml(tileId,no,width){
    var t=E.getTile(tileId);
    function half(h){return '<div class="half" style="background-image:var(--art-'+h.terrain+')"><span>'+esc(E.terrainName(h.terrain))+'</span><b>'+(h.crowns?'♛'+h.crowns:'')+'</b></div>';}
    return '<div class="draft-tile" style="width:'+(width||132)+'px">'+(no?'<div style="font-size:12px;color:#6b5324">#'+no+'</div>':'')+half(t.a)+half(t.b)+'</div>';
  }
  function renderShot(shot){
    if(shot==='cover'){
      return brand('KINGDOMINO · 2 PLAYERS','多米诺王国<span> · KINGDOMINO</span>','48 张真实瓦片 · 5×5 王国 · 面积 × 皇冠')+
        '<div class="scene" style="display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center">'+
        '<div class="row" style="gap:24px;align-items:flex-start">'+
        '<div style="display:flex;flex-direction:column;gap:6px;align-items:center">'+gridHtml(played.players[0].grid,64)+'<span style="font-size:13px;color:var(--dim)">你 · '+E.playerScore(played.players[0])+' 分</span></div>'+
        '<div style="display:flex;flex-direction:column;gap:6px;align-items:center">'+gridHtml(played.players[1].grid,64)+'<span style="font-size:13px;color:var(--dim)">AI · '+E.playerScore(played.players[1])+' 分</span></div>'+
        '</div>'+
        '<div class="row" style="gap:14px;margin-top:4px">'+fresh.draft.map(function(e){return tileHtml(e.tileId,e.slot+1,116);}).join('')+'</div>'+
        '</div>'+
        footer('<b>地形匹配</b> · 面积 × 皇冠','本地 + 联机 · 2 人 · 零外部请求');
    }
    if(shot==='og'){
      return '<div style="display:grid;grid-template-columns:410px 1fr;gap:28px;height:100%">'+
        '<div style="display:flex;flex-direction:column;justify-content:center">'+brand('KINGDOMINO · 2 PLAYERS','多米诺王国<span> · KINGDOMINO</span>','5×5 领地的取舍')+
        '<div style="display:flex;gap:10px;margin-top:24px;flex-wrap:wrap"><span class="stat"><b>48</b><span>真实瓦片</span></span><span class="stat"><b>24</b><span>两人局</span></span><span class="stat"><b>39</b><span>皇冠</span></span></div>'+
        '<p style="margin-top:20px;color:var(--dim);font-size:15px;line-height:1.6">同地形连通成领地，面积乘以皇冠总数才计分。选强牌还是抢下一轮先手，是每一轮的取舍。</p></div>'+
        '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">'+gridHtml(played.players[0].grid,72)+'<div class="row">'+fresh.draft.slice(0,4).map(function(e){return tileHtml(e.tileId,null,108);}).join('')+'</div></div></div>';
    }
    if(shot==='detail1'){
      return brand('THE 5×5 KINGDOM','完整 5×5 王国','真实 48 张牌表中的 24 张两人局 · 城堡居中')+
        '<div class="scene" style="display:flex;align-items:center;justify-content:center;gap:40px">'+
        '<div style="display:flex;flex-direction:column;align-items:center;gap:12px">'+gridHtml(played.players[0].grid,108)+'<span style="font-family:var(--serif);font-size:30px;color:var(--gold-2)">'+E.playerScore(played.players[0])+' 分</span></div>'+
        '<div style="max-width:300px"><div class="stat" style="margin-bottom:14px"><b>6 × 4</b><span>6 轮 · 每轮 4 张待选</span></div><div class="stat" style="margin-bottom:14px"><b>12</b><span>每人 12 张瓦片</span></div><p style="font-size:15px;line-height:1.65;color:var(--dim)">新瓦片必须与王国相邻且至少一格地形相同；城堡四边视为任意地形。放不进 5×5 或无法匹配的瓦片必须弃置。</p></div></div>';
    }
    return brand('DRAFT & CROWNS','待选队列与皇冠','本轮选的队列位置决定下一轮先手')+
      '<div class="scene" style="display:flex;flex-direction:column;gap:24px;justify-content:center;align-items:center">'+
      '<div class="row" style="gap:18px">'+fresh.draft.map(function(e){return tileHtml(e.tileId,e.slot+1,168);}).join('')+'</div>'+
      '<div class="row" style="gap:24px;align-items:center;justify-content:center">'+
      '<div style="background:#fffdf7;border:1px solid #c2ac82;border-radius:20px;padding:14px;box-shadow:0 16px 34px rgba(0,0,0,.35)"><img src="../../assets/art/premium/kingdomino/king-meeple.webp" alt="" style="width:170px;display:block"></div>'+
      '<div><div class="stat" style="margin-bottom:12px"><b>39</b><span>全场皇冠</span></div><div class="stat"><b>96</b><span>48 张 × 2 格</span></div><p style="max-width:340px;margin-top:14px;font-size:15px;line-height:1.65;color:var(--dim)">同地形连通成一块领地；没有皇冠的领地得 0 分，所以大领地也要有皇冠才值钱。</p></div></div>'+
      '<div class="caption">两人局：24 张瓦片，每人 12 张，6 轮完成 5×5 王国。</div></div>';
  }
  window.__artShot=shot;
  var sizes={cover:[1200,1200],og:[1200,630],detail1:[1200,800],detail2:[1200,800]};
  var size=sizes[shot]||sizes.cover;
  stage.style.height=size[1]+'px';
  document.body.style.height=size[1]+'px';
  var html=renderShot(shot);
  content.innerHTML=html;
})();
</script>
</body>
</html>
