<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>半程猜骰 · 原创骰子微游戏</title>
<meta name="description" content="《半程猜骰》是一款猜大小的骰子游戏。轮到你时先掷一颗 6 面起始骰，再判断下一颗骰子会更大还是更小。猜对时，新点数加入本轮奖池，你可以继续猜或落袋；猜错或两颗点数相同，奖池清零并结束本轮。每轮最多猜 2 次。落袋后奖池计入总分。双方各行动 7 轮，总分较高者获胜，同分平局。">
<style>
:root{--bg:#101a20;--panel:#18272f;--panel2:#21363f;--ink:#eef7f5;--muted:#93b0ab;--gold:#ffd166;--green:#57d99a;--red:#ff7b82;--line:#2d4852}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 80% at 50% -10%,#2b5d56 0%,#123633 42%,#061716 100%) fixed;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(60% 38% at 50% 6%,rgba(255,224,160,.16),transparent 70%),radial-gradient(130% 90% at 50% 125%,rgba(0,0,0,.62),transparent 62%)}
.wrap{position:relative;z-index:1}
.wrap{max-width:390px;margin:0 auto;padding:10px 12px 30px}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 0 10px}
.top h1{font-size:18px;line-height:1.25;margin:0;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:52px;padding:0 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;white-space:nowrap}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin-bottom:10px}
.who{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0}
.who .name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .val{font-size:24px;font-weight:900;line-height:1.15;color:var(--gold)}
.who.ai .val{color:var(--green)}
.round{align-self:center;text-align:center;font-size:12px;color:var(--muted);min-width:64px}
.round b{display:block;color:var(--ink);font-size:14px}
.stage{position:relative;background:radial-gradient(90% 70% at 50% 0%,#1d4b42 0%,#123630 55%,#0b2320 100%);border:1px solid rgba(255,224,160,.18);border-radius:20px;padding:18px 12px 16px;text-align:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 0 18px 40px rgba(0,0,0,.28),0 18px 46px rgba(0,0,0,.42)}
.stage.heat-2{box-shadow:inset 0 0 0 1px rgba(255,209,102,.18),inset 0 18px 40px rgba(0,0,0,.3),0 18px 46px rgba(0,0,0,.45),0 0 34px rgba(255,176,64,.14)}
.stage.heat-3{box-shadow:inset 0 0 0 1px rgba(255,120,90,.28),inset 0 18px 40px rgba(0,0,0,.32),0 18px 46px rgba(0,0,0,.5),0 0 46px rgba(255,96,64,.26)}
.stage.heat-3 .pot{animation:potPulse 1.1s ease-in-out infinite}
.stage.bust{animation:bustShake .34s ease}
@keyframes potPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes bustShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.stage::after{content:"";position:absolute;inset:8px;border-radius:14px;border:1px dashed rgba(255,224,160,.12);pointer-events:none}
.dice{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:64px;align-items:center}
.die{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;background:linear-gradient(155deg,#fffaf0,#e7dcc4 55%,#c9bb9b);color:#1a2322;font-size:26px;font-weight:900;box-shadow:0 6px 0 #8f8366,0 12px 22px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.9);transform:rotate(-2deg)}
.dice.rolling .die{animation:diceRoll .5s cubic-bezier(.2,.9,.2,1)}
.dice.rolling .die:nth-child(2){animation-delay:.03s}
.dice.rolling .die:nth-child(3){animation-delay:.06s}
@keyframes diceRoll{0%{transform:translateY(-14px) rotate(-24deg) scale(.92)}55%{transform:translateY(2px) rotate(10deg) scale(1.04)}100%{transform:rotate(-2deg)}}
.pot{font-size:32px;font-weight:900;color:var(--gold);line-height:1.2;margin:8px 0 2px;text-shadow:0 0 18px rgba(255,209,102,.45),0 2px 0 rgba(0,0,0,.35);letter-spacing:.02em}
.stage .hint{font-size:12px;color:var(--muted);min-height:18px}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.chip{font-size:12px;padding:5px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.actions.single{grid-template-columns:1fr}
.actions.two{grid-template-columns:repeat(2,minmax(0,1fr))}
button{font:inherit;color:var(--ink);background:linear-gradient(170deg,var(--panel2),#182a2e);border:1px solid var(--line);border-radius:13px;min-height:50px;padding:8px 10px;cursor:pointer;touch-action:manipulation;font-size:15px;font-weight:700;box-shadow:0 6px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
button.primary{background:linear-gradient(160deg,#ffe7a6,#e9b94c 65%,#c9992f);color:#2c2000;border:none;box-shadow:0 8px 20px rgba(233,185,76,.32),inset 0 1px 0 rgba(255,255,255,.75)}
button.bank{background:linear-gradient(160deg,#8af0c2,#38b97e 65%,#1f8f5c);color:#06281b;border:none;box-shadow:0 8px 20px rgba(56,185,126,.28),inset 0 1px 0 rgba(255,255,255,.6)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:default}
.fs{background:transparent;border:1px solid var(--line);border-radius:10px;min-height:44px;min-width:44px;box-shadow:none;font-size:14px}
.status{margin-top:12px;min-height:24px;text-align:center;font-size:13px;color:var(--gold);font-weight:700}
.log{margin-top:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;min-height:72px}
.log div{padding:2px 0;overflow-wrap:anywhere}
.over{margin:6px 0 2px;padding:18px 12px 16px;border-radius:16px;background:radial-gradient(80% 90% at 50% 0%,rgba(255,224,160,.14),rgba(0,0,0,.34) 70%);border:1px solid rgba(255,224,160,.22);text-align:center;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.over h2{font-size:20px;margin:4px 0 6px}
.over p{font-size:13px;color:var(--muted);margin:4px 0 10px}
.foot{text-align:center;margin-top:16px}
.foot-row{display:flex;gap:8px}
.foot button{flex:1;min-height:46px}
.streak{margin:8px 0 0;font-size:12px;color:var(--muted)}
.intro{margin:0 0 10px;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:13px;line-height:1.55;color:var(--ink)}
.intro p{margin:0 0 8px}
.intro button{min-height:40px;padding:0 14px}
.daily-tag{color:var(--gold)}
@media (max-width:360px){.wrap{padding:8px 9px 26px}.who .val{font-size:20px}.die{width:44px;height:44px;font-size:21px}}

.wrap { --mini-safe-bottom: 26px; padding-bottom: calc(var(--mini-safe-bottom) + env(safe-area-inset-bottom, 0px)); }
/* mini-quality: reduced-motion */
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; } }

<div class="wrap">

  </header>
  <main>
    <div class="intro" id="intro" hidden><p>掷骰子累计分数，见好就收才能保住；每天玩一次「每日挑战」，同一天同种子、连胜可累计。</p><button type="button" id="introClose">知道了</button></div>
    <section class="score" aria-label="比分">
      <div class="who"><div class="name">你</div><div class="val" id="youVal">0</div></div>
      <div class="round"><b id="roundVal">1 / 7</b>回合</div>
      <div class="who ai"><div class="name">半仙（电脑）</div><div class="val" id="aiVal">0</div></div>
    </section>
    <section class="stage">
      <div class="dice" id="dice" aria-live="polite"></div>
      <div class="pot" id="potVal">0</div>
      <div class="hint" id="hint">轮到你行动</div>
      <div class="stats" id="stats"></div>
    </section>
    <section class="actions" id="actions" aria-label="操作区"></section>
    <div class="status" id="status" aria-live="polite"></div>
    <section class="log" id="log" aria-label="对局记录"></section>
    <div class="foot"><div class="foot-row"><button type="button" id="reset">新开一局</button><button type="button" id="daily" class="primary">每日挑战</button></div><p class="streak" id="streak"></p></div>

<script>
'use strict';
/* Mini dice engine (UMD) - pure, seedable, no DOM and no network. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.DiceMiniEngine = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  var CFG = {"name":"半程猜骰","mode":"highlow","aiName":"半仙","faces":6,"maxRolls":2,"maxRounds":7,"aiBank":6};

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function d6(g) { return 1 + Math.floor(g.rng() * CFG.faces); }
  function sideName(g) { return g.turn === 'you' ? '你' : CFG.aiName; }
  function scoreOf(g, side) { return g.mode === 'bet' ? g[side].bankroll : g[side].score; }

  function addLog(g, msg) {
    g.last = msg;
    g.log.push(msg);
    if (g.log.length > 40) g.log.shift();
  }

  function finish(g, forced) {
    g.phase = 'over';
    if (forced) g.winner = forced;
    else {
      var a = scoreOf(g, 'you'), b = scoreOf(g, 'ai');
      g.winner = a > b ? 'you' : (a < b ? 'ai' : 'draw');
    }
    var tail = g.winner === 'draw' ? '平局' : (g.winner === 'you' ? '你获胜' : '对手获胜');
    addLog(g, '对局结束：' + tail + '。你的成绩 ' + scoreOf(g, 'you') + '，对手成绩 ' + scoreOf(g, 'ai') + '。');
  }

  function endTurn(g) {
    g[g.turn].bets = 0;
    g.pot = 0; g.rolls = 0; g.multiplier = 1;
    g.dice = []; g.current = 0; g.streak = 0;
    if (g.turn === 'you') {
      g.turn = 'ai';
    } else {
      g.turn = 'you';
      g.round++;
      if (g.round > g.maxRounds) return finish(g);
    }
  }

  function createGame(opts) {
    opts = opts || {};
    var seed = opts.seed == null ? 1 : (opts.seed >>> 0);
    return {
      cfg: CFG, seed: seed, rng: mulberry32(seed), mode: CFG.mode,
      round: 1, maxRounds: CFG.maxRounds, turn: 'you',
      you: { score: 0, bankroll: CFG.start || 0, bets: 0 },
      ai: { score: 0, bankroll: CFG.start || 0, bets: 0 },
      pot: 0, multiplier: 1, rolls: 0, dice: [], current: 0, streak: 0,
      phase: 'play', winner: null, last: '准备开始',
      log: ['新对局开始，你先行动。']
    };
  }

  function actions(g) {
    if (g.phase === 'over') return [];
    if (g.mode === 'push' || g.mode === 'chain') {
      if (g.rolls >= CFG.maxRolls) return [{ id: 'bank', label: '落袋 +' + g.pot }];
      var out = [{ id: 'roll', label: g.rolls ? '再掷一次' : '掷骰' }];
      if (g.pot > 0) out.push({ id: 'bank', label: '落袋 +' + g.pot });
      return out;
    }
    if (g.mode === 'highlow') {
      if (g.current === 0) return [{ id: 'roll', label: '掷起始骰' }];
      if (g.rolls >= CFG.maxRolls) return [{ id: 'bank', label: '落袋 +' + g.pot }];
      var h = [{ id: 'high', label: '猜更大' }, { id: 'low', label: '猜更小' }];
      if (g.pot > 0) h.push({ id: 'bank', label: '落袋 +' + g.pot });
      return h;
    }
    var p = g[g.turn];
    if (p.bankroll <= 0) return [{ id: 'end', label: '结束回合' }];
    var faces = [];
    for (var f = 1; f <= CFG.faces; f++) faces.push({ id: 'face:' + f, label: '押 ' + f + ' 点' });
    return faces;
  }

  function hasAction(g, id) {
    var as = actions(g);
    for (var i = 0; i < as.length; i++) if (as[i].id === id) return true;
    return false;
  }

  function act(g, id) {
    if (!g || g.phase === 'over') return { ok: false, error: '对局已结束' };
    if (!hasAction(g, id)) return { ok: false, error: '动作不可用' };
    var p = g[g.turn];
    var i, d, dice, sum, gain, lost, face, stake, hits, profit;

    if (g.mode === 'push') {
      if (id === 'roll') {
        dice = [];
        for (i = 0; i < CFG.dice; i++) dice.push(d6(g));
        g.dice = dice; g.rolls++;
        if (dice.indexOf(CFG.bust) >= 0) {
          lost = g.pot; g.pot = 0;
          if (CFG.penalty > 0) p.score = Math.max(0, p.score - CFG.penalty);
          addLog(g, sideName(g) + '掷出 ' + dice.join('、') + '，爆点，奖池清零' + (CFG.penalty > 0 ? '并倒扣 ' + CFG.penalty + ' 分' : '') + '。');
          endTurn(g);
          return { ok: true, bust: true };
        }
        sum = 0; for (i = 0; i < dice.length; i++) sum += dice[i];
        var crit = CFG.critDouble && dice.length > 1 && dice.every(function (x) { return x === dice[0]; });
        gain = crit ? sum * 2 : sum;
        g.pot += gain;
        addLog(g, sideName(g) + '掷出 ' + dice.join('、') + '，奖池 +' + gain + (crit ? '（同点翻倍）' : '') + '。');
        return { ok: true };
      }
      if (id === 'bank') {
        p.score += g.pot;
        addLog(g, sideName(g) + '落袋，总分 +' + g.pot + '。');
        endTurn(g);
        return { ok: true };
      }
    }

    if (g.mode === 'chain') {
      if (id === 'roll') {
        d = d6(g); g.dice = [d]; g.rolls++;
        if (d === CFG.bust) {
          lost = g.pot; g.pot = 0;
          addLog(g, sideName(g) + '掷出 ' + d + '，爆点，损失奖池 ' + lost + '。');
          endTurn(g);
          return { ok: true, bust: true };
        }
        gain = d * g.multiplier;
        g.pot += gain;
        addLog(g, sideName(g) + '掷出 ' + d + '，' + g.multiplier + ' 倍，奖池 +' + gain + '。');
        g.multiplier++;
        return { ok: true };
      }
      if (id === 'bank') {
        p.score += g.pot;
        addLog(g, sideName(g) + '落袋，总分 +' + g.pot + '。');
        if (p.score >= CFG.target) { finish(g, g.turn); return { ok: true, won: true }; }
        endTurn(g);
        return { ok: true };
      }
    }

    if (g.mode === 'highlow') {
      if (id === 'roll') {
        d = d6(g); g.dice = [d]; g.current = d;
        addLog(g, sideName(g) + '掷出起始骰 ' + d + '。');
        return { ok: true };
      }
      if (id === 'high' || id === 'low') {
        var from = g.current;
        var next = d6(g); g.rolls++;
        var correct = id === 'high' ? next > from : next < from;
        g.current = next; g.dice = [from, next];
        if (!correct) {
          lost = g.pot; g.pot = 0;
          addLog(g, sideName(g) + '猜 ' + (id === 'high' ? '更大' : '更小') + '，开 ' + from + ' 后出 ' + next + '，猜错，奖池清零。');
          endTurn(g);
          return { ok: true, wrong: true };
        }
        g.pot += next; g.streak++;
        addLog(g, sideName(g) + '猜 ' + (id === 'high' ? '更大' : '更小') + '，' + from + ' 后出 ' + next + '，猜对，奖池 +' + next + '。');
        if (g.rolls >= CFG.maxRolls) addLog(g, '本轮猜数次已达上限，只能落袋。');
        return { ok: true };
      }
      if (id === 'bank') {
        p.score += g.pot;
        addLog(g, sideName(g) + '落袋，总分 +' + g.pot + '。');
        endTurn(g);
        return { ok: true };
      }
    }

    if (g.mode === 'bet') {
      if (id === 'end') {
        addLog(g, sideName(g) + '筹码不足，结束本轮。');
        endTurn(g);
        return { ok: true };
      }
      face = parseInt(id.slice(5), 10);
      if (!(face >= 1 && face <= CFG.faces)) return { ok: false, error: '押注点数非法' };
      stake = Math.min(CFG.stake, p.bankroll);
      if (stake <= 0) { endTurn(g); return { ok: true }; }
      p.bankroll -= stake;
      dice = [];
      for (i = 0; i < CFG.betDice; i++) dice.push(d6(g));
      g.dice = dice;
      hits = 0;
      for (i = 0; i < dice.length; i++) if (dice[i] === face) hits++;
      if (hits > 0) {
        profit = stake * CFG.payout * hits;
        p.bankroll += stake + profit;
        addLog(g, sideName(g) + '押 ' + face + ' 点，开 ' + dice.join('、') + '，命中 ' + hits + ' 颗，净赚 ' + profit + '。');
      } else {
        addLog(g, sideName(g) + '押 ' + face + ' 点，开 ' + dice.join('、') + '，未命中，损失 ' + stake + '。');
      }
      p.bets++;
      if (p.bankroll <= 0 || p.bets >= CFG.maxBets) endTurn(g);
      return { ok: true };
    }

    return { ok: false, error: '未知模式' };
  }

  function autoMove(g) {
    if (!g || g.phase === 'over') return { ok: false, error: '对局已结束' };
    var as = actions(g);
    if (!as.length) { finish(g); return { ok: false, error: '无可用动作' }; }
    var id = null;
    var p = g[g.turn];
    var i;
    if (g.mode === 'push' || g.mode === 'chain') {
      id = (g.pot >= CFG.aiBank || g.rolls >= CFG.maxRolls) ? 'bank' : 'roll';
    } else if (g.mode === 'highlow') {
      if (g.current === 0) id = 'roll';
      else if (g.pot >= CFG.aiBank || g.rolls >= CFG.maxRolls) id = 'bank';
      else id = g.current <= Math.ceil(CFG.faces / 2) ? 'high' : 'low';
    } else {
      if (p.bankroll <= 0) id = 'end';
      else id = 'face:' + (1 + Math.floor(g.rng() * CFG.faces));
    }
    var found = false;
    for (i = 0; i < as.length; i++) if (as[i].id === id) found = true;
    if (!found) id = as[0].id;
    return act(g, id);
  }

  function view(g) {
    var as = actions(g);
    var out = [];
    for (var i = 0; i < as.length; i++) out.push({ id: as[i].id, label: as[i].label });
    return {
      meta: { name: CFG.name, mode: g.mode, aiName: CFG.aiName },
      mode: g.mode,
      round: g.round, maxRounds: g.maxRounds, turn: g.turn,
      phase: g.phase, winner: g.winner,
      you: { score: g.you.score, bankroll: g.you.bankroll },
      ai: { score: g.ai.score, bankroll: g.ai.bankroll },
      pot: g.pot, multiplier: g.multiplier, rolls: g.rolls, maxRolls: CFG.maxRolls,
      dice: g.dice.slice(), current: g.current, streak: g.streak,
      target: CFG.target, stake: CFG.stake, payout: CFG.payout,
      maxBets: CFG.maxBets, faces: CFG.faces, betDice: CFG.betDice, bust: CFG.bust,
      actions: out, last: g.last, log: g.log.slice(-8)
    };
  }

  var META = { name: CFG.name, mode: CFG.mode };
  return { createGame: createGame, actions: actions, act: act, autoMove: autoMove, aiTurn: autoMove, view: view, META: META, CFG: CFG };
});

</script>
<script>
/* 统一进度/留存模块（UMD）。
 *
 *   window.GameProgress / require('./progress.js')
 *
 * 目标：给 453 个入口页一条共同的留存回路——
 *   - 每日挑战：同一天同一游戏得到同一个种子（可复现、可比较）
 *   - 连胜：当天完成每日挑战记一次，断天归零
 *   - 最好成绩：本地历史最好分
 * 依赖 Store（games/shared/store.js）；没有 Store 时退回 localStorage。
 * 只做数据与规则，不碰 DOM。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(root);
  else root.GameProgress = factory(root);
})(typeof globalThis !== 'undefined' ? globalThis : this, function (root) {
  'use strict';

  var NS = 'gp.v1.';

  function storage() {
    if (root && root.Store && typeof root.Store.get === 'function') return root.Store;
    if (root && root.localStorage) {
      return {
        get: function (k, d) { try { var v = root.localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
        set: function (k, v) { try { root.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
      };
    }
    var mem = {};
    return {
      get: function (k, d) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : d; },
      set: function (k, v) { mem[k] = v; return true; }
    };
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // Local calendar day (not UTC): daily reset follows the player's clock.
  function dayKey(date) {
    var d = date || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function hash(s) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  // Same slug + same day -> same seed, so players see the same challenge.
  function dailySeed(slug, date) {
    return hash(String(slug) + '|' + dayKey(date)) % 1000000 + 1;
  }

  function key(slug, name) { return NS + slug + '.' + name; }

  function stats(slug) {
    var s = storage();
    return {
      best: Number(s.get(key(slug, 'best'), 0)) || 0,
      streak: Number(s.get(key(slug, 'streak'), 0)) || 0,
      lastDay: String(s.get(key(slug, 'lastDay'), '') || ''),
      dailyDone: String(s.get(key(slug, 'dailyDone'), '') || ''),
      runs: Number(s.get(key(slug, 'runs'), 0)) || 0
    };
  }

  /**
   * record({slug, mode:'daily'|'free', score, won, date})
   * - best: max(score)
   * - runs: +1
   * - daily: only once per day; counts streak (+1 if lastDay is yesterday,
   *   else 1). Free runs never touch streak.
   * 返回更新后的 stats 与本次是否计入每日。
   */
  function record(entry) {
    var s = storage();
    var slug = String(entry.slug || '');
    if (!slug) throw new Error('record: slug required');
    var cur = stats(slug);
    var score = Number(entry.score) || 0;
    var now = entry.date || new Date();
    var today = dayKey(now);
    var countedDaily = false;

    if (score > cur.best) { cur.best = score; s.set(key(slug, 'best'), cur.best); }
    cur.runs += 1;
    s.set(key(slug, 'runs'), cur.runs);

    if (entry.mode === 'daily' && cur.dailyDone !== today) {
      var yesterday = dayKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1));
      cur.streak = cur.lastDay === yesterday ? cur.streak + 1 : 1;
      cur.lastDay = today;
      cur.dailyDone = today;
      countedDaily = true;
      s.set(key(slug, 'streak'), cur.streak);
      s.set(key(slug, 'lastDay'), today);
      s.set(key(slug, 'dailyDone'), today);
    } else if (entry.mode === 'daily' && cur.dailyDone === today && entry.force) {
      countedDaily = false; // idempotent by default; force only records the run
    }

    return { stats: cur, countedDaily: countedDaily, today: today };
  }

  function dailyState(slug, date) {
    var today = dayKey(date);
    var cur = stats(slug);
    return { today: today, done: cur.dailyDone === today, streak: cur.streak, seed: dailySeed(slug, date) };
  }

  return {
    dayKey: dayKey,
    dailySeed: dailySeed,
    stats: stats,
    record: record,
    dailyState: dailyState,
    keyPrefix: NS
  };
});
</script>
<script>
(function () {
  var E = window.DiceMiniEngine;
  var busy = false;
  var SLUG = "mini-dice-a-16";
  var mode = "free";
  var finished = false;
  var g = E.createGame({ seed: (Date.now() % 1000000000) });
  function newSeed() { return mode === "daily" ? GameProgress.dailySeed(SLUG) : (Date.now() % 1000000000); }
  function heatLevel(v) {
    var pot = Number(v.pot) || 0;
    var bank = Number(v.you && v.you.bankroll) || 0;
    var ratio = pot / (pot + bank + 1);
    if (v.mode === "bet") ratio = pot / (Number(v.stake || 1) * Math.max(1, Number(v.you && v.you.bankroll) || 1));
    return ratio > 0.6 ? 3 : (ratio > 0.35 ? 2 : 1);
  }
  function sfx(name) { try { if (window.Sfx) window.Sfx.play(name); } catch (e) { /* audio optional */ } }
  function refreshStreak() {
    var el = $("streak"); if (!el) return;
    var st = GameProgress.dailyState(SLUG);
    el.textContent = (mode === "daily" ? "每日挑战 · 今日" + (st.done ? "已完成" : "未完成") : "自由模式") + " · 连胜 " + st.streak;
  }
  function finish(v) {
    if (finished) return; finished = true;
    var score = v.mode === "bet" ? v.you.bankroll : v.you.score;
    try { GameProgress.record({ slug: SLUG, mode: mode, score: score }); } catch (e) { /* storage optional */ }
    refreshStreak();
    var busted = /爆/.test(String(v.last || "")) || /爆/.test((v.log || []).slice(-2).join(" "));
    var stageEl = document.querySelector(".stage");
    if (busted && stageEl) {
      stageEl.classList.add("bust");
      setTimeout(function () { stageEl.classList.remove("bust"); }, 360);
      if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) { /* optional */ } }
    }
    sfx(v.winner === "you" ? "win" : (v.winner === "draw" ? "notify" : (busted ? "error" : "lose")));
  }
  function $(id) { return document.getElementById(id); }
  function scoreText(v, side) { return (v.mode === "bet" ? v[side].bankroll : v[side].score) + (v.mode === "bet" ? " 筹码" : " 分"); }
  function diceHtml(v) {
    if (!v.dice.length) return "<span class=\"hint\" style=\"color:var(--muted);font-size:13px\">骰子待命</span>";
    return v.dice.map(function (d) { return "<span class=\"die\">" + d + "</span>"; }).join("");
  }
  function statsHtml(v) {
    var out = [];
    if (v.mode === "push") {
      out.push("奖池 " + v.pot);
      out.push("本轮 " + v.rolls + "/" + v.maxRolls);
      out.push("爆点 " + v.bust);
    } else if (v.mode === "chain") {
      out.push("奖池 " + v.pot);
      out.push("倍率 x" + v.multiplier);
      out.push("本轮 " + v.rolls + "/" + v.maxRolls);
      out.push("目标 " + v.target);
    } else if (v.mode === "highlow") {
      out.push("当前 " + (v.current || "-"));
      out.push("奖池 " + v.pot);
      out.push("已猜 " + v.rolls + "/" + v.maxRolls);
    } else {
      out.push("固定注 " + v.stake);
      out.push("赔率 x" + v.payout);
      out.push("骰数 " + v.betDice);
    }
    return out.map(function (x) { return "<span class=\"chip\">" + x + "</span>"; }).join("");
  }
  function render() {
    var v = E.view(g);
    var stageEl = document.querySelector(".stage");
    if (stageEl) {
      var heat = (v.phase === "over") ? 1 : heatLevel(v);
      stageEl.classList.toggle("heat-2", heat === 2);
      stageEl.classList.toggle("heat-3", heat === 3);
    }
    $("youVal").textContent = scoreText(v, "you");
    $("aiVal").textContent = scoreText(v, "ai");
    $("roundVal").textContent = Math.min(v.round, v.maxRounds) + " / " + v.maxRounds;
    $("dice").innerHTML = diceHtml(v);
    $("potVal").textContent = v.mode === "bet" ? ("你的筹码 " + v.you.bankroll) : (v.pot + " 分");
    $("hint").textContent = v.phase === "over" ? "对局结束" : (v.turn === "you" ? "轮到你行动" : v.meta.aiName + " 正在行动…");
    $("stats").innerHTML = statsHtml(v);
    $("status").textContent = v.last;
    $("log").innerHTML = v.log.map(function (x) { return "<div>" + x + "</div>"; }).join("");
    var box = $("actions");
    if (v.phase === "over") {
      var tail = v.winner === "draw" ? "平局" : (v.winner === "you" ? "你赢了" : "对手赢了");
      finish(v);
      box.className = "actions single";
      box.innerHTML = "<div class=\"over\" style=\"grid-column:1/-1\"><h2>" + tail + "</h2><p>你 " + scoreText(v, "you") + " · " + v.meta.aiName + " " + scoreText(v, "ai") + "</p><button type=\"button\" class=\"primary\" id=\"again\">再来一局</button></div>";
      return;
    }
    if (v.turn !== "you") {
      box.className = "actions single";
      box.innerHTML = "<button type=\"button\" disabled>" + v.meta.aiName + " 行动中…</button>";
      return;
    }
    var cls = "actions" + (v.actions.length === 1 ? " single" : (v.actions.length === 2 ? " two" : ""));
    box.className = cls;
    box.innerHTML = v.actions.map(function (a) {
      var k = a.id === "roll" ? " primary" : (a.id === "bank" ? " bank" : "");
      return "<button type=\"button\" data-id=\"" + a.id + "\" class=\"" + k.trim() + "\">" + a.label + "</button>";
    }).join("");
  }
  function pump() {
    if (g.phase === "over") { busy = false; render(); return; }
    if (g.turn !== "ai") { busy = false; render(); return; }
    var r = E.autoMove(g);
    render();
    if (!r || !r.ok || g.phase === "over") { busy = false; render(); return; }
    if (g.turn === "ai") setTimeout(pump, 380);
    else { busy = false; render(); }
  }
  $("actions").addEventListener("click", function (ev) {
    if (ev.target && ev.target.id === "again") { reset(); return; }
    var b = ev.target && ev.target.closest ? ev.target.closest("button[data-id]") : null;
    if (!b || busy || g.phase === "over" || g.turn !== "you") return;
    busy = true;
    var acted = b.getAttribute("data-id");
    var r = E.act(g, acted);
    if (!r.ok) { busy = false; return; }
    sfx(acted === "roll" ? "dice" : "click");
    if (acted === "roll") {
      var diceEl = $("dice");
      if (diceEl) {
        diceEl.classList.remove("rolling");
        void diceEl.offsetWidth;
        diceEl.classList.add("rolling");
        setTimeout(function () { diceEl.classList.remove("rolling"); }, 520);
      }
    }
    render();
    setTimeout(pump, 240);
  });
  function reset(nextMode) {
    if (nextMode) mode = nextMode;
    finished = false;
    g = E.createGame({ seed: newSeed() });
    busy = false;
    render();
  }
  $("reset").addEventListener("click", function () { reset("free"); });
  $("daily").addEventListener("click", function () { reset("daily"); });
  (function firstRun() {
    var key = "gp.intro." + SLUG, seen = false;
    try { seen = localStorage.getItem(key) === "1"; } catch (e) { /* storage optional */ }
    if (!seen) {
      var box = $("intro");
      if (box) {
        box.hidden = false;
        var close = $("introClose");
        if (close) close.addEventListener("click", function () { box.hidden = true; try { localStorage.setItem(key, "1"); } catch (e) { /* ignore */ } });
      }
    }
  })();
  (function fullscreenToggle() {
    var b = $("fs");
    if (!b) return;
    if (!document.documentElement.requestFullscreen) { b.hidden = true; return; }
    b.addEventListener("click", function () {
      if (document.fullscreenElement) { document.exitFullscreen(); return; }
      document.documentElement.requestFullscreen().catch(function () { /* denied */ });
    });
  })();
  refreshStreak();
  render();
})();
</script>
</body>
