<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>勒阿弗尔 · 港都情浓 Le Havre（人机桌游）</title>
<meta name="description" content="勒阿弗尔 Le Havre 港都情浓中文单机桌游：19 世纪港口城市，供给、取货、使用建筑、建造、船只、贷款、收获与喂养。35 栋建筑、17 种货物、手机优先、离线可玩。">
<meta name="theme-color" content="#08141a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1c22'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23c69643'/%3E%3Cpath d='M9 18h14l-2 4h-10z' fill='%2354380f'/%3E%3Cpath d='M16 18V9l5 4h-5' fill='%23f3e2b4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#061116;--bg2:#081a20;--panel:#0e232a;--panel2:#143139;--panel3:#0a1b21;
  --ink:#f2e6ce;--sand:#e0c08a;--cream:#f6ecd8;--muted:#a9bcb8;--dim:#7e958f;
  --gold:#d8b061;--gold2:#f2d58f;--gold3:#8d6427;--brass:#b8863b;
  --copper:#b76a45;--sea:#235e66;--sea2:#143c44;--brick:#9a4b34;--wood:#8a5a2f;--stone:#8e8878;
  --human:#e3b96b;--ai:#6fb0a6;
  --line:rgba(216,176,97,.24);--line2:rgba(216,176,97,.12);
  --ok:#9ccf92;--warn:#f0b184;--bad:#e7978b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;max-width:100%;overflow-x:clip}
body{margin:0;min-height:100vh;max-width:100%;overflow-x:clip;color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1200px 720px at 82% -12%,rgba(208,150,60,.15),transparent 62%),
    radial-gradient(1000px 640px at -6% 8%,rgba(42,104,114,.20),transparent 60%),
    repeating-linear-gradient(180deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),
    linear-gradient(160deg,#08161c 0%,#050f14 56%,#040a0e 100%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 380px at 50% 112%,rgba(40,120,130,.20),transparent 70%),
    repeating-radial-gradient(circle at 50% 118%,transparent 0 22px,rgba(130,200,200,.028) 22px 23px),
    radial-gradient(120% 90% at 50% 0,transparent 55%,rgba(0,0,0,.4) 100%);
  opacity:.9}
h1,h2,h3,p,ul,ol,figure{margin:0}
button{font:inherit;color:inherit}
a{color:inherit}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.shell{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:0 10px 30px}
.gi{width:22px;height:22px;display:block;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.34))}
.ship-art{display:block;width:100%;height:100%}

/* ---------- header ---------- */
.site-head{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(7,19,24,.98),rgba(8,21,26,.93));backdrop-filter:blur(12px);
  box-shadow:0 8px 26px rgba(0,0,0,.3)}
.head-inner{max-width:1400px;margin:0 auto;padding:7px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:7px 12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 auto}
.brand-mark{width:36px;height:36px;flex:none;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 28%,#f7dfa2,#d2a24a 44%,#8b5f1e 78%,#54380f);
  box-shadow:0 2px 8px rgba(0,0,0,.45),inset 0 1px 2px rgba(255,255,255,.6),inset 0 -2px 4px rgba(80,45,8,.6);
  border:1px solid #5c3d12}
.brand-mark svg{position:absolute;inset:5px}
.brand-txt{min-width:0}
.brand h1{font-family:var(--serif);font-size:19px;line-height:1.05;letter-spacing:.05em;color:var(--cream);white-space:nowrap}
.brand p{font-size:12px;line-height:1.2;color:var(--muted);letter-spacing:.07em;white-space:nowrap;margin-top:1px}
.roundbox{display:flex;gap:5px;flex-wrap:wrap}
.rb{display:flex;align-items:baseline;gap:3px;min-height:44px;padding:3px 8px;border-radius:9px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.rb .k{font-size:12px;color:var(--muted);font-weight:600}
.rb b{font-family:var(--mono);font-size:18px;line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums}
.rb i{font-family:var(--mono);font-size:12px;font-style:normal;color:var(--dim)}
.rb.phase{background:linear-gradient(180deg,rgba(216,176,97,.14),rgba(216,176,97,.04));border-color:var(--line)}
.rb.phase b{font-family:var(--sans);font-size:13px;color:var(--cream)}
.head-btns{display:flex;gap:5px;flex:none}
.mini{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 10px;border-radius:9px;
  border:1px solid rgba(216,176,97,.30);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  color:var(--ink);font-size:12px;font-weight:650;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.mini:hover{background:rgba(216,176,97,.13);border-color:rgba(216,176,97,.5)}
.mini[aria-pressed="true"]{background:linear-gradient(180deg,rgba(216,176,97,.26),rgba(216,176,97,.10));border-color:var(--gold);color:var(--gold2)}
.mini:focus-visible,.btn:focus-visible,.offer:focus-visible,.bcard:focus-visible,.pcard:focus-visible,.ship-card:focus-visible,.opt:focus-visible,.pick:focus-visible,.qty:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

/* ---------- status ---------- */
.statusline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:34px;margin:6px 2px 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.turn-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--human);box-shadow:0 0 0 2px rgba(255,255,255,.10),0 0 10px rgba(227,185,107,.5)}
.turn-dot.ai{background:var(--ai);box-shadow:0 0 0 2px rgba(255,255,255,.10),0 0 10px rgba(111,176,166,.5)}
.turn-dot.wait{background:var(--dim);box-shadow:none}
#hint{flex:1 1 230px;min-width:0;color:var(--ink)}
#hint b{color:var(--gold2)}
#hint.warn{color:var(--warn)}
#hint.good{color:var(--ok)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.035);color:var(--muted);white-space:nowrap}
.chip.gold{border-color:var(--line);background:rgba(216,176,97,.10);color:var(--gold2)}
.chip.bad{border-color:rgba(231,151,139,.3);background:rgba(231,151,139,.09);color:#f0b8ae}

/* ---------- resource strip ---------- */
.res-strip{display:flex;gap:5px;overflow-x:auto;overscroll-behavior-x:contain;padding:6px 2px 7px;scrollbar-width:thin;scroll-snap-type:x proximity}
.res-strip::-webkit-scrollbar{height:4px}
.res-strip::-webkit-scrollbar-thumb{background:rgba(216,176,97,.28);border-radius:2px}
.res-tile{flex:0 0 54px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:62px;border-radius:9px;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.055),transparent 42%),linear-gradient(165deg,#193740,#0b2027);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -2px 5px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.2)}
.res-tile .gi{width:27px;height:27px}
.res-val{font:700 14px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.res-name{font-size:12px;line-height:1.1;color:var(--muted);white-space:nowrap}
.res-tile.zero{opacity:.52}
.res-tile.coin{background:linear-gradient(180deg,rgba(255,255,255,.09),transparent 42%),linear-gradient(165deg,#4a3718,#1c160b);border-color:rgba(216,176,97,.28)}
.res-tile.coin .res-val{color:var(--gold2)}
.res-tile.loan{background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 42%),linear-gradient(165deg,#3a2220,#180f0f);border-color:rgba(183,106,69,.28)}
.res-tile.loan .res-val{color:#f0b49a}
.res-div{flex:0 0 1px;align-self:stretch;background:linear-gradient(180deg,transparent,var(--line),transparent);margin:4px 2px}
.res-tile.flash{animation:resFlash .7s ease}
@keyframes resFlash{0%{box-shadow:0 0 0 2px rgba(242,213,143,.75),0 0 18px rgba(242,213,143,.55)}100%{}}

/* ---------- dock ---------- */
.dock{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:56px;margin:1px 0 8px;padding:7px 10px;border-radius:12px;
  border:1px solid var(--line);background:linear-gradient(180deg,rgba(216,176,97,.11),rgba(216,176,97,.025)),linear-gradient(180deg,rgba(20,49,57,.85),rgba(9,24,30,.9));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 18px rgba(0,0,0,.22)}
.dock-msg{flex:1 1 210px;min-width:0;font-size:13px;line-height:1.4;color:var(--muted)}
.dock-msg b{color:var(--cream)}
.dock-msg .sub{display:block;font-size:12px;color:var(--dim);margin-top:1px}
.dock-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:44px;padding:0 13px;border-radius:9px;cursor:pointer;
  border:1px solid rgba(216,176,97,.32);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  color:var(--ink);font-size:13px;font-weight:650;touch-action:manipulation;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn:hover{background:rgba(216,176,97,.14);border-color:rgba(216,176,97,.55)}
.btn.primary{background:linear-gradient(180deg,#f0d38d,#c69744 52%,#a4762c);border-color:#f4dda2;color:#2b1d07;
  box-shadow:0 4px 14px rgba(184,134,59,.30),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 3px rgba(90,55,10,.45);text-shadow:0 1px 0 rgba(255,255,255,.3)}
.btn.primary:hover{background:linear-gradient(180deg,#f8e2a8,#d2a34e 52%,#b0802f)}
.btn.danger{border-color:rgba(183,106,69,.42);background:rgba(120,52,36,.22);color:#f1c0ae}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;filter:saturate(.5)}
.btn.small{min-height:44px;padding:0 9px;font-size:12px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:10px;align-items:start}
.side{display:grid;gap:8px;min-width:0}
.panel{min-width:0;border-radius:13px;border:1px solid var(--line2);padding:8px 9px 9px;
  background:linear-gradient(165deg,rgba(21,49,57,.96),rgba(9,25,31,.97));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 34px rgba(0,0,0,.25)}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:0 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line2)}
.panel-head h2{font-family:var(--serif);font-size:15px;line-height:1.2;letter-spacing:.03em;color:var(--sand)}
.panel-head p{font-size:12px;line-height:1.25;color:var(--dim);text-align:right}
.panel-title{display:flex;align-items:baseline;gap:6px}
.panel-title span{font-family:var(--mono);font-size:12px;color:var(--dim)}

/* ---------- offers ---------- */
.offer-wrap{margin-bottom:7px;padding:7px 8px 8px;border-radius:11px;border:1px solid rgba(255,255,255,.06);
  background:linear-gradient(165deg,rgba(255,255,255,.028),rgba(0,0,0,.10))}
.offer-head{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);margin-bottom:4px;min-width:0}
.offer-head b{font-family:var(--serif);font-size:13px;color:var(--sand);letter-spacing:.03em;white-space:nowrap}
.offer-head .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.supply{margin-left:auto;display:flex;gap:3px;flex:none;align-items:center}
.supply i{width:15px;height:6px;border-radius:2px;background:rgba(255,255,255,.10);display:block}
.supply i.on{background:linear-gradient(90deg,#c89a4a,#f4dc9e);box-shadow:0 0 6px rgba(242,213,143,.35)}
.supply i.int{box-shadow:inset 0 0 0 1px rgba(226,169,94,.9)}
.offers{display:flex;gap:5px;overflow-x:auto;overscroll-behavior-x:contain;padding:1px 0 2px;scrollbar-width:none}
.offers::-webkit-scrollbar{display:none}
.offer{flex:1 0 46px;min-width:46px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:3px 2px;border-radius:9px;cursor:pointer;
  border:1px solid rgba(255,255,255,.09);background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 44%),linear-gradient(165deg,#18343d,#0b2027);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 5px rgba(0,0,0,.2);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.offer .gi{width:24px;height:24px}
.offer .cnt{font:700 12.5px/1 var(--mono);color:var(--gold2);font-variant-numeric:tabular-nums}
.offer .lbl{font-size:12px;line-height:1.1;color:var(--muted);margin-top:1px;white-space:nowrap}
.offer.can-take{border-color:rgba(230,195,119,.72);box-shadow:0 0 0 1px rgba(230,195,119,.22),0 0 16px rgba(216,176,97,.18)}
.offer.can-take .lbl{color:var(--gold2)}
.offer.empty{opacity:.4}
.offer:hover{border-color:rgba(216,176,97,.55)}

/* ---------- proposals ---------- */
.proposal-wrap{margin:0 0 8px}
.proposal-head{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);margin-bottom:4px}
.proposal-head b{font-family:var(--serif);font-size:13px;color:var(--sand)}
.proposal-head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proposal-rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pcard{position:relative;display:grid;grid-template-columns:38px minmax(0,1fr);align-items:center;gap:5px 7px;min-height:64px;padding:6px 7px;border-radius:10px;text-align:left;cursor:pointer;overflow:hidden;
  border:1px solid rgba(216,176,97,.28);background:linear-gradient(160deg,#2b2418,#151c1d 70%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 12px rgba(0,0,0,.22);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pcard .b-art{width:38px;height:38px}
.pcard b{display:flex;align-items:baseline;justify-content:space-between;gap:3px;font-family:var(--serif);font-size:12.5px;line-height:1.2;color:var(--sand);overflow:hidden}
.pcard b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard b em{flex:none;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--dim)}
.pcard small{display:block;font-size:12px;line-height:1.25;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pribbon{position:absolute;top:0;right:0;font-size:12px;line-height:1.5;padding:0 5px;color:#2b1d07;background:linear-gradient(180deg,#f0d38d,#b9873a);border-bottom-left-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pcard.can-build{border-color:rgba(156,207,146,.55);box-shadow:0 0 0 1px rgba(156,207,146,.14),0 0 14px rgba(156,207,146,.12)}
.pcard.can-buy{border-color:rgba(216,176,97,.55)}
.pcard:hover{border-color:var(--gold);transform:translateY(-1px)}
.pcard .pmeta{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.pempty{grid-column:1/-1;padding:12px;text-align:center;font-size:12px;color:var(--dim);border:1px dashed rgba(255,255,255,.12);border-radius:9px}

/* ---------- building grid ---------- */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:7px}
.bcard{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr);grid-auto-rows:min-content;gap:4px 7px;text-align:left;padding:7px 7px 8px 9px;border-radius:10px;cursor:pointer;overflow:hidden;isolation:isolate;min-height:110px;color:var(--ink);
  border:1px solid rgba(255,255,255,.085);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 3px 9px rgba(0,0,0,.22);
  transition:border-color .15s,transform .15s,box-shadow .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--catc);box-shadow:0 0 9px var(--catc);opacity:.9}
.bcard::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.055),transparent 32%);opacity:.7}
.bcard:hover{border-color:rgba(216,176,97,.5);transform:translateY(-1px);box-shadow:0 7px 18px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08)}
.bcard.cat-C{--catc:#c99a5a;background:repeating-linear-gradient(94deg,rgba(216,164,101,.045) 0 1px,transparent 1px 7px),linear-gradient(160deg,#20333a,#0d2027 62%,#0a171c)}
.bcard.cat-I{--catc:#c4705a;background:repeating-linear-gradient(0deg,rgba(196,112,90,.065) 0 2px,transparent 2px 7px),linear-gradient(160deg,#26343a,#0e2027 62%,#0a171c)}
.bcard.cat-E{--catc:#7fb4a8;background:repeating-linear-gradient(135deg,rgba(160,180,170,.045) 0 2px,transparent 2px 9px),linear-gradient(160deg,#22343a,#0d2027 62%,#0a171c)}
.bcard.cat-P{--catc:#d8c08a;background:linear-gradient(150deg,rgba(216,192,138,.09),transparent 52%),linear-gradient(160deg,#29363a,#0e2027 62%,#0a171c)}
.bcard.cat-N{--catc:#6f9aa8;background:repeating-linear-gradient(175deg,rgba(111,154,168,.06) 0 3px,transparent 3px 11px),linear-gradient(160deg,#16343d,#0a1c23 62%,#08151a)}
.b-art{width:46px;height:46px;border-radius:7px;overflow:hidden;flex:none;position:relative;z-index:1;
  border:1px solid rgba(255,255,255,.09);background:linear-gradient(160deg,#0b1d23,#071217);
  box-shadow:inset 0 0 9px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.35)}
.b-art svg{display:block;width:100%;height:100%}
.b-main{min-width:0;position:relative;z-index:1}
.b-name{display:flex;align-items:baseline;gap:4px;justify-content:space-between;min-width:0}
.b-name b{font-family:var(--serif);font-size:13px;line-height:1.2;font-weight:700;color:var(--sand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-name .v{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.b-sub{display:flex;flex-wrap:wrap;gap:2px 5px;font-size:12px;line-height:1.2;color:var(--dim);margin-top:1px}
.b-cost{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-height:15px;margin-top:2px;font-size:12px;color:var(--muted)}
.b-cost .cc{display:inline-flex;align-items:center;gap:1px;padding:0 3px;border-radius:4px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.05);line-height:1.35;white-space:nowrap}
.b-cost .cc .gi{width:13px;height:13px}
.b-cost .none{color:var(--dim)}
.b-text{grid-column:1/-1;font-size:12px;line-height:1.4;color:var(--muted);padding-top:3px;margin-top:1px;border-top:1px dashed rgba(255,255,255,.07);position:relative;z-index:1}
.b-tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px;position:relative;z-index:1}
.tag{display:inline-flex;align-items:center;gap:2px;font-size:12px;line-height:1.45;padding:0 5px;border-radius:999px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);color:var(--muted);white-space:nowrap}
.tag.usable{border-color:rgba(230,195,119,.6);background:rgba(216,176,97,.16);color:var(--gold2);box-shadow:0 0 8px rgba(216,176,97,.16)}
.tag.build{border-color:rgba(156,207,146,.42);background:rgba(102,160,94,.14);color:#b8dda9}
.tag.buy{border-color:rgba(216,176,97,.45);background:rgba(216,176,97,.12);color:var(--gold2)}
.tag.occ{border-color:rgba(196,112,90,.45);background:rgba(150,60,45,.16);color:#f0b0a0}
.tag.deck{opacity:.85;border-style:dashed}
.tag.owner{border-color:rgba(111,176,166,.4);background:rgba(70,130,122,.14);color:#a9d8d0}
.tag.poor{opacity:.65;border-style:dashed}
.b-worker{position:absolute;right:6px;bottom:5px;width:23px;height:23px;z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.b-worker svg{width:100%;height:100%}
.bcard.is-deck{opacity:.72;filter:saturate(.6)}
.bcard.is-deck:hover{opacity:.92;filter:saturate(.85)}
.bcard.is-occupied .b-art{filter:sepia(.4) brightness(.62) saturate(.8)}
.bcard.is-occupied .b-text{opacity:.75}
.bcard.is-usable{border-color:rgba(230,195,119,.58);box-shadow:0 0 0 1px rgba(230,195,119,.16),0 0 18px rgba(216,176,97,.13),inset 0 1px 0 rgba(255,255,255,.07)}
.bcard.can-build:not(.is-usable){border-color:rgba(156,207,146,.38)}
.bcard.can-buy{border-color:rgba(216,176,97,.38)}
.bcard.slot-active{animation:slotPulse 1.6s ease-in-out infinite}
@keyframes slotPulse{0%,100%{box-shadow:0 0 0 1px rgba(230,195,119,.18),0 0 12px rgba(216,176,97,.10)}50%{box-shadow:0 0 0 2px rgba(230,195,119,.42),0 0 22px rgba(216,176,97,.24)}}
.b-slot{position:absolute;right:6px;top:5px;font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.22);z-index:1}

/* ---------- side ---------- */
.pc-list{display:grid;gap:6px}
.pc{padding:7px 8px 8px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(165deg,#16323a,#0d2027);min-width:0;position:relative;overflow:hidden}
.pc.active{border-color:rgba(230,195,119,.58);box-shadow:0 0 0 1px rgba(230,195,119,.18),0 0 18px rgba(216,176,97,.10)}
.pc.ai.active{border-color:rgba(111,176,166,.58);box-shadow:0 0 0 1px rgba(111,176,166,.16),0 0 18px rgba(111,176,166,.10)}
.pc-head{display:flex;align-items:center;gap:6px;min-width:0}
.pc-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--human);box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.pc.ai .pc-dot{background:var(--ai)}
.pc-name{font-size:13px;font-weight:700;white-space:nowrap}
.pc-tag{font-size:12px;line-height:1.45;padding:0 5px;border-radius:999px;border:1px solid var(--line);background:rgba(216,176,97,.13);color:var(--gold2);white-space:nowrap}
.pc-tag.teal{border-color:rgba(111,176,166,.38);background:rgba(111,176,166,.12);color:#b2ded7}
.pc-score{margin-left:auto;font-family:var(--mono);font-size:17px;line-height:1;color:var(--gold2);white-space:nowrap}
.pc-score small{font-family:var(--sans);font-size:12px;color:var(--dim);margin-left:1px}
.pc-stats{display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:3px;font-size:12px;color:var(--muted)}
.pc-stats b{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:700}
.pc-res{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.pc-res .rr{display:inline-flex;align-items:center;gap:1px;font-size:12px;line-height:1.5;padding:0 4px 0 2px;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:var(--muted)}
.pc-res .gi{width:15px;height:15px}
.pc-res .rr b{font-family:var(--mono);font-size:12px;color:var(--cream)}
.pc-sub{font-size:12px;line-height:1.4;color:var(--dim);margin-top:3px;min-width:0;overflow-wrap:anywhere}
.pc-bldgs{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.pc-bldg{font-size:12px;line-height:1.4;padding:0 4px;border-radius:4px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.055);color:var(--muted);white-space:nowrap}

.ship-market{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.ship-card{position:relative;display:flex;flex-direction:column;gap:1px;min-height:78px;padding:5px 6px 6px;border-radius:9px;text-align:left;cursor:pointer;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);background:linear-gradient(160deg,#173842,#0a2028);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ship-card:hover{border-color:rgba(216,176,97,.5)}
.ship-card.can-buy{border-color:rgba(230,195,119,.55);box-shadow:0 0 0 1px rgba(230,195,119,.15),0 0 12px rgba(216,176,97,.1)}
.ship-card .ship-art{width:100%;height:34px}
.ship-name{display:flex;align-items:baseline;gap:4px;font-size:12px;font-weight:650;color:var(--sand)}
.ship-name em{font-family:var(--mono);font-size:12px;font-style:normal;color:var(--dim);margin-left:auto}
.ship-meta{font-size:12px;line-height:1.25;color:var(--muted)}
.ship-price{font-size:12px;line-height:1.25;color:var(--gold2)}
.my-ships{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.myship{display:flex;align-items:center;gap:4px;min-height:44px;padding:2px 6px 2px 3px;border-radius:7px;cursor:pointer;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);font-size:12px;color:var(--muted);touch-action:manipulation}
.myship:hover{border-color:rgba(216,176,97,.45)}
.myship .ship-art{width:40px;height:26px}
.myship b{font-family:var(--mono);font-size:12px;color:var(--cream)}
.myship small{display:block;font-size:12px;line-height:1.15;color:var(--dim)}
.loan-box{display:flex;align-items:center;gap:7px;margin-top:6px;padding:6px 7px;border-radius:9px;border:1px solid rgba(196,112,90,.24);background:linear-gradient(180deg,rgba(120,50,35,.15),rgba(60,24,18,.10));min-height:46px}
.loan-box .gi{width:27px;height:27px}
.loan-meta{min-width:0;flex:1}
.loan-meta b{display:block;font-size:12.5px;color:#f0c0ae}
.loan-meta span{display:block;font-size:12px;color:var(--dim);line-height:1.3}
.subhead{display:flex;align-items:center;gap:5px;margin:6px 0 3px;font-size:12px;color:var(--dim)}
.subhead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.log{max-height:236px;overflow:auto;overscroll-behavior:contain;padding-right:2px;scrollbar-width:thin}
.log::-webkit-scrollbar{width:4px}
.log::-webkit-scrollbar-thumb{background:rgba(216,176,97,.25);border-radius:2px}
.log-item{display:flex;gap:6px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.045);font-size:12px;line-height:1.4;color:var(--muted);min-width:0}
.log-item:last-child{border-bottom:0}
.log-r{flex:none;font-family:var(--mono);font-size:12px;color:var(--dim);min-width:25px}
.log-t{min-width:0}
.log-t b{color:var(--sand);font-weight:650}
.log-empty{font-size:12px;color:var(--dim);padding:8px 0;text-align:center}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:8px;background:rgba(2,8,11,.74);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.overlay.center{align-items:center}
.sheet{width:min(700px,100%);max-height:calc(100vh - 16px);display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
  border:1px solid rgba(216,176,97,.35);background:linear-gradient(180deg,rgba(26,54,62,.995),rgba(8,24,30,.995));
  box-shadow:0 26px 80px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.08)}
.sheet.narrow{width:min(560px,100%)}
.sheet-head{display:flex;align-items:flex-start;gap:8px;padding:11px 13px 9px;border-bottom:1px solid var(--line2);background:linear-gradient(180deg,rgba(216,176,97,.09),transparent)}
.sheet-head .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.sheet-head h2{font-family:var(--serif);font-size:19px;line-height:1.2;margin-top:1px;color:var(--cream)}
.sheet-head p{font-size:12px;line-height:1.35;color:var(--muted);margin-top:2px}
.icon-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 9px;border-radius:9px;cursor:pointer;
  border:1px solid rgba(216,176,97,.28);background:rgba(255,255,255,.04);color:var(--muted);font-size:12px}
.icon-btn:hover{color:var(--ink);border-color:var(--gold)}
.sheet-body{padding:10px 13px 14px;overflow:auto;overscroll-behavior:contain;min-height:0}
.sheet-foot{display:flex;gap:6px;padding:9px 13px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);background:rgba(5,17,22,.6);flex-wrap:wrap}
.sheet-foot .btn{flex:1 1 130px}
.sheet-hero{display:flex;gap:10px;align-items:stretch;margin-bottom:8px}
.hero-art{flex:0 0 132px;min-height:92px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:linear-gradient(160deg,#0b1d23,#071217);box-shadow:inset 0 0 16px rgba(0,0,0,.5)}
.hero-art svg{display:block;width:100%;height:100%}
.hero-art .gi{width:88px;height:88px}
.hero-stats{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.stat{padding:4px 6px;border-radius:7px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);min-width:0}
.stat span{display:block;font-size:12px;line-height:1.2;color:var(--dim)}
.stat b{display:block;font-size:12.5px;line-height:1.3;color:var(--ink);font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.effect-box{padding:7px 9px;border-radius:9px;border:1px solid rgba(216,176,97,.2);background:linear-gradient(180deg,rgba(216,176,97,.08),rgba(216,176,97,.02));font-size:12.5px;line-height:1.5;color:var(--cream);margin-bottom:8px}
.effect-box b{display:block;font-size:12px;color:var(--gold2);margin-bottom:1px}
.sheet-section{margin-top:9px}
.sheet-section h3{display:flex;align-items:baseline;gap:6px;font-size:12px;letter-spacing:.06em;color:var(--gold);font-weight:700;margin:0 0 4px;text-transform:uppercase}
.sheet-section h3 span{font-size:12px;letter-spacing:0;color:var(--dim);text-transform:none;font-weight:400}
.opt{display:flex;align-items:center;gap:8px;width:100%;min-height:46px;margin-bottom:4px;padding:6px 9px;border-radius:8px;cursor:pointer;text-align:left;
  border:1px solid rgba(255,255,255,.09);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.opt:hover{border-color:rgba(216,176,97,.55);background:rgba(216,176,97,.10)}
.opt-main{min-width:0;flex:1}
.opt-main b{display:block;font-size:12.5px;line-height:1.35;color:var(--ink);font-weight:650}
.opt-main small{display:block;font-size:12px;line-height:1.35;color:var(--dim)}
.opt-go{flex:none;font-size:12px;color:var(--gold2);border:1px solid rgba(216,176,97,.32);border-radius:6px;padding:3px 7px;background:rgba(216,176,97,.09);white-space:nowrap}
.opt.buy .opt-go{color:#b8dda9;border-color:rgba(156,207,146,.35);background:rgba(102,160,94,.12)}
.opt.sell .opt-go{color:#f0b0a0;border-color:rgba(196,112,90,.35);background:rgba(150,60,45,.12)}
.note{font-size:12px;line-height:1.5;color:var(--dim);padding:6px 8px;border-radius:7px;background:rgba(255,255,255,.025);border:1px dashed rgba(255,255,255,.09);margin-top:8px}
.goods-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:5px}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;padding:3px;border-radius:8px;cursor:pointer;
  border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);color:var(--muted);font-size:12px;touch-action:manipulation}
.pick .gi{width:24px;height:24px}
.pick.on{border-color:var(--gold);background:rgba(216,176,97,.16);color:var(--gold2);box-shadow:0 0 12px rgba(216,176,97,.14)}
.pick-foot{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.pick-foot span{font-size:12px;color:var(--muted)}
.pick-foot .btn{margin-left:auto}
.harvest-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:8px 0}
.hcard{padding:7px 8px;border-radius:9px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);min-width:0}
.hcard h4{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--sand);margin:0 0 3px}
.hcard .hdot{width:8px;height:8px;border-radius:50%;background:var(--human)}
.hcard.ai .hdot{background:var(--ai)}
.hcard ul{list-style:none;margin:0;padding:0;font-size:12px;line-height:1.5;color:var(--muted)}
.hcard li{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed rgba(255,255,255,.055);padding:1px 0}
.hcard li:last-child{border-bottom:0}
.hcard li b{color:var(--ink);font-family:var(--mono);font-size:12px}
.hcard .paid{color:var(--ok)}
.hcard .wait{color:var(--warn)}
.harvest-note{font-size:12px;color:var(--dim);line-height:1.5;margin-top:4px}
.medal-wrap{display:flex;justify-content:center;margin:-2px 0 2px}
.medal{width:min(190px,48vw);height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}

/* result */
.result-sheet{width:min(620px,100%);background:
  radial-gradient(600px 260px at 50% 0,rgba(255,255,255,.35),transparent 62%),
  linear-gradient(180deg,#f3e5c6,#e2cba2 62%,#d4b785);color:#2c2316;border:2px solid #b8863b;
  box-shadow:0 26px 80px rgba(0,0,0,.65),inset 0 0 0 2px rgba(255,248,224,.5),inset 0 0 60px rgba(120,80,30,.18)}
.result-sheet .sheet-head{border-bottom:1px solid rgba(90,60,20,.25);background:linear-gradient(180deg,rgba(255,255,255,.22),transparent)}
.result-sheet .eyebrow{color:#8a5d1c}
.result-sheet h2{color:#3a2a13;font-size:23px;text-align:center}
.result-sheet .sheet-head p{color:#6d5633;text-align:center}
.result-sheet .sheet-body{padding:4px 14px 12px}
.result-sheet .icon-btn{border-color:rgba(90,60,20,.3);background:rgba(255,255,255,.28);color:#5b431f}
.result-sheet .sheet-foot{border-top:1px solid rgba(90,60,20,.22);background:rgba(255,255,255,.14)}
.result-sheet .btn{background:linear-gradient(180deg,#fff6de,#ecd3a0);border-color:#a77a35;color:#3a2a13;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.result-sheet .btn.primary{background:linear-gradient(180deg,#f3d793,#c99a48);border-color:#8a5f1c;color:#2b1d07}
.score-table{width:100%;border-collapse:collapse;margin-top:3px;font-size:12px}
.score-table th,.score-table td{padding:5px 4px;text-align:right;border-bottom:1px solid rgba(90,60,20,.18);white-space:nowrap}
.score-table th{font-size:12px;color:#755c36;font-weight:600}
.score-table th:first-child,.score-table td:first-child{text-align:left;white-space:nowrap}
.score-table td b{font-family:var(--mono)}
.score-table tr.win td{background:rgba(255,244,206,.5)}
.score-table td.total{font-weight:700;color:#5b3b10;font-family:var(--mono);font-size:13px}
.result-note{font-size:12px;line-height:1.5;color:#6d5633;margin-top:8px;padding-top:6px;border-top:1px solid rgba(90,60,20,.16)}
.bonus-note{font-size:12px;line-height:1.5;color:#755c36;margin-top:4px}
.result-medal-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 4px}
.result-title{font-family:var(--serif);font-size:24px;line-height:1.1;color:#3a2a13;text-align:center}
.result-sub{font-size:12px;color:#755c36;text-align:center;margin-top:1px}

/* toasts */
.toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:min(92vw,540px)}
.toast{padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(10,29,36,.97);color:var(--cream);font-size:12.5px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.55);animation:toastIn .18s ease}
.toast.good{border-color:rgba(156,207,146,.35);color:#cbe9c2}
.toast.bad{border-color:rgba(231,151,139,.4);color:#f2c0b6}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.15s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

/* rules */
.rules h3{font-family:var(--serif);font-size:14px;color:var(--sand);margin:10px 0 3px}
.rules p,.rules li{font-size:12.5px;line-height:1.6;color:var(--muted)}
.rules ul{padding-left:17px;margin:2px 0}
.rules b{color:var(--cream)}
.rules .kbd{font-family:var(--mono);font-size:12px;color:var(--gold2);background:rgba(216,176,97,.1);border:1px solid var(--line2);border-radius:4px;padding:0 3px}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .side .panel:last-child{grid-column:1/-1}
  .log{max-height:190px}
}
@media (max-width:639px){
  .shell{padding:0 7px 26px}
  .head-inner{padding:6px 7px;gap:5px 7px}
  .brand{gap:7px}
  .brand-mark{width:32px;height:32px}
  .brand h1{font-size:17px}
  .brand p{font-size:12px}
  .head-btns{margin-left:auto}
  .mini{padding:0 8px;font-size:12px}
  .board-panel .panel-head p{display:none}
  .board-panel .panel-head{align-items:center}
  .panel-title{flex-wrap:nowrap;white-space:nowrap}
  .roundbox{order:4;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
  .rb{justify-content:center;min-height:40px;padding:2px 4px}
  .rb b{font-size:16px}
  .statusline{margin-top:4px;gap:5px}
  .res-tile{flex-basis:50px;min-height:59px}
  .res-tile .gi{width:25px;height:25px}
  .res-strip{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 93%,transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 93%,transparent 100%)}
  .dock{position:sticky;bottom:calc(6px + env(safe-area-inset-bottom));z-index:36;padding:6px 7px;gap:6px;
    background:linear-gradient(180deg,rgba(24,54,62,.97),rgba(8,24,30,.97));box-shadow:0 12px 32px rgba(0,0,0,.5);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .dock-msg{flex:1 1 150px;font-size:12.5px}
  .dock-msg .sub{font-size:12px}
  .dock-actions{margin-left:0;width:100%}
  .dock-actions .btn{flex:1 1 100px;padding:0 8px}
  .bgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .bcard{grid-template-columns:40px minmax(0,1fr);gap:3px 6px;padding:6px 6px 7px 8px;min-height:104px}
  .b-art{width:40px;height:40px}
  .b-name b{font-size:12.5px}
  .b-text{font-size:12px;line-height:1.35}
  .proposal-rail{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
  .pcard{grid-template-columns:1fr;gap:2px;padding:5px;min-height:62px}
  .pcard .b-art{width:100%;height:30px}
  .pcard .pmeta{display:none}
  .pcard small{font-size:12px}
  .side{grid-template-columns:minmax(0,1fr)}
  .side .panel:last-child{grid-column:auto}
  .sheet-hero{flex-direction:column;gap:6px}
  .hero-art{flex:0 0 auto;width:100%;max-width:240px;height:140px;margin:0 auto}
  .hero-art .gi{width:72px;height:72px}
  .harvest-grid{grid-template-columns:minmax(0,1fr)}
  .sheet-head h2{font-size:17px}
  .result-sheet .sheet-head h2{font-size:20px}
  .score-table th,.score-table td{padding:4px 2px;font-size:12px}
  .score-table td.total{font-size:12px}
  .log{max-height:170px}
}
@media (max-width:360px){
  .brand h1{font-size:16px}
  .brand p{display:none}
  .head-btns .mini{padding:0 6px}

  .tag{font-size:12px}
  .offer{flex-basis:44px;min-width:44px}

  .sheet-head{padding:9px 10px 8px}
  .sheet-foot{padding:8px 10px calc(9px + env(safe-area-inset-bottom))}

  .hero-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

<script type="module">
import {
  createGame, legalActions, applyAction, score, scorePlayer, currentPlayer,
  feedObligation, chooseGreedyAction, hashState,
  BUILDINGS, BUILDING_IDS, SHIP_TYPES, SHIP_TYPE_IDS, GOODS, GOOD_NAMES,
  OFFER_SPACES, STANDARD_GOODS, ROUND_FOOD_SCHEDULE, TURNS_PER_ROUND,
  SHIP_GOOD_VALUE, FOOD_VALUE
} from './engine.js';

/* ================================================================== */
/* 常量                                                                */
/* ================================================================== */

const HUMAN = 0;
const AI = 1;
const DEFAULT_SEED = 20261111;
const CAT_NAME = { C: '工匠', E: '经济', I: '工业', P: '公共', N: '非建筑' };
const GOOD_META = [
  { key: 'wood', name: '木材' }, { key: 'clay', name: '粘土' }, { key: 'iron', name: '铁' },
  { key: 'grain', name: '谷物' }, { key: 'fish', name: '鱼' }, { key: 'cattle', name: '牛' },
  { key: 'hide', name: '兽皮' }, { key: 'coal', name: '煤' }, { key: 'charcoal', name: '木炭' },
  { key: 'coke', name: '焦炭' }, { key: 'steel', name: '钢' }, { key: 'brick', name: '砖' },
  { key: 'leather', name: '皮革' }, { key: 'meat', name: '肉' }, { key: 'bread', name: '面包' },
  { key: 'smokedFish', name: '熏鱼' }, { key: 'flour', name: '面粉' }
];
const GOOD_KEYS = GOOD_META.map((g) => g.key);
const GOOD_SHORT = Object.fromEntries(GOOD_META.map((g) => [g.key, g.name]));
const SHIP_ORDER = ['wood', 'iron', 'steel', 'luxury'];
const ART = {
  constructionFirm: 'scaffold', buildingFirmA: 'scaffold', buildingFirmB: 'scaffold',
  marketplace: 'market', sawmill: 'sawmill', fishery: 'fishery', joinery: 'timber',
  bakehouse: 'bakery', hardwareStore: 'timber', charcoalKiln: 'kiln', smokehouse: 'barn',
  abattoir: 'barn', clayMound: 'mine', artsCenter: 'gallery', wharf: 'dock',
  blackMarket: 'market', brickworks: 'brick', localCourt: 'civic', colliery: 'mine',
  wharf2: 'dock', shippingLine: 'warehouse', groceryMarket: 'market', tannery: 'barn',
  businessOffice: 'exchange', ironworks: 'furnace', steelMill: 'furnace',
  storehouse: 'warehouse', cokery: 'kiln', dock: 'dock', bridge: 'bridge',
  townHall: 'townhall', bank: 'exchange', church: 'church', mill: 'windmill',
  blacksmith: 'forge'
};
const CAT_ART = { C: 'timber', E: 'exchange', I: 'brick', P: 'civic', N: 'dock' };
const BUILDING_ORDER = new Map(BUILDING_IDS.map((id, i) => [id, i]));

/* ================================================================== */
/* DOM / SVG 小工具                                                    */
/* ================================================================== */

const byId = (id) => document.getElementById(id);
const esc = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

function sym(id, cls, vb, w, h) {
  const viewBox = vb || '0 0 32 32';
  const width = w || 32;
  const height = h || 32;
  return '<svg class="' + (cls || 'gi') + '" viewBox="' + viewBox + '" aria-hidden="true" focusable="false">' +
    '<use href="#' + id + '" x="0" y="0" width="' + width + '" height="' + height + '"></use></svg>';
}
function goodIcon(key, cls) { return sym('g-' + key, cls || 'gi'); }
function workerIcon(cls) { return sym('g-worker', cls || 'b-worker', '0 0 32 32', 32, 32); }
function shipIcon(type, cls) { return sym('s-' + type, (cls || 'ship-art'), '0 0 64 40', 64, 40); }
function facade(id, cls) {
  const art = ART[id] || CAT_ART[(BUILDINGS[id] && BUILDINGS[id].category) || 'C'] || 'timber';
  return '<span class="' + (cls || 'b-art') + '">' + sym('f-' + art, 'facade-svg', '0 0 96 64', 96, 64) + '</span>';
}
function goodName(key) { return GOOD_NAMES[key] || GOOD_SHORT[key] || key; }
function offerName(space) { return space === 'francs' ? '法郎' : goodName(space); }
function shipName(type) { return SHIP_TYPES[type] ? SHIP_TYPES[type].name : type; }
function whoName(i) { return i === HUMAN ? '你' : (i === AI ? 'AI 港商' : '玩家' + (Number(i) + 1)); }
function money(n) { return n + '₣'; }
function plainCost(cost) {
  if (!cost) return '不可建造';
  const parts = [];
  for (const k of ['wood', 'clay', 'iron', 'brick', 'steel']) if (cost[k]) parts.push(cost[k] + GOOD_SHORT[k]);
  return parts.length ? parts.join(' ') : '免费';
}
function compactCost(cost) {
  if (!cost) return '不可建造';
  const short = { wood: '木', clay: '粘', iron: '铁', brick: '砖', steel: '钢' };
  const parts = [];
  for (const k of ['wood', 'clay', 'iron', 'brick', 'steel']) if (cost[k]) parts.push(cost[k] + short[k]);
  return parts.length ? parts.join(' ') : '免费';
}
function costHtml(cost) {
  if (!cost) return '<span class="none">不可建造</span>';
  const parts = [];
  for (const k of ['wood', 'clay', 'iron', 'brick', 'steel']) {
    if (!cost[k]) continue;
    parts.push('<span class="cc">' + goodIcon(k) + cost[k] + '</span>');
  }
  return parts.length ? parts.join('') : '<span class="none">免费</span>';
}
function gainsText(gains) {
  if (!gains) return '';
  const parts = [];
  for (const k of GOOD_KEYS) if (gains[k]) parts.push(goodName(k) + '×' + gains[k]);
  if (gains.francs) parts.push('法郎 +' + gains.francs);
  return parts.join('、');
}
function tokensText(tokens) {
  return (tokens || []).map((t) => (t.key === 'francs' ? '法郎' : goodName(t.key)) + '×' + t.n).join('、');
}
function buyCost(def) {
  if (!def) return 0;
  return def.buyCost === undefined || def.buyCost === null ? def.value : def.buyCost;
}
function roundFoodNow() {
  const arr = ROUND_FOOD_SCHEDULE[state.playerCount] || ROUND_FOOD_SCHEDULE[2];
  return arr[Math.min(state.round, arr.length) - 1] || 0;
}
function shipFoodOfPlayer(p) {
  return p.ships.reduce((sum, s) => sum + (SHIP_TYPES[s.type] ? SHIP_TYPES[s.type].food : 0), 0);
}
function marketShip(type) {
  const intro = state.shipMarket.introduced[type] || 0;
  const bought = state.shipMarket.purchased[type] || 0;
  if (bought >= intro) return null;
  return { type, value: SHIP_TYPES[type].values[bought] };
}
function locationOf(id) {
  const owner = state.owner[id];
  if (owner === -1) return 'town';
  if (owner !== undefined && owner >= 0) return 'owned';
  if (state.proposals.includes(id)) return 'proposal';
  return 'deck';
}
function locationLabel(id) {
  const loc = locationOf(id);
  const owner = state.owner[id];
  if (loc === 'town') return '城镇';
  if (loc === 'owned') return owner === HUMAN ? '你的' : 'AI 的';
  if (loc === 'proposal') return '提案区';
  return '未出现';
}
function isHumanTurn() {
  return !!state && state.phase === 'turn' && state.currentPlayer === HUMAN && !demoMode;
}
function isFeeding() { return !!state && state.phase === 'feeding'; }

/* ================================================================== */
/* 状态                                                                */
/* ================================================================== */

let state = null;
let seed = DEFAULT_SEED;
let legal = [];
let legalOffers = new Map();
let legalBuildings = new Map();
let legalBuildTargets = new Map();
let legalBuyBuilding = new Map();
let legalBuyShip = new Map();
let legalSellBuilding = new Map();
let legalSellShip = new Map();
let legalRepay = false;
let legalPass = null;
let aiTimer = 0;
let demoMode = false;
let sheetKind = null;
let sheetPayload = null;
let sheetActions = [];
let marketSize = 0;
let marketPick = new Set();
let toastTimer = 0;
let flashKeys = new Set();
let lastSupplyKey = '';
let lastRoundSeen = 1;

/* ================================================================== */
/* 合法动作索引                                                        */
/* ================================================================== */

function computeLegal() {
  legal = [];
  legalOffers = new Map();
  legalBuildings = new Map();
  legalBuildTargets = new Map();
  legalBuyBuilding = new Map();
  legalBuyShip = new Map();
  legalSellBuilding = new Map();
  legalSellShip = new Map();
  legalRepay = false;
  legalPass = null;
  if (!state || state.phase !== 'turn' || state.currentPlayer !== HUMAN || demoMode) return;
  legal = legalActions(state);
  for (const a of legal) {
    if (a.type === 'takeOffer') legalOffers.set(a.space, a);
    else if (a.type === 'useBuilding') {
      if (!legalBuildings.has(a.building)) legalBuildings.set(a.building, []);
      legalBuildings.get(a.building).push(a);
      const targets = a.params && a.params.targets;
      if (targets) {
        for (const t of targets) {
          if (!legalBuildTargets.has(t)) legalBuildTargets.set(t, []);
          legalBuildTargets.get(t).push(a);
        }
      }
    } else if (a.type === 'buyBuilding') legalBuyBuilding.set(a.building, a);
    else if (a.type === 'buyShip') legalBuyShip.set(a.shipType, a);
    else if (a.type === 'sellBuilding') legalSellBuilding.set(a.building, a);
    else if (a.type === 'sellShip') legalSellShip.set(a.index, a);
    else if (a.type === 'repayLoan') legalRepay = true;
    else if (a.type === 'pass') legalPass = a;
  }
}

/* ================================================================== */
/* 渲染                                                                */
/* ================================================================== */

function render() {
  if (!state) return;
  computeLegal();
  renderHeader();
  renderStatus();
  renderResources();
  renderDock();
  renderOffers();
  renderProposals();
  renderBoard();
  renderPlayers();
  renderShips();
  renderLog();
  flashKeys = new Set();
  announceHumanSupply();
}

function renderHeader() {
  byId('roundNum').textContent = String(state.round);
  byId('maxRound').textContent = String(state.maxRound);
  byId('turnNum').textContent = String(state.turnInRound);
  byId('phaseName').textContent = state.phase === 'feeding' ? '收获·喂养' : (state.phase === 'gameover' ? '终局' : '行动');
}

function renderStatus() {
  const hint = byId('hint');
  const dot = byId('turnDot');
  const chips = byId('statusChips');
  let text = '';
  let cls = '';
  if (state.phase === 'gameover') {
    const sc = score(state);
    const win = sc.winners.includes(HUMAN);
    text = sc.winners.length > 1 ? '对局结束：并列。' : (win ? '对局结束：你获胜。' : '对局结束：AI 港商获胜。');
    cls = 'good';
    dot.className = 'turn-dot wait';
  } else if (demoMode) {
    text = '托管演示中：双方按贪心策略自动对局。';
    dot.className = 'turn-dot wait pulse';
  } else if (state.phase === 'feeding') {
    const cur = currentPlayer(state);
    text = cur === HUMAN ? '收获与喂养：轮到你支付本轮食物。' : '收获与喂养：AI 港商正在结算。';
    cls = cur === HUMAN ? 'warn' : '';
    dot.className = 'turn-dot ' + (cur === HUMAN ? '' : 'ai pulse');
  } else if (state.currentPlayer === AI) {
    text = 'AI 港商正在安排工人与采购…';
    dot.className = 'turn-dot ai pulse';
  } else {
    const n = legalOffers.size + legalBuildings.size + legalBuildTargets.size;
    text = '你的主行动：点击 Offer 取货，或点击高亮建筑使用。';
    if (legalPass) text = '当前没有可执行的主行动，可以跳过。';
    dot.className = 'turn-dot';
    cls = legalPass ? 'warn' : '';
  }
  hint.textContent = text;
  hint.className = cls;

  const parts = [];
  parts.push('<span class="chip gold">先手 ' + whoName(state.firstPlayer) + '</span>');
  parts.push('<span class="chip gold">预估 ' + scorePlayer(state, HUMAN).total + ' 分</span>');
  if (state.phase !== 'gameover') {
    parts.push('<span class="chip">本轮需求 <b>' + (state.phase === 'feeding' ? roundFoodNow() : feedObligation(state, HUMAN) + '') + '</b></span>');
    if (shipFoodOfPlayer(state.players[HUMAN]) > 0) parts.push('<span class="chip">你的船只减免 ' + shipFoodOfPlayer(state.players[HUMAN]) + '</span>');
  }
  if (state.players[HUMAN].loans > 0) parts.push('<span class="chip bad">贷款 ' + state.players[HUMAN].loans + ' 笔 · −' + (state.players[HUMAN].loans * 7) + '₣</span>');
  parts.push('<span class="chip">供给 ' + Math.min(state.supplyIndex, TURNS_PER_ROUND) + '/7</span>');
  chips.innerHTML = parts.join('');
}

function renderResources() {

function renderDock() {
  const dock = byId('dock');
  let msg = '';
  let sub = '';
  let actions = '';
  if (state.phase === 'gameover') {
    msg = '<b>终局</b> · 第 ' + state.maxRound + ' 回合结束';
    sub = '查看最终财富榜与建筑附加价值。';
    actions = '<button class="btn primary" data-act="showResult" type="button">查看结算</button>';
  } else if (demoMode) {
    msg = '<b class="pulse">托管演示中</b> · 双方自动行动';
    sub = '演示会连续执行，终局后弹出结算。';
    actions = '<button class="btn" data-act="stopDemo" type="button">停止演示</button>';
  } else if (state.phase === 'feeding') {
    const cur = currentPlayer(state);
    msg = '<b>收获 · 喂养</b> · 第 ' + state.round + ' 回合';
    sub = '本轮需求 ' + roundFoodNow() + '；你的船只减免 ' + shipFoodOfPlayer(state.players[HUMAN]) + '。';
    actions = cur === HUMAN
      ? '<button class="btn primary" data-act="feed" type="button">支付食物 · 需求 ' + feedObligation(state, HUMAN) + '</button>'
      : '<button class="btn" type="button" disabled>AI 结算中…</button>';
  } else if (state.currentPlayer === AI) {
    msg = '<b>AI 港商行动中</b> · 正在选择 Offer / 建筑 / 附加行动';
    sub = '你可以先查看港口日志与建筑效果。';
    actions = '<button class="btn" type="button" disabled>等待 AI</button>';
  } else {
    const optCount = legalBuyBuilding.size + legalBuyShip.size + legalSellBuilding.size + legalSellShip.size + (legalRepay ? 1 : 0);
    msg = '<b>你的主行动</b> · 取 Offer 或使用建筑';
    sub = '附加行动不结束回合；使用建筑会放置工人并结束本回合。';
    actions = '<button class="btn" data-act="optional" type="button">附加行动' + (optCount ? ' · ' + optCount : '') + '</button>';
    if (legalPass) actions += '<button class="btn primary" data-act="pass" type="button">跳过主行动</button>';
  }
  dock.innerHTML = '<div class="dock-msg">' + msg + '<span class="sub">' + sub + '</span></div>' +

function renderOffers() {
  let html = '';
  for (const space of OFFER_SPACES) {
    const count = state.offers[space] || 0;
    const can = legalOffers.has(space);
    const icon = space === 'francs' ? 'francs' : space;
    html += '<button class="offer' + (can ? ' can-take' : '') + (count ? '' : ' empty') + '" type="button" data-offer="' + space + '" ' +
      'aria-label="' + esc(offerName(space) + ' Offer，' + count + ' 个' + (can ? '，可取走' : '')) + '">' +
      goodIcon(icon) + '<span class="cnt">' + count + '</span><span class="lbl">' + esc(offerName(space)) + '</span></button>';

  let pips = '';
  for (let i = 0; i < TURNS_PER_ROUND; i += 1) {

    const on = i < state.supplyIndex;

    pips += '<i class="' + (on ? 'on' : '') + (interest ? ' int' : '') + '" title="补给 ' + (i + 1) + (interest ? ' · 利息' : '') + '"></i>';

function renderProposals() {
  const host = byId('proposalRail');
  if (!state.proposals.length) {

      '<span class="pmeta">' + (canBuild ? '<span class="tag build">可建</span>' : '') +
      (canBuy ? '<span class="tag buy">可买 ' + buyCost(def) + '₣</span>' : '') + '</span></span>' +
      '<span class="pribbon">提案</span></button>';

function renderBoard() {
  const p = state.players[HUMAN];
  const ids = BUILDING_IDS.slice().sort((a, b) => {
    const sa = BUILDINGS[a] ? BUILDINGS[a].sort : 0;
    const sb = BUILDINGS[b] ? BUILDINGS[b].sort : 0;
    return sa - sb || (BUILDING_ORDER.get(a) || 0) - (BUILDING_ORDER.get(b) || 0);
  });
  byId('bgrid').innerHTML = ids.map((id, i) => {
    const def = BUILDINGS[id];
    if (!def) return '';
    const loc = locationOf(id);
    const owner = state.owner[id];
    const occupiedBy = state.occupancy[id];
    const occupied = occupiedBy !== undefined;
    const usable = legalBuildings.has(id);
    const buildable = legalBuildTargets.has(id);
    const buyable = legalBuyBuilding.has(id);
    const price = buyCost(def);
    const canEverBuy = !def.noBuy && (loc === 'proposal' || loc === 'town');
    const poor = canEverBuy && isHumanTurn() && !buyable && p.francs < price;
    const entry = def.entry || 0;
    const youOwn = owner === HUMAN;
    const tags = [];
    tags.push('<span class="tag ' + (loc === 'deck' ? 'deck' : (youOwn ? 'owner' : '')) + '">' + locationLabel(id) + '</span>');
    if (loc !== 'deck' && entry > 0 && !youOwn) tags.push('<span class="tag">门票 ' + entry + '₣</span>');
    if (youOwn) tags.push('<span class="tag owner">免门票</span>');
    if (occupied) tags.push('<span class="tag occ">已占用 · ' + whoName(occupiedBy) + '</span>');
    if (usable) tags.push('<span class="tag usable">可用</span>');
    if (buildable) tags.push('<span class="tag build">可建</span>');
    if (buyable) tags.push('<span class="tag buy">可买 ' + price + '₣</span>');
    else if (poor) tags.push('<span class="tag poor">需 ' + price + '₣</span>');
    else if (canEverBuy && !isHumanTurn() && !def.noBuy) tags.push('<span class="tag">价 ' + price + '₣</span>');
    const classes = 'bcard cat-' + def.category +
      (loc === 'deck' ? ' is-deck' : '') + (occupied ? ' is-occupied' : '') +
      (usable ? ' is-usable slot-active' : '') + (buildable ? ' can-build' : '') + (buyable ? ' can-buy' : '');
    const aria = [def.name, CAT_NAME[def.category], locationLabel(id), plainCost(def.cost),
      '价值' + def.value, entry ? '门票' + entry : '', occupied ? '已占用' : '', usable ? '可用' : '', buildable ? '可建造' : '', buyable ? '可购买' : '']
      .filter(Boolean).join('，');
    return '<button class="' + classes + '" type="button" data-building="' + id + '" aria-label="' + esc(aria) + '">' +
      '<span class="b-slot">' + String(i + 1).padStart(2, '0') + '</span>' +
      facade(id) +
      '<span class="b-main">' +
        '<span class="b-name"><b>' + esc(def.name) + '</b><span class="v">' + def.value + '₣</span></span>' +
        '<span class="b-sub"><span>' + CAT_NAME[def.category] + '</span><span>' + locationLabel(id) + '</span></span>' +
        '<span class="b-cost">' + costHtml(def.cost) + '</span>' +
      '</span>' +
      '<span class="b-text">' + esc(def.text) + '</span>' +
      '<span class="b-tags">' + tags.join('') + '</span>' +
      (occupied ? '<span class="b-worker" aria-hidden="true">' + workerIcon() + '</span>' : '') +
      '</button>';
  }).join('');
}

function renderShips() {
  const p = state.players[HUMAN];

  const market = SHIP_ORDER.map((type) => {
    const ship = marketShip(type);
    if (!ship) return '';
    const price = ship.value + 4;

    html += '<div class="my-ships">' + p.ships.map((s, idx) => {
      const def = SHIP_TYPES[s.type];

        shipIcon(s.type) +

    '<span>每笔扣 7 分；归还 5₣/笔。利息板块触发时每位负债玩家付 1₣。</span></div>' +
    (legalRepay ? '<button class="btn small" type="button" data-act="repay">归还 5₣</button>' : '') +
    '</div>';
  byId('shipPanel').innerHTML = html;
  byId('shipHead').textContent = '船市 · 你的 ' + p.ships.length + ' 艘 · 贷款 ' + p.loans + ' 笔';
}

function eventText(ev) {
  if (!ev) return '';
  const who = whoName(ev.player);
  switch (ev.kind) {
    case 'supply':
      return '第 ' + ev.round + ' 回合补给：' + esc(tokensText(ev.tokens)) + (ev.interest ? ' · 触发利息' : '');
    case 'take-offer':
      return '<b>' + who + '</b> 取走 Offer：' + esc(offerName(ev.space)) + ' ×' + ev.count;
    case 'build':
      return '<b>' + who + '</b> 建造 ' + esc(BUILDINGS[ev.building] ? BUILDINGS[ev.building].name : ev.building) +
        (ev.via ? '（经 ' + esc(BUILDINGS[ev.via] ? BUILDINGS[ev.via].name : ev.via) + '）' : '');
    case 'buy':
      return '<b>' + who + '</b> 购买 ' + esc(BUILDINGS[ev.building] ? BUILDINGS[ev.building].name : ev.building) + ' · ' + ev.cost + '₣';
    case 'buy-ship':
      return '<b>' + who + '</b> 购买 ' + esc(shipName(ev.type)) + '（价值 ' + ev.value + '）· ' + ev.price + '₣';
    case 'sell-ship':
      return '<b>' + who + '</b> 出售 ' + esc(shipName(ev.type)) + ' · +' + ev.proceeds + '₣';
    case 'sell-building':
      return '<b>' + who + '</b> 出售 ' + esc(BUILDINGS[ev.building] ? BUILDINGS[ev.building].name : ev.building) + ' · +' + ev.proceeds + '₣';
    case 'build-ship':
      return '<b>' + who + '</b> 建造 ' + esc(shipName(ev.type)) + '（价值 ' + ev.value + '）';
    case 'ship-arrival':
      return '新船入港：' + esc(shipName(ev.type)) + ' · 价值 ' + ev.value;
    case 'convert':
      if (ev.goods) return '<b>' + who + '</b> 转换 ' + esc(gainsText(ev.goods.reduce ? ev.goods.reduce((m, k) => { m[k] = (m[k] || 0) + 1; return m; }, {}) : ev.goods)) + ' → ' + esc(goodName(ev.to) || ev.to);
      return '<b>' + who + '</b> 转换 ' + esc(goodName(ev.from) || ev.from) + ' ×' + (ev.qty || 1) + ' → ' + esc(goodName(ev.to) || ev.to) +
        (ev.subsidy ? ' · +' + ev.subsidy + '₣' : '');
    case 'gain':
      return '<b>' + who + '</b> 获得 ' + esc(gainsText(ev.gains));
    case 'ship-goods':
      return '<b>' + who + '</b> 航运 ' + ev.ships + ' 艘船，装货 ' + esc(gainsText(ev.gains)) + ' · +' + ev.francs + '₣';
    case 'feed':
      return '<b>' + who + '</b> 支付食物：需求 ' + ev.required + (ev.loansTaken ? ' · 借入 ' + ev.loansTaken + ' 笔贷款' : '') +
        ' · 余额 ' + ev.francsAfter + '₣';
    case 'loan':
      return '<b>' + who + '</b> 借入贷款 ' + ev.loans + ' 笔' + (ev.total ? '（共 ' + ev.total + ' 笔）' : '') + (ev.reason === 'interest' ? ' · 用于付息' : ' · 喂养不足');
    case 'interest':
      return '<b>' + who + '</b> 支付利息 1₣';
    case 'harvest':
      return '<b>' + who + '</b> 收获：' + (ev.grain ? '谷物 +' + ev.grain : '') + (ev.grain && ev.cattle ? ' · ' : '') + (ev.cattle ? '牛 +' + ev.cattle : '');
    case 'feeding-start':
      return '第 ' + ev.round + ' 回合收获与喂养开始 · 需求 ' + ev.food;
    case 'town-build':
      return '城镇建造 ' + esc(BUILDINGS[ev.building] ? BUILDINGS[ev.building].name : ev.building);
    case 'modernise':
      return '<b>' + who + '</b> 船厂现代化（支付 1 砖）';
    case 'loans-returned':
      return '<b>' + who + '</b> 地方法院：贷款 ' + ev.before + ' → ' + ev.after;
    case 'repay-loan':
      return '<b>' + who + '</b> 归还贷款 · 余 ' + ev.loans + ' 笔';
    case 'pass':
      return '<b>' + who + '</b> 跳过主行动';
    case 'turn-end':
      return '<b>' + who + '</b> 结束行动（第 ' + ev.turn + '/7）';
    case 'gameover':
      return '第 ' + ev.round + ' 回合结束 · 对局终了';
    default:
      return esc(ev.kind || '');
  }
}

function clearToasts() {
  byId('toasts').innerHTML = '';
}
function toast(html, cls) {
  if (!html) return;
  const host = byId('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (cls ? ' ' + cls : '');
  el.innerHTML = html;
  host.appendChild(el);
  while (host.children.length > 3) host.removeChild(host.firstChild);
  clearTimeout(toastTimer);
  setTimeout(() => {
    el.style.transition = 'opacity .22s ease, transform .22s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateY(4px)';
    setTimeout(() => el.remove(), 240);
  }, 2500);
}

function snapshotPlayer(p) {
  const goods = {};
  for (const k of GOODS) goods[k] = p.goods[k] || 0;
  return { francs: p.francs, loans: p.loans, goods };
}
function diffFlash(before, after) {
  const set = new Set();
  if (before.francs !== after.francs) set.add('francs');
  if (before.loans !== after.loans) set.add('loans');
  for (const k of GOODS) if ((before.goods[k] || 0) !== (after.goods[k] || 0)) set.add(k);
  flashKeys = set;
}
function feeFor(id) {
  const def = BUILDINGS[id];
  if (!def) return 0;
  const owner = state.owner[id];
  if (owner === HUMAN) return 0;
  return def.entry || 0;
}
function buildCostFor(targetId, mode) {
  const def = BUILDINGS[targetId];
  if (!def || !def.cost) return null;
  const cost = Object.assign({}, def.cost);
  if (mode === 'constructSawmill' && cost.wood) cost.wood -= 1;
  return cost;
}
function describeActionToast(action) {
  if (!action) return '';
  switch (action.type) {
    case 'takeOffer': return '取走 ' + esc(offerName(action.space)) + ' ×' + state.offers[action.space];
    case 'useBuilding': {
      const def = BUILDINGS[action.building];
      return '使用 ' + esc(def ? def.name : action.building) + ' · ' + esc(describeUse(action));
    }
    case 'buyBuilding': return '购买 ' + esc(BUILDINGS[action.building] ? BUILDINGS[action.building].name : action.building);
    case 'buyShip': return '购买 ' + esc(shipName(action.shipType));
    case 'sellBuilding': return '出售 ' + esc(BUILDINGS[action.building] ? BUILDINGS[action.building].name : action.building);
    case 'sellShip': return '出售船只';
    case 'repayLoan': return '归还 1 笔贷款';
    case 'feed': return '支付本轮食物';
    case 'pass': return '跳过主行动';
    default: return '行动完成';
  }
}
function announceHumanSupply() {
  if (!state || demoMode || state.phase !== 'turn' || state.currentPlayer !== HUMAN) return;
  const ev = state.events.slice(-30).reverse().find((e) => e.kind === 'supply' && e.player === HUMAN);
  if (!ev) return;
  const key = ev.round + ':' + ev.turn;
  if (key === lastSupplyKey) return;
  lastSupplyKey = key;
  toast('补给 · ' + esc(tokensText(ev.tokens)) + (ev.interest ? ' · <b>利息板块</b>' : ''), 'good');
}

function commit(action, opts = {}) {
  if (!state || state.phase === 'gameover') return false;
  const prevPhase = state.phase;
  const actionText = describeActionToast(action);
  const beforeHuman = snapshotPlayer(state.players[HUMAN]);
  let next;
  try {
    next = applyAction(state, action);
  } catch (e) {
    toast('这个动作现在不可执行：' + esc(e.message), 'bad');
    return false;
  }
  state = next;
  diffFlash(beforeHuman, state.players[HUMAN]);
  if (!opts.silent) toast(actionText, 'good');
  closeSheet();

  if (state.phase === 'gameover') {
    hideHarvest();
    render();
    showResult();
    return true;
  }
  if (state.phase === 'feeding') {
    render();
    if (!demoMode) showHarvest();
    else hideHarvest();
  } else {
    hideHarvest();
    render();
    if (!opts.silent && prevPhase === 'feeding') toast('第 ' + state.round + ' 回合开始 · 先手 ' + whoName(state.firstPlayer), 'good');
  }
  if (!demoMode) scheduleAI();
  return true;
}

function scheduleAI() {
  clearTimeout(aiTimer);
  if (!state || demoMode || state.phase === 'gameover') return;
  const cur = currentPlayer(state);
  if (state.phase === 'feeding') {
    if (cur === AI) {
      aiTimer = setTimeout(() => {
        if (!state || demoMode || state.phase !== 'feeding' || currentPlayer(state) !== AI) return;
        const acts = legalActions(state);
        if (acts.length) commit(acts[0], { silent: true });
      }, 900);
    }
    return;
  }
  if (cur === AI) {
    aiTimer = setTimeout(() => {
      if (!state || demoMode || state.phase !== 'turn' || state.currentPlayer !== AI) return;
      const acts = legalActions(state);
      if (!acts.length) return;
      const action = chooseGreedyAction(state, acts) || acts[acts.length - 1];
      commit(action, { silent: true });
    }, 520);
  }
}

function updateDemoBtn() {
  const btn = byId('demoBtn');
  btn.setAttribute('aria-pressed', demoMode ? 'true' : 'false');
  btn.textContent = demoMode ? '停止演示' : '托管演示';
}

function startDemo() {
  if (state && state.phase === 'gameover') {
    newGame(((Number(seed) + 1) >>> 0) || DEFAULT_SEED, true);
  }
  demoMode = true;
  closeSheet();
  hideHarvest();
  updateDemoBtn();
  render();
  toast('托管演示开始：双方自动行动', 'good');
  clearTimeout(aiTimer);
  aiTimer = setTimeout(demoTick, 120);
}

function stopDemo() {
  demoMode = false;
  clearTimeout(aiTimer);
  updateDemoBtn();
  render();
  if (state && state.phase === 'feeding') showHarvest();
  scheduleAI();
}

function demoTick() {
  if (!demoMode) return;
  if (!state || state.phase === 'gameover') {
    demoMode = false;
    updateDemoBtn();
    render();
    if (state) showResult();
    return;
  }
  let action = null;
  if (state.phase === 'feeding') {
    const acts = legalActions(state);
    action = acts[0] || null;
  } else {
    const acts = legalActions(state);
    action = chooseGreedyAction(state, acts) || acts[acts.length - 1] || null;
  }
  if (!action) {
    demoMode = false;
    updateDemoBtn();
    render();
    return;
  }
  commit(action, { silent: true });
  if (demoMode) aiTimer = setTimeout(demoTick, 72);
}

function doFeed() {
  if (!state || state.phase !== 'feeding') return;
  if (currentPlayer(state) !== HUMAN) {
    toast('AI 港商正在结算，请稍候。', 'bad');
    return;
  }
  commit({ type: 'feed', player: HUMAN });
}

    case 'marketplace': return '集市取货：' + (p.goods || []).map(goodName).join('、');
    case 'fishery': return '渔场产鱼';
    case 'hardware': return '五金店取货';
    case 'grocery': return '杂货市场取货';
    case 'colliery': return '煤矿取煤';
    case 'clayMound': return '粘土坑取粘土';
    case 'artsCenter': return '艺术中心收租';
    case 'blackMarket': return '黑市扫空 Offer';
    case 'church': return '教堂换取面包与鱼';
    case 'ironworks': return p.extra ? '铁厂额外产铁（共 4 铁）' : '铁厂产铁（3 铁）';
    case 'charcoalKiln': return '烧炭 ' + p.qty + ' 木材 → 木炭';
    case 'mill': return '磨粉 ' + p.qty + ' 谷物 → 面粉';
    case 'brickworks': return '烧砖 ' + p.qty + ' 粘土 → 砖';
    case 'smokehouse': return '熏鱼 ' + p.qty + ' 条';
    case 'bakehouse': return (p.source === 'flour' ? '面粉' : '谷物') + ' ×' + p.qty + ' → 面包';
    case 'abattoir': return '屠宰 ' + p.qty + ' 头牛 → 肉';
    case 'tannery': return '制革 ' + p.qty + ' 张兽皮 → 皮革';
    case 'cokery': return '炼焦 ' + p.qty + ' 煤 → 焦炭';
    case 'steelMill': return '炼钢 ' + p.qty + ' 铁 → 钢';
    case 'blacksmith': return '锻造 ' + p.qty + ' 铁 → 钢';
    case 'joinery': return '木工 ' + p.qty + ' 木材 → 法郎';
    case 'business': return p.mode === 'steel' ? '交易所：4 货物 → 钢' : '交易所：1 货物 → ' + goodName(p.good);

  }
}

function useDetail(action) {
  const def = BUILDINGS[action.building];
  if (!def) return '';
  const p = action.params || {};
  const fee = feeFor(action.building);
  const feeTxt = fee > 0 ? '门票 ' + fee + '₣ · ' : '';
  switch (def.action) {
    case 'construct1':
    case 'construct2':
    case 'constructSawmill': {
      const parts = (p.targets || []).map((id) => {
        const cost = buildCostFor(id, def.action);
        return (BUILDINGS[id] ? BUILDINGS[id].name : id) + '（' + plainCost(cost) + '）';
      });
      return feeTxt + parts.join(' + ') + (def.action === 'constructSawmill' ? ' · 锯木厂少付 1 木材' : '') + ' · 经 ' + def.name;
    }
    case 'marketplace':
      return feeTxt + '需选 ' + (p.goods || []).length + ' 种不同标准货物 · 每栋自有工匠建筑 +1 种';
    case 'brickworks': return feeTxt + '能量 ' + Math.ceil(p.qty / 2) + ' · 补助 ' + Math.floor(p.qty / 2) + '₣';
    case 'smokehouse': return feeTxt + '能量 1 · 补助 ' + Math.floor(p.qty / 2) + '₣';
    case 'bakehouse': return feeTxt + '能量 ' + Math.ceil(p.qty / 2) + ' · 得面包 ' + (p.source === 'flour' ? p.qty * 2 : p.qty) + ' 个';
    case 'abattoir': return feeTxt + '得肉 ' + p.qty + ' · 兽皮 +' + Math.floor(p.qty / 2);
    case 'tannery': return feeTxt + '补助 ' + p.qty + '₣';
    case 'cokery': return feeTxt + '补助 ' + p.qty + '₣';
    case 'steelMill': return feeTxt + '能量 ' + (p.qty * 5);
    case 'blacksmith': return feeTxt + '能量 ' + (p.qty * 6);
    case 'joinery': return feeTxt + '得 ' + (4 + p.qty) + '₣';
    case 'shipping': {
      const caps = state.players[HUMAN].ships
        .filter((s) => SHIP_TYPES[s.type].capacity > 0)
        .slice(0, p.ships)
        .reduce((sum, s) => sum + SHIP_TYPES[s.type].capacity, 0);
      return feeTxt + '每艘 3 能量 · 容量 ' + caps + ' · 按货物价值自动装货';
    }
    case 'wharf':
      return feeTxt + '材料 ' + plainCost(SHIP_TYPES[p.shipType].cost) + ' + 3 能量' +
        (p.shipType !== 'wood' && !state.wharfModernized[action.building] ? ' · 首艘非木船需 1 砖现代化' : '');
    case 'business':
      return feeTxt + (p.mode === 'steel' ? '自动选价值最低的 4 个货物' : '自动选价值最低的 1 个货物');
    case 'bridge': return feeTxt + '升级货物 1₣/个 · 标准货物 3 个 1₣';
    case 'localCourt': return feeTxt + '免费归还；恰好 2 笔时再得 2₣';
    case 'church': return feeTxt + '需 5 面包 + 2 鱼 · 净得 +3 面包 +1 鱼';
    case 'ironworks': return feeTxt + (p.extra ? '额外支付 6 能量' : '无需额外能量');
    default: return feeTxt + def.text;
  }
}

    return;
  }
  const list = legal.filter((a) => ['buyBuilding', 'buyShip', 'repayLoan', 'sellBuilding', 'sellShip'].includes(a.type));
  sheetKind = 'optional';
  sheetPayload = null;
  sheetActions = [];
  let body = '';
  if (!list.length) {
    body = noteBox('当前没有可执行的附加行动。现金不足，或没有可买 / 可卖的对象。');
  } else {
    body += '<div class="effect-box"><b>附加行动</b>不消耗主行动，也不结束回合。可以在主行动之前连续执行多次；执行后仍由你继续行动。</div>';
    const sections = [
      ['buyBuilding', '购买建筑', '城镇或提案区建筑，立即归你所有'],
      ['buyShip', '购买船只', '不需要船厂，立即加入船队'],
      ['repayLoan', '归还贷款', '每笔 5 法郎'],
      ['sellBuilding', '出售建筑', '半价，建筑回到城镇'],
      ['sellShip', '出售船只', '半价，该类型船卡回池']
    ];
    for (const [type, title, sub] of sections) {
      const acts = list.filter((a) => a.type === type);
      if (!acts.length) continue;
      body += '<div class="sheet-section"><h3>' + title + ' <span>' + sub + '</span></h3>';
      for (const a of acts) {
        sheetActions.push(a);
        let label = title;
        let detail = '';
        let cls = '';
        if (type === 'buyBuilding') {
          const def = BUILDINGS[a.building];
          label = '购买 ' + def.name;
          detail = buyCost(def) + ' 法郎 · ' + CAT_NAME[def.category] + ' · 价值 ' + def.value + '₣';
          cls = 'buy';
        } else if (type === 'buyShip') {
          const ship = marketShip(a.shipType);
          const def = SHIP_TYPES[a.shipType];
          label = '购买 ' + def.name;
          detail = (ship ? ship.value + 4 : '?') + ' 法郎 · 价值 ' + (ship ? ship.value : '?') + '₣ · 减免 ' + def.food;
          cls = 'buy';
        } else if (type === 'repayLoan') {
          label = '归还 1 笔贷款';
          detail = '支付 5 法郎 · 当前 ' + state.players[HUMAN].loans + ' 笔';
        } else if (type === 'sellBuilding') {
          const def = BUILDINGS[a.building];
          label = '出售 ' + def.name;
          detail = '得 ' + Math.floor(def.value / 2) + ' 法郎 · 建筑回到城镇';
          cls = 'sell';
        } else if (type === 'sellShip') {
          const ship = state.players[HUMAN].ships[a.index];
          const def = SHIP_TYPES[ship.type];
          label = '出售 ' + def.name + '（' + ship.value + '₣）';
          detail = '得 ' + Math.floor(ship.value / 2) + ' 法郎 · 失去喂养减免 ' + def.food;
          cls = 'sell';
        }
        body += optionButton(sheetActions.length - 1, esc(label), esc(detail), '执行', cls);
      }
      body += '</div>';
    }
  }
  showSheet('附加行动', '主行动前的买卖', '购买 / 出售 / 归还贷款 · 不结束回合', body);
}

function openRulesSheet() {
  const body = '<div class="rules">' +
    '<h3>一回合的结构</h3>' +
    '<p>每回合 7 个玩家行动。轮到你时自动进行<b>供给</b>：把船标记推进到下一块补给板，板上两个 token 进入 Offer 空间；若该板印有利息，所有负债玩家立即付 1 法郎。</p>' +
    '<p>随后必须选择一个<b>主行动</b>：<b>取走某个 Offer 空间的全部 token</b>，或<b>把工人放到一栋未占用建筑上</b>并执行效果。使用建筑要付门票：城镇建筑付给城镇，别人的建筑付给该玩家，自己的建筑免费。工人会留到下次主行动前。</p>' +
    '<p><b>附加行动</b>不消耗主行动：购买建筑 / 船只、出售建筑 / 船只（半价）、归还贷款（5 法郎/笔）。本作只允许在主行动前执行附加行动。</p>' +
    '<h3>建造与购买</h3>' +
    '<p>只能建造<b>提案区</b>顶部建筑，支付卡面材料。建造公司可连续建 2 栋；建筑公司 A / B 各建 1 栋。锯木厂让含木材的建造少付 1 木材。建造后建筑归你，提案区补牌。</p>' +
    '<p>购买是附加行动，可买提案区或城镇建筑，价格通常等于卡面价值（少数建筑另标）。教堂不可购买；粘土坑、黑市不可建造。砖可代替粘土，钢可代替铁。</p>' +
    '<h3>回合结束 · 收获与喂养</h3>' +
    '<p>第 7 个主行动后收获：有 ≥1 谷物 +1 谷物；有 ≥2 牛 +1 牛。随后按先手顺序喂养：支付本轮食物需求（船只减免后），先吃鱼 → 面包 → 熏鱼 → 肉，再付法郎（1:1），仍不足则强制贷款（每笔 +4 法郎）。多付食物不找零。</p>' +
    '<p>城镇每回合结束会建造一张提案，并翻开一张新船卡。新的一回合由新的先手开始。</p>' +
    '<h3>船只与贷款</h3>' +
    '<p>船只每回合减少喂养需求（木 2 / 铁 3 / 钢 4 / 豪华 5），终局按价值计分。船厂建造需材料 + 3 能量；首艘非木船需 1 砖现代化，两座船厂分别记录。船市可直接购买（价值 +4）。</p>' +
    '<p>贷款每笔终局 −7 法郎。利息板触发时每位负债玩家付 1 法郎；付不出时先借一笔再付。</p>' +
    '<h3>终局计分</h3>' +
    '<p>总分 = 现金 + 自有建筑卡面价值 + 自有船只价值 + 建筑附加价值 − 7 × 未归还贷款。货物本身不计分；仓库 / 码头 / 市政厅 / 银行提供附加价值。平局并列获胜。</p>' +
    '<p class="note" style="margin-top:8px">本页面是引擎一期规则的界面层。二期未实现特殊建筑、终局额外行动等条目，详见同目录 rules.md。</p>' +
    '</div>';
  showSheet('规则', '勒阿弗尔 · 港都情浓', '乌玫瑰山 2008 · 2 人标准局 · 14 回合', body);
}

/* ================================================================== */
/* 集市选货                                                            */
/* ================================================================== */

function togglePick(key) {
  if (!marketSize) return;
  if (marketPick.has(key)) marketPick.delete(key);
  else {
    if (marketPick.size >= marketSize) {
      toast('最多选择 ' + marketSize + ' 种货物。', 'bad');
      return;
    }
    marketPick.add(key);
  }
  document.querySelectorAll('#marketPicker [data-pick]').forEach((el) => {
    const on = marketPick.has(el.dataset.pick);
    el.classList.toggle('on', on);
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const count = byId('marketCount');
  if (count) count.textContent = '已选 ' + marketPick.size + '/' + marketSize;
  const btn = byId('marketConfirm');
  if (btn) btn.disabled = marketPick.size !== marketSize;
}
function confirmMarket() {
  if (!marketSize || marketPick.size !== marketSize) return;
  const goods = STANDARD_GOODS.filter((k) => marketPick.has(k));
  commit({ type: 'useBuilding', building: 'marketplace', params: { goods } });
}

/* ================================================================== */
/* 收获与终局                                                          */
/* ================================================================== */

function showHarvest() {
  if (!state || state.phase !== 'feeding') {
    byId('harvestOverlay').hidden = true;
    return;
  }
  byId('harvestOverlay').hidden = false;
  renderHarvest();
}
function hideHarvest() { byId('harvestOverlay').hidden = true; }

function renderHarvest() {
  if (!state || state.phase !== 'feeding') { hideHarvest(); return; }
  const food = roundFoodNow();
  byId('harvestTitle').textContent = '第 ' + state.round + ' 回合 · 收获与喂养';
  byId('harvestSub').textContent = '本轮需求 ' + food + ' · 先收获，再按先手顺序支付食物';
  const harvests = state.events.filter((e) => e.kind === 'harvest' && e.round === state.round);
  const fed = new Set(state.events.filter((e) => e.kind === 'feed' && e.round === state.round).map((e) => e.player));
  const cur = currentPlayer(state);
  const cards = state.players.map((p, i) => {
    const need = feedObligation(state, i);
    let foodValue = 0;
    for (const k of GOOD_KEYS) foodValue += (p.goods[k] || 0) * (FOOD_VALUE[k] || 0);
    const hv = harvests.find((e) => e.player === i);
    const isFed = fed.has(i);
    return '<div class="hcard' + (i === AI ? ' ai' : '') + '"><h4><span class="hdot"></span>' + whoName(i) +
      (cur === i ? ' · <span class="wait">正在支付</span>' : '') + (isFed ? ' · <span class="paid">已支付</span>' : '') + '</h4><ul>' +
      '<li><span>回合需求</span><b>' + food + '</b></li>' +
      '<li><span>船只减免</span><b>' + shipFoodOfPlayer(p) + '</b></li>' +
      '<li><span>实际需求</span><b>' + need + '</b></li>' +
      '<li><span>食物 token 价值</span><b>' + foodValue + '</b></li>' +
      '<li><span>现金 / 贷款</span><b>' + p.francs + '₣ / ' + p.loans + '</b></li>' +
      '<li><span>收获</span><b>' + (hv ? ([hv.grain ? '谷 +' + hv.grain : '', hv.cattle ? '牛 +' + hv.cattle : ''].filter(Boolean).join(' · ') || '无') : '无') + '</b></li>' +
      '</ul></div>';
  }).join('');
  byId('harvestBody').innerHTML = '<div class="harvest-grid">' + cards + '</div>' +
    '<div class="harvest-note">支付顺序：鱼 → 面包 → 熏鱼 → 肉 → 法郎（1:1）→ 强制贷款。多付的食物不找零；船只减免在需求之前扣除。</div>';
  const btn = byId('feedBtn');
  if (cur === HUMAN) {
    btn.disabled = false;
    btn.textContent = '支付食物 · 需求 ' + feedObligation(state, HUMAN);
  } else {
    btn.disabled = true;
    btn.textContent = 'AI 港商结算中…';
  }
}

  return '<svg class="medal" viewBox="0 0 200 240" aria-hidden="true">' +
    '<path d="M72 104 44 224l36-20 20 20-14-120z" fill="url(#lgRibbon)" stroke="#5d1a15" stroke-width="2"/>' +
    '<path d="M128 104l28 120-36-20-20 20 14-120z" fill="#2f4d6b" stroke="#1c3148" stroke-width="2"/>' +

    '<circle cx="100" cy="94" r="72" fill="' + (silver ? 'url(#rgSilver)' : 'url(#rgMedal)') + '" stroke="#6d4a10" stroke-width="3"/>' +
    '<circle cx="100" cy="94" r="63" fill="none" stroke="#7a5416" stroke-width="1.4" stroke-dasharray="3 3" opacity=".66"/>' +
    '<circle cx="100" cy="94" r="58" fill="none" stroke="#fff4cf" stroke-width="1" opacity=".55"/>' +

    '<g fill="url(#lgGold)" stroke="#6d4a12" stroke-width=".6" opacity=".9">' +
    '<path d="M45 118c-6-3-9-8-8-14 5 1 9 4 11 9z"/><path d="M41 130c-6-3-10-7-10-13 5 0 9 3 12 8z"/>' +
    '<path d="M155 118c6-3 9-8 8-14-5 1-9 4-11 9z"/><path d="M159 130c6-3 10-7 10-13-5 0-9 3-12 8z"/></g>' +

    '<path d="M0 30h62l-6 12H8z"/>' +
    '<path d="M30 30V2" stroke="#7a5416" stroke-width="3"/>' +
    '<path d="M32 5 52 26H32z" fill="#9b6c1f"/>' +
