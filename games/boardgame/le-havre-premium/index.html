    '<text x="100" y="145" text-anchor="middle" font-family="Georgia,serif" font-size="11.5" letter-spacing="2.6" fill="#6b4a12">LE HAVRE</text>' +
    '<text x="100" y="157" text-anchor="middle" font-family="Songti SC,serif" font-size="9.5" letter-spacing="2" fill="#7a5416">港 都 情 浓</text>' +
    '</svg>';
}

function showResult() {
  if (!state) return;
  clearToasts();
  const sc = score(state);
  const humanWin = sc.winners.includes(HUMAN);
  const draw = sc.winners.length > 1;
  byId('resultTitle').textContent = draw ? '并列获胜' : (humanWin ? '你赢了' : 'AI 港商获胜');
  byId('resultSub').textContent = '第 ' + state.maxRound + ' 回合 · 最高财富 ' + sc.best + '₣ · 种子 ' + state.seed;
  const rows = sc.players.map((p) => {
    const win = sc.winners.includes(p.index);
    return '<tr class="' + (win ? 'win' : '') + '"><td><b>' + whoName(p.index) + '</b>' + (win ? ' · 胜' : '') + '</td>' +
      '<td>' + p.cash + '</td><td>' + p.buildings + '</td><td>' + p.ships + '</td><td>' + p.bonuses + '</td>' +
      '<td>' + (p.loansPenalty ? '−' + p.loansPenalty : '0') + '</td><td class="total">' + p.total + '₣</td></tr>';
  }).join('');
  const bonusRows = sc.players.map((p) => {
    const parts = Object.entries(p.bonusDetail || {}).map(([k, v]) => {
      const name = { bank: '银行', townHall: '市政厅', dock: '码头', storehouse: '仓库' }[k] || k;
      return name + ' +' + v;
    });
    return parts.length ? '<div class="bonus-note"><b>' + whoName(p.index) + '</b> 附加价值：' + parts.join(' · ') + '</div>' : '';
  }).join('');
  byId('resultBody').innerHTML =
    '<div class="medal-wrap">' + medalSvg(!humanWin) + '</div>' +
    '<table class="score-table" role="table" aria-label="终局计分"><thead><tr><th>玩家</th><th>现金</th><th>建筑</th><th>船只</th><th>附加</th><th>贷款</th><th>总分</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    bonusRows +
    '<div class="result-note">剩余货物本身不计分；仓库每 2 个货物 +1，码头每艘船 +4，市政厅按公共 / 工匠建筑加成，银行按工业 / 经济建筑加成。每笔未归还贷款 −7 法郎。</div>' +
    '<div class="result-note" style="border-top:0;margin-top:2px;opacity:.75">对局校验 ' + hashState(state) + ' · 平局时所有最高分玩家并列获胜。</div>';
  byId('resultOverlay').hidden = false;
}

function newGame(nextSeed, quiet) {
  clearTimeout(aiTimer);
  demoMode = false;
  updateDemoBtn();
  const n = Number(nextSeed);
  if (Number.isFinite(n) && n > 0) seed = n >>> 0;
  state = createGame({ seed: seed, playerCount: 2 });
  sheetKind = null;
  sheetPayload = null;
  sheetActions = [];
  marketPick = new Set();
  marketSize = 0;
  closeSheet();
  hideHarvest();
  byId('resultOverlay').hidden = true;
  lastSupplyKey = '';
  lastRoundSeen = 1;
  render();
  if (!quiet) toast('新局开始 · 种子 ' + seed, 'good');
  scheduleAI();
}

/* ================================================================== */
/* 事件委托                                                            */
/* ================================================================== */

function onActionClick(kind) {
  switch (kind) {
    case 'optional': openOptionalSheet(); break;
    case 'pass': if (legalPass) commit(legalPass); break;
    case 'repay': commit({ type: 'repayLoan' }); break;
    case 'feed': doFeed(); break;
    case 'showResult': showResult(); break;
    case 'stopDemo': stopDemo(); break;
    default: break;
  }
}

function onOfferClick(space) {
  if (!state) return;
  if (!(state.offers[space] > 0)) { toast('这个 Offer 空间现在是空的。'); return; }
  if (!isHumanTurn() && !demoMode) {
    toast(state.phase === 'feeding' ? '正在收获与喂养，先付清食物。' : '现在是 AI 港商的回合。', 'bad');
    return;
  }
  if (demoMode) { toast('托管演示中，先停止演示再手动操作。', 'bad'); return; }
  openOfferSheet(space);
}

function onBuildingClick(id) {
  if (!state) return;
  openBuildingSheet(id);
}

function onShipTypeClick(type) {
  if (!isHumanTurn() && !demoMode) {
    toast(state.phase === 'feeding' ? '正在收获与喂养，先付清食物。' : '现在是 AI 港商的回合。', 'bad');
    return;
  }
  if (demoMode) { toast('托管演示中，先停止演示再手动操作。', 'bad'); return; }
  openShipSheet(type);
}

function onShipIndexClick(index) {
  openOwnedShipSheet(Number(index));
}

function execOption(index) {
  const action = sheetActions[index];
  if (!action) return;
  commit(action);
}

function onClick(event) {
  const t = event.target;
  const opt = t.closest('[data-opt]');
  if (opt) { execOption(Number(opt.dataset.opt)); return; }
  const pick = t.closest('[data-pick]');
  if (pick) { togglePick(pick.dataset.pick); return; }
  if (t.closest('#marketConfirm')) { confirmMarket(); return; }
  const act = t.closest('[data-act]');
  if (act) { onActionClick(act.dataset.act); return; }
  const offer = t.closest('[data-offer]');
  if (offer) { onOfferClick(offer.dataset.offer); return; }
  const building = t.closest('[data-building]');
  if (building) { onBuildingClick(building.dataset.building); return; }
  const shipType = t.closest('[data-ship-type]');
  if (shipType) { onShipTypeClick(shipType.dataset.shipType); return; }
  const shipIndex = t.closest('[data-ship-index]');
  if (shipIndex) { onShipIndexClick(shipIndex.dataset.shipIndex); return; }
}

function init() {
  byId('rulesBtn').addEventListener('click', openRulesSheet);
  byId('demoBtn').addEventListener('click', () => { if (demoMode) stopDemo(); else startDemo(); });
  byId('restartBtn').addEventListener('click', () => {
    const next = ((Number(seed) * 1664525 + 1013904223) >>> 0) || DEFAULT_SEED;
    newGame(next, false);
  });
  byId('sheetClose').addEventListener('click', closeSheet);
  byId('harvestClose').addEventListener('click', hideHarvest);
  byId('resultClose').addEventListener('click', () => { byId('resultOverlay').hidden = true; });
  byId('resultWatch').addEventListener('click', () => { byId('resultOverlay').hidden = true; });
  byId('playAgain').addEventListener('click', () => {
    newGame(((Number(seed) * 1103515245 + 12345) >>> 0) || DEFAULT_SEED, false);
  });
  byId('feedBtn').addEventListener('click', doFeed);
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return;
    if (!byId('sheetOverlay').hidden) { closeSheet(); return; }
    if (!byId('resultOverlay').hidden) { byId('resultOverlay').hidden = true; return; }
    if (!byId('harvestOverlay').hidden) { hideHarvest(); return; }
  });
  for (const id of ['sheetOverlay', 'harvestOverlay', 'resultOverlay']) {
    byId(id).addEventListener('click', (event) => {
      if (event.target.id === id) byId(id).hidden = true;
    });
  }
  window.__lh = {
    getState: () => state,
    legal: () => (state ? legalActions(state) : []),
    apply: (a) => commit(a),
    auto: startDemo,
    stop: stopDemo,
    newGame,
    score: () => (state ? score(state) : null),
    hash: () => (state ? hashState(state) : null)
  };
  newGame(DEFAULT_SEED, true);
}

init();
</script>
</body>
</html>
