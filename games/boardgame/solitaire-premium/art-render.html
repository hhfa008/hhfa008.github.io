<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="接龙/纸牌游戏的宣传图合成页：真实牌局、材质与代码绘制牌面。">
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/solitaire-premium/art-render.html">
<meta property="og:title" content="solitaire-premium 宣传图合成">
<meta property="og:description" content="本地材质与真实牌局合成的宣传图页面。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hhfa008.github.io/games/boardgame/solitaire-premium/art-render.html">
<title>接龙 · 宣传图合成</title>
<style>
:root{
  --ink:#f2e8d2;--brass:#c9a35f;--brass2:#efd399;--dim:#c6d0bc;--red:#c8564b;
  --display:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  --felt:url("../../assets/art/premium/solitaire/felt.webp");
  --card-back:url("../../assets/art/premium/solitaire/card-back.webp");
  --card-paper:url("../../assets/art/premium/solitaire/card-paper.webp");
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#06110a}
body{font-family:var(--body);color:var(--ink)}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;
  background:
    radial-gradient(80% 70% at 50% -10%,rgba(201,163,95,.22),transparent 62%),
    linear-gradient(180deg,rgba(5,13,8,.42),rgba(5,13,8,.78)),
    var(--felt) center/cover no-repeat}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.55) 100%)}
.frame{position:absolute;inset:3.2vmin;border:1px solid rgba(201,163,95,.36);border-radius:1.4vmin;pointer-events:none}
.frame::before{content:"";position:absolute;inset:.7vmin;border:1px solid rgba(201,163,95,.16);border-radius:1vmin}
.layout{position:relative;z-index:2;width:100%;height:100%;display:grid;padding:5vmin 5.5vmin;gap:3vmin}
.head{display:flex;flex-direction:column;justify-content:center;min-width:0}
.kicker{font-size:1.55vmin;letter-spacing:.34em;color:var(--brass2);text-transform:uppercase}
h1{font-family:var(--display);font-weight:700;font-size:7.2vmin;line-height:1.02;margin:1.4vmin 0 0;color:#fbf1dd;
  text-shadow:0 .5vmin 2vmin rgba(0,0,0,.65);letter-spacing:.04em}
h1 em{font-style:normal;color:var(--brass2);font-size:.62em;letter-spacing:.02em}
.sub{font-size:1.9vmin;color:var(--dim);margin:1.6vmin 0 0;letter-spacing:.08em;line-height:1.5}
.badges{display:flex;gap:1vmin;flex-wrap:wrap;margin-top:2vmin}
.badges span{font-size:1.5vmin;letter-spacing:.1em;padding:.7vmin 1.3vmin;border-radius:99px;
  border:1px solid rgba(201,163,95,.5);background:rgba(6,17,10,.5);color:var(--brass2)}
.table{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0;
  padding:2.2vmin;border-radius:2vmin;border:1px solid rgba(201,163,95,.34);
  background:linear-gradient(180deg,rgba(14,34,21,.72),rgba(4,12,7,.82));
  box-shadow:0 2.6vmin 6vmin rgba(0,0,0,.5),inset 0 .2vmin 0 rgba(255,255,255,.06)}
.table-inner{--slot:6.6vmin;width:100%}
.top-row{display:flex;gap:.7vmin;align-items:flex-start;margin-bottom:1.4vmin}
.slot{position:relative;width:var(--slot);height:calc(var(--slot) * 88 / 63);border-radius:.7vmin;
  border:1px solid rgba(201,163,95,.34);background:rgba(3,11,6,.42);overflow:hidden}
.spacer{flex:1}
.foundations{display:flex;gap:.7vmin}
.ghost{position:absolute;inset:0;display:grid;place-items:center;color:rgba(201,163,95,.24)}
.ghost svg{width:58%;height:58%}
.count{position:absolute;right:.4vmin;bottom:.3vmin;font-size:1.35vmin;padding:.2vmin .5vmin;border-radius:.5vmin;background:rgba(3,10,6,.86);color:var(--brass2)}
.tableau{display:grid;grid-template-columns:repeat(7,1fr);gap:.7vmin;align-items:start}
.col{position:relative;min-height:calc(var(--slot) * 88 / 63)}
.card{position:relative;width:100%;aspect-ratio:63/88;border-radius:.7vmin;overflow:hidden;
  border:1px solid rgba(0,0,0,.4);box-shadow:0 .3vmin .9vmin rgba(0,0,0,.4),inset 0 .1vmin 0 rgba(255,255,255,.3)}
.card.face{color:#1d1a16;background:linear-gradient(145deg,rgba(255,252,242,.16),rgba(98,76,37,.1)),var(--card-paper) center/cover}
.card.face.red{color:#a42722}
.card.back{background:linear-gradient(145deg,rgba(255,246,224,.05),rgba(20,6,8,.14)),var(--card-back) center/cover;
  border-color:rgba(239,211,153,.45)}
.col .card + .card{margin-top:-116%}
.col .card.face + .card.face{margin-top:-93%}
.col .card.face-down + .card.face{margin-top:-102%}
.corner{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.9;
  font-family:Georgia,serif;font-weight:700;font-size:2.3vmin;z-index:2}
.corner.tl{left:6%;top:4%}.corner.br{right:6%;bottom:4%;transform:rotate(180deg)}
.suit-ico{display:inline-block;width:1em;height:1em;fill:currentColor}
.pips{position:absolute;inset:13% 12%;}
.pip{position:absolute;width:23%;aspect-ratio:1;transform:translate(-50%,-50%)}
.pip svg{width:100%;height:100%;fill:currentColor}
.ace{position:absolute;inset:0;display:grid;place-items:center}
.ace .suit-ico{width:56%;height:56%}
.court{position:absolute;inset:9% 10%;border:1px solid currentColor;border-radius:.4vmin;display:grid;place-items:center;opacity:.92;
  background:linear-gradient(135deg,rgba(201,163,95,.1),transparent 42%,rgba(201,163,95,.1))}
.court::before{content:"";position:absolute;inset:.3vmin;border:1px solid currentColor;border-radius:.2vmin;opacity:.45}
.court .letter{font-family:Georgia,serif;font-weight:700;font-size:3.2vmin;z-index:1}
.court .suit-ico{width:34%;height:34%;z-index:1}
.court .split{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8% 0}
.court .flip{transform:rotate(180deg)}
.caption{position:absolute;z-index:3;right:5.5vmin;bottom:4.2vmin;font-size:1.5vmin;letter-spacing:.14em;color:rgba(239,211,153,.75);text-align:right;line-height:1.6}
.ribbon{position:absolute;z-index:3;left:5.5vmin;bottom:4.2vmin;display:flex;gap:1vmin;align-items:center;font-size:1.45vmin;letter-spacing:.12em;color:rgba(239,211,153,.7)}

/* cover: stacked */
.shot-cover .layout{grid-template-rows:auto 1fr}
.shot-cover .head{align-items:center;text-align:center;padding-top:2vmin}
.shot-cover h1{font-size:9.4vmin}
.shot-cover .sub{font-size:2.1vmin}
.shot-cover .table{width:88%;justify-self:center;align-self:start;margin-top:3vmin}
.shot-cover .table-inner{--slot:7.1vmin}
/* og: side by side */
.shot-og .layout{grid-template-columns:38% 1fr;align-items:center}
.shot-og h1{font-size:7.5vmin}
.shot-og .table{height:74%;justify-content:center}
.shot-og .table-inner{--slot:6.4vmin;transform:scale(.62);transform-origin:center}
/* detail: board hero */
.shot-detail .layout{grid-template-rows:auto 1fr}
.shot-detail .head{position:absolute;z-index:4;left:5.5vmin;top:5vmin;max-width:44%;padding:2vmin;border-radius:2vmin;background:linear-gradient(135deg,rgba(5,13,8,.86),rgba(5,13,8,.35))}
.shot-detail h1{font-size:7.4vmin}
.shot-detail .table{width:100%;height:100%;justify-content:center;padding:3vmin}
.shot-detail .table-inner{--slot:9.4vmin;transform:scale(.55);transform-origin:center}
/* card: close-up */
.shot-card .layout{grid-template-columns:36% 1fr;align-items:center;gap:2vmin;padding:4vmin}
.shot-card h1{font-size:6.2vmin}
.shot-card .sub{display:none}
.shot-card .badges span{font-size:1.7vmin}
.shot-card .table-inner{--slot:6.2vmin}
.shot-card .caption,.shot-card .ribbon{display:none}

@media (max-width:420px){
  html,body{overflow:hidden}
  .layout{display:block;padding:16px}
  .head{max-width:100%;padding:0}
  .table{display:none}
  h1{font-size:28px!important}
  .kicker,.sub,.badges span,.caption,.ribbon{font-size:12px!important}
  .caption,.ribbon{position:static;margin-top:10px;text-align:left}
  .frame{inset:8px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="s-spade" viewBox="0 0 24 24"><path d="M12 1.4C9.1 5.5 3.4 8.4 3.4 13.3a4.5 4.5 0 0 0 7.5 3.3c-.1 2.2-1.2 4-2.9 5.2h10c-1.7-1.2-2.8-3-2.9-5.2a4.5 4.5 0 0 0 7.5-3.3C20.6 8.4 14.9 5.5 12 1.4z"/></symbol>
    <symbol id="s-heart" viewBox="0 0 24 24"><path d="M12 21.4S2.6 15.4 2.6 9.1A5.3 5.3 0 0 1 12 5.4a5.3 5.3 0 0 1 9.4 3.7c0 6.3-9.4 12.3-9.4 12.3z"/></symbol>
    <symbol id="s-diamond" viewBox="0 0 24 24"><path d="M12 1.6 21.2 12 12 22.4 2.8 12z"/></symbol>
    <symbol id="s-club" viewBox="0 0 24 24"><path d="M12 2a4.4 4.4 0 0 0-3.3 7.3 4.4 4.4 0 1 0 2.3 7.7v3.4H8v2h8v-2h-3v-3.4a4.4 4.4 0 1 0 2.3-7.7A4.4 4.4 0 0 0 12 2z"/></symbol>
  </defs>
</svg>
<div class="stage" id="stage">
  <div class="frame"></div>
  <div class="layout">
    <div class="head">
      <div class="kicker">Klondike · Classic Patience</div>
      <h1>接龙 <em>Solitaire</em></h1>
      <p class="sub">绿呢牌桌、酒红金纹牌背，七列接龙与四色收牌。单人、离线、可撤销。</p>
      <div class="badges"><span>单人</span><span>52 张牌</span><span>翻 1 / 3 张</span><span>提示 · 撤销 · 收牌</span></div>
    </div>
    <div class="table">
      <div class="table-inner" id="tableInner"></div>
    </div>
  </div>
  <div class="caption">七列 · 四座基础堆 · A → K</div>
  <div class="ribbon"><span>◆</span><span>完全离线 · 本地存档</span></div>
</div>

<script src="../../shared/shuffle.js"></script>
<script src="engine.js"></script>
<script>
(function(){
  'use strict';
  var E = window.SolitaireEngine;
  var shot = 'cover';
  try { shot = new URLSearchParams(location.search).get('shot') || 'cover'; } catch (err) {}
  document.getElementById('stage').className = 'stage shot-' + shot;

  var SUIT_KEY = ['spade', 'heart', 'diamond', 'club'];
  var PIPS = {
    2: [[50,20,0],[50,80,180]],
    3: [[50,20,0],[50,50,0],[50,80,180]],
    4: [[30,20,0],[70,20,0],[30,80,180],[70,80,180]],
    5: [[30,20,0],[70,20,0],[50,50,0],[30,80,180],[70,80,180]],
    6: [[30,20,0],[70,20,0],[30,50,0],[70,50,0],[30,80,180],[70,80,180]],
    7: [[30,20,0],[70,20,0],[50,35,0],[30,50,0],[70,50,0],[30,80,180],[70,80,180]],
    8: [[30,20,0],[70,20,0],[50,35,0],[30,50,0],[70,50,0],[50,65,180],[30,80,180],[70,80,180]],
    9: [[30,20,0],[70,20,0],[30,40,0],[70,40,0],[50,50,0],[30,60,180],[70,60,180],[30,80,180],[70,80,180]],
    10: [[30,20,0],[70,20,0],[30,40,0],[70,40,0],[50,31,0],[50,69,180],[30,60,180],[70,60,180],[30,80,180],[70,80,180]]
  };
  function suitIcon(i, cls){
    return '<svg class="suit-ico ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true"><use href="#s-' + SUIT_KEY[i] + '"></use></svg>';
  }
  function face(card){
    var corner = '<span class="corner tl">' + card.rank + suitIcon(card.suitIndex) + '</span><span class="corner br">' + card.rank + suitIcon(card.suitIndex) + '</span>';
    if (card.value === 1) return corner + '<div class="ace">' + suitIcon(card.suitIndex) + '</div>';
    if (card.value >= 11) {
      return corner + '<div class="court"><div class="split"><span class="letter">' + card.rank + '</span>' + suitIcon(card.suitIndex) + '<span class="letter flip">' + card.rank + '</span></div></div>';
    }
    var pips = (PIPS[card.value] || []).map(function(p){
      return '<span class="pip" style="left:' + p[0] + '%;top:' + p[1] + '%;transform:translate(-50%,-50%) rotate(' + p[2] + 'deg)"><svg viewBox="0 0 24 24"><use href="#s-' + SUIT_KEY[card.suitIndex] + '"></use></svg></span>';
    }).join('');
    return corner + '<div class="pips">' + pips + '</div>';
  }
  function cardEl(card){
    var el = document.createElement('div');
    el.className = 'card ' + (card.faceUp ? 'face ' + (card.red ? 'red' : 'black') : 'back');
    if (card.faceUp) el.innerHTML = face(card);
    return el;
  }

  var game = E.createGame({ seed: 20261110 });
  // Show the real initial deal. Put back cards in the stock and foundation ghosts.
  var inner = document.getElementById('tableInner');
  var top = document.createElement('div');
  top.className = 'top-row';
  var stock = document.createElement('div');
  stock.className = 'slot';
  var backs = Math.min(3, game.stock.length);
  for (var i = 0; i < backs; i += 1) {
    var b = document.createElement('div');
    b.className = 'card back';
    b.style.position = 'absolute';
    b.style.inset = '0';
    b.style.transform = 'translate(' + (i * .5) + 'px,' + (-i * .5) + 'px)';
    stock.appendChild(b);
  }
  var cnt = document.createElement('span');
  cnt.className = 'count';
  cnt.textContent = String(game.stock.length);
  stock.appendChild(cnt);
  top.appendChild(stock);

  var waste = document.createElement('div');
  waste.className = 'slot';
  top.appendChild(waste);
  var spacer = document.createElement('div');
  spacer.className = 'spacer';
  top.appendChild(spacer);
  var foundations = document.createElement('div');
  foundations.className = 'foundations';
  for (var f = 0; f < 4; f += 1) {
    var fs = document.createElement('div');
    fs.className = 'slot';
    var g = document.createElement('span');
    g.className = 'ghost';
    g.innerHTML = suitIcon(f);
    fs.appendChild(g);
    foundations.appendChild(fs);
  }
  top.appendChild(foundations);
  inner.appendChild(top);

  var tableau = document.createElement('div');
  tableau.className = 'tableau';
  game.tableau.forEach(function(pile){
    var col = document.createElement('div');
    col.className = 'col';
    pile.forEach(function(card){ col.appendChild(cardEl(card)); });
    tableau.appendChild(col);
  });
  inner.appendChild(tableau);
})();
</script>
</body>
</html>
