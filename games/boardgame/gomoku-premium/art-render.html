<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<meta name="description" content="五子棋精美版：15×15 榧木棋盘、那智黑石与蛤碁石质感、三档 AI、悔棋、音效与双人联机房间。黑先，五连即胜，完全离线。">
<title>Gomoku Premium — art composition</title>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  document.documentElement.dataset.shot = q.get('shot') || 'cover';
})();
</script>
<style>
:root{
  --serif:"Songti SC","Noto Serif SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --gold:#d9b06a;--gold-2:#f6dfa6;--ink:#f7eedf;--dim:#d0b995;
  --table:url("../../assets/art/premium/gomoku/walnut-wood.webp");
  --goban:url("../../assets/art/premium/gomoku/goban-wood.webp");
  --black:url("../../assets/art/premium/gomoku/stone-black.webp");
  --white:url("../../assets/art/premium/gomoku/stone-white.webp");
}
*{box-sizing:border-box}
html,body{margin:0;background:#0c0804;overflow:hidden}
body{width:1200px;height:1200px;font-family:var(--sans);color:var(--ink)}
.stage{position:relative;width:1200px;height:1200px;overflow:hidden;
  background:radial-gradient(900px 720px at 14% -6%,rgba(206,118,58,.28),transparent 62%),
    radial-gradient(820px 620px at 94% 102%,rgba(217,176,106,.18),transparent 64%),
    linear-gradient(150deg,#1b120a,#090603 78%)}
.stage::before{content:"";position:absolute;inset:0;background:var(--table) center/cover;opacity:.72;filter:saturate(.78) contrast(1.08)}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,4,2,.1),rgba(6,4,2,.66))}
.frame{position:absolute;inset:28px;border:1px solid rgba(217,176,106,.55);border-radius:30px;
  box-shadow:inset 0 0 0 7px rgba(217,176,106,.06),0 40px 110px rgba(0,0,0,.55);z-index:2}
.frame::before,.frame::after{content:"";position:absolute;width:64px;height:64px;border:2px solid rgba(217,176,106,.62)}
.frame::before{left:14px;top:14px;border-right:0;border-bottom:0;border-radius:20px 0 0 0}
.frame::after{right:14px;bottom:14px;border-left:0;border-top:0;border-radius:0 0 20px 0}
.content{position:absolute;left:78px;top:82px;width:610px;z-index:6}
.crest{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(145deg,#6b4a28,#2a1c0e);border:1px solid rgba(217,176,106,.5);
  box-shadow:0 18px 38px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.2);transform:rotate(-3deg)}
.crest img{width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.kicker{margin:26px 0 0;font-family:var(--sans);font-size:15px;letter-spacing:.34em;color:var(--gold);font-weight:600}
h1{margin:10px 0 0;font-family:var(--serif);font-weight:700;font-size:112px;line-height:.88;letter-spacing:.1em;
  text-shadow:0 16px 44px rgba(0,0,0,.55)}
h1 span{display:block;color:var(--gold-2);font-size:.42em;letter-spacing:.28em;margin-top:16px}
.tag{margin:20px 0 0;font-size:19px;line-height:1.7;color:var(--dim);letter-spacing:.04em;max-width:520px}
.rule{height:2px;width:470px;margin:22px 0 0;background:linear-gradient(90deg,var(--gold),transparent)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.chip{display:inline-flex;align-items:center;height:42px;padding:0 17px;border-radius:999px;
  border:1px solid rgba(217,176,106,.42);background:rgba(10,6,3,.5);color:var(--gold-2);font-size:15px;letter-spacing:.06em}
.foot{position:absolute;left:80px;bottom:64px;z-index:7;font-size:13px;letter-spacing:.18em;color:rgba(247,238,223,.72)}
.foot b{color:var(--gold-2);font-weight:600}

/* board */
.board{position:absolute;z-index:5;right:46px;bottom:54px;width:760px;height:760px;
  transform:perspective(1700px) rotateX(14deg) rotateZ(-2.2deg);
  filter:drop-shadow(0 38px 46px rgba(0,0,0,.5))}
.goban{position:absolute;inset:0;border-radius:14px;background:var(--goban) center/cover;
  box-shadow:inset 0 0 0 2px rgba(66,42,18,.6),inset 0 0 80px rgba(66,42,18,.22),0 18px 40px rgba(0,0,0,.4)}
.goban::after{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,rgba(255,236,196,.18),rgba(70,40,14,.16))}
.grid{position:absolute;inset:4.6%;}
.grid::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(180deg,rgba(66,42,18,.66) 0 1.5px,transparent 1.5px calc(100%/14)),
  repeating-linear-gradient(90deg,rgba(66,42,18,.66) 0 1.5px,transparent 1.5px calc(100%/14));
  border:1.5px solid rgba(66,42,18,.75)}
.star{position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(56,34,12,.92);transform:translate(-50%,-50%)}
.stone{position:absolute;width:7.1%;height:7.1%;transform:translate(-50%,-50%);object-fit:contain;
  filter:drop-shadow(0 7px 7px rgba(0,0,0,.38))}
.last{position:absolute;width:1.9%;height:1.9%;border-radius:50%;background:#e8542a;transform:translate(-50%,-50%);
  box-shadow:0 0 0 2px rgba(255,245,225,.75),0 0 12px rgba(232,84,42,.8)}
.threat{position:absolute;height:2.2%;border-radius:2px;background:linear-gradient(90deg,rgba(255,214,120,0),rgba(255,214,120,.95),rgba(255,214,120,0));
  transform:translateY(-50%);filter:blur(.4px);box-shadow:0 0 18px rgba(255,190,80,.6)}
.stand{position:absolute;right:150px;bottom:110px;z-index:4;width:96px;height:150px;border-radius:12px;
  background:linear-gradient(180deg,#4a3320,#241609);box-shadow:0 20px 30px rgba(0,0,0,.5);transform:rotate(6deg);
  display:grid;place-items:center;border:1px solid rgba(217,176,106,.24)}
.stand img{width:78px;height:78px;object-fit:contain;opacity:.95}

/* OG */
html[data-shot="og"] body{height:630px}
html[data-shot="og"] .stage{width:1200px;height:630px}
html[data-shot="og"] .content{left:66px;top:54px;width:560px}
html[data-shot="og"] .crest{width:70px;height:70px;border-radius:18px}
html[data-shot="og"] .crest img{width:58px;height:58px}
html[data-shot="og"] .kicker{margin-top:18px;font-size:12px}
html[data-shot="og"] h1{font-size:76px}
html[data-shot="og"] h1 span{font-size:.4em;margin-top:10px}
html[data-shot="og"] .tag{font-size:15px;margin-top:12px;max-width:430px}
html[data-shot="og"] .rule{width:330px;margin-top:14px}
html[data-shot="og"] .chips{margin-top:15px}
html[data-shot="og"] .chip{height:34px;font-size:12px;padding:0 12px}
html[data-shot="og"] .board{right:-86px;bottom:-158px;width:700px;height:700px;transform:perspective(1700px) rotateX(14deg) rotateZ(-2.2deg) scale(.86)}
html[data-shot="og"] .stand{display:none}
html[data-shot="og"] .foot{left:66px;bottom:32px;font-size:11px}

/* detail */
html[data-shot="detail"] body{width:1536px;height:1024px}
html[data-shot="detail"] .stage{width:1536px;height:1024px}
html[data-shot="detail"] .content{left:88px;top:92px;width:560px}
html[data-shot="detail"] h1{font-size:100px}
html[data-shot="detail"] .board{right:28px;bottom:-40px;width:900px;height:900px}
html[data-shot="detail"] .foot{left:90px;bottom:56px}
</style>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/gomoku-premium/art-render.html">
<style>
/* site-quality: fixed-size art composition must not create page overflow */
html{overflow-x:hidden}
body{width:100%!important;max-width:100vw!important;overflow-x:hidden}
.stage,#stage{max-width:100vw;overflow:hidden}
</style>
</head>
<body>
<div class="stage">
  <div class="frame"></div>
  <div class="content">
    <div class="crest"><img src="../../assets/art/premium/gomoku/stone-black.webp" alt=""></div>
    <p class="kicker">PREMIUM BOARD GAME · 15 × 15</p>
    <h1>五子棋<span>GOMOKU</span></h1>
    <p class="tag">榧木棋盘，那智黑石与蛤碁石。黑先，横竖斜连续五子即胜。</p>
    <div class="rule"></div>
    <div class="chips">
      <span class="chip">225 个交叉点</span>
      <span class="chip">三档 AI</span>
      <span class="chip">双人联机</span>
    </div>
  </div>
  <div class="board" id="board">
    <div class="goban"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="stand" aria-hidden="true"><img src="../../assets/art/premium/gomoku/stone-white.webp" alt=""></div>
  <div class="foot">自由规则 · 无禁手 · <b>BV1wS4y1D7uT</b> · 素材 img-gen / 局面代码合成</div>
</div>
<script>
(function () {
  var stones = [
    [7,7,1],[7,8,1],[6,7,1],[8,6,1],[9,5,1],[5,8,1],[6,9,1],[8,8,1],[4,7,1],
    [7,9,2],[6,8,2],[8,7,2],[9,7,2],[5,7,2],[6,6,2],[10,6,2],[9,8,2],[4,8,2],[5,9,2],[7,6,2],
    [11,5,1],[11,6,1],[11,7,1],[11,8,1]
  ];
  var grid = document.getElementById('grid');
  var stars = [[3,3],[3,11],[11,3],[11,11],[7,7]];
  stars.forEach(function (p) {
    var s = document.createElement('span');
    s.className = 'star';
    s.style.left = (p[1] / 14 * 100) + '%';
    s.style.top = (p[0] / 14 * 100) + '%';
    grid.appendChild(s);
  });
  stones.forEach(function (s) {
    var img = document.createElement('img');
    img.className = 'stone';
    img.src = s[2] === 1 ? '../../assets/art/premium/gomoku/stone-black.webp' : '../../assets/art/premium/gomoku/stone-white.webp';
    img.alt = '';
    img.style.left = (s[1] / 14 * 100) + '%';
    img.style.top = (s[0] / 14 * 100) + '%';
    grid.appendChild(img);
  });
  var last = document.createElement('span');
  last.className = 'last';
  last.style.left = (8 / 14 * 100) + '%';
  last.style.top = (11 / 14 * 100) + '%';
  grid.appendChild(last);
  var threat = document.createElement('span');
  threat.className = 'threat';
  threat.style.left = (4.6 / 14 * 100) + '%';
  threat.style.width = (3.9 / 14 * 100) + '%';
  threat.style.top = (11 / 14 * 100) + '%';
  grid.appendChild(threat);
})();
</script>
</body>
</html>
