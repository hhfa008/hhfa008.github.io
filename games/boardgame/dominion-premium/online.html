<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="领土 Dominion 联机房间：创建/邀请/加入，空位 AI 补足，断线重连、超时托管与结果榜。">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23251b2e'/%3E%3Cpath d='M16 10h32v42l-16-11-16 11z' fill='%23d8b26a'/%3E%3Ccircle cx='32' cy='28' r='7' fill='%23a78be0'/%3E%3C/svg%3E">
<title>领土 Dominion · 联机房间</title>
<link rel="canonical" href="https://hhfa008.github.io/games/boardgame/dominion-premium/online.html">
<style>
:root{
  --bg:#171221;--bg2:#21192f;--panel:#2a203a;--line:#4a3a60;--ink:#f4ecdf;--dim:#b8a8c9;
  --gold:#d8b26a;--purple:#a78be0;--ok:#7ed69a;--bad:#ff9b91;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#3a2a52,var(--bg));color:var(--ink);
  font:15px/1.5 var(--sans);min-height:100dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--gold)}
.wrap{max-width:980px;margin:0 auto;padding:0 12px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top)) 0 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--gold);color:#241a0c;font-weight:900;flex:none}
.brand h1{font-size:17px;letter-spacing:.02em}
.brand p{font-size:12px;color:var(--dim)}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:11px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;
  text-decoration:none;touch-action:manipulation;white-space:nowrap}
.btn:hover{background:#352849}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#241a0c}
.btn.ghost{background:transparent}
.btn.danger{border-color:#7a3d3d;color:#ffb7af}
.shell{display:grid;gap:12px;padding-top:14px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:rgba(42,32,58,.9);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.panel h2{font-size:16px;margin-bottom:4px}
.lede,.hint{font-size:12.5px;color:var(--dim);line-height:1.6}
.section{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
@media(max-width:520px){.form-row{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--dim)}
input,select{width:100%;min-height:44px;padding:0 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg2);color:var(--ink);font-size:15px;min-width:0}
.check{display:flex;align-items:center;gap:8px;min-height:44px;font-size:13px}
.check input{width:22px;height:22px;min-height:22px;accent-color:var(--gold)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.status{font-size:12.5px;line-height:1.5;min-height:18px;margin-top:8px;color:var(--dim);overflow-wrap:anywhere}
.status.error{color:var(--bad)}
.status.ok{color:var(--ok)}
.roombar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.room-code{font:700 20px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--bg2);font-size:12px;font-weight:700}
.seats{display:grid;gap:8px;margin-top:10px}
.seat{display:flex;align-items:center;gap:9px;min-height:46px;padding:7px 10px;border:1px solid var(--line);
  border-radius:11px;background:var(--bg2);font-size:13.5px;min-width:0}
.seat.current{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(216,178,106,.3)}
.seat .idx{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--gold);font-size:12px}
.seat .who{flex:1;min-width:0;overflow-wrap:anywhere}
.seat .tag{font-size:11.5px;color:var(--dim);white-space:nowrap}
.seat .tag.me{color:var(--ok)}
.invite{display:flex;gap:8px;margin-top:8px;min-width:0}
.invite input{font-size:12px;color:var(--dim)}
.game-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.turn-badge{display:inline-flex;align-items:center;min-height:30px;padding:0 11px;border-radius:999px;
  background:#253a2b;color:var(--ok);font-size:12px;font-weight:800}
.turn-badge.wait{background:#3a2f1a;color:#ffd479}
.metrics{display:flex;gap:6px;flex-wrap:wrap}
.metric{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 10px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--dim)}
.metric b{color:var(--ink);font-variant-numeric:tabular-nums}
.supply{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;margin-top:8px}
.pile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:64px;padding:8px 9px;
  border-radius:10px;border:1px solid var(--line);background:var(--bg2);text-align:left;cursor:default}
.pile.legal{border-color:var(--ok);background:#1d3528;cursor:pointer}
.pile:disabled{opacity:.55}
.pile .nm{font-size:12.5px;font-weight:700}
.pile .meta{display:flex;gap:8px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.pile .cost{color:var(--gold)}
.hand{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.cardbtn{min-height:76px;min-width:84px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg2);text-align:left;cursor:default}
.cardbtn.legal{border-color:var(--ok);background:#1d3528;cursor:pointer}
.cardbtn:disabled{opacity:.6}
.cardbtn .nm{display:block;font-size:13px;font-weight:700}
.cardbtn .sub{display:block;font-size:11px;color:var(--dim);margin-top:3px}
.players{display:grid;gap:8px;margin-top:10px}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg2);font-size:13px}
.prow.me{border-color:var(--purple)}
.prow .nm{font-weight:700}
.prow .st{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.prow .st b{color:var(--ink)}
.log{max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:5px;margin-top:8px}
.log .row{display:flex;gap:8px;font-size:12px;color:var(--dim);line-height:1.45}
.log .row .t{color:var(--gold);flex:none;font-variant-numeric:tabular-nums}
.result{margin-top:10px;padding:12px;border:1px solid var(--gold);border-radius:12px;background:#2d2540}
.result h3{font-size:15px;color:var(--gold);margin-bottom:6px}
.result .srow{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  max-width:92vw;padding:10px 14px;border-radius:10px;background:#3a2d50;border:1px solid var(--line);
  font-size:13px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.footer{padding:18px 0 4px;font-size:12px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="topbar wrap">
  <div class="brand">
    <div class="logo">领</div>
    <div>
      <h1>领土 <span>DOMINION</span></h1>
      <p>牌库构筑 · 双人联机</p>
    </div>
  </div>
  <div class="top-actions">
    <a class="btn ghost" href="index.html">单人牌桌</a>
    <a class="btn ghost" href="rules.html">规则</a>
  </div>
</header>
<main class="wrap shell">
  <div class="grid">
    <section class="panel">
      <h2>联机房间</h2>
      <p class="lede">创建房间后把房间码或邀请链接发给朋友。空位由 AI 补足，断线可重连，超时自动托管。</p>
      <div id="lobbySection">
        <div class="section">
          <h3>创建房间</h3>
          <div class="form-row">
            <div class="field"><label for="hostName">你的昵称</label><input id="hostName" maxlength="24" autocomplete="nickname" placeholder="例如 领主"></div>
            <div class="field"><label for="hostPassword">房间密码（可选）</label><input id="hostPassword" type="password" maxlength="64" autocomplete="new-password" placeholder="留空表示无密码"></div>
          </div>
          <div class="form-row">
            <div class="field" style="align-content:end">
              <label class="check"><input id="privateRoom" type="checkbox" aria-label="私密房（必须凭邀请）"> 私密房（必须凭邀请）</label>
            </div>
          </div>
          <div class="actions"><button class="btn primary" id="createBtn" type="button">创建房间</button></div>
        </div>
        <div class="section">
          <h3>加入房间</h3>
          <div class="form-row">
            <div class="field"><label for="joinCode">房间码 / 房间 ID</label><input id="joinCode" maxlength="96" autocomplete="off" placeholder="例如 AB3K9Q"></div>
            <div class="field"><label for="joinName">昵称</label><input id="joinName" maxlength="24" autocomplete="nickname" placeholder="你的昵称"></div>
          </div>
          <div class="form-row">
            <div class="field"><label for="joinPassword">密码（可选）</label><input id="joinPassword" type="password" maxlength="64" autocomplete="current-password" placeholder="有密码时填写"></div>
            <div class="field"><label for="joinInvite">邀请码（可选）</label><input id="joinInvite" maxlength="96" autocomplete="off" placeholder="房主分享的单次邀请码"></div>
          </div>
          <div class="actions"><button class="btn" id="joinBtn" type="button">加入房间</button></div>
        </div>
      </div>
      <div id="roomSection" hidden>
        <div class="roombar">
          <span class="room-code" id="roomCode" aria-label="房间码">——</span>
          <span class="chip" id="roomStatus">等待开始</span>
          <span class="chip" id="versionChip" hidden></span>
        </div>
        <div class="seats" id="seatList" aria-label="座位"></div>
        <div class="invite" id="inviteBox" hidden>
          <input id="inviteToken" readonly aria-label="邀请链接">
          <button class="btn ghost" id="copyInvite" type="button">复制</button>
        </div>
        <div class="actions">
          <button class="btn primary" id="startBtn" type="button" hidden>开始对局</button>
          <button class="btn" id="inviteBtn" type="button" hidden>生成新邀请</button>
          <button class="btn" id="restartBtn" type="button" hidden>再来一局</button>
          <button class="btn danger" id="closeBtn" type="button" hidden>关闭房间</button>
          <button class="btn ghost" id="leaveBtn" type="button">离开房间</button>
          <button class="btn ghost" id="newRoomBtn" type="button">回到大厅</button>
        </div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
    <aside class="panel">
      <h2>联机规则</h2>
      <ul class="hint" style="margin:8px 0 0;padding-left:18px">
        <li>双人开局；空位由 AI 补足。</li>
        <li>断线后凭浏览器会话重连，超时由 AI 托管。</li>
        <li>行省堆空或任意三堆耗尽即终局。</li>
        <li>终局后房主可重开，结果进入榜单。</li>
      </ul>
      <div class="section">
        <h3>最近对局</h3>
        <div class="log" id="leaderboard"><div class="row"><span>还没有完成的联机对局</span></div></div>
      </div>
      <div class="section">
        <a class="btn" href="rules.html">查看完整规则</a>
      </div>
    </aside>
  </div>
  <section class="panel" id="gameSection" hidden>
    <div class="game-head">
      <h2>牌桌</h2>
      <span class="turn-badge" id="turnBadge">等待</span>
      <div class="metrics" id="metrics"></div>
    </div>
    <div id="gameBody"></div>
  </section>
</main>
<p style="text-align:center;margin:14px 0"><a href="../spectate.html" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1px solid currentColor;color:inherit;font-size:13px;text-decoration:none">围观其他对局</a></p>
<footer class="wrap footer">
  <span>领土 · Dominion · 服务端权威房间</span>
  <a href="index.html">返回牌桌</a>
</footer>
<div class="toast" id="toast" hidden></div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.DominionEngine;
  var GAME = 'dominion-premium';
  var $ = function (id) { return document.getElementById(id); };
  var S = { room: '', session: '', playerId: '', view: null, timer: null, redirecting: false };

  function readJSON(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (err) { return null; } }
  function writeJSON(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (err) {} }
  function removeKey(key) { try { localStorage.removeItem(key); } catch (err) {} }
  function randomId() { return 'p-' + Math.random().toString(36).slice(2, 10); }
  function randomName() { return '领主' + String(Math.floor(1000 + Math.random() * 9000)); }
  function savedName() { try { return localStorage.getItem(GAME + '-name') || ''; } catch (err) { return ''; } }
  function rememberName(name) { try { localStorage.setItem(GAME + '-name', name); } catch (err) {} }
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
    });
  }
  function cardName(id) {
    var card = E && E.CARD_BY_ID && E.CARD_BY_ID[id];
    return card ? card.name : String(id || '');
  }
  function cardCost(id) {
    var card = E && E.CARD_BY_ID && E.CARD_BY_ID[id];
    return card ? card.cost : '';
  }
  function toast(text) {
    var el = $('toast');
    el.textContent = text;
    el.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { el.hidden = true; }, 2000);
  }
  function status(text, kind) {
    var el = $('status');
    el.textContent = text || '';
    el.className = 'status' + (kind ? ' ' + kind : '');
  }
  async function api(method, route, body) {
    var response = await fetch(route, {
      method: method,
      headers: body ? { 'content-type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
    var text = await response.text();
    var data = null;
    try { data = JSON.parse(text); } catch (err) { data = null; }
    return { status: response.status, body: data };
  }
  function errorText(res) {
    return (res && res.body && res.body.error && res.body.error.message) || ('请求失败 (' + (res && res.status) + ')');
  }
  function roomUrl(suffix) { return '/api/rooms/' + encodeURIComponent(S.room) + (suffix || ''); }
  function sessionQuery() {
    return '?session=' + encodeURIComponent(S.session) + '&playerId=' + encodeURIComponent(S.playerId);
  }
  function saveSession() {
    writeJSON(GAME + '-online-session-' + S.room, { session: S.session, playerId: S.playerId });
  }
  function enter(view) {
    S.room = view.roomId;
    S.view = view;
    saveSession();
    showRoom();
    render();
    schedulePoll();
  }
  function showLobby() {
    clearTimeout(S.timer);
    S.view = null;
    $('lobbySection').hidden = false;
    $('roomSection').hidden = true;
    $('gameSection').hidden = true;
  }
  function showRoom() {
    $('lobbySection').hidden = true;
    $('roomSection').hidden = false;
  }

  async function createRoom() {
    var name = ($('hostName').value || '').trim() || randomName();
    rememberName(name);
    S.playerId = S.playerId || randomId();
    var body = { playerId: S.playerId, nickname: name };
    var password = ($('hostPassword').value || '').trim();
    if (password) body.password = password;
    if ($('privateRoom').checked) body.visibility = 'private';
    var res = await api('POST', '/api/rooms', body);
    if (res.status !== 201) return status(errorText(res), 'error');
    S.session = res.body.session;
    enter(res.body);
    status('房间已创建，把房间码或邀请链接发给朋友。', 'ok');
  }

  async function joinRoom() {
    var code = ($('joinCode').value || '').trim();
    var invite = ($('joinInvite').value || '').trim();
    if (!code) return status('请填写房间码或房间 ID（仅邀请码不能定位房间）。', 'error');
    var name = ($('joinName').value || '').trim() || randomName();
    rememberName(name);
    S.playerId = S.playerId || randomId();
    var body = { playerId: S.playerId, nickname: name };
    if (invite) body.inviteCode = invite;
    if ($('joinPassword').value) body.password = $('joinPassword').value;
    var res = await api('POST', '/api/rooms/' + encodeURIComponent(code) + '/join', body);
    if (res.status !== 200) return status(errorText(res), 'error');
    S.room = res.body.roomId;
    S.session = res.body.session;
    enter(res.body);
    status('已加入房间。', 'ok');
  }

  async function startGame() {
    if (!S.view || !S.view.seats[S.view.you] || !S.view.seats[S.view.you].isHost) return;
    var res = await api('POST', roomUrl('/start'), { session: S.session, playerId: S.playerId });
    if (res.status !== 200) return status(errorText(res), 'error');
    S.view = res.body;
    render();
  }

  async function sendAction(action) {
    if (!action) return;
    var res = await api('POST', roomUrl('/actions'), {
      session: S.session, playerId: S.playerId, action: action
    });
    if (res.status !== 200) {
      status(errorText(res), 'error');
      return;
    }
    S.view = res.body;
    render();
  }

  async function refreshRoom() {
    if (!S.room || !S.session) return;
    if (!S.view || !S.view.seats) return;
    var res = await api('GET', roomUrl() + sessionQuery());
    if (res.status === 401 || res.status === 404) {
      status('会话已失效或房间已关闭。', 'error');
      forgetRoom();
      return;
    }
    if (res.status !== 200) {
      status(errorText(res), 'error');
      schedulePoll();
      return;
    }
    S.view = res.body;
    render();
    schedulePoll();
  }
  function schedulePoll() {
    clearTimeout(S.timer);
    if (!S.room || !S.session || !S.view) return;
    S.timer = setTimeout(refreshRoom, 900);
  }

  async function inviteAgain() {
    var res = await api('POST', roomUrl('/invite'), { session: S.session, playerId: S.playerId });
    if (res.status !== 200) return status(errorText(res), 'error');
    S.view.inviteCode = res.body.inviteCode;
    render();
    status('新的单次邀请码已生成。', 'ok');
  }

  async function restartGame() {
    var res = await api('POST', roomUrl('/restart'), { session: S.session, playerId: S.playerId });
    if (res.status !== 200) return status(errorText(res), 'error');
    S.view = res.body;
    render();
  }

  async function leaveRoom() {
    if (S.room && S.session) {
      await api('POST', roomUrl('/leave'), { session: S.session, playerId: S.playerId });
    }
    forgetRoom();
    status('已离开房间。', 'ok');
  }

  async function closeRoom() {
    if (!S.room || !S.session) return;
    var res = await api('DELETE', roomUrl() + sessionQuery());
    if (res.status !== 200) return status(errorText(res), 'error');
    forgetRoom();
    status('房间已关闭。', 'ok');
  }

  function forgetRoom() {
    if (S.room) removeKey(GAME + '-online-session-' + S.room);
    clearTimeout(S.timer);
    S.room = ''; S.session = ''; S.view = null;
    showLobby();
  }

  function copyInvite() {
    var input = $('inviteToken');
    if (!input) return;
    input.select();
    var copy = navigator.clipboard && navigator.clipboard.writeText
      ? navigator.clipboard.writeText(input.value)
      : Promise.reject(new Error('clipboard unavailable'));
    copy.then(function () { status('邀请链接已复制。', 'ok'); })
      .catch(function () { status('请手动复制邀请链接。', 'error'); });
  }

  function inviteUrl() {
    if (!S.view) return '';
    var base = location.origin + location.pathname;
    return base + '?room=' + encodeURIComponent(S.view.roomId) +
      '&code=' + encodeURIComponent(S.view.inviteCode || '');
  }

  function isHost() {
    return !!(S.view && S.view.seats && S.view.you != null && S.view.seats[S.view.you] &&
      S.view.seats[S.view.you].isHost);
  }
  function canAct() {
    return !!(S.view && S.view.state && !S.view.state.over && S.view.you != null &&
      (S.view.legalActions || []).length > 0);
  }
  function legalOf(type, cardId) {
    if (!S.view) return null;
    return (S.view.legalActions || []).filter(function (move) {
      if (move.type !== type) return false;
      return cardId == null || move.cardId === cardId;
    })[0] || null;
  }

  function render() {
    var view = S.view;
    if (!view) return;
    var seat = view.seats && view.you != null ? view.seats[view.you] : null;
    $('roomCode').textContent = view.code || view.roomId || '——';
    var humans = (view.seats || []).filter(function (s) { return !s.ai; }).length;
    var phaseText = !view.started ? '等待开始' : (view.over ? '已结束' : '对局中');
    $('roomStatus').textContent = phaseText + ' · 玩家 ' + humans + '/' + (view.seats || []).length;
    $('versionChip').hidden = !view.stateVersion;
    $('versionChip').textContent = '版本 ' + (view.stateVersion || 0);
    $('seatList').innerHTML = (view.seats || []).map(function (s) {
      var tags = [];
      if (s.isYou) tags.push('你');
      if (s.isHost) tags.push('房主');
      if (s.ai) tags.push('AI 补位');
      if (!s.ai && !s.connected) tags.push('离线');
      if (view.state && view.state.turn === s.index && view.started && !view.over) tags.push('行动中');
      return '<div class="seat' + (view.state && view.state.turn === s.index && view.started && !view.over ? ' current' : '') + '">' +
        '<span class="idx">' + (s.index + 1) + '</span>' +
        '<span class="who">' + esc(s.name) + '</span>' +
        '<span class="tag' + (s.isYou ? ' me' : '') + '">' + esc(tags.join(' · ') || '等待') + '</span></div>';
    }).join('');
    $('startBtn').hidden = !(isHost() && !view.started);
    $('inviteBtn').hidden = !isHost();
    $('closeBtn').hidden = !isHost();
    $('restartBtn').hidden = !view.canRestart;
    $('inviteBox').hidden = !view.inviteCode;
    $('inviteToken').value = view.inviteCode ? inviteUrl() : '';
    $('gameSection').hidden = !view.started;
    $('turnBadge').hidden = !view.started;
    if (!view.started) {
      $('gameBody').innerHTML = '';
      $('metrics').innerHTML = '';
      $('turnBadge').textContent = '等待房主开始';
      $('turnBadge').className = 'turn-badge wait';
      return;
    }
    renderGame(view);
  }

  function renderGame(view) {
    var state = view.state;
    if (!state) return;
    var mine = view.you;
    var myTurn = canAct() && state.turn === mine;
    $('turnBadge').textContent = state.over ? '本局结束' : (myTurn ? '轮到你行动' : '等待对手');
    $('turnBadge').className = 'turn-badge' + (myTurn ? '' : ' wait');
    $('metrics').innerHTML =
      '<span class="metric">阶段 <b>' + (state.phase === 'action' ? '行动' : '购买') + '</b></span>' +
      '<span class="metric">金币 <b>' + state.coins + '</b></span>' +
      '<span class="metric">行动 <b>' + state.actions + '</b></span>' +
      '<span class="metric">购买 <b>' + state.buys + '</b></span>' +
      '<span class="metric">回合 <b>' + state.moves + '</b></span>';
    var html = '';
    html += '<h3 style="font-size:14px;margin-top:4px">供应堆</h3><div class="supply">';
    Object.keys(state.supply || {}).forEach(function (id) {
      var legal = legalOf('buy', id);
      html += '<button type="button" class="pile' + (legal ? ' legal' : '') + '" data-buy="' + esc(id) + '"' +
        (legal ? '' : ' disabled') + '>' +
        '<span class="nm">' + esc(cardName(id)) + '</span>' +
        '<span class="meta"><span class="cost">' + esc(cardCost(id)) + ' 金</span><span>剩 ' + state.supply[id] + '</span></span></button>';
    });
    html += '</div>';
    var me = mine == null ? null : state.players[mine];
    html += '<h3 style="font-size:14px;margin-top:14px">我的手牌</h3><div class="hand">';
    if (me && me.hand.length) {
      me.hand.forEach(function (id, index) {
        var legal = legalOf('playAction', id);
        html += '<button type="button" class="cardbtn' + (legal ? ' legal' : '') + '" data-play="' + esc(id) + '"' +
          (legal ? '' : ' disabled') + '>' +
          '<span class="nm">' + esc(cardName(id)) + '</span>' +
          '<span class="sub">' + esc(cardCost(id)) + ' 金' + (legal ? ' · 可打出' : '') + '</span></button>';
      });
    } else {
      html += '<span class="hint">手牌不公开或已空。</span>';
    }
    html += '</div>';
    var endLegal = legalOf('endPhase');
    html += '<div class="actions">' +
      '<button class="btn primary" id="endPhaseBtn" type="button"' + (endLegal ? '' : ' disabled') + '>' +
      (state.phase === 'action' ? '结束行动（打出财宝）' : '结束购买（弃牌抽 5）') + '</button></div>';
    html += '<h3 style="font-size:14px;margin-top:14px">玩家</h3><div class="players">';
    state.players.forEach(function (p) {
      html += '<div class="prow' + (p.index === mine ? ' me' : '') + '">' +
        '<span class="nm">' + esc(p.name) + (p.index === mine ? '（你）' : '') + '</span>' +
        '<span class="st">' +
        '<span>分 <b>' + p.score + '</b></span>' +
        '<span>手牌 <b>' + p.handCount + '</b></span>' +
        '<span>牌堆 <b>' + p.deckCount + '</b></span>' +
        '<span>弃牌 <b>' + p.discardCount + '</b></span>' +
        '<span>已出 <b>' + p.playArea.length + '</b></span>' +
        '</span></div>';
    });
    html += '</div>';
    if (me && me.playArea.length) {
      html += '<p class="hint" style="margin-top:8px">你已打出：' +
        me.playArea.map(function (id) { return esc(cardName(id)); }).join('、') + '</p>';
    }
    html += '<h3 style="font-size:14px;margin-top:14px">对局记录</h3><div class="log">';
    html += (state.log || []).slice(-18).reverse().map(function (row) {
      return '<div class="row"><span class="t">' + row.turn + '</span><span>' + esc(row.text) + '</span></div>';
    }).join('') || '<div class="row"><span>还没有记录。</span></div>';
    html += '</div>';
    html += '<h3 style="font-size:14px;margin-top:14px">联机战报</h3><div class="log">';
    html += (view.history || []).slice(-12).reverse().map(function (entry) {
      var action = entry.action || {};
      var text = entry.type;
      if (entry.type === 'start') text = '对局开始';
      else if (entry.type === 'restart') text = '房主重开对局';
      else if (entry.type === 'over') text = '对局结束' + (entry.scores ? ' · ' + entry.scores.join(' : ') : '');
      else if (entry.type === 'human') text = '座位 ' + (entry.seat + 1) + ' · ' + action.type + (action.cardId ? ' ' + cardName(action.cardId) : '');
      else if (entry.type === 'ai') text = 'AI 座位 ' + (entry.seat + 1) + ' · ' + action.type + (action.cardId ? ' ' + cardName(action.cardId) : '');
      return '<div class="row"><span class="t">v' + (entry.stateVersion || 0) + '</span><span>' + esc(text) + '</span></div>';
    }).join('') || '<div class="row"><span>还没有联机战报。</span></div>';
    html += '</div>';
    if (state.over) {
      var result = view.result || state.result || {};
      var scores = result.scores || [];
      html += '<div class="result"><h3>' +
        (result.winnerName ? esc(result.winnerName) + ' 获胜' : (result.tied ? '平局' : '对局结束')) +
        '</h3>';
      (state.players || []).forEach(function (p) {
        html += '<div class="srow"><span>' + esc(p.name) + '</span><b>' + (scores[p.index] == null ? p.score : scores[p.index]) + '</b></div>';
      });
      html += '<p class="hint">' + esc(result.reason || '') + ' · 房主可以再来一局。</p></div>';
    }
    $('gameBody').innerHTML = html;
    Array.prototype.forEach.call($('gameBody').querySelectorAll('[data-buy]'), function (btn) {
      btn.addEventListener('click', function () {
        var move = legalOf('buy', btn.getAttribute('data-buy'));
        if (move) sendAction(move);
      });
    });
    Array.prototype.forEach.call($('gameBody').querySelectorAll('[data-play]'), function (btn) {
      btn.addEventListener('click', function () {
        var move = legalOf('playAction', btn.getAttribute('data-play'));
        if (move) sendAction(move);
      });
    });
    var endBtn = $('endPhaseBtn');
    if (endBtn) endBtn.addEventListener('click', function () {
      var move = legalOf('endPhase');
      if (move) sendAction(move);
    });
  }

  async function loadLeaderboard() {
    var box = $('leaderboard');
    if (!box) return;
    var res = await api('GET', '/api/leaderboard?game=' + encodeURIComponent(GAME));
    if (res.status !== 200 || !res.body || !res.body.entries) return;
    var entries = res.body.entries.slice(0, 6);
    if (!entries.length) {
      box.innerHTML = '<div class="row"><span>还没有完成的联机对局</span></div>';
      return;
    }
    box.innerHTML = entries.map(function (entry) {
      return '<div class="row"><span class="t">' + (entry.seat + 1) + '</span><span>' +
        esc(entry.name || '玩家') + (entry.ai ? ' · AI' : '') + ' · ' +
        (entry.winner ? '胜' : '负') + ' · ' + esc(entry.score == null ? '' : entry.score) +
        '</span></div>';
    }).join('');
  }

  function bind() {
    $('hostName').value = savedName();
    $('joinName').value = savedName();
    $('createBtn').addEventListener('click', createRoom);
    $('joinBtn').addEventListener('click', joinRoom);
    $('startBtn').addEventListener('click', startGame);
    $('inviteBtn').addEventListener('click', inviteAgain);
    $('restartBtn').addEventListener('click', restartGame);
    $('copyInvite').addEventListener('click', copyInvite);
    $('leaveBtn').addEventListener('click', leaveRoom);
    $('closeBtn').addEventListener('click', closeRoom);
    $('newRoomBtn').addEventListener('click', forgetRoom);

    S.playerId = readJSON(GAME + '-player') || randomId();
    writeJSON(GAME + '-player', S.playerId);

    var q = new URLSearchParams(location.search);
    var room = q.get('room') || q.get('online') || '';
    var qSession = q.get('session') || '';
    var qPlayer = q.get('player') || '';
    if (qPlayer) S.playerId = qPlayer;
    if (q.get('code')) $('joinInvite').value = q.get('code');
    if (room) {
      $('joinCode').value = room;
      var saved = readJSON(GAME + '-online-session-' + room);
      if (qSession) saved = { session: qSession, playerId: S.playerId };
      if (saved && saved.session) {
        S.room = room;
        S.session = saved.session;
        S.playerId = saved.playerId || S.playerId;
        api('POST', roomUrl('/reconnect'), { session: S.session, playerId: S.playerId }).then(function (res) {
          if (res.status === 200) {
            enter(res.body);
            status('已重连到房间。', 'ok');
          } else {
            status('上次的房间会话已失效，请重新加入。', 'error');
          }
        });
      }
    }
    loadLeaderboard();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
})();
</script>
</body>
</html>
