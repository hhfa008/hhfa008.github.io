        var dtop2 = st.tableau[destCol][st.tableau[destCol].length - 1] || null;
        if (!canStack(srcPile[move.from.index], dtop2)) return false;

  // Canonical board fingerprint (ignores move counter) used by tests and debugging.
  function boardKey(st) {

      return col.map(function (c) { return c.r + ',' + c.s + ',' + (c.up ? 1 : 0); });
    });
    var f = st.foundations.map(function (pile) {
      return pile.map(function (c) { return c.r + ',' + c.s; });
    });

      t, f,
      st.stock.map(function (c) { return c.r + ',' + c.s; }),
      st.waste.map(function (c) { return c.r + ',' + c.s; })
    ]);
  }

    this.state = newState(seed, drawCount);
    this.undoLimit = 200;
    this.history = [];
  }

      var color = C.isRed(i % 4) ? '#c0392b' : '#2b2f36';
      html += '<span style="left:' + (i * 3.8 + (i % 3) * 2) + '%;color:' + color +
        ';animation-delay:' + (i % 8) * 0.18 + 's;font-size:' + (16 + (i % 4) * 5) + 'px">' + suit + '</span>';
    }
    confettiEl.innerHTML = html;
    winOverlay.hidden = false;
    document.getElementById('winNew').focus();
  }
  function hideWin() {
    winOverlay.hidden = true;
    confettiEl.innerHTML = '';
  }

  function newGame() {
    autoRunning = false;
    selection = null;
    won = false;
    resetTimer();
    hideWin();
    game = new C.Game(null, drawPref);
    updateTime();
    renderAll();
  }

  function doDraw() {
    if (autoRunning) return;
    selection = null;
    if (game.draw()) onActionDone();
    else { message(t('stockEmpty')); renderAll(); }
  }

  function doUndo() {
    if (autoRunning) return;
    if (!game.undo()) return;
    var wasWon = won;
    won = false;
    hideWin();
    selection = null;
    if (wasWon && timerBase > 0) startTimer();
    renderAll();
    message(t('undone'));
  }

  function doAuto() {
    if (autoRunning || won) return;
    var plan = game.autoPlan();
    if (!plan || !plan.length) { message(t('autoUnavailable')); return; }
    autoRunning = true;
    selection = null;
    renderAll();
    var i = 0;
    function step() {
      if (i >= plan.length) {
        autoRunning = false;
        onActionDone();
        return;
      }
      if (!game.move(plan[i])) {
        autoRunning = false;
        onActionDone();
        return;
      }
      i++;
      renderAll();
      setTimeout(step, 85);
    }
    step();
  }

  function tryMove(move) {
    if (game.move(move)) {
      selection = null;
      onActionDone();
      return true;
    }
    message(t('invalid'));
    return false;
  }

  function tapOn(el) {
    if (!el || autoRunning) return;
    var zone = el.getAttribute('data-zone');
    if (zone === 'stock') { doDraw(); return; }
    if (zone === 'waste') {
      if (!el.classList.contains('card')) {
        if (selection) { selection = null; renderAll(); }
        return;
      }
      var w = game.state.waste;
      if (selection && selection.type === 'waste') {
        tryMove({ type: 'foundation', from: { type: 'waste' }, suit: w[w.length - 1].s });
        return;
      }
      selection = { type: 'waste' };
      renderAll();
      return;
    }
    if (zone === 'foundation') {
      var suit = +el.getAttribute('data-suit');
      if (selection) tryMove({ type: 'foundation', from: selection, suit: suit });
      return;
    }
    if (zone === 'tableau') {
      if (el.classList.contains('col') || el.classList.contains('slot')) {
        var colIdx = +el.getAttribute('data-col');
        if (selection) { tryMove({ type: 'tableau', from: selection, col: colIdx }); return; }
        selection = null; renderAll(); return;
      }
      var col = +el.getAttribute('data-col');
      var idx = +el.getAttribute('data-idx');
      var pile = game.state.tableau[col];
      var card = pile[idx];
      if (!card) return;
      if (selection) {
        var same = selection.type === 'tableau' && selection.col === col && selection.index === idx;
        if (same && selection.index === pile.length - 1 &&
            tryMove({ type: 'foundation', from: selection, suit: card.s })) return;
        if (tryMove({ type: 'tableau', from: selection, col: col })) return;
      }
      if (!card.up) { message(t('faceDown')); selection = null; renderAll(); return; }
      if (!C.isRun(pile, idx)) { message(t('badRun')); selection = null; renderAll(); return; }
      selection = { type: 'tableau', col: col, index: idx };
      renderAll();
    }
  }

  function sourceFor(el) {
    if (!el) return null;
    var zone = el.getAttribute('data-zone');
    if (zone === 'waste' && el.classList.contains('card')) {
      var w = game.state.waste;
      if (!w.length || +el.getAttribute('data-idx') !== w.length - 1) return null;
      return { from: { type: 'waste' }, cards: [w[w.length - 1]], el: el };
    }
    if (zone === 'tableau' && el.classList.contains('card')) {
      var col = +el.getAttribute('data-col'), idx = +el.getAttribute('data-idx');
      var pile = game.state.tableau[col], card = pile[idx];
      if (!card || !card.up || !C.isRun(pile, idx)) return null;
      return { from: { type: 'tableau', col: col, index: idx }, cards: pile.slice(idx), el: el };
    }
    return null;
  }

  function liftedEls(source) {
    if (source.from.type === 'waste') {
      return [source.el];
    }
    var els = boardEl.querySelectorAll('.col[data-col="' + source.from.col + '"] > .card');
    var out = [];
    for (var i = 0; i < els.length; i++) {
      if (+els[i].getAttribute('data-idx') >= source.from.index) out.push(els[i]);
    }
    return out;
  }

  function startGhost(e) {
    var src = drag.source;
    var rect = src.el.getBoundingClientRect();
    drag.grabX = e.clientX - rect.left;
    drag.grabY = e.clientY - rect.top;
    drag.width = rect.width;
    var ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.style.width = rect.width + 'px';
    ghost.style.setProperty('--gw', rect.width + 'px');
    for (var i = 0; i < src.cards.length; i++) {
      var d = document.createElement('div');
      d.className = 'card up ' + cardColorClass(src.cards[i].s) + (src.cards[i].r > 10 ? ' court-card' : '');
      d.innerHTML = faceHTML(src.cards[i]);
      if (i > 0) d.style.marginTop = '-112%';
      ghost.appendChild(d);
    }
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    drag.lifted = liftedEls(src);
    for (var j = 0; j < drag.lifted.length; j++) drag.lifted[j].classList.add('lifted');
    moveGhost(e.clientX, e.clientY);
  }

  function moveGhost(x, y) {
    if (!drag || !drag.ghost) return;
    drag.ghost.style.left = (x - drag.grabX) + 'px';
    drag.ghost.style.top = (y - drag.grabY) + 'px';
  }

  function endGhost(target) {
    var d = target || drag;
    if (!d) return;
    if (d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    if (d.lifted) for (var i = 0; i < d.lifted.length; i++) d.lifted[i].classList.remove('lifted');
    var hot = boardEl.querySelectorAll('.drop-hot');
    for (var j = 0; j < hot.length; j++) hot[j].classList.remove('drop-hot');
  }

  function dropTarget(x, y) {
    var el = document.elementFromPoint(x, y);
    if (!el) return null;
    var f = el.closest('.slot.foundation');
    if (f) return { type: 'foundation', suit: +f.getAttribute('data-suit'), el: f };
    var colEl = el.closest('.col[data-col]');
    if (colEl) return { type: 'tableau', col: +colEl.getAttribute('data-col'), el: colEl };
    return null;
  }

  function highlightDrop(target) {
    var hot = boardEl.querySelectorAll('.drop-hot');
    for (var i = 0; i < hot.length; i++) hot[i].classList.remove('drop-hot');
    if (!target) return;
    if (target.type === 'foundation') { target.el.classList.add('drop-hot'); return; }
    var colEl = target.el;
    var cards = colEl.querySelectorAll(':scope > .card');
    if (cards.length) cards[cards.length - 1].classList.add('drop-hot');
    else { var slot = colEl.querySelector('.slot'); if (slot) slot.classList.add('drop-hot'); }
  }

  function onPointerDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    if (autoRunning) return;
    var el = e.target.closest('[data-zone]');
    if (!el) return;
    var cardEl = el.classList.contains('card') ? el : null;
    drag = {
      startX: e.clientX, startY: e.clientY, x: e.clientX, y: e.clientY,
      moved: false, source: sourceFor(cardEl), el: el, pointerId: e.pointerId
    };
    if (drag.source) {
      try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
    }
  }

  function onPointerMove(e) {
    if (!drag) return;
    var dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
    if (!drag.moved && Math.sqrt(dx * dx + dy * dy) > 7) {
      if (!drag.source) { drag = null; return; }
      drag.moved = true;
      startGhost(e);
    }
    if (drag && drag.moved) {
      e.preventDefault();
      moveGhost(e.clientX, e.clientY);
      highlightDrop(dropTarget(e.clientX, e.clientY));
    }
  }

  function onPointerUp(e) {
    if (!drag) return;
    var d = drag;
    drag = null;
    if (d.moved) {
      endGhost(d);
      var target = dropTarget(e.clientX, e.clientY);
      if (d.source && target) {
        selection = null;
        var move = target.type === 'tableau'
          ? { type: 'tableau', from: d.source.from, col: target.col }
          : { type: 'foundation', from: d.source.from, suit: target.suit };
        if (game.move(move)) onActionDone();
        else { message(t('invalid')); renderAll(); }
      } else {
        selection = null;
        renderAll();
      }
      return;
    }
    var el = document.elementFromPoint(e.clientX, e.clientY);
    if (el) tapOn(el.closest('[data-zone]'));
    else if (selection) { selection = null; renderAll(); }
  }

  function onPointerCancel() {
    if (drag) { endGhost(); drag = null; renderAll(); }
  }

  function setLang(next) {
    lang = next;
    try { localStorage.setItem('sol.lang.v1', lang); } catch (e) {}
    applyLang();
  }

  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      var key = nodes[i].getAttribute('data-i18n');
      var value = t(key);
      if (value !== undefined) nodes[i].textContent = value;
    }
    var rules = t('rules') || [];
    document.getElementById('rulesList').innerHTML = rules.map(function (r) { return '<li>' + r + '</li>'; }).join('');
    var langBtns = document.querySelectorAll('.langs button');
    for (var j = 0; j < langBtns.length; j++) {
      langBtns[j].setAttribute('aria-pressed', String(langBtns[j].getAttribute('data-lang') === lang));
    }
    renderAll();
    if (game && !winOverlay.hidden) {
      winStatsEl.textContent = t('winStats').replace('{t}', fmt(winSeconds)).replace('{m}', game.state.moves);
      winRecordEl.textContent = t('record');
    }
  }

  boardEl.addEventListener('pointerdown', onPointerDown);
  boardEl.addEventListener('pointermove', onPointerMove);
  boardEl.addEventListener('pointerup', onPointerUp);
  boardEl.addEventListener('pointercancel', onPointerCancel);
  boardEl.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (e.target.closest('[data-zone="stock"]')) { e.preventDefault(); doDraw(); }
  });
  boardEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  newBtn.addEventListener('click', function () {
    if (autoRunning) return;
    if (game.state.moves > 0 && !won && !confirm(t('confirmNew'))) return;
    newGame();
  });
  undoBtn.addEventListener('click', doUndo);
  autoBtn.addEventListener('click', doAuto);
  drawBtn.addEventListener('click', function () {
    if (autoRunning) return;
    if (game.state.moves > 0 && !won && !confirm(t('confirmNew'))) return;
    drawPref = drawPref === 3 ? 1 : 3;
    try { localStorage.setItem('sol.draw.v1', String(drawPref)); } catch (e) {}
    newGame();
  });
  document.getElementById('winNew').addEventListener('click', newGame);
  document.getElementById('winClose').addEventListener('click', hideWin);

  var langBtns = document.querySelectorAll('.langs button');
  for (var li = 0; li < langBtns.length; li++) {
    (function (btn) {
      btn.addEventListener('click', function () { setLang(btn.getAttribute('data-lang')); });
    })(langBtns[li]);
  }

  newGame();
  applyLang();
  setInterval(function () { if (timerOn) updateTime(); }, 500);
})();
</script>
</body>
</html>
