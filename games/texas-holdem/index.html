<script id="engine">
(function (global) {
  'use strict';

  var HE = global.HandEval; // shared hand evaluator, see games/shared/hand-eval.js
  if (!HE) throw new Error('shared/hand-eval.js must load before the poker engine');
  var SH = global.Shuffle; // shared Fisher-Yates + CSPRNG, see games/shared/shuffle.js

  var SUITS = ['s', 'h', 'd', 'c'];
  var SUIT_SYMBOLS = { s: '♠', h: '♥', d: '♦', c: '♣' };
  var RANK_LABELS = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
  var CATEGORY_KEYS = HE.CATEGORY_KEYS;

  function rankLabel(r) { return RANK_LABELS[r] || String(r); }

  var card = HE.card;
  var cards = HE.cards;

  function fullDeck() {
    var out = [];
    for (var s = 0; s < SUITS.length; s++) {
      for (var r = 2; r <= 14; r++) out.push({ r: r, s: SUITS[s] });
    }
    return out;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function shuffle(deck, rng) {
    var d = deck.slice();
    // Delegate to the shared engine when the page loaded it. Passing the
    // existing rng (not a seed) keeps seeded self-play/tests bit-identical.
    if (SH && SH.shuffleInPlace) return SH.shuffleInPlace(d, rng ? { rng: rng } : {});
    rng = rng || Math.random;
    for (var i = d.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = d[i]; d[i] = d[j]; d[j] = t;
    }
    return d;
  }

  // Hand ranking is delegated to the shared evaluator. evaluate() keeps the
  // page's historical result shape ({ cat, score, best, key }) for the UI and
  // tests; 6-7 card inputs return the strongest five-card hand.
  function evaluate(input) {
    return HE.evalPoker(input);
  }

  function compare(a, b) {
    return HE.comparePoker(a, b);
  }

  function nextSeatWithChips(state, from) {
    var ps = state.players, n = ps.length;
    for (var i = 1; i <= n; i++) {
      var s = (from + i) % n;
      if (ps[s].chips > 0) return s;
    }
    return from;
  }

  function potTotal(state) {
    var t = 0;
    state.players.forEach(function (p) { t += p.contributed; });
    return t;
  }

  function logEvent(state, type, data) {
    var e = { type: type };
    if (data) Object.keys(data).forEach(function (k) { e[k] = data[k]; });
    state.log.push(e);
  }

  function createTable(opts) {
    opts = opts || {};
    var startingChips = opts.startingChips != null ? opts.startingChips : 1000;
    var seed = opts.seed;
    var rng = opts.rng ||
      (seed != null ? mulberry32(seed) : (SH ? SH.createRng() : Math.random));
    var src = opts.players;
    if (!src) {
      var names = opts.names || ['You', 'AI 1', 'AI 2', 'AI 3'];
      src = names.map(function (name) { return { name: name }; });
    }
    var players = src.map(function (p, i) {
      return {
        seat: i,
        name: p.name || ('AI ' + (i + 1)),
        chips: p.chips != null ? p.chips : startingChips,
        hole: [], folded: false, allIn: false, out: false,
        bet: 0, contributed: 0, acted: false, canRaise: true
      };
    });
    return {
      players: players,
      sb: opts.sb != null ? opts.sb : 10,
      bb: opts.bb != null ? opts.bb : 20,
      startingChips: startingChips,
      dealer: opts.dealer != null ? opts.dealer : 0,
      handNo: 0,
      street: 'idle',
      board: [],
      deck: [],
      currentBet: 0,
      minRaise: opts.bb != null ? opts.bb : 20,
      toAct: null,
      sbSeat: null,
      bbSeat: null,
      log: [],
      result: null,
      rng: rng,
      seed: seed
    };
  }

  function resetStacks(state) {
    state.players.forEach(function (p) {
      p.chips = state.startingChips;
      p.out = false;
    });
  }

  function postBlind(state, seat, amount) {
    var p = state.players[seat];
    var pay = Math.min(amount, p.chips);
    p.chips -= pay;
    p.bet += pay;
    p.contributed += pay;
    if (p.chips === 0) p.allIn = true;
    return pay;
  }

  function startHand(state) {
    var ps = state.players, n = ps.length;
    state.handNo++;
    state.board = [];
    state.deck = shuffle(fullDeck(), state.rng);
    state.result = null;
    state.log = [];
    state.street = 'preflop';
    state.currentBet = 0;
    state.minRaise = state.bb;
    state.toAct = null;
    state.sbSeat = null;
    state.bbSeat = null;

    ps.forEach(function (p) {
      p.hole = [];
      p.folded = p.chips <= 0;
      p.out = p.chips <= 0;
      p.allIn = false;
      p.bet = 0;
      p.contributed = 0;
      p.acted = false;
      p.canRaise = true;
    });

    var activeCount = ps.filter(function (p) { return p.chips > 0; }).length;
    if (activeCount < 2) {
      state.street = 'complete';
      state.result = { type: 'over', winners: [], awards: {}, pots: [], hands: {} };
      return state;
    }

    if (state.handNo === 1) {
      if (ps[state.dealer].chips <= 0) state.dealer = nextSeatWithChips(state, state.dealer);
    } else {
      state.dealer = nextSeatWithChips(state, state.dealer);
    }

    var order = [];
    for (var i = 1; i <= n; i++) {
      var s = (state.dealer + i) % n;
      if (ps[s].chips > 0) order.push(s);
    }
    for (var round = 0; round < 2; round++) {
      order.forEach(function (seat) { ps[seat].hole.push(state.deck.pop()); });
    }

    var sbSeat, bbSeat;
    if (order.length === 2) {
      sbSeat = state.dealer;
      bbSeat = nextSeatWithChips(state, sbSeat);
    } else {
      sbSeat = nextSeatWithChips(state, state.dealer);
      bbSeat = nextSeatWithChips(state, sbSeat);
    }
    state.sbSeat = sbSeat;
    state.bbSeat = bbSeat;

    var sbPaid = postBlind(state, sbSeat, state.sb);
    var bbPaid = postBlind(state, bbSeat, state.bb);
    state.currentBet = Math.max(ps[sbSeat].bet, ps[bbSeat].bet);
    state.minRaise = state.bb;

    logEvent(state, 'hand', { hand: state.handNo, dealer: state.dealer });
    logEvent(state, 'blinds', { sb: sbSeat, bb: bbSeat, sbAmount: sbPaid, bbAmount: bbPaid });

    state.toAct = advanceToAct(state, bbSeat);
    if (state.toAct == null) runOut(state);
    return state;
  }

  function advanceToAct(state, fromSeat) {
    var n = state.players.length;
    for (var i = 1; i <= n; i++) {
      var s = (fromSeat + i) % n;
      var p = state.players[s];
      if (p.folded || p.out || p.allIn) continue;
      if (!p.acted || p.bet < state.currentBet) return s;
    }
    return null;
  }

  function legalActions(state, seat) {
    var p = state.players[seat];
    if (!p || state.street === 'complete' || state.street === 'idle' ||
        p.folded || p.allIn || p.out || state.toAct !== seat) return null;
    var toCall = Math.max(0, state.currentBet - p.bet);
    var callAmount = Math.min(toCall, p.chips);
    var maxRaiseTo = p.bet + p.chips;
    var minRaiseTo = state.currentBet + state.minRaise;
    if (minRaiseTo > maxRaiseTo) minRaiseTo = maxRaiseTo;
    var canRaise = p.canRaise && p.chips > toCall && maxRaiseTo > state.currentBet;
    return {
      seat: seat,
      toCall: toCall,
      callAmount: callAmount,
      canCheck: toCall === 0,
      canCall: toCall > 0 && p.chips > 0,
      canFold: true,
      canRaise: canRaise,
      minRaiseTo: canRaise ? minRaiseTo : null,
      maxRaiseTo: canRaise ? maxRaiseTo : null,
      allInTo: maxRaiseTo,
      pot: potTotal(state)
    };
  }

  function payChips(p, amount) {
    p.chips -= amount;
    p.bet += amount;
    p.contributed += amount;
    if (p.chips === 0) p.allIn = true;
  }

  function bettingRoundComplete(state) {
    var need = state.players.filter(function (p) { return !p.folded && !p.out && !p.allIn; });
    if (need.length === 0) return true;
    if (need.length === 1) return need[0].bet >= state.currentBet;
    return need.every(function (p) { return p.acted && p.bet >= state.currentBet; });
  }

  function applyAction(state, seat, action) {
    var L = legalActions(state, seat);
    if (!L) return { ok: false, error: 'not-your-turn' };
    action = action || {};
    var type = action.type;
    if (type === 'bet') type = 'raise';
    var p = state.players[seat];

    if (type === 'fold') {
      p.folded = true;
      p.acted = true;
      p.canRaise = false;
      logEvent(state, 'fold', { seat: seat });
    } else if (type === 'check') {
      if (!L.canCheck) return { ok: false, error: 'cannot-check' };
      p.acted = true;
      p.canRaise = false;
      logEvent(state, 'check', { seat: seat });
    } else if (type === 'call') {
      if (L.toCall <= 0) return { ok: false, error: 'nothing-to-call' };
      payChips(p, L.callAmount);
      p.acted = true;
      p.canRaise = false;
      logEvent(state, 'call', { seat: seat, amount: L.callAmount, allIn: p.chips === 0 });
    } else if (type === 'raise' || type === 'allin') {
      if (type === 'allin' && !L.canRaise) {
        if (p.chips > L.toCall) return { ok: false, error: 'cannot-raise' };
        payChips(p, Math.min(L.toCall, p.chips));
        p.acted = true;
        p.canRaise = false;
        logEvent(state, 'call', { seat: seat, amount: L.callAmount, allIn: true });
      } else {
        if (!L.canRaise) return { ok: false, error: 'cannot-raise' };
        var to;
        if (type === 'allin') {
          to = L.maxRaiseTo;
        } else {
          to = Number(action.to != null ? action.to : action.amount);
          if (!isFinite(to)) return { ok: false, error: 'bad-amount' };
          to = Math.round(to);
        }
        if (to <= state.currentBet) return { ok: false, error: 'raise-too-small' };
        if (to > L.maxRaiseTo) return { ok: false, error: 'not-enough-chips' };
        if (to < L.minRaiseTo && to !== L.maxRaiseTo) return { ok: false, error: 'below-min-raise' };
        var payAmt = to - p.bet;
        if (payAmt > p.chips) return { ok: false, error: 'not-enough-chips' };
        payChips(p, payAmt);
        var inc = to - state.currentBet;
        var reopen = inc >= state.minRaise;
        state.currentBet = to;
        p.acted = true;
        p.canRaise = false;
        if (reopen) {
          state.minRaise = inc;
          state.players.forEach(function (o) {
            if (o !== p && !o.folded && !o.out && !o.allIn) {
              o.acted = false;
              o.canRaise = true;
            }
          });
        }
        logEvent(state, 'raise', { seat: seat, to: to, allIn: p.chips === 0, short: !reopen });
      }
    } else {
      return { ok: false, error: 'bad-action' };
    }

    var live = state.players.filter(function (q) { return !q.folded && !q.out; });
    if (live.length === 1) {
      awardSingle(state, live[0]);
      return { ok: true, state: state };
    }
    if (bettingRoundComplete(state)) {
      nextStreet(state);
    } else {
      state.toAct = advanceToAct(state, seat);
      if (state.toAct == null) nextStreet(state);
    }
    return { ok: true, state: state };
  }

  function dealBoard(state, count) {
    for (var i = 0; i < count && state.deck.length; i++) state.board.push(state.deck.pop());
  }

  function nextStreet(state) {
    var order = ['preflop', 'flop', 'turn', 'river'];
    var idx = order.indexOf(state.street);
    state.players.forEach(function (p) {
      p.bet = 0;
      p.acted = false;
      p.canRaise = true;
    });
    state.currentBet = 0;
    state.minRaise = state.bb;
    state.toAct = null;

    if (idx >= 3) { showdown(state); return; }
    var ns = order[idx + 1];
    state.street = ns;
    dealBoard(state, ns === 'flop' ? 3 : 1);
    logEvent(state, 'street', { street: ns });

    var contenders = state.players.filter(function (p) { return !p.folded && !p.out; });
    if (contenders.length <= 1) { awardSingle(state, contenders[0]); return; }
    var withChips = contenders.filter(function (p) { return !p.allIn; });
    if (withChips.length <= 1) { runOut(state); return; }
    state.toAct = advanceToAct(state, state.dealer);
    if (state.toAct == null) runOut(state);
  }

  function runOut(state) {
    var order = ['flop', 'turn', 'river'];
    while (state.board.length < 5) {
      if (state.board.length === 0) { dealBoard(state, 3); state.street = 'flop'; }
      else { dealBoard(state, 1); state.street = state.board.length === 4 ? 'turn' : 'river'; }
      logEvent(state, 'street', { street: state.street });
    }
    showdown(state);
  }

  function awardSingle(state, winner) {
    var amount = potTotal(state);
    winner.chips += amount;
    var awards = {};
    state.players.forEach(function (p) { awards[p.seat] = 0; });
    awards[winner.seat] = amount;
    state.result = {
      type: 'fold',
      winners: [winner.seat],
      awards: awards,
      pots: [{ amount: amount, eligible: [winner.seat], winners: [winner.seat] }],
      hands: {}
    };
    state.street = 'complete';
    state.toAct = null;
    logEvent(state, 'win', { seat: winner.seat, amount: amount });
  }

  function sameSet(a, b) {
    if (a.length !== b.length) return false;
    var x = a.slice().sort(function (p, q) { return p - q; }).join(',');
    var y = b.slice().sort(function (p, q) { return p - q; }).join(',');
    return x === y;
  }

  function buildPots(players) {
    var levels = {};
    players.forEach(function (p) { if (p.contributed > 0) levels[p.contributed] = true; });
    var sorted = Object.keys(levels).map(Number).sort(function (a, b) { return a - b; });
    var pots = [];
    var prev = 0;
    sorted.forEach(function (level) {
      var amount = 0;
      players.forEach(function (p) {
        amount += Math.max(0, Math.min(p.contributed, level) - Math.min(p.contributed, prev));
      });
      var eligible = players.filter(function (p) { return !p.folded && p.contributed >= level; }).map(function (p) { return p.seat; });
      if (amount > 0) {
        var last = pots[pots.length - 1];
        if (last && sameSet(last.eligible, eligible)) last.amount += amount;
        else pots.push({ amount: amount, eligible: eligible, level: level, winners: [] });
      }
      prev = level;
    });
    return pots;
  }

  function payout(players, board, dealer) {
    var live = players.filter(function (p) { return !p.folded; });
    var hands = {};
    live.forEach(function (p) { hands[p.seat] = evaluate(p.hole.concat(board)); });
    var pots = buildPots(players);
    var awards = {};
    players.forEach(function (p) { awards[p.seat] = 0; });
    var n = players.length;
    dealer = dealer || 0;

    pots.forEach(function (pot) {
      var eligible = pot.eligible.filter(function (s) { return hands[s]; });
      if (!eligible.length) eligible = live.map(function (p) { return p.seat; });
      if (!eligible.length) { pot.winners = []; return; }
      var best = eligible[0];
      for (var i = 1; i < eligible.length; i++) {
        if (compare(hands[eligible[i]], hands[best]) > 0) best = eligible[i];
      }
      var winners = eligible.filter(function (s) { return compare(hands[s], hands[best]) === 0; });
      var share = Math.floor(pot.amount / winners.length);
      var rem = pot.amount - share * winners.length;
      var ordered = winners.slice().sort(function (a, b) {
        return (((a - dealer - 1) % n + n) % n) - (((b - dealer - 1) % n + n) % n);
      });
      ordered.forEach(function (s, i) {
        awards[s] += share + (i < rem ? 1 : 0);
      });
      pot.winners = winners;
    });

    var winnerSet = {};
    pots.forEach(function (pot) { pot.winners.forEach(function (s) { winnerSet[s] = true; }); });
    return {
      type: 'showdown',
      pots: pots,
      awards: awards,
      hands: hands,
      winners: Object.keys(winnerSet).map(Number)
    };
  }

  function showdown(state) {
    while (state.board.length < 5 && state.deck.length) state.board.push(state.deck.pop());
    var result = payout(state.players, state.board, state.dealer);
    state.result = result;
    state.players.forEach(function (p) { p.chips += result.awards[p.seat] || 0; });
    state.street = 'complete';
    state.toAct = null;
    logEvent(state, 'showdown', {});
  }

  function preflopStrength(hole) {
    var a = hole[0].r, b = hole[1].r;
    var hi = Math.max(a, b), lo = Math.min(a, b);
    if (a === b) return 0.55 + (a - 2) / 12 * 0.45;
    var s = 0.18 + (hi - 2) / 12 * 0.42 + (lo - 2) / 12 * 0.18;
    if (hole[0].s === hole[1].s) s += 0.05;
    if (hi - lo === 1) s += 0.04;
    else if (hi - lo === 2) s += 0.02;
    if (hi === 14) s += 0.03;
    return Math.min(0.95, s);
  }

  function madeStrength(hand) {
    var base = [0.14, 0.33, 0.52, 0.67, 0.77, 0.85, 0.92, 0.97, 0.99, 1][hand.cat];
    if (hand.cat === 0) base += (hand.score[1] - 2) / 12 * 0.04;
    if (hand.cat === 1) base += (hand.score[1] - 2) / 12 * 0.10 + (hand.score[2] || 0) / 14 * 0.03;
    if (hand.cat === 2) base += (hand.score[1] - 2) / 12 * 0.08;
    if (hand.cat === 3) base += (hand.score[1] - 2) / 12 * 0.06;
    return Math.min(0.99, base);
  }

  function drawBonus(state, seat) {
    if (state.board.length !== 3 && state.board.length !== 4) return 0;
    var p = state.players[seat];
    var cs = p.hole.concat(state.board);
    var bySuit = {};
    cs.forEach(function (c) { bySuit[c.s] = (bySuit[c.s] || 0) + 1; });
    var bonus = 0;
    Object.keys(bySuit).forEach(function (s) { if (bySuit[s] === 4) bonus += 0.09; });
    var set = {};
    cs.forEach(function (c) { set[c.r] = true; });
    if (set[14]) set[1] = true;
    var draw = false;
    for (var low = 1; low <= 10; low++) {
      var count = 0;
      for (var r = low; r < low + 5; r++) if (set[r]) count++;
      if (count === 4) { draw = true; break; }
    }
    if (draw) bonus += 0.07;
    return Math.min(0.15, bonus);
  }

  function handStrength(state, seat) {
    var p = state.players[seat];
    if (!p.hole || p.hole.length < 2) return 0;
    if (state.board.length === 0) return preflopStrength(p.hole);
    return Math.min(0.99, madeStrength(evaluate(p.hole.concat(state.board))) + drawBonus(state, seat));
  }

  function betSize(state, L, fraction) {
    var pot = potTotal(state);
    var target;
    if (state.currentBet === 0) target = Math.max(state.bb, Math.round(pot * fraction));
    else target = state.currentBet + Math.max(state.minRaise, Math.round(pot * fraction));
    target = Math.max(L.minRaiseTo, target);
    if (target > L.maxRaiseTo) target = L.maxRaiseTo;
    return target;
  }

  function normalizeAction(state, seat, action) {
    var L = legalActions(state, seat);
    if (!L) return null;
    var t = action && action.type;
    if (t === 'allin') return { type: 'allin' };
    if (t === 'raise' || t === 'bet') {
      if (!L.canRaise) return L.canCall ? { type: 'call' } : (L.canCheck ? { type: 'check' } : { type: 'fold' });
      var to = Number(action.to != null ? action.to : action.amount);
      if (!isFinite(to)) to = L.minRaiseTo;
      if (to < L.minRaiseTo) to = L.minRaiseTo;
      if (to > L.maxRaiseTo) to = L.maxRaiseTo;
      to = Math.round(to);
      if (to <= state.currentBet) return L.canCall ? { type: 'call' } : { type: 'check' };
      return { type: 'raise', to: to };
    }
    if (t === 'call') return L.canCall ? { type: 'call' } : (L.canCheck ? { type: 'check' } : { type: 'fold' });
    if (t === 'check') return L.canCheck ? { type: 'check' } : (L.canCall ? { type: 'call' } : { type: 'fold' });
    return { type: 'fold' };
  }

  function aiAction(state, seat, level, rng) {
    rng = rng || state.rng || Math.random;
    var L = legalActions(state, seat);
    if (!L) return null;
    var pot = potTotal(state);
    var toCall = L.toCall;
    var strength = handStrength(state, seat);
    var r = rng();
    var late = ((seat - state.dealer + state.players.length) % state.players.length) >= state.players.length - 1;
    var act;

    if (level === 'easy') {
      if (toCall === 0) {
        if (strength >= 0.75 && r < 0.45) {
          act = { type: 'raise', to: Math.min(L.maxRaiseTo, Math.max(L.minRaiseTo, state.bb * 3)) };
        } else {
          act = { type: 'check' };
        }
      } else {
        if (strength >= 0.84 && L.canRaise && r < 0.5) {
          act = { type: 'raise', to: Math.min(L.maxRaiseTo, Math.max(L.minRaiseTo, state.currentBet + state.minRaise)) };
        } else if (strength >= 0.42 || r < 0.07) {
          act = { type: 'call' };
        } else {
          act = { type: 'fold' };
        }
      }
    } else if (level === 'medium') {
      var potOdds = toCall / Math.max(1, pot + toCall);
      if (toCall === 0) {
        if (strength >= 0.58 && r < 0.7) act = { type: 'raise', to: betSize(state, L, 0.65) };
        else if (strength >= 0.42 && r < 0.25) act = { type: 'raise', to: betSize(state, L, 0.5) };
        else act = { type: 'check' };
      } else {
        if (strength >= 0.75 && L.canRaise && r < 0.6) act = { type: 'raise', to: betSize(state, L, 0.75) };
        else if (strength >= potOdds * 0.9 + 0.06) act = { type: 'call' };
        else if (strength >= 0.5 && toCall <= pot * 0.2) act = { type: 'call' };
        else act = { type: 'fold' };
      }
    } else {
      var potOddsH = toCall / Math.max(1, pot + toCall);
      var draw = drawBonus(state, seat);
      if (toCall === 0) {
        if (strength >= 0.78) act = { type: 'raise', to: betSize(state, L, 0.7) };
        else if (strength >= 0.44 && r < 0.68) act = { type: 'raise', to: betSize(state, L, 0.55) };
        else if (r < 0.16 + (late ? 0.06 : 0)) act = { type: 'raise', to: betSize(state, L, 0.5) };
        else act = { type: 'check' };
      } else {
        if (strength >= 0.84 && L.canRaise && r < 0.72) act = { type: 'raise', to: betSize(state, L, 0.8) };
        else if (strength >= 0.64 && L.canRaise && r < 0.4) act = { type: 'raise', to: betSize(state, L, 0.7) };
        else if (strength + draw * 0.6 >= potOddsH + 0.06) act = { type: 'call' };
        else if (toCall <= state.bb && strength >= 0.30) act = { type: 'call' };
        else if (strength >= 0.22 && L.canRaise && r < 0.06 + (late ? 0.03 : 0)) act = { type: 'raise', to: betSize(state, L, 0.6) };
        else act = { type: 'fold' };
      }

    var html = '';
    html += '<div class="seat-head"><span class="avatar">' + (isHuman ? 'YOU' : 'AI' + seat) + '</span>';
    html += '<div class="seat-meta"><strong>' + seatName(seat) + '</strong><span' +
      (active ? ' class="turn"' : '') + '>' +
      p.chips + '\n' + t('chipUnit') + '</span></div></div>';
    el.innerHTML = html;
    var hole = document.createElement('div');
    hole.className = 'hole';
    if (p.hole && p.hole.length) {
      p.hole.forEach(function (c) {
        hole.appendChild(cardEl(c, !showHole, isHuman ? 'big' : 'sm'));
      });
    }
    el.appendChild(hole);
    var badgesEl = document.createElement('div');
    badgesEl.className = 'badges';
    badges.forEach(function (badge) {
      var b = document.createElement('span');
      b.className = 'badge' + (badge.className ? ' ' + badge.className : '');
      b.textContent = badge.text;
      badgesEl.appendChild(b);
    });
    el.appendChild(badgesEl);
    var bet = document.createElement('div');
    bet.className = 'bet';
    bet.textContent = p.bet > 0 ? '+' + p.bet : '';
    el.appendChild(bet);
    el.className = seatClass;
    el.setAttribute('aria-label', aria);
    host.replaceWith(el);
    els.seat[seat] = el;
  }

  function renderBoard() {
    var total = P.potTotal(state);
    els.pot.textContent = String(total);
    var streetKey = 'street' + state.street.charAt(0).toUpperCase() + state.street.slice(1);
    els.street.textContent = state.street === 'complete' ? t('streetComplete') : t(streetKey);
    var UI = window.PokerUI;
    if (UI && UI.createBoard) {
      var boardEl = UI.createBoard({
        slots: 5,
        cards: state.board,
        size: 'md',
        className: 'board',
        label: t('ariaBoard'),
        renderCard: function (c) { return cardEl(c, false, 'big'); },
        renderSlot: function () { return cardEl(null, false, 'big'); }
      });
      if (boardEl) {
        boardEl.id = 'board';
        els.board.replaceWith(boardEl);
        els.board = boardEl;
      }
    } else {
      els.board.innerHTML = '';
      for (var i = 0; i < 5; i++) {
        els.board.appendChild(cardEl(state.board[i] || null, false, 'big'));
      }
    }
    renderPotChips(total);
  }

  function renderPotChips(total) {
    var host = document.getElementById('pot-chips');
    var UI = window.PokerUI;
    if (!host || !UI || !UI.createChipStack) return;
    var stack = UI.createChipStack({
      value: total,
      max: 4,
      className: 'pot-chips',
      label: String(total)
    });
    if (!stack) return;
    stack.id = 'pot-chips';
    stack.setAttribute('aria-hidden', 'true');
    host.replaceWith(stack);
  }

  function currentHandName() {
    var p = state.players[0];
    if (!p.hole || p.hole.length < 2) return '';
    if (state.board.length < 3) {
      return fmt('handInfoPre', { cards: p.hole.map(function (c) { return P.rankLabel(c.r) + P.SUIT_SYMBOLS[c.s]; }).join(' ') });
    }
    var h = P.evaluate(p.hole.concat(state.board));
    return fmt('handInfoMade', { name: t('cat' + h.key.charAt(0).toUpperCase() + h.key.slice(1)) });
  }

  function renderResult() {
    els.result.innerHTML = '';
    if (!state.result) return;
    var r = state.result;
    if (r.type === 'over') {
      els.result.textContent = t('resultOver');
      return;
    }
    var wrap = document.createElement('div');
    var winnerParts = (r.winners || []).map(function (seat) {
      return '<span class="win">' + seatName(seat) + '</span> +' + (r.awards[seat] || 0);
    });
    if (winnerParts.length > 1) {
      var p = document.createElement('p');
      p.innerHTML = t('resultSplit') + ': ' + winnerParts.join(' · ');
      wrap.appendChild(p);
    } else if (winnerParts.length === 1) {
      var p2 = document.createElement('p');
      p2.innerHTML = fmt('resultWin', { who: '<span class="win">' + seatName(r.winners[0]) + '</span>', amount: (r.awards[r.winners[0]] || 0) });
      wrap.appendChild(p2);
    }
    if (r.hands && Object.keys(r.hands).length) {
      var hp = document.createElement('div');
      var names = Object.keys(r.hands).map(function (seat) {
        var h = r.hands[seat];
        return seatName(Number(seat)) + ': ' + t('cat' + h.key.charAt(0).toUpperCase() + h.key.slice(1));
      });
      hp.textContent = names.join(' · ');
      hp.style.fontSize = '11px';
      hp.style.color = 'var(--on-dark-muted)';
      wrap.appendChild(hp);
    }
    if (r.pots && r.pots.length > 1) {
      var pl = document.createElement('div');
      pl.className = 'pot-list';
      pl.textContent = r.pots.map(function (pot, i) {
        var label = i === 0 ? t('mainPot') : fmt('sidePot', { n: i });
        return label + ' ' + pot.amount + (pot.winners && pot.winners.length ? ' → ' + pot.winners.map(seatName).join(', ') : '');
      }).join(' · ');
      wrap.appendChild(pl);
    }
    els.result.appendChild(wrap);
  }

  function renderLog() {
    els.log.innerHTML = '';
    var entries = state.log.slice(-9);
    if (!entries.length) {
      var e = document.createElement('p');
      e.className = 'empty';
      e.textContent = t('logEmpty');
      els.log.appendChild(e);
      return;
    }
    entries.forEach(function (ev) {
      var p = document.createElement('p');
      var html = '';
      var who = ev.seat != null ? '<span class="who">' + seatName(ev.seat) + '</span>' : '';
      switch (ev.type) {
        case 'hand': html = fmt('logHand', { n: ev.hand, dealer: seatName(ev.dealer) }); break;
        case 'blinds': html = fmt('logBlinds', { sb: seatName(ev.sb), sbAmount: ev.sbAmount, bb: seatName(ev.bb), bbAmount: ev.bbAmount }); break;
        case 'street': html = fmt('logStreet', { street: t('street' + ev.street.charAt(0).toUpperCase() + ev.street.slice(1)) }); break;
        case 'fold': html = fmt('logFold', { who: who }); break;
        case 'check': html = fmt('logCheck', { who: who }); break;
        case 'call':
          html = ev.allIn
            ? fmt('logCallAllIn', { who: who, amount: '<span class="amt">' + ev.amount + '</span>' })
            : fmt('logCall', { who: who, amount: '<span class="amt">' + ev.amount + '</span>' });
          break;
        case 'raise':
          var key = ev.allIn ? (ev.short ? 'logRaiseShort' : 'logRaiseAllIn') : 'logRaise';
          html = fmt(key, { who: who, to: '<span class="amt">' + ev.to + '</span>' });
          break;
        case 'win': html = fmt('logWin', { who: who, amount: '<span class="amt">' + ev.amount + '</span>' }); break;
        case 'showdown': html = t('logShowdown'); break;
        default: html = ev.type;
      }
      p.innerHTML = html;
      els.log.appendChild(p);
    });
    els.log.scrollTop = els.log.scrollHeight;
  }

  function syncRaiseInputs(L) {
    if (!L || !L.canRaise) return;
    var min = L.minRaiseTo, max = L.maxRaiseTo;
    var cur = Number(els.amount.value) || min;
    cur = Math.max(min, Math.min(max, cur));
    els.slider.min = String(min);
    els.slider.max = String(max);
    els.amount.min = String(min);
    els.amount.max = String(max);
    els.slider.value = String(cur);
    els.amount.value = String(cur);
  }

  function renderControls() {
    var L = (state.toAct === 0 && state.street !== 'complete') ? P.legalActions(state, 0) : null;
    var complete = state.street === 'complete';
    els.controls.hidden = false;
    els.next.hidden = !complete;
    if (complete) {
      els.fold.disabled = els.check.disabled = els.call.disabled = els.raise.disabled = els.allin.disabled = true;
      els.raisePanel.hidden = true;
      return;
    }
    var enabled = !!L;
    els.fold.disabled = !enabled;
    els.check.disabled = !enabled || !L.canCheck;
    els.call.disabled = !enabled || !L.canCall;
    els.raise.disabled = !enabled || !L.canRaise;
    els.allin.disabled = !enabled || (!L.canRaise && state.players[0].chips > L.toCall);
    els.check.hidden = !(enabled && L.canCheck);
    els.call.hidden = !(enabled && L.canCall);
    if (L && L.canCall) {
      els.call.textContent = t('call') + ' ' + L.callAmount;
      els.call.hidden = false;
    }
    if (L && L.canCheck) els.check.hidden = false;
    els.raise.textContent = state.currentBet > 0 ? t('raise') : t('bet');
    els.allin.textContent = t('allIn');
    els.raisePanel.hidden = !(enabled && L.canRaise);
    if (enabled && L.canRaise) syncRaiseInputs(L);
  }

  function render() {
    if (!state) return;
    els.seat.forEach(function (_, i) { renderSeat(i); });
    renderBoard();
    els.handInfo.textContent = currentHandName();
    renderResult();
    renderLog();
    renderControls();
  }

  function showToast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.remove(); }, 2200);
  }

  function scheduleAI() {
    clearTimeout(aiTimer);
    var gen = ++aiGen;
    if (!state || state.street === 'complete' || state.toAct == null) return;
    var seat = state.toAct;
    if (seat === 0) return;
    render();
    aiTimer = setTimeout(function () {
      if (gen !== aiGen || !state || state.toAct !== seat || state.street === 'complete') return;
      var act = P.aiAction(state, seat, difficulty, Math.random);
      var res = P.applyAction(state, seat, act);
      if (!res.ok) {
        var L = P.legalActions(state, seat);
        var fb = L && L.canCheck ? { type: 'check' } : (L && L.canCall ? { type: 'call' } : { type: 'fold' });
        P.applyAction(state, seat, fb);
      }
      render();
      scheduleAI();
    }, 620);
  }

  function submit(action) {
    if (!state || state.toAct !== 0 || state.street === 'complete') {
      showToast(t('toastWait'));
      return;
    }
    var res = P.applyAction(state, 0, action);
    if (!res.ok) {
      showToast(t('toastIllegal'));
      return;
    }
    render();
    scheduleAI();
  }

  function newHand() {
    clearTimeout(aiTimer);
    aiGen++;
    var anyChips = state.players.filter(function (p) { return p.chips > 0; }).length;
    if (state.players[0].chips <= 0 || anyChips < 2) {
      P.resetStacks(state);
      state.dealer = 0;
      state.handNo = 0;
      showToast(t('toastReset'));
    }
    P.startHand(state);
    render();
    if (state.toAct === 0) showToast(t('toastYourTurn'));
    scheduleAI();
  }

  function restart() {
    clearTimeout(aiTimer);
    aiGen++;
    P.resetStacks(state);
    state.dealer = 0;
    state.handNo = 0;
    P.startHand(state);
    render();
    scheduleAI();
  }

  function updateRaiseValue(v) {
    var L = P.legalActions(state, 0);
    if (!L || !L.canRaise) return;
    v = Math.round(Number(v) || L.minRaiseTo);
    v = Math.max(L.minRaiseTo, Math.min(L.maxRaiseTo, v));
    els.amount.value = String(v);
    els.slider.value = String(v);
  }

  els.fold.addEventListener('click', function () { submit({ type: 'fold' }); });
  els.check.addEventListener('click', function () { submit({ type: 'check' }); });
  els.call.addEventListener('click', function () { submit({ type: 'call' }); });
  els.raise.addEventListener('click', function () { submit({ type: 'raise', to: Number(els.amount.value) }); });
  els.allin.addEventListener('click', function () { submit({ type: 'allin' }); });
  els.slider.addEventListener('input', function () { updateRaiseValue(els.slider.value); });
  els.amount.addEventListener('input', function () { updateRaiseValue(els.amount.value); });
  els.presetMin.addEventListener('click', function () {
    var L = P.legalActions(state, 0); if (L && L.canRaise) updateRaiseValue(L.minRaiseTo);
  });
  els.presetHalf.addEventListener('click', function () {
    var L = P.legalActions(state, 0); if (!L || !L.canRaise) return;
    var pot = P.potTotal(state);
    var target = state.currentBet + Math.max(state.minRaise, Math.round(pot / 2));
    updateRaiseValue(target);
  });
  els.presetPot.addEventListener('click', function () {
    var L = P.legalActions(state, 0); if (!L || !L.canRaise) return;
    var pot = P.potTotal(state);
    var target = state.currentBet + Math.max(state.minRaise, pot);
    updateRaiseValue(target);
  });
  els.next.addEventListener('click', newHand);
  els.restart.addEventListener('click', restart);
  els.difficulty.addEventListener('change', function () { difficulty = els.difficulty.value; });
  document.querySelectorAll('[data-lang]').forEach(function (btn) {
    btn.addEventListener('click', function () { setLang(btn.getAttribute('data-lang')); });
  });

  updateStatic();
  state = P.createTable({
    names: ['You', 'AI 1', 'AI 2', 'AI 3'],
    startingChips: 1000,
    sb: 10,
    bb: 20,
    seed: (Date.now() ^ (Math.random() * 0x7fffffff)) >>> 0
  });
  P.startHand(state);
  render();
  if (state.toAct === 0) showToast(t('toastYourTurn'));
  scheduleAI();
})();
</script>
<script src="/games/shared/share.js" data-name-zh="德州扑克" data-name-en="Texas Hold'em" data-name-id="Texas Hold'em"></script>
