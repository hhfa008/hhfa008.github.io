<style>
:root{
  --night:#110c17;--night-2:#1b1424;--night-3:#261b33;--line:#3a2b4d;
  --ink:#f1eaf7;--muted:#b6a8c6;--amber:#ffc86b;--amber-2:#f0a93c;
  --vermilion:#ef6b4f;--moss:#8fd6a4;--indigo:#9db0ff;--silver:#dce6f5;
  --card:#241a31;--card-2:#2f2240;--good:#7fe0a0;--bad:#ff8272;
  --safe: max(12px, env(safe-area-inset-left));
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--ink);
  background:
    radial-gradient(900px 480px at 50% -160px, rgba(255,190,90,.16), transparent 62%),
    radial-gradient(700px 380px at 10% 110%, rgba(120,90,220,.16), transparent 65%),
    linear-gradient(180deg,var(--night) 0%,#0b0811 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
a{color:var(--amber)}
.top{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding:12px var(--safe);border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(12,9,17,.72);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-size:16px;line-height:1.2;margin:0;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.top-btn{
  border:1px solid var(--line);background:var(--night-2);border-radius:9px;
  padding:8px 11px;font-size:13px;cursor:pointer;min-height:36px;
}
.top-btn:hover{border-color:var(--amber)}
.top-btn.active{border-color:var(--amber);color:var(--amber)}
.lang{display:flex;gap:4px}
.lang button{padding:7px 9px;border-radius:8px;border:1px solid transparent;background:transparent;font-size:12px;cursor:pointer;color:var(--muted)}
.lang button.on{border-color:var(--line);color:var(--ink);background:var(--night-3)}
main{max-width:1040px;margin:0 auto;padding:12px var(--safe) 28px}
.statusbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
  border:1px solid var(--line);background:rgba(27,20,36,.8);border-radius:12px;
  padding:9px 12px;font-size:13px;margin-bottom:10px;
}
.statusbar strong{color:var(--amber);font-weight:600}
.thinking{color:var(--amber);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.arena{display:grid;gap:10px}
.side{border:1px solid var(--line);border-radius:14px;background:rgba(22,16,30,.66);padding:10px}
.side.enemy{background:linear-gradient(180deg,rgba(58,30,40,.4),rgba(22,16,30,.66))}
.side.self{background:linear-gradient(180deg,rgba(22,16,30,.66),rgba(28,40,44,.38))}
.side-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:12px;color:var(--muted);margin-bottom:8px}
.side-head .who{color:var(--ink);font-weight:600;font-size:13px}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:rgba(0,0,0,.2);white-space:nowrap}
.pill b{color:var(--ink);font-weight:600}
.core{
  border:1px solid #6a4a2a;border-radius:10px;padding:5px 10px;background:rgba(255,190,90,.08);
  color:var(--amber);font-weight:600;display:inline-flex;align-items:center;gap:6px;
}
.core.targetable{cursor:pointer;outline:2px solid var(--vermilion);animation:pulse 1s infinite}
.lanes{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 8px;min-height:154px;align-items:stretch}
.lanes.empty{min-height:60px}
.lanes .placeholder{color:var(--muted);font-size:12px;align-self:center;padding:10px}
.card{
  position:relative;flex:0 0 auto;width:112px;border:1px solid var(--line);border-radius:11px;
  background:linear-gradient(180deg,var(--card-2),var(--card));padding:6px;cursor:default;
  transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;
  user-select:none;
}
.card.unit{cursor:pointer}
.card.spell{width:104px}
.card:hover{transform:translateY(-2px)}
.card.selected{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,200,107,.35)}
.card.targetable{border-color:var(--vermilion);box-shadow:0 0 0 2px rgba(239,107,79,.45);cursor:pointer}
.card.ready{border-color:rgba(143,214,164,.55)}
.card.tired{opacity:.86}
.card .cost{
  position:absolute;top:-7px;left:-7px;width:24px;height:24px;border-radius:50%;
  background:var(--amber);color:#241a10;font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center;border:2px solid #2a1d12;
}
.card .art{height:52px;border-radius:7px;overflow:hidden;background:#0d0a12;margin-bottom:4px}
.card .art svg{display:block;width:100%;height:100%}
.card h3{font-size:12px;line-height:1.25;margin:0 0 2px;letter-spacing:.01em;min-height:30px}
.card .kind{font-size:10px;color:var(--muted);margin-bottom:3px}
.card .text{font-size:10px;line-height:1.4;color:#d9cfe6;min-height:42px}
.card .stats{display:flex;justify-content:space-between;gap:6px;margin-top:4px;font-size:11px;font-weight:600}
.card .stats .atk{color:var(--amber)}
.card .stats .hp{color:var(--moss)}
.card .stats .hp.hurt{color:var(--bad)}
.card .ability{
  margin-top:5px;width:100%;border:1px solid #7a5d2c;border-radius:7px;background:rgba(255,200,107,.12);
  color:var(--amber);font-size:10px;padding:4px 3px;cursor:pointer;
}
.card .ability:hover{background:rgba(255,200,107,.22)}
.hand-wrap{border:1px solid var(--line);border-radius:14px;background:rgba(22,16,30,.78);padding:9px}
.hand-head{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.hand{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;min-height:120px}
.hand .card{cursor:pointer}
.hand .card.dim{opacity:.55}
.hand .card.affordable{border-color:rgba(255,200,107,.45)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
.primary{
  border:1px solid #8a6426;border-radius:10px;background:linear-gradient(180deg,#ffce78,#eda63a);
  color:#241708;font-weight:700;padding:10px 18px;font-size:14px;cursor:pointer;min-height:42px;
}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{
  border:1px solid var(--line);border-radius:10px;background:var(--night-2);
  padding:9px 13px;font-size:13px;cursor:pointer;min-height:40px;
}
.ghost:hover{border-color:var(--amber)}
select.ghost{color:var(--ink);background:var(--night-2)}
.hint{font-size:12px;color:var(--muted);margin-left:auto;max-width:100%}
.logbox{border:1px solid var(--line);border-radius:12px;background:rgba(15,11,20,.72);padding:9px 12px;font-size:12px}
.logbox summary{cursor:pointer;color:var(--muted);font-size:12px;margin-bottom:4px}
#log{max-height:150px;overflow:auto;display:flex;flex-direction:column-reverse;gap:3px;color:var(--muted)}
#log div{line-height:1.45}
#log .hl{color:var(--amber)}
#log .bad{color:var(--bad)}
#log .good{color:var(--good)}
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);
  background:#2b1f3a;border:1px solid var(--line);color:var(--ink);border-radius:10px;
  padding:10px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#overlay{
  position:fixed;inset:0;background:rgba(8,5,12,.78);display:none;align-items:center;justify-content:center;
  padding:20px;z-index:70;backdrop-filter:blur(6px);
}
#overlay.show{display:flex}
.dialog{
  width:min(420px,100%);border:1px solid var(--line);border-radius:16px;background:#1d1528;
  padding:22px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.5);
}
.dialog h2{margin:0 0 8px;font-size:22px}
.dialog p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px}
.dialog .primary{width:100%}
footer{max-width:1040px;margin:0 auto;padding:0 var(--safe) 30px;font-size:12px;color:var(--muted);line-height:1.7}
@media (max-width:560px){
  .brand h1{font-size:14px}
  .brand small{display:none}
  .card{width:100px}
  .card .text{font-size:9.5px}
  .hint{margin-left:0;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

  </div>
  <a class="top-btn" href="rules.html" id="rulesLink">规则</a>
</header>

<main>
  <div class="statusbar" aria-live="polite">
    <span id="turnLabel">第 1 回合</span>
    <strong id="phaseLabel">你的回合</strong>
    <span class="thinking" id="thinking" hidden></span>
    <span class="pill" id="seedLabel"></span>
  </div>

  <div class="arena">
    <section class="side enemy" aria-label="对手">
      <div class="side-head">
        <span class="who" id="enemyName">对手 · 余烬守望</span>
        <span class="core" id="enemyCore">灯心 20</span>
        <span class="pill" id="enemyLampower">灯力 <b>0</b></span>
        <span class="pill" id="enemyHand">手牌 <b>0</b></span>
        <span class="pill" id="enemyDeck">牌库 <b>0</b></span>
      </div>
      <div class="lanes" id="enemyField"></div>
    </section>

    <section class="side self" aria-label="你">
      <div class="side-head">
        <span class="who" id="playerName">你 · 灯语者</span>
        <span class="core" id="playerCore">灯心 20</span>
        <span class="pill" id="playerLampower">灯力 <b>0</b></span>
        <span class="pill" id="playerDeck">牌库 <b>0</b></span>
        <span class="pill" id="playerDiscard">弃牌 <b>0</b></span>
      </div>
      <div class="lanes" id="playerField"></div>
    </section>
  </div>

  <div class="hand-wrap">
    <div class="hand-head">
      <span id="handLabel">你的手牌</span>
      <span id="handCount">0</span>
    </div>
    <div class="hand" id="playerHand" aria-live="polite"></div>
  </div>

  <div class="controls">
    <button type="button" class="primary" id="endTurn">结束回合</button>
    <button type="button" class="ghost" id="newGame">新对局</button>
    <label class="ghost" for="difficulty" id="difficultyLabel">AI 难度</label>
    <select class="ghost" id="difficulty">
      <option value="easy" id="optEasy">简单</option>
      <option value="normal" id="optNormal" selected>中等</option>
    </select>
    <span class="hint" id="hint"></span>
  </div>

  <details class="logbox" open>
    <summary id="logTitle">战报</summary>
    <div id="log" aria-live="polite"></div>
  </details>
</main>

<footer>
  <p id="footerText">本作为原创设计，与任何现有卡牌游戏无关。卡名、世界观、规则与卡面均为自创；引擎为通用集换式卡牌框架，卡牌数据由 JSON 描述。无外部资源、无追踪。</p>
</footer>

<div id="toast" role="status"></div>
<div id="overlay">
  <div class="dialog">
    <h2 id="overTitle"></h2>
    <p id="overText"></p>
    <button type="button" class="primary" id="restart">再来一局</button>
  </div>
</div>

<script id="sample-ai">
(function () {
  'use strict';

  function unitAt(state, id) {
    for (var p = 0; p < 2; p++) {
      var field = state.players[p].field;
      for (var i = 0; i < field.length; i++) {
        if (field[i].id === id) return field[i];
      }
    }
    return null;
  }

  function targetedUnits(state, actor, sel, chosen) {
    var enemy = state.players[actor === 0 ? 1 : 0].field;
    var own = state.players[actor].field;
    var list = [];
    if (sel.kind === 'core') return [];
    if (sel.side === 'self' || sel.side === 'any') list = list.concat(own);
    if (sel.side === 'enemy' || sel.side === 'any') list = list.concat(enemy);
    if (sel.mode === 'all') return list;
    if (sel.mode === 'random') return list;
    if (chosen) {
      var u = unitAt(state, chosen);
      return u ? [u] : [];
    }
    return list.slice(0, 1);
  }

  function effectScore(state, actor, effect, chosen) {
    var score = 0;
    var targets = effect.target ? targetedUnits(state, actor, effect.target, chosen) : [];
    var coreTarget = effect.target && effect.target.kind === 'core'
      ? state.players[effect.target.side === 'enemy' ? 1 - actor : actor]
      : null;
    var ops = effect.ops || [];
    for (var i = 0; i < ops.length; i++) {
      var op = ops[i];
      var amount = Number(op.amount) || 0;
      if (op.op === 'damage') {
        if (coreTarget) {
          score += amount * 1.3 + (coreTarget.core <= amount ? 60 : 0);
        }
        for (var t = 0; t < targets.length; t++) {
          var u = targets[t];
          score += Math.min(amount, u.hp) + (amount >= u.hp ? 2.6 : 0);
        }
      } else if (op.op === 'destroy') {
        for (var d = 0; d < targets.length; d++) score += targets[d].hp >= 4 ? 5 : 2.5;
      } else if (op.op === 'heal') {
        var low = state.players[actor].core < 10 ? 1.6 : 0.7;
        score += amount * low;
      } else if (op.op === 'draw') {
        score += amount * 1.15;
      } else if (op.op === 'buff') {
        score += (Number(op.atk) || 0) * 0.55 + (Number(op.hp) || 0) * 0.45;
      } else if (op.op === 'debuff') {
        score += (Number(op.atk) || 0) * 0.45 + (Number(op.hp) || 0) * 0.35;
      } else if (op.op === 'discard') {
        score += 0.7;
      } else if (op.op === 'resource') {
        score += amount * 0.5;
      }
    }
    return score;
  }

  function scoreAction(state, action) {
    var actor = state.activePlayer;
    var me = state.players[actor];
    var foe = state.players[actor === 0 ? 1 : 0];
    if (action.type === 'attack') {
      var attacker = unitAt(state, action.attacker);
      if (!attacker) return -100;
      if (action.target === 'core') {
        return foe.core <= attacker.atk ? 1000 : attacker.atk + 0.2;
      }
      var target = unitAt(state, action.target);
      if (!target) return -100;
      var dealt = Math.min(attacker.atk, target.hp);
      var kill = attacker.atk >= target.hp ? 2.8 : 0;
      var back = Math.min(target.atk, attacker.hp);
      var dying = back >= attacker.hp ? 1.4 : 0;
      return dealt + kill - back * 0.55 - dying;
    }
    if (action.type === 'playCard') {
      var card = null;
      for (var i = 0; i < me.hand.length; i++) if (me.hand[i].id === action.cardId) card = me.hand[i];
      if (!card) return -100;
      var def = state.defs[card.defId];
      var score = def.type === 'unit' ? def.atk * 0.45 + def.hp * 0.4 : 0;
      var effects = def.effects || [];
      for (var e = 0; e < effects.length; e++) {
        if (effects[e].trigger === 'onPlay') score += effectScore(state, actor, effects[e], action.target);
      }
      return score;
    }
    if (action.type === 'activate') {
      var unit = unitAt(state, action.unitId);
      if (!unit) return -100;
      var udef = state.defs[unit.defId];
      var ab = udef.abilities[action.abilityIndex];
      if (!ab) return -100;
      var s = 0;
      for (var k = 0; k < ab.ops.length; k++) {
        s += effectScore(state, actor, { target: ab.target, ops: [ab.ops[k]] }, action.target);
      }
      return s + 0.1;
    }
    return -0.05; // endTurn: lowest priority among neutral actions
  }

  function choose(state, actions, level, rng) {
    if (!actions.length) return null;
    if (level === 'easy') {
      var nonEnd = [];
      for (var i = 0; i < actions.length; i++) if (actions[i].type !== 'endTurn') nonEnd.push(actions[i]);
      if (nonEnd.length && rng() < 0.85) return nonEnd[Math.floor(rng() * nonEnd.length)];
      return actions[Math.floor(rng() * actions.length)];
    }
    var best = actions[0], bestScore = -Infinity;
    for (var j = 0; j < actions.length; j++) {
      var sc = scoreAction(state, actions[j]);
      if (sc > bestScore) { bestScore = sc; best = actions[j]; }
    }
    return best;
  }

  window.TCGSampleAI = { scoreAction: scoreAction, choose: choose };
})();
</script>

      core: 'Inti lampu {n}', lampower: 'Tenaga lampu {n}', hand: 'Kartu {n}', deck: 'Dek {n}', discard: 'Buang {n}',
      handLabel: 'Kartu di tanganmu', handCount: '{n} kartu',
      endTurn: 'Akhiri giliran', newGame: 'Duel baru', difficulty: 'Tingkat AI', easy: 'Mudah', medium: 'Sedang',
      hintIdle: 'Klik kartu tangan untuk memainkannya, atau klik lampu rohmu lalu lampu roh musuh atau inti lampu untuk menyerang.',
      hintPlay: 'Pilih target: klik lampu roh yang disorot.',
      hintAttack: 'Pilih target serangan: klik lampu roh musuh atau inti lampu yang disorot.',
      hintAbility: 'Pilih target: klik lampu roh yang disorot.',
      logTitle: 'Catatan pertarungan', footer: 'Karya orisinal, tidak terkait dengan permainan kartu mana pun yang sudah ada. Nama, dunia, aturan dan muka kartu dibuat sendiri; mesinnya adalah kerangka kartu koleksi generik dengan data JSON. Tanpa aset eksternal, tanpa pelacakan.',
      win: 'Inti lampumu masih menyala — kamu menang', lose: 'Inti lampumu padam', draw: 'Kedua lampu meredup bersama',
      reasonCore: 'Inti lampu salah satu pihak mencapai nol, duel selesai.',
      reasonDeck: 'Dek habis; pemain yang tidak bisa menarik kartu kalah.',
      reasonMaxTurns: 'Batas giliran tercapai; ditentukan oleh inti lampu dan papan.',
      reasonDraw: 'Inti lampu sama, jadi duel berakhir seri.',
      restart: 'Main lagi',
      notYourTurn: 'Ini bukan giliranmu.', notEnough: 'Tenaga lampu tidak cukup untuk kartu itu.',
      cannotPlay: 'Kartu itu tidak bisa dimainkan sekarang.', notReady: 'Lampu roh itu tidak bisa bertindak giliran ini.',
      targetInvalid: 'Target tidak sah.', abilityUsed: 'Kemampuan itu sudah dipakai giliran ini.',
      matchOver: 'Duel sudah selesai.', illegal: 'Tindakan itu tidak sah.',
      noTarget: 'Tidak ada target sah.', ability: 'Aktifkan',
      enemyCard: 'Itu lampu roh milik lawan.',
      logStart: 'Duel dimulai. Kamu bergerak dulu dan melewati tarikan pertama.',
      turnStart: 'Giliran {turn} · {who} · tenaga lampu {res}',
      play: '{who} memainkan {name} ({cost} tenaga lampu)',
      attackCore: '{a} menyerang inti lampu sebesar {n}',
      attackUnit: '{a} berhadapan dengan {t}: {n} kerusakan, {r} balasan',
      damage: '{t} menerima {n} kerusakan',
      heal: '{t} pulih {n}',
      draw: '{who} menarik {n} kartu',
      discard: '{who} membuang {n} kartu',
      death: '{name} padam',
      destroy: '{name} hancur',
      buff: '{name} makin terang',
      debuff: '{name} meredup',
      activate: '{name} mengaktifkan kemampuan',
      deckOut: 'Dek {who} habis',
      winEvent: 'Pemenang: {who} ({reason})',
      coreName: 'inti lampu', you: 'Kamu', opponent: 'Lawan'
    }
  };

  var KEY_LOCAL = { not_enough_lampower: 'notEnough', target_invalid: 'targetInvalid', target_required: 'noTarget', unit_not_ready: 'notReady', unit_not_found: 'targetInvalid', card_not_in_hand: 'cannotPlay', not_your_turn: 'notYourTurn', ability_used: 'abilityUsed', ability_not_found: 'illegal', match_over: 'matchOver', unexpected_target: 'targetInvalid' };

  // Shared switcher: same storage key, same 'zh' fallback, same '.lang button'
  // row. Storage reads and click wiring now live in games/shared/i18n.js.
  var i18n = I18n.create({
    strings: TEXT,
    defaultLang: 'zh',
    storageKey: LANG_KEY,
    buttons: '.lang button'
  });
  var lang = i18n.lang();

  function $(id) { return document.getElementById(id); }
  function t(key) { return i18n.t(key); }
  function fmt(s, map) {
    return String(s).replace(/\{(\w+)\}/g, function (m, k) {
      return map[k] === undefined ? m : String(map[k]);
    });
  }
  function nameOf(defId) {
    var data = D.CARDS[defId];
    var def = defId;
    if (data && data.name) return data.name[lang] || data.name.en || defId;
    return def;
  }
  function textOf(defId) {
    var data = D.CARDS[defId];
    return data && data.text ? (data.text[lang] || data.text.en || '') : '';
  }
  function kindOf(type) {
    if (type === 'unit') return lang === 'zh' ? '灯灵' : (lang === 'id' ? 'Lampu roh' : 'Lampwight');
    return lang === 'zh' ? '灯语' : (lang === 'id' ? 'Kata lampu' : 'Lampword');
  }

  var match = null;
  var seed = 0;
  var difficulty = 'normal';
  var sel = null;
  var lastLog = [];
  var aiRng = null;
  var aiBusy = false;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var x = Math.imul(a ^ (a >>> 15), 1 | a);
      x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { el.classList.remove('show'); }, 1900);
  }

  function newMatch() {
    seed = (Date.now() % 1000000007) >>> 0;
    match = TCG.createMatch({
      players: [{ deck: D.DECK.slice() }, { deck: D.DECK.slice() }],
      cardPool: D.CARDS,
      seed: seed,
      rules: D.RULES
    });
    aiRng = mulberry32((seed ^ 0x9e3779b9) >>> 0);
    sel = null;
    seenDefs = {};
    lastLog = [{ type: 'logStart' }];
    aiBusy = false;
    $('overlay').classList.remove('show');
    render();
    scheduleAI();
  }

  function addEvents(events) {
    if (!events) return;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.type === 'draw' && e.opening) continue;
      lastLog.push(e);
    }
    if (lastLog.length > 60) lastLog = lastLog.slice(-60);
  }

  function actionLabel(a) {
    if (a.type === 'playCard') {
      var card = findInSnapshot(a.cardId);
      return card ? nameOf(card.defId) : a.cardId;
    }
    if (a.type === 'attack') return a.attacker;
    if (a.type === 'activate') return a.unitId;
    return a.type;
  }

  function findInSnapshot(id) {
    if (!match) return null;
    var st = match.state;
    for (var p = 0; p < 2; p++) {
      var zones = [st.players[p].hand, st.players[p].field];
      for (var z = 0; z < zones.length; z++) {
        for (var i = 0; i < zones[z].length; i++) if (zones[z][i].id === id) return zones[z][i];
      }
    }
    return null;
  }

  function applyAction(action) {
    if (!match) return false;
    try {
      var events = match.apply(action);
      addEvents(events);
      sel = null;
      render();
      if (match.state.phase === 'over') showOver();
      else scheduleAI();
      return true;
    } catch (e) {
      var key = KEY_LOCAL[e && e.code] || 'illegal';
      toast(t(key));
      if (e && e.code === 'target_required') sel = null;
      render();
      return false;
    }
  }

  function actMatchesSel(a) {
    if (!sel) return false;
    if (sel.type === 'play') return a.type === 'playCard' && a.cardId === sel.cardId;
    if (sel.type === 'attack') return a.type === 'attack' && a.attacker === sel.attacker;
    if (sel.type === 'activate') return a.type === 'activate' && a.unitId === sel.unitId && a.abilityIndex === sel.abilityIndex;
    return false;
  }

  function currentActions() {
    if (!match) return [];
    if (match.state.phase === 'over') return [];
    return match.legalActions(0);
  }

  function cardEl(card, owner, st, targetMap, targetCore) {
    var def = st.defs[card.defId];
    var data = D.CARDS[card.defId];
    var el = document.createElement('div');
    var classes = ['card', def.type];
    if (owner === 0 && st.activePlayer === 0 && card.ready && card.playedTurn < st.turn) classes.push('ready');
    if (owner === 0 && !(card.ready && card.playedTurn < st.turn)) classes.push('tired');
    if (sel) {
      if (sel.type === 'attack' && sel.attacker === card.id) classes.push('selected');
      if (sel.type === 'play' && sel.cardId === card.id) classes.push('selected');
      if (sel.type === 'activate' && sel.unitId === card.id) classes.push('selected');
      if (targetMap && targetMap[card.id]) classes.push('targetable');
    }
    if (owner === 0 && def.cost > st.players[0].resource) classes.push('dim');
    if (owner === 0 && def.cost <= st.players[0].resource) classes.push('affordable');
    el.className = classes.join(' ');
    el.setAttribute('data-card', card.id);
    el.setAttribute('role', 'group');
    el.setAttribute('aria-label', nameOf(card.defId));

    var cost = document.createElement('span');
    cost.className = 'cost';
    cost.textContent = def.cost;
    cost.title = t('lampower').replace(/\s.*$/, '');
    el.appendChild(cost);

    var art = document.createElement('div');
    art.className = 'art';
    art.innerHTML = (data && data.art) || '';
    el.appendChild(art);

    var h = document.createElement('h3');
    h.textContent = nameOf(card.defId);
    el.appendChild(h);

    var kind = document.createElement('div');
    kind.className = 'kind';
    kind.textContent = kindOf(def.type);
    el.appendChild(kind);

    var text = document.createElement('div');
    text.className = 'text';
    text.textContent = textOf(card.defId);
    el.appendChild(text);

    if (def.type === 'unit') {
      var stats = document.createElement('div');
      stats.className = 'stats';
      var atk = document.createElement('span');
      atk.className = 'atk';
      atk.textContent = (lang === 'zh' ? '光 ' : (lang === 'id' ? 'Cahaya ' : 'Radiance ')) + card.atk;
      var hp = document.createElement('span');
      hp.className = 'hp' + (card.hp < card.maxHp ? ' hurt' : '');
      hp.textContent = (lang === 'zh' ? '焰 ' : (lang === 'id' ? 'Nyala ' : 'Flare ')) + card.hp + (card.hp < card.maxHp ? '/' + card.maxHp : '');
      stats.appendChild(atk); stats.appendChild(hp);
      el.appendChild(stats);

      if (owner === 0 && st.activePlayer === 0) {
        var acts = match.legalActions(0).filter(function (a) {
          return a.type === 'activate' && a.unitId === card.id;
        });
        if (acts.length) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'ability';
          btn.textContent = t('ability') + ' · ' + actionsCost(acts[0]);
          btn.addEventListener('click', function (ev) {
            ev.stopPropagation();
            startAbility(card.id);
          });
          el.appendChild(btn);
        }
      }
    }

    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      onCard(card, owner);
    });
    return el;
  }

  function actionsCost(a) {
    var st = match.state;
    var unit = null;
    for (var p = 0; p < 2; p++) {
      for (var i = 0; i < st.players[p].field.length; i++) {
        if (st.players[p].field[i].id === a.unitId) unit = st.players[p].field[i];
      }
    }
    if (!unit) return '';
    var def = st.defs[unit.defId];
    var ab = def.abilities[a.abilityIndex];
    return ab ? ab.cost + ' ' + (lang === 'zh' ? '灯力' : (lang === 'id' ? 'tenaga' : 'lampower')) : '';
  }

  function onCard(card, owner) {
    if (!match) return;
    var st = match.state;
    if (st.phase === 'over') return;
    // A click on a highlighted target resolves the pending selection first.
    if (sel) {
      var acts = currentActions();
      for (var i = 0; i < acts.length; i++) {
        if (actMatchesSel(acts[i]) && acts[i].target === card.id) {
          applyAction(acts[i]);
          return;
        }
      }
    }
    if (owner !== 0) {
      toast(t('enemyCard'));
      return;
    }
    // Hand cards are handled by onHand; only field units start an attack.
    var onField = false;
    for (var u = 0; u < st.players[0].field.length; u++) {
      if (st.players[0].field[u].id === card.id) onField = true;
    }
    if (!onField) return;
    if (st.activePlayer !== 0) {
      toast(t('notYourTurn'));
      return;
    }
    // Own field unit: begin an attack selection.
    var attacks = currentActions().filter(function (a) {
      return a.type === 'attack' && a.attacker === card.id;
    });
    if (attacks.length) {
      sel = { type: 'attack', attacker: card.id };
      render();
      return;
    }
    toast(t('notReady'));
  }

  function onHand(card) {
    if (!match) return;
    var st = match.state;
    if (st.phase === 'over') return;
    if (st.activePlayer !== 0) { toast(t('notYourTurn')); return; }
    var plays = currentActions().filter(function (a) {
      return a.type === 'playCard' && a.cardId === card.id;
    });
    if (!plays.length) {
      var def = st.defs[card.defId];
      if (st.players[0].resource < def.cost) toast(t('notEnough'));
      else toast(t('cannotPlay'));
      return;
    }
    var needsTarget = false;
    for (var i = 0; i < plays.length; i++) if (plays[i].target) needsTarget = true;
    if (needsTarget) {
      sel = { type: 'play', cardId: card.id };
      render();
    } else {
      applyAction(plays[0]);
    }
  }

  function startAbility(unitId) {
    if (!match || match.state.phase === 'over') return;
    if (match.state.activePlayer !== 0) { toast(t('notYourTurn')); return; }
    var acts = currentActions().filter(function (a) {
      return a.type === 'activate' && a.unitId === unitId;
    });
    if (!acts.length) { toast(t('abilityUsed')); return; }
    var hasTarget = false;
    for (var i = 0; i < acts.length; i++) if (acts[i].target) hasTarget = true;
    if (hasTarget) {
      sel = { type: 'activate', unitId: unitId, abilityIndex: acts[0].abilityIndex };
      render();
    } else {
      applyAction(acts[0]);
    }
  }

  function onCoreClick() {
    if (!match || !sel || sel.type !== 'attack') return;
    var acts = currentActions();
    for (var i = 0; i < acts.length; i++) {
      if (actMatchesSel(acts[i]) && acts[i].target === 'core') {
        applyAction(acts[i]);
        return;
      }
    }
    toast(t('targetInvalid'));
  }

  function scheduleAI() {
    if (!match || aiBusy) return;
    var st = match.state;
    if (st.phase === 'over' || st.activePlayer !== 1) return;
    aiBusy = true;
    render();
    setTimeout(aiStep, 430);
  }

  function aiStep() {
    if (!match) { aiBusy = false; return; }
    var st = match.state;
    if (st.phase === 'over' || st.activePlayer !== 1) { aiBusy = false; render(); return; }
    var actions = match.legalActions(1);
    var action = AI.choose(st, actions, difficulty, aiRng);
    if (!action) { aiBusy = false; return; }
    try {
      var events = match.apply(action);
      addEvents(events);
    } catch (e) {
      try { addEvents(match.apply({ type: 'endTurn' })); } catch (e2) { /* no-op */ }
    }
    render();
    if (match.state.phase === 'over') { aiBusy = false; showOver(); return; }
    if (match.state.activePlayer === 1) {
      setTimeout(aiStep, 430);
    } else {
      aiBusy = false;
      render();
    }
  }

  function render() {
    if (!match) return;
    var st = match.state;
    var me = st.players[0], foe = st.players[1];
    var acts = currentActions();
    var targetMap = {}, targetCore = false;
    if (sel) {
      for (var i = 0; i < acts.length; i++) {
        if (actMatchesSel(acts[i])) {
          if (acts[i].target === 'core') targetCore = true;
          else if (acts[i].target) targetMap[acts[i].target] = 1;
        }
      }
    }

    $('title').textContent = t('title');
    $('subtitle').textContent = t('subtitle');
    $('rulesLink').textContent = t('rules');
    $('turnLabel').textContent = fmt(t('turnLabel'), { n: st.turn });
    $('phaseLabel').textContent = st.phase === 'over' ? t('matchOver') : (st.activePlayer === 0 ? t('yourTurn') : t('aiTurn'));
    var think = $('thinking');
    think.hidden = !(aiBusy && st.activePlayer === 1 && st.phase !== 'over');
    think.textContent = think.hidden ? '' : t('thinking');
    $('seedLabel').textContent = fmt(t('seed'), { n: st.seed });

    $('enemyName').textContent = t('enemyName');
    $('playerName').textContent = t('playerName');
    $('enemyCore').textContent = fmt(t('core'), { n: Math.max(0, foe.core) });
    $('playerCore').textContent = fmt(t('core'), { n: Math.max(0, me.core) });
    $('enemyLampower').innerHTML = fmt(t('lampower'), { n: '<b>' + foe.resource + '</b>' });
    $('playerLampower').innerHTML = fmt(t('lampower'), { n: '<b>' + me.resource + '</b>' });
    $('enemyHand').innerHTML = fmt(t('hand'), { n: '<b>' + foe.hand.length + '</b>' });
    $('enemyDeck').innerHTML = fmt(t('deck'), { n: '<b>' + foe.deck.length + '</b>' });
    $('playerDeck').innerHTML = fmt(t('deck'), { n: '<b>' + me.deck.length + '</b>' });
    $('playerDiscard').innerHTML = fmt(t('discard'), { n: '<b>' + me.discard.length + '</b>' });
    $('handLabel').textContent = t('handLabel');
    $('handCount').textContent = fmt(t('handCount'), { n: me.hand.length });
    $('endTurn').textContent = t('endTurn');
    $('newGame').textContent = t('newGame');
    $('difficultyLabel').textContent = t('difficulty');
    $('optEasy').textContent = t('easy');
    $('optNormal').textContent = t('medium');
    $('logTitle').textContent = t('logTitle');
    $('footerText').textContent = t('footer');
    $('restart').textContent = t('restart');
    $('hint').textContent = !sel ? t('hintIdle') : (sel.type === 'attack' ? t('hintAttack') : (sel.type === 'activate' ? t('hintAbility') : t('hintPlay')));
    $('endTurn').disabled = st.phase !== 'main' || st.activePlayer !== 0;
    $('enemyCore').classList.toggle('targetable', targetCore);
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;

    var ef = $('enemyField');
    ef.innerHTML = '';
    ef.classList.toggle('empty', foe.field.length === 0);
    if (!foe.field.length) {
      var ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.textContent = lang === 'zh' ? '对手场上没有灯灵' : (lang === 'id' ? 'Tidak ada lampu roh lawan' : 'No enemy lampwights');
      ef.appendChild(ph);
    } else {
      for (var e = 0; e < foe.field.length; e++) ef.appendChild(cardEl(foe.field[e], 1, st, targetMap, targetCore));
    }

    var pf = $('playerField');
    pf.innerHTML = '';
    pf.classList.toggle('empty', me.field.length === 0);
    if (!me.field.length) {
      var ph2 = document.createElement('div');
      ph2.className = 'placeholder';
      ph2.textContent = lang === 'zh' ? '你的场上没有灯灵' : (lang === 'id' ? 'Tidak ada lampu rohmu' : 'No lampwights on your side');
      pf.appendChild(ph2);
    } else {
      for (var f = 0; f < me.field.length; f++) pf.appendChild(cardEl(me.field[f], 0, st, targetMap, targetCore));
    }

    var hand = $('playerHand');
    hand.innerHTML = '';
    for (var hIdx = 0; hIdx < me.hand.length; hIdx++) {
      var hc = cardEl(me.hand[hIdx], 0, st, targetMap, targetCore);
      hc.classList.add('in-hand');
      (function (card) {
        hc.addEventListener('click', function (ev) { ev.stopPropagation(); onHand(card); });
      })(me.hand[hIdx]);
      hand.appendChild(hc);
    }

    renderLog(st);
  }

  function whoName(p) { return p === 0 ? t('you') : t('opponent'); }

  function renderLog(st) {
    var box = $('log');
    box.innerHTML = '';
    for (var i = lastLog.length - 1; i >= 0; i--) {
      var e = lastLog[i], line = document.createElement('div'), text = '', cls = '';
      switch (e.type) {
        case 'logStart': text = t('logStart'); break;
        case 'turnStart': text = fmt(t('turnStart'), { turn: e.turn, who: whoName(e.player), res: e.resource }); break;
        case 'play': text = fmt(t('play'), { who: whoName(e.player), name: nameOf(e.defId), cost: e.cost }); cls = 'hl'; break;
        case 'attack':
          if (e.target === 'core') text = fmt(t('attackCore'), { a: nameOf(defIdOfCard(e.attacker, st)), n: e.amount });
          else text = fmt(t('attackUnit'), { a: nameOf(defIdOfCard(e.attacker, st)), t: nameOf(defIdOfCard(e.target, st)), n: e.amount, r: e.retaliation });
          cls = 'hl'; break;
        case 'damage': text = fmt(t('damage'), { t: e.target === 'core' ? t('coreName') : nameOf(defIdOfCard(e.target, st)), n: e.amount }); cls = 'bad'; break;
        case 'heal': text = fmt(t('heal'), { t: e.target === 'core' ? t('coreName') : nameOf(defIdOfCard(e.target, st)), n: e.amount }); cls = 'good'; break;
        case 'draw': text = fmt(t('draw'), { who: whoName(e.player), n: e.count || 1 }); break;
        case 'discard': text = fmt(t('discard'), { who: whoName(e.player), n: 1 }); break;
        case 'death': text = fmt(t('death'), { name: nameOf(e.defId) }); cls = 'bad'; break;
        case 'destroy': text = fmt(t('destroy'), { name: nameOf(defIdOfCard(e.target, st)) }); cls = 'bad'; break;
        case 'buff': text = fmt(t('buff'), { name: nameOf(defIdOfCard(e.target, st)) }); cls = 'good'; break;
        case 'debuff': text = fmt(t('debuff'), { name: nameOf(defIdOfCard(e.target, st)) }); cls = 'bad'; break;
        case 'activate': text = fmt(t('activate'), { name: nameOf(defIdOfCard(e.unitId, st)) }); cls = 'hl'; break;
        case 'deckOut': text = fmt(t('deckOut'), { who: whoName(e.player) }); cls = 'bad'; break;
        case 'win': text = fmt(t('winEvent'), { who: e.player === null ? t('draw') : whoName(e.player), reason: e.reason }); cls = 'hl'; break;
        default: break;
      }
      if (!text) continue;
      line.textContent = text;
      if (cls) line.className = cls;
      box.appendChild(line);
    }
  }

  // Events carry card ids, but a card may have moved zones since. Keep a small
  // lookup over every zone plus defs seen in the log.
  var seenDefs = {};
  function defIdOfCard(id, st) {
    if (seenDefs[id]) return seenDefs[id];
    for (var p = 0; p < 2; p++) {
      var zones = [st.players[p].deck, st.players[p].hand, st.players[p].field, st.players[p].discard, st.players[p].exile];
      for (var z = 0; z < zones.length; z++) {
        for (var i = 0; i < zones[z].length; i++) {
          if (zones[z][i].id === id) { seenDefs[id] = zones[z][i].defId; return zones[z][i].defId; }
        }
      }
    }
    return id;
  }

  function showOver() {
    var st = match.state;
    var title = t('draw'), text = t('reasonDraw');
    if (st.winner === 0) { title = t('win'); text = t('reasonCore'); }
    else if (st.winner === 1) { title = t('lose'); text = t('reasonCore'); }
    if (st.winReason === 'deck') text = t('reasonDeck');
    else if (st.winReason === 'max_turns') {
      text = t('reasonMaxTurns');
      if (st.winner === null) title = t('draw');
    }
    $('overTitle').textContent = title;
    $('overText').textContent = text;
    $('overlay').classList.add('show');
  }

  // The shared switcher owns the click handlers; this hook keeps the page's
  // own wiring: `.on` highlight plus a full re-render on every switch.
  i18n.onLang(function (next) {
    lang = next;
    document.querySelectorAll('.lang button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-lang') === next);
    });
    render();
  });

  $('endTurn').addEventListener('click', function () {
    if (!match || match.state.phase === 'over') return;
    if (match.state.activePlayer !== 0) { toast(t('notYourTurn')); return; }
    applyAction({ type: 'endTurn' });
  });
  $('newGame').addEventListener('click', newMatch);
  $('restart').addEventListener('click', newMatch);
  $('difficulty').addEventListener('change', function (e) {
    difficulty = e.target.value === 'easy' ? 'easy' : 'normal';
  });
  $('enemyCore').addEventListener('click', onCoreClick);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { sel = null; render(); }
    if (e.key === 'e' && match && match.state.activePlayer === 0 && match.state.phase === 'main') {
      applyAction({ type: 'endTurn' });
    }
  });

  newMatch();
  i18n.apply();
})();
</script>

</body>
</html>
