<style>
#board {
  width: 390px;
  height: 234px;
  background-color: #1e1e1e;
  border: 1px solid #444;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

#board::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  height: 100%;
  background-color: #444;
}

.ball {
  position: absolute;
  width: 2px;
  height: 2px;
  background-color: #fff;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

.paddle {
  position: absolute;
  width: 2px;
  height: 16px;
  background-color: #fff;
  transform: translate(-50%, -50%);
}

.paddle.left {
  left: 4px;
}

.paddle.right {
  left: 386px;
}

@media (prefers-color-scheme: light) {
  #board {
    background-color: #f3ead9;
    border-color: #ccc;
  }

  .ball {
    background-color: #000;
  }

  .paddle {
    background-color: #000;
  }

  #board::before {
    background-color: #ccc;

<script>
var CORE = ArcadeKit.create({"ai":true,"speed":2});
var I18N = {
  en: { eyebrow:'Mini Game', title:'Pong Rapid', tagline:'Fast-paced table tennis', score:'Score', best:'Best', extraLabel:'Moves',
        boardAria:'Game board', playAgain:'Play again', newGame:'New game', hint:'Hint',
        note:'', rules:'Rules (Chinese)', hall:'All games', moreLink:'Built by an indie developer',
        overlayWin:'You win!', overlayLose:'Game over', overlayDraw:'Draw', hintText:'' },
  zh: { eyebrow:'迷你游戏', title:'乒乓·极速', tagline:'快节奏的乒乓球', score:'得分', best:'最高分', extraLabel:'步数',
        boardAria:'游戏棋盘', playAgain:'重新开始', newGame:'新游戏', hint:'提示',
        note:'', rules:'规则（中文）', hall:'所有游戏', moreLink:'由独立开发者制作',
        overlayWin:'你赢了！', overlayLose:'游戏结束', overlayDraw:'平局', hintText:'' },
  id: { eyebrow:'Permainan Mini', title:'Pong Cepat', tagline:'Tenis meja dengan kecepatan tinggi', score:'Skor', best:'Terbaik', extraLabel:'Langkah',
        boardAria:'Papan permainan', playAgain:'Main lagi', newGame:'Permainan baru', hint:'Petunjuk',
        note:'', rules:'Aturan (Bahasa Tiongkok)', hall:'Semua permainan', moreLink:'Dibuat oleh pengembang indie',
        overlayWin:'Kamu menang!', overlayLose:'Permainan berakhir', overlayDraw:'Seri', hintText:'' }
};

(function () {
  'use strict';
  var BEST_KEY = 'arcade.pong-fast.best';
  var E = {
    board: document.getElementById('board'),
    score: document.getElementById('stat-score'),
    best: document.getElementById('stat-best'),
    extra: document.getElementById('stat-extra'),
    overlay: document.getElementById('overlay'),
    overlayTitle: document.getElementById('overlay-title'),
    overlayText: document.getElementById('overlay-text'),
    feedback: document.getElementById('feedback'),
    btnNew: document.getElementById('btn-new'),
    btnHint: document.getElementById('btn-hint'),
    btnOverlay: document.getElementById('btn-overlay')
  };
  var S = CORE.newGame(Math.random);
  var best = Arcade.best(BEST_KEY, 0);

  function render() {
    var state = S;
    E.score.textContent = state.score[0] + ' - ' + state.score[1];
    E.best.textContent = best;
    E.extra.textContent = '';
    E.board.innerHTML = '';

    var ball = document.createElement('div');
    ball.className = 'ball';
    ball.style.left = (state.ball.x - 1) + 'px';
    ball.style.top = (state.ball.y - 1) + 'px';
    E.board.appendChild(ball);

    var leftPaddle = document.createElement('div');
    leftPaddle.className = 'paddle left';
    leftPaddle.style.top = (state.left.y - 8) + 'px';
    E.board.appendChild(leftPaddle);

    var rightPaddle = document.createElement('div');
    rightPaddle.className = 'paddle right';
    rightPaddle.style.top = (state.right.y - 8) + 'px';
    E.board.appendChild(rightPaddle);

    var status = CORE.status(S);
    if (status !== 'playing') {
      E.overlay.hidden = false;
      if (status === 'won') {
        E.overlayTitle.textContent = I18N[I18N.lang].overlayWin;
        E.overlayText.textContent = '';
      } else if (status === 'lost') {
        E.overlayTitle.textContent = I18N[I18N.lang].overlayLose;
        E.overlayText.textContent = '';
      } else if (status === 'draw') {
        E.overlayTitle.textContent = I18N[I18N.lang].overlayDraw;
        E.overlayText.textContent = '';
      }
    } else {
      E.overlay.hidden = true;
    }
  }

  function input(action) {
    var result = CORE.act(S, action, Math.random);
    if (result.changed) {
      S = result.state;
      if (result.gained > 0) {
        best = Arcade.setBest(BEST_KEY, Math.max(best, S.score[0] + S.score[1]));
      }
      render();
    }
  }

  function newGame() {
    S = CORE.newGame(Math.random);
    best = Arcade.best(BEST_KEY, 0);
    render();
  }

  E.btnNew.addEventListener('click', newGame);
  E.btnOverlay.addEventListener('click', newGame);
  Arcade.onKeys(Arcade.KEYMAP, input);
  Arcade.onSwipe(E.board, input);
  Arcade.onLang(render);
  Arcade.init({ strings: I18N, onLang: render });
  render();
})();
</script>
