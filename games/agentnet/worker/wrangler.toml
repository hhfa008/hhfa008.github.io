name = "agentnet"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "7f60cd77c5d0383f937b2053a1b0bca1"
workers_dev = true

# Intentionally NOT deployed yet. See README.md for deploy and rollback steps.

[observability]
enabled = true

[vars]
MOVE_TIMEOUT_MS = "60000"    # player to move loses after 60 s
ROOM_RECLAIM_MS = "300000"   # both seats offline -> room wiped after 5 min
LOG_TTL_MS = "86400000"      # finished logs retained 24 h
JOIN_TIMEOUT_MS = "600000"   # unstarted room expires after 10 min
MAX_ROOMS = "200"            # global active-room cap

[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchDO"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RegistryDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDO", "RegistryDO"]
