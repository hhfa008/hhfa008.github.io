name = "game-leaderboard"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "7f60cd77c5d0383f937b2053a1b0bca1"
workers_dev = true

[observability]
enabled = true

# KV namespace for leaderboard boards (binding: LB).
#
# REQUIRED BEFORE DEPLOY:
#   wrangler kv namespace create LB
# then paste the returned id below (replace REPLACE_WITH_KV_NAMESPACE_ID).
#
# Secrets:
#   wrangler secret put SALT     # random 32-byte value, required
# SALT is the per-deployment hash salt; it must never be committed here.
[[kv_namespaces]]
binding = "LB"
id = "00ac22a7f4ca406589bc9ee3ebbd99f7"
