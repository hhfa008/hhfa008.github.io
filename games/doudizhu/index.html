<script>
// __CORE_START__
var DDZ = (function () {
  'use strict';

  var SMALL_JOKER = 16, BIG_JOKER = 17;
  var SUITS = ['♠', '♥', '♣', '♦']; // spade heart club diamond
  var RED_SUITS = { 1: true, 3: true };

  function makeDeck() {
    var deck = [];
    for (var r = 3; r <= 15; r++) {
      for (var s = 0; s < 4; s++) {
        deck.push({ id: SUITS[s] + r, r: r, s: s });
      }
    }
    deck.push({ id: 'SJ', r: SMALL_JOKER, s: -1 });
    deck.push({ id: 'BJ', r: BIG_JOKER, s: -1 });
    return deck;
  }

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(deck, rand) {
    rand = rand || Math.random;
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    return deck;
  }

  function getRank(c) { return typeof c === 'number' ? c : c.r; }
  function getCardId(c) { return typeof c === 'number' ? String(c) : c.id; }

  function cardCmp(a, b) {
    var ra = getRank(a), rb = getRank(b);
    if (ra !== rb) return ra - rb;
    var sa = typeof a === 'number' ? 0 : a.s, sb = typeof b === 'number' ? 0 : b.s;
    return sa - sb;
  }
  function sortCards(cards) { return cards.sort(cardCmp); }

  function groupOf(cards) {
    var counts = {}, groups = {}, ranks = [], hand = cards.slice();
    for (var i = 0; i < hand.length; i++) {
      var r = getRank(hand[i]);
      if (!counts[r]) { counts[r] = 0; ranks.push(r); groups[r] = []; }
      counts[r]++; groups[r].push(hand[i]);
    }
    ranks.sort(function (a, b) { return a - b; });
    for (var k = 0; k < ranks.length; k++) groups[ranks[k]].sort(cardCmp);
    return { counts: counts, groups: groups, ranks: ranks, hand: hand };
  }

  /* ---------------- hand type detection ---------------- */

  function result(type, main, cards, extra) {
    var o = { type: type, main: main, count: cards.length, cards: cards.slice() };
    if (extra) for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) o[k] = extra[k];
    return o;
  }

  function consecutive(ranks) {
    for (var i = 1; i < ranks.length; i++) if (ranks[i] !== ranks[i - 1] + 1) return false;
    return true;
  }

  function detect(cards) {

  var S = {

  function t(key, vars) {
    var d = I18N[S.lang] || I18N.zh;
    var s = d[key] != null ? d[key] : (I18N.zh[key] != null ? I18N.zh[key] : key);
    if (vars) {
      for (var k in vars) {
        if (Object.prototype.hasOwnProperty.call(vars, k)) s = s.split('{' + k + '}').join(vars[k]);
      }
    }
    return s;
  }

  function pickLang() {
    var saved = null;
    try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
    if (saved && I18N[saved]) return saved;
    var n = (navigator.language || 'zh').toLowerCase();
    if (n.indexOf('en') === 0) return 'en';
    if (n.indexOf('id') === 0 || n.indexOf('in') === 0) return 'id';
    return 'zh';
  }

  function nameOf(p) { return p === 0 ? t('you') : p === 1 ? t('aiLeft') : t('aiRight'); }
  function typeName(type) { return t('t_' + type); }
  function log(text) {
    S.log.push(text);
    if (S.log.length > 30) S.log.shift();
  }

  function later(fn, ms) {
    var gen = S.gen;
    setTimeout(function () { if (gen === S.gen) fn(); }, ms);
  }

  function sortHand(h) { return DDZ.sortCards(h); }

  function dealNew() {
    S.gen++;
    S.hands = [[], [], []];
    var d = DDZ.deal(Math.random);
    S.hands = [d.hands[0].slice(), d.hands[1].slice(), d.hands[2].slice()];
    S.bottom = d.bottom.slice();
    S.phase = 'bid';
    S.landlord = -1;
    S.turn = 0;
    S.lastPlay = null;
    S.lastPlayer = -1;
    S.passes = 0;
    S.bid = 0;
    S.bidder = -1;
    S.bidTurn = 0;
    S.firstBidder = Math.floor(Math.random() * 3);
    S.selected = {};
    S.statusKey = '';
    S.statusVars = null;
    S.log = [];
    S.act = {};
    S.winner = -1;
    render();
    stepBid();
  }

  /* ---------------- bidding ---------------- */

  function stepBid() {
    if (S.phase !== 'bid') return;
    if (S.bid >= 3 || S.bidTurn >= 3) { finishBid(); return; }
    var p = (S.firstBidder + S.bidTurn) % 3;
    S.turn = p;
    if (p === 0) {
      S.statusKey = 'yourBid';
      render();
    } else {
      S.statusKey = 'aiBidThinking';
      S.statusVars = { name: nameOf(p) };
      render();
      later(function () { aiBidTurn(p); }, 760);
    }
  }

  function aiBidTurn(p) {
    if (S.phase !== 'bid' || S.turn !== p) return;
    var score = DDZ.aiBid(S.hands[p], S.bid);
    bidAction(p, score);
    render();
    later(stepBid, 480);
  }

  function bidAction(p, score) {
    if (score > S.bid) {
      S.bid = score;
      S.bidder = p;
      log(nameOf(p) + ' ' + t('bidScore', { n: score }));
    } else {
      log(nameOf(p) + ' ' + t('bidPass'));
    }
    S.bidTurn++;
  }

  function finishBid() {
    if (S.phase !== 'bid') return;
    if (S.bidder < 0) {
      S.phase = 'redeal';
      S.statusKey = 'allPass';
      log(t('allPass'));
      render();
      later(dealNew, 1500);
      return;
    }
    S.landlord = S.bidder;
    S.hands[S.landlord] = S.hands[S.landlord].concat(S.bottom);
    sortHand(S.hands[S.landlord]);
    S.phase = 'play';
    S.turn = S.landlord;
    S.lastPlay = null;
    S.lastPlayer = -1;
    S.passes = 0;
    S.selected = {};
    S.statusKey = S.landlord === 0 ? 'youLandlord' : 'aiLandlord';
    S.statusVars = { name: nameOf(S.landlord) };
    log(nameOf(S.landlord) + ' · ' + t('landlord'));
    render();
    if (S.turn !== 0) later(aiTurn, 850);
  }

  /* ---------------- play ---------------- */

  function humanBid(score) {
    if (S.phase !== 'bid' || S.turn !== 0) return;
    bidAction(0, score);
    render();
    stepBid();
  }

  function removeCards(hand, cards) {
    for (var i = 0; i < cards.length; i++) {
      var idx = hand.indexOf(cards[i]);
      if (idx >= 0) hand.splice(idx, 1);
    }
  }

  function doPlay(p, cards) {
    var d = DDZ.detect(cards);
    if (!d) return false;
    if (S.lastPlay && !DDZ.canBeat(d, S.lastPlay)) return false;
    removeCards(S.hands[p], cards);
    S.lastPlay = d;
    S.lastPlayer = p;
    S.passes = 0;
    S.selected = {};
    S.statusKey = S.turn === 0 ? 'yourTurn' : 'aiTurn';
    S.statusVars = { name: nameOf((p + 1) % 3) };
    S.act[p] = typeName(d.type) + ' ×' + d.count;
    log(nameOf(p) + ' ' + t('playedType', { type: typeName(d.type) }));
    if (!S.hands[p].length) { endGame(p); return true; }
    S.turn = (p + 1) % 3;
    if (S.turn === 0) {
      S.statusKey = 'yourTurn';
      S.statusVars = null;
    } else {
      S.statusKey = 'aiTurn';
      S.statusVars = { name: nameOf(S.turn) };
    }
    render();
    if (S.turn !== 0) later(aiTurn, 720);
    return true;
  }

  function doPass(p) {
    S.passes++;
    S.act[p] = t('passed');
    log(nameOf(p) + ' ' + t('pass'));
    if (S.passes >= 2) {
      S.lastPlay = null;
      S.lastPlayer = -1;
      S.passes = 0;
      log(t('bothPassed', { name: nameOf((p + 1) % 3) }));
    }
    S.turn = (p + 1) % 3;
    if (S.turn === 0) {
      S.statusKey = 'yourTurn';
      S.statusVars = null;
    } else {
      S.statusKey = 'aiTurn';
      S.statusVars = { name: nameOf(S.turn) };
    }
    render();
    if (S.turn !== 0) later(aiTurn, 680);
  }

  function aiTurn() {
    if (S.phase !== 'play' || S.turn === 0) return;
    var p = S.turn;
    var ctx = { teammateLed: false, teammateCount: 0, opponentCount: 99 };
    if (p !== S.landlord && S.lastPlayer !== -1 && S.lastPlayer !== S.landlord) {
      ctx.teammateLed = true;
      ctx.teammateCount = S.hands[S.lastPlayer].length;
    }
    if (p === S.landlord) {
      var a = (p + 1) % 3, b = (p + 2) % 3;
      ctx.opponentCount = Math.min(S.hands[a].length, S.hands[b].length);
    } else {
      ctx.opponentCount = S.hands[S.landlord].length;
    }
    var play = S.lastPlay ? DDZ.aiFollow(S.hands[p], S.lastPlay, ctx) : DDZ.aiLead(S.hands[p]);
    if (!play) doPass(p);
    else doPlay(p, play.cards);
  }

  function humanPlay() {
    if (S.phase !== 'play' || S.turn !== 0) return;
    var hand = S.hands[0];
    var cards = hand.filter(function (c) { return S.selected[c.id]; });
    if (!cards.length) {
      S.statusKey = 'selectFirst'; S.statusVars = null; render(); return;
    }
    var d = DDZ.detect(cards);
    if (!d) {
      S.statusKey = 'invalidType'; S.statusVars = null; render(); return;
    }
    if (S.lastPlay && !DDZ.canBeat(d, S.lastPlay)) {
      S.statusKey = 'mustBeat'; S.statusVars = null; render(); return;
    }
    doPlay(0, cards);
  }

  function humanPass() {
    if (S.phase !== 'play' || S.turn !== 0 || !S.lastPlay) return;
    doPass(0);
  }

  function humanHint() {
    if (S.phase !== 'play' || S.turn !== 0) return;
    var s = DDZ.suggest(S.hands[0], S.lastPlay);
    if (!s) {
      S.statusKey = 'hintNone'; S.statusVars = null; render(); return;
    }
    S.selected = {};
    for (var i = 0; i < s.cards.length; i++) S.selected[s.cards[i].id] = 1;
    S.statusKey = 'hintFound';
    S.statusVars = { type: typeName(s.type) };
    render();
  }

  function endGame(winner) {
    S.phase = 'over';
    S.winner = winner;
    S.turn = -1;
    var landlordWon = winner === S.landlord;
    var humanWon = S.landlord === 0 ? landlordWon : !landlordWon;
    S.statusKey = humanWon ? 'youWin' : 'youLose';
    S.statusVars = null;
    if (S.landlord === 0) {
      S.resultKey = humanWon ? 'resultWinLandlord' : 'resultLoseLandlord';
    } else {
      S.resultKey = humanWon ? 'resultWinFarmer' : 'resultLoseFarmer';
    }
    log(t('landlordWin') + ' / ' + t('farmerWin'));
    render();
  }

  /* ---------------- rendering ---------------- */

  function cardHtml(c) {
    var r = DDZ.getRank(c);
    var red = c.s === 1 || c.s === 3;
    var sel = !!S.selected[c.id];
    if (r >= 16) {
      var big = r === DDZ.BIG_JOKER;
      return '<button type="button" class="card joker' + (red ? ' red' : '') + (sel ? ' sel' : '') +
        '" data-id="' + c.id + '" aria-pressed="' + (sel ? 'true' : 'false') + '" aria-label="' +
        (big ? 'Big Joker' : 'Small Joker') + '">' +
        '<span class="corner">' + (big ? '大' : '小') + '</span>' +
        '<span class="joker-tag">JOKER</span><span class="pip">王</span></button>';
    }
    return '<button type="button" class="card' + (red ? ' red' : '') + (sel ? ' sel' : '') +
      '" data-id="' + c.id + '" aria-pressed="' + (sel ? 'true' : 'false') + '" aria-label="' +
      DDZ.rankName(r) + DDZ.SUITS[c.s] + '">' +
      '<span class="corner">' + DDZ.rankName(r) + '<b>' + DDZ.SUITS[c.s] + '</b></span>' +
      '<span class="pip">' + DDZ.SUITS[c.s] + '</span></button>';
  }

  function miniHtml(c) {
    var r = DDZ.getRank(c);
    var red = c.s === 1 || c.s === 3;
    var txt = r >= 16 ? (r === DDZ.BIG_JOKER ? '大王' : '小王') : DDZ.rankName(r) + DDZ.SUITS[c.s];
    return '<span class="mini' + (red ? ' red' : '') + (r >= 16 ? ' joker' : '') + '">' + txt + '</span>';
  }

  function renderHand() {
    var h = S.hands[0].slice();
    sortHand(h);
    var html = '';
    for (var i = 0; i < h.length; i++) html += cardHtml(h[i]);
    els.hand.innerHTML = html;
    els.hand.setAttribute('aria-label', t('yourHand') + ' (' + h.length + ')');
  }

  function renderBottom() {
    if (S.landlord < 0) {
      els.bottom.innerHTML = '<span class="back"></span><span class="back"></span><span class="back"></span>';
    } else {
      var b = S.bottom.slice();
      sortHand(b);
      els.bottom.innerHTML = b.map(miniHtml).join('');
    }
  }

  function renderLast() {
    if (!S.lastPlay) {
      els.last.innerHTML = '<span class="last-label">' + t('freeLead') + '</span>';
      return;
    }
    var cards = S.lastPlay.cards.slice();
    sortHand(cards);
    els.last.innerHTML = '<span class="last-label">' + t('lastBy', { name: nameOf(S.lastPlayer) }) +
      ' · ' + typeName(S.lastPlay.type) + '</span><div class="mini-cards">' +
      cards.map(miniHtml).join('') + '</div>';
  }

  function renderSeats() {
    els.meName.textContent = t('you');
    els.meRole.textContent = S.landlord < 0 ? '' : (S.landlord === 0 ? t('landlord') : t('farmer'));
    els.meCount.textContent = t('cardsLeft', { n: S.hands[0].length });
    els.meTurn.textContent = S.phase === 'play' && S.turn === 0 ? t('turnHint') : '';
    els.seat1Name.textContent = t('aiLeft');
    els.seat2Name.textContent = t('aiRight');
    els.seat1Role.textContent = S.landlord < 0 ? '' : (S.landlord === 1 ? t('landlord') : t('farmer'));
    els.seat2Role.textContent = S.landlord < 0 ? '' : (S.landlord === 2 ? t('landlord') : t('farmer'));
    els.seat1Count.textContent = t('cardsLeft', { n: S.hands[1].length });
    els.seat2Count.textContent = t('cardsLeft', { n: S.hands[2].length });
    els.seat1Act.textContent = S.act[1] || '';
    els.seat2Act.textContent = S.act[2] || '';
    els.seat1Act.className = 'bubble' + (S.act[1] ? ' on' : '');
    els.seat2Act.className = 'bubble' + (S.act[2] ? ' on' : '');
    els.seat1.className = 'seat' + (S.turn === 1 ? ' active' : '');
    els.seat2.className = 'seat seat-r' + (S.turn === 2 ? ' active' : '');
  }

  function renderControls() {
    var bidding = S.phase === 'bid' && S.turn === 0;
    els.bidPanel.hidden = !bidding;
    var over = S.phase === 'over';
    els.playPanel.hidden = bidding || over || S.phase === 'redeal';
    els.overPanel.hidden = !over;

    if (bidding) {
      document.getElementById('bid-label').textContent = t('bidTitle');
      for (var n = 1; n <= 3; n++) {
        var b = document.getElementById('bid-' + n);
        b.textContent = t('bidScore', { n: n });
        b.disabled = n <= S.bid;
      }
      els.bidPass.disabled = false;
      els.bidPass.textContent = t('bidPass');
    }

    if (!bidding && !over) {
      var myTurn = S.phase === 'play' && S.turn === 0;
      els.btnPlay.disabled = !myTurn;
      els.btnPass.disabled = !myTurn || !S.lastPlay;
      els.btnHint.disabled = !myTurn;
      els.btnPlay.textContent = t('play');
      els.btnPass.textContent = t('pass');
      els.btnHint.textContent = t('hint');
      document.getElementById('btn-new').textContent = t('newGame');
    }

    if (over) {
      els.result.innerHTML = '<strong>' + t(S.statusKey) + '</strong><br>' + t(S.resultKey || 'youLose');
      document.getElementById('btn-new-2').textContent = t('newGame');
    }
  }

  function renderStatus() {
    var key = S.statusKey;
    if (S.phase === 'over') key = S.statusKey;
    if (!key) key = S.phase === 'bid' ? 'yourBid' : 'freeLead';
    els.status.textContent = t(key, S.statusVars || null);
    var tail = S.log.slice(-2).reverse().join(' · ');
    els.log.textContent = tail;
  }

  function render() {
    renderSeats();
    renderBottom();
    renderLast();
    renderHand();
    renderControls();
    renderStatus();
  }

  /* ---------------- language and events ---------------- */

  function applyStatic() {
    var nodes = document.querySelectorAll('[data-i]');
    for (var i = 0; i < nodes.length; i++) {
      var key = nodes[i].getAttribute('data-i');
      if (I18N[S.lang][key] != null) nodes[i].textContent = I18N[S.lang][key];
    }
    document.title = t('pageTitle');
    document.documentElement.lang = S.lang === 'zh' ? 'zh-CN' : S.lang;
    var btns = document.querySelectorAll('.langs button');
    for (var j = 0; j < btns.length; j++) {
      btns[j].setAttribute('aria-pressed', btns[j].getAttribute('data-lang') === S.lang ? 'true' : 'false');
    }
  }

  function setLang(lang) {
    if (!I18N[lang]) return;
    S.lang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyStatic();
    render();
  }

  els.hand.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.card') : null;
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    if (S.selected[id]) delete S.selected[id];
    else S.selected[id] = 1;
    renderHand();
  });

  els.btnPlay.addEventListener('click', humanPlay);
  els.btnPass.addEventListener('click', humanPass);
  els.btnHint.addEventListener('click', humanHint);
  document.getElementById('btn-new').addEventListener('click', dealNew);
  document.getElementById('btn-new-2').addEventListener('click', dealNew);

  els.bidPanel.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-bid]') : null;
    if (!b || b.disabled) return;
    humanBid(parseInt(b.getAttribute('data-bid'), 10));
  });

  var langBtns = document.querySelectorAll('.langs button');
  for (var li = 0; li < langBtns.length; li++) {
    langBtns[li].addEventListener('click', function () {
      setLang(this.getAttribute('data-lang'));
    });
  }

  S.lang = pickLang();
  applyStatic();
  dealNew();
})();
</script>
</body>
</html>
