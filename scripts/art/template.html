<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>composed art</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: {{W}}px;
    height: {{H}}px;
    overflow: hidden;
    background: #101010;
  }
  .stage {
    position: relative;
    width: {{W}}px;
    height: {{H}}px;
    overflow: hidden;
    isolation: isolate;
  }

  /* ---- background presets ------------------------------------------- */
  .bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  /* single soft key light from the upper left, shared by every preset */
  .bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(126deg,
      rgba(255, 240, 214, 0.10) 0%,
      rgba(255, 240, 214, 0.035) 26%,
      rgba(255, 240, 214, 0) 54%);
  }
  /* dark vignette so the elements sit in a pool of light */
  .bg::after {
    content: "";
    position: absolute;
    inset: -15%;
    background: radial-gradient(ellipse 72% 68% at 50% 46%,
      rgba(0, 0, 0, 0) 42%,
      rgba(0, 0, 0, 0.62) 100%);
  }
  .bg--charcoal-warm {
    background:
      radial-gradient(115% 95% at 10% 0%,
        rgba(226, 164, 94, 0.34) 0%,
        rgba(226, 164, 94, 0.12) 26%,
        rgba(0, 0, 0, 0) 56%),
      radial-gradient(130% 120% at 50% 50%,
        #2e2924 0%, #201c18 55%, #100e0c 100%);
  }
  .bg--charcoal-cool {
    background:
      radial-gradient(115% 95% at 10% 0%,
        rgba(126, 168, 226, 0.26) 0%,
        rgba(126, 168, 226, 0.09) 28%,
        rgba(0, 0, 0, 0) 58%),
      radial-gradient(130% 120% at 50% 50%,
        #262a31 0%, #1a1d23 55%, #0d0f13 100%);
  }
  .bg--felt-green {
    background:
      repeating-linear-gradient(45deg,
        rgba(255, 255, 255, 0.014) 0 2px,
        rgba(255, 255, 255, 0) 2px 4px),
      radial-gradient(115% 95% at 10% 0%,
        rgba(226, 164, 94, 0.22) 0%,
        rgba(226, 164, 94, 0.08) 28%,
        rgba(0, 0, 0, 0) 58%),
      radial-gradient(130% 120% at 50% 50%,
        #1f4a36 0%, #123024 58%, #08140e 100%);
  }

  /* ---- elements ----------------------------------------------------- */
  .item {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 1;
  }
  .shadowwrap {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .shadowwrap img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-origin: 50% 50%;
  }
  /* soft contact shadow on the table, cast down-right with the key light */
  .contact {
    position: absolute;
    z-index: 0;
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
      rgba(0, 0, 0, 0.55) 0%,
      rgba(0, 0, 0, 0.30) 42%,
      rgba(0, 0, 0, 0) 74%);
    pointer-events: none;
  }

  /* ---- missing-element placeholder ---------------------------------- */
  .ph {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border: 2px dashed rgba(255, 255, 255, 0.55);
    border-radius: 10px;
    background:
      repeating-linear-gradient(45deg,
        rgba(255, 80, 150, 0.10) 0 10px,
        rgba(255, 80, 150, 0.04) 10px 20px);
    color: rgba(255, 255, 255, 0.82);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-weight: 600;
    line-height: 1.25;
    text-align: center;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="bg bg--{{BACKGROUND}}"></div>
  {{ITEMS}}
</div>
</body>
</html>
