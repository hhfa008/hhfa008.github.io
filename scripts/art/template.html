<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>composed art</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: {{W}}px;
    height: {{H}}px;
    overflow: hidden;
    background: #101010;
  }

  /* ---- camera -------------------------------------------------------- */
  .stage {
    position: relative;
    width: {{W}}px;
    height: {{H}}px;
    overflow: hidden;
    perspective: 1600px;
    perspective-origin: 50% 50%;
    isolation: isolate;
  }

  /* ---- background presets (screen space, behind the table) ----------- */
  .bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(126deg,
      rgba(255, 240, 214, 0.10) 0%,
      rgba(255, 240, 214, 0.035) 26%,
      rgba(255, 240, 214, 0) 54%);
  }
  .bg--charcoal-warm {
    background:
      radial-gradient(115% 95% at 10% 0%,
        rgba(226, 164, 94, 0.34) 0%,
        rgba(226, 164, 94, 0.12) 26%,
        rgba(0, 0, 0, 0) 56%),
      radial-gradient(130% 120% at 50% 50%,
        #2e2924 0%, #201c18 55%, #100e0c 100%);
  }
  .bg--charcoal-cool {
    background:
      radial-gradient(115% 95% at 10% 0%,
        rgba(126, 168, 226, 0.26) 0%,
        rgba(126, 168, 226, 0.09) 28%,
        rgba(0, 0, 0, 0) 58%),
      radial-gradient(130% 120% at 50% 50%,
        #262a31 0%, #1a1d23 55%, #0d0f13 100%);
  }
  .bg--felt-green {
    background:
      repeating-linear-gradient(45deg,
        rgba(255, 255, 255, 0.014) 0 2px,
        rgba(255, 255, 255, 0) 2px 4px),
      radial-gradient(115% 95% at 10% 0%,
        rgba(226, 164, 94, 0.22) 0%,
        rgba(226, 164, 94, 0.08) 28%,
        rgba(0, 0, 0, 0) 58%),
      radial-gradient(130% 120% at 50% 50%,
        #1f4a36 0%, #123024 58%, #08140e 100%);
  }

  /* ---- the table: one shared camera, tilted once --------------------- */
  .table {
    position: absolute;
    left: 50%;
    top: 50%;
    width: {{PW}}px;
    height: {{PH}}px;
    margin-left: -{{PWH}}px;
    margin-top: -{{PHH}}px;
    transform-style: preserve-3d;
    transform: rotateX(52deg) rotateZ(-14deg);
    z-index: 1;
  }
  /* projected pool of light on the table surface */
  .table-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 50% 42% at 38% 32%,
      rgba(255, 238, 210, 0.09) 0%,
      rgba(255, 238, 210, 0.03) 46%,
      rgba(255, 238, 210, 0) 72%);
    pointer-events: none;
  }
  /* faint woven dot grid: lets the shared table angle read in every scene */
  .table-grain {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255, 255, 255, 0.075) 1px, rgba(255, 255, 255, 0) 1.6px);
    background-size: 54px 54px;
    -webkit-mask-image: radial-gradient(ellipse 56% 50% at 50% 48%,
      #000 0%, rgba(0, 0, 0, 0.55) 45%, transparent 74%);
    mask-image: radial-gradient(ellipse 56% 50% at 50% 48%,
      #000 0%, rgba(0, 0, 0, 0.55) 45%, transparent 74%);
    pointer-events: none;
  }
  /* the weave is more obvious on green felt than on charcoal; even it out */
  .stage.bg--felt-green .table-grain { opacity: 0.62; }
  .stage.bg--charcoal-cool .table-grain { opacity: 0.9; }

  /* ---- board geometry, drawn in the table plane ---------------------- */
  .board {
    position: absolute;
    pointer-events: none;
  }
  .board svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 0 2px rgba(255, 240, 210, 0.16));
  }
  .board--cardtable {
    border: 1.5px solid rgba(245, 238, 220, 0.18);
    border-radius: 6%;
    box-shadow:
      inset 0 0 140px rgba(0, 0, 0, 0.40),
      0 0 2px rgba(255, 240, 210, 0.12);
  }
  .shadows,
  .flats {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }

  /* flat objects live on the table and deform with the camera */
  .flat {
    position: absolute;
    transform-origin: 50% 50%;
  }
  .flat img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* one shadow design for every object, always in the table plane */
  .shadow {
    position: absolute;
    border-radius: 50%;
    transform-origin: 50% 50%;
    background: radial-gradient(ellipse at center,
      rgba(0, 0, 0, 0.58) 0%,
      rgba(0, 0, 0, 0.32) 46%,
      rgba(0, 0, 0, 0) 76%);
    filter: blur(6px);
    pointer-events: none;
  }

  /* standing objects: screen-space billboards whose base sits on the table */
  .billboards {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .billboard {
    position: absolute;
    transform-origin: 50% 92%;
  }
  .billboard img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* cinematic vignette, above everything */
  .vignette {
    position: absolute;
    inset: -10%;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(ellipse 72% 68% at 50% 46%,
      rgba(0, 0, 0, 0) 40%,
      rgba(0, 0, 0, 0.58) 100%);
  }

  /* ---- missing-element placeholder ---------------------------------- */
  .ph {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border: 2px dashed rgba(255, 255, 255, 0.55);
    border-radius: 10px;
    background:
      repeating-linear-gradient(45deg,
        rgba(255, 80, 150, 0.10) 0 10px,
        rgba(255, 80, 150, 0.04) 10px 20px);
    color: rgba(255, 255, 255, 0.82);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-weight: 600;
    line-height: 1.25;
    text-align: center;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<div class="stage bg--{{BACKGROUND}}">
  <div class="bg bg--{{BACKGROUND}}"></div>
  <div class="table">
    <div class="table-glow"></div>
    <div class="table-grain"></div>
  {{BOARD}}
    <div class="shadows">
  {{SHADOWS}}
    </div>
    <div class="flats">
  {{FLATS}}
    </div>
  </div>
  <div class="billboards">
  {{BILLBOARDS}}
  </div>
  <div class="vignette"></div>
</div>
</body>
</html>
