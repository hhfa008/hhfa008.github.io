<style>
/* ==========================================================================
   Design tokens — keep in sync with the existing tools pages.
   ========================================================================== */
:root{
  --paper:#f2efe7; --paper-2:#fbf9f4; --panel:#ffffff;
  --ink:#14171a; --muted:#5b615c; --muted-2:#7b807a;
  --line:#d5d0c4; --line-strong:#bcb5a7;
  --accent:#b93d12; --accent-soft:#f2a07a; --accent-wash:#f7e5da;
  --ok:#2f6b3c; --ok-wash:#e8f2e7; --warn:#8a5a00; --warn-wash:#fbf1db;
  --bad:#a32216; --bad-wash:#fbe7e3;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --radius:16px; --max:1040px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#101316; --paper-2:#171b1f; --panel:#1a1f23;
    --ink:#f2efe7; --muted:#b7b3a8; --muted-2:#948f85;
    --line:#333a40; --line-strong:#4a535b;
    --accent:#f08a5d; --accent-soft:#f2a07a; --accent-wash:#2b211c;
    --ok:#8fd19e; --ok-wash:#1b2b1e; --warn:#f0c36a; --warn-wash:#2d2618;
    --bad:#ff8a7a; --bad-wash:#321d1a;
  }
}

/* Reset */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;color-scheme:light dark;scroll-behavior:smooth;overflow-x:clip}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.6 var(--sans);overflow-x:clip;
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
p,h1,h2,h3,ul,ol,figure{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
code,pre{font-family:var(--mono)}

/* Layout */
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding-left:18px;padding-right:18px;min-width:0}
@media (min-width:720px){.wrap{padding-left:32px;padding-right:32px}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:12px;top:-80px;z-index:100;padding:12px 16px;background:var(--ink);color:var(--paper);border-radius:8px;text-decoration:none}
.skip-link:focus{top:12px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* Header */
.site-header{border-bottom:1px solid var(--line);background:var(--paper)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;min-height:64px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;text-decoration:none;min-height:44px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);position:relative;flex:none}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;left:7px;height:2px;background:var(--paper-2);border-radius:1px}
.brand-mark::before{right:7px;top:9px}
.brand-mark::after{right:11px;top:15px}
.header-tools{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.site-nav{display:flex;align-items:center;gap:14px;font-size:13.5px;flex-wrap:wrap}
.site-nav a{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding-inline:8px;text-decoration:none;color:var(--muted)}
.site-nav a:hover{color:var(--accent);text-decoration:underline}
.lang-switch{display:flex;gap:4px}
.lang-switch button{
  min-width:44px;min-height:44px;padding:0 8px;border:1px solid var(--line-strong);
  border-radius:9px;background:transparent;color:var(--muted);font-size:12.5px;
  font-weight:650;cursor:pointer;line-height:1
}
.lang-switch button:hover{border-color:var(--accent);color:var(--accent)}
.lang-switch button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* Hero */
.hero{padding:36px 0 22px}
@media (min-width:720px){.hero{padding:52px 0 28px}}
.eyebrow{margin:0 0 10px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:0 0 12px;max-width:22ch;font-size:clamp(1.85rem,6vw,2.9rem);line-height:1.1;letter-spacing:-.035em;font-weight:700;overflow-wrap:anywhere}
.lede{max-width:70ch;color:var(--muted);font-size:clamp(1rem,2vw,1.08rem);overflow-wrap:anywhere}
.privacy{
  display:flex;gap:9px;align-items:flex-start;max-width:78ch;margin:16px 0 0;padding:11px 14px;
  background:var(--accent-wash);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:0 10px 10px 0;font-size:13.5px
}
.privacy svg{width:17px;height:17px;flex:none;margin-top:3px}

/* Cards and tool layout */
.tool-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.tool-layout>*{min-width:0}
@media (min-width:900px){
  .tool-layout{grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr)}
  .result-col{position:sticky;top:18px}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0}
@media (min-width:720px){.card{padding:26px 28px}}
.card-kicker{margin:0 0 7px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
.card h2{margin:0 0 14px;font-size:clamp(1.15rem,2.4vw,1.4rem);line-height:1.2;letter-spacing:-.02em;overflow-wrap:anywhere}
.panel-desc{margin:0 0 14px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}

/* Fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>span.label{font-size:13px;font-weight:650;color:var(--muted)}
.field input,.field select,.field textarea,.field .input{
  width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line-strong);
  border-radius:12px;background:var(--paper-2);font-size:16px;line-height:1.4;min-width:0
}
.field textarea{min-height:120px;resize:vertical;line-height:1.55}
.field select{
  appearance:none;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:3px solid var(--accent-wash);outline-offset:1px}
.field input[aria-invalid="true"],.field select[aria-invalid="true"],.field textarea[aria-invalid="true"]{border-color:var(--bad)}
.field-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:600px){.field-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 16px;border:1px solid var(--line-strong);border-radius:12px;
  background:var(--panel);color:var(--ink);font-size:14.5px;font-weight:650;
  cursor:pointer;text-decoration:none;text-align:center;line-height:1.25
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger:hover{filter:brightness(1.06);color:#fff}
@media (prefers-color-scheme:dark){
  .lang-switch button[aria-pressed="true"],
  .btn.primary,.btn.primary:hover,.btn.danger,.btn.danger:hover{color:#101316}
}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.btn-row .btn{flex:1 1 140px}

/* Chips / segmented controls */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.chips button,.chip{
  display:inline-flex;align-items:center;justify-content:center;min-height:44px;
  padding:8px 14px;border:1px solid var(--line-strong);border-radius:999px;
  background:var(--paper-2);color:var(--ink);font-size:13.5px;font-weight:650;
  cursor:pointer;line-height:1.2;text-decoration:none
}
.chips button:hover,.chip:hover{border-color:var(--accent);color:var(--accent)}
.chips button[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){
  .chips button[aria-pressed="true"],.chip.on{color:#101316}
}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.tabs [role="tab"]{
  min-height:44px;padding:9px 14px;border:1px solid var(--line-strong);border-radius:999px;
  background:var(--paper-2);color:var(--ink);font-size:13.5px;font-weight:650;
  cursor:pointer;line-height:1.2
}
.tabs [role="tab"][aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.tabs [role="tab"][aria-selected="true"]{color:#101316}}

/* Result */
.result{background:var(--paper-2)}
.result-live{min-height:96px}
.result-big{
  margin:2px 0 0;font-family:var(--mono);font-size:clamp(2rem,7.5vw,3rem);
  font-weight:650;line-height:1.08;letter-spacing:-.04em;color:var(--accent);
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere
}
.result-note{margin-top:7px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:14px}
.stat{min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--paper-2)}
.stat span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.stat b{display:block;margin-top:2px;font-family:var(--mono);font-size:1.12rem;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}

/* Tables must scroll inside their own wrapper, never the page. */
.table-wrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.table-wrap table{width:100%;border-collapse:collapse;font-size:13.5px}
.table-wrap caption{padding:10px 12px;text-align:left;color:var(--muted);font-size:12.5px}
.table-wrap th,.table-wrap td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.table-wrap th{font-weight:650;color:var(--muted);font-size:12.5px}
.table-wrap tr:last-child td{border-bottom:0}

/* Notes and status */
.hint{margin:10px 0 0;color:var(--muted-2);font-size:12.5px;line-height:1.55;overflow-wrap:anywhere}
.error{margin:10px 0 0;padding:9px 12px;border-radius:9px;background:var(--bad-wash);border:1px solid var(--bad);color:var(--bad);font-size:13px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--accent-wash);color:var(--accent);font-size:12px;font-weight:650;line-height:1.6;vertical-align:middle}
.badge.ok{background:var(--ok-wash);color:var(--ok)}
.badge.warn{background:var(--warn-wash);color:var(--warn)}
.badge.bad{background:var(--bad-wash);color:var(--bad)}

/* Checkbox rows: browser-check measures the input box itself, so keep it 44x44. */
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;cursor:pointer}
.check input[type="checkbox"],.check input[type="radio"]{width:44px;height:44px;flex:none;accent-color:var(--accent);cursor:pointer}
.check-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:10px}
/* Safety net for builders: any main control must stay touchable. */
main button{min-height:44px}
main select{min-height:44px}
main input[type="checkbox"],main input[type="radio"]{width:44px;height:44px;flex:none;accent-color:var(--accent)}

/* Explain */
.explain{margin-top:18px}
.explain h2{margin:0 0 12px;font-size:clamp(1.3rem,3vw,1.7rem);letter-spacing:-.02em}
.explain-body{padding-bottom:2px}
.explain-body p{max-width:82ch;color:var(--muted);font-size:14px;margin-bottom:10px;overflow-wrap:anywhere}
.explain-body p:last-child{margin-bottom:0}
.explain-body strong{color:var(--ink)}
.formula-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:14px 0 18px}
@media (min-width:760px){.formula-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.formula{min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper-2)}
.formula h3,.formula-title{margin:0 0 7px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.formula code{display:inline-block;max-width:100%;padding:2px 6px;border-radius:5px;background:var(--accent-wash);font-family:var(--mono);font-size:12.5px;line-height:1.6;overflow-wrap:anywhere}
.assumptions{margin:0;padding-left:20px;color:var(--muted);font-size:13.5px}
.assumptions li{margin:0 0 8px;overflow-wrap:anywhere}

/* FAQ */
.faq{margin-top:18px}
.faq h2{margin:0 0 12px;font-size:clamp(1.3rem,3vw,1.7rem);letter-spacing:-.02em}
.faq details{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0 20px}
.faq details+details{margin-top:10px}
.faq summary{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:44px;padding:16px 0;cursor:pointer;font-weight:650;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;font-family:var(--mono);font-size:19px;line-height:1;color:var(--accent)}
.faq details[open] summary::after{content:"\2212"}
.faq details p{margin:0;padding:0 0 18px;color:var(--muted);font-size:14px;max-width:80ch;overflow-wrap:anywhere}

/* Footer */
.site-footer{margin-top:28px;padding:22px 0 34px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.footer-inner{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 18px}
.footer-links{display:flex;flex-wrap:wrap;gap:4px 14px}
.site-footer a{color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.site-footer a:hover{text-decoration:underline}
.footer-note{margin:8px 0 0;max-width:82ch;color:var(--muted-2);overflow-wrap:anywhere}
.noscript{margin-top:18px}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translate(-50%,12px);z-index:20;max-width:calc(100vw - 32px);
  padding:12px 18px;border-radius:12px;background:var(--ink);color:var(--paper);
  font-size:14px;font-weight:600;text-align:center;box-shadow:0 8px 24px rgb(0 0 0 / .22);
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;overflow-wrap:anywhere
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Motion and print */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .btn:active{transform:none}
}
@media print{
  .site-header,.site-footer,.skip-link,.lang-switch,.tabs,.chips,.btn-row,.toast,.no-print{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card,.table-wrap{border-color:#999;background:#fff;break-inside:avoid}
  .result-col{position:static}
  .result-big{color:#000}
  .explain,.faq{display:block}
  details{break-inside:avoid}
  .faq details p{display:block!important}
}

/* site-mobile-hit-targets: clickable box >=44x44, type/layout unchanged */
.site-footer a, .footer-links a { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; }
</style>
</head>

    return typeof n === 'number' && isFinite(n);

    return { ok: false, error: code };
  }

  function double(n) {
    if (!isNum(n)) return fail('bad_value');
    var out = n * 2;
    if (!isFinite(out) || Math.abs(out) > LIMIT) return fail('overflow');
    return { ok: true, value: out };

    }

    toastTimer = setTimeout(function () { el.classList.remove('on'); }, 2600);
  }

  function legacyCopy(text) {
    try {

      ta.value = text;

      document.body.appendChild(ta);

    } catch (e) {

    var context = $('#demo-context');
    var errorBox = $('#demo-error');
    var copyButton = $('#demo-copy');
    if (!input || !output) return;

    var lastValue = '';

    function clearView() {
      output.textContent = '—';
      if (context) context.textContent = '';
      lastValue = '';
      if (copyButton) copyButton.disabled = true;
      ToolUI.clearError(errorBox);
      input.removeAttribute('aria-invalid');
    }

    function renderDemo() {
      var raw = String(input.value == null ? '' : input.value)
        .trim().replace(/\s/g, '').replace(',', '.');
      if (!raw) { clearView(); return; }
      if (!/^[+-]?(\d+(\.\d*)?|\.\d+)(e[+-]?\d+)?$/i.test(raw)) {
        clearView();
        input.setAttribute('aria-invalid', 'true');
        ToolUI.setError(errorBox, ToolUI.T('errorInvalid'));
        return;
      }
      var n = Number(raw);
      var result = ToolEngine.double(n);
      if (!result || !result.ok) {
        clearView();
        input.setAttribute('aria-invalid', 'true');
        ToolUI.setError(errorBox, result && result.error === 'overflow'
          ? ToolUI.T('errorGeneric') : ToolUI.T('errorInvalid'));
        return;
      }
      input.removeAttribute('aria-invalid');
      ToolUI.clearError(errorBox);
      var shown = ToolUI.fmt(result.value, { maximumFractionDigits: 6 });
      output.textContent = shown;
      if (context) {
        context.textContent = ToolUI.T('demoContext', {
          n: ToolUI.fmt(n, { maximumFractionDigits: 6 }),
          result: shown
        });
      }
      lastValue = String(result.value);
      if (copyButton) copyButton.disabled = false;
    }

    ToolUI.on(input, 'input', ToolUI.debounce(renderDemo, 120));
    ToolUI.on('#demo-calc', 'click', renderDemo);
    ToolUI.on('#demo-reset', 'click', function () {
      input.value = '21';
      renderDemo();
      input.focus();
    });
    ToolUI.on('#demo-copy', 'click', function () {
      if (lastValue) ToolUI.copy(lastValue);
    });
    ToolUI.onLangChange(renderDemo);
  })();
  // TOOL_UI_END

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
