name: games-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node games/tests/run-all.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run all game tests
        run: node games/tests/run-all.js
